# images.yaml — the image SET of this repository, as DATA.
#
# ============================================================================
# WHAT THIS FILE GOVERNS
# ============================================================================
#
# The identity of the set: which images exist, which one each of them builds
# FROM, which paths are its build inputs, and which functional check groups its
# smoke run exercises. Everything mechanical is DERIVED from here and from
# nowhere else:
#
#   BUILD_ORDER            ./ctl.sh and .ci/ctl.sh — the document order below
#   image_parent()         .ci/affected.sh — the `parent` field
#   the input path table   .ci/affected.sh — the `paths` field
#   the check groups       .ci/smoke.sh — the `groups` field
#   the publish jobs       .ci/providers/github/build-and-push.yml, through
#                          _ctl/generate.sh, and hand-copied to
#                          .github/workflows/ from there
#   the nightly matrix     the `image:` line of .ci/providers/github/
#                          security-nightly.yml, through the same generator
#
# The graph used to be declared in 6 files that a test held to each other. It is
# declared here, once. Adding an image is an entry below plus its Dockerfile,
# its directory and the policy-test literals named under the next heading.
#
# ============================================================================
# WHAT THIS FILE DELIBERATELY DOES NOT GOVERN
# ============================================================================
#
# **The literals in the policy tests.** `SANCTIONED` in platform-policy.test.sh,
# `EXPECTED_PROVIDER_FILES` beside its glob, the governed-file lists in
# dockerfile-args.test.sh and download-coverage.test.sh: all of them stay
# hand-kept. A test that reads the value it checks agrees with any value, a
# wrong one included, so generating a test from this file would delete the check
# rather than maintain it. The rule those tests keep is set EQUALITY with this
# file — a literal list that no longer matches the manifest is a red test, and
# that is the check that replaces the hand-copying.
#
# **The pin homes and the pin class tables.** versions.env is the pin home and
# .ci/smoke.sh holds the classification. This file says which image exists, not
# what version it installs.
#
# **The per-image Dockerfile, project.json and devcontainer.json.** They stay
# hand-written for now. Generating them is the next slice, not this one.
#
# ============================================================================
# DOCUMENT ORDER IS BUILD ORDER
# ============================================================================
#
# BUILD_ORDER is the order the `images:` keys appear below, so a parent MUST be
# written above its children. The reader FAILS naming both images when it is
# not, rather than emitting an order that would build a child against a parent
# this run has not made yet. A separate `build_order:` list would be the second
# declaration of the set that this file exists to remove.
#
# ============================================================================
# THE FIELDS
# ============================================================================
#
#   parent      the image this one builds FROM, or "" for an image that builds
#               FROM ubuntu. A child's input set CONTAINS its parent's, which is
#               what makes "the parent built, so the child builds" true by
#               construction.
#   context     the docker build context of the publish job. `.` is the
#               repository root, and an image takes it when its Dockerfile COPYs
#               something from beside its own directory.
#   dockerfile  the --file of the publish job.
#   smoke_ref   the tag the publish job LOADS into the local image store and the
#               smoke run then asserts. It carries no registry on purpose:
#               nothing can pull it, so a load that did not happen fails the
#               smoke step instead of asserting against the last published
#               image.
#   paths       the build inputs of the image ITSELF, without its parent's. A
#               trailing `/` is a prefix; anything else is an exact path.
#   groups      the functional groups .ci/image-checks.sh runs for this image,
#               beyond the version comparison. An image with an empty list is
#               refused: a smoke that compares versions and exercises nothing is
#               not a smoke.
#
# The 3 keys below are OPTIONAL, and for each one ABSENT IS A DECISION rather
# than a hole. They are written here in the order the flat record carries them —
# platforms, pins, size_budget_gb — because _ctl/lib.sh reads them by POSITION
# and the 2 branches that added them each took field 8 while it was alone.
#
#   platforms   OPTIONAL. The platforms THIS image publishes. Absent means
#               SANCTIONED_PLATFORMS, which is what 5 of the 6 take — so the key
#               appears only where an image is measurably NARROWER, and reading
#               the manifest tells you which one that is. It may never be WIDER:
#               image_platforms refuses an entry outside the sanctioned set,
#               naming the image and the platform, because the sanctioned set is
#               the policy and this field is an exception WITHIN it.
#   pins        OPTIONAL. The pin home whose every row this image's build feeds
#               in as a generated --build-arg. ABSENT KEEPS THE RULE THAT WAS
#               ALREADY HERE: an image with no parent reads versions.env and a
#               child reads nothing but its BASE_TAG. The key exists for the
#               third shape — a CHILD whose ARGs are value-less because its pins
#               live in the one home. Without it that image would have to spell
#               its own pins, which is a 4th PIN_VALUE_HOME for the sake of a
#               `parent:` field.
#   size_budget_gb
#               OPTIONAL. The acceptance size budget of the image, decimal GB,
#               the unit every census figure in this repository uses. .ci/
#               smoke.sh reads it and gates the LOADED image on it before the
#               push, so an oversize image never reaches a consumer. Absent means
#               NO size gate, which is what 3 of the 6 images take — the budget
#               is an acceptance metric somebody set, not a number every image
#               owes. A budget that is present and unreadable is a FAILURE and
#               never a skip. The comment beside each key carries the
#               measurement that set it; a budget does not move quietly.
#   notes       the prose of THIS image's publish job, keyed by where it goes.
#               _ctl/generate.sh wraps each line in `# ` at the right indent. An
#               absent key emits no comment. Everything a job says that is TRUE
#               OF EVERY JOB is in the generator's template instead, which is
#               what stops the 6 jobs from drifting apart again.

images:
  base:
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    # versions.env is an input of base as well as of cloud, and both of them
    # READ it at build time: every pin of either image arrives as a --build-arg
    # generated from that file. This row used to admit an over-build — base took
    # the input while only cloud consumed it — and the collapse to 1 pin home is
    # what made the mapping true rather than merely safe.
    #
    # .dockerignore governs what the root context SHIPS, so it is an input of
    # every root-context image — proven the day it landed, when its own merge
    # skipped every build and the images missed 2 commits' layers until a
    # dispatch rebuilt them (2026-08-18).
    paths:
      - base/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-base
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      outputs: |
        Whether this job really built. The child jobs read it: when base did not
        build, no base:<sha> exists for this commit and a child that FROMs that
        tag fails on a tag that was never pushed.
      filter: |
        This step is NOT gated, and neither are the 2 above it: their outputs
        are what every gate below reads, and what the child jobs read.
      buildx: |
        Replaces docker/setup-buildx-action. It makes a `remote` builder whose
        first node is a buildkitd container it starts in the pod's own network
        namespace — the default docker driver can neither read nor write a
        registry cache — and it owns the arm64 switch that reads
        SANCTIONED_PLATFORMS. That switch is LIVE: the list names linux/arm64,
        so every build appends the Mac mini as a second node. One driver for
        both, because buildx refuses a builder whose nodes disagree.
        It runs after the registry login: the builder boots by pulling the
        private BuildKit mirror, and an anonymous pull of it is refused.
      smoke: |
        The Dockerfile deliberately runs no --version checks: they could not
        run while this image was cross-built under QEMU. This is where every
        pin of versions.env is compared against what the image installed, and
        where the gate toolchain is exercised on a real fixture.

  mobile:
    parent: base
    context: mobile
    dockerfile: mobile/Dockerfile
    smoke_ref: mobile:smoke
    # The 1 image of the set that is NARROWER than SANCTIONED_PLATFORMS, and the
    # reason is upstream and not ours: Flutter publishes no linux-arm64 SDK. Read
    # on 2026-08-17,
    # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
    # (264191 bytes) lists EVERY Linux release ever published — 730 of them — and
    # `[.releases[].dart_sdk_arch] | unique` returns [null,"x64"]. Quote it that
    # way: 431 of the 730 predate the key and carry none, 299 say x64, and the
    # count that decides this is `[.releases[] | select(.dart_sdk_arch != null
    # and .dart_sdk_arch != "x64")] | length` = 0. The pinned 3.47.0 stable
    # carries 1 archive, stable/linux/flutter_linux_3.47.0-stable.tar.xz, and its
    # dart_sdk_arch is x64 — the filename carries no architecture, so an HTTP
    # probe of it succeeds and proves nothing.
    #
    # This is a BLOCKER and not a stale pin: no bump reaches an asset upstream
    # does not publish. Whether Android platform-tools ships a linux-arm64 build
    # is moot while this row stands — that question only opens on the day
    # Flutter itself does.
    #
    # Delete this key on that day. mobile/Dockerfile keeps amd64-only case
    # arms, and they are CORRECT rather than incomplete for as long as it is
    # here.
    #
    # The IMAGE is `mobile` and the SDK is Flutter. This narrowing is a fact
    # about the SDK, so it survived the rename unchanged — the key is the same
    # key, on a row with a new name.
    platforms:
      - linux/amd64
    paths:
      - mobile/
    # content-flutter keeps its name, on the rule embedded's entry states below:
    # a group names the CONTENT it exercises, and this group runs
    # `flutter --version` against the Flutter SDK. The SDK is named flutter and
    # did not move; only the IMAGE identity became mobile.
    groups:
      - content-base
      - content-flutter
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      base_tag: |
        The parent this layer FROMs. base publishes a :<sha> tag only on a
        commit that changed it, so when base did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        mobile's input set contains base's, so base building implies this job
        building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        mobile inherits every tool of base, so the pins of versions.env are
        compared here too, and the Flutter SDK is checked on top of them.

  embedded:
    parent: base
    context: embedded
    dockerfile: embedded/Dockerfile
    smoke_ref: embedded:smoke
    paths:
      - embedded/
    # content-zephyr and content-devbox are BOTH here, and neither name moved.
    # A group names the CONTENT it exercises — west, and the flash/debug stack
    # — and that content is what it always was; it is the 2 IMAGES that became
    # 1. Renaming the groups would have made this fold reach into
    # .ci/image-checks.sh for nothing.
    groups:
      - content-base
      - content-zephyr
      - content-devbox
      - go-gate
      - dockerfile-lint
      - compose
    # NO size_budget_gb, and the absence is a DECISION rather than a hole.
    # Measured on 2026-08-18 through the ghcr.io registry API, amd64, summing
    # the per-layer gzip ISIZE trailers: zephyr:latest 6,741,148,672 bytes and
    # zephyr-devbox:latest 8,244,974,080, so the devbox delta is 1.504 GB and
    # this image's unpacked basis is ~9.23 GB.
    #
    # That number was NOT written as a budget while the gate could not fail on
    # one (#119). THE UNIT IS FIXED NOW — .ci/smoke.sh sums `docker history`
    # rather than reading `docker image inspect --format '{{.Size}}'` — so the
    # only thing between this image and an acceptance metric is the DECISION to
    # set one, which is Mateo's and not a side effect of the unit fix. A budget
    # is a number somebody chose to be held to, and the ISIZE sum above is an
    # estimate rather than a measurement on the basis the gate now reads.
    notes:
      base_tag: |
        The parent this layer FROMs. base publishes a :<sha> tag only on a
        commit that changed it, so when base did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        embedded's input set contains base's, so base building implies this job
        building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        embedded inherits every tool of base, so the pins of versions.env are
        compared here too. Its own home adds 7 rows on top of them, of which 4
        are `asserted` — WEST_VERSION, ZEPHYR_SDK_VERSION, ESPTOOL_VERSION and
        CODE_SERVER_VERSION; BASE_TAG and the 2 toolchain LISTS name no version
        to compare. That is the check the 2-image split cost: west and the
        Zephyr SDK lived in the parent's file, so the devbox run asserted 2 of
        the 4 its image carried (the inherited-pin half of ledger #102).

        The image ships USER root for sshd, and the run forces the dev user so
        the base checks run in the identity every other image uses. The
        flash/debug stack, the SDK toolchains and `sshd -t` are checked on top.
        The argv this step sends BYPASSES the entrypoint's mode dispatch, so
        nothing here exercises it — _ctl/tests/embedded-entrypoint.test.sh is
        that coverage, on the host.

  cloud:
    parent: ""
    context: "."
    dockerfile: cloud/Dockerfile
    smoke_ref: cloud:smoke
    paths:
      - cloud/
      - _delta/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-cloud
      - content-runner
      - go-gate
      - dockerfile-lint
      - compose
      - debugger
      - protocols
    # Acceptance metric 2 of the image program (risk R4), and it did not move
    # quietly. The first build measured 6,303,346,803 bytes against an original
    # 5.5 GB budget; the R4 levers were applied and measured one by one —
    # in-layer npm/nvm cache hygiene -676.2 MB, the --no-install-recommends
    # audit -0 (every install already carried the flag), stripping the 7 Go gate
    # binaries -35.9 MB — and the measured floor with every tool kept came out
    # at ~5.63-5.67 GB. Per R4 the decision then went to a human: Mateo decided
    # on 2026-08-16 to keep every tool and set the budget here. Above THIS
    # budget the remaining levers are splitting build-essential out or dropping
    # a tool, and either goes back to Mateo.
    #
    # THE BASIS IS UNPACKED BYTES — the sum of `docker history --human=false`,
    # which is what .ci/smoke.sh compares. Every figure in the paragraph above
    # is on that basis: the 6,303,346,803-byte refusal of the first build (run
    # 31977905169) and the 5,626,948,253 bytes run 32020729843 read after the
    # levers, which is 2.1% under this budget.
    #
    # It has NOT always been what the gate read, and that is why the basis is
    # written here rather than assumed (#119). The gate read
    # `docker image inspect --format '{{.Size}}'`, and on a containerd-store
    # daemon that template answers the COMPRESSED content size: the same image
    # measured 5,627,002,516 bytes in run 32039450157 and 2,059,410,281 in run
    # 32055368934 the same afternoon, with no commit here in between. A budget
    # compared against a number 3.5x under it cannot fail, so this metric was
    # believed and empty for 2 days. Compare a log line to this number only
    # after checking that the line says `unpacked bytes`.
    #
    # MEASURED AGAIN ON THE REPAIRED GATE: 5,273,882,624 unpacked bytes,
    # rehearsal run 32202500436 (job 95919051177, 2026-08-19T01:00Z) — 8.3%
    # under this budget, and 353 MB below the 5,626,948,253 of 2026-08-17,
    # because the image went on shrinking through the days no reader could see
    # it. THE MEASUREMENT DOES NOT MOVE THE BUDGET. 5.75 is a decision a human
    # made with the R4 levers in front of him; it is not a provisional row that
    # the next number resets, which is what the 2 children below are.
    size_budget_gb: 5.75
    notes:
      job: |
        The cloud image: the reduced base + the CI fold (image-architecture, ledger
        #94). ADDITIVE and independent — FROM ubuntu directly, no needs. Its gate
        order is the one the publish-order test demands: build to the local store,
        smoke the loaded image (content checks + the 5.75 GB size gate), and only
        then push. The build context is the REPOSITORY ROOT because versions.env
        and _delta/ sit beside the image directories, and every version pin arrives
        as a build-arg generated from versions.env — the one home for every pin.

        It is also the image every ARC pool runs, this workflow's own runner
        included, so a bad cloud build is felt by the next job of every repository.
      smoke: |
        Content checks for every kept tool group, the CI fold, the harness
        bake, the absent-Go-cache assertion, and the size gate at the budget
        this image declares. It runs the LOADED image, which is the exact
        build the publish step below then copies to ghcr.io.

  hardware:
    parent: cloud
    context: hardware
    dockerfile: hardware/Dockerfile
    smoke_ref: hardware:smoke
    # The 1 CHILD that reads the pin home. Its ARGs are value-less like cloud's,
    # so its 5 pins live in versions.env and NOT in its own Dockerfile — which
    # is why this key exists at all. Read the `pins` field note above for what
    # an absent key means.
    pins: versions.env
    # versions.env is an input of this image ITSELF and not only of its parent:
    # every pin above arrives as a --build-arg generated from that file, so a
    # row moving there changes this build. cloud declares it too and
    # image_input_paths de-duplicates; declaring it here is what keeps the
    # mapping TRUE rather than merely covered by an ancestor.
    paths:
      - hardware/
      - versions.env
    groups:
      - content-cloud
      - content-hardware
      - go-gate
      - dockerfile-lint
      - compose
    # THIS ROW IS NO LONGER PROVISIONAL — read to the end before using any
    # number in it. What follows is the ESTIMATE that stood here until
    # 2026-08-19, computed from 2 MEASURED images rather than chosen, and it is
    # kept because it is what the real measurement below is judged against.
    # Method, read on 2026-08-18 through the ghcr.io registry API:
    #
    #   cloud:latest (amd64) — the per-layer gzip ISIZE trailers of its 38
    #   layers sum to 5,063,474,688 bytes. Its budget is 5.75 GB against a
    #   measured UNPACKED floor of ~5.63-5.67 GB, so docker's on-disk
    #   accounting runs ~1.12x the tar-stream sum for this image family
    #   — small files round up to a filesystem block and this image has many.
    #
    #   research-hardware-ci:latest — the image this one replaces. Read the same
    #   way, its KiCad apt layer is 4,664,510,464 bytes and its python stack
    #   layer is 42,704,896 bytes: 4.71 GB, which is exactly the delta this
    #   image adds to cloud. The KiCad layer was measured by streaming the blob
    #   through gunzip, because at 4.66 GB its ISIZE trailer has wrapped past
    #   2^32 and reading it alone would have understated the layer by 4.29 GB.
    #
    #   5.75 + 4.71 x 1.12 = 11.0
    #
    # It was an ESTIMATE of a number nothing had built yet, at 11.0, and the row
    # said the first green build resets it to that measurement + 5% in the same
    # pull request. THIS IS THAT PULL REQUEST, and the estimate was 9.8% high.
    #
    # THE BASIS IS UNPACKED BYTES — the sum of `docker history --human=false`,
    # which is what .ci/smoke.sh compares. That is the basis the derivation
    # above was done on, and it was NOT the basis the gate read while this row
    # was written: the reader was `docker image inspect --format '{{.Size}}'`,
    # which a containerd-store daemon answers with COMPRESSED bytes, so this
    # image measured 2,608,220,360 against 11,000,000,000 in run 32193984249 and
    # the budget could not have failed whatever the image held (#119). The first
    # measurement on the repaired gate is therefore also the first measurement
    # this row could ever have been reset from.
    #
    #   10,013,827,072 unpacked bytes, rehearsal run 32202500436
    #   (job 95924341075, 2026-08-19T02:32Z) x 1.05 = 10,514,518,426
    #
    # so the row is 10.52 and the slack over measured+5% is 5,481,574 bytes.
    # This TIGHTENS the budget by 0.48 GB; it does not widen one. A red here
    # still means "re-measure" first — the KiCad PPA is an upstream that moves,
    # and this image is 61% apt data by volume.
    size_budget_gb: 10.52
    notes:
      job: |
        The hardware image: cloud + the KiCad 10 ECAD toolchain. Its consumer is
        gophersys/research-hardware, whose ci/Dockerfile carries the same PPA and
        the same 4 packages today — folding it in here gives it one pin home, one
        smoke gate and one nightly scan instead of three of its own.
      base_tag: |
        The parent this layer FROMs. cloud publishes a :<sha> tag only on a
        commit that changed it, so when cloud did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        This image's input set contains cloud's, so cloud building implies this
        job building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        hardware inherits every tool of cloud, so the pins of versions.env are
        compared here too, and kicad-cli plus the 3 library floors are checked on
        top of them. The floors are the point: an image with kicad-cli and no
        footprints passes a naive presence check and then fails the consumer's
        whole resolver suite at runtime.

  ui:
    parent: cloud
    context: ui
    dockerfile: ui/Dockerfile
    smoke_ref: ui:smoke
    # The 2nd CHILD that reads the pin home, for the reason hardware's entry
    # gives: its ARGs are value-less like cloud's, so no 4th PIN_VALUE_HOME is
    # minted for the sake of a `parent:` field.
    pins: versions.env
    # versions.env is an input of this image ITSELF and not only of its parent:
    # NODE_VERSION is IN the path its toolchain-exposure layer links from, and
    # CHROME_MAJOR_VERSION is what its amd64 smoke asserts the browser against.
    paths:
      - ui/
      - versions.env
    groups:
      - content-cloud
      - content-ui
      - go-gate
      - dockerfile-lint
      - compose
    # NO `platforms` KEY, AND THAT IS A MEASUREMENT AND NOT AN OVERSIGHT. This
    # entry was planned as the 2nd narrower image, on the premise that
    # `google-chrome-stable` is published for amd64 alone — the premise
    # research-ui states in ci/Dockerfile, in ADR-0003 (risk R3) and in
    # docs/image-notes.md section 3. The premise is FALSE as of 2026-08-18, so
    # writing the key would have narrowed this image on a reason that is not
    # true. Read from Google's own repo metadata on that day:
    #
    #   https://dl.google.com/linux/chrome/deb/dists/stable/Release
    #   (1666 bytes, Date: Sat, 15 Aug 2026 09:04:10 UTC) declares
    #   `Architectures: amd64 arm64` and lists a Packages index for each.
    #
    #   Both indexes carry google-chrome-stable at the SAME version,
    #   151.0.7922.137-1, and both .debs answer 200 with the Content-Length the
    #   index states: .../google-chrome-stable_151.0.7922.137-1_amd64.deb is
    #   140,080,344 bytes and the _arm64.deb is 132,287,036.
    #
    # So the sanctioned set is the correct set here, and it is taken by ABSENCE
    # the way 4 of the other images take it. 2 consequences a reader should
    # know: the arm64 half of this image has never been BUILT — rehearsal mode
    # on build-and-push.yml is what exercises it before a publish — and the
    # version-skew question research-ui records as Q2 does not arise, because
    # one package version serves both architectures. Narrowing this image later
    # is a human decision with a measurement beside it, exactly like mobile's.

    # THE SIZE BUDGET BELOW IS NO LONGER PROVISIONAL — read to the end before
    # using any number in it. What follows is the ESTIMATE that stood here until
    # 2026-08-19, computed from MEASURED images rather than chosen — hardware's
    # method, read on 2026-08-18 through the ghcr.io registry API:
    #
    #   cloud:latest (amd64) — the per-layer gzip ISIZE trailers of its 38
    #   layers sum to 5,063,539,712 bytes. Against its declared 5.75 GB budget
    #   and its measured UNPACKED floor of ~5.63-5.67 GB, docker's on-disk
    #   accounting runs ~1.12x the tar-stream sum for this image family.
    #
    #   research-ui-ci:latest — the image this one replaces. Its chrome+fonts
    #   layer is 463,258,112 uncompressed bytes = 0.463 GB.
    #
    # THAT LAYER IS NOT THE WHOLE DELTA, and an earlier version of this note said
    # it was. research-ui-ci builds FROM `base`, which installs the GTK/webkit
    # stack; `cloud` installs NONE of it. Checked both ways: a scan of all 38
    # cloud layers finds zero hits for libgtk-3, libnss3, libcups, libasound,
    # libatk, libgbm, libvulkan, libatspi, libpango and libcairo against positive
    # controls, and cloud/Dockerfile plus all 12 _delta/components/*.sh name none
    # of them while base/Dockerfile names libgtk-3-dev and libwebkit2gtk twice.
    # So on THIS parent the chrome install also drags its whole dependency
    # closure in, and ubuntu noble's Installed-Size for that closure is ~0.045 GB
    # — bytes the 0.463 GB figure never contained.
    #
    #   5.75 + (0.463 + 0.045) x 1.12 = 6.32
    #
    # The 2 layers beside chrome in research-ui-ci (Node 22 at 201,604,608 bytes,
    # uv at 59,372,544) are still NOT re-installed here: ui exposes cloud's own
    # Node and uv at /usr/local/bin instead of carrying a second copy of each.
    #
    # THE REHEARSAL AGREES, AND ITS OWN NUMBER IS IN A DIFFERENT UNIT. Run
    # 32151769443 (job 95767727252, 2026-08-18T15:49:14Z) is the first build of
    # this image, and its size gate read 1,934,245,460 bytes against cloud's
    # 1,647,731,708 in the same run — a delta of 286,513,752. That is a
    # COMPRESSED reading: cloud's registry blobs plus its config sum to
    # 1,647,719,707 bytes, which is the gate's figure to within 12,001 bytes of
    # 2 builds' metadata, and it is ~3.4x under the UNPACKED basis every
    # budget in this file was set from. So it cannot be used as
    # "measured size + 5%" — that would put this image's budget in a unit its
    # siblings do not share. Converted at the chrome layer's own measured
    # compression ratio (463,258,112 / 207,293,833 = 2.235), the delta is
    # ~0.640 GB and the same arithmetic gives 5.75 + 0.640 x 1.12 = 6.47.
    #
    # 2 independent derivations, 6.32 and 6.47, so the budget was 6.5 and the
    # slack over the larger one was 0.03 GB. It was still an ESTIMATE, and the
    # row said the first build measured on the SAME basis as cloud's and
    # hardware's budgets resets it to that measurement + 5% in the same pull
    # request. THIS IS THAT PULL REQUEST.
    #
    # THE BASIS IS UNPACKED BYTES — the sum of `docker history --human=false`,
    # which is what .ci/smoke.sh compares. The paragraph above is where the
    # unit defect was FOUND, and it is fixed rather than only reported now
    # (#119): the reader was `docker image inspect --format '{{.Size}}'`, which
    # a containerd-store daemon answers with the compressed content size, so
    # this budget and cloud's and hardware's were each being compared against a
    # number 3.4x to 4.2x under them and none of the 3 could fail. So the number
    # below is the FIRST reading of this image anybody has ever taken in the
    # unit its budget is written in:
    #
    #   6,027,251,712 unpacked bytes, rehearsal run 32202500436
    #   (job 95924341021, 2026-08-19T02:14Z) x 1.05 = 6,328,614,298
    #
    # so the row is 6.33 and the slack over measured+5% is 1,385,702 bytes.
    #
    # THE A-PRIORI DERIVATION WAS THE GOOD ONE, and that is worth keeping. 6.32
    # from the dependency-closure reasoning lands 0.005 GB from the truth; 6.47
    # from converting the rehearsal's compressed delta at the chrome layer's own
    # ratio is 7.3% high, because a per-layer ratio does not describe a whole
    # image. Real delta over cloud: 6,027,251,712 - 5,273,882,624 = 0.753 GB
    # against the 0.640 GB the ratio predicted.
    size_budget_gb: 6.33
    notes:
      job: |
        The ui image: cloud + headless Chrome and the DejaVu fallback font. Its
        consumer is gophersys/research-ui, which today builds its own
        research-ui-ci image and builds its devcontainer FROM that — ADR-0003
        retires both in favour of this one, so dev and CI pin one digest and the
        toolchain has one pin home, one smoke gate and one nightly scan.
      base_tag: |
        The parent this layer FROMs. cloud publishes a :<sha> tag only on a
        commit that changed it, so when cloud did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        This image's input set contains cloud's, so cloud building implies this
        job building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        ui inherits every tool of cloud, so the pins of versions.env are compared
        here too, and the browser major is compared through the baked
        DENSUI_CHROME on top of them. This step runs ONE container, on
        SMOKE_PLATFORM, so that browser comparison is about the AMD64 variant
        alone — and unlike every other pin, the arm64 leg re-resolves this one
        from an unpinned apt repo at publish time, so nothing compares it. The
        content group is where the rest lives: the font a computed layout
        measures with, and node/npm/uv resolving as BOTH root and dev — the check
        that fails if the /usr/local/bin exposure is ever dropped, which no
        version comparison could see.
