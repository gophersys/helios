# images.yaml — the image SET of this repository, as DATA.
#
# ============================================================================
# WHAT THIS FILE GOVERNS
# ============================================================================
#
# The identity of the set: which images exist, which one each of them builds
# FROM, which paths are its build inputs, and which functional check groups its
# smoke run exercises. Everything mechanical is DERIVED from here and from
# nowhere else:
#
#   BUILD_ORDER            ./ctl.sh and .ci/ctl.sh — the document order below
#   image_parent()         .ci/affected.sh — the `parent` field
#   the input path table   .ci/affected.sh — the `paths` field
#   the check groups       .ci/smoke.sh — the `groups` field
#   the publish jobs       .ci/providers/github/build-and-push.yml, through
#                          _ctl/generate.sh, and hand-copied to
#                          .github/workflows/ from there
#   the nightly matrix     the `image:` line of .ci/providers/github/
#                          security-nightly.yml, through the same generator
#
# The graph used to be declared in 6 files that a test held to each other. It is
# declared here, once. Adding an image is an entry below plus its Dockerfile,
# its directory and the policy-test literals named under the next heading.
#
# ============================================================================
# WHAT THIS FILE DELIBERATELY DOES NOT GOVERN
# ============================================================================
#
# **The literals in the policy tests.** `SANCTIONED` in platform-policy.test.sh,
# `EXPECTED_PROVIDER_FILES` beside its glob, the governed-file lists in
# dockerfile-args.test.sh and download-coverage.test.sh: all of them stay
# hand-kept. A test that reads the value it checks agrees with any value, a
# wrong one included, so generating a test from this file would delete the check
# rather than maintain it. The rule those tests keep is set EQUALITY with this
# file — a literal list that no longer matches the manifest is a red test, and
# that is the check that replaces the hand-copying.
#
# **The pin homes and the pin class tables.** versions.env is the pin home and
# .ci/smoke.sh holds the classification. This file says which image exists, not
# what version it installs.
#
# **The per-image Dockerfile, project.json and devcontainer.json.** They stay
# hand-written for now. Generating them is the next slice, not this one.
#
# ============================================================================
# DOCUMENT ORDER IS BUILD ORDER
# ============================================================================
#
# BUILD_ORDER is the order the `images:` keys appear below, so a parent MUST be
# written above its children. The reader FAILS naming both images when it is
# not, rather than emitting an order that would build a child against a parent
# this run has not made yet. A separate `build_order:` list would be the second
# declaration of the set that this file exists to remove.
#
# ============================================================================
# THE FIELDS
# ============================================================================
#
#   parent      the image this one builds FROM, or "" for an image that builds
#               FROM ubuntu. A child's input set CONTAINS its parent's, which is
#               what makes "the parent built, so the child builds" true by
#               construction.
#   context     the docker build context of the publish job. `.` is the
#               repository root, and an image takes it when its Dockerfile COPYs
#               something from beside its own directory.
#   dockerfile  the --file of the publish job.
#   smoke_ref   the tag the publish job LOADS into the local image store and the
#               smoke run then asserts. It carries no registry on purpose:
#               nothing can pull it, so a load that did not happen fails the
#               smoke step instead of asserting against the last published
#               image.
#   paths       the build inputs of the image ITSELF, without its parent's. A
#               trailing `/` is a prefix; anything else is an exact path.
#   groups      the functional groups .ci/image-checks.sh runs for this image,
#               beyond the version comparison. An image with an empty list is
#               refused: a smoke that compares versions and exercises nothing is
#               not a smoke.
#   notes       the prose of THIS image's publish job, keyed by where it goes.
#               _ctl/generate.sh wraps each line in `# ` at the right indent. An
#               absent key emits no comment. Everything a job says that is TRUE
#               OF EVERY JOB is in the generator's template instead, which is
#               what stops the 5 jobs from drifting apart again.

images:
  base:
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    # versions.env is an input of base as well as of cloud, and both of them
    # READ it at build time: every pin of either image arrives as a --build-arg
    # generated from that file. This row used to admit an over-build — base took
    # the input while only cloud consumed it — and the collapse to 1 pin home is
    # what made the mapping true rather than merely safe.
    #
    # .dockerignore governs what the root context SHIPS, so it is an input of
    # every root-context image — proven the day it landed, when its own merge
    # skipped every build and the images missed 2 commits' layers until a
    # dispatch rebuilt them (2026-08-18).
    paths:
      - base/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-base
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      outputs: |
        Whether this job really built. The child jobs read it: when base did not
        build, no base:<sha> exists for this commit and a child that FROMs that
        tag fails on a tag that was never pushed.
      filter: |
        This step is NOT gated, and neither are the 2 above it: their outputs
        are what every gate below reads, and what the child jobs read.
      buildx: |
        Replaces docker/setup-buildx-action. It makes the same
        docker-container builder — the default docker driver can neither read
        nor write a registry cache — and it owns the arm64 switch that reads
        SANCTIONED_PLATFORMS. Inert today: that list holds linux/amd64 alone.
        It runs after the registry login: the builder boots by pulling the
        private BuildKit mirror, and an anonymous pull of it is refused.
      smoke: |
        The Dockerfile deliberately runs no --version checks: they could not
        run while this image was cross-built under QEMU. This is where every
        pin of versions.env is compared against what the image installed, and
        where the gate toolchain is exercised on a real fixture.

  flutter:
    parent: base
    context: flutter
    dockerfile: flutter/Dockerfile
    smoke_ref: flutter:smoke
    paths:
      - flutter/
    groups:
      - content-base
      - content-flutter
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      base_tag: |
        The parent this layer FROMs. base publishes a :<sha> tag only on a
        commit that changed it, so when base did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        flutter's input set contains base's, so base building implies this job
        building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        flutter inherits every tool of base, so the pins of versions.env are
        compared here too, and the flutter SDK is checked on top of them.

  zephyr:
    parent: base
    context: zephyr
    dockerfile: zephyr/Dockerfile
    smoke_ref: zephyr:smoke
    paths:
      - zephyr/
    groups:
      - content-base
      - content-zephyr
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      outputs: |
        zephyr-devbox FROMs zephyr, and reads this for the same reason the
        children of base read base's: a job that did not build pushed no :<sha>.
      base_tag: |
        The parent this layer FROMs. base publishes a :<sha> tag only on a
        commit that changed it, so when base did not build there is no such tag
        and the only correct parent is the :latest that is still current.
      filter: |
        zephyr's input set contains base's, so base building implies this job
        building. The reverse does not hold, which is what BASE_TAG answers.
      smoke: |
        zephyr inherits every tool of base, so the pins of versions.env are
        compared here too, and west is checked on top of them.

  zephyr-devbox:
    parent: zephyr
    context: zephyr-devbox
    dockerfile: zephyr-devbox/Dockerfile
    smoke_ref: zephyr-devbox:smoke
    paths:
      - zephyr-devbox/
    groups:
      - content-base
      - content-zephyr
      - content-devbox
      - go-gate
      - dockerfile-lint
      - compose
    notes:
      needs: |
        Layers on zephyr the same way zephyr layers on base, so it FROMs the
        zephyr this run just pushed. It needs base as well, for the one short SHA
        every job of the run tags with.
      base_tag: |
        The parent is zephyr, so it is ZEPHYR's verdict that decides whether a
        :<sha> tag exists to FROM. base's short sha is still the tag zephyr
        pushed under, because every job of a run shares one commit.
      filter: |
        This image's input set contains zephyr's, which contains base's, so a
        parent that builds always brings its children with it.
      smoke: |
        The devbox image defaults to root for sshd, and the smoke forces the
        dev user so the base checks run in the identity the other images use.
        The flash/debug stack, the SDK toolchains and `sshd -t` are checked on
        top of every pin of versions.env.

  cloud:
    parent: ""
    context: "."
    dockerfile: cloud/Dockerfile
    smoke_ref: cloud:smoke
    paths:
      - cloud/
      - _delta/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-cloud
      - content-runner
      - go-gate
      - dockerfile-lint
      - compose
      - debugger
      - protocols
    notes:
      job: |
        The cloud image: the reduced base + the CI fold (image-architecture, ledger
        #94). ADDITIVE and independent — FROM ubuntu directly, no needs. Its gate
        order is the one the publish-order test demands: build to the local store,
        smoke the loaded image (content checks + the 5.75 GB size gate), and only
        then push. The build context is the REPOSITORY ROOT because versions.env
        and _delta/ sit beside the image directories, and every version pin arrives
        as a build-arg generated from versions.env — the one home for every pin.

        It is also the image every ARC pool runs, this workflow's own runner
        included, so a bad cloud build is felt by the next job of every repository.
      smoke: |
        Content checks for every kept tool group, the CI fold, the harness
        bake, the absent-Go-cache assertion, and the 5.75 GB size gate (R4).
        It runs the LOADED image, which is the exact build the publish step
        below then copies to ghcr.io.
