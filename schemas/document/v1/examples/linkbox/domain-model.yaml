meta:
  id: domain-model
  type: domain-model
  schema_version: 1.0.0
  project: linkbox
  status: approved
  version: 1
  created: 2026-06-12
  updated: 2026-06-12
  authors:
    - run: run-arch-1c40
    - human: mateo
  links:
    realizes: []
    supersedes: null
    informs: []

data:
  entities:
    - id: ENT-0001
      name: Link
      description: |
        A single saved URL belonging to one user — the atom of the library. Carries the
        original URL, a resolved title, and the moment it was saved.
      attributes:
        - name: url
          type: string
          description: "The original URL the user saved. Canonicalized (scheme + host lowercased) before storage."
        - name: title
          type: string
          description: "Human-readable title resolved from the page; falls back to the host when none is available."
        - name: savedAt
          type: Timestamp
          description: "When the link was first saved. Immutable once set."
      relationships:
        - to: ENT-0002
          kind: tagged-with
          cardinality: many-to-many
        - to: ENT-0003
          kind: member-of
          cardinality: many-to-many
      links:
        realizes:
          - REQ-0001
    - id: ENT-0002
      name: Tag
      description: |
        A user-scoped label applied to links. The only organizing primitive in the product;
        retrieval is by tag, not by folder.
      attributes:
        - name: name
          type: string
          description: "The tag label, case-insensitive and unique per user. De-duplicated on write."
      relationships:
        - to: ENT-0001
          kind: applies-to
          cardinality: many-to-many
      links:
        realizes:
          - REQ-0002
    - id: ENT-0003
      name: Collection
      description: |
        A named, ordered set of a user's links that a curator can publish as a read-only
        share. Holds its publication state and, when published, a share token.
      attributes:
        - name: name
          type: string
          description: "The collection's display name, set by the curator."
        - name: status
          type: Status enum
          description: "One of `draft` or `published`; `published` exposes the share token, `draft` keeps it private."
        - name: shareToken
          type: string
          description: "Opaque token that resolves the published collection read-only; null while draft or after revocation."
      relationships:
        - to: ENT-0001
          kind: contains
          cardinality: many-to-many
      links:
        realizes:
          - REQ-0003
  invariants:
    - id: INV-0001
      statement: |
        Every Link, Tag, and unpublished Collection belongs to exactly one owning user, and is
        readable only by that user — the sole exception being a Collection in `published` status,
        which is readable by anyone presenting its current `shareToken`.
      links:
        realizes:
          - REQ-0005
