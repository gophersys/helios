data:
  items:
    - id: REQ-0001
      statement: "WHEN a logged-in user submits a URL THE SYSTEM SHALL persist it as a saved link in that user's library and confirm the save."
      kind: functional
      priority: P1
      rationale: "Saving a link is the core act of the product; without durable capture nothing else matters (charter: vision)."
      acceptance:
        - "Posting a valid URL returns the created link with an id and a `savedAt` timestamp."
        - "The saved link appears in the user's library on the next library fetch."
        - "An invalid or empty URL is rejected with a validation error and nothing is persisted."
      links:
        realizes:
          - PER-0001
      source:
        - run: run-intake-0a91
          span: "messages 12-18"
    - id: REQ-0002
      statement: "WHEN a user adds or removes a tag on a saved link THE SYSTEM SHALL update that link's tag set and make the link retrievable by each of its current tags."
      kind: functional
      priority: P1
      rationale: "Tags are the only organizing mechanism (folders are a non-goal); retrieval-by-tag is how the collector finds anything again."
      acceptance:
        - "Adding a tag to a link makes the link appear in a by-tag query for that tag."
        - "Removing a tag from a link removes the link from that tag's by-tag query."
        - "A link may carry zero or more tags; tag names are case-insensitive and de-duplicated."
      links:
        realizes:
          - PER-0001
    - id: REQ-0003
      statement: "WHEN a curator publishes a collection THE SYSTEM SHALL generate a stable read-only share link that resolves to the collection's current members, and SHALL stop resolving once the curator revokes it."
      kind: functional
      priority: P2
      rationale: "Sharing a curated set without exposing the whole library is the curator's headline job (charter: success criteria)."
      acceptance:
        - "Publishing a collection returns a share token whose URL renders the collection read-only to an anonymous visitor."
        - "Links added to the collection after publishing appear at the share URL without re-publishing."
        - "After revocation the share URL returns a 404/gone and exposes no collection data."
      links:
        realizes:
          - PER-0002
    - id: REQ-0004
      statement: "WHILE serving an authenticated library or save request THE SYSTEM SHALL return a response in under 300 milliseconds at the 95th percentile under nominal load."
      kind: quality
      priority: P2
      rationale: "The charter promises a save that feels instant and a library that loads under a second; the API budget protects that experience."
      acceptance:
        - "p95 latency of the save endpoint is below 300ms in the load-test report at 50 requests/second."
        - "p95 latency of the library-list endpoint is below 300ms under the same load."
      links:
        realizes:
          - PER-0001
    - id: REQ-0005
      statement: "THE SYSTEM SHALL ensure every saved link, tag, and unpublished collection is accessible only to the user who owns it, and SHALL deny all cross-user access by default."
      kind: constraint
      priority: P1
      rationale: "A personal library is private by definition; the only public surface is an explicitly published collection (REQ-0003). This is the trust boundary the whole product rests on."
      acceptance:
        - "A request for another user's link, tag, or unpublished collection is denied with a 403/404 and leaks no data."
        - "Only a published collection's share token grants anonymous read access, and only to that collection."
      links:
        realizes:
          - PER-0001
          - PER-0002
