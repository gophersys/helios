data:
  items:
    - id: WF-0001
      name: Save and tag a link
      persona: PER-0001
      trigger: "WHEN the collector finds a URL worth keeping and opens Linkbox to save it."
      steps:
        - "Paste or type the URL into the single save field and press Save."
        - "See the link appear at the top of the library immediately, with the page title resolved."
        - "Type one or two tags into the link's tag field and confirm."
      outcome: "The link is durably saved in the user's library and retrievable by each tag they added."
      links:
        realizes:
          - REQ-0001
          - REQ-0002
    - id: WF-0002
      name: Publish and share a collection
      persona: PER-0002
      trigger: "WHEN the curator has gathered a themed set of links and wants to share just that set."
      steps:
        - "Open the collection and add the saved links that belong in it."
        - "Press Publish to generate a read-only share link."
        - "Copy the share link and hand it to the audience; later, press Revoke to take it down."
      outcome: "Anyone with the share link can read the collection while it is published, and loses access the moment the curator revokes it."
      links:
        realizes:
          - REQ-0003
