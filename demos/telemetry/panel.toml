# Telemetry console — blind demo. Every anchor below is COMPUTED (layers.md
# shows the derivation); there is no reference bitmap anywhere in this demo.
# Note vs layers.md first sketch: rails sit side by side in one knob row
# (solver-modelled today); their stream cells render beneath each dial — the
# grid_rows model (P6) will absorb those when it lands.

[panel]
name = "telemetry"
width = 1120
height = 320

[font]
# The container/CI truth; local runs and tests substitute a present font.
path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
size = 16

[census]
file = "demos/telemetry/census.md"

[tracks]
columns = [360, 292, 340, 100]   # TARGET | LINK+RUN | editor | alarms (mod-4)
gap = 4
margin = 8

[solve.knob_rows.rails]
plate_width = 344                # 360 - 2x8 pad
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0
anchor_tolerance = 6             # blind spec: font decides, give it room

[[solve.knob_rows.rails.units]]
name = "rail-3v3"
center = 60                      # linspace(60, 280, 3); io capped by value-ink escape
label = "3V3"
widest = "3.60 V"

[[solve.knob_rows.rails.units]]
name = "rail-1v8"
center = 170
label = "1V8"
widest = "2.00 V"

[[solve.knob_rows.rails.units]]
name = "rail-io"
center = 280
label = "IO"
widest = "3.60 V"

[solve.knob_rows.ilimit]
plate_width = 344
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0

[[solve.knob_rows.ilimit.units]]
name = "ilimit"
center = 60                      # isolated row; 24px pitch above per layers.md
label = "I-Limit"
widest = "2.00 A"

[solve.knob_rows.link]
plate_width = 276                # 292 - 2x8
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0
anchor_tolerance = 6

[[solve.knob_rows.link.units]]
name = "radio-ch"
center = 70
label = "Channel"
widest = "26"

[[solve.knob_rows.link.units]]
name = "radio-pwr"
center = 200
label = "TX Power"
widest = "-20 dBm"

[probe]
page = "telemetry.html"        # what `densui score` probes; `densui audit` is given it
root = ".panel"
root_width = 1120
text_kinds = ["label", "value", "clabel", "num"]

[probe.containers]
plate = ".plate"

[probe.parts]
label = ".k-label"
dial = ".k-dial"
value = ".k-value"
num = ".s-num"
clabel = ".s-label"

[rules]
min_sibling_gap = 2.0
breathing_floor = 2.5

# Executed by densui.audit.check_ratios on every gate. Before the typed form
# these were `name = [want, tol]` pairs that named no measurement, and nothing
# ever read them.
[ratio]
panel_w = { measure = "root.w", want = 1120, tol = 5 }
panel_h = { measure = "root.h", want = 320, tol = 5 }
dial = { measure = "dial.h", want = 28, tol = 1 }
# NOT MIGRATED, and not silently dropped: `row = [72, 4]` (layers.md L2 —
# label line 20 + 2 + dial 28 + value line 20). The row's box is `.k`, and any
# part that spans the row overlaps the label/dial/value inside it: declaring
# `unit = ".k"` was measured, and it produces 12 overlap failures and a box of
# 50px (the value line is out of flow), so the row height has no probe
# expression at all. Text is ink (A-4), so the two line boxes are invisible
# too. The claim is font-independent as a DIFFERENCE of ink centres —
# value.cy - label.cy = 50.00 measured, = 20 + 2 + 28 derived — which is a row
# form check_ratios does not have. Restoring it is an open item, not a
# tolerance question; see the PR body.
