# Telemetry console — blind demo. Every anchor below is COMPUTED (layers.md
# shows the derivation); there is no reference bitmap anywhere in this demo.
# Note vs layers.md first sketch: rails sit side by side in one knob row
# (solver-modelled today); their stream cells render beneath each dial — the
# grid_rows model (P6) will absorb those when it lands.

[panel]
name = "telemetry"
width = 1120
height = 320

[font]
# The container/CI truth; local runs and tests substitute a present font.
path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
size = 16

[census]
file = "demos/telemetry/census.md"

[tracks]
columns = [360, 292, 340, 100]   # TARGET | LINK+RUN | editor | alarms (mod-4)
gap = 4
margin = 8

[solve.knob_rows.rails]
plate_width = 344                # 360 - 2x8 pad
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0
anchor_tolerance = 6             # blind spec: font decides, give it room

[[solve.knob_rows.rails.units]]
name = "rail-3v3"
center = 60                      # linspace(60, 280, 3); io capped by value-ink escape
label = "3V3"
widest = "3.60 V"

[[solve.knob_rows.rails.units]]
name = "rail-1v8"
center = 170
label = "1V8"
widest = "2.00 V"

[[solve.knob_rows.rails.units]]
name = "rail-io"
center = 280
label = "IO"
widest = "3.60 V"

[solve.knob_rows.ilimit]
plate_width = 344
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0

[[solve.knob_rows.ilimit.units]]
name = "ilimit"
center = 60                      # isolated row; 24px pitch above per layers.md
label = "I-Limit"
widest = "2.00 A"

[solve.knob_rows.link]
plate_width = 276                # 292 - 2x8
dial = 28
tuck = 10
dial_floor = 0
label_floor = 0
anchor_tolerance = 6

[[solve.knob_rows.link.units]]
name = "radio-ch"
center = 70
label = "Channel"
widest = "26"

[[solve.knob_rows.link.units]]
name = "radio-pwr"
center = 200
label = "TX Power"
widest = "-20 dBm"

[probe]
page = "telemetry.html"        # what `ui score` probes; `ui audit` is given it
root = ".panel"
root_width = 1120
text_kinds = ["label", "value", "clabel", "num"]

[probe.containers]
plate = ".plate"

[probe.parts]
label = ".k-label"
dial = ".k-dial"
value = ".k-value"
num = ".s-num"
clabel = ".s-label"

[rules]
min_sibling_gap = 2.0
breathing_floor = 2.5
# No floor can express this panel: the quotient is 1.00, and A1's quotient
# never goes below 1.00, so every floor above it fires and none at or below it
# can. The exemption is the honest form, and ui score names this panel
# under axis-sprawl instead of counting it clean.
axis_budget_exempt = true
axis_budget_reason = """\
one control per column by design: each rail owns its own vertical line so its \
stream cells can sit under it (measured 6 controls on 6 control x-axes = 1.00), \
so A1's premise — repeated structure across axes — is absent here"""

# Executed by ui.audit.check_ratios on every gate. Before the typed form
# these were `name = [want, tol]` pairs that named no measurement, and nothing
# ever read them.
[ratio]
panel_w = { measure = "root.w", want = 1120, tol = 5 }
panel_h = { measure = "root.h", want = 320, tol = 5 }
dial = { measure = "dial.h", want = 28, tol = 1 }
# The row pitch of layers.md L2 (label line 20 + 2 + dial 28), stated as what a
# probe can measure: the DIFFERENCE of two ink centres. The row's own box has no
# expression — declaring `unit = ".k"` was measured and it overlaps every part
# inside it (12 overlap failures), and text is ink (A-4), so the line boxes are
# invisible. A difference is font-independent where the two absolute positions
# are not: value.cy - label.cy = 50.00 measured, 20 + 2 + 28 derived.
row = { span = ["label.cy", "value.cy"], want = 50, tol = 4 }
