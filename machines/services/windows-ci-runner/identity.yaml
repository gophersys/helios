# identity.yaml — windows-ci-runner
#
# Windows VM on Proxmox (pve-00) as a self-hosted GitHub Actions runner for
# the gophersys org: Windows builds + install/uninstall smoke tests for the
# music apps. PLANNED — hosted windows-latest serves until this exists.
# NOT a k8s workload: Windows containers/KubeVirt on the k3s VMs would need
# Windows nodes / nested virt for zero benefit; Proxmox hosts it directly.

name: windows-ci-runner
os: windows
purpose: "Self-hosted GitHub Actions runner (gophersys org) — Windows CI for music apps"
tailscale_hostname: windows-ci-runner
status: planned
location: home-pve-00
owner: mateo.segura413@gmail.com

roles:
  - common
  - networking-tailscale

hardware:
  provider: proxmox
  hypervisor: pve-00
  cpu_cores: 4
  memory_gb: 8
  storage_gb: 80    # thin LV on the pve-00 NVMe (954G, ample)

runner:
  kind: github-actions
  scope: org
  labels: [self-hosted, Windows, music-ci]
  service: windows-service
