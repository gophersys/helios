# identity.yaml — sentinel-00 (prod tailnet bastion)
#
# OCI VM.Standard.E2.1.Micro (x86) — always-free tier. Not a K8s node.
# Tailnet exit-node / SSH bastion. Pair with sentinel-01 for basic HA.

name: sentinel-00
os: linux-debian
purpose: "prod tailnet bastion / SSH jumpbox (paired with sentinel-01)"
tailscale_hostname: sentinel-00
status: active
location: oracle-phoenix
owner: mateo.segura413@gmail.com

roles:
  - common
  - platform-linux-debian
  - networking-tailscale
  - secrets-bitwarden-client

hardware:
  provider: oracle
  cpu_arch: amd64
  cpu_cores: 1
  memory_gb: 1
  disk_gb: 47
  oracle:
    shape: VM.Standard.E2.1.Micro
    availability_domain: "FEQI:PHX-AD-2"
    instance_ocid: "ocid1.instance.oc1.phx.anyhqljtslzce6acc3d3uadohlu4ydn3bzv2afkvoyoqbgvhrtudfuaawelq"

bastion:
  ssh_port: 22
  fail2ban: true
  allowed_tailnet_tags:
    - "tag:admin"
