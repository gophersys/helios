# identity.yaml — arm-builder
#
# On-demand ARM (Graviton2) docker builder. An AWS t4g.small EC2 instance
# that is STOPPED when idle and STARTED on demand (~20s resume). EBS root
# volume persists Docker layer cache across stop/start cycles. Per-second
# billing — we pay only for build minutes.
#
# Not a cluster node — safe to stop/start freely. Used by codectl and
# fintel to push native ARM images to ghcr.io.

name: arm-builder
os: linux-debian
purpose: "On-demand ARM (Graviton2) docker builder for ghcr.io pushes (codectl, fintel)"
tailscale_hostname: arm-builder
status: active
location: aws-us-west-2
owner: mateo.segura413@gmail.com

roles:
  - common
  - platform-linux-debian
  - networking-tailscale
  - secrets-bitwarden-client

# AWS / hardware shape.
hardware:
  provider: aws
  instance_type: t4g.small
  cpu_arch: arm64
  cpu_cores: 2
  memory_gb: 2
  ebs_gb: 30

# Builder-specific knobs consumed by scripts/arm-builder.sh.
builder:
  kind: docker
  aws_region: us-west-2
  instance_tag: "Name=arm-builder"
  idle_stop_minutes: 10
  ssh_key: ~/.ssh/arm-builder
  registry: ghcr.io
