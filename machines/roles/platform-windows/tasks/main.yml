---
# roles/platform-windows/tasks/main.yml
#
# Windows 10/11 Pro. Ansible talks over WinRM. This role:
#   1. Confirms WinRM prerequisites are already in place.
#   2. Installs developer packages via winget.
#
# Prerequisites (run once, interactively, on the target — outside Ansible):
#   winrm quickconfig
#   Enable-PSRemoting -Force
#   Set-ItemProperty -Path WSMan:\localhost\Service -Name AllowUnencrypted -Value $false
#   New-NetFirewallRule -DisplayName "WinRM HTTPS" -Protocol TCP -LocalPort 5986 -Action Allow

- name: Confirm we are on a Windows host
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Windows"
    fail_msg: "platform-windows role applied to a non-Windows host"
  tags: [platform, windows]

- name: Ensure winget is present (ships with Windows 11; Windows 10 may need App Installer)
  ansible.windows.win_command: winget --version
  register: winget_probe
  changed_when: false
  failed_when: winget_probe.rc != 0
  tags: [platform, windows, winget]

# winget installs are declared, not imperatively chained, so the role is
# idempotent. Packages list is intentionally narrow; each host can add more
# via host_vars.windows_extra_packages.
- name: Install base developer packages via winget
  ansible.windows.win_command: >
    winget install --exact --silent --accept-source-agreements --accept-package-agreements {{ item }}
  loop:
    - Git.Git
    - Microsoft.PowerShell
    - Microsoft.WindowsTerminal
    - Microsoft.VisualStudioCode
    - OpenJS.NodeJS.LTS
    - Python.Python.3.12
  register: winget_install
  changed_when: "'Successfully installed' in (winget_install.stdout | default(''))"
  failed_when:
    - winget_install.rc != 0
    - "'No available upgrade found' not in (winget_install.stdout | default(''))"
    - "'already installed' not in (winget_install.stdout | default('')) | lower"
  tags: [platform, windows, winget]
  # TODO: switch to the dedicated community.windows.win_winget module once it
  # is generally available in our Ansible channel.

- name: Install any extra host-specific packages
  ansible.windows.win_command: >
    winget install --exact --silent --accept-source-agreements --accept-package-agreements {{ item }}
  loop: "{{ windows_extra_packages | default([]) }}"
  when: windows_extra_packages is defined and windows_extra_packages | length > 0
  register: winget_install_extra
  changed_when: "'Successfully installed' in (winget_install_extra.stdout | default(''))"
  failed_when:
    - winget_install_extra.rc != 0
    - "'No available upgrade found' not in (winget_install_extra.stdout | default(''))"
    - "'already installed' not in (winget_install_extra.stdout | default('')) | lower"
  tags: [platform, windows, winget]
