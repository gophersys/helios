---
# roles/platform-linux-fedora/tasks/main.yml
#
# Fedora / RHEL family. Package installs via dnf.

- name: Refresh dnf metadata
  ansible.builtin.dnf:
    update_cache: true
  tags: [platform, dnf]

- name: Install base packages (always present)
  ansible.builtin.dnf:
    name:
      - bash
      - zsh
      - curl
      - wget
      - ca-certificates
      - gnupg2
      - git
      - jq
      - rsync
      - openssh-clients
      - "@Development tools"
      - pkgconf-pkg-config
      - python3
      - python3-pip
      - python3-virtualenv
      - unzip
      - htop
      - tmux
      - vim
      - less
      - bind-utils
      - iputils
    state: present
  tags: [platform, dnf, packages]

- name: Install kubernetes-adjacent CLIs when host is a k8s role
  ansible.builtin.dnf:
    name:
      - kubectl
      - helm
    state: present
  when: "'developer-kubernetes-operator' in (roles | default([]))"
  tags: [platform, dnf, kubernetes]
  # TODO: ensure the kubernetes and helm dnf repos are configured first —
  # base Fedora does not ship either package.
