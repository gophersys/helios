---
# roles/networking-tailscale/tasks/main.yml
#
# Installs Tailscale and joins the tailnet via a pre-auth key pulled from
# Bitwarden. This role invokes `machines/scripts/tailscale-provision.sh`
# remotely so the secret-handling logic stays in one place.

- name: Install Tailscale (Debian/Ubuntu)
  when: ansible_distribution in ["Debian", "Ubuntu"]
  block:
    - name: Add Tailscale signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
  tags: [networking, tailscale]

- name: Install Tailscale (Fedora/RHEL)
  when: ansible_distribution in ["Fedora", "RedHat", "CentOS", "Rocky", "AlmaLinux"]
  block:
    - name: Add Tailscale dnf repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/fedora/tailscale.repo"
        dest: /etc/yum.repos.d/tailscale.repo
        mode: "0644"

    - name: Install tailscale package
      ansible.builtin.dnf:
        name: tailscale
        state: present
  tags: [networking, tailscale]

- name: Install Tailscale (Windows)
  ansible.windows.win_command: >
    winget install --exact --silent --accept-source-agreements --accept-package-agreements tailscale.tailscale
  register: ts_winget
  changed_when: "'Successfully installed' in (ts_winget.stdout | default(''))"
  failed_when:
    - ts_winget.rc is defined and ts_winget.rc != 0
    - "'already installed' not in (ts_winget.stdout | default('')) | lower"
  when: ansible_os_family == "Windows"
  tags: [networking, tailscale]

- name: Enable and start tailscaled (systemd hosts)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"
  tags: [networking, tailscale]

# `tailscale up` is invoked by the tailscale-provision.sh script which
# fetches the pre-auth key from Bitwarden. Running it from Ansible directly
# would require the key to transit via ansible_facts — not acceptable. We
# surface a reminder instead.
- name: Reminder — run tailscale-provision.sh once per host
  ansible.builtin.debug:
    msg: >
      After this playbook, run on the target (or via shell role):
      bash machines/scripts/tailscale-provision.sh <tag> --hostname {{ tailscale_hostname }}
  tags: [networking, tailscale, manual]
