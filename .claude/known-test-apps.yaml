# ───────────────────────────────────────────────────────────────────
# .claude/known-test-apps.yaml — Phase D Layer 5 (test-app refresh sweep)
# ───────────────────────────────────────────────────────────────────
#
# Authoritative registry of every concord test app that consumes
# `corekinect`, `corectl`, or `libs/protocols/mtib`. When any of those
# three dependencies is touched in a release, the entries below MUST be
# refreshed and re-uploaded as part of the release flow.
#
# This file is the fifth layer of Phase D coupling enforcement
# (`.claude/rules/version-coupling.md`):
#
#   Layer 1: deploy/runner/project.json implicitDependencies
#   Layer 2: deploy/ctl.sh _check_runner_corekinect_freshness
#   Layer 3: scripts/release-gates/check-runner-affected.sh
#   Layer 4: deploy/runner/check_framework_constraint.py
#   Layer 5: ← this file, swept by /concord-release Phase 11
#
# The previous four layers catch RUNTIME drift: a stale runner against
# a fresh corekinect, or a stale test package against a fresh runner.
# Layer 5 catches a slower, accumulating drift the others can't see:
# the test apps' scaffold artifacts (`.claude/rules/`,
# `.claude/skills/`, `.devcontainer/`, validator templates) fall behind
# the corectl templates over time. Operators forget to refresh because
# at runtime "the framework constraint is still satisfied" — true, but
# the scaffold drifts and eventually breaks `corectl test validate`.
#
# Workflow:
#   - Phase 0 (pre-release hook):  lists entries below when corekinect,
#     protocols, or corectl is touched in the release range.
#   - Phase 0.5 (release-impact-auditor): includes each entry's
#     last-known framework-refresh commit in the audit report.
#   - Phase 11 (/concord-release):  iterates entries below, cd's into
#     each, runs `corectl test update --apply`, commits, pushes, and
#     re-uploads. Halts the release on any failure (escape:
#     `--skip-test-app-refresh`).
#
# ───────────────────────────────────────────────────────────────────
# IMPORTANT: paths assume the umbrella workspace layout
# ───────────────────────────────────────────────────────────────────
#
# The test app repos are SIBLING repos under `/home/<user>/work/`, not
# subdirectories of concord. A clean concord clone WILL NOT contain
# these paths. The release operator is expected to have the umbrella
# workspace set up — `/home/<user>/work/` containing `concord/`,
# `manufacturing/`, and `validation/` as parallel directories.
#
# If a path is missing locally, the Phase 11 sweep logs the skip and
# the operator MUST either:
#   1. Clone the missing repo into the umbrella layout, OR
#   2. Run the refresh manually on a host that has it, OR
#   3. Confirm the test app is intentionally end-of-life (and remove
#      the entry from this file in the same release commit).
#
# ───────────────────────────────────────────────────────────────────
# Adding a new test app
# ───────────────────────────────────────────────────────────────────
#
# Run from the umbrella root:
#
#   find /home/<user>/work/manufacturing /home/<user>/work/validation \
#     -maxdepth 3 -name concord.yaml \
#     -not -path "*/node_modules/*" -not -path "*/.git/*"
#
# Add a new entry below for any concord.yaml that isn't already listed.
# Each entry needs name, path, product, type, and repo. Keep entries
# alphabetized by `name` for stable diff review.

test_apps:
  - name: alpha_manufacturing
    path: /home/mateo/work/manufacturing/alpha_manufacturing
    product: alpha
    type: MANUFACTURING
    repo: git@bitbucket.org:corekinect/alpha_manufacturing.git

  - name: alpha_validation
    path: /home/mateo/work/validation/alpha_validation
    product: alpha
    type: VALIDATION
    repo: git@bitbucket.org:corekinect/alpha_validation.git

  - name: sigma5_manufacturing
    path: /home/mateo/work/manufacturing/sigma5_manufacturing
    product: sigma5
    type: MANUFACTURING
    repo: git@bitbucket.org:corekinect/sigma5_manufacturing.git

  - name: sigma5_validation
    path: /home/mateo/work/validation/sigma5_validation
    product: sigma5
    type: VALIDATION
    repo: git@bitbucket.org:corekinect/sigma5_validation.git
