---
# Master playbook — K3s cluster on OCI with Tailscale mesh (6-node)
#
# Node layout:
#   server-00    K3s control plane       (servers)
#   agent-00     K3s worker ARM          (agents)
#   agent-01     K3s worker x86, IB GW   (agents)
#   agent-02     K3s worker x86, light   (agents)
#   sentinel-00  Bastion/monitoring      (sentinels)
#   sentinel-01  Backup bastion          (sentinels)
#
# Usage:
#   ansible-playbook site.yml
#
# Prerequisites:
#   - TAILSCALE_AUTH_KEY env var set with a valid Tailscale auth key
#   - OCI_COMPARTMENT_OCID set for dynamic inventory
#   - SSH access to all nodes via the ubuntu user

# Play 1: Base hardening and Tailscale on all hosts
- name: Common setup and Tailscale mesh
  hosts: all
  gather_facts: true
  roles:
    - common
    - tailscale

# Play 2: K3s server (runs first, serial ensures it completes before agents)
- name: K3s server installation
  hosts: servers
  gather_facts: false
  serial: 1
  roles:
    - k3s-server

# Play 3: K3s agents join the cluster
- name: K3s agent installation
  hosts: agents
  gather_facts: false
  roles:
    - k3s-agent

# Play 4: Sentinel hardening and monitoring stack
- name: Sentinel setup (bastion + monitoring)
  hosts: sentinels
  gather_facts: false
  roles:
    - sentinel
