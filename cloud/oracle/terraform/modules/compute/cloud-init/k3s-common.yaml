#cloud-config
# -----------------------------------------------------------------------------
# Cloud-Init — Common bootstrap for all K3s cluster nodes
# -----------------------------------------------------------------------------
# Applied to every instance regardless of role. K3s and Tailscale installation
# is handled by Ansible after Terraform provisioning completes.
# -----------------------------------------------------------------------------

# Update and install base packages
package_update: true
package_upgrade: true
packages:
  - curl
  - ca-certificates
  - jq
  - unzip
  - fail2ban
  - open-iscsi
  - nfs-common
  - apparmor
  - apparmor-utils

# Set timezone
timezone: UTC

# Sysctl settings required by K3s / container networking
write_files:
  - path: /etc/sysctl.d/99-k3s.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Enable bridge netfilter for iptables to see bridged traffic
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1

      # Enable IPv4 forwarding (required for pod networking)
      net.ipv4.ip_forward = 1

      # Increase inotify limits for large clusters
      fs.inotify.max_user_instances = 512
      fs.inotify.max_user_watches   = 524288

  - path: /etc/modules-load.d/k3s.conf
    owner: root:root
    permissions: "0644"
    content: |
      br_netfilter
      overlay
      iscsi_tcp

  # Keepalive script — OCI reclaims idle Always Free instances.
  # This generates minimal activity every 5 days to prevent reclamation.
  - path: /usr/local/bin/keepalive.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Generate 60 seconds of light CPU activity
      dd if=/dev/urandom of=/dev/null bs=1M count=64 status=none
      logger -t keepalive "keepalive activity completed"

  - path: /etc/cron.d/keepalive
    owner: root:root
    permissions: "0644"
    content: |
      # Run keepalive every 5 days at a random minute (offset by hostname hash)
      0 3 */5 * * root /usr/local/bin/keepalive.sh

# Commands to run after first boot
runcmd:
  # Load kernel modules immediately
  - modprobe br_netfilter
  - modprobe overlay
  - modprobe iscsi_tcp

  # Apply sysctl settings
  - sysctl --system

  # Enable and start fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Enable iscsid for Longhorn storage (if used later)
  - systemctl enable iscsid
  - systemctl start iscsid

  # Set hostname from instance metadata
  - hostnamectl set-hostname ${hostname}
