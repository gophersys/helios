# Add the layer's directory to BitBake's search path for configuration files
# ${LAYERDIR} is the path to the current layer
BBPATH .= ":${LAYERDIR}"

# Tell BitBake which files to look for in this layer
# *.bb = recipe files
# *.bbappend = recipe append files
# recipes-* = standard directory structure for Yocto recipes
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Register this layer with BitBake
# This adds 'meta-corekinect' to the list of known layers
BBFILE_COLLECTIONS += "meta-corekinect"

# Define which files belong to this layer
# ^${LAYERDIR}/ means "start matching from this layer's root directory"
BBFILE_PATTERN_meta-corekinect = "^${LAYERDIR}/"

# Set layer priority (higher number = higher priority)
# Range is typically 1-10; 6 is common for custom layers
# This determines which layer's files take precedence if there are conflicts
BBFILE_PRIORITY_meta-corekinect = "6"

# Declare layer dependencies
# 'core' is the base OpenEmbedded layer that all layers typically need
LAYERDEPENDS_meta-corekinect = "core freescale-layer toradex-bsp-common-layer meta-toradex-distro sota meta-toradex-security"

# Declare which Yocto/OE release series this layer is compatible with
# 'scarthgap' is the release series name
# This helps prevent using incompatible layer versions together
LAYERSERIES_COMPAT_meta-corekinect = "scarthgap"

# Device Tree Overlays for TEZI - only include what you need
TEZI_EXTERNAL_KERNEL_DEVICETREE_BOOT:append = " \
    ina219-overlay.dtbo \
    ad7689-overlay.dtbo \
    usb.dtbo \
    verdin-imx8mm_dsi-to-hdmi_overlay.dtbo \
"

TEZI_EXTERNAL_KERNEL_DEVICETREE:append = " \
    ina219-overlay.dtbo \
    ad7689-overlay.dtbo \
    usb.dtbo \
    verdin-imx8mm_dsi-to-hdmi_overlay.dtbo \
"