CONFIG_IIO=y
CONFIG_AD7949=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGERED_BUFFER=y

# Pressure sensors
CONFIG_BMP280=m
CONFIG_BMP280_I2C=m
