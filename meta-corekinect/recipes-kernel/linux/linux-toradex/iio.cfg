CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGERED_BUFFER=y

# Pressure sensors (BME280 kernel driver for IIO sysfs access)
CONFIG_BMP280=m
CONFIG_BMP280_I2C=m
CONFIG_BMP280_SPI=m

# Accelerometer + ADC
CONFIG_IIO_ST_ACCEL_I2C_3AXIS=y
CONFIG_IIO_ST_SENSORS_CORE=y
CONFIG_IIO_ST_LIS2DE12=y
CONFIG_SENSORS_INA219=y

# GPIO expander (TCA9534A / PCA953x family)
CONFIG_GPIO_PCA953X=m

# EEPROM (AT24C02C)
CONFIG_EEPROM_AT24=m
