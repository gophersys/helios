# identity.yaml — linux-k3s-node (cluster member template)
#
# Template for a node that joins a manual-k3s cluster. Scaffolded into
# clusters/instances/<cluster>/nodes/<name>/identity.yaml via:
#   bash clusters/ctl.sh new-cluster-node <cluster> linux-k3s-node <name>
#
# Replace every "TODO:" with a real value before committing.

name: __HOST_NAME__
os: linux-debian
purpose: "TODO: short free-text (e.g. 'k3s server for app-prod')"
tailscale_hostname: __HOST_NAME__
status: planned
location: "TODO: physical/cloud location (e.g. oracle-phoenix, aws-us-west-2)"
owner: mateo.segura413@gmail.com

roles:
  - common
  - platform-linux-debian
  - networking-tailscale
  - secrets-bitwarden-client
  - cluster-node-labels            # applies kubernetes labels + taints at join
# Optional capability roles:
#   - developer-kubernetes-operator

# Cloud / hardware shape. Free-form; consumed by ansible host_vars.
# Populate from providers/compute-unit/ interface when Terraform is wired.
hardware:
  provider: "TODO: oracle|aws|azure|hetzner|bare-metal"
  compute_unit:
    arch: "TODO: amd64|arm64"
    cores: 0
    memory_gb: 0
    storage_gb: 0
    storage_class: ssd             # ssd | nvme | hdd
    network: tailnet               # public | tailnet | private

# Kubernetes node knobs. Consumed by the k3s-install role.
kubernetes:
  role: "TODO: server|agent"       # k3s role
  cluster_role: "TODO: apps|data|devops|build|batch"

  # Labels applied by Ansible at k3s-join.
  labels:
    role: "TODO: apps|data|devops|build|batch"     # matches cluster_role
    # additional custom labels...

  # Taints applied by Ansible at k3s-join. Pods without matching
  # tolerations cannot schedule here. Leave empty for the default
  # cluster-role `apps` (no taint).
  taints: []
    # - key: data
    #   value: "true"
    #   effect: NoSchedule

  # K3s flags appended to the service unit.
  extra_flags: []
    # - "--node-label=topology.kubernetes.io/zone=oracle-phoenix-1"

# Protection — set true on irreplaceable nodes (A1.Flex Always-Free).
# Enforced by providers/oracle/modules/compute (prevent_destroy).
irreplaceable: false

# SSH access control for this node.
ssh:
  port: 22
  allowed_tailnet_tags:
    - "tag:admin"
