# cluster-identity.yaml.template — Oracle OKE

name: __CLUSTER_NAME__
template: cluster-cloud-oracle-oke
distribution: oke
distribution_version: "TODO"

purpose: "TODO"
status: planned
owner: mateo.segura413@gmail.com
domain: "TODO"

oracle:
  region: "TODO: e.g. us-phoenix-1"
  compartment_id: "TODO"
  node_pools:
    - name: default
      shape: VM.Standard.A1.Flex           # ARM Always-Free eligible
      ocpus: 2
      memory_gb: 12
      size: 2

network:
  cni: flannel                             # OKE default — swap for Cilium where needed
  tailnet_joined: false

platform_services:
  observability:    { enabled: true }
  databases:
    postgresql:     { enabled: true }      # cost-effective on OCI
  messaging:
    nats:           { enabled: true }
  backup:           { enabled: false }
  cost:             { enabled: false }

cost_envelope:
  monthly_usd_target: 0
  monthly_usd_ceiling: 0
