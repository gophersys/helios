# identity.yaml — prod
#
# Production Kubernetes cluster running customer-facing apps (codectl,
# fintel, future). Currently spans OCI Phoenix (Always Free A1.Flex ARM +
# E4.Flex x86 + E2.Micro bastions) and AWS Oregon (t4g.small ARM agent).
# All nodes joined via Tailscale mesh.
#
# This is the ONE cluster today. Lab/staging clusters will be scaffolded
# later using the same cluster-kubernetes-manual-k3s template.

name: prod
template: cluster-kubernetes-manual-k3s
distribution: k3s
distribution_version: "TODO: pin (e.g., v1.31.3+k3s1)"

purpose: "Production — runs customer-facing apps (codectl, fintel)."
status: active
owner: mateo.segura413@gmail.com
domain: "TODO: public DNS zone for ingress (e.g. brain.mateosegura.com)"

# Network topology — every node is on the Tailscale mesh; K3s pod/service
# CIDRs are the defaults.
network:
  cni: cilium                   # core component — chosen at the repo level
  tailnet_joined: true
  pod_cidr: 10.42.0.0/16
  service_cidr: 10.43.0.0/16

# Cluster-level node role assignments. Each node's identity.yaml carries
# the authoritative cluster_role + labels/taints; this block is the
# cluster-level expectation so misconfiguration is visible in one place.
# Ansible applies the declared labels + taints on k3s-join.
node_role_assignments:
  server-00:  data         # OCI A1.Flex ARM 2/12 — hosts Postgres + NATS
  agent-00:   apps         # OCI A1.Flex ARM 2/12 — stateless workloads
  agent-01:   devops       # OCI E4.Flex x86 1/16 — observability stack
  agent-02:   apps         # AWS t4g.small ARM 2/2 — edge capacity

# Admission policies installed on this cluster. "baseline" enforces
# everything in platform/core/policy/CATALOG.md; swap to a stricter or
# looser profile per cluster. Lab clusters might use "audit-only".
policy_profile: baseline

# Projects hosted on this cluster. Namespace-provisioner enforces that
# every <project>-<env> namespace created on this cluster has <project>
# listed here; attempts for other project names are rejected at
# admission. Adding a project requires updating this list + re-applying
# namespace-provisioner.
projects_hosted:
  - codectl
  - fintel
  - finances
  - intelligence
  - music

# Namespace provisioning defaults. When a new namespace matching
# <project>-<env> is created for a project in projects_hosted above,
# the namespace-provisioner applies the env-default quota tier unless
# the namespace requests another via annotation, or a quota_override
# is set below.
namespace_provisioning:
  default_quota_tier_by_env:
    prod:     medium
    staging:  small
    dev:      small
    lab:      small
  auto_netpol: true              # generate baseline NetworkPolicies
  auto_pss_label: true           # label pod-security.kubernetes.io/enforce=restricted
  quota_overrides: {}            # map <project>-<env>: <tier>
    # codectl-prod: large        # example

# Edge stack — how traffic enters this cluster. See platform/core/edge/
# and its CATALOG.md for supported providers + combinations. Apps declare
# ingress.scope (public|tailnet); the edge stack below decides HOW that
# scope is actually served.
edge:
  # Public scope — traffic from the internet (HTTPS). Free-tier stack.
  public:
    tunnel:
      provider: cloudflare-tunnel          # no public IP on the cluster; CF is the edge
      # account ID + tunnel ID supplied via Bitwarden → platform-cloudflare-tunnel
    dns:
      provider: cloudflare                  # CF DNS authoritative for the zones below
      zones:
        - brain.mateosegura.com             # default public zone for this cluster
        - codectl.brain.mateosegura.com     # per-project subdomain
        - fintel.brain.mateosegura.com
        - finances.brain.mateosegura.com
        - intelligence.brain.mateosegura.com
        - music.brain.mateosegura.com
    tls:
      provider: cloudflare-origin           # cluster→CF cert; CF edge handles public TLS

  # Tailnet scope — traffic from the Tailscale mesh (admin UIs, internal APIs).
  tailnet:
    tunnel:
      provider: tailscale                   # cluster nodes are already on the mesh
      tailnet: mateosegura.ts.net
    dns:
      provider: tailscale-magicdns          # <device>.<tailnet>.ts.net
    tls:
      provider: tailscale-cert              # TS-issued, auto-rotated for *.ts.net

# platform/core/* is NOT opted in/out — every cluster gets all of core.
# platform/services/* below is per-cluster opt-in.
platform_services:
  observability: { enabled: true,  version: "TODO" }
  databases:
    postgresql:     { enabled: true,  version: "TODO" }
    redis:          { enabled: false }
  messaging:
    nats:           { enabled: true,  version: "TODO" }
  registry:         { enabled: false }
  admin-dashboard:  { enabled: false }
  identity-sso:     { enabled: false }      # future
  backup:           { enabled: false, note: "enable once first stateful workload lands" }
  cost:             { enabled: false, note: "< $20/mo total cluster spend — low priority" }

# Charts archetypes this cluster is expected to serve. Not enforced; just
# a hint for ops and capacity planning.
chart_archetypes:
  - stateless-app
  - ingress-app
  - worker
  - cronjob
  - job

# SLO targets that apply to the cluster itself (independent of app SLOs).
cluster_slo:
  control_plane_availability: { target: 99.9, window: 30d }
  api_latency:                { target_ms: 250, window: 7d, percentile: 99 }

# Cost envelope — informational; updated by the cost service once enabled.
cost_envelope:
  monthly_usd_target: 30
  monthly_usd_ceiling: 100
  note: "Always-free OCI core + ~$14/mo E4.Flex + ~$4/mo AWS EBS"

# Protection rules for this cluster. Enforced by providers/oracle/ +
# platform/core/policy/.
protection:
  irreplaceable_nodes:
    - server-00
    - agent-00
  prod_volume_delete_requires_override: true
  namespace_delete_requires_override: true

# Members — see nodes/<name>/identity.yaml for each member host. The
# cluster instance does not enumerate members here; clusters/ctl.sh
# validate walks nodes/ to verify the set matches node_role_assignments.
