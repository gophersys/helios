# GENERATED by cictl from .ci/ci.contract.yaml — DO NOT EDIT.
# Re-render with `cictl generate`; the `cictl drift` gate fails on any hand-edit.
name: on-pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # The fast lane: the pr-tier verbs over the affected projects. No real substrate.
  pr:
    name: pr tier (ci-drift, affected-gate-fast)
    runs-on: arc-org
    timeout-minutes: 15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: bash .ci/ctl.sh ci-drift
        env:
          NX_BASE: "origin/${{ github.base_ref }}"
        run: bash .ci/ctl.sh ci-drift
      - name: bash .ci/ctl.sh affected-gate-fast
        env:
          NX_BASE: "origin/${{ github.base_ref }}"
        run: bash .ci/ctl.sh affected-gate-fast

  # The careful-orchestration lane: the merge-tier verbs on the real substrate before merge.
  merge:
    name: merge tier (affected-gate-substrate)
    runs-on: arc-org
    needs: pr
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Start docker host (substrate: docker, k3d, kind, postgres)"
        run: |
          if ! docker info >/dev/null 2>&1; then
            (dockerd >/tmp/dockerd.log 2>&1 &)
            for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          fi
          docker version
      - name: bash .ci/ctl.sh affected-gate-substrate
        env:
          NX_BASE: "origin/${{ github.base_ref }}"
        run: bash .ci/ctl.sh affected-gate-substrate
