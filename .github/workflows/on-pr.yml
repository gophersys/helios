name: on-pr
on:
  pull_request:
    branches: [main]

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    runs-on: arc-org  # the org ARC fleet — same gates as on-push, same image as the devcontainer
    container:
      image: ghcr.io/gophersys/dense-ui-ci:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: ./ctl.sh test
      - run: ./ctl.sh geometry

  review:
    runs-on: arc-review  # the review pool provisions CLAUDE_CODE_OAUTH_TOKEN
                         # (claude-review-token ExternalSecret, infrastructure/)
    steps:
      - uses: actions/checkout@v4
      - name: checkout cictl (the org review standard — repos consume review.sh,
              cictl proves its own guards via review_test.sh)
        uses: actions/checkout@v4
        with:
          repository: gophersys/cictl
          path: .cictl
      - name: pull request review agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .cictl/review/review.sh "${{ github.event.pull_request.number }}"
