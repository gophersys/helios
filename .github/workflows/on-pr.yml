name: on-pr
on:
  pull_request:
    branches: [main]

env:
  PYTHONUNBUFFERED: "1"   # gates must stream — silence is indistinguishable from a hang

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No packages: read. The gates image is a CROSS-REPO private package and
  # GITHUB_TOKEN's packages:read never reached it (eden lesson L3); the pull is
  # made with GHCR_PULL_TOKEN below, so the grant would be a permission nothing
  # uses.
  pull-requests: write

jobs:
  gates:
    # the org ARC fleet — same gates as on-push, same image as on-push. NOT the
    # devcontainer's image yet: .devcontainer/Dockerfile still builds FROM the
    # retired research-ui-ci, and step (5) of docs/image-notes.md closes that gap.
    runs-on: arc-org
    timeout-minutes: 30   # a hung job must fail loudly, not hold the fleet seat for 6h
    container:
      # The org ui CATEGORY image (ADR-0003) — the same image ci.yml runs, so a
      # PR and a push cannot disagree about the toolchain. Cross-repo private
      # package: only GHCR_PULL_TOKEN can pull it (eden lesson L3).
      image: ghcr.io/gophersys/ui:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    env:
      # See ci.yml: the image bakes DENSUI_CHROME, probe.py reads UI_CHROME.
      # Without this the probe silently falls back to a PATH search.
      UI_CHROME: /usr/local/bin/densui-chromium
    steps:
      - uses: actions/checkout@v4
      - run: ./ctl.sh test
      - run: ./ctl.sh geometry
      - run: ./ctl.sh score

  review:
    runs-on: arc-review  # the review pool provisions CLAUDE_CODE_OAUTH_TOKEN
    timeout-minutes: 45
                         # (claude-review-token ExternalSecret, infrastructure/)
    steps:
      - uses: actions/checkout@v4
      - name: checkout cictl (the org review standard — repos consume review.sh,
              cictl proves its own guards via review_test.sh)
        uses: actions/checkout@v4
        with:
          repository: gophersys/cictl
          path: .cictl
      - name: pull request review agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .cictl/review/review.sh "${{ github.event.pull_request.number }}"
