name: on-pr
on:
  pull_request:
    branches: [main]

env:
  PYTHONUNBUFFERED: "1"   # gates must stream — silence is indistinguishable from a hang

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # gates pulls a private ghcr image — declaring this block drops the default read
  pull-requests: write

jobs:
  gates:
    runs-on: arc-org  # the org ARC fleet — same gates as on-push, same image as the devcontainer
    timeout-minutes: 30   # a hung job must fail loudly, not hold the fleet seat for 6h
    container:
      image: ghcr.io/gophersys/research-ui-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: ./ctl.sh test
      - run: ./ctl.sh geometry
      - run: ./ctl.sh score

  review:
    runs-on: arc-review  # the review pool provisions CLAUDE_CODE_OAUTH_TOKEN
    timeout-minutes: 45
                         # (claude-review-token ExternalSecret, infrastructure/)
    steps:
      - uses: actions/checkout@v4
      - name: checkout cictl (the org review standard — repos consume review.sh,
              cictl proves its own guards via review_test.sh)
        uses: actions/checkout@v4
        with:
          repository: gophersys/cictl
          path: .cictl
      - name: pull request review agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .cictl/review/review.sh "${{ github.event.pull_request.number }}"
