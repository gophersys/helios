name: on-pr
on:
  pull_request:
    branches: [main]

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    runs-on: arc-org  # the org ARC fleet — same gates as on-push
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: chromium via playwright (probe tests measure real renders)
        run: |
          npx -y playwright@1.49 install --with-deps chromium
          chrome_bin="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)"
          test -n "$chrome_bin" || { echo "playwright chromium not found" >&2; exit 1; }
          echo "DENSUI_CHROME=$chrome_bin" >> "$GITHUB_ENV"
      - run: ./ctl.sh test

  review:
    runs-on: arc-review  # the review pool provisions CLAUDE_CODE_OAUTH_TOKEN
                         # (claude-review-token ExternalSecret, infrastructure/)
    steps:
      - uses: actions/checkout@v4
      - name: checkout cictl (the org review standard — repos consume review.sh,
              cictl proves its own guards via review_test.sh)
        uses: actions/checkout@v4
        with:
          repository: gophersys/cictl
          path: .cictl
      - name: pull request review agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .cictl/review/review.sh "${{ github.event.pull_request.number }}"
