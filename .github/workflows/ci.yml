name: ci
on:
  push: { branches: [main] }

env:
  PYTHONUNBUFFERED: "1"   # gates must stream — silence is indistinguishable from a hang

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: arc-org  # the org ARC fleet — eden/infrastructure owns the controller
    timeout-minutes: 30   # a hung job must fail loudly, not hold the fleet seat for 6h
    container:
      image: ghcr.io/gophersys/dense-ui-ci:latest   # browser + fonts + uv + node baked
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: gates via the standard entry point
        run: ./ctl.sh test

  geometry:
    runs-on: arc-org
    timeout-minutes: 30
    container:
      image: ghcr.io/gophersys/dense-ui-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: geometry gates (solver + ratio + overlap + sweep + params)
        run: ./ctl.sh geometry
