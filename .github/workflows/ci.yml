name: ci
on:
  push: { branches: [main] }

env:
  PYTHONUNBUFFERED: "1"   # gates must stream — silence is indistinguishable from a hang
  # The org ui image bakes DENSUI_CHROME, named before the densui -> ui rename
  # landed in this repo; tools/ui/src/ui/probe.py reads UI_CHROME. Unset, the
  # probe falls through to its PATH candidate search and can pass WITHOUT ever
  # launching the browser the image baked — a check that proves less than it
  # claims. Naming the image's own entry point makes a missing browser a loud
  # ProbeError instead. Transitional: it goes when ui exports UI_CHROME.
  UI_CHROME: /usr/local/bin/densui-chromium

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: arc-org  # the org ARC fleet — eden/infrastructure owns the controller
    timeout-minutes: 30   # a hung job must fail loudly, not hold the fleet seat for 6h
    container:
      # The org ui CATEGORY image (ADR-0003): browser + DejaVu + uv + node baked,
      # one lineage for every UI repo. It is a CROSS-REPO private package (built
      # by gophersys/.devcontainer), and GITHUB_TOKEN's packages:read reaches
      # only packages linked to THIS repo — eden lesson L3 — so the pull PAT is
      # the credential that can fetch it.
      image: ghcr.io/gophersys/ui:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: gates via the standard entry point
        run: ./ctl.sh test

  geometry:
    runs-on: arc-org
    timeout-minutes: 30
    container:
      image: ghcr.io/gophersys/ui:latest   # same image as `test`, same reason
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: geometry gates (solver + ratio + overlap + sweep + params)
        run: ./ctl.sh geometry
      - name: craft scorecard (seeded corpus; a missed seed fails)
        run: ./ctl.sh score
