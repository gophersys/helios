name: ci
on:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: arc-org  # the org ARC fleet — eden/infrastructure owns the controller
    container:
      image: ghcr.io/gophersys/dense-ui-ci:latest   # browser + fonts + uv + node baked
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: gates via the standard entry point
        run: ./ctl.sh test

  geometry:
    runs-on: arc-org
    container:
      image: ghcr.io/gophersys/dense-ui-ci:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: geometry gates (solver + ratio + overlap + sweep + params)
        run: ./ctl.sh geometry
