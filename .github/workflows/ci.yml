name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — eden/infrastructure owns the controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: chromium via playwright (probe tests measure real renders)
        run: |
          npx -y playwright@1.49 install --with-deps chromium
          chrome_bin="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)"
          test -n "$chrome_bin" || { echo "playwright chromium not found" >&2; exit 1; }
          echo "DENSUI_CHROME=$chrome_bin" >> "$GITHUB_ENV"
      - name: gates via the standard entry point
        run: ./ctl.sh test

  geometry:
    runs-on: arc-org  # same fleet; installs chromium at job time — if the fleet
                      # forbids that, this fails loudly and BLOCKED.md picks it up
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: chromium via playwright (ubuntu apt chromium is a snap stub)
        run: |
          npx -y playwright@1.49 install --with-deps chromium
          chrome_bin="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)"
          test -n "$chrome_bin" || { echo "playwright chromium not found" >&2; exit 1; }
          echo "DENSUI_CHROME=$chrome_bin" >> "$GITHUB_ENV"
      - name: geometry gates (solver + ratio + overlap + sweep + params)
        run: ./ctl.sh geometry
