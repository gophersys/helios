name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — eden/infrastructure owns the controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: gates via the standard entry point
        run: ./ctl.sh test
