# TEMPORARY probe — decides whether GitHub Actions job containers work on the
# ARC dind runners, and whether the .devcontainer images can serve as CI
# toolchains. Delete once the answer is recorded in docs/ci-runners.md.
name: substrate-probe
on:
  push:
    branches: [ci/substrate-probe]

permissions:
  contents: read
  packages: read

jobs:
  # Control: does a job container work at all on arc-org? Public image, no creds.
  public-image:
    runs-on: arc-org
    container:
      image: ghcr.io/gophersys/zephyr-devbox:latest
    steps:
      - uses: actions/checkout@v4
      - name: identity and workspace
        run: |
          echo "whoami=$(whoami) uid=$(id -u) gid=$(id -g)"
          echo "pwd=$(pwd)"; ls -la . | head -5
          echo "can write: $(touch probe.tmp && echo yes || echo NO)"
          echo "GOPHERSYS_DEVCONTAINER=${GOPHERSYS_DEVCONTAINER:-unset}"

  # The real question: a PRIVATE .devcontainer image pulled with GITHUB_TOKEN.
  private-image:
    runs-on: arc-org
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: identity, workspace, toolchain
        run: |
          echo "whoami=$(whoami) uid=$(id -u) gid=$(id -g)"
          echo "pwd=$(pwd)"
          echo "can write: $(touch probe.tmp && echo yes || echo NO)"
          echo "sudo: $(sudo -n true 2>/dev/null && echo yes || echo NO)"
          echo "GOPHERSYS_DEVCONTAINER=${GOPHERSYS_DEVCONTAINER:-unset}"
          for t in git kubectl helm kustomize kubeconform yq jq shellcheck go node python3 docker k3d kind; do
            printf '%-12s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
      - name: does the dind socket reach the job container
        run: docker info >/dev/null 2>&1 && echo "docker: reachable" || echo "docker: NOT reachable"
