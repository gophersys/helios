name: build-and-push

# Builds and publishes every base image in images/*/ to the GitHub
# Container Registry on every push to main. Each image is tagged with
# both `latest` and the short commit SHA. Jobs are sequenced by the
# dependency graph so a child image can always FROM its parent's freshly
# built :latest tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: gophersys

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short-sha
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          file: images/base/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  node:
    needs: [base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
