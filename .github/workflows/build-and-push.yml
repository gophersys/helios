          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

  rust:
    needs: [base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
