name: build-and-push

# Publishes the IDP image set (base + flutter + zephyr + zephyr-devbox + cloud)
# to the GitHub Container Registry. Every image is built for linux/amd64. On
# semver tag pushes (v*) we also publish a :v<semver> tag.
# Flutter and zephyr consume base — and zephyr-devbox consumes zephyr — via
# BASE_TAG build-arg set to the commit short SHA so the child layer FROMs the
# freshly pushed parent.
#
# Every job reads back the manifest it just pushed, at the SHA tag it pushed
# rather than at :latest, so a concurrent run cannot make the assertion describe
# somebody else's image.
#
# ============================================================================
# THE RUNNER IS OURS
# ============================================================================
#
# Every job here runs on the `arc-build` pool: the homelab ARC scale set of that
# name, 6 slots on the three 14Gi pve-00 workers, running this repository's own
# `cloud` image (gophersys/infrastructure docs/ci-substrate.md). It costs no
# GitHub Actions minutes, and this repository moved because the account had 195
# of 2,000 minutes left against a $0 budget.
#
# Every job carried a `jlumbroso/free-disk-space` step and none does now. That
# action reclaims ~25-30 GB by deleting the preinstalled SDKs of a GitHub-hosted
# runner, which is a throwaway VM. On this pool the same deletion would strip
# the NODE, and the blast radius is every pod on it. A build pod gets its
# headroom from the `work` volume the scale set sizes instead. Do not add one
# back: _ctl/tests/workflow-yaml.test.sh reads `uses:` through yq, so this
# sentence is safe to write and the step is not.
#
# ============================================================================
# ONLY WHAT CHANGED IS BUILT
# ============================================================================
#
# A warm rebuild of the whole set measured ~35 minutes on every push to main,
# and most pushes to main touch 1 image or none of them. Each job asks
# `.ci/affected.sh <image>` whether this commit changes that image's inputs, and
# gates its build, its smoke, its push and its manifest read on the answer. The
# path table lives in that file, once — read it for what counts as an input, and
# for why a child declares its parent's paths.
#
# Everything builds on workflow_dispatch, on a tag, and whenever a workflow or
# anything under .ci/ changes.
#
# AN UNBUILT IMAGE KEEPS THE :latest IT ALREADY HAS, and publishes no :<sha> tag
# for this commit. A :<sha> tag is therefore not a promise that every image
# carries that sha. That is the point of the mechanism and not a defect of it.
#
# WHAT IS A DEFECT, AND IS KNOWN: the comparison is against `github.event.before`
# — the previous head of main — and NOT against the commit the published image
# was actually built from. Those differ whenever a run does not finish:
#
#   - push A changes base/ and its run is CANCELLED by push B (the concurrency
#     group above cancels in progress). B's range is B-only, so base never
#     builds for A's change.
#   - push A's base job FAILS. The next push's range starts at A, so nothing
#     retries it.
#
# In both cases the answer today is to re-run the job, or to dispatch the
# workflow, which builds everything. The durable fix is to diff against the
# revision the registry holds — label each published image with
# org.opencontainers.image.revision and read it back — so the range starts at
# the last SUCCESSFUL build rather than at the last push. That is a separate
# change and it is not made here.
#
# ============================================================================
# THE LAYER CACHE IS IN THE REGISTRY
# ============================================================================
#
# type=gha is the Actions cache service, 10 GB per repository across all scopes,
# which 5 images at mode=max cannot fit — the measured hit rate was not worth
# the quota. type=registry puts each image's cache in its own ghcr package,
# ghcr.io/gophersys/<image>-cache, which the pool can read and write with the
# same GITHUB_TOKEN it already pushes with. Those packages do not exist until
# the first run creates them, so the first build logs a cache-from miss and that
# is expected exactly once per image.
#
# base-runner is retired. All 3 ARC pools run `cloud` now, so nothing pulls the
# image and no job builds it. `runner/Dockerfile` stays on disk for one more
# change — its deletion goes with the docs sweep.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Supersede an in-flight run for the same ref so a rapid second push doesn't run two
# expensive image builds in parallel.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: gophersys
  # 1 platform for every image in this workflow. There were 3 keys here, and the
  # 2 narrow ones each carried a measurement: the ARC nodes are amd64, and the 3
  # live zephyr-devbox pods sit on amd64 nodes. The wide one had no such
  # measurement. No arm64 consumer can be verified for any image
  # (gophersys/infrastructure docs/debt-register.md D42), and the arm64 base that
  # was published was an amd64 Ubuntu userland carrying aarch64 Go binaries.
  # This value must equal SANCTIONED_PLATFORMS in _ctl/lib.sh, and the
  # verify-published step in each job is what proves the registry agrees.
  PLATFORMS: linux/amd64

jobs:
  base:
    # A job with no limit inherits the GitHub default of 360 minutes. arc-build
    # has 6 slots and one build wave takes all of them, so a hung job holds a
    # slot for 6 hours. Every timeout in this file is a CEILING sized on the
    # HOSTED runner; the first run on arc-build is what measures the real
    # runtime, and a resize comes from that measurement rather than from a guess.
    timeout-minutes: 90
    runs-on: arc-build
    permissions:
      contents: read
      packages: write
    outputs:
      short: ${{ steps.sha.outputs.short }}
      # Whether this job really built. The child jobs read it: when base did not
      # build, no base:<sha> exists for this commit and a child that FROMs that
      # tag fails on a tag that was never pushed.
      built: ${{ steps.filter.outputs.build }}
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: base:smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: short-sha
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: does this commit change base
        # This step is NOT gated, and neither are the 2 above it: their outputs
        # are what every gate below reads, and what the child jobs read.
        id: filter
        run: bash .ci/affected.sh base >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.filter.outputs.build == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the BuildKit mirror populated
        # The builder step below boots from a ghcr.io image — see the header of
        # .ci/buildx-node.sh. This step is what makes that true on the day the
        # pin moves; every other run is 1 authenticated read of our registry.
        # It sits after the login because the mirror package is private.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/mirror-buildkit.sh
      - name: point buildx at the build nodes
        # Replaces docker/setup-buildx-action. It makes the same
        # docker-container builder — the default docker driver can neither read
        # nor write a registry cache — and it owns the arm64 switch that reads
        # SANCTIONED_PLATFORMS. Inert today: that list holds linux/amd64 alone.
        # It runs after the registry login: the builder boots by pulling the
        # private BuildKit mirror, and an anonymous pull of it is refused.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/buildx-node.sh
      - name: generate the build args from versions.env
        # The one-home rule reaching CI: one --build-arg per pin line, the same
        # list `base/ctl.sh` generates locally. The Dockerfile's pin gate fails
        # the build naming any pin this step failed to carry.
        if: ${{ steps.filter.outputs.build == 'true' }}
        id: versions
        run: |
          {
            echo 'args<<VERSIONS_EOF'
            sed -e 's/#.*$//' -e 's/[[:space:]]*$//' -e '/^$/d' versions.env
            echo 'VERSIONS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.args }}
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/base-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/base-cache,mode=max
      - name: smoke test (native amd64)
        # The Dockerfile deliberately runs no --version checks: they could not
        # run while this image was cross-built under QEMU. This is where every
        # pin of versions.env is compared against what the image installed, and
        # where the gate toolchain is exercised on a real fixture.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/smoke.sh base ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # build-args, same platform — so buildx resolves every layer from the
        # cache that step wrote and this one only uploads. It writes no cache of
        # its own for that reason.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: ${{ steps.versions.outputs.args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:${{ steps.sha.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/base:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/base-cache
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image. It runs only when this job
        # published, because an unbuilt image has no SHA tag for this commit.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash ./ctl.sh verify-published base ${{ steps.sha.outputs.short }}

  flutter:
    # A job with no limit inherits the GitHub default of 360 minutes. arc-build
    # has 6 slots and one build wave takes all of them, so a hung job holds a
    # slot for 6 hours. Every timeout in this file is a CEILING sized on the
    # HOSTED runner; the first run on arc-build is what measures the real
    # runtime, and a resize comes from that measurement rather than from a guess.
    timeout-minutes: 90
    needs: [base]
    runs-on: arc-build
    permissions:
      contents: read
      packages: write
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: flutter:smoke
      # The parent this layer FROMs. base publishes a :<sha> tag only on a
      # commit that changed it, so when base did not build there is no such tag
      # and the only correct parent is the :latest that is still current.
      BASE_TAG: ${{ needs.base.outputs.built == 'true' && needs.base.outputs.short || 'latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: does this commit change flutter
        # flutter's input set contains base's, so base building implies this job
        # building. The reverse does not hold, which is what BASE_TAG answers.
        id: filter
        run: bash .ci/affected.sh flutter >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.filter.outputs.build == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the BuildKit mirror populated
        # The builder step below boots from a ghcr.io image — see the header of
        # .ci/buildx-node.sh. This step is what makes that true on the day the
        # pin moves; every other run is 1 authenticated read of our registry.
        # It sits after the login because the mirror package is private.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/mirror-buildkit.sh
      - name: point buildx at the build nodes
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/buildx-node.sh
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: flutter
          file: flutter/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/flutter-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/flutter-cache,mode=max
      - name: smoke test (native amd64)
        # flutter inherits every tool of base, so the pins of versions.env are
        # compared here too, and the flutter SDK is checked on top of them.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/smoke.sh flutter ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # build-args, same platform — so buildx resolves every layer from the
        # cache that step wrote and this one only uploads. It writes no cache of
        # its own for that reason.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: flutter
          file: flutter/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/flutter:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/flutter:${{ needs.base.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/flutter:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/flutter-cache
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image. It runs only when this job
        # published, because an unbuilt image has no SHA tag for this commit.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash ./ctl.sh verify-published flutter ${{ needs.base.outputs.short }}

  zephyr:
    # A job with no limit inherits the GitHub default of 360 minutes. arc-build
    # has 6 slots and one build wave takes all of them, so a hung job holds a
    # slot for 6 hours. Every timeout in this file is a CEILING sized on the
    # HOSTED runner; the first run on arc-build is what measures the real
    # runtime, and a resize comes from that measurement rather than from a guess.
    timeout-minutes: 90
    needs: [base]
    runs-on: arc-build
    permissions:
      contents: read
      packages: write
    outputs:
      # zephyr-devbox FROMs zephyr, and reads this for the same reason the
      # children of base read base's: a job that did not build pushed no :<sha>.
      built: ${{ steps.filter.outputs.build }}
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: zephyr:smoke
      # The parent this layer FROMs. base publishes a :<sha> tag only on a
      # commit that changed it, so when base did not build there is no such tag
      # and the only correct parent is the :latest that is still current.
      BASE_TAG: ${{ needs.base.outputs.built == 'true' && needs.base.outputs.short || 'latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: does this commit change zephyr
        # zephyr's input set contains base's, so base building implies this job
        # building. The reverse does not hold, which is what BASE_TAG answers.
        id: filter
        run: bash .ci/affected.sh zephyr >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.filter.outputs.build == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the BuildKit mirror populated
        # The builder step below boots from a ghcr.io image — see the header of
        # .ci/buildx-node.sh. This step is what makes that true on the day the
        # pin moves; every other run is 1 authenticated read of our registry.
        # It sits after the login because the mirror package is private.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/mirror-buildkit.sh
      - name: point buildx at the build nodes
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/buildx-node.sh
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: zephyr
          file: zephyr/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-cache,mode=max
      - name: smoke test (native amd64)
        # zephyr inherits every tool of base, so the pins of versions.env are
        # compared here too, and west is checked on top of them.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/smoke.sh zephyr ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # build-args, same platform — so buildx resolves every layer from the
        # cache that step wrote and this one only uploads. It writes no cache of
        # its own for that reason.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: zephyr
          file: zephyr/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr:${{ needs.base.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/zephyr:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-cache
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image. It runs only when this job
        # published, because an unbuilt image has no SHA tag for this commit.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash ./ctl.sh verify-published zephyr ${{ needs.base.outputs.short }}

  zephyr-devbox:
    # A job with no limit inherits the GitHub default of 360 minutes. arc-build
    # has 6 slots and one build wave takes all of them, so a hung job holds a
    # slot for 6 hours. Every timeout in this file is a CEILING sized on the
    # HOSTED runner; the first run on arc-build is what measures the real
    # runtime, and a resize comes from that measurement rather than from a guess.
    timeout-minutes: 90
    # Layers on zephyr the same way zephyr layers on base, so it FROMs the
    # zephyr this run just pushed. It needs base as well, for the one short SHA
    # every job of the run tags with.
    needs: [base, zephyr]
    runs-on: arc-build
    permissions:
      contents: read
      packages: write
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: zephyr-devbox:smoke
      # The parent is zephyr, so it is ZEPHYR's verdict that decides whether a
      # :<sha> tag exists to FROM. base's short sha is still the tag zephyr
      # pushed under, because every job of a run shares one commit.
      BASE_TAG: ${{ needs.zephyr.outputs.built == 'true' && needs.base.outputs.short || 'latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: does this commit change zephyr-devbox
        # This image's input set contains zephyr's, which contains base's, so a
        # parent that builds always brings its children with it.
        id: filter
        run: bash .ci/affected.sh zephyr-devbox >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.filter.outputs.build == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the BuildKit mirror populated
        # The builder step below boots from a ghcr.io image — see the header of
        # .ci/buildx-node.sh. This step is what makes that true on the day the
        # pin moves; every other run is 1 authenticated read of our registry.
        # It sits after the login because the mirror package is private.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/mirror-buildkit.sh
      - name: point buildx at the build nodes
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/buildx-node.sh
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: zephyr-devbox
          file: zephyr-devbox/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-devbox-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-devbox-cache,mode=max
      - name: smoke test (native amd64)
        # The devbox image defaults to root for sshd, and the smoke forces the
        # dev user so the base checks run in the identity the other images use.
        # The flash/debug stack, the SDK toolchains and `sshd -t` are checked on
        # top of every pin of versions.env.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/smoke.sh zephyr-devbox ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # build-args, same platform — so buildx resolves every layer from the
        # cache that step wrote and this one only uploads. It writes no cache of
        # its own for that reason.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: zephyr-devbox
          file: zephyr-devbox/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-devbox:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-devbox:${{ needs.base.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/zephyr-devbox:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/zephyr-devbox-cache
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image. It runs only when this job
        # published, because an unbuilt image has no SHA tag for this commit.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash ./ctl.sh verify-published zephyr-devbox ${{ needs.base.outputs.short }}

  # The cloud image: the reduced base + the CI fold (image-architecture, ledger
  # #94). ADDITIVE and independent — FROM ubuntu directly, no needs. Its gate
  # order is the one the publish-order test demands: build to the local store,
  # smoke the loaded image (content checks + the 5.75 GB size gate), and only
  # then push. The build context is the REPOSITORY ROOT because versions.env
  # and _delta/ sit beside the image directories, and every version pin arrives
  # as a build-arg generated from versions.env — the one home for every pin.
  #
  # It is also the image every ARC pool runs, this workflow's own runner
  # included, so a bad cloud build is felt by the next job of every repository.
  cloud:
    # A job with no limit inherits the GitHub default of 360 minutes. arc-build
    # has 6 slots and one build wave takes all of them, so a hung job holds a
    # slot for 6 hours. Every timeout in this file is a CEILING sized on the
    # HOSTED runner; the first run on arc-build is what measures the real
    # runtime, and a resize comes from that measurement rather than from a guess.
    timeout-minutes: 90
    runs-on: arc-build
    permissions:
      contents: read
      packages: write
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: cloud:smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: short-sha
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: does this commit change cloud
        id: filter
        run: bash .ci/affected.sh cloud >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.filter.outputs.build == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the BuildKit mirror populated
        # The builder step below boots from a ghcr.io image — see the header of
        # .ci/buildx-node.sh. This step is what makes that true on the day the
        # pin moves; every other run is 1 authenticated read of our registry.
        # It sits after the login because the mirror package is private.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/mirror-buildkit.sh
      - name: point buildx at the build nodes
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/buildx-node.sh
      - name: generate the build args from versions.env
        # The one-home rule reaching CI: one --build-arg per pin line, the same
        # list `cloud/ctl.sh` generates locally. The Dockerfile's pin gate fails
        # the build naming any pin this step failed to carry.
        if: ${{ steps.filter.outputs.build == 'true' }}
        id: versions
        run: |
          {
            echo 'args<<VERSIONS_EOF'
            sed -e 's/#.*$//' -e 's/[[:space:]]*$//' -e '/^$/d' versions.env
            echo 'VERSIONS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          build-args: ${{ steps.versions.outputs.args }}
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/cloud-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/cloud-cache,mode=max
      - name: smoke test (native amd64)
        # Content checks for every kept tool group, the CI fold, the harness
        # bake, the absent-Go-cache assertion, and the 5.75 GB size gate (R4).
        # It runs the LOADED image, which is the exact build the publish step
        # below then copies to ghcr.io.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash .ci/smoke.sh cloud ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # build-args, same platform — so buildx resolves every layer from the
        # cache that step wrote and this one only uploads. It writes no cache of
        # its own for that reason.
        if: ${{ steps.filter.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: ${{ steps.versions.outputs.args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cloud:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/cloud:${{ steps.sha.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/cloud:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/cloud-cache
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image. It runs only when this job
        # published, because an unbuilt image has no SHA tag for this commit.
        if: ${{ steps.filter.outputs.build == 'true' }}
        run: bash ./ctl.sh verify-published cloud ${{ steps.sha.outputs.short }}
