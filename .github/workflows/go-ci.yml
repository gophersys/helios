name: go-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: arc-org
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... 2>&1 | tail -5
