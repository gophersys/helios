name: harness-conformance

# ADR-0021 — proves the PINNED harness versions are conformant with the adapters. Triggered when
# the version manifest changes, when the libs POINTER moves (an adapter edit reaches this
# repository only as a submodule bump) or when one of the 2 asserts below changes. Runs inside the
# base devcontainer image (which carries bun + the Go gate toolchain), installs the EXACT pinned
# harnesses via post-create, then runs the per-adapter conformance + the live gated tests (real
# harness + real provider) against them. A protocol drift fails HERE, in the PR.
#
# THE JOB NEVER RUNS IN A DEGRADED MODE. Its whole value is the claim "this pin is safe to merge",
# so an input it cannot verify is a FAILURE, never a skip:
#   - assert-harness-conformance-preconditions.sh stops the run when a live credential is absent
#     or when an installed harness does not carry its pin from harnesses/versions.env;
#   - assert-peer-messaging-available.sh stops the run when a `claude -p` session of the installed
#     version cannot reach the cross-session messaging socket, with a named cause here instead of
#     "no message received" much later;
#   - assert-no-skipped-tests.sh stops the run when any test skipped, so a test that quietly
#     opts out can no longer report success.
# There are no outside contributors: every credential this job needs is available to every run.

on:
  pull_request:
    paths:
      - "harnesses/versions.env"
      # The libs POINTER, not its content. libs is a submodule, so a superproject diff carries the
      # gitlink path `libs` and never a path inside it: the filter this replaces —
      # libs/go/agentsession/** — matched nothing, ever, and this job has never run on an adapter
      # change. The cost is accepted deliberately: a pointer bump that touches no adapter also runs
      # the live suite, because a superproject cannot filter submodule content.
      - "libs"
      # The 2 asserts that decide whether this job may run at all. A change to either one is a
      # change to the job's own honesty, so it is proven by the job it guards.
      - "scripts/assert-harness-conformance-preconditions.sh"
      - "scripts/assert-peer-messaging-available.sh"
  workflow_dispatch:

concurrency:
  group: harness-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  conformance:
    name: pinned-harness conformance
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    # The GitHub default is 360 minutes, which on a paid runner is 6 hours of billing for a job that
    # hung. Its successful runs take 12 to 18 minutes today (10 runs measured), so 30 is roughly
    # double the worst one: a run that reaches it is stuck, not slow.
    timeout-minutes: 30
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      # Job containers run as root (the GitHub Actions convention): the runner's file-command temp
      # files are host-runner-owned, so the image's non-root dev user EACCESes them.
      options: --user root
    env:
      # Keep the dev-user layout even as root: the harness installers target $HOME/.local/bin and
      # the image's ENV PATH carries /home/dev/.local/bin (+ the corepack/nvm caches live there).
      HOME: /home/dev
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT (the same secret harness-upgrade-check opens PRs with): the job's
          # GITHUB_TOKEN cannot clone the PRIVATE sibling submodules (libs / infrastructure /
          # .devcontainer) — checkout reuses this token for the recursive submodule fetch.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      # Job steps run as root while the checkout may be written under a different uid (the runner's)
      # — mark the workspace + submodules trusted so git/nx affected work (disposable CI container).
      - name: Trust the workspace checkout (git safe.directory)
        run: git config --global --add safe.directory '*'
      # The apps' gate verbs resolve sibling libs through the WORKSPACE go.work, which is
      # gitignored — regenerate it from the tracked curated module list (the same generator the
      # deploy image builds run).
      - name: Generate go.work (tracked generator over the gitignored file)
        run: bash scripts/gen-go-work.sh

      - name: Install the pinned harnesses (claude + omp + codex)
        env:
          # Read the in-repo manifest rather than the /workspace default (CI checks out elsewhere).
          HARNESS_VERSIONS_FILE: ${{ github.workspace }}/harnesses/versions.env
        run: bash .devcontainer/base/ctl.sh post-create

      # The gate on the gate. It prints every version under test, and it stops the job when a live
      # credential is absent or an installed harness drifted off its pin. It runs BEFORE the tests
      # so a missing input costs one step, not a whole suite that would have proven nothing.
      - name: Assert the preconditions (live credentials + the 3 harness pins)
        env:
          # Bootstrap credentials for the live arm (ADR-0021). Absent -> the live tests would SKIP
          # and only the fixtures would run, which is NOT a merge-eligible verification of a pin
          # bump. The assert turns that silent degradation into a red job.
          CLAUDEADAPTER_LIVE_TOKEN: ${{ secrets.CLAUDEADAPTER_LIVE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Read the in-repo manifest rather than the /workspace default (CI checks out elsewhere).
          HARNESS_VERSIONS_FILE: ${{ github.workspace }}/harnesses/versions.env
        run: bash scripts/assert-harness-conformance-preconditions.sh

      # The messaging preflight. The fleet program depends on one session reaching another over the
      # same-host socket, and a session that cannot reach it fails at the far end of the suite as
      # "no message received", which names no cause. This step names it here. Below claude 2.1.224
      # the capability does not exist: the step prints UNEXERCISED, starts no session and passes.
      - name: Assert peer messaging is available to a claude -p session
        env:
          # Above the band flip the step starts one real `claude -p` turn, so it needs the same
          # bootstrap credential as the live arm. Absent there -> a named failure, never a skip.
          CLAUDEADAPTER_LIVE_TOKEN: ${{ secrets.CLAUDEADAPTER_LIVE_TOKEN }}
        run: bash scripts/assert-peer-messaging-available.sh

      # ARCHITECTURE is gated HERE and not in libs' own nightly. The frozen contracts live in
      # this repository (docs/architecture/contracts/), and libs' _eden_monorepo_root resolves to
      # eden only when libs is a SUBMODULE — which it is here and is not in libs' standalone CI.
      # There the dimension could never pass, and because `phase-gate all` short-circuits at phase
      # 1 it took implementation, testing and qa down with it: 14 of 18 nightly runs red, ~20s
      # median, a deep lane proving nothing. Ruled option A 2026-08-25, ratified 2026-08-26.
      # Runs BEFORE the live adapter step so a contract failure costs seconds, not a live turn.
      - name: Frozen-contract gate for the libraries whose contracts live here
        run: |
          set -Eeuo pipefail
          gated=0
          for contract in docs/architecture/contracts/*.md; do
            lib="$(basename "${contract%.md}")"
            [ "$lib" = "README" ] && continue
            [ -f "libs/go/$lib/ctl.sh" ] || continue
            echo "::group::phase-gate architecture — $lib"
            ( cd "libs/go/$lib" && bash ./ctl.sh phase-gate architecture )
            echo "::endgroup::"
            gated=$((gated + 1))
          done
          # A gate that selected nothing is not evidence. Say so and fail, rather than reporting a
          # green that checked no contract at all.
          if [ "$gated" -eq 0 ]; then
            echo "no library was gated: every contract in docs/architecture/contracts/ lacks a" >&2
            echo "matching libs/go/<lib>/ctl.sh, so this step verified nothing" >&2
            exit 1
          fi
          echo "frozen-contract gate: $gated librar(y/ies) gated"

      - name: Adapter conformance + live gated tests against the pinned versions
        env:
          CLAUDEADAPTER_LIVE_TOKEN: ${{ secrets.CLAUDEADAPTER_LIVE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          cd libs/go/agentsession
          bash "${GITHUB_WORKSPACE}/scripts/assert-no-skipped-tests.sh" \
            -tags integration -race ./... -count=1
