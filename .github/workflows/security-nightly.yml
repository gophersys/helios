name: security-nightly

# Scans the 5 published images for CRITICAL vulnerabilities every night, and
# reports the night ubuntu moves under the digest this repository pins.
#
# It runs on arc-build, the homelab pool this repository's builds moved to. A
# nightly on a GitHub-hosted runner cost ~50 minutes of a 2,000-minute account
# every night, and the account had 195 left. The scan job carried a
# `jlumbroso/free-disk-space` step and no longer does, for the reason
# build-and-push states: that action empties a throwaway hosted VM, and on this
# pool the same deletion strips the NODE.
#
# Nothing here builds or publishes an image. A nightly republish would move
# :latest with no commit behind it, so 2 different images would carry the same
# SHA tag and verify-published could not say which one it read. This workflow
# only MEASURES; the answer to what it finds is a pull request.
#
# A scheduled run has no author watching it, so the notify job below turns a red
# into 1 labelled issue and a green into the closing of that same issue.
# _ctl/tests/scheduled-workflows.test.sh holds that shape in the pull request
# gate, keyed on the schedule trigger rather than on this file's name.

on:
  schedule:
    # 09:00 UTC, which is 02:00 MST — cron is UTC, and America/Phoenix keeps no
    # DST, so that local hour is the same one every night of the year. It is the
    # quiet window for this repository: build-and-push runs on a push to main,
    # and nobody pushes to main then, so this scan does not race a publish and
    # read an image being replaced.
    - cron: "0 9 * * *"
  workflow_dispatch:

# The notifier opens, comments on and closes 1 issue. Without issues: write the
# filer step fails, and a run that is already red gets a second red instead of a
# notification.
permissions:
  contents: read
  issues: write

env:
  # The scanner, pinned. The vulnerability DATABASE moves every day and that is
  # the point of a nightly; the ENGINE moving under us is not. Bumping this is a
  # version change like any other.
  TRIVY_VERSION: v0.74.0 # latest stable as of 2026-08-16

jobs:
  scan:
    # A job with no limit inherits the GitHub default of 360 minutes, and a hung
    # scan would hold a slot for 6 hours every night. 30 is a CEILING measured on
    # the hosted runner; the first nightly on arc-build measures the real one.
    timeout-minutes: 30
    runs-on: arc-build
    permissions:
      contents: read
      # Read-only: this workflow publishes nothing. The grant is here because
      # the images are read out of ghcr.io, and an anonymous pull of a private
      # package is a 401 that says nothing about the image.
      packages: read
    strategy:
      # Every image is scanned, every night. Without this the first CRITICAL
      # cancels its 4 siblings, and the morning report names 1 image out of 5
      # while saying nothing about the other 4.
      fail-fast: false
      # arc-build has 6 slots and every repository's builds share them. 5 trivy
      # jobs at once would take the whole pool for the length of the scan, and
      # the scan is not urgent — it runs at 02:00 MST with nobody waiting.
      max-parallel: 3
      matrix:
        image: [base, flutter, zephyr, zephyr-devbox, cloud]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install trivy at the pinned version
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: scan ghcr.io/gophersys/${{ matrix.image }}:latest
        # --exit-code 1 is what makes this a GATE. With --exit-code 0 trivy
        # prints its table, the step succeeds, the run is green, and nobody
        # reads the log of a scheduled job.
        #
        # There is deliberately no --ignore-unfixed. An unfixed CRITICAL has to
        # become an entry in .ci/trivyignore.yaml carrying a reason and an
        # expiry, which is a visible line in a diff, and never a silent skip.
        #
        # --ignorefile is not optional: the YAML ignore file is experimental in
        # trivy and is loaded ONLY when its path is given, so without this flag
        # every waiver in that file is dead text.
        #
        # A failed vulnerability-database download exits non-zero here as well,
        # so a night on which nothing could be downloaded is a red run and never
        # a clean image.
        env:
          # Trivy unpacks every layer of a multi-GB image. RUNNER_TEMP is on the
          # `work` volume the scale set sizes; the default $HOME/.cache/trivy is
          # on the container file system, which the kubelet caps with the pod's
          # ephemeral-storage limit and evicts the pod for exceeding.
          #
          # It is a STEP env and not a job env: the `runner` context is not
          # available in `jobs.<id>.env`, and a workflow that names it there is
          # rejected whole — an "Unrecognized named-value" that never runs.
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignorefile .ci/trivyignore.yaml \
            ghcr.io/gophersys/${{ matrix.image }}:latest

  base-currency:
    timeout-minutes: 10
    runs-on: arc-build
    steps:
      - uses: actions/checkout@v4
      - name: the registry still holds the digest UBUNTU_BASE_REF pins
        # A digest pin freezes the base OS until a bump merges, so a pull
        # request nobody opens means unpatched images that look current. This
        # step is the half that reports it, and it is why the pin and the
        # nightly ship together.
        run: bash ./ctl.sh base-currency

  notify:
    # This job runs whatever the 2 jobs above did — a job that ran only on
    # failure could not close the issue on a green night.
    #
    # !cancelled() and not always(), which is the stricter half of that pair. A
    # cancelled run reduces to a non-success verdict like any other, so under
    # always() a run a human stopped would file a red issue about itself; the
    # label is the whole mechanism for being read at 09:00 UTC, and a label that
    # carries noise stops being read. Nothing is lost on a real failure: a
    # failed job is not a cancelled one.
    if: ${{ !cancelled() }}
    needs: [scan, base-currency]
    timeout-minutes: 10
    runs-on: arc-build
    steps:
      - uses: actions/checkout@v4
      - name: reduce the verdict of the jobs above to this job's own status
        # GitHub scopes failure() in a step to the STEPS of its own job. This
        # job runs under !cancelled(), so its own steps succeed whatever the
        # scan did, and a notifier guarded by failure() would never fire. This
        # step fails when a needed job failed, which is what gives the 2 steps
        # below a status to read.
        run: |
          scan='${{ needs.scan.result }}'
          currency='${{ needs.base-currency.result }}'
          printf 'scan=%s base-currency=%s\n' "$scan" "$currency"
          [[ "$scan" == "success" && "$currency" == "success" ]]
      - name: file the failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # QUOTED, and it has to be. Both arguments carry ': ', and a PLAIN
        # scalar holding that is read as the start of a mapping value where a
        # mapping cannot start: the document is rejected, GitHub refuses the
        # whole workflow, and a workflow that never runs never fails.
        run: 'bash .ci/notify-failure.sh "image scan: ${{ needs.scan.result }}" "base-OS currency: ${{ needs.base-currency.result }}"'
      - name: close the issue on a green run
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .ci/notify-failure.sh --resolve
