# The pull request review agent.
#
# This is NOT a build gate. It is a step in the development process: an agent
# reads the change with no memory of writing it, and comments. The author fixes
# the findings and pushes again. The loop is bounded at 2 rounds.
#
# It runs on `arc-review`, a pool with no dind sidecar and its own Claude
# credential. The credential is an environment variable on that pool, so it is
# readable by every job that runs there — which is why the pool runs this
# workflow and nothing else.
#
# The reviewer itself lives in gophersys/cictl (public), so 20 repositories share
# 1 copy of the instructions instead of 20 that drift.
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only 1 review per pull request at a time. A second push while a review is
# running cancels it: reviewing a diff that has already changed wastes the budget.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: arc-review
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The reviewer reads history to judge a change against what came
          # before, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_BUDGET_USD: "25"
        run: |
          set -euo pipefail
          # cictl is on PATH in the runner image, but the reviewer's instructions
          # ship with its source. Fetch the pinned copy rather than vendoring a
          # second one that would drift.
          git clone --depth 1 https://github.com/gophersys/cictl /tmp/cictl
          bash /tmp/cictl/review/review.sh "${{ github.event.pull_request.number }}"
