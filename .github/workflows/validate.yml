name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: arc-org          # self-hosted (ARC)
    steps:
      - uses: actions/checkout@v4

      # No tool-install step. The runner image IS the `base` dev image, so
      # kubeconform, kubectl, yq and jq are already present at the same versions
      # an interactive session gets. kustomize is `kubectl kustomize`.
      # See docs/ci-substrate.md.
      - name: yamllint (advisory)
        continue-on-error: true
        run: python3 -m yamllint -c .yamllint.yml apps platform clusters 2>/dev/null || echo "yamllint skipped"

      - name: kubeconform — raw manifests
        run: |
          set -euo pipefail
          # Static roots + every path an Argo registry Application actually deploys,
          # so a new Application source dir (e.g. platform/core/edge/...) can never
          # silently escape validation.
          roots="apps platform/services/gitops/registry platform/core/secrets-operator/manifests"
          while IFS= read -r p; do
            case "$p" in *'{{'*|'') continue;; esac
            [ -d "$p" ] && roots="$roots $p"
          done < <(grep -hE '^[[:space:]]*path:' platform/services/gitops/registry/*.yaml | sed -E "s/.*path:[[:space:]]*//; s/['\"]//g" | sort -u)
          # shellcheck disable=SC2086  # intentional word-splitting of the roots list
          # Skip roots that no longer exist. A deleted directory must not fail a
          # validation that otherwise passed — that reads as a real failure and
          # trains people to ignore red.
          roots=$(for r in $roots; do [ -d "$r" ] && printf '%s ' "$r"; done)
          find $roots \
            -name '*.yaml' -not -path '*/config-enforce/*' -not -path '*/zephyr-devbox/*' -not -path '*/envs/*' -not -name 'kustomization.yaml' \
            -print0 | sort -zu | xargs -0 -r kubeconform -strict -ignore-missing-schemas -summary

      - name: kubeconform — kustomize overlays
        run: |
          set -euo pipefail
          for d in apps/embedded/zephyr-devbox/base apps/embedded/envs/zephyr-libs apps/embedded/envs/nucleo-bringup; do
            echo "== $d =="; kubectl kustomize "$d" | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: Argo registry paths resolve
        run: bash scripts/verify-registry-paths.sh

      - name: qBittorrent config-enforce — tests + drift guard
        run: |
          set -euo pipefail
          cd apps/music/qbittorrent/config-enforce
          python3 test_enforce_qbt.py
          diff <(python3 gen_configmap.py) ../15-config-enforce.configmap.yaml \
            || { echo "::error::15-config-enforce.configmap.yaml is stale"; exit 1; }

  shellcheck:
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          cd /tmp
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar xJ || exit 0
          cd "$GITHUB_WORKSPACE"
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r /tmp/shellcheck-v0.10.0/shellcheck -S warning || true

  exposure:
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: verify declared exposure matches reality
        # Fails the build when a hostname drifts from contracts/exposure.yaml.
        # This check exists because grafana.mateosegura.com silently moved from
        # tailnet to public and no document noticed for weeks.
        run: bash scripts/verify-exposure.sh
