name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org          # self-hosted (ARC)
    steps:
      - uses: actions/checkout@v4

      # No tool-install step. The runner image IS the `base` dev image, so
      # kubeconform, kubectl, yq, jq and shellcheck are already present at the
      # same versions an interactive session gets. kustomize is
      # `kubectl kustomize`. See docs/ci-substrate.md.
      #
      # There is no yamllint step. It was advisory, its output was sent to
      # /dev/null, and its failure was converted to an echo, so it enforced
      # nothing — and yamllint is not in the runner image, so it never ran at
      # all. A check that is believed and does nothing is worse than no check.
      # To bring it back: add yamllint to the base image, fix what it reports,
      # and add it here with no continue-on-error.
      - name: kubeconform — raw manifests
        run: |
          set -euo pipefail
          # Static roots + every path an Argo registry Application actually deploys,
          # so a new Application source dir (e.g. platform/core/edge/...) can never
          # silently escape validation.
          roots="apps platform/services/gitops/registry platform/core/secrets-operator/manifests"
          while IFS= read -r p; do
            case "$p" in *'{{'*|'') continue;; esac
            [ -d "$p" ] && roots="$roots $p"
          done < <(grep -hE '^[[:space:]]*path:' platform/services/gitops/registry/*.yaml | sed -E "s/.*path:[[:space:]]*//; s/['\"]//g" | sort -u)
          # shellcheck disable=SC2086  # intentional word-splitting of the roots list
          # Skip roots that no longer exist. A deleted directory must not fail a
          # validation that otherwise passed — that reads as a real failure and
          # trains people to ignore red.
          roots=$(for r in $roots; do [ -d "$r" ] && printf '%s ' "$r"; done)
          find $roots \
            -name '*.yaml' -not -path '*/config-enforce/*' -not -path '*/zephyr-devbox/*' -not -path '*/envs/*' -not -name 'kustomization.yaml' \
            -print0 | sort -zu | xargs -0 -r kubeconform -strict -ignore-missing-schemas -summary

      - name: kubeconform — kustomize overlays
        run: |
          set -euo pipefail
          for d in apps/embedded/zephyr-devbox/base apps/embedded/envs/zephyr-libs apps/embedded/envs/nucleo-bringup; do
            echo "== $d =="; kubectl kustomize "$d" | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: Argo registry paths resolve
        run: bash scripts/verify-registry-paths.sh

      # Took over the only 2 checks worth keeping from the deleted .ci/ layer:
      # contract front-matter + required sections, and chart READMEs. The rest of
      # .ci/ was unreferenced, and its validate-platform verb failed with 9
      # errors that were all the check being wrong. See docs/debt-register.md D38.
      - name: contracts and charts structure
        run: bash scripts/verify-structure.sh

      # The queue rule reads its own fixtures, so it needs no network and no
      # token. It ran nowhere before this step existed, and a suite that nothing
      # runs is a check that never runs. gh and jq are both on the runner image;
      # the suite exits 127 and names the tool if either one goes missing.
      - name: runner-queue rule — fixture tests
        run: bash scripts/test-verify-runner-queue.sh

      - name: qBittorrent config-enforce — tests + drift guard
        run: |
          set -euo pipefail
          cd apps/music/qbittorrent/config-enforce
          python3 test_enforce_qbt.py
          diff <(python3 gen_configmap.py) ../15-config-enforce.configmap.yaml \
            || { echo "::error::15-config-enforce.configmap.yaml is stale"; exit 1; }

  shellcheck:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      # scripts/lint-shell.sh discovers the scripts, enforces a FLOOR (0 found is
      # a failure, not a silent green), and runs bash -n + shellcheck at full
      # strictness. The old `find … | xargs -0 -r shellcheck` swallowed an empty
      # list: -r ran shellcheck 0 times and exited 0. One home shared with ctl.sh.
      - name: shellcheck
        run: bash scripts/lint-shell.sh
      - name: shellcheck floor — fixture tests
        run: bash scripts/test-lint-shell.sh

  exposure:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: verify declared exposure matches reality
        # Fails the build when a hostname drifts from contracts/exposure.yaml.
        # This check exists because grafana.mateosegura.com silently moved from
        # tailnet to public and no document noticed for weeks.
        run: bash scripts/verify-exposure.sh
