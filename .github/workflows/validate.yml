name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: arc-org          # self-hosted (ARC)
    steps:
      - uses: actions/checkout@v4

      # No tool-install step. The runner image IS the `base` dev image, so
      # kubeconform, kubectl, yq, jq and shellcheck are already present at the
      # same versions an interactive session gets. kustomize is
      # `kubectl kustomize`. See docs/ci-substrate.md.
      #
      # There is no yamllint step. It was advisory, its output was sent to
      # /dev/null, and its failure was converted to an echo, so it enforced
      # nothing — and yamllint is not in the runner image, so it never ran at
      # all. A check that is believed and does nothing is worse than no check.
      # To bring it back: add yamllint to the base image, fix what it reports,
      - name: qBittorrent config-enforce — tests + drift guard
        run: |
          set -euo pipefail
          cd apps/music/qbittorrent/config-enforce
          python3 test_enforce_qbt.py
          diff <(python3 gen_configmap.py) ../15-config-enforce.configmap.yaml \
            || { echo "::error::15-config-enforce.configmap.yaml is stale"; exit 1; }

  shellcheck:
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          # The runner image carries shellcheck, so there is no download to fail
          # silently. Full strictness, no -S filter: ctl.sh states that warning,
          # info and style findings fail the build, and this now matches it.
          # Measured before the change: 0 findings across all 18 scripts.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck

  exposure:
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: verify declared exposure matches reality
        # Fails the build when a hostname drifts from contracts/exposure.yaml.
        # This check exists because grafana.mateosegura.com silently moved from
        # tailnet to public and no document noticed for weeks.
        run: bash scripts/verify-exposure.sh
