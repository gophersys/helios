name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org          # self-hosted (ARC)
    steps:
      - uses: actions/checkout@v4

      # No tool-install step. The runner image IS the `base` dev image, so
      # kubeconform, kubectl, yq, jq and shellcheck are already present at the
      # same versions an interactive session gets. kustomize is
      # `kubectl kustomize`. See docs/ci-substrate.md.
      #
      # There is no yamllint step. It was advisory, its output was sent to
      # /dev/null, and its failure was converted to an echo, so it enforced
      # nothing — and yamllint is not in the runner image, so it never ran at
      # all. A check that is believed and does nothing is worse than no check.
      # To bring it back: add yamllint to the base image, fix what it reports,
      # and add it here with no continue-on-error.
      # scripts/lint-manifests.sh discovers the raw manifests (the static roots +
      # the non-templated registry path: values, minus the 4 excludes), enforces
      # a FLOOR (0 manifests is a failure, not a silent green), and runs
      # kubeconform at full strictness with findings visible. The old
      # `find … | xargs -0 -r kubeconform` swallowed an empty list: -r ran
      # kubeconform 0 times and exited 0.
      - name: kubeconform — raw manifests
        run: bash scripts/lint-manifests.sh

      - name: kubeconform floor — fixture tests
        run: bash scripts/test-lint-manifests.sh

      - name: kubeconform — kustomize overlays
        run: |
          set -euo pipefail
          # The two env overlays died with the devbox tear-down (PR #191);
          # the base follows in the scaffolding-removal PR, taking this
          # whole step with it.
          for d in apps/embedded/zephyr-devbox/base; do
            echo "== $d =="; kubectl kustomize "$d" | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: Argo registry paths resolve
        run: bash scripts/verify-registry-paths.sh

      # kubeconform proves shape only. This pins the PROPERTIES the vault-cache
      # sync depends on — the NetworkPolicy admits the Job pods, one port
      # everywhere, the URL dials the real Service, the shell keeps its failure
      # chain — because a selector typo or a wrong port passes kubeconform AND
      # server dry-run, and then the Job fails every 10 minutes in a namespace
      # nothing alerts on (debt-register D16).
      - name: bw-serve-sync wiring
        run: bash scripts/verify-bw-sync-wiring.sh

      # Took over the only 2 checks worth keeping from the deleted .ci/ layer:
      # contract front-matter + required sections, and chart READMEs. The rest of
      # .ci/ was unreferenced, and its validate-platform verb failed with 9
      # errors that were all the check being wrong. See docs/debt-register.md D38.
      - name: contracts and charts structure
        run: bash scripts/verify-structure.sh

      # The arc-org pool builds arm64 natively on the Mac mini's buildkitd over
      # mTLS (`--driver remote`). This asserts the client CERTS actually reach the
      # pod: one vault-backed Secret carrying exactly ca.pem/cert.pem/key.pem,
      # mounted read-only as a directory, owner-only, at the path the documented
      # buildx step reads. No vault access is needed: it reads manifests only.
      #
      # Its twin, `bash ctl.sh verify-vault-refs`, is deliberately NOT here. That
      # one asks the real Vaultwarden whether each named item resolves to exactly
      # one item, and a runner has neither a route to the vault nor an unlocked
      # session. Adding it here would make it fail for the environment rather than
      # for the property, and the fix for that is always a skip. It is local-only,
      # like verify-access.
      - name: arc-org receives the buildkit client certs
        run: bash scripts/verify-buildx-key.sh

      # The warmer keeps runner images hot by declaring them as initContainers
      # — the kubelet pulls, no privilege. Its pinned ref is a 4th home of the
      # cloud digest the 3 scale-set files pin, and this holds all 4 to one
      # value, and holds the warmer to zero hostPath. Manifest-only, CI-safe.
      - name: warmer pins match the pools, warmer stays unprivileged
        run: bash scripts/verify-warmer-pins.sh

      # Both suites below drive the REAL script against a mktemp fixture tree —
      # a fake kubectl first on PATH for one, a symlink that relocates the
      # script's ROOT for the other. Neither contacts a cluster and neither
      # writes into the tree. They are here for the reason the queue step is: a
      # suite that nothing runs is a check that never runs.
      - name: buildkit-key rule — fixture tests
        run: bash scripts/test-verify-buildx-key.sh

      - name: runner-image rule — fixture tests
        run: bash scripts/test-verify-runner-image.sh

      # The queue rule reads its own fixtures, so it needs no network and no
      # token. It ran nowhere before this step existed, and a suite that nothing
      # runs is a check that never runs. gh and jq are both on the runner image;
      # the suite exits 127 and names the tool if either one goes missing.
      - name: runner-queue rule — fixture tests
        run: bash scripts/test-verify-runner-queue.sh

      - name: qBittorrent config-enforce — tests + drift guard
        run: |
          set -euo pipefail
          cd apps/music/qbittorrent/config-enforce
          python3 test_enforce_qbt.py
          diff <(python3 gen_configmap.py) ../15-config-enforce.configmap.yaml \
            || { echo "::error::15-config-enforce.configmap.yaml is stale"; exit 1; }

  shellcheck:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      # scripts/lint-shell.sh discovers the scripts, enforces a FLOOR (0 found is
      # a failure, not a silent green), and runs bash -n + shellcheck at full
      # strictness. The old `find … | xargs -0 -r shellcheck` swallowed an empty
      # list: -r ran shellcheck 0 times and exited 0. One home shared with ctl.sh.
      - name: shellcheck
        run: bash scripts/lint-shell.sh
      - name: shellcheck floor — fixture tests
        run: bash scripts/test-lint-shell.sh

  exposure:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 10
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: verify declared exposure matches reality
        # Fails the build when a hostname drifts from contracts/exposure.yaml.
        # This check exists because grafana.mateosegura.com silently moved from
        # tailnet to public and no document noticed for weeks.
        run: bash scripts/verify-exposure.sh
