name: on-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: on-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Post-merge re-check: the pr-tier verbs over what the push changed.
  pr:
    name: pr tier (ci-drift, validate, affected-gate-fast)
    runs-on: arc-org
    timeout-minutes: 15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: bash .ci/ctl.sh ci-drift
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh ci-drift
      - name: bash .ci/ctl.sh validate
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh validate
      - name: bash .ci/ctl.sh affected-gate-fast
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh affected-gate-fast
