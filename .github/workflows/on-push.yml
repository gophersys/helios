# GENERATED by cictl from .ci/ci.contract.yaml — DO NOT EDIT.
# Re-render with `cictl generate`; the `cictl drift` gate fails on any hand-edit.
name: on-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: on-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Post-merge re-check: the pr-tier verbs over what the push changed.
  pr:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 25
    name: pr tier (ci-drift, affected-gate-fast)
    runs-on: arc-org
    timeout-minutes: 15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: bash .ci/ctl.sh ci-drift
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh ci-drift
      - name: bash .ci/ctl.sh affected-gate-fast
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh affected-gate-fast
