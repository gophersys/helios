name: release

# Cut a stable Eden release: on a `v<semver>` tag (or a manual dispatch) build + push the four
# deployable images multi-arch to ghcr.io/gophersys/eden/*, then open a digest-pin promotion PR
# against gophersys/infrastructure so Argo CD reconciles the new release onto the home cluster
# (ADR-0022 render catalog + the stable-release-and-home-deploy design). Modelled on the
# .devcontainer build-and-push precedent (multi-arch buildx + GHCR) + harness-upgrade-check (the PR job).
#
# Trigger: a git tag `v*` (the natural stable signal — the render drift test already expects a
# `ghcr.io/gophersys/eden/<service>:<semver>` reference) or workflow_dispatch (the escape hatch).
#
# IMPORTANT: this file is authored BYTE-IDENTICALLY in BOTH .github/workflows/release.yml AND
# .ci/providers/github/release.yml — the provider-pair convention. Edit both together.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Supersede an in-flight run for the same ref so a re-tag/re-dispatch does not run two expensive
# multi-arch builds in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER_PREFIX: gophersys/eden
  PLATFORMS: linux/amd64,linux/arm64
  BASE_IMAGE: ghcr.io/gophersys/base:latest

jobs:
  # ── agentgateway (the stateless NATS→SSE bridge; also the orchestrator binary via a command override) ──
  agentgateway:
    name: build+push agentgateway
    runs-on: arc-org # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT: the job's GITHUB_TOKEN cannot clone the PRIVATE sibling submodules
          # (libs / infrastructure / .devcontainer) the Dockerfiles COPY into the build context.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the release version + short sha
        id: meta
        run: bash .ci/release-meta.sh >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push agentgateway (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/agentgateway.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agentgateway:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agentgateway:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agentgateway:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=agentgateway
          cache-to: type=gha,mode=max,scope=agentgateway

  # ── agent-runtime (the PID-1 agent pod; bakes the pinned Claude Code harness) ──────────────────────
  agent-runtime:
    needs: agentgateway # serial: the ARC fleet provisions one runner at a time (v0.1.1: 3 concurrent jobs never got runners)
    name: build+push agent-runtime
    runs-on: arc-org
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the release version + short sha + pinned Claude Code version
        id: meta
        run: bash .ci/release-meta.sh >> "$GITHUB_OUTPUT"
      # agent-runtime is the ONE image whose FROM is the PRIVATE cross-repo base
      # (ghcr.io/gophersys/base). GITHUB_TOKEN's packages:read covers only packages
      # linked to THIS repo → buildkit got 403 resolving the base (v0.1.2). And a
      # docker config holds ONE identity per registry, so a single buildx invocation
      # cannot pull-as-mateosegura and push-as-GITHUB_TOKEN. Deterministic shape:
      # pre-pull the base into the LOCAL store with the pull PAT, re-login as
      # GITHUB_TOKEN, and build amd64-only on the DOCKER driver (which resolves FROM
      # from the local store) — the home cluster is amd64-only, so nothing is lost.
      # Multi-arch returns when the base package goes public or grants this repo
      # read access (then this job reverts to the sibling jobs' shape).
      - name: Pre-pull the private base image (pull PAT — GITHUB_TOKEN cannot read cross-repo packages)
        run: |
          echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u mateosegura --password-stdin
          docker pull ghcr.io/gophersys/base:latest
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker # local-store FROM resolution (single-platform)
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push agent-runtime (amd64, pinned harness)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/agent-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          # CLAUDE_CODE_VERSION is REQUIRED (no Dockerfile default) — sourced from harnesses/versions.env
          # via release-meta.sh so the pod's baked harness matches the ADR-0021 pin (the ONE home).
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.meta.outputs.claude_code_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agent-runtime:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agent-runtime:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/agent-runtime:sha-${{ steps.meta.outputs.short_sha }}

  # ── platformgateway (Eden's platform HTTP API: users + login + RBAC) ───────────────────────────────
  platformgateway:
    needs: agent-runtime # serial (see agent-runtime)
    name: build+push platformgateway
    runs-on: arc-org
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the release version + short sha
        id: meta
        run: bash .ci/release-meta.sh >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push platformgateway (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/platformgateway/deploy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/platformgateway:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/platformgateway:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/platformgateway:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=platformgateway
          cache-to: type=gha,mode=max,scope=platformgateway

  # ── frontend (the static SvelteKit SPA + nginx same-origin proxy) ──────────────────────────────────
  frontend:
    needs: platformgateway # serial (see agent-runtime); heaviest last
    name: build+push frontend
    runs-on: arc-org
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the release version + short sha
        id: meta
        run: bash .ci/release-meta.sh >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The frontend image consumes the PREBUILT @eden/* library dist (the Svelte build toolchain
      # resolves only through the yarn-4 workspace install, not the lean bun-alpine build stage). Build
      # the libs in the base devcontainer image (the ADR-0022 substrate that carries the toolchain),
      # emitting dist into the checkout; the Dockerfile-scoped .dockerignore un-ignores it for the build.
      - name: Login to GHCR for the base image pull
        run: echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u mateosegura --password-stdin
      - name: Build the @eden/* libraries (dist/ the frontend image consumes)
        run: |
          docker run --rm -u root -e HOME=/home/dev -v "${{ github.workspace }}":/workspace -w /workspace \
            "${{ env.BASE_IMAGE }}" bash -lc '
              git config --global --add safe.directory "*"
              yarn install --immutable
              bash apps/frontend/deploy/build-libs.sh
            '
      - name: Build + push frontend (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/deploy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_PREFIX }}/frontend:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── promote: open the digest-pin PR against gophersys/infrastructure so Argo reconciles the release ──
  promote:
    name: promote (digest-pin PR to infrastructure)
    runs-on: arc-org
    needs: [agentgateway, agent-runtime, platformgateway, frontend]
    permissions:
      contents: read
    steps:
      - name: Resolve the release version
        id: meta
        run: bash .ci/release-meta.sh >> "$GITHUB_OUTPUT"
        # release-meta.sh reads GITHUB_REF; on a tag it emits version=<tag>. workflow_dispatch on a
        # branch emits version=<short-sha>-dispatch (still a valid, unique image ref to pin).
      - name: Checkout gophersys/infrastructure
        uses: actions/checkout@v4
        with:
          repository: gophersys/infrastructure
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          path: infrastructure
          fetch-depth: 0
      - name: Pin the new image digests in apps/eden/*.yaml
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          AGENTGATEWAY_DIGEST: ${{ needs.agentgateway.outputs.digest }}
          AGENT_RUNTIME_DIGEST: ${{ needs.agent-runtime.outputs.digest }}
          PLATFORMGATEWAY_DIGEST: ${{ needs.platformgateway.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
        # The infra half names the Deployment manifests 30-agentgateway.yaml-style under apps/eden.
        # Rewrite is keyed on the `ghcr.io/gophersys/eden/<service>@sha256:` image line (robust to file
        # layout): for each service replace the whole image ref with the freshly-pushed digest. agentgateway
        # AND orchestrator both run the agentgateway image, so both are re-pinned to that one digest.
        run: bash .ci/pin-eden-digests.sh
      - name: Open the promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          # Use the org PAT so the PR triggers infrastructure's own CI (a GITHUB_TOKEN-opened PR does
          # not trigger other workflows). The runner's GITHUB_TOKEN cannot write to the infra repo anyway.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          path: infrastructure
          branch: chore/eden-release-${{ steps.meta.outputs.version }}
          delete-branch: true
          title: "chore(deploy): eden -> ${{ steps.meta.outputs.version }}"
          commit-message: "chore(deploy): eden -> ${{ steps.meta.outputs.version }}"
          body: |
            Automated Eden release promotion (stable-release-and-home-deploy).

            Pins `apps/eden/*` Deployment images to the digests built by the `release` run for
            `${{ steps.meta.outputs.version }}`:

            - agentgateway (+ orchestrator): `${{ needs.agentgateway.outputs.digest }}`
            - agent-runtime: `${{ needs.agent-runtime.outputs.digest }}`
            - platformgateway: `${{ needs.platformgateway.outputs.digest }}`
            - frontend: `${{ needs.frontend.outputs.digest }}`

            Argo CD reconciles `apps/eden/` onto the home cluster on merge.
