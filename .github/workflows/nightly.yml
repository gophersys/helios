# Re-render with `cictl generate`; the `cictl drift` gate fails on any hand-edit.
name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  # The exhaustive lane: every nightly-tier verb on the full substrate, on a schedule.
  nightly:
    name: nightly tier (gate-all, updatability)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Start docker host (substrate: docker, k3d, kind, postgres, minio, nats)"
        run: |
          if ! docker info >/dev/null 2>&1; then
            (dockerd >/tmp/dockerd.log 2>&1 &)
            for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          fi
          docker version
      - name: bash .ci/ctl.sh gate-all
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh gate-all
      - name: bash .ci/ctl.sh updatability
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh updatability
