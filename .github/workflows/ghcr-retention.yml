# Weekly ghcr cleanup for workspaces-api (our single-arch image): keep :latest +
# the 8 most-recent versions. Scoped to OUR package — Eden's multi-arch packages
# are the Eden agent's domain. See .github/scripts/prune-ghcr.py.
name: ghcr-retention
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "dry run", type: boolean, default: true }
  schedule:
    - cron: "0 5 * * 0"
permissions:
  contents: read
jobs:
  prune:
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ARC_APP_ID }}
          private-key: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          owner: gophersys
      - name: Prune
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KEEP: "8"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: python3 .github/scripts/prune-ghcr.py
