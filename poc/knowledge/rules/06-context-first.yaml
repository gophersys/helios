id: go/context-first
class: C1
category: idiom
statement: >-
  If a function takes a context.Context it is the first parameter and it is
  named ctx. Contexts are never stored in structs and never replaced by a
  package-level context.
rationale: >-
  A uniform context position makes cancellation auditable at a glance and
  composes with every API in the ecosystem. Struct-stored contexts outlive
  their request scope and leak cancellation semantics.
applicability: >-
  Any function or method that performs cancellable or deadline-bound work.
exceptions:
  - >-
    Methods implementing a third-party interface whose signature fixes a
    different parameter order.
  - >-
    A struct field holding a context is acceptable only for the documented
    http.Request-style carrier pattern.
example:
  good: |
    func (r *Retrier) Do(ctx context.Context, operation func(ctx context.Context) error) error
  bad: |
    func (r *Retrier) Do(operation func() error, ctx context.Context) error // ctx buried
oracle:
  kind: analyzer
  ref: contextfirst
fix_hint: >-
  Move the context.Context to the first parameter position and name it ctx.
provenance:
  - source: "Go blog, 'Go Concurrency Patterns: Context' + context package docs"
    tier: 2
  - source: "Go Code Review Comments — contexts"
    tier: 2
staleness: { go_minimum: "1.7", review_by: "2027-06" }
status: VERIFIED
hypothesis_baseline_violation: low
