id: go/errors-astype
class: C1
category: post-cutoff
statement: >-
  To extract a typed error from an error tree use the generic
  errors.AsType[E](err) (Go 1.26), not errors.As(err, &target). AsType is
  type-safe at compile time, needs no pre-declared target variable, and is
  faster.
rationale: >-
  errors.As takes any (interface{}) and panics at runtime on a mis-typed
  target; the 1.26 generic form moves that to compile time and reads as a
  single expression. The Go release notes describe it as a "type-safe, faster
  alternative to As". New code on Go >= 1.26 has no reason to use the old form.
applicability: >-
  Code on Go >= 1.26 that branches on a typed error in an error tree.
exceptions:
  - Code that must build on Go < 1.26 keeps errors.As.
  - >-
    Matching against an interface type with errors.As where the target type
    is only known dynamically.
example:
  good: |
    if transient, ok := errors.AsType[*TransientError](err); ok {
        delay = transient.RetryAfter
    }
  bad: |
    var transient *TransientError
    if errors.As(err, &transient) { delay = transient.RetryAfter }
oracle:
  kind: analyzer
  ref: errorsastype
fix_hint: >-
  Replace `var t *T; errors.As(err, &t)` with `t, ok := errors.AsType[*T](err)`
  (Go 1.26+).
provenance:
  - source: "Go 1.26 release notes — errors: new generic AsType function (go.dev/doc/go1.26)"
    tier: 1
staleness: { go_minimum: "1.26", review_by: "2026-12" }
probe:
  question: >-
    In the latest Go release, what is the most idiomatic way to extract a
    typed error (say *MyError) from an error tree? Show one line of code.
  expect_markers: ["errors.AsType", "AsType["]
status: VERIFIED
hypothesis_baseline_violation: high
