id: go/constructor-purity
class: C1
category: architecture
statement: >-
  A constructor (any exported function whose name is New or starts with New)
  must be pure: it must not directly call time.Now, time.Sleep, timers,
  os.Getenv/LookupEnv/Environ, file I/O (os.Open/ReadFile/WriteFile/Create),
  network I/O (net.Dial*, http.Get/Post/...), or randomness (math/rand,
  crypto/rand.Read). All environmental effects enter through injected
  dependencies.
rationale: >-
  New(configuration, dependencies) is the helios spine: a pure constructor
  makes every component substitutable, deterministic to test, and forces the
  composition root to own all wiring. A constructor that reads the clock or
  the environment hides an input and makes behavior untestable without
  patching globals.
applicability: >-
  Any non-main, non-test package that defines an exported constructor.
exceptions:
  - >-
    Defaulting a missing dependency to a real adapter (e.g. if deps.Clock ==
    nil { deps.Clock = systemClock{} }) is allowed: the adapter's methods may
    touch the environment at call time, but the constructor itself stays pure.
  - package main / composition roots are exempt — wiring is their job.
example:
  good: |
    type Clock interface{ Now() time.Time }
    func New(cfg Config, deps Dependencies) (*Limiter, error) {
        if deps.Clock == nil { deps.Clock = systemClock{} } // adapter default: allowed
        return &Limiter{clock: deps.Clock, capacity: cfg.Capacity}, nil
    }
  bad: |
    func New(cfg Config) (*Limiter, error) {
        return &Limiter{last: time.Now(), capacity: cfg.Capacity}, nil // hidden input
    }
oracle:
  kind: analyzer
  ref: constructorpurity
fix_hint: >-
  Inject the effect as a dependency (e.g. a Clock interface with Now()) and
  default it to a real adapter when nil; never call the environment directly
  inside New*.
provenance:
  - source: "helios LIBRARY-SYSTEM.md §1.5 (hexagonal everywhere; New(configuration, dependencies) pure)"
    tier: 4
  - source: "Google Go Style Guide — best practices: dependency injection over global state"
    tier: 2
  - source: "Dave Cheney, 'SOLID Go Design' (GolangUK 2016) — dependency inversion"
    tier: 3
staleness: { go_minimum: "1.18", review_by: "2027-06" }
status: VERIFIED
hypothesis_baseline_violation: medium
