id: go/environment-confinement
class: C1
category: architecture
statement: >-
  os.Getenv, os.LookupEnv and os.Environ may be called only in package main
  (the composition root). Library packages receive configuration as values or
  through an injected source function — never by reading the process
  environment themselves.
rationale: >-
  Environment reads scattered through libraries create hidden global inputs:
  tests interfere with each other, behavior differs between hosts, and the
  composition root loses authority over wiring. 12-factor "config in the
  environment" applies to the deployable, not to every package.
applicability: >-
  Any library (non-main) package; binds whenever configuration values are
  needed.
exceptions:
  - package main and cmd/* composition roots — reading the environment is exactly their job.
  - test files using t.Setenv to exercise a composition root.
example:
  good: |
    // library
    type Source func(key string) (value string, found bool)
    func Load(source Source) (Config, error) { v, ok := source("HELIOS_PORT"); ... }
    // main
    cfg, err := configuration.Load(func(k string) (string, bool) { return os.LookupEnv(k) })
  bad: |
    // library
    func Load() (Config, error) {
        port := os.Getenv("HELIOS_PORT") // hidden global input in a library
        ...
    }
oracle:
  kind: analyzer
  ref: environmentconfinement
fix_hint: >-
  Accept a source function (func(key string) (string, bool)) or a resolved
  Config value; let package main read the real environment and inject it.
provenance:
  - source: "helios LIBRARY-SYSTEM.md §2 (no `if environment == ...` in business code; stage selects injected wiring at the composition root only)"
    tier: 4
  - source: "The Twelve-Factor App, factor III — config (scoped to the deploy, not the package)"
    tier: 3
  - source: "Peter Bourgon, 'Go best practices, six years in' — flag/env parsing belongs in func main"
    tier: 3
staleness: { go_minimum: "1.18", review_by: "2027-06" }
status: VERIFIED
hypothesis_baseline_violation: medium
