# compose.yaml — run the agentsession-spike container.
#
# Security posture mirrors 07 §3 (agent sandboxing):
#   - workspace is the ONLY writable bind                (./workspace -> /workspace)
#   - no ports published                                  (dial-out only; nothing listens)
#   - the OAuth token enters ONLY via env_file at runtime (never an image layer)
#   - read-only root filesystem + dropped caps + no-new-privileges
#
# Usage:
#   1. Mint the token once on a workstation:   claude setup-token
#   2. Create ./.env (gitignored) with:        CLAUDE_CODE_OAUTH_TOKEN=<token>
#   3. mkdir -p ./workspace
#   4. docker compose run --rm agentsession   (one-shot; --rm cleans up)
#
# The DUMMY-token plumbing test (README §"What was tested"):
#   echo 'CLAUDE_CODE_OAUTH_TOKEN=dummy-not-a-real-token' > .env
#   docker compose run --rm agentsession   # expect a clean auth error, non-zero exit

services:
  agentsession:
    build:
      context: .
      # Bump deliberately; keep image reproducible. Matches the Dockerfile default.
      args:
        CLAUDE_CODE_VERSION: "2.1.153"
    image: eden/agentsession-spike:pinned

    # The token (and only the token) arrives here, at runtime, from a gitignored file.
    env_file:
      - .env

    # Pass-through knobs for experimentation (all optional; entrypoint has defaults).
    environment:
      TASK: "${TASK:-}"
      ALLOWED_TOOLS: "${ALLOWED_TOOLS:-}"

    # The agent's only writable surface. Create ./workspace before running.
    volumes:
      - ./workspace:/workspace

    working_dir: /workspace
    user: "node"

    # --- hardening: a misbehaving agent gets the smallest possible blast radius -------
    read_only: true                 # root fs is immutable; only the named volume writes
    tmpfs:
      - /tmp                         # scratch the CLI may need; wiped on exit
      - /home/node/.claude           # CLI runtime state; ephemeral, never persisted
    cap_drop:
      - ALL                          # no Linux capabilities
    security_opt:
      - no-new-privileges:true       # cannot gain privileges via setuid binaries

    # No `ports:` and no `expose:`. Dial-out only — the container opens no listeners.
    # Egress restriction (model endpoint + granted tools, default deny) is an F1/network
    # -policy concern enforced at the pod/cluster layer in the real system (07 §3); the
    # compose file documents the intent but does not implement L3 egress filtering.

    restart: "no"                    # one-shot spike, not a long-running service
