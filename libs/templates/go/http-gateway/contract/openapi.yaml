          description: The caller does not hold the `resource:create` grant.
    get:
      operationId: listResources
      summary: "List resources (paginated, newest-first)."
      description: "Requires the `resource:read` grant. Returns a page of resources with the resolved limit/offset window."
      parameters:
        - in: query
          name: limit
          required: false
          description: "Page size (default 50, max 200)."
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: "Page offset (0-based)."
          schema:
            type: integer
      responses:
        "200":
          description: Success.
          content:
            application/json:
