        "401":
          description: Missing or invalid bearer token (the gateway is behind auth even locally).
        "403":
          description: The caller does not hold the `resource:read` grant.
  /resources/{id}:
    get:
      operationId: getResource
      summary: "Get a resource by id."
      description: "Requires the `resource:read` grant. A missing resource is a 404."
      parameters:
        - in: path
          name: id
          required: true
