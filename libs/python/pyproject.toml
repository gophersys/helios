[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corekinect"
dynamic = ["version"]
description = "Corekinect test framework for IoT device validation"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=5.0",
    "requests>=2.31.0",
    "minio>=7.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "termcolor>=2.0",
    "sqlalchemy>=2.0",
    "sshtunnel>=0.4.0",
    "paramiko>=3.0,<4.0",
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[project.optional-dependencies]
vault = ["hvac>=2.0"]
pandas = ["pandas>=2.0"]

[tool.hatch.version]
path = "corekinect/__init__.py"

# Hatch's default wheel target picks up Python packages auto-detected
# from the source root. Spell out which ones to ship — corekinect (the
# main package) and the proto stubs that consumers of corekinect need.
[tool.hatch.build.targets.wheel]
packages = ["corekinect"]

# Pull libs/protocols/ (which lives outside this pyproject's directory
# tree) into the wheel so a fresh `pip install corekinect` ships the
# proto stubs alongside the framework. Without this, every host install
# fails the `from protocols.mtib.mtib_pb2 import ...` import that
# corekinect's own modules do, surfacing as a permanent yellow ImportError
# warning during `corectl test validate`. force-include is a hatch
# affordance that copies external paths into the built wheel; the proto
# .proto source stays put for the firmware / mtib-server consumers.
[tool.hatch.build.targets.wheel.force-include]
"../protocols" = "protocols"
