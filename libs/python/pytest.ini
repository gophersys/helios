[pytest]
testpaths =
    corekinect/test/tests
    corekinect/mtib_client/v1/client/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . ../protocols ..
addopts = -v --tb=short

filterwarnings =
    ignore::DeprecationWarning:grpc.*
    ignore::DeprecationWarning:google.*

# Note: corekinect/utils/tests and corekinect/core_cloud/tests have stale imports
# (ModuleNotFoundError: corekinect.utils.src). Fix those imports before adding here.
