[pytest]
testpaths =
    corekinect/test/tests
    corekinect/mtib_client/v1/client/tests
    corekinect/utils/tests
    corekinect/core_cloud/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . ../protocols ..
addopts = -v --tb=short

filterwarnings =
    ignore::DeprecationWarning:grpc.*
    ignore::DeprecationWarning:google.*
