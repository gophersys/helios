syntax = "proto3";

package mtib_runner;

// This is the main interface used to access all the functionality built 
// into the MTIB hardware.
// 
// This service gets served at port 50051
//
service MtibRunnerV1 {
  // HealthCheck
  rpc HealthCheck(Empty) returns (HealthCheckResponse) {}

  // Hardware/System info
  rpc GetRunnerInfo(Empty) returns (GetRunnerInfoResponse) {}

  // Gpio
  rpc GpioConfig(GpioConfigRequest) returns (GpioConfigResponse) {}
  rpc GpioWrite(GpioWriteRequest) returns (GpioWriteResponse) {}
  rpc GpioRead(GpioReadRequest) returns (GpioReadResponse) {}

  // Adc
  rpc AdcRead(AdcReadRequest) returns (AdcReadResponse) {}
  rpc AdcReadAll(AdcReadAllRequest) returns (AdcReadAllResponse) {}

  // Power
  rpc DutPowerEnable(DutPowerRequest) returns (DutPowerResponse){}
  rpc DutPowerDisable(Empty) returns (DutPowerResponse){}
  rpc DutChargePowerEnable(DutPowerRequest) returns (DutPowerResponse){}
  rpc DutChargePowerDisable(Empty) returns (DutPowerResponse){}

  // Power Consumption
  rpc DutPowerRead(Empty) returns (DutPowerReadResponse) {}

  // Sensors
  rpc AltimeterRead(Empty) returns (AltimeterReadResponse) {}
  rpc AccelRead(Empty) returns (AccelReadResponse) {}

  // Motion
  rpc GetMotionStatus(Empty) returns (GetMotionStatusResponse) {}
  rpc MotionHome(Empty) returns (MotionHomeResponse) {}
  rpc MotionTrigger(MotionTriggerRequest) returns (MotionTriggerResponse) {}
  rpc MotionContinuous(MotionContinuousRequest) returns (MotionContinuousResponse) {}
  rpc MotionStop(Empty) returns (MotionStopResponse) {}

  // Firmware
  rpc ListFwFiles(Empty) returns (ListFwFilesResponse) {}
  rpc UploadFwFile(stream UploadFwFileRequest) returns (UploadFwFileResponse) {}
  rpc DeleteFwFile(DeleteFwFileRequest) returns (DeleteFwFileResponse) {}
  rpc FlashFwFile(FlashFwFileRequest) returns (FlashFwFileResponse) {}

  // Uart streams
  rpc UartStream(stream UartStreamRequest) returns (stream UartStreamResponse) {}
}

// Shared
message Empty{}

// Health Check
message HealthCheckResponse {
  bool ok = 1;
}

// Runner Info (must match MtibRunnerV1Features type in python)
message RunnerFeatures {
  bool dut_power = 1;
  bool motion = 2;
  bool sensor_accel = 3;
  bool sensor_alt = 4;
  bool fw_flash = 5;
  bool joulescope = 6;
}

message GetRunnerInfoResponse {
  string platform = 1;
  string hw_version = 2;
  RunnerFeatures features = 3;
}

// Gpio
enum GpioDirection {
  GPIO_DIRECTION_UNDEFINED = 0;
  GPIO_DIRECTION_INPUT = 1;
  GPIO_DIRECTION_OUTPUT = 2;
}

enum GpioResistorConfig {
  GPIO_RESISTOR_UNDEFINED = 0;
  GPIO_RESISTOR_PULL_UP = 1;
  GPIO_RESISTOR_PULL_DOWN = 2;
}

message GpioConfigRequest {
  int32 gpio = 1;
  GpioDirection direction = 2;
  GpioResistorConfig resistor = 3;
}

message GpioConfigResponse {
  bool success = 1;
  string message = 2;
}

message GpioWriteRequest {
  int32 gpio = 1;
  bool state = 2;
}

message GpioWriteResponse {
  bool success = 1;
  string message = 2;
}

message GpioReadRequest {
  int32 gpio = 1;
}

message GpioReadResponse {
  bool success = 1;
  string message = 2;
  bool state = 3;
}

// Adc
message AdcReadRequest{
  int32 channel = 1;
  int32 delay_ms = 2;
}

message AdcReadResponse{
  bool success = 1;
  string message = 2;
  double voltage_v = 3;
}

message AdcReadAllRequest{
  int32 delay_ms = 1;
}

message AdcReadAllResponse{
  bool success = 1;
  string message = 2;
  repeated double voltages_v = 3;
}

// Power
message DutPowerRequest {
  double voltage_v = 1;
}

message DutPowerResponse {
  bool success = 1;
  string message = 2;
}

// Power Monitor
message DutPowerReadResponse {
  bool success = 1;
  string message = 2;

  double current_a = 3;
  double voltage_v = 4;
  double power_w = 5;
}

// Sensors
message AltimeterReadResponse {
  bool success = 1;
  string message = 2;

  double temperature_f = 3; 
  double pressure_hg = 4;
  double altitude_ft = 5;
}

message AccelReadResponse {
  bool success = 1;
  string message = 2;

  double x_g = 3;
  double y_g = 4;
  double z_g = 5;
}

// Motion
message MotionHomeResponse {
  bool success = 1; 
  string message = 2;
}

enum MotionStatus {
  MOTION_STATUS_UNDEFINED = 0;
  MOTION_STATUS_IDLE = 1;
  MOTION_STATUS_MOVING = 2;
  MOTION_STATUS_ERRORED = 3;
}

message GetMotionStatusResponse {
  bool success = 1; 
  string message = 2;

  MotionStatus status = 3;
}

message MotionTriggerRequest {
  int32 num_cycles = 1;
  int32 cycle_time_seconds = 2;
}

message MotionTriggerResponse {
  bool success = 1; 
  string message = 2;
}

message MotionContinuousRequest {
  oneof value {
    int32 duration_seconds = 1;
    int32 duration_hours = 2;
  }
}

message MotionContinuousResponse {
  bool success = 1; 
  string message = 2;
}

message MotionStopResponse {
  bool success = 1; 
  string message = 2;
}

// Firmware
enum HostType {
  HOST_TYPE_UNDEFINED = 0;
  HOST_TYPE_NRF9160_MCU = 1;
  HOST_TYPE_NRF9160_MODEM = 2;
  HOST_TYPE_NRF52840 = 3;
  HOST_TYPE_NRF5340 = 4;
}

message FwFileInfo {
  string name = 1;
  HostType target = 2;
  int64 size_b = 3;
  string sha256_digest = 4;
}

message ListFwFilesResponse {
  repeated FwFileInfo files = 1;
}

message UploadFwFileRequest {
  string name = 1;
  HostType target = 2;

  bytes content = 4;
}

message UploadFwFileResponse {
  bool success = 1;
  string message = 2;

  string sha256_digest = 3;
}

message DeleteFwFileRequest {
  FwFileInfo file_info = 1;
}

message DeleteFwFileResponse {
  bool success = 1;
  string message = 2;
}

message FlashFwFileRequest {
  FwFileInfo file_info = 1;
}

message FlashFwFileResponse {
  bool success = 1;
  string message = 2;

  int32 time_ms = 3;
}

// Uart streams
message UartStreamRequest {
  HostType target = 1;
  bytes data = 2;
}

message UartStreamResponse {
  bool success = 1;
  string message = 2;

  HostType target = 3;
  bytes data = 4; 
}
