syntax = "proto3";

package cluster_test;

service ClusterTest {
  // Performs a health check to ensure the test is at least running.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}

  // Executes a test on a standalone board.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse) {}

  // Stops a test that is currently executing.
  rpc Stop(StopRequest) returns (stream StopResponse) {}
}

// HealthCheck
message HealthCheckRequest {}
message HealthCheckResponse {}

message StepInfo {
  int32 sequence = 1;
  string name = 2;
  string description = 3;
}
  
message TestInfo {
  string uuid = 1;
  string name = 2;
  string description = 3;
  repeated StepInfo steps = 4;
}

message TestStepResult {
  // User populated fields
  string error = 1;                 // Error in execution 
  bool success = 2;                 // Step outcome (PASS/FAIL)
  string detailedResult = 3;        // Optionally include detailed logs or results of the step.
  
  // Application populated fields
  int32 node = 4;                    // Which host this step used
}

// Messages for executing tests on panel boards
message ExecuteRequest {
  string config = 1;            // The UUID of the test we want to run in this cluster
  repeated string nodes = 2;
}

message ExecuteResponse {
  bool stopped = 1;
  int32 sequence = 2;                   // Progress of the test execution as a whole.
  repeated TestStepResult results = 3;  // Array of results, one for each node executing the test.
}

// Messages for stopping a currently running test
message StopRequest {}

message StopResponse {
  string error = 1;
}
