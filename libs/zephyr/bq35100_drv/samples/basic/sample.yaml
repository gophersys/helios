sample:
  name: BQ35100 Basic Sample
  description: Demonstrates BQ35100 fuel gauge driver capabilities
common:
  tags: sensor fuel_gauge i2c
  depends_on: i2c gpio
  harness: console
  harness_config:
    type: one_line
    regex:
      - "BQ35100 Fuel Gauge Sample Application"
tests:
  sample.sensor.bq35100.basic:
    platform_allow: iwsck_a0/nrf54l15/cpuapp
    extra_args:
      - BOARD_ROOT=${ZEPHYR_EXTRA_MODULES}/../../../ck_boards/current
      - DTS_ROOT=${ZEPHYR_EXTRA_MODULES}/../../../ck_boards/current
