syntax = "proto3";

option go_package = "bitbucket.org/corekinect/concord/libs/protocols/cluster_test";

package cluster_test;

service ClusterTest {
  // Performs a health check to ensure the test is at least running.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}

  // Executes a test on a standalone board.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse) {}

  // Stops a test that is currently executing.
  rpc Stop(StopRequest) returns (StopResponse) {}
}

// HealthCheck
message HealthCheckRequest {}
message HealthCheckResponse {}

message StepInfo {
  int32 sequence = 1;
  string name = 2;
  string description = 3;
  bool noPassIsFatal = 4;
}

message TestInfo {
  string uuid = 1;
  string name = 2;
  string defaultConfig = 3; // Default configuration for the test
  string description = 4;
  repeated StepInfo steps = 5;
}

message TestStepResult {
  // User populated fields
  string error = 1;  // Error in execution
  bool success = 2;  // Step outcome (PASS/FAIL)
  string reason = 3; // Human readable string of why step didn't pass
  string details =
      4; // Optional details, ideally in JSON format so they can be parsed later

  // Application populated fields
  string node = 5;  // Which host this step used
  bool timeout = 6; // If the run time had to cancel this node
  int32 sequence = 7;
  string startTime = 8; // When this step started running
  string endTime = 9;   // When this step stopped running
  bool noPassIsFatal =
      10; // If the step fails, will the rest of the test continue?
}

// Messages for executing tests on panel boards
message ExecuteRequest {
  string config = 1; // The UUID of the test we want to run in this cluster
  repeated string nodes = 2;
}

message ExecuteResponse {
  bool stopped = 1;
  int32 sequence = 2;
  repeated TestStepResult results =
      3; // Array of results, one for each node executing the test.
}

// Messages for stopping a currently running test
message StopRequest {}

message StopResponse { string error = 1; }
