// MTIB V2 Protocol - Ultimate Embedded Test Bench for Zephyr RTOS
//
// This protocol defines a comprehensive hardware abstraction for embedded
// development and testing, specifically targeting Zephyr RTOS applications.
//
// Key improvements over V1:
// - Full debug probe support (halt, resume, breakpoints, memory, registers)
// - High-speed power profiling with timestamped samples
// - Logic analyzer with protocol decoding
// - Bus master interfaces (I2C, SPI, CAN)
// - BLE/Thread packet capture
// - Zephyr-specific integrations (shell, logging, twister)

syntax = "proto3";

package mtib.v2;

option go_package = "protocols/mtib_v2";

// =============================================================================
// Common Types
// =============================================================================

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Error {
  int32 code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Standard response wrapper
message Response {
  bool success = 1;
  string message = 2;
  Error error = 3;
}

// =============================================================================
// Device & Target Management
// =============================================================================

// Supported target architectures
enum Architecture {
  ARCH_UNKNOWN = 0;
  ARCH_ARM_CORTEX_M0 = 1;
  ARCH_ARM_CORTEX_M0_PLUS = 2;
  ARCH_ARM_CORTEX_M3 = 3;
  ARCH_ARM_CORTEX_M4 = 4;
  ARCH_ARM_CORTEX_M7 = 5;
  ARCH_ARM_CORTEX_M33 = 6;
  ARCH_ARM_CORTEX_M55 = 7;
  ARCH_ARM_CORTEX_A53 = 8;
  ARCH_RISCV_32 = 20;
  ARCH_RISCV_64 = 21;
  ARCH_XTENSA_LX6 = 30;
  ARCH_XTENSA_LX7 = 31;
}

// Target device definition
message TargetDevice {
  string id = 1;                    // Unique identifier (e.g., "nrf52840_dk")
  string name = 2;                  // Human-readable name
  Architecture arch = 3;
  string chip = 4;                  // Chip name (e.g., "nRF52840")
  string board = 5;                 // Zephyr board name

  // Capabilities
  bool has_debug = 6;
  bool has_uart = 7;
  bool has_rtt = 8;
  bool has_swo = 9;
  uint32 flash_size_kb = 10;
  uint32 ram_size_kb = 11;
}

// List available targets
message ListTargetsResponse {
  bool success = 1;
  string message = 2;
  repeated TargetDevice targets = 3;
}

// =============================================================================
// Debug Probe Interface
// =============================================================================

enum DebugProbeType {
  PROBE_UNKNOWN = 0;
  PROBE_JLINK = 1;
  PROBE_CMSIS_DAP = 2;
  PROBE_STLINK = 3;
  PROBE_BLACKMAGIC = 4;
  PROBE_OPENOCD = 5;
}

enum DebugState {
  DEBUG_STATE_UNKNOWN = 0;
  DEBUG_STATE_RUNNING = 1;
  DEBUG_STATE_HALTED = 2;
  DEBUG_STATE_RESET = 3;
  DEBUG_STATE_SLEEPING = 4;
  DEBUG_STATE_LOCKUP = 5;
}

message DebugProbe {
  string id = 1;
  DebugProbeType type = 2;
  string serial = 3;
  string firmware_version = 4;
  repeated string supported_targets = 5;
}

message ListProbesResponse {
  bool success = 1;
  string message = 2;
  repeated DebugProbe probes = 3;
}

// Connect to target via debug probe
message DebugConnectRequest {
  string target_id = 1;
  string probe_id = 2;              // Empty = auto-select
  uint32 speed_khz = 3;             // Interface speed (0 = auto)
  bool halt_on_connect = 4;
}

message DebugConnectResponse {
  bool success = 1;
  string message = 2;
  string session_id = 3;            // Use for subsequent debug operations
  DebugState state = 4;
}

// Disconnect from target
message DebugDisconnectRequest {
  string session_id = 1;
}

// Get current debug state
message DebugStatusRequest {
  string session_id = 1;
}

message DebugStatusResponse {
  bool success = 1;
  string message = 2;
  DebugState state = 3;
  uint32 pc = 4;                    // Program counter (if halted)
  string halt_reason = 5;           // Why we halted (breakpoint, watchpoint, etc.)
}

// Execution control
message DebugHaltRequest {
  string session_id = 1;
}

message DebugResumeRequest {
  string session_id = 1;
}

message DebugStepRequest {
  string session_id = 1;
  bool step_over = 2;               // Step over function calls
}

message DebugResetRequest {
  string session_id = 1;
  bool halt_after_reset = 2;
  enum ResetType {
    RESET_NORMAL = 0;
    RESET_HARD = 1;
    RESET_CORE = 2;
    RESET_SYSTEM = 3;
  }
  ResetType type = 3;
}

// Register access
message RegisterValue {
  string name = 1;
  uint32 value = 2;
  uint32 size_bits = 3;
}

message ReadRegistersRequest {
  string session_id = 1;
  repeated string names = 2;        // Empty = all core registers
}

message ReadRegistersResponse {
  bool success = 1;
  string message = 2;
  repeated RegisterValue registers = 3;
}

message WriteRegisterRequest {
  string session_id = 1;
  string name = 2;
  uint32 value = 3;
}

// Memory access
message ReadMemoryRequest {
  string session_id = 1;
  uint64 address = 2;
  uint32 size = 3;
  enum AccessWidth {
    ACCESS_8 = 0;
    ACCESS_16 = 1;
    ACCESS_32 = 2;
  }
  AccessWidth width = 4;
}

message ReadMemoryResponse {
  bool success = 1;
  string message = 2;
  bytes data = 3;
}

message WriteMemoryRequest {
  string session_id = 1;
  uint64 address = 2;
  bytes data = 3;
  enum AccessWidth {
    ACCESS_8 = 0;
    ACCESS_16 = 1;
    ACCESS_32 = 2;
  }
  AccessWidth width = 4;
}

// Breakpoints
enum BreakpointType {
  BP_HARDWARE = 0;
  BP_SOFTWARE = 1;
}

message SetBreakpointRequest {
  string session_id = 1;
  uint64 address = 2;
  BreakpointType type = 3;
}

message SetBreakpointResponse {
  bool success = 1;
  string message = 2;
  uint32 breakpoint_id = 3;
}

message ClearBreakpointRequest {
  string session_id = 1;
  uint32 breakpoint_id = 2;
}

// Watchpoints (data breakpoints)
enum WatchpointMode {
  WATCH_READ = 0;
  WATCH_WRITE = 1;
  WATCH_READ_WRITE = 2;
}

message SetWatchpointRequest {
  string session_id = 1;
  uint64 address = 2;
  uint32 size = 3;
  WatchpointMode mode = 4;
}

message SetWatchpointResponse {
  bool success = 1;
  string message = 2;
  uint32 watchpoint_id = 3;
}

// Stack trace
message StackFrame {
  uint32 level = 1;
  uint64 pc = 2;
  uint64 sp = 3;
  string function = 4;              // Symbol name if available
  string file = 5;
  uint32 line = 6;
}

message BacktraceRequest {
  string session_id = 1;
  uint32 max_frames = 2;
}

message BacktraceResponse {
  bool success = 1;
  string message = 2;
  repeated StackFrame frames = 3;
}

// =============================================================================
// Flash Programming
// =============================================================================

message FlashInfoRequest {
  string session_id = 1;
}

message FlashRegion {
  uint64 start = 1;
  uint64 size = 2;
  uint32 sector_size = 3;
  bool writable = 4;
}

message FlashInfoResponse {
  bool success = 1;
  string message = 2;
  repeated FlashRegion regions = 3;
}

message FlashEraseRequest {
  string session_id = 1;
  uint64 address = 2;               // 0 = full chip erase
  uint64 size = 3;                  // 0 = full chip erase
}

message FlashWriteRequest {
  string session_id = 1;
  uint64 address = 2;
  bytes data = 3;
  bool verify = 4;
}

message FlashWriteResponse {
  bool success = 1;
  string message = 2;
  uint32 bytes_written = 3;
  uint32 time_ms = 4;
}

// Program a firmware file (hex, bin, elf)
message FlashProgramRequest {
  string session_id = 1;
  string filename = 2;              // Name of uploaded file
  bool erase_before = 3;
  bool verify_after = 4;
  bool reset_after = 5;
}

message FlashProgramResponse {
  bool success = 1;
  string message = 2;
  uint32 bytes_programmed = 3;
  uint32 time_ms = 4;
}

// =============================================================================
// RTT (Real-Time Transfer) - Segger RTT protocol
// =============================================================================

message RttStartRequest {
  string session_id = 1;
  uint64 control_block_address = 2; // 0 = auto-detect
}

message RttStartResponse {
  bool success = 1;
  string message = 2;
  uint32 num_up_channels = 3;       // Target -> Host
  uint32 num_down_channels = 4;     // Host -> Target
}

message RttStopRequest {
  string session_id = 1;
}

// Bidirectional RTT streaming
message RttStreamRequest {
  string session_id = 1;
  uint32 channel = 2;
  bytes data = 3;                   // Data to send (can be empty for read-only)
}

message RttStreamResponse {
  bool success = 1;
  string message = 2;
  uint32 channel = 3;
  bytes data = 4;
  Timestamp timestamp = 5;
}

// =============================================================================
// SWO/ITM Trace
// =============================================================================

message SwoStartRequest {
  string session_id = 1;
  uint32 cpu_freq_hz = 2;
  uint32 swo_freq_hz = 3;
  uint32 port_mask = 4;             // Which ITM stimulus ports to enable
}

message SwoStreamResponse {
  uint32 port = 1;
  bytes data = 2;
  Timestamp timestamp = 3;
}

// =============================================================================
// UART Interface
// =============================================================================

enum Parity {
  PARITY_NONE = 0;
  PARITY_ODD = 1;
  PARITY_EVEN = 2;
}

enum StopBits {
  STOP_BITS_1 = 0;
  STOP_BITS_1_5 = 1;
  STOP_BITS_2 = 2;
}

enum FlowControl {
  FLOW_NONE = 0;
  FLOW_RTS_CTS = 1;
  FLOW_XON_XOFF = 2;
}

message UartConfig {
  uint32 baud = 1;
  uint32 data_bits = 2;             // 5-9
  Parity parity = 3;
  StopBits stop_bits = 4;
  FlowControl flow_control = 5;
}

message UartOpenRequest {
  string target_id = 1;
  string port_name = 2;             // e.g., "uart0", "cdc_acm"
  UartConfig config = 3;
}

message UartOpenResponse {
  bool success = 1;
  string message = 2;
  string stream_id = 3;
}

message UartCloseRequest {
  string stream_id = 1;
}

// Bidirectional UART streaming
message UartStreamRequest {
  string stream_id = 1;
  bytes data = 2;
}

message UartStreamResponse {
  bool success = 1;
  string message = 2;
  bytes data = 3;
  Timestamp timestamp = 4;
}

// =============================================================================
// Power Measurement
// =============================================================================

enum PowerChannel {
  POWER_MAIN = 0;
  POWER_VBAT = 1;
  POWER_3V3 = 2;
  POWER_1V8 = 3;
  POWER_CUSTOM_1 = 10;
  POWER_CUSTOM_2 = 11;
}

message PowerConfig {
  PowerChannel channel = 1;
  float voltage_v = 2;              // Source voltage (0 = measure only)
  float current_limit_ma = 3;
  uint32 sample_rate_hz = 4;        // Up to 100kHz for PPK2-class
}

message PowerEnableRequest {
  PowerConfig config = 1;
}

message PowerDisableRequest {
  PowerChannel channel = 1;
}

message PowerStatusRequest {
  PowerChannel channel = 1;
}

message PowerStatusResponse {
  bool success = 1;
  string message = 2;
  bool enabled = 3;
  float voltage_v = 4;
  float current_ma = 5;
  float power_mw = 6;
}

// High-speed power sampling with timestamps
message PowerSample {
  Timestamp timestamp = 1;
  float current_ua = 2;             // Microamps for precision
  float voltage_mv = 3;
}

message PowerStreamRequest {
  PowerChannel channel = 1;
  uint32 sample_rate_hz = 2;
}

message PowerStreamResponse {
  bool success = 1;
  string message = 2;
  repeated PowerSample samples = 3;
}

// Measure over a duration and get statistics
message PowerMeasureRequest {
  PowerChannel channel = 1;
  float duration_s = 2;
  uint32 sample_rate_hz = 3;
}

message PowerMeasureResponse {
  bool success = 1;
  string message = 2;
  float duration_s = 3;
  float average_ua = 4;
  float min_ua = 5;
  float max_ua = 6;
  float energy_uj = 7;
  uint32 sample_count = 8;
  repeated PowerSample samples = 9; // Raw samples if requested
}

// =============================================================================
// Logic Analyzer
// =============================================================================

message LogicChannelConfig {
  uint32 channel = 1;
  string label = 2;
  bool enabled = 3;
}

message LogicCaptureConfig {
  repeated LogicChannelConfig channels = 1;
  uint64 sample_rate_hz = 2;        // Up to 500MHz digital
  float duration_s = 3;

  // Trigger
  bool trigger_enabled = 4;
  uint32 trigger_channel = 5;
  enum TriggerEdge {
    TRIGGER_RISING = 0;
    TRIGGER_FALLING = 1;
    TRIGGER_EITHER = 2;
  }
  TriggerEdge trigger_edge = 6;
  float pre_trigger_s = 7;
}

message LogicCaptureStartRequest {
  LogicCaptureConfig config = 1;
}

message LogicCaptureStartResponse {
  bool success = 1;
  string message = 2;
  string capture_id = 3;
}

message LogicCaptureStatusRequest {
  string capture_id = 1;
}

message LogicCaptureStatusResponse {
  bool success = 1;
  string message = 2;
  enum Status {
    STATUS_WAITING_TRIGGER = 0;
    STATUS_CAPTURING = 1;
    STATUS_COMPLETE = 2;
    STATUS_ERROR = 3;
  }
  Status status = 3;
  float progress = 4;               // 0.0 - 1.0
}

message LogicCaptureStopRequest {
  string capture_id = 1;
}

// Protocol decoder configuration
enum Protocol {
  PROTOCOL_I2C = 0;
  PROTOCOL_SPI = 1;
  PROTOCOL_UART = 2;
  PROTOCOL_1WIRE = 3;
  PROTOCOL_JTAG = 4;
  PROTOCOL_SWD = 5;
  PROTOCOL_CAN = 6;
  PROTOCOL_LIN = 7;
  PROTOCOL_I2S = 8;
  PROTOCOL_PWM = 9;
}

message I2cDecoderConfig {
  uint32 sda_channel = 1;
  uint32 scl_channel = 2;
}

message SpiDecoderConfig {
  uint32 clk_channel = 1;
  uint32 mosi_channel = 2;
  uint32 miso_channel = 3;
  uint32 cs_channel = 4;
  bool cpol = 5;
  bool cpha = 6;
  uint32 bits_per_word = 7;
  bool msb_first = 8;
}

message UartDecoderConfig {
  uint32 rx_channel = 1;
  uint32 tx_channel = 2;
  uint32 baud = 3;
  uint32 data_bits = 4;
  Parity parity = 5;
}

message AddDecoderRequest {
  string capture_id = 1;
  string decoder_name = 2;
  Protocol protocol = 3;
  oneof config {
    I2cDecoderConfig i2c = 10;
    SpiDecoderConfig spi = 11;
    UartDecoderConfig uart = 12;
  }
}

message AddDecoderResponse {
  bool success = 1;
  string message = 2;
  string decoder_id = 3;
}

// Decoded protocol data
message I2cTransaction {
  Timestamp timestamp = 1;
  uint32 address = 2;
  bool read = 3;
  bytes data = 4;
  bool ack = 5;
}

message SpiTransaction {
  Timestamp timestamp = 1;
  bytes mosi_data = 2;
  bytes miso_data = 3;
}

message DecodedData {
  string decoder_id = 1;
  oneof data {
    I2cTransaction i2c = 10;
    SpiTransaction spi = 11;
  }
}

message GetDecodedDataRequest {
  string capture_id = 1;
  string decoder_id = 2;            // Empty = all decoders
}

message GetDecodedDataResponse {
  bool success = 1;
  string message = 2;
  repeated DecodedData data = 3;
}

// =============================================================================
// GPIO Control
// =============================================================================

enum GpioDirection {
  GPIO_INPUT = 0;
  GPIO_OUTPUT = 1;
}

enum GpioPull {
  GPIO_PULL_NONE = 0;
  GPIO_PULL_UP = 1;
  GPIO_PULL_DOWN = 2;
}

message GpioConfigRequest {
  uint32 pin = 1;
  GpioDirection direction = 2;
  GpioPull pull = 3;
  bool open_drain = 4;
}

message GpioWriteRequest {
  uint32 pin = 1;
  bool value = 2;
}

message GpioReadRequest {
  uint32 pin = 1;
}

message GpioReadResponse {
  bool success = 1;
  string message = 2;
  bool value = 3;
}

// Watch for GPIO changes
message GpioWatchRequest {
  uint32 pin = 1;
  enum Edge {
    EDGE_RISING = 0;
    EDGE_FALLING = 1;
    EDGE_BOTH = 2;
  }
  Edge edge = 2;
}

message GpioEventResponse {
  uint32 pin = 1;
  bool value = 2;
  Timestamp timestamp = 3;
}

// =============================================================================
// Bus Master Interfaces (for testing slave devices)
// =============================================================================

// I2C Master
message I2cConfig {
  uint32 bus = 1;
  uint32 speed_hz = 2;              // 100k, 400k, 1M, 3.4M
}

message I2cTransferRequest {
  uint32 bus = 1;
  uint32 address = 2;               // 7-bit address
  bytes write_data = 3;
  uint32 read_size = 4;
  bool repeated_start = 5;
}

message I2cTransferResponse {
  bool success = 1;
  string message = 2;
  bytes read_data = 3;
  bool nak = 4;
}

// I2C scan
message I2cScanRequest {
  uint32 bus = 1;
}

message I2cScanResponse {
  bool success = 1;
  string message = 2;
  repeated uint32 addresses = 3;
}

// SPI Master
message SpiConfig {
  uint32 bus = 1;
  uint32 speed_hz = 2;
  bool cpol = 3;
  bool cpha = 4;
  uint32 bits_per_word = 5;
  bool msb_first = 6;
  uint32 cs_pin = 7;
}

message SpiTransferRequest {
  uint32 bus = 1;
  bytes tx_data = 2;
  uint32 rx_size = 3;               // Can be different from tx for half-duplex
  bool keep_cs_active = 4;
}

message SpiTransferResponse {
  bool success = 1;
  string message = 2;
  bytes rx_data = 3;
}

// CAN Bus
message CanConfig {
  uint32 bus = 1;
  uint32 bitrate = 2;               // 125k, 250k, 500k, 1M
  bool fd_enabled = 3;              // CAN FD
  uint32 fd_data_bitrate = 4;
}

message CanFrame {
  uint32 id = 1;
  bool extended_id = 2;
  bool fd = 3;
  bool brs = 4;                     // Bit rate switch
  bytes data = 5;
  Timestamp timestamp = 6;
}

message CanSendRequest {
  uint32 bus = 1;
  CanFrame frame = 2;
}

message CanReceiveResponse {
  bool success = 1;
  string message = 2;
  CanFrame frame = 3;
}

// CAN filter
message CanFilterConfig {
  uint32 id = 1;
  uint32 mask = 2;
  bool extended = 3;
}

message CanSetFilterRequest {
  uint32 bus = 1;
  repeated CanFilterConfig filters = 2;
}

// =============================================================================
// BLE Interface (for testing BLE peripherals)
// =============================================================================

message BleDevice {
  string address = 1;
  string name = 2;
  int32 rssi = 3;
  bytes advertising_data = 4;
  bool connectable = 5;
}

message BleScanRequest {
  float duration_s = 1;
  bool active = 2;                  // Active vs passive scan
}

message BleScanResponse {
  bool success = 1;
  string message = 2;
  repeated BleDevice devices = 3;
}

message BleConnectRequest {
  string address = 1;
}

message BleConnectResponse {
  bool success = 1;
  string message = 2;
  string connection_id = 3;
}

message BleDisconnectRequest {
  string connection_id = 1;
}

// GATT operations
message BleService {
  string uuid = 1;
  repeated BleCharacteristic characteristics = 2;
}

message BleCharacteristic {
  string uuid = 1;
  uint32 properties = 2;            // Read, write, notify, etc.
  uint32 handle = 3;
}

message BleDiscoverServicesRequest {
  string connection_id = 1;
}

message BleDiscoverServicesResponse {
  bool success = 1;
  string message = 2;
  repeated BleService services = 3;
}

message BleReadRequest {
  string connection_id = 1;
  uint32 handle = 2;
}

message BleReadResponse {
  bool success = 1;
  string message = 2;
  bytes data = 3;
}

message BleWriteRequest {
  string connection_id = 1;
  uint32 handle = 2;
  bytes data = 3;
  bool with_response = 4;
}

message BleNotificationResponse {
  string connection_id = 1;
  uint32 handle = 2;
  bytes data = 3;
  Timestamp timestamp = 4;
}

// =============================================================================
// Zephyr-Specific Integrations
// =============================================================================

// Shell command execution (via UART or RTT)
message ZephyrShellRequest {
  string session_id = 1;            // UART stream_id or debug session_id
  string command = 2;
  float timeout_s = 3;
}

message ZephyrShellResponse {
  bool success = 1;
  string message = 2;
  string output = 3;
  int32 return_code = 4;
}

// Zephyr logging capture
enum ZephyrLogLevel {
  LOG_LEVEL_ERR = 0;
  LOG_LEVEL_WRN = 1;
  LOG_LEVEL_INF = 2;
  LOG_LEVEL_DBG = 3;
}

message ZephyrLogEntry {
  Timestamp timestamp = 1;
  ZephyrLogLevel level = 2;
  string module = 3;
  string message = 4;
  string file = 5;
  uint32 line = 6;
}

message ZephyrLogStreamRequest {
  string session_id = 1;
  ZephyrLogLevel min_level = 2;
  repeated string modules = 3;      // Empty = all modules
}

message ZephyrLogStreamResponse {
  repeated ZephyrLogEntry entries = 1;
}

// Devicetree inspection (requires debug connection with ELF)
message ZephyrDevicetreeRequest {
  string session_id = 1;
}

message ZephyrDevicetreeNode {
  string path = 1;
  string compatible = 2;
  string label = 3;
  string status = 4;
  map<string, string> properties = 5;
  repeated ZephyrDevicetreeNode children = 6;
}

message ZephyrDevicetreeResponse {
  bool success = 1;
  string message = 2;
  ZephyrDevicetreeNode root = 3;
}

// Thread state inspection
message ZephyrThread {
  uint32 id = 1;
  string name = 2;
  enum State {
    STATE_READY = 0;
    STATE_RUNNING = 1;
    STATE_PENDING = 2;
    STATE_SUSPENDED = 3;
    STATE_DEAD = 4;
  }
  State state = 3;
  int32 priority = 4;
  uint32 stack_size = 5;
  uint32 stack_used = 6;
  uint64 cycles = 7;
}

message ZephyrThreadsRequest {
  string session_id = 1;
}

message ZephyrThreadsResponse {
  bool success = 1;
  string message = 2;
  repeated ZephyrThread threads = 3;
}

// =============================================================================
// Test Orchestration
// =============================================================================

message TestResult {
  string name = 1;
  enum Status {
    STATUS_PASS = 0;
    STATUS_FAIL = 1;
    STATUS_SKIP = 2;
    STATUS_ERROR = 3;
  }
  Status status = 2;
  float duration_s = 3;
  string message = 4;
  string log = 5;
}

// Run Zephyr Twister test
message TwisterRunRequest {
  string target_id = 1;
  string test_path = 2;             // e.g., "tests/kernel/threads/thread_apis"
  repeated string extra_args = 3;
  float timeout_s = 4;
}

message TwisterRunResponse {
  bool success = 1;
  string message = 2;
  repeated TestResult results = 3;
  string full_log = 4;
}

// =============================================================================
// File Management (for firmware, configs, logs)
// =============================================================================

message FileInfo {
  string name = 1;
  uint64 size = 2;
  string sha256 = 3;
  Timestamp modified = 4;
}

message ListFilesRequest {
  string directory = 1;
}

message ListFilesResponse {
  bool success = 1;
  string message = 2;
  repeated FileInfo files = 3;
}

message UploadFileRequest {
  string filename = 1;
  bytes chunk = 2;
  bool final_chunk = 3;
}

message UploadFileResponse {
  bool success = 1;
  string message = 2;
  string sha256 = 3;                // Returned on final chunk
}

message DownloadFileRequest {
  string filename = 1;
  uint64 offset = 2;
  uint32 size = 3;
}

message DownloadFileResponse {
  bool success = 1;
  string message = 2;
  bytes data = 3;
  bool eof = 4;
}

message DeleteFileRequest {
  string filename = 1;
}

// =============================================================================
// System & Health
// =============================================================================

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ready = 1;
  string version = 2;
  repeated string errors = 3;
  map<string, string> capabilities = 4;
}

message SystemInfoRequest {}

message SystemInfoResponse {
  bool success = 1;
  string message = 2;
  string hostname = 3;
  string os = 4;
  float cpu_usage = 5;
  float memory_usage = 6;
  float disk_usage = 7;
  Timestamp uptime = 8;
}

// =============================================================================
// Service Definition
// =============================================================================

service MtibV2 {
  // Health & System
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc SystemInfo(SystemInfoRequest) returns (SystemInfoResponse);

  // Target Management
  rpc ListTargets(Empty) returns (ListTargetsResponse);
  rpc ListProbes(Empty) returns (ListProbesResponse);

  // Debug Probe
  rpc DebugConnect(DebugConnectRequest) returns (DebugConnectResponse);
  rpc DebugDisconnect(DebugDisconnectRequest) returns (Response);
  rpc DebugStatus(DebugStatusRequest) returns (DebugStatusResponse);
  rpc DebugHalt(DebugHaltRequest) returns (Response);
  rpc DebugResume(DebugResumeRequest) returns (Response);
  rpc DebugStep(DebugStepRequest) returns (Response);
  rpc DebugReset(DebugResetRequest) returns (Response);
  rpc ReadRegisters(ReadRegistersRequest) returns (ReadRegistersResponse);
  rpc WriteRegister(WriteRegisterRequest) returns (Response);
  rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
  rpc WriteMemory(WriteMemoryRequest) returns (Response);
  rpc SetBreakpoint(SetBreakpointRequest) returns (SetBreakpointResponse);
  rpc ClearBreakpoint(ClearBreakpointRequest) returns (Response);
  rpc SetWatchpoint(SetWatchpointRequest) returns (SetWatchpointResponse);
  rpc Backtrace(BacktraceRequest) returns (BacktraceResponse);

  // Flash Programming
  rpc FlashInfo(FlashInfoRequest) returns (FlashInfoResponse);
  rpc FlashErase(FlashEraseRequest) returns (Response);
  rpc FlashWrite(FlashWriteRequest) returns (FlashWriteResponse);
  rpc FlashProgram(FlashProgramRequest) returns (FlashProgramResponse);

  // RTT
  rpc RttStart(RttStartRequest) returns (RttStartResponse);
  rpc RttStop(RttStopRequest) returns (Response);
  rpc RttStream(stream RttStreamRequest) returns (stream RttStreamResponse);

  // SWO
  rpc SwoStart(SwoStartRequest) returns (Response);
  rpc SwoStop(Empty) returns (Response);
  rpc SwoStream(Empty) returns (stream SwoStreamResponse);

  // UART
  rpc UartOpen(UartOpenRequest) returns (UartOpenResponse);
  rpc UartClose(UartCloseRequest) returns (Response);
  rpc UartStream(stream UartStreamRequest) returns (stream UartStreamResponse);

  // Power
  rpc PowerEnable(PowerEnableRequest) returns (Response);
  rpc PowerDisable(PowerDisableRequest) returns (Response);
  rpc PowerStatus(PowerStatusRequest) returns (PowerStatusResponse);
  rpc PowerStream(PowerStreamRequest) returns (stream PowerStreamResponse);
  rpc PowerMeasure(PowerMeasureRequest) returns (PowerMeasureResponse);

  // Logic Analyzer
  rpc LogicCaptureStart(LogicCaptureStartRequest) returns (LogicCaptureStartResponse);
  rpc LogicCaptureStatus(LogicCaptureStatusRequest) returns (LogicCaptureStatusResponse);
  rpc LogicCaptureStop(LogicCaptureStopRequest) returns (Response);
  rpc AddDecoder(AddDecoderRequest) returns (AddDecoderResponse);
  rpc GetDecodedData(GetDecodedDataRequest) returns (GetDecodedDataResponse);

  // GPIO
  rpc GpioConfig(GpioConfigRequest) returns (Response);
  rpc GpioWrite(GpioWriteRequest) returns (Response);
  rpc GpioRead(GpioReadRequest) returns (GpioReadResponse);
  rpc GpioWatch(GpioWatchRequest) returns (stream GpioEventResponse);

  // I2C Master
  rpc I2cConfigure(I2cConfig) returns (Response);
  rpc I2cTransfer(I2cTransferRequest) returns (I2cTransferResponse);
  rpc I2cScan(I2cScanRequest) returns (I2cScanResponse);

  // SPI Master
  rpc SpiConfigure(SpiConfig) returns (Response);
  rpc SpiTransfer(SpiTransferRequest) returns (SpiTransferResponse);

  // CAN Bus
  rpc CanConfigure(CanConfig) returns (Response);
  rpc CanSend(CanSendRequest) returns (Response);
  rpc CanSetFilter(CanSetFilterRequest) returns (Response);
  rpc CanReceive(Empty) returns (stream CanReceiveResponse);

  // BLE
  rpc BleScan(BleScanRequest) returns (BleScanResponse);
  rpc BleConnect(BleConnectRequest) returns (BleConnectResponse);
  rpc BleDisconnect(BleDisconnectRequest) returns (Response);
  rpc BleDiscoverServices(BleDiscoverServicesRequest) returns (BleDiscoverServicesResponse);
  rpc BleRead(BleReadRequest) returns (BleReadResponse);
  rpc BleWrite(BleWriteRequest) returns (Response);
  rpc BleNotifications(BleConnectRequest) returns (stream BleNotificationResponse);

  // Zephyr-Specific
  rpc ZephyrShell(ZephyrShellRequest) returns (ZephyrShellResponse);
  rpc ZephyrLogStream(ZephyrLogStreamRequest) returns (stream ZephyrLogStreamResponse);
  rpc ZephyrDevicetree(ZephyrDevicetreeRequest) returns (ZephyrDevicetreeResponse);
  rpc ZephyrThreads(ZephyrThreadsRequest) returns (ZephyrThreadsResponse);
  rpc TwisterRun(TwisterRunRequest) returns (TwisterRunResponse);

  // File Management
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (Response);
}
