syntax = "proto3";

option go_package = "bitbucket.org/corekinect/concord/libs/protocols/test_case";

package test_case;

service TestCaseRuntimeService {
  rpc HealthCheck(Empty) returns (HealthCheckResponse) {}

  rpc GetTestInfo(Empty) returns (GetTestInfoResponse) {}

  // Runs a specific test case.
  // 
  // The test is a series of individual steps, that
  // can run serially or in parallel
  rpc Run(RunRequest) returns (stream RunResponse) {}

  // Stops a test that is currently executing. 
  // 
  // Test will stop no matter what. either that
  // or something went terribly wrong, and you are
  // panicking. dont worry, i am too.    :)
  rpc Stop(StopRequest) returns (StopResponse) {}

  // Gets all the assets generated by the test, such as captures,
  // logs, and any additional results
  rpc GetAssets(Empty) returns (GetAssetsResponse) {}
  rpc GetAsset(GetAssetRequest) returns (GetAssetRequest) {}
}


// ----------------------------------------------------------------------
//                                                                 Shared
//  -------------------------------------------------------------------*/
message Empty{}
message HealthCheckResponse{
  bool ok = 1;
}

// ----------------------------------------------------------------------
//                                                                   Test
//  -------------------------------------------------------------------*/
enum TestCaseType {
  TEST_CASE_TYPE_UNDEFINED = 0;
  TEST_CASE_TYPE_VALIDATION = 1;
  TEST_CASE_TYPE_MANUFACTURING = 2;
}

message GetTestInfoResponse {
  TestCaseType type = 1;
   
}

message RunRequest {
  string config = 1;            // The UUID of the test we want to run in this cluster
  repeated string nodes = 2;
}

message RunResponse {
  bool stopped = 1;
  int32 step_sequence = 2;
  repeated TestStepResult results = 3;  // Array of results, one for each node executing the test.
}

// Messages for stopping a currently running test
message StopRequest {}

message StopResponse {
  string error = 1;
}

// ----------------------------------------------------------------------
//                                                                 Assets
//  -------------------------------------------------------------------*/
message Asset {
  string id = 1;
  string name = 2;
}

message GetAssetsResponse {
  repeated Asset assets = 1;
}

message AssetChunk {
  repeated bytes data = 1;
}

message GetAssetRequest {
  string id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
  AssetChunk chunk = 2;
}


// ----------------------------------------------------------------------
//                                                                   Test
//  -------------------------------------------------------------------*/
message StepInfo {
  // Private
  int32 _sequence = 1;

  // Public
  string name = 2;                                     // Unique name for the step
  string description = 3;                              // Human readable description of the step
  bool noPassIsFatal = 4;                              // If step fails, then test will also fail. Default true
  int32 timeoutS = 5;                                  // Execution timeout for step handler
  repeated string dependencies = 6;                    
  repeated string supportedPlatforms = 7;              // "sigma3", "sigma5", "sigma7"
  repeated string supportedHwVersions = 8;             // "A3", "B0", "B1", "C0"     
  repeated string supportedFwVersions = 9;             // "1.x", "2.x"
  repeated string supportedHosts = 10;
  repeated string supportedSocketServerVersions = 11;  // "0.9", "1.x"
  repeated string supportedSocketServerMessages = 12;
}

message TestStepResult {
  // User populated fields
  string error = 1;                 // Error in execution 
  bool success = 2;                 // Step outcome (PASS/FAIL)
  string reason = 3;                // Human readable string of why step didn't pass
  string details = 4;               // Optional details, ideally in JSON format so they can be parsed later
  
  // Application populated fields
  string node = 5;                    // Which host this step used
  bool timeout = 6;                   // If the run time had to cancel this node
  int32 sequence = 7;
  string startTime = 8;               // When this step started running
  string endTime = 9;                 // When this step stopped running
  bool noPassIsFatal = 10;            // If the step fails, will the rest of the test continue?
}