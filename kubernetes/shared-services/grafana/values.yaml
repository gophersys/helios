# Shared Grafana — observability dashboards
# Portable: deploy to any cluster by setting datasource addresses.
#
# Deploy:
#   helm install grafana kubernetes/shared-services/grafana \
#     -n shared-services \
#     --set auth.adminPassword=<password> \
#     --set datasource.clickhouse.password=<clickhouse-pw>
#
# Requires in the cluster:
#   - Prometheus (prometheus-community/prometheus)
#   - kube-state-metrics (prometheus-community/kube-state-metrics)
#   - node-exporter (prometheus-community/prometheus-node-exporter)
#   - ClickHouse with OTEL tables (shared-clickhouse)

replicaCount: 1

image:
  repository: grafana/grafana
  tag: "11.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/arch: arm64

auth:
  adminUser: admin
  adminPassword: ""

ingress:
  enabled: true
  host: "obsv.mateosegura.com"
  clusterIssuer: "letsencrypt"
  tlsSecretName: "grafana-tls"

# Datasources (auto-provisioned)
datasource:
  prometheus:
    enabled: true
    url: "http://prometheus-server.shared-services.svc.cluster.local:80"
  clickhouse:
    enabled: true
    host: "clickhouse.shared-services.svc.cluster.local"
    httpPort: 8123
    database: "fintel_otel"
    user: "default"
    password: ""

# Community dashboards imported via Grafana API after install:
#   15760 - Kubernetes / Views / Pods
#   15759 - Kubernetes / Views / Nodes
#   1860  - Node Exporter Full
#   6417  - Kubernetes Cluster (Prometheus)
#   13770 - Kubernetes All-in-one Cluster Monitoring
#   315   - Kubernetes cluster monitoring (via Prometheus)
