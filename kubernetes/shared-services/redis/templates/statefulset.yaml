apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shared-redis.fullname" . }}
  labels:
    {{- include "shared-redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "shared-redis.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shared-redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shared-redis.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.auth.enabled }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              redis-server
              --appendonly {{ .Values.config.appendonly }}
              --maxmemory {{ .Values.config.maxmemory }}
              --maxmemory-policy {{ .Values.config.maxmemoryPolicy }}
              --requirepass $REDIS_PASSWORD
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shared-redis.fullname" . }}-credentials
                  key: redis-password
          {{- else }}
          args:
            - "--appendonly"
            - {{ .Values.config.appendonly | quote }}
            - "--maxmemory"
            - {{ .Values.config.maxmemory | quote }}
            - "--maxmemory-policy"
            - {{ .Values.config.maxmemoryPolicy | quote }}
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
