apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "shared-postgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    {{- include "shared-postgres.selectorLabels" . | nindent 4 }}
