apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shared-nats.fullname" . }}-config
  labels:
    {{- include "shared-nats.labels" . | nindent 4 }}
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    {{- if .Values.jetstream.enabled }}
    jetstream {
      store_dir: /data/jetstream
      max_mem: {{ .Values.jetstream.memStorage }}
      max_file: {{ .Values.jetstream.fileStorage }}
    }
    {{- end }}
