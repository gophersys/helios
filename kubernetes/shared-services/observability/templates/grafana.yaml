# Grafana Secret
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    {{- include "shared-observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.grafana.adminPassword | quote }}
---
# Grafana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    {{- include "shared-observability.labels" . | nindent 4 }}
data:
  grafana.ini: |
    [server]
    protocol = http
    http_port = 3000
    [security]
    allow_embedding = true
    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    [auth.proxy]
    enabled = true
    header_name = X-WEBAUTH-USER
    header_property = username
    auto_sign_up = true
    headers = Email:X-WEBAUTH-EMAIL
    enable_login_token = false
    sync_ttl = 60
    [auth.anonymous]
    enabled = false
    [analytics]
    reporting_enabled = false
    check_for_updates = false

  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: ClickHouse
        type: grafana-clickhouse-datasource
        uid: clickhouse
        isDefault: true
        editable: false
        jsonData:
          host: {{ .Values.clickhouse.host }}
          port: {{ .Values.clickhouse.port }}
          protocol: native
          username: {{ .Values.clickhouse.user }}
          defaultDatabase: {{ .Values.clickhouse.database }}
          defaultTable: otel_traces
          dialTimeout: 10
          queryTimeout: 60
          tracesToLogs:
            datasourceUid: jaeger
            filterByTraceID: true
        secureJsonData:
          password: ${CLICKHOUSE_PASSWORD}
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger:16686
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          tracesToMetrics:
            datasourceUid: clickhouse
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: jaeger

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: shared
        folder: Shared
        type: file
        disableDeletion: true
        updateIntervalSeconds: 60
        options:
          path: /etc/grafana/provisioning/dashboards
---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "shared-observability.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_INSTALL_PLUGINS
              value: grafana-clickhouse-datasource
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.passwordSecretName }}
                  key: {{ .Values.clickhouse.passwordSecretKey }}
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: data
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: data
          emptyDir: {}
---
# Grafana Service — ClusterIP only
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "shared-observability.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
