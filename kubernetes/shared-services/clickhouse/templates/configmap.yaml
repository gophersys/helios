apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shared-clickhouse.fullname" . }}-config
  labels:
    {{- include "shared-clickhouse.labels" . | nindent 4 }}
data:
  memory.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_memory_usage>{{ .Values.config.maxMemoryUsage }}</max_memory_usage>
        </default>
      </profiles>
      <max_server_memory_usage>{{ .Values.config.maxMemoryUsageForAllQueries }}</max_server_memory_usage>
    </clickhouse>

  users.xml: |
    <clickhouse>
      <users>
        {{- range .Values.databases }}
        <{{ .user }}>
          <password>{{ .password }}</password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>0</access_management>
        </{{ .user }}>
        {{- end }}
      </users>
    </clickhouse>
