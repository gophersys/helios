apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    {{- include "shared-clickhouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.nativePort }}
      targetPort: native
      protocol: TCP
      name: native
  selector:
    {{- include "shared-clickhouse.selectorLabels" . | nindent 4 }}
