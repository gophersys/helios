# Shared ClickHouse — multi-database
# Connect from other namespaces: clickhouse.shared-services.svc.cluster.local

replicaCount: 1

image:
  repository: clickhouse/clickhouse-server
  pullPolicy: IfNotPresent
  tag: "24.8-alpine"

service:
  type: ClusterIP
  httpPort: 8123
  nativePort: 9000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""

# Default admin user
auth:
  adminUser: default
  adminPassword: ""  # Set via --set auth.adminPassword=<password>

# Databases and users created on init
databases:
  - name: codectl_telemetry
    user: codectl
    password: ""  # Set via --set databases[0].password=<password>
  - name: fintel_otel
    user: fintel
    password: ""  # Set via --set databases[1].password=<password>

nodeSelector:
  kubernetes.io/arch: arm64
  kubernetes.io/hostname: code-kit-agent-1

config:
  maxMemoryUsage: "2000000000"           # 2 GB per query
  maxMemoryUsageForAllQueries: "3000000000"  # 3 GB total
  eventRetentionDays: 90
