apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-autoscaler
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: cluster-autoscaler
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: arm64
          containers:
            - name: autoscaler
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["/bin/bash", "/scripts/autoscale.sh"]
              env:
                # OCI
                - name: OCI_TENANCY_OCID
                  value: {{ .Values.oci.tenancyOcid | quote }}
                - name: OCI_USER_OCID
                  value: {{ .Values.oci.userOcid | quote }}
                - name: OCI_FINGERPRINT
                  value: {{ .Values.oci.fingerprint | quote }}
                - name: OCI_REGION
                  value: {{ .Values.oci.region | quote }}
                - name: OCI_COMPARTMENT_OCID
                  value: {{ .Values.oci.compartmentOcid | quote }}
                - name: OCI_PRIVATE_KEY_B64
                  valueFrom:
                    secretKeyRef:
                      name: cluster-autoscaler-credentials
                      key: oci-private-key-b64
                # Tailscale
                - name: TAILSCALE_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cluster-autoscaler-credentials
                      key: tailscale-auth-key
                # K3s
                - name: K3S_SERVER_URL
                  value: {{ .Values.k3s.serverUrl | quote }}
                - name: K3S_VERSION
                  value: {{ .Values.k3s.version | quote }}
                - name: K3S_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cluster-autoscaler-credentials
                      key: k3s-token
                # Profile: x86-workload
                - name: X86_INSTANCE_ID
                  value: {{ .Values.profiles.x86Workload.instanceId | default "" | quote }}
                - name: X86_IDLE_MINUTES
                  value: {{ .Values.profiles.x86Workload.scaleDown.idleMinutes | default 15 | quote }}
                # Profile: arm-overflow
                - name: ARM_PRESSURE_THRESHOLD
                  value: {{ .Values.profiles.armOverflow.match.pressureThreshold | default 85 | quote }}
                - name: ARM_MAX_INSTANCES
                  value: {{ .Values.profiles.armOverflow.maxInstances | default 2 | quote }}
                - name: ARM_SHAPE
                  value: {{ .Values.profiles.armOverflow.shape | default "VM.Standard.A1.Flex" | quote }}
                - name: ARM_OCPUS
                  value: {{ .Values.profiles.armOverflow.ocpus | default 1 | quote }}
                - name: ARM_MEMORY_GB
                  value: {{ .Values.profiles.armOverflow.memoryGb | default 6 | quote }}
                - name: ARM_BOOT_VOLUME_GB
                  value: {{ .Values.profiles.armOverflow.bootVolumeSizeGb | default 50 | quote }}
                - name: ARM_SUBNET_ID
                  value: {{ .Values.profiles.armOverflow.subnetId | default "" | quote }}
                - name: ARM_IMAGE_ID
                  value: {{ .Values.profiles.armOverflow.imageId | default "" | quote }}
                - name: ARM_IDLE_MINUTES
                  value: {{ .Values.profiles.armOverflow.scaleDown.idleMinutes | default 10 | quote }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: cluster-autoscaler-script
                defaultMode: 0755
