apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-script
  namespace: {{ .Values.namespace }}
data:
  autoscale.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ###########################################################################
    # cluster-autoscaler — general-purpose K3s node autoscaler
    #
    # Runs as a CronJob. Checks for pending pods, matches against profiles,
    # and provisions/deprovisions cloud nodes as needed.
    #
    # Modes:
    #   startstop  — Start/stop a pre-existing instance (e.g. OCI E4.Flex)
    #   lifecycle  — Create/terminate ephemeral instances (e.g. OCI A1.Flex)
    ###########################################################################

    log() { echo "[autoscaler] $(date -u +%H:%M:%S) $*"; }
    err() { echo "[autoscaler] $(date -u +%H:%M:%S) ERROR: $*" >&2; }

    # ── OCI helpers ─────────────────────────────────────────────────────────
    oci_setup() {
      if [ ! -f /root/.oci/config ]; then
        mkdir -p /root/.oci
        echo "${OCI_PRIVATE_KEY_B64}" | base64 -d > /root/.oci/oci_api_key.pem
        chmod 600 /root/.oci/oci_api_key.pem
        cat > /root/.oci/config <<OCICFG
    [DEFAULT]
    user=${OCI_USER_OCID}
    fingerprint=${OCI_FINGERPRINT}
    tenancy=${OCI_TENANCY_OCID}
    region=${OCI_REGION}
    key_file=/root/.oci/oci_api_key.pem
    OCICFG
        chmod 600 /root/.oci/config
      fi
      export SUPPRESS_LABEL_WARNING=True
    }

    oci_instance_state() {
      local id="$1"
      oci compute instance get --instance-id "$id" \
        --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "UNKNOWN"
    }

    oci_start_instance() {
      local id="$1"
      log "Starting OCI instance ${id}..."
      oci compute instance action --instance-id "$id" --action START \
        --query 'data."lifecycle-state"' --raw-output 2>/dev/null
    }

    oci_stop_instance() {
      local id="$1"
      log "Stopping OCI instance ${id}..."
      oci compute instance action --instance-id "$id" --action SOFTSTOP \
        --query 'data."lifecycle-state"' --raw-output 2>/dev/null
    }

    oci_create_arm_instance() {
      local name="$1" shape="$2" ocpus="$3" mem_gb="$4" subnet="$5" image="$6" boot_gb="$7"
      local userdata
      userdata=$(base64 -w0 <<CLOUDINIT
    #!/bin/bash
    set -euo pipefail
    hostnamectl set-hostname ${name}
    curl -fsSL https://tailscale.com/install.sh | sh
    tailscale up --ssh --accept-routes --hostname=${name} --authkey=${TAILSCALE_AUTH_KEY}
    sleep 10
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="${K3S_VERSION}" \
      K3S_URL="${K3S_SERVER_URL}" K3S_TOKEN="${K3S_TOKEN}" sh -s - \
      --node-name=${name} \
      --node-label=autoscaler.managed=true \
      --node-label=scaling-group=arm-overflow
    CLOUDINIT
    )
      log "Creating OCI ARM instance ${name}..."
      oci compute instance launch \
        --compartment-id "${OCI_COMPARTMENT_OCID}" \
        --availability-domain "$(oci iam availability-domain list --compartment-id "${OCI_TENANCY_OCID}" --query 'data[0].name' --raw-output)" \
        --shape "$shape" \
        --shape-config "{\"ocpus\": ${ocpus}, \"memoryInGBs\": ${mem_gb}}" \
        --subnet-id "$subnet" \
        --image-id "$image" \
        --boot-volume-size-in-gbs "$boot_gb" \
        --display-name "$name" \
        --metadata "{\"user_data\": \"${userdata}\"}" \
        --assign-public-ip true \
        --freeform-tags '{"managed-by": "cluster-autoscaler", "scaling-group": "arm-overflow"}' \
        --query 'data.id' --raw-output 2>/dev/null
    }

    oci_terminate_instance() {
      local id="$1"
      log "Terminating OCI instance ${id}..."
      oci compute instance terminate --instance-id "$id" --force \
        --preserve-boot-volume false 2>/dev/null
    }

    # ── Kubernetes helpers ──────────────────────────────────────────────────

    get_pending_pods() {
      kubectl get pods -A -o json --field-selector=status.phase=Pending 2>/dev/null | \
        jq -r '.items[] | select(.status.conditions[]? | select(.type=="PodScheduled" and .status=="False")) | .metadata.name'
    }

    get_pending_pod_arch() {
      # Returns the arch requirement for pending pods
      kubectl get pods -A -o json --field-selector=status.phase=Pending 2>/dev/null | \
        jq -r '.items[] |
          select(.status.conditions[]? | select(.type=="PodScheduled" and .status=="False")) |
          (.spec.nodeSelector // {})["kubernetes.io/arch"] // "any"' | sort -u
    }

    get_node_workload_count() {
      local node="$1"
      # Count non-daemonset, non-system pods
      kubectl get pods -A -o json --field-selector=spec.nodeName="$node" 2>/dev/null | \
        jq '[.items[] |
          select(.metadata.ownerReferences[]? | .kind != "DaemonSet") |
          select(.metadata.namespace != "kube-system")
        ] | length'
    }

    get_arm_node_pressure() {
      # Returns max CPU% across ARM nodes
      kubectl top nodes -l kubernetes.io/arch=arm64 --no-headers 2>/dev/null | \
        awk '{gsub(/%/,"",$3); if($3>max) max=$3} END {print max+0}'
    }

    get_managed_instances() {
      # List autoscaler-managed OCI instances
      oci compute instance list \
        --compartment-id "${OCI_COMPARTMENT_OCID}" \
        --lifecycle-state RUNNING \
        --query 'data[?freeformTags."managed-by"==`cluster-autoscaler`].[id,"display-name"]' \
        --output json 2>/dev/null | jq -r '.[] | "\(.[0]) \(.[1])"'
    }

    # ── Scale-up logic ──────────────────────────────────────────────────────

    check_scale_up() {
      local pending
      pending=$(get_pending_pods)
      [ -z "$pending" ] && return 0

      log "Found pending pods: $(echo "$pending" | wc -l)"

      local arches
      arches=$(get_pending_pod_arch)

      # Check x86 demand
      if echo "$arches" | grep -q "amd64"; then
        local state
        state=$(oci_instance_state "${X86_INSTANCE_ID}")
        if [ "$state" = "STOPPED" ]; then
          log "Pending x86 pods detected — waking agent-01"
          oci_start_instance "${X86_INSTANCE_ID}"
          # Wait for node to rejoin
          local elapsed=0
          while [ $elapsed -lt 300 ]; do
            local ready
            ready=$(kubectl get node agent-01 -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "False")
            [ "$ready" = "True" ] && break
            sleep 15
            elapsed=$((elapsed + 15))
          done
          kubectl uncordon agent-01 2>/dev/null || true
          log "agent-01 is awake"
        fi
      fi

      # Check ARM overflow demand
      if echo "$arches" | grep -qE "arm64|any"; then
        local pressure
        pressure=$(get_arm_node_pressure)
        if [ "${pressure:-0}" -ge "${ARM_PRESSURE_THRESHOLD}" ]; then
          local managed_count
          managed_count=$(get_managed_instances | wc -l)
          if [ "$managed_count" -lt "${ARM_MAX_INSTANCES}" ]; then
            local name="arm-worker-$(date +%s | tail -c 6)"
            log "ARM pressure at ${pressure}% (threshold: ${ARM_PRESSURE_THRESHOLD}%) — creating ${name}"
            oci_create_arm_instance "$name" \
              "${ARM_SHAPE}" "${ARM_OCPUS}" "${ARM_MEMORY_GB}" \
              "${ARM_SUBNET_ID}" "${ARM_IMAGE_ID}" "${ARM_BOOT_VOLUME_GB}"
          else
            log "ARM pressure high but max instances (${ARM_MAX_INSTANCES}) reached"
          fi
        fi
      fi
    }

    # ── Scale-down logic ────────────────────────────────────────────────────

    check_scale_down() {
      # Check agent-01 idle time
      local state
      state=$(oci_instance_state "${X86_INSTANCE_ID}")
      if [ "$state" = "RUNNING" ]; then
        local workloads
        workloads=$(get_node_workload_count "agent-01")
        if [ "${workloads:-0}" -eq 0 ]; then
          # Check if it's been idle long enough (use annotation to track)
          local idle_since
          idle_since=$(kubectl get node agent-01 -o jsonpath='{.metadata.annotations.autoscaler\.idle-since}' 2>/dev/null || echo "")
          local now
          now=$(date +%s)

          if [ -z "$idle_since" ]; then
            kubectl annotate node agent-01 "autoscaler.idle-since=${now}" --overwrite 2>/dev/null
            log "agent-01 idle — starting countdown (${X86_IDLE_MINUTES}m)"
          else
            local elapsed_min=$(( (now - idle_since) / 60 ))
            if [ "$elapsed_min" -ge "${X86_IDLE_MINUTES}" ]; then
              log "agent-01 idle for ${elapsed_min}m (threshold: ${X86_IDLE_MINUTES}m) — sleeping"
              kubectl cordon agent-01 2>/dev/null || true
              kubectl drain agent-01 --ignore-daemonsets --delete-emptydir-data --force --timeout=60s 2>/dev/null || true
              oci_stop_instance "${X86_INSTANCE_ID}"
            else
              log "agent-01 idle for ${elapsed_min}m / ${X86_IDLE_MINUTES}m"
            fi
          fi
        else
          # Clear idle annotation if workloads are running
          kubectl annotate node agent-01 "autoscaler.idle-since-" 2>/dev/null || true
        fi
      fi

      # Check ARM overflow nodes
      get_managed_instances | while read -r inst_id inst_name; do
        [ -z "$inst_id" ] && continue
        local workloads
        workloads=$(get_node_workload_count "$inst_name" 2>/dev/null || echo "0")
        if [ "${workloads:-0}" -eq 0 ]; then
          local idle_since
          idle_since=$(kubectl get node "$inst_name" -o jsonpath='{.metadata.annotations.autoscaler\.idle-since}' 2>/dev/null || echo "")
          local now
          now=$(date +%s)
          if [ -z "$idle_since" ]; then
            kubectl annotate node "$inst_name" "autoscaler.idle-since=${now}" --overwrite 2>/dev/null
            log "${inst_name} idle — starting countdown (${ARM_IDLE_MINUTES}m)"
          else
            local elapsed_min=$(( (now - idle_since) / 60 ))
            if [ "$elapsed_min" -ge "${ARM_IDLE_MINUTES}" ]; then
              log "${inst_name} idle for ${elapsed_min}m — terminating"
              kubectl drain "$inst_name" --ignore-daemonsets --delete-emptydir-data --force --timeout=60s 2>/dev/null || true
              kubectl delete node "$inst_name" 2>/dev/null || true
              oci_terminate_instance "$inst_id"
            fi
          fi
        else
          kubectl annotate node "$inst_name" "autoscaler.idle-since-" 2>/dev/null || true
        fi
      done
    }

    # ── Main ────────────────────────────────────────────────────────────────

    main() {
      oci_setup
      log "Autoscaler run starting..."
      check_scale_up
      check_scale_down
      log "Autoscaler run complete"
    }

    main
