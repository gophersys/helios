# Shared CouchDB 3 — Obsidian LiveSync backend
# Connect from other namespaces: couchdb.shared-services.svc.cluster.local:5984
#
# Deploy:
#   helm install couchdb kubernetes/shared-services/couchdb \
#     -n shared-services \
#     --set auth.adminPassword=<password>

replicaCount: 1

image:
  repository: couchdb
  pullPolicy: IfNotPresent
  tag: "3"

service:
  type: ClusterIP
  port: 5984

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

auth:
  adminUser: admin
  adminPassword: ""  # Set via --set auth.adminPassword=<password>

ingress:
  enabled: true
  host: "notes.mateosegura.com"
  clusterIssuer: "letsencrypt"
  tlsSecretName: "couchdb-tls"

nodeSelector:
  kubernetes.io/arch: arm64

# CORS is required for Obsidian LiveSync browser/app access
cors:
  enabled: true
  origins: "*"
  methods: "GET, PUT, POST, HEAD, DELETE"
  headers: "accept, authorization, content-type, origin, referer, x-csrf-token"
