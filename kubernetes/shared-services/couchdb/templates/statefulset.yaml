apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shared-couchdb.fullname" . }}
  labels:
    {{- include "shared-couchdb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "shared-couchdb.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shared-couchdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shared-couchdb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: config-init
          image: busybox:1.36
          command: ["sh", "-c", "cp /config-ro/local.ini /config-rw/local.ini"]
          volumeMounts:
            - name: config-ro
              mountPath: /config-ro
            - name: config-rw
              mountPath: /config-rw
      containers:
        - name: couchdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shared-couchdb.fullname" . }}-credentials
                  key: admin-user
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shared-couchdb.fullname" . }}-credentials
                  key: admin-password
          ports:
            - name: couchdb
              containerPort: 5984
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: couchdb
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: couchdb
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: couchdb
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config-rw
              mountPath: /opt/couchdb/etc/local.d
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-ro
          configMap:
            name: {{ include "shared-couchdb.fullname" . }}-config
        - name: config-rw
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
