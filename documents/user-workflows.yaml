data:
  items:
    - id: WF-0001
      name: Create a PoC
      persona: PER-0001
      trigger: "WHEN the founder has a product idea and wants a cheap PoC that just works, only for them to test it."
      steps:
        - "Open the creation wizard and have the intake conversation, describing the product in plain language (C1)."
        - "Review the generated product-tier documents — charter, requirements, workflows, design brief — and gate them (C20, doc 11 §9)."
        - "Accept the project so Eden generates the working monorepo from the go-backend and svelte-ui archetypes."
        - "Trigger the one-action PoC deploy, choosing the central metered cluster or a free local k3d, without configuring infrastructure (C2)."
        - "Open the observability view and watch the PoC's deploys, health, and spend (C20)."
      outcome: "The founder has an observable PoC running on a cluster, generated from their own gated documents, without having touched any infrastructure."
      links:
        realizes:
          - REQ-0001
          - REQ-0002
          - REQ-0003
          - REQ-0004
          - REQ-0005
          - REQ-0007
    - id: WF-0002
      name: Promote PoC to test cohort to production fleet
      persona: PER-0001
      trigger: "WHEN the founder's PoC has proven the idea and they want to put it in front of real test users, then production customers."
      steps:
        - "From the project's environment ladder, promote the PoC build to a test-cohort environment, passing its gate (C2)."
        - "Invite the small cohort of real test users and observe the test environment in the dashboard."
        - "Promote the validated build to production, where it becomes a per-customer isolated environment in the deployment fleet (C2, C17)."
        - "Roll a subsequent change across the fleet through a gated rollout, with each customer environment gated independently (C17)."
      outcome: "The product has climbed the maturity ladder from founder-only PoC to a test cohort to a gated production fleet, and the founder can roll one change across all customer environments safely."
      links:
        realizes:
          - REQ-0009
          - REQ-0010
    - id: WF-0003
      name: Work the gate queue
      persona: PER-0001
      trigger: "WHEN documents or release candidates are waiting on a human ruling in the founder's gate queue."
      steps:
        - "Open the gate queue and see each pending item with its validation and traceability report (doc 11 §8)."
        - "Review a document or release candidate against its evidence, navigating the linked requirements and workflows it serves."
        - "Approve the item to promote it, or send it back so the pipeline reworks it — without supervising any agent between gates (C9)."
      outcome: "Pending documents and releases are resolved at the gate: approved items promote on a green report, reworked items re-enter the pipeline, and the founder's only required involvement was the ruling."
      links:
        realizes:
          - REQ-0004
          - REQ-0012
    - id: WF-0004
      name: Connect own cluster and git and track drift
      persona: PER-0002
      trigger: "WHEN the picky platform engineer wants to run a project on their own infrastructure and git host while keeping full guarantees."
      steps:
        - "Connect their own cluster through the F1 conformance path — k3s, EKS, GKE, AKS, or DO — so Eden holds only organizational metadata (C7, C15)."
        - "Connect their git host and choose per-project enforcement: enforced (Eden as a GitHub/GitLab app with required checks and branch protection) or advisory (C8, C18)."
        - "Confirm the permanently visible guarantee badge correctly reflects which guarantees are enforced and which are off (C18)."
        - "Work on their platform as usual; when an out-of-band change lands, review the drift event Eden raises and apply the offered remediation (C8)."
      outcome: "The engineer runs entirely on their own cluster and git host with Eden holding metadata only, the dashboard honestly shows which guarantees are enforced, and any drift between their repo and Eden's known state is detected and remediable."
      links:
        realizes:
          - REQ-0006
          - REQ-0011
          - REQ-0013
    - id: WF-0005
      name: Bug report to triage to agent fix to gated release
      persona: PER-0001
      trigger: "WHEN a bug is reported against a running project and needs to reach a fixed release."
      steps:
        - "The founder files a bug report against the project, describing the observed problem (C9)."
        - "The report is triaged into the bug-report-to-fix pipeline and an agent run produces a candidate fix under the evidence-gated pipeline (C9)."
        - "The fix is presented at the gate with its evidence; a human approves it via the hotfix flow or the next release train."
        - "The platform engineer observes the resulting release — its changelog and version bump — landing on the affected environments (C9)."
      outcome: "A reported bug travels from triage through an agent-produced, gate-approved fix to a versioned release, with the founder reporting and the engineer observing, and no step bypassing a gate."
      links:
        realizes:
          - REQ-0004
          - REQ-0012
