<!doctype html><meta charset="utf-8">
<title>corpus/fractional-edges</title>
<style>
  body { margin: 0; background: #111; }
  .panel { position: relative; width: 300px; height: 180px; }
  .plate { position: absolute; left: 0; top: 0; width: 300px; height: 180px; background: #1c1c1c; }
  .dial { position: absolute; left: 10px; width: 28px; height: 28px; border-radius: 50%;
          background: #4a7; }
</style>
<div class="panel">
  <div class="plate">
    <div class="dial" data-addr="d1" style="top:20px"></div>
    <!-- THE SEED: half a pixel down the page. The column, the pitch and the
         size are all still right; only the edge is off the grid. -->
    <div class="dial" data-addr="d2" style="top:60.5px"></div>
    <div class="dial" data-addr="d3" style="top:100px"></div>
    <div class="dial" data-addr="d4" style="top:140px"></div>
  </div>
</div>
