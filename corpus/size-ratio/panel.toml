# corpus seed — size-ratio. Default audit.Rules(); no [rules] override, because
# a seed that needs a loosened rule proves nothing about the shipped predicate.
# text_kinds matches what the demos declare: the label is measured as GLYPH INK
# (A-4), so a defect visible only to element-box probing could not certify this.
[probe]
root = ".panel"
text_kinds = ["label"]

[probe.containers]
plate = ".plate"

[probe.parts]
label = ".k-label"
dial = ".k-dial"

# want is derived, not observed: an all-caps label has ink = cap height, and the
# sans faces on both gate paths sit at 0.72em (Arial 0.716, DejaVu 0.729), so a
# correct 16px label over the 28px dial measures 16 x 0.72 / 28 = 0.41. The
# page's 9px label measures 0.23. tol 0.06 is the DENSE-UI ratio band, and the
# planted defect misses by three times it.
[ratio]
text_control = { ratio = ["label.h", "dial.h"], want = 0.41, tol = 0.06 }
dial = { measure = "dial.h", want = 28, tol = 1 }
