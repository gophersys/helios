# CoreKinect VSM driver
CONFIG_CK_MODULES_VSM=y
CONFIG_CK_MODULES_VSM_BLE_SERVER=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=20000
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# System
CONFIG_RING_BUFFER=y
CONFIG_POLL=y
CONFIG_ASSERT=y
CONFIG_POLL=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y

# Debugging
CONFIG_THREAD_MONITOR=n
CONFIG_INIT_STACKS=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_DEBUG_INFO=y

# Shell
CONFIG_SHELL=n
CONFIG_I2C_SHELL=y

# Peripherals
CONFIG_NRFX_TWIM1=y
CONFIG_I2C=y
CONFIG_SPI=y

# Sensor 
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_DBG=n