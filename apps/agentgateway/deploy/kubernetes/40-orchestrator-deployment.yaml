# Eden orchestrator Deployment (W5): the per-project orchestrator as a STATELESS, HA Deployment
# under a REAL coordination.k8s.io/v1 Lease. replicas:3 — every replica serves the health probe and
# contends in the election, but ONLY the Lease holder runs the reconcile loop: the command's
# superviseLeadership poll (cmd/agentgateway-orchestrator) starts the loop the moment a replica
# acquires the Lease (Service.Start consults IsLeader once at start), and a deposed leader EXITS for
# a clean kubelet restart + re-election — so two controllers never both provision the same Pending
# agent. A replica that loses the Lease (a partition, a rollout) is replaced within the lease
# duration; a peer acquires it and continues — that is the HA property this Deployment proves.
#
# The pod runs as the eden-orchestrator ServiceAccount, so its projected token IS the in-cluster
# kubeconfig the kubernetesadapter (Config.Kubeconfig="" → rest.InClusterConfig) and the
# leaderelection client use. EDEN_WORKSPACE_SUBSTRATE=kubernetes selects the namespace-per-workspace
# adapter; EDEN_LEASE_IDENTITY is the pod name (downward API) so the three replicas present distinct
# holder identities.
#
# IMAGE: the orchestrator role of the agentgateway app. The composition root that wires
# orchestratorservice.Config{Substrate: SubstrateKubernetes} + NewKubernetesLease reads the env
# below. (cmd/agentgateway today is the stateless NATS→SSE bridge; the orchestrator command is the
# sibling that runs Service.Start — see README.md "The orchestrator command".)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eden-orchestrator
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
spec:
  replicas: 3 # stateless HA: 3 serve verbs, 1 (the Lease holder) reconciles
  selector:
    matchLabels:
      app.kubernetes.io/name: eden-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eden-orchestrator
        app.kubernetes.io/part-of: eden
    spec:
      serviceAccountName: eden-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the distroless nonroot uid
      # Spread the three replicas across nodes so a single node loss never takes the whole
      # orchestrator (and the lease handoff has a healthy peer to land on). Soft (preferred) so a
      # single-node test cluster still schedules all three.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: eden-orchestrator
                topologyKey: kubernetes.io/hostname
      containers:
        - name: orchestrator
          image: "ghcr.io/gophersys/eden/agentgateway:latest"
          # The agentgateway image ships TWO binaries (see deploy/image/agentgateway.Dockerfile); the
          # ENTRYPOINT default is the stateless NATS→SSE gateway, so the orchestrator role selects its
          # own binary explicitly. cmd/agentgateway-orchestrator reads the env below (the configuration
          # pattern) into orchestratorservice.Config{Substrate: SubstrateKubernetes} + NewKubernetesLease.
          command: ["/usr/local/bin/agentgateway-orchestrator"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── Substrate: the namespace-per-workspace kubernetes adapter (in-cluster kubeconfig).
            - name: EDEN_WORKSPACE_SUBSTRATE
              value: "kubernetes"
            # ── Leader election (lease.go): the contended Lease + this replica's identity.
            - name: EDEN_LEASE_NAME
              value: "eden-orchestrator"
            - name: EDEN_LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EDEN_LEASE_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name # the pod name: a distinct holder identity per replica
            # ── Desired-state Postgres (the orchestrator's DesiredStore).
            - name: POSTGRES_HOST
              value: "eden-postgres-0.eden-postgres.eden-system.svc"
            - name: POSTGRES_USER
              value: "eden"
            - name: POSTGRES_DB
              value: "eden"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eden-orchestrator-postgres
                  key: password
            - name: DATABASE_URL
              value: "postgres://eden:$(POSTGRES_PASSWORD)@eden-postgres-0.eden-postgres.eden-system.svc:5432/eden?sslmode=disable"
            # ── Event bus.
            - name: EDEN_NATS_URL
              value: "nats://nats.eden-system.svc:4222"
            # ── Per-project namespace prefix the kubernetesadapter scopes ownership by (the eden.*
            # labels). Keeps a shared cluster's project namespaces attributable to this orchestrator.
            - name: EDEN_LABEL_NAMESPACE
              value: "central"
            # ── Secrets plane (dual-mode Vault, ADR-0022 #1): the supervisor's harness credential is
            # NEVER a raw env value — it rides every SpawnRequest as the opaque EDEN_CREDENTIAL_REF
            # (vault://…) resolved server-side at agentsession.Open. The PRODUCTION token-file mode reads
            # the Vault token the K8s-ServiceAccount sidecar writes to EDEN_VAULT_TOKEN_FILE, re-read per
            # Resolve. This mirrors the agent-runtime deployment's Vault env shape (deploy/plane/production/
            # chart/templates/agent-runtime-deployment.yaml). The Vault sidecar/agent injector is a
            # human-applied prerequisite (see README "Remote eden-central — NOT deployed").
            - name: EDEN_VAULT_MODE
              value: "token-file"
            - name: EDEN_VAULT_TOKEN_FILE
              value: "/vault/secrets/token"
            - name: VAULT_ADDR
              value: "http://vault.eden-system.svc:8200"
            - name: EDEN_HARNESS
              value: "claude-code"
            - name: EDEN_CREDENTIAL_REF
              value: "vault://eden/production#setup-token"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
# The orchestrator's read/admission API surface (Spawn/Get/List/Stop/Resume over HTTP). Any replica
# serves it — the verbs are stateless; only reconcile is leader-gated.
apiVersion: v1
kind: Service
metadata:
  name: eden-orchestrator
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: eden-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
