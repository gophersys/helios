# Eden orchestrator control-plane namespace (W5). This is the orchestrator's OWN namespace — it
# holds the orchestrator Deployment, its coordination.k8s.io/v1 Lease (leader election), and the
# supporting NATS + Postgres. It is NOT a per-project workspace namespace: the orchestrator CREATES
# those at runtime (eden-<prefix>-<projectUUID>) via the kubernetesadapter, one per project, each
# carrying its own ResourceQuota + default-deny NetworkPolicy (see templates/project-namespace.yaml).
#
# Apply order: this file FIRST (every other manifest is namespaced into it), then 10-rbac,
# 20-postgres, 30-nats, 40-orchestrator-deployment.
#
# The SAME manifests deploy to the REMOTE eden-central cluster — only the kubeconfig (the apply
# target) differs, never the YAML. The remote apply is deliberately NOT performed here; it is
# flagged for the human (see README.md "Remote eden-central").
apiVersion: v1
kind: Namespace
metadata:
  name: eden-system
  labels:
    app.kubernetes.io/part-of: eden
    eden.io/plane: control
