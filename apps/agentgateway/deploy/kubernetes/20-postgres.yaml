# Eden orchestrator desired-state Postgres (W5). The orchestrator's DesiredStore
# (orchestrator/postgresstore) keys the agent records here; the namespacingStore decorator writes
# project-namespaced agent-<project>-<n> rows. A StatefulSet (not a Deployment) because the store is
# durable: a stable identity + a PersistentVolumeClaim survive a pod restart, so a reschedule never
# loses the agent ledger. ONE replica at v0 (the single-writer the leader reconciles through);
# replication/HA is a later concern behind the same Service name.
#
# The password rides a kubernetes Secret reference, NEVER an inlined value (the secret-safety rule).
# Provision eden-orchestrator-postgres BEFORE apply, e.g.:
#   kubectl -n eden-system create secret generic eden-orchestrator-postgres \
#     --from-literal=password="$(openssl rand -hex 24)"
# On eden-central the password is provisioned from Vault, never committed.
apiVersion: v1
kind: Service
metadata:
  name: eden-postgres
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-postgres
    app.kubernetes.io/part-of: eden
spec:
  clusterIP: None # headless: the StatefulSet pod is addressed by its stable DNS name
  selector:
    app.kubernetes.io/name: eden-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eden-postgres
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-postgres
    app.kubernetes.io/part-of: eden
spec:
  serviceName: eden-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eden-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eden-postgres
        app.kubernetes.io/part-of: eden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the postgres image's postgres user
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: eden
            - name: POSTGRES_DB
              value: eden
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eden-orchestrator-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eden", "-d", "eden"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "eden", "-d", "eden"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
