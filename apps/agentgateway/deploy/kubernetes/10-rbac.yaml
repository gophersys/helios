# Eden orchestrator RBAC (W5). Three bindings, least-privilege:
#
#   1. ServiceAccount eden-orchestrator — the identity the orchestrator pods run as. Its projected
#      token is the in-cluster kubeconfig the kubernetesadapter + the leaderelection client use (no
#      mounted kubeconfig file: Config.Kubeconfig="" → rest.InClusterConfig).
#   2. Role/RoleBinding (namespaced to eden-system) — the LEASE permission: get/create/update/watch
#      on coordination.k8s.io leases in THIS namespace, so the replicas contend for the single
#      reconcile Lease (lease.go NewKubernetesLease). Scoped to the control-plane namespace because
#      the Lease object lives there, never in a project namespace.
#   3. ClusterRole/ClusterRoleBinding — the orchestrator's runtime authority to CREATE PROJECT
#      NAMESPACES (eden-<prefix>-<projectUUID>) and the workspace POD + its Secrets/NetworkPolicy/
#      ResourceQuota inside them. Cluster-scoped because a project namespace can be created anywhere;
#      the verbs are exactly what kubernetesadapter.Create/Destroy issue (namespaces, pods, secrets,
#      networkpolicies) plus the per-project ResourceQuota the namespace template applies.
#
# A managed eden-central cluster applies the IDENTICAL bindings; only the apply target differs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eden-orchestrator
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
---
# The LEASE Role: leader election contends for a coordination.k8s.io/v1 Lease in eden-system. The
# replicas get/create/update it; watch lets the elector observe a peer's renewal. Scoped to the
# orchestrator's OWN namespace (the Lease never lives in a project namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eden-orchestrator-lease
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    # The leaderelection LeaseLock emits a leadership-transition Event (best-effort); allow it so
    # the election records the handoff. Events are namespaced to eden-system.
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eden-orchestrator-lease
  namespace: eden-system
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eden-orchestrator-lease
subjects:
  - kind: ServiceAccount
    name: eden-orchestrator
    namespace: eden-system
---
# The PROJECT-NAMESPACE + WORKSPACE-POD authority: cluster-scoped because the orchestrator creates
# a namespace per project (eden-<prefix>-<projectUUID>) anywhere, and inside it the workspace pod +
# its credential Secrets + the egress NetworkPolicy + the ResourceQuota the namespace template
# stamps. These verbs are EXACTLY what kubernetesadapter.Create (namespace, pod, secret,
# networkpolicy) and Destroy (foreground namespace delete) issue, plus resourcequotas for the quota
# the per-project namespace carries. No broader grant (no nodes, no cluster-admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eden-orchestrator-workspaces
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    # The workspace pod's exec/attach plane (Run/Exec/Files tar-over-exec) the kubernetesadapter
    # drives over the pod, plus the pod logs (CapLogStream).
    resources: ["pods/exec", "pods/attach", "pods/log"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    # The resolved credential material the adapter materializes as native Secrets BEFORE the pod
    # (MountSecret volumes + the dockerconfigjson pull secret), never as plaintext in the pod spec.
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    # The per-project ResourceQuota the namespace template applies (the project's CPU/memory/pod
    # ceiling).
    resources: ["resourcequotas"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    # The default-deny + declared-allow egress NetworkPolicy the adapter installs per workspace and
    # the per-project default-deny the namespace template stamps (enforced where the CNI implements
    # NetworkPolicy — honest CapEgressPolicy).
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eden-orchestrator-workspaces
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eden-orchestrator-workspaces
subjects:
  - kind: ServiceAccount
    name: eden-orchestrator
    namespace: eden-system
