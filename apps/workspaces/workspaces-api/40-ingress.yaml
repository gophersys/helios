# Public path: Cloudflare edge (TLS + Access/Google SSO) -> tunnel ->
# ingress-nginx:80 -> here. DELIBERATELY NO tls: block — the tunnel
# enters nginx on plain HTTP and use-forwarded-headers is off, so a TLS
# section would 308-redirect-loop (grafana precedent; see infra recon
# 2026-07-06). Cloudflare terminates public TLS at its edge.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspaces-api
  namespace: workspaces-prod
  annotations:
    # Real LE cert on :443 while the Cloudflare tunnel keeps using :80.
    # ssl-redirect MUST stay false: the tunnel connects on :80, and an
    # HTTP->HTTPS redirect there loops against cloudflared forever.
    cert-manager.io/cluster-issuer: letsencrypt-homelab
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [workspaces.mateosegura.com]
      secretName: workspaces-api-tls
  rules:
    - host: workspaces.mateosegura.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspaces-api
                port:
                  number: 8080
