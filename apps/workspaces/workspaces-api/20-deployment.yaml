# workspaces-api — the workspaces.mateosegura.com backend + embedded UI.
# Unprivileged, read-only-rootfs, distroless nonroot image. Reads the
# embedded-lab envs via the workspaces-reader Role (rbac-embedded/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaces-api
  namespace: workspaces-prod
  labels:
    app.kubernetes.io/part-of: workspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspaces-api
  template:
    metadata:
      labels:
        app: workspaces-api
        app.kubernetes.io/part-of: workspaces
    spec:
      serviceAccountName: workspaces-api
      containers:
        - name: api
          # NOTE: ghcr package is private on first publish — flip it public
          # (package settings) or the pull backs off, exactly like
          # zephyr-devbox did on day one.
          image: ghcr.io/gophersys/workspaces-api:latest
          imagePullPolicy: Always
          env:
            # GitOps automation: create/destroy workspaces open PRs against this
            # infra repo. OPTIONAL — without the token the API is read-only and
            # create/delete return 503. Provide it via the `workspaces-github`
            # Secret (a fine-grained bot PAT) — see docs/runtime-secrets.md.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workspaces-github
                  key: token
                  optional: true
            - name: GITHUB_OWNER
              value: gophersys
            - name: GITHUB_REPO
              value: infrastructure
            - name: GITHUB_BASE
              value: main
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/workspaces
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
