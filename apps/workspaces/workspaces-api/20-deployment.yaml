# workspaces-api — the workspaces.mateosegura.com backend + embedded UI.
# Unprivileged, read-only-rootfs, distroless nonroot image. Reads the
# embedded-lab envs via the workspaces-reader Role (rbac-embedded/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaces-api
  namespace: workspaces-prod
  labels:
    app.kubernetes.io/part-of: workspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspaces-api
  template:
    metadata:
      labels:
        app: workspaces-api
        app.kubernetes.io/part-of: workspaces
    spec:
      serviceAccountName: workspaces-api
      containers:
        - name: api
          # NOTE: ghcr package is private on first publish — flip it public
          # (package settings) or the pull backs off, exactly like
          # zephyr-devbox did on day one.
          image: ghcr.io/gophersys/workspaces-api:5fdb7acf04246a538eefb884557b41c4121a6ef1
          imagePullPolicy: IfNotPresent
          env:
            # GitOps automation: create/destroy workspaces open PRs against this
            # infra repo. Auth via the gophersys-arc GitHub App — the API mints
            # short-lived installation tokens at runtime (no static PAT). OPTIONAL:
            # without the secret the API is read-only and create/delete return 503.
            # Recreate from bw shared/github/arc-app — see docs/runtime-secrets.md.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: workspaces-github-app
                  key: github_app_id
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: workspaces-github-app
                  key: github_app_installation_id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: workspaces-github-app
                  key: github_app_private_key
                  optional: true
            - name: GITHUB_OWNER
              value: gophersys
            - name: GITHUB_REPO
              value: infrastructure
            - name: GITHUB_BASE
              value: main
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/workspaces
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
