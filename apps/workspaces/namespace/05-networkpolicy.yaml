# Ingress lockdown for `workspaces-prod` (audit H1). workspaces-api is public
# (workspaces.mateosegura.com via the CF tunnel -> nginx) and, when the bot PAT
# is present, opens PRs against this repo — so restricting who can reach it
# matters. Only the ingress controller needs inbound. Egress is left open:
# workspaces-api calls the GitHub API, the k8s API, and proxies to embedded-lab
# code-servers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: workspaces-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: workspaces-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
