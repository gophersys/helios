# workspaces-prod — platform-owned Namespace (same pattern as embedded-lab:
# namespaced-only projects cannot create Namespaces; a platform-project
# Application owns it instead). NOT excluded from Kyverno: the workspaces
# API is an ordinary unprivileged workload and must stay baseline-clean.
apiVersion: v1
kind: Namespace
metadata:
  name: workspaces-prod
  labels:
    app.kubernetes.io/part-of: workspaces
