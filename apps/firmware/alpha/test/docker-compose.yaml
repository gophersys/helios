services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-mqtt-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms
      - GF_DASHBOARDS_MIN_TIME_INTERVAL=15s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ${CONCORD_MONOREPO_ROOT}/apps/products/alpha/test/config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ${CONCORD_MONOREPO_ROOT}/apps/products/alpha/test/config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        grafana-cli plugins install grafana-mqtt-datasource &&
        /run.sh
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ${CONCORD_MONOREPO_ROOT}/apps/products/alpha/test/config/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=corekinect
      - DOCKER_INFLUXDB_INIT_BUCKET=alpha-tests
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-secret-influxdb2-token
    restart: unless-stopped

volumes:
  grafana_data:
  mosquitto-data:
  mosquitto-log:
  influxdb_data:
  influxdb_config:
