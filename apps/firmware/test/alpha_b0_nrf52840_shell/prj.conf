# -----------------------------------------------
# Alpha B0 nRF52840 Shell Test Firmware
# MTIB UART shell test for manufacturing validation
# -----------------------------------------------

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="nrf52840> "

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

# GPIO for LED control
CONFIG_GPIO=y

# Basic settings
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Disable unused features to keep binary small
CONFIG_BT=n
CONFIG_NET_BUF=n
