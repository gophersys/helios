# IWSCK A0 — Bring-up shell application

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="iwsck> "

# Serial
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y

# Logging (routed through shell backend)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n

# GPIO + built-in shell
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# I2C (bit-bang via gpio-i2c) + built-in shell
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
CONFIG_I2C_SHELL=y

# Sensor (die temp) + built-in shell
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y

# BLE GATT server
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="IWSCK-A0"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# LF clock — no LFXO on board, use internal RC 32KHz
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_REBOOT=y
