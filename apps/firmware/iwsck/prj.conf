# IWSCK A1 — Bring-up shell application

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="iwsck> "

# Serial
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y

# Logging — minimal to reduce idle wakeups
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# GPIO + built-in shell
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# I2C (hardware TWI on P1.04/P1.05) + built-in shell
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_I2C_SHELL=y

# Sensor (die temp only — ADC/SPI/PWM not needed)
CONFIG_SENSOR=y

# BLE GATT server
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="IWSCK-A1"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# NFC
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_TEXT_RECORD=y

# LF clock — no LFXO, use internal RC 32KHz
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_REBOOT=y

# Power management — enable idle power saving
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Reduce system tick frequency for lower idle power
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
