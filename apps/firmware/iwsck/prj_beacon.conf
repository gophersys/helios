# IWSCK A1 — Permanent BLE + NFC beacon (headless)

# NO shell, NO console — headless operation
# CONFIG_SHELL is not set
# CONFIG_CONSOLE is not set
# CONFIG_UART_CONSOLE is not set
CONFIG_SERIAL=n
CONFIG_PRINTK=n

# GPIO (LEDs)
CONFIG_GPIO=y

# Sensor (die temp for BLE notify)
CONFIG_SENSOR=y

# BLE — connectable GATT server, always advertising
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="IWSCK-A1"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# NFC T2T tag
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_TEXT_RECORD=y

# LF clock — no LFXO on board, use internal RC 32KHz
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Power management — idle enters low-power automatically
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Slow tick for lower idle power
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
