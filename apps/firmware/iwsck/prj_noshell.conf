# IWSCK A0 — No-shell ultra-low-power BLE beacon

# NO shell, NO console
# CONFIG_SHELL is not set
# CONFIG_CONSOLE is not set
# CONFIG_UART_CONSOLE is not set
CONFIG_SERIAL=n

# NO logging
# CONFIG_LOG is not set
CONFIG_PRINTK=n

# GPIO (for LEDs, fuel gauge GE)
CONFIG_GPIO=y

# BLE — just advertising
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="IWSCK-A0"
CONFIG_BT_PERIPHERAL=y

# LF clock — no LFXO on board
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y

# System
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Slow tick
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
