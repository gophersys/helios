# embedded-lab — the one long-lived object of the embedded stack. Envs churn
# (ApplicationSet, prune=true); the namespace does not, so it is managed by a
# dedicated platform-project Application (app-embedded-namespace.yaml) instead
# of any env. Follows the repo stance that namespaces are platform-level
# (see app-qbittorrent.yaml's 00-namespace exclusion).
#
# NOTE: excluded from Kyverno baseline (pod-security-baseline.yaml +
# app-kyverno.yaml) — devbox pods are privileged with /dev hostPaths for USB
# flashing, and auto_pss_label=false on homelab, so no PSS label here either.
apiVersion: v1
kind: Namespace
metadata:
  name: embedded-lab
  labels:
    app.kubernetes.io/part-of: embedded
