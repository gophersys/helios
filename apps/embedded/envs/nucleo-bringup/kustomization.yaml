# Ephemeral Zephyr env: nucleo-bringup (STM32 Nucleo board bring-up).
#
# LIFECYCLE — this directory IS the environment:
#   spin up  : add a dir like this one under apps/embedded/envs/, PR, merge
#              -> the zephyr-envs ApplicationSet creates Application zephyr-<name>
#   tear down: delete the dir, PR, merge -> the Application is pruned (pod, PVCs,
#              tailnet node all removed)
#
# All envs share the embedded-lab namespace; three things keep them disjoint:
#   1. nameSuffix         — unique resource names (Deployment, Service, PVCs, CM)
#   2. labels+selectors   — unique pod selector (else Services would cross-match)
#   3. tailscale hostname — unique MagicDNS ssh name: zephyr-<env>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: embedded-lab
nameSuffix: -nucleo-bringup

resources:
  - ../../zephyr-devbox/base

labels:
  - pairs:
      app.kubernetes.io/instance: nucleo-bringup
    includeSelectors: true

patches:
  # Unique MagicDNS name for this env's SSH entrypoint.
  - target:
      kind: Service
      name: zephyr-devbox
    patch: |-
      - op: replace
        path: /metadata/annotations/tailscale.com~1hostname
        value: zephyr-nucleo-bringup
  # Who may SSH in. Public keys only — safe to commit.
  - target:
      kind: ConfigMap
      name: zephyr-devbox-authorized-keys
    patch: |-
      - op: replace
        path: /data/authorized_keys
        value: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAnd2FD5uPKsnCDt9+/JRsYSOn6y0n4gAjtAyEOVeyj0 mateo.segura413@gmail.com
