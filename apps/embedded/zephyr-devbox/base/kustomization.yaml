# zephyr-devbox — kustomize BASE. Never deployed directly: each ephemeral env
# under apps/embedded/envs/<name>/ overlays this with a nameSuffix, its own
# authorized_keys, and its own tailscale.com/hostname. See apps/embedded/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
