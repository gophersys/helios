# Zephyr embedded devbox — SSH-in, build/flash/monitor real microcontrollers.
#
# WHY PRIVILEGED + hostPath (documented Kyverno exclusion for embedded-lab):
# USB microcontrollers are QEMU-passed into the k3s-w-4 VM. Flashing tools
# (west/openocd/pyocd/dfu-util) need raw USB device access, and boards
# RE-ENUMERATE during flash (bootloader <-> app mode = a new USB device). A
# per-device mount would go stale on every flash; mounting the /dev/bus/usb
# DIRECTORY from the host keeps hotplug/re-enumeration working. That requires
# privileged (device-cgroup + node-level /dev access).
#
# /dev/serial: udev only creates this directory when a serial adapter is
# present. With QEMU USB passthrough active on k3s-w-4 it exists; if the pod
# ever fails with "hostPath type check failed", plug/pass a board through first.
# The node also carries custom udev symlinks /dev/mcu-slot-N (stable per
# physical slot) — those live in /dev proper and resolve via /dev/bus/usb.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zephyr-devbox
  labels:
    app.kubernetes.io/part-of: embedded
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volumes + exclusive USB device access
  selector:
    matchLabels:
      app: zephyr-devbox
  template:
    metadata:
      labels:
        app: zephyr-devbox
        app.kubernetes.io/part-of: embedded
    spec:
      # Hard-pin to the USB-passthrough node. hostname (not zone): the zone
      # pve-01 has other VMs; only k3s-w-4 receives the QEMU USB devices.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k3s-w-4"]
      containers:
        - name: devbox
          # Built by gophersys/zephyr-devbox CI (parallel PR). :latest + Always
          # is deliberate for a dev environment — restart the pod to pick up a
          # new toolchain image.
          image: ghcr.io/gophersys/zephyr-devbox:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true          # raw USB for flashing; see header comment
          env:
            - name: DEVBOX_AUTHORIZED_KEYS
              valueFrom:
                configMapKeyRef:
                  name: zephyr-devbox-authorized-keys
                  key: authorized_keys
          ports:
            - name: ssh
              containerPort: 22
          volumeMounts:
            - name: home
              mountPath: /home/dev
            - name: workspace
              mountPath: /workspace
            - name: dev-bus-usb
              mountPath: /dev/bus/usb
            - name: dev-serial
              mountPath: /dev/serial
            # sshd host keys live on the home PVC — a restarted pod keeps its
            # SSH identity (no MITM warnings). Entrypoint generates on first boot.
            - name: home
              mountPath: /etc/ssh/hostkeys
              subPath: .ssh-hostkeys
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi           # Zephyr/west builds are RAM-hungry; node has 9Gi
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: zephyr-devbox-home
        - name: workspace
          persistentVolumeClaim:
            claimName: zephyr-devbox-workspace
        - name: dev-bus-usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: dev-serial
          hostPath:
            path: /dev/serial
            # DirectoryOrCreate (not Directory): if the node boots a kernel
            # missing USB-serial drivers, /dev/serial is briefly absent — the
            # pod must still start (2026-07-06 incident: kernel upgrade without
            # matching linux-modules-extra blocked FailedMount for 10 min).
            type: DirectoryOrCreate
