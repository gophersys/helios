# sqlc configuration for the http-gateway data layer (ADR-0023: sqlc over pgx).
#
# sqlc reads schema/ (the DDL) + the query *.sql files, type-checks the queries against the schema,
# and emits a typed pgx Querier into generated/. This is the codegen axis #1 — the data layer is
# typed, never string-built. `bash ./ctl.sh generate` runs it.
#
# SKELETON: it points at the starter schema + queries shipped with the template. A generated app
# adds DDL to schema/ (with a paired migration in migrations/) and queries alongside, then
# regenerates.
version: "2"
sql:
  - engine: "postgresql"
    schema: "schema"
    queries: "schema/queries"
    gen:
      go:
        package: "generated"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
