[project]
name = "manufacturing-alpha"
version = "1.8.1"
requires-python = ">=3.10"
description = "Manufacturing test suite for Alpha product (electrical, flash, POST)"

dependencies = [
    "corekinect-test>=0.1.0",
    "grpcio>=1.75.0",
    "grpcio-tools>=1.75.0",
    "pytest>=9.0.0",
    "pytest-timeout>=2.0.0",
    "requests>=2.26.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

markers = [
    "electrical: Power rail validation (UVLO, regulation, charger load-sharing)",
    "fw_flash: Firmware flash via J-Link + AP protect on both processors",
    "post: Power-on self-test (boot, chip IDs, BMS, charger, GPS, modem, personalization)",
    "sequential: Tests that must run in order (all manufacturing tests)",
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
log_capture = false
addopts = "-v --tb=short -p no:logging"
# pytest-timeout stays loaded so the runner's ``--timeout=N`` CLI flag is
# recognized, but its per-test enforcement is intentionally inert under
# slot_parallel. Both built-in methods are unusable here:
#   - ``signal``: ``signal.signal(SIGALRM, ...)`` raises ``ValueError`` in
#     worker threads, so pytest-timeout silently disables itself per-test
#     (its documented graceful degradation). Harmless.
#   - ``thread``: on every per-test timeout it calls ``os._exit(1)`` —
#     hard-killing the runner before any in-flight slot can report.
# We leave the method at the default (``signal``) and let slot_parallel's
# own soft timer enforce ``@pytest.mark.timeout(N)`` budgets:
# ``PyThreadState_SetAsyncExc`` injects a ``BaseException`` into the
# timed-out worker — the test fails, the session continues, the rest of
# the panel still reports.
