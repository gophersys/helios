[project]
name = "manufacturing-alpha"
version = "1.6.0"
requires-python = ">=3.10"
description = "Manufacturing test suite for Alpha product (electrical, flash, POST)"

dependencies = [
    "corekinect-test>=0.1.0",
    "grpcio>=1.75.0",
    "grpcio-tools>=1.75.0",
    "pytest>=9.0.0",
    "pytest-timeout>=2.0.0",
    "requests>=2.26.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

markers = [
    "electrical: Power rail validation (UVLO, regulation, charger load-sharing)",
    "fw_flash: Firmware flash via J-Link + AP protect on both processors",
    "post: Power-on self-test (boot, chip IDs, BMS, charger, GPS, modem, personalization)",
    "sequential: Tests that must run in order (all manufacturing tests)",
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
log_capture = false
addopts = "-v --tb=short -p no:logging -p no:timeout"
# pytest-timeout is intentionally disabled at the plugin level. Both modes are
# unusable with slot_parallel:
#   - `signal`: silently no-ops in worker threads (signal.signal raises
#     ValueError outside the main thread).
#   - `thread`: works, but on every per-test timeout calls ``os._exit(1)`` —
#     hard-killing the runner process before any test result can be reported.
# Per-test ``@pytest.mark.timeout(N)`` budgets are still honored, enforced by
# slot_parallel's own soft timer (PyThreadState_SetAsyncExc → fails the test
# cleanly, session continues, downstream tests still run and report).
