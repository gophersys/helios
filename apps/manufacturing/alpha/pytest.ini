[pytest]
testpaths = tests_pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    electrical: marks electrical tests (Step 1-10)
    post: marks POST tests (chip ID, BMS, charger, GPS, etc.)
    fw_flash: marks firmware flash tests
    personalize: marks device personalization tests
    sequential: marks tests that must run in order
    coreops: marks tests requiring CoreOps proxy

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Output
addopts = -v --tb=short

# Timeout (per-test, requires pytest-timeout)
timeout = 300
