[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    electrical: marks electrical tests (power rail validation)
    post: marks POST tests (boot, chip ID, BMS, charger, GPS, personalization)
    fw_flash: marks firmware flash tests (J-Link + AP protect)
    sequential: marks tests that must run in order

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Output
addopts = -v --tb=short

# Timeout (per-test, requires pytest-timeout)
timeout = 300
