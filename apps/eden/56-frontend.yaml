# Eden frontend — serves the Svelte SPA and reverse-proxies /gateway ->
# agentgateway and /platform -> platformgateway internally, so the browser sees
# ONE same-origin surface (deploy design §1; the 40-ingress routes all paths
# here). Promoted from the eden Helm chart on release v0.1.4; image digest-pinned.
# No vault mount. Runs as its OWN dedicated SA eden-frontend (declared in
# 20-rbac.yaml) — the SA carries the ghcr-pull imagePullSecret the private image
# needs. Picked up by the app-eden Application; Argo reconciles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: eden
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: eden
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: eden-frontend
      containers:
        - name: frontend
          # v0.1.4
          env:
            # k3s cluster DNS: nginx's lazy resolver for the /gateway + /platform proxies.
            # The image default (127.0.0.11) is docker-only; the next image release derives
            # this from /etc/resolv.conf and this override can drop.
            - name: NGINX_LOCAL_RESOLVERS
              value: "10.43.0.10"
          image: "ghcr.io/gophersys/eden/frontend@sha256:16fbd8e973e0977a7557dcb8b6c70f10b3ae63ae0f4f83bb481be0606e6d93d8"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: eden
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
