# Eden frontend — serves the Svelte SPA and reverse-proxies /gateway ->
# agentgateway and /platform -> platformgateway internally, so the browser sees
# ONE same-origin surface (deploy design §1; the 40-ingress routes all paths
# here). Promoted from the eden Helm chart on release v0.1.4; image digest-pinned.
# No vault mount. Runs as its OWN dedicated SA eden-frontend (declared in
# 20-rbac.yaml) — the SA carries the ghcr-pull imagePullSecret the private image
# needs. Picked up by the app-eden Application; Argo reconciles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: eden
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: eden
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: eden-frontend
      containers:
        - name: frontend
          # v0.1.4
          image: "ghcr.io/gophersys/eden/frontend@sha256:fe867c88af224448cecb63b9cc8637ac9b1d5f00d05670e35af6bc15aa7088b0"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: eden
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
