# Eden application Vault (deploy design §1). The single source of Eden's RUNTIME
# secrets: the Go code resolves every JWT/harness credential ONLY through the
# Vault API (`vault://eden/production#<field>`) — there is no k8s-Secret code
# path. A single-node, FILE-STORAGE Vault (official hashicorp/vault image, NO dev
# mode, NO injector webhook): homelab-grade, deliberate. Pods consume it in
# ModeTokenFile — they read a periodic token from the k8s Secret `eden-vault-token`
# (key `token`) that the eden Helm chart mounts at /vault/secrets/token; that
# token is minted by the seed Job (08). This file owns the Vault SERVER + its
# storage; the token's lifecycle is the seed Job's.
#
# A StatefulSet with a durable `local-path` PVC because Vault's file storage
# backend (unseal keys' encrypted root, the kv data) MUST survive a pod restart.
# ONE replica (file storage is not HA — Raft/HA is a later concern).
# mlock is DISABLED: k3s pods cannot effectively mlock (24-restart crashloop proved
# it live) — the standard k8s posture (the official Helm chart defaults the same);
# swap is off on the nodes, so the protection mlock buys is moot here.
#
# ONE-TIME init/unseal is an operator action (never automated, never in git) —
# see README.md "Vault init & unseal". Until unsealed the pod is deliberately
# NOT Ready (the Service routes no traffic to a sealed Vault); the TCP liveness
# keeps it schedulable + exec-able so the operator can `kubectl exec` to unseal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eden-vault-config
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault
    app.kubernetes.io/part-of: eden
data:
  vault.hcl: |
    # File-storage single node. NO dev mode: the server boots SEALED and must be
    # init'd + unsealed once by an operator (README "Vault init & unseal").
    ui = false
    disable_mlock = true
    storage "file" {
      path = "/vault/file"
    }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }
    api_addr = "http://vault.eden.svc:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: eden-vault
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault
    app.kubernetes.io/part-of: eden
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eden-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eden-vault
        app.kubernetes.io/part-of: eden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # the hashicorp/vault image's `vault` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:1.18
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          ports:
            - name: http
              containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/file
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["IPC_LOCK"] # mlock: keep secrets out of swap
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness = process reachable (TCP). Deliberately NOT sealed-aware: a
          # sealed Vault is a healthy Vault awaiting unseal, and must stay alive
          # + exec-able for the operator to unseal it.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness = initialized AND unsealed AND active. /v1/sys/health returns
          # 200 only then (501 uninitialized, 503 sealed, 429 standby) — so the
          # Service routes to Vault ONLY once the operator has unsealed it.
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: eden-vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
