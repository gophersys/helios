# Eden platformgateway — the platform HTTP API (login/RBAC/projects; deploy design
# §1 / ADR-0022). Promoted from the eden Helm chart on release v0.1.4; image
# digest-pinned. Resolves its JWT signing key + Postgres DSN from
# vault://eden/production and mounts the eden-vault-token Secret at
# /vault/secrets/token. serviceAccountName platformgateway (declared in
# 20-rbac.yaml). Picked up by the app-eden Application; Argo reconciles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformgateway
  namespace: eden
  labels:
    app.kubernetes.io/name: platformgateway
    app.kubernetes.io/part-of: eden
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platformgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platformgateway
    spec:
      serviceAccountName: platformgateway
      containers:
        - name: platformgateway
          # v0.1.4
          image: "ghcr.io/gophersys/eden/platformgateway@sha256:0a0c86f8b0066f64ce8397ca964b5443f00bfd110231a1aa901d4581a2dd18ee"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EDEN_STAGE
              value: "production"
            - name: EDEN_GATEWAY_ADDRESS
              value: ":8080"
            - name: EDEN_VAULT_MODE
              value: "token-file"
            - name: EDEN_VAULT_TOKEN_FILE
              value: "/vault/secrets/token"
            - name: VAULT_ADDR
              value: "http://vault.eden.svc.cluster.local:8200"
            - name: EDEN_GATEWAY_JWT_SECRET_REF
              value: "vault://eden/production#platformgateway-jwt-signing-key"
            - name: EDEN_GATEWAY_DATABASE_DSN_REF
              value: "vault://eden/production#platformgateway-database-dsn"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: eden-vault-token
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: eden-vault-token
          secret:
            secretName: eden-vault-token
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: platformgateway
  namespace: eden
  labels:
    app.kubernetes.io/name: platformgateway
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: platformgateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
