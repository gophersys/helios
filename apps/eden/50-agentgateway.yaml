# Eden agentgateway — the stateless agent-session API (deploy design §1 / ADR-0022).
# Promoted from the eden Helm chart (deploy/plane/production/chart) on release
# v0.1.4; image digest-pinned so Argo reconciles the EXACT artifact. Talks to
# nats:4222, resolves its JWT signing key from vault://eden/production, and mounts
# the eden-vault-token Secret at /vault/secrets/token. serviceAccountName
# eden-agent (declared in 20-rbac.yaml). Picked up by the app-eden Application
# (recurse:false, flat dir); Argo selfHeal + prune + ServerSideApply reconciles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: eden
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/part-of: eden
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentgateway
    spec:
      serviceAccountName: eden-agent
      containers:
        - name: agentgateway
          # v0.1.6
          image: "ghcr.io/gophersys/eden/agentgateway@sha256:173f75779db3c13fc7bcf9533666f273ebed88e160b40be27b4f0d448c55783e"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EDEN_GATEWAY_ADDRESS
              value: ":8080"
            - name: EDEN_NATS_URL
              value: "nats://nats:4222"
            - name: EDEN_VAULT_MODE
              value: "token-file"
            - name: EDEN_VAULT_TOKEN_FILE
              value: "/vault/secrets/token"
            - name: VAULT_ADDR
              value: "http://vault:8200"
            - name: EDEN_GATEWAY_JWT_SECRET_REF
              value: "vault://eden/production#agentgateway-jwt-signing-key"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: eden-vault-token
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: eden-vault-token
          secret:
            secretName: eden-vault-token
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: eden
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: agentgateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
