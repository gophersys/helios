# eden — the Eden agentic-engineering platform namespace (stable release on homelab).
#
# Platform-owned Namespace: the `apps` AppProject is namespace-scoped and cannot
# create a cluster-scoped Namespace object, so a platform-project Application
# (app-eden-namespace) owns this file while the `apps`-project Application
# (app-eden) owns everything namespaced into it. Eden's workloads are ordinary
# unprivileged services (Vault is the one IPC_LOCK exception, scoped on its pod).
#
# Everything Eden runs on homelab lives here in ONE namespace (per the deploy
# design §1): the backing stack (Postgres/NATS/Vault) authored as the numbered
# manifests in this directory, plus the workload Deployments the eden Helm chart
# promotion later commits alongside them (agentgateway, agent-runtime,
# platformgateway, frontend).
#
# The 2 protection labels below are read by the in-tree ValidatingAdmissionPolicies
# in `platform/core/policy/`. They are enforcement, not documentation:
#   protected-storage — the apiserver REFUSES `DELETE persistentvolumeclaims` in
#     this namespace. It covers all 3 eden PVCs at once, including
#     `data-vault-0` and `data-eden-postgres-0`, which come from
#     volumeClaimTemplates and cannot be labelled individually on a live
#     StatefulSet (the field is immutable).
#   protected — the apiserver REFUSES `DELETE namespaces` on this object, which
#     is the cascade that garbage-collects those same PVCs.
# Every PV here reclaims with Delete on `local-path`, whose teardown script is
# `rm -rf`, and the `eden` namespace has no backup. Break glass by annotating the
# object with `platform.gophersys/allow-delete: "<reason>"` first.
apiVersion: v1
kind: Namespace
metadata:
  name: eden
  labels:
    app.kubernetes.io/part-of: eden
    platform.gophersys/protected-storage: "true"
    platform.gophersys/protected: "true"
