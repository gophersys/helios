# Eden NATS + JetStream (deploy design §1 / ADR-0022 #1). The agent event bus:
# the agent-runtime pods publish the normalized event stream to JetStream and
# subscribe to the control subject; the stateless agentgateway replays from the
# durable stream so any replica serves any session. A StatefulSet with a durable
# file store because a JetStream stream must survive a NATS pod restart. ONE
# replica at v0 (the single JetStream domain); a NATS cluster is a later concern
# behind the same `nats` Service name.
#
# JetStream is enabled via CLI flags (`--jetstream --store_dir`) per the locked
# deploy decision; the monitor port (8222) backs the readiness/liveness probes.
# Storage is the named `eden-nats-data` PVC on `local-path`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eden-nats-data
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-nats
    app.kubernetes.io/part-of: eden
    # This is the ARMED path #40 was opened for. This PVC is a bare object inside
    # an Argo Application with prune:true + selfHeal:true, so deleting or renaming
    # this file in a MERGED pull request prunes the PVC, the PV reclaims with
    # Delete, and the local-path teardown runs `rm -rf` on the only copy of the
    # JetStream store. The retain label makes `platform/core/policy/`'s
    # storage-delete-guard refuse that DELETE at the apiserver. It is redundant
    # today with the namespace label on 00-namespace.yaml, and deliberately so:
    # the PVC keeps its own guard if the namespace label is ever removed.
    platform.gophersys/retain: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-nats
    app.kubernetes.io/part-of: eden
spec:
  selector:
    app.kubernetes.io/name: eden-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-nats
    app.kubernetes.io/part-of: eden
spec:
  serviceName: nats
  replicas: 1
  # No `persistentVolumeClaimRetentionPolicy` here, deliberately, unlike
  # 05-postgres.yaml and 07-vault.yaml. This StatefulSet has no
  # volumeClaimTemplates — it mounts the bare `eden-nats-data` PVC declared above
  # — so the field would govern nothing. The guard for that PVC is its
  # `platform.gophersys/retain` label plus the namespace label.
  selector:
    matchLabels:
      app.kubernetes.io/name: eden-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eden-nats
        app.kubernetes.io/part-of: eden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.14.2-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data/jetstream"
            - "--http_port=8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eden-nats-data
