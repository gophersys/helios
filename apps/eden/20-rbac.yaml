# Eden RBAC — NAMESPACED grants (deploy design §5 gap 2), ported from
# apps/agentgateway/deploy/kubernetes/10-rbac.yaml into the `eden` namespace.
# The CLUSTER-SCOPED half (the orchestrator's create-project-namespace authority)
# lives in rbac-cluster/ under the platform project — the `apps` AppProject is
# namespace-scoped and cannot grant cluster-scoped resources.
#
# Three identities:
#   1. eden-agent          — the ServiceAccount the eden chart's stateless
#                            Deployments run as (agentgateway, agent-runtime,
#                            frontend set serviceAccountName: eden-agent, per
#                            deploy/plane/production/chart/templates/*). Declared
#                            here so the Deployments have an SA to bind to.
#   1b. platformgateway    — the platformgateway Deployment's own SA (the chart's
#                            platformgateway-deployment.yaml sets
#                            serviceAccountName: platformgateway). Declared so that
#                            Deployment binds; no RBAC rules (it needs none — Vault
#                            + Postgres are its only dependencies, both off-cluster
#                            of the k8s API).
#   2. eden-orchestrator   — the orchestrator pods' identity; its projected token
#                            is the in-cluster kubeconfig (leaderelection + the
#                            kubernetesadapter). The LEASE Role is namespaced here;
#                            the workspace ClusterRole is in rbac-cluster/.
#   3. eden-vault-seed     — the seed Job's identity: EXACTLY the one Secret
#                            get/create/update it needs to publish eden-vault-token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eden-agent
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-agent
    app.kubernetes.io/part-of: eden
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platformgateway
  namespace: eden
  labels:
    app.kubernetes.io/name: platformgateway
    app.kubernetes.io/part-of: eden
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eden-orchestrator
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
---
# The LEASE Role: leader election contends for a coordination.k8s.io/v1 Lease in
# `eden`. Replicas get/create/update it; watch lets the elector observe a peer's
# renewal. Scoped to the orchestrator's OWN namespace (the Lease never lives in a
# project namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eden-orchestrator-lease
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    # The leaderelection LeaseLock emits a leadership-transition Event
    # (best-effort); allow it so the election records the handoff.
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eden-orchestrator-lease
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-orchestrator
    app.kubernetes.io/part-of: eden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eden-orchestrator-lease
subjects:
  - kind: ServiceAccount
    name: eden-orchestrator
    namespace: eden
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eden-vault-seed
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault-seed
    app.kubernetes.io/part-of: eden
---
# The seed Job publishes exactly ONE Secret (eden-vault-token). get+create+update
# on secrets in `eden`, nothing more (no cluster scope, no other verbs). It reads
# eden-vault-init / eden-orchestrator-postgres / eden-bootstrap via mounted volumes
# (the kubelet resolves those — no API read grant needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eden-vault-seed
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault-seed
    app.kubernetes.io/part-of: eden
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eden-vault-seed
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-vault-seed
    app.kubernetes.io/part-of: eden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eden-vault-seed
subjects:
  - kind: ServiceAccount
    name: eden-vault-seed
    namespace: eden
