# Eden frontend production nginx — serves the static SvelteKit SPA build AND same-origin-proxies the
# two backends so the browser sees ONE origin (mandatory: the backends emit no CORS headers and the
# eden_token cookie is SameSite=strict). This mirrors the vite dev proxy (apps/frontend/vite.config.ts)
# as the production surface:
#   /            → the static build, SPA fallback to /index.html (the client router owns unknown paths)
#   /gateway/*   → agentgateway  (strip the /gateway prefix), SSE-safe (unbuffered, no read timeout)
#   /platform/*  → platformgateway (strip the /platform prefix)
#
# Listens on 8080 (the frontendSpec container port). Runs under nginx:alpine's default nginx user.
#
# LAZY UPSTREAM RESOLUTION (why proxy_pass uses a variable + resolver, not an upstream{} block): with a
# static `upstream`/literal proxy_pass, nginx resolves the backend hostname AT STARTUP and refuses to
# boot if it cannot — so the frontend pod would crash-loop whenever agentgateway/platformgateway are
# not yet resolvable (a fresh cluster, a rollout). Assigning the target to a `set` variable forces
# nginx to resolve it PER REQUEST via the `resolver` (the cluster DNS), so the frontend starts
# independently and a backend that appears later Just Works. The entrypoint's 15-local-resolvers.envsh
# populates $NGINX_LOCAL_RESOLVERS from /etc/resolv.conf (the pod's CoreDNS) — envsubst-injected here.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # nginx:alpine runs as a non-root user by default; keep every writable temp path off the
    # read-only image root under /tmp so the container needs no writable app dirs.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # gzip the static assets (the SPA bundle is JS/CSS-heavy).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The cluster DNS resolver, injected by the image entrypoint (15-local-resolvers.envsh reads the
    # pod's /etc/resolv.conf into $NGINX_LOCAL_RESOLVERS). valid=10s re-resolves as backend pods churn.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # ── /gateway/* → agentgateway, prefix stripped, SSE-SAFE ──────────────────────────────────
        # The variable in proxy_pass makes nginx resolve the host per-request (lazy) via the resolver
        # above, so the pod boots even when the backend is absent. The URI after the host is $1 (the
        # regex capture AFTER /gateway/), which strips the /gateway prefix — matching the vite rewrite
        # `path.replace(/^\/gateway/, '')`. SSE streams must not be buffered or timed out at the proxy.
        location ~ ^/gateway/(.*)$ {
            set $gateway_upstream http://agentgateway.eden.svc.cluster.local:8080;
            proxy_pass         $gateway_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            # SSE: stream events straight through — no response buffering, no read timeout.
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_set_header   X-Accel-Buffering no;
        }

        # ── /platform/* → platformgateway, prefix stripped ───────────────────────────────────────
        # Mirrors the vite rewrite `path.replace(/^\/platform/, '')`. The login POST + the /v1 API
        # ride this proxy; a plain reverse proxy (no SSE knobs needed here).
        location ~ ^/platform/(.*)$ {
            set $platform_upstream http://platformgateway.eden.svc.cluster.local:8080;
            proxy_pass         $platform_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── the SPA: serve a static asset if it exists, else the app shell (client router) ────────
        # Hashed immutable assets (SvelteKit writes them under /_app/immutable) can be cached hard.
        location /_app/immutable/ {
            expires    1y;
            add_header  Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
