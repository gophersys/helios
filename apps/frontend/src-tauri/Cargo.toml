[package]
name = "eden-desktop"
version = "0.0.0"
description = "Eden desktop shell — a Tauri 2 wrapper over the SvelteKit web bundle (ADR-0006)."
authors = ["Mateo Segura <mateo.segura413@gmail.com>"]
edition = "2021"
license = "UNLICENSED"
publish = false

# The Tauri shell is a THIN wrapper: it loads the same web bundle the browser does and adds the
# desktop-only handoffs (the vscode:// ssh-remote editor URI). No business logic lives in Rust.
[lib]
name = "eden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
# This feature is used by the prod build (`tauri build`) to embed the assets, mirroring the
# tauri create-app template; dev (`tauri dev`) loads the devUrl instead.
custom-protocol = ["tauri/custom-protocol"]
