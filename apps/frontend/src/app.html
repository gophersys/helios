<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme bootstrap (doc 17 §3): reflect the persisted preference onto <html data-theme>
         BEFORE first paint so there is no flash-of-wrong-theme. 'light'/'dark' set the attribute;
         'system' (or unset) leaves it off so the +layout's prefers-color-scheme block follows the
         OS. Shares the 'eden-theme' key with themePreference.svelte.ts (one home). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('eden-theme');
          if (p === 'light' || p === 'dark') {
            document.documentElement.setAttribute('data-theme', p);
          }
        } catch (e) {
          /* storage unavailable — fall through to system (OS-driven) theme. */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
