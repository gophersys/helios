[pytest]
# Alpha Validation Test Configuration
#
# Test stages (run specific directories):
#   pytest tests/gate/ -v          # Gate (<15 min, blocks merge)
#   pytest tests/nightly/ -v       # Nightly (30-60 min)
#   pytest tests/integration/ -v   # Integration (15-30 min)
#   pytest tests/fuota/ -v -s      # FUOTA (up to 2h, LTE-M wake cycle)
#
# With explicit timeout:
#   pytest tests/gate/ -v --timeout=900

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    corecloud: tests that require CoreCloud connectivity
    fuota: tests related to FUOTA delivery
    nfc: tests that require NFC reader hardware
    personalization: tests that require device personalization
    timeout: pytest-timeout marker for test timeouts

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Don't fail on deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:grpc.*
    ignore::DeprecationWarning:google.*
