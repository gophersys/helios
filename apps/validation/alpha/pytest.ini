[pytest]
# Alpha Validation Test Configuration
#
# Test stages (one per container run):
#   pytest tests/smoke/ -v           # Smoke — native_sim, no hardware
#   pytest tests/silicon/ -v         # Silicon — dev kit driver tests
#   pytest tests/integration/ -v     # Integration — harness instrumentation
#   pytest tests/nightly/ -v         # Nightly — comprehensive validation
#   pytest tests/fuota/ -v -s        # FUOTA — OTA update, blocks merge

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    corecloud: tests that require CoreCloud connectivity
    fuota: tests related to FUOTA delivery
    nfc: tests that require NFC reader hardware
    personalization: tests that require device personalization
    timeout: pytest-timeout marker for test timeouts
    integration: tests that require staging API connectivity

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Don't fail on deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:grpc.*
    ignore::DeprecationWarning:google.*
