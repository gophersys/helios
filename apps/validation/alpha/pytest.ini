[pytest]
testpaths = tests
addopts = -s
log_cli = true
log_cli_level = INFO

markers =
    smoke: MTIB hardware smoke tests (no CoreCloud needed)
    stage4: Stage 4 product validation tests
    corecloud: Tests requiring CoreCloud DB/API access
    motion: Tests requiring motion hardware (FluidNC)
    nfc: Tests requiring NFC reader hardware
    integration: Integration tests requiring external services
    hardware: Tests requiring physical hardware interaction
    optional: Optional tests (non-blocking)
