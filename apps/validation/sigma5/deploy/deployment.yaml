apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-sigma5
  namespace: validation
  labels:
    app: validation-sigma5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-sigma5
  strategy:
    # When we update the deployment we want to terminate the current
    # instance of this container in a host, and then start the new one
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: validation-sigma5
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: 'validation'
        vault.hashicorp.com/agent-inject-token: 'true'
    spec:
      # Allow the app 1 second to end "gracefully", and then force terminate
      terminationGracePeriodSeconds: 1
      
      # Service account for Vault authentication
      serviceAccountName: validation
      
      # Tolerations for node taints
      tolerations:
      - key: "role"
        operator: "Equal"
        value: "validation"
        effect: "NoSchedule"
      
      # Node affinity to prefer validation nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: "role"
                operator: In
                values:
                - "validation"
      containers:
      
      - name: validation-sigma5
        image: containers.ad.corekinect.com/concord-validation-sigma5:latest  # <- The image we want to deploy
        imagePullPolicy: Always                                     # Guarantees a fresh 'docker pull' every time

        # The container makes use of a lot of hardware on the host,
        # so we set it to priviledged to prevent permission issues
        securityContext:
          privileged: true

        # The ports for each test
        ports:
        - containerPort: 50060     # Validation test
          hostPort: 50060

        # Application configuration
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VAULT_URL
          value: "http://vault.cloud.svc.cluster.local:8200"
        - name: VAULT_TOKEN_FILE_PATH
          value: "/vault/secrets/token"
        - name: LOKI_URL
          value: "http://loki.cloud.svc.cluster.local:3100"

        # What volumes we mount from the pod onto this container
        volumeMounts:
        - name: logs
          mountPath: /var/log/validation

        # The resource definition below is telling k8s 'hey please
        # give me at least what I've `requested` and let me consume
        # up to the `limit`' "
        resources:
          requests:
            cpu: "250m"
            memory: "200Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"
            
      # We mount volumes from the host onto a pod. Since a pod can have more than 1
      # container in it, each container will have to mount the specific containers 
      # needed onto itself
      volumes:
      - name: logs
        hostPath:
          path: /var/log/validation
