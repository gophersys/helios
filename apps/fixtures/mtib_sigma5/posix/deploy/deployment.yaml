apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtib-posix
  labels:
    app: mtib-posix
spec:
  replicas: 6
  selector:
    matchLabels:
      app: mtib-posix
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: mtib-posix
    spec:
      terminationGracePeriodSeconds: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "kubernetes.io/hostname"
                operator: In
                values:
                - "control-plane"
                - "slot-1"
                - "slot-2"
                - "slot-3"
                - "slot-4"
                - "slot-5"
      containers:
      - name: mtib-posix
        image: control-plane:5000/mtib-posix:1.43
        securityContext:
          privileged: true
        ports:
        - containerPort: 50051
          hostPort: 12345
        volumeMounts:
        - name: dev-bus-usb
          mountPath: /dev/bus/usb
        - name: logs
          mountPath: /var/log/runner
        - name: tmp-fw-files
          mountPath: /tmp
        - name: cipher-uart
          mountPath: /dev/ttyS5
        - name: gpio
          mountPath: /sys/class/gpio
        resources:
          requests:
            cpu: "1000m"
            memory: "1000Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"
      volumes:
      - name: dev-bus-usb
        hostPath:
          path: /dev/bus/usb
      - name: logs
        hostPath:
          path: /var/log/runner
      - name: tmp-fw-files
        hostPath:
          path: /var/lib/fw_files
      - name: cipher-uart
        hostPath:
          path: /dev/ttyS5
      - name: gpio
        hostPath:
          path: /sys/class/gpio
