# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y

# CoreKinect libraries
CONFIG_CK_ESP32_WIFI_LIB=y

# System
CONFIG_NEWLIB_LIBC=y
CONFIG_SNTP=y
CONFIG_POSIX_CLOCK=y
CONFIG_NUM_PREEMPT_PRIORITIES=121
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=10000
CONFIG_MAIN_STACK_SIZE=3000
CONFIG_ASSERT=y
CONFIG_POLL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_PRINTK=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_BOOT_BANNER=y

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=5120
CONFIG_BASE64=y
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.4.2.107" # Useful for local development
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="0.0.0.0"
CONFIG_HTTP_CLIENT=y

# Thread-Aware debugging
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# D isable code optimization so we can debug
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_DEBUG_INFO=y

# Thread analyzer
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_LOG=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# -- system debug options
CONFIG_SYS_HEAP_VALIDATE=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_USAGE=y
CONFIG_STACK_CANARIES=y
