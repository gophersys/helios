# MinIO holds the ONLY off-cluster-ish backup copy (Longhorn's S3 target). It had
# zero network isolation. Lock ingress to who actually needs it:
#   - longhorn-system  -> :9000  (the backup/restore traffic)
#   - same namespace   -> any    (an ad-hoc `mc` admin pod; see apps/minio/README.md)
# The console (:9001) stays reachable only via `kubectl port-forward` (node-local
# traffic, not subject to NetworkPolicy). Egress is left open (MinIO is a sink).
# kube-router still lets kubelet health probes through under a default-deny (the
# media stack proves this).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-backups
  namespace: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
