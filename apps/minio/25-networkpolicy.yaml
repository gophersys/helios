# MinIO holds the ONLY off-cluster-ish backup copy. It had zero network
# isolation. Lock ingress to who actually needs it:
#   - longhorn-system  -> :9000  DEAD since 2026-08-19 — Longhorn was removed and
#                                 the namespace is gone, so this rule admits
#                                 nothing. Kept until the follow-up that reclaims
#                                 the longhorn-backups bucket; narrowing a live
#                                 NetworkPolicy belongs with that live step.
#   - ingress-nginx    -> :9000  (tailnet-private s3.mateosegura.com for off-cluster
#                                 restic clients; see 30-ingress.yaml)
#   - same namespace   -> any    (an ad-hoc `mc` admin pod; see apps/minio/README.md)
# The console (:9001) stays reachable only via `kubectl port-forward` (node-local
# traffic, not subject to NetworkPolicy). Egress is left open (MinIO is a sink).
# kube-router still lets kubelet health probes through under a default-deny (the
# media stack proves this).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-backups
  namespace: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
