# rayne.mateosegura.com — public, through the Cloudflare tunnel.
#
# Same model as home.mateosegura.com (apps/music/homepage/50-ingress.yaml):
# the tunnel enters nginx on :80, so there is deliberately NO tls: block and
# NO cert-manager annotation here — a TLS section would 308-redirect-loop.
# Cloudflare terminates public TLS at its edge.
#
# Out-of-band (Cloudflare Zero Trust console), two steps:
#   1. Tunnel `eden-home` -> Public Hostname:
#        rayne.mateosegura.com  ->  HTTP  ingress-nginx-controller.ingress-nginx.svc:80
#      (adding the public hostname creates the proxied CNAME automatically)
#   2. Do NOT create a Cloudflare Access app for this hostname.
#      home. and workspaces. sit behind Google SSO; this one must stay open,
#      because the intended reader has no account in that IdP. The page carries
#      its own shared-word gate instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rayne
  namespace: media
  annotations:
    # Real LE cert on :443 while the Cloudflare tunnel keeps using :80.
    # ssl-redirect MUST stay false: the tunnel connects on :80, and an
    # HTTP->HTTPS redirect there loops against cloudflared forever.
    cert-manager.io/cluster-issuer: letsencrypt-homelab
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  labels:
    app.kubernetes.io/name: rayne
spec:
  ingressClassName: nginx
  tls:
    - hosts: [rayne.mateosegura.com]
      secretName: rayne-tls
  rules:
    - host: rayne.mateosegura.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rayne
                port:
                  number: 8080
