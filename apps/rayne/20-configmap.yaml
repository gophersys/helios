# The page itself, carried in git so the app is reproducible from this repo
# alone (one small static file — no image build, no registry round-trip).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rayne
  namespace: media
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>for rayne</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
      /* Notion's actual tokens: a near-neutral dark, text at 81% white rather
         than pure white, secondary at 46%. Nothing here is fully saturated —
         that restraint is most of the "designed by a person" feeling. A little
         warmth is kept in the ink because this is a letter, not a dashboard. */
      /* Instrument Sans (variable, latin subset) embedded as a data URI: no
         Google request, so the page stays self-contained and her visit isn't
         logged anywhere but this server. Falls back to the system UI face. */
      @font-face{
        font-family:'Instrument Sans';
        src:url(data:font/woff2;base64,) format('woff2');
        font-weight:400 700;
        font-style:normal;
        font-display:swap;
      }
      :root{
        --bg:#191817;
        --ink:rgba(255,251,247,.86);
        --soft:rgba(255,251,247,.46);
        --faint:rgba(255,255,255,.055);
        --faint-hover:rgba(255,255,255,.09);
        --line:rgba(255,255,255,.094);
        --accent:#d9a679;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        /* This IS Notion's stack — they use the system UI face, not a webfont.
           Using it means zero network requests and native rendering on her
           phone, which is also why it looks native rather than generic. */
        font-family:'Instrument Sans',ui-sans-serif,-apple-system,
                    BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
        display:flex;
        padding:7vh 6vw 9vh;
        line-height:1.65;
      }
      main{width:100%;max-width:34rem;margin:auto}

      /* ── gate ─────────────────────────────────────────
         Its own screen: centred both ways, everything stacked
         on one axis so it reads as a single quiet moment.     */
      #gate{
        min-height:74vh;
        min-height:74dvh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        animation:rise 1s ease both;
      }
      /* Notion labels: small, medium weight, secondary colour, no tracking games. */
      #gate p{
        color:var(--soft);
        font-size:.875rem;
        font-weight:500;
        margin:0 0 1.1rem;
      }
      #form{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:.9rem;
      }
      /* Notion inputs are filled, not underlined: subtle surface, 6px radius,
         a 1px inner ring that brightens on focus. No glow, no colour shift. */
      input{
        font:inherit;font-size:.95rem;
        -webkit-text-security:disc;   /* dots, without type="password" */
        text-security:disc;
        background:var(--faint);
        border:1px solid transparent;
        box-shadow:inset 0 0 0 1px var(--line);
        border-radius:6px;
        color:var(--ink);
        padding:.5rem .75rem;
        width:15rem;
        text-align:center;
        outline:none;
        transition:box-shadow .15s ease,background .15s ease;
      }
      input:focus{
        background:rgba(255,255,255,.07);
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
      }
      input::placeholder{color:rgba(255,255,255,.28)}
      /* Notion buttons: 6px radius (never a pill), filled surface, weight 500,
         hover changes the fill rather than the border. */
      button{
        font:inherit;font-size:.875rem;font-weight:500;
        background:var(--faint);
        color:var(--ink);
        border:none;
        box-shadow:inset 0 0 0 1px var(--line);
        border-radius:6px;
        padding:.45rem 1.05rem;
        cursor:pointer;
        transition:background .15s ease;
      }
      button:hover{background:var(--faint-hover)}
      button:active{background:rgba(255,255,255,.12)}
      .you{
        color:var(--soft);
        font-size:.875rem;
        font-weight:500;
        margin-top:.5rem;
      }
      /* She's warm-toned art on a warm-dark page, so she already belongs here.
         The background was made genuinely transparent (edge flood-fill) rather
         than hidden with a blend mode — a blend mode would have muddied the
         colours. The soft glow just seats her on the page instead of leaving her
         cut out and floating. */
      /* No glow, no tilt. The background is genuinely transparent, so she just
         sits on the page — a decorative flourish is what would read as generated. */
      #spud{
        width:116px;
        max-width:40vw;
        height:auto;
        display:block;
        margin-top:.15rem;
      }
      /* Points back up at her: the potato is the clue, and the potato is u. */
      .uu{
        display:flex;
        align-items:center;
        gap:.4rem;
        color:var(--soft);
        font-size:.875rem;
        font-weight:500;
        margin-top:-.15rem;
      }
      .arrow{
        font-size:.95rem;
        line-height:1;
        opacity:.7;
      }
      #hint{
        color:var(--soft);font-size:.86rem;
        margin-top:1.8rem;min-height:1.2em;
        opacity:0;transition:opacity .35s;
      }
      #hint.show{opacity:1}


      /* ── gift ──────────────────────────────────────── */
      #gift{
        margin-top:2.4rem;
        margin-bottom:.5rem;
        padding:.5rem 1.1rem;
        font-size:.9rem;
      }
      #sheet[hidden]{display:none}
      #sheet{
        position:fixed;inset:0;z-index:50;
        display:flex;align-items:center;justify-content:center;
        padding:5vh 5vw;
      }
      #scrim{
        position:absolute;inset:0;
        background:rgba(0,0,0,.62);
        -webkit-backdrop-filter:blur(3px);
        backdrop-filter:blur(3px);
        animation:fade .22s ease both;
      }
      #card{
        position:relative;
        width:min(460px,100%);
        max-height:90vh;
        max-height:90dvh;
        display:flex;flex-direction:column;
        background:#221f1d;
        border:1px solid var(--line);
        border-radius:10px;
        padding:1.1rem 1.1rem 1rem;
        animation:pop .24s cubic-bezier(.2,.7,.3,1) both;
      }
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
      #x{
        position:absolute;top:.5rem;right:.5rem;
        width:28px;height:28px;padding:0;
        font-size:1.05rem;line-height:1;
        background:transparent;box-shadow:none;color:var(--soft);
      }
      #x:hover{background:var(--faint);color:var(--ink)}
      #cap{
        margin:.1rem 2rem .9rem 0;
        font-size:.95rem;line-height:1.5;
        color:var(--ink);
      }
      /* One scroller, snapping panel to panel: swipe on a phone, drag or
         shift-scroll on a laptop. No JS drag handling to get wrong. */
      #track{
        display:flex;
        min-height:0;
        min-width:0;
        overflow-x:auto;
        scroll-snap-type:x mandatory;
        gap:.6rem;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;
        border-radius:8px;
      }
      #track::-webkit-scrollbar{display:none}
      .slide{
        flex:0 0 100%;
        width:100%;
        scroll-snap-align:center;
        border-radius:8px;
        background:#fff;
        display:block;
        max-height:68vh;
        max-height:68dvh;
        object-fit:contain;
      }
      #dots{display:flex;gap:.4rem;justify-content:center;margin-top:.85rem}
      .dot{
        width:6px;height:6px;border-radius:50%;
        background:rgba(255,255,255,.22);
        transition:background .2s ease;
      }
      .dot.on{background:rgba(255,255,255,.66)}

      /* ── letter ───────────────────────────────────── */
      #letter{display:none}
      #letter.show{display:block;animation:rise 1.1s ease both}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      /* One voice: every line is body text at the same size and weight. No
         heading, no pull-quote, no accent colour — it should read like something
         typed out, not like a designed page. */
      #letter p{
        margin:0 0 1.45rem;
        font-size:1rem;
        line-height:1.7;
      }
      #letter p:last-child{margin-bottom:0}
      #letter blockquote{
        margin:1.45rem 0;
        padding-left:.95rem;
        border-left:3px solid var(--line);
        color:var(--soft);
        font-size:1rem;
        line-height:1.7;
      }
      #letter blockquote em{color:var(--ink);font-style:italic}
      em{font-style:italic}

      @media (max-width:560px){
        body{
          padding:5vh 7vw 14vh;
          line-height:1.72;
        }
        main{margin:0 auto}
        #letter p{font-size:1.06rem;margin-bottom:1.45rem}
        #gate{min-height:70vh;min-height:70dvh}
        input{width:11rem;font-size:1.25rem}
      }
      /* Short landscape phones */
      @media (max-height:520px){
        body{padding-top:4vh}
        main{margin:0 auto}
      }
    </style>
    </head>
    <body>
    <main>

      <section id="gate">
        <p>password</p>
        <form id="form">
          <input id="pw" type="text" inputmode="text" enterkeyhint="go"
                 name="clue" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false"
                 data-lpignore="true" data-1p-ignore data-form-type="other"
                 aria-label="password">
          <div class="you">clue</div>
          <img id="spud" alt="" src="data:image/png;base64,">
          <div class="uu"><span class="arrow">↑</span> u</div>
          <button type="submit">enter</button>
        </form>
        <div id="hint"></div>
      </section>

      <section id="letter">
        <p>rayne, hi i come in peace.</p>

        <p>i’m sorry for the words i said, it probably didn’t help huh. i was sad, i thought u didn’t care. and being ghosted triggers abandonment wounds. but i could have handled that better. i apologize.</p>

        <p>listen, i know im moving to another state, but i’m fully willing to put in the effort and logistics to make things work. its like 2 mins down the road. ure so so so worth it.</p>

        <p>i will fly out, fly u out, take nice bicep pics for u, watch movies over discord, we could travel and meet in random places, idk, keep it interesting, make the distance work, whatever it takes. i want to build something real with u.</p>

        <p>i dont want to lose that chance. or u.</p>

        <p>im happy we ran into each other. i know i don’t fully know u yet - and all of the rest of the red flags that u come with, <em>**cough cough**</em>. but i liked how i felt around u.</p>

        <p>i like u, and i am choosing u. but it only works if we are both in it and willing to be straight with each other - a safe space for both of us.</p>

        <p>do u want to work through this with me?</p>

        <p>can we be people who care too much in a world full of people don’t care at all?</p>

        <p>can u let yourself be loved ffs woman? lol</p>

        <blockquote>“two independent spirits, together because they <em>want</em> to be, not because they <em>have</em> to be.”</blockquote>

        <p>anyways, think about it.</p>

        <p>matoe</p>

        <button type="button" id="gift">open gift 🎁</button>
      </section>

    </main>

      <div id="sheet" hidden>
        <div id="scrim"></div>
        <div id="card" role="dialog" aria-modal="true" aria-label="a gift">
          <button type="button" id="x" aria-label="close">×</button>
          <p id="cap">can i have u for dinner one of these nights 👅🫦</p>
          <div id="track">
            <img class="slide" src="data:image/png;base64," alt="">
            <img class="slide" src="data:image/png;base64," alt="">
          </div>
          <div id="dots"><span class="dot on"></span><span class="dot"></span></div>
        </div>
      </div>


    <script>
      // Not security — a shared secret between two people.
      // The word is hashed so it isn't sitting in plain sight in the source.
      function h(s){let x=5381;for(let i=0;i<s.length;i++){x=((x<<5)+x)^s.charCodeAt(i);}return x>>>0;}
      const KEY = 2601766897;

      const gate = document.getElementById('gate');
      const letter = document.getElementById('letter');
      const pw = document.getElementById('pw');
      const hint = document.getElementById('hint');
      // Escalating, because her getting it wrong repeatedly is the funniest
      // outcome. Sticks on the last one, which just gives it away.
      const nudges = [
        "awww poor baby, try again",
        "ok. there is a literal arrow pointing at the answer ([u]+e)",
        "fine — it's potatoe. with an e. because you're extra 🥔"
      ];
      let tries = 0;

      // Always ask. No session memory — every visit starts at the gate.
      function open_(){
        gate.style.display = 'none';
        letter.classList.add('show');
      }

      document.getElementById('form').addEventListener('submit', function(e){
        e.preventDefault();
        pw.blur();                       // drop the mobile keyboard
        const v = pw.value.trim().toLowerCase();
        if(h(v) === KEY){ open_(); }
        else{
          hint.textContent = nudges[Math.min(tries, nudges.length-1)];
          hint.classList.add('show');
          tries++;
        }
      });


      // ── gift modal ────────────────────────────────────────────────────
      const sheet = document.getElementById('sheet');
      const track = document.getElementById('track');
      const dots  = [...document.querySelectorAll('.dot')];
      let lastFocus = null;

      function openSheet(){
        lastFocus = document.activeElement;
        sheet.hidden = false;
        document.body.style.overflow = 'hidden';   // don't scroll the letter behind
        track.scrollLeft = 0;
        syncDots();
        document.getElementById('x').focus();
      }
      function closeSheet(){
        sheet.hidden = true;
        document.body.style.overflow = '';
        if (lastFocus) lastFocus.focus();
      }
      function syncDots(){
        const i = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach((d, n) => d.classList.toggle('on', n === i));
      }

      document.getElementById('gift').addEventListener('click', openSheet);
      document.getElementById('x').addEventListener('click', closeSheet);
      document.getElementById('scrim').addEventListener('click', closeSheet);
      track.addEventListener('scroll', syncDots, {passive:true});
      dots.forEach((d, n) => d.addEventListener('click', () => {
        track.scrollTo({left: n * track.clientWidth, behavior:'smooth'});
      }));
      document.addEventListener('keydown', e => {
        if (sheet.hidden) return;
        if (e.key === 'Escape') closeSheet();
        if (e.key === 'ArrowRight') track.scrollBy({left: track.clientWidth, behavior:'smooth'});
        if (e.key === 'ArrowLeft')  track.scrollBy({left:-track.clientWidth, behavior:'smooth'});
      });

      pw.focus();
    </script>
    </body>
    </html>
