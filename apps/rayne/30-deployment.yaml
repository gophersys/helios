# Static page server. nginx-unprivileged (not stock nginx): it listens on 8080
# and runs as non-root out of the box, so the pod satisfies the same hardening
# the edge uses (non-root, read-only rootfs, all caps dropped) without a
# PolicyException.
#
# The two emptyDirs are required by a read-only rootfs: nginx writes its pid
# and its temp/proxy scratch at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rayne
  namespace: media
  labels:
    app.kubernetes.io/name: rayne
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rayne
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rayne
      annotations:
        # Roll the pod when the page changes — a ConfigMap edit alone would
        # otherwise leave the running container serving the old file until
        # kubelet's periodic resync.
        checksum/page: "7cac3d875f9ae01f"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            # Whole-ConfigMap mount, NOT subPath: a subPath mount is frozen
            # at pod creation and never sees a ConfigMap update.
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: page
          configMap:
            name: rayne
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
