  #     - AUTH_SERVER_CREDENTIALS_USER=user
  #     - AUTH_SERVER_CREDENTIALS_PASS=pass

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
      POSTGRES_DB: concord
      POSTGRES_MAX_CONNECTIONS: 200 # Default is usually 100
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
