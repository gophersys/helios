volumes:
  postgres_data_volume:


services:
  # proxy:
  #   image: containers.ad.corekinect.com/concord-proxy:latest
  #   ports:
  #     - 5000:5000
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:localhost@db:5432/postgres
  #     - DIRECT_URL=postgresql://postgres:localhost@db:5432/postgres
  #     - AUTH_SERVER_URL=http://localhost:8080
