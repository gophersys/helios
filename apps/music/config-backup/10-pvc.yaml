# Backup target on Longhorn (replicated across nodes) — so a k3s-w-1 disk loss
# doesn't take the config AND its backup with it (the local-path config PVCs are
# single-node). Small: the config state is tiny.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-config-backups
  namespace: media
  labels:
    app.kubernetes.io/part-of: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
