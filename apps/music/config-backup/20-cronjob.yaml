# Daily tar of the hard-to-reproduce config PVCs (qBittorrent/Prowlarr/filebrowser
# runtime state) to /mnt/media/backups (NVMe — a separate physical disk from the
# OS-disk local-path the config lives on), 14-day retention. Reads the local-path
# storage dir directly (read-only) instead of mounting the RWO config PVCs, which
# can't be co-mounted while the app pods hold them. Pinned to k3s-w-1 where the
# data + NVMe live. Crash-consistent (live DB tar) — fine for a homelab, and the
# configs are independently reproducible (config-enforce / SETUP.md / initC).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: config-backup
  namespace: media
  labels:
    app.kubernetes.io/part-of: music
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: k3s-w-1
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              image: busybox:1.36
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date +%Y%m%d-%H%M)
                  mkdir -p /backups
                  for name in qbittorrent-config prowlarr-config filebrowser-config; do
                    dir=$(ls -d /storage/*_media_"$name" 2>/dev/null | head -1)
                    if [ -n "$dir" ]; then
                      tar czf "/backups/${name}-${TS}.tar.gz" -C "$dir" . && echo "backed up $name ($(du -sh "$dir" | cut -f1))"
                    else
                      echo "WARN: $name dir not found"
                    fi
                  done
                  find /backups -name '*.tar.gz' -mtime +14 -delete
                  echo "backup complete: $(ls /backups/*.tar.gz 2>/dev/null | wc -l) archives"
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: storage, mountPath: /storage, readOnly: true }
                - { name: backups, mountPath: /backups }
          volumes:
            - name: storage
              hostPath:
                path: /var/lib/rancher/k3s/storage
                type: Directory
            - name: backups
              hostPath:
                path: /mnt/media/backups
                type: DirectoryOrCreate
