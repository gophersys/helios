# qBittorrent behind a Gluetun (ProtonVPN WireGuard) kill-switch.
#
# HOW THE VPN ISOLATION WORKS
# Both containers share the pod's network namespace. Gluetun brings up the
# WireGuard tunnel INSIDE that namespace, sets the default route through the VPN,
# and installs a kill-switch firewall. qBittorrent has no network config of its
# own — because it shares the namespace, ALL its traffic is forced through the
# tunnel. If the tunnel drops, the firewall blocks everything → the real IP can
# never leak. We punch two holes in the firewall so the Web UI stays reachable:
#   - FIREWALL_INPUT_PORTS=8080          (let the UI port in)
#   - FIREWALL_OUTBOUND_SUBNETS=<LAN+k8s> (let replies / health checks / DNS out)
#
# The `gluetun-wireguard` Secret is NOT in git. Create it from the vault:
#   WG=$(bw get notes "shared/protonvpn/wireguard")
#   kubectl -n media create secret generic gluetun-wireguard \
#     --from-literal=WIREGUARD_PRIVATE_KEY="$(printf '%s' "$WG" | awk -F' = ' '/^PrivateKey/{print $2}')" \
#     --from-literal=WIREGUARD_ADDRESSES="$(printf '%s' "$WG" | awk -F' = ' '/^Address/{print $2}' | cut -d, -f1 | tr -d ' ')"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volumes + stateful singleton
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Pin to k3s-w-1 — the media node with the /mnt/media NVMe (downloads
      # hostPath) and the config PV. The old zone pin (pve-00) also matched
      # k3s-w-0, the same latent wrong-node bug prowlarr hit (#88).
      nodeSelector:
        kubernetes.io/hostname: k3s-w-1
      initContainers:
        # Reconcile the download-critical settings into qBittorrent.conf BEFORE
        # qBittorrent starts, so binding-to-tun0 + the in-cluster auth whitelist
        # survive a config-PVC rebuild (docs/debt-register.md, D1). Idempotent
        # and surgical — a no-op when the conf is already compliant. Script is
        # the tested config-enforce/enforce_qbt.py, shipped via ConfigMap.
        - name: enforce-config
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - >-
              python3 /scripts/enforce_qbt.py /config/qBittorrent/qBittorrent.conf
              && { chown 1000:1000 /config/qBittorrent /config/qBittorrent/qBittorrent.conf 2>/dev/null || true; }
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-enforce
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        # ---------- VPN sidecar: all pod egress routes through here ----------
        - name: gluetun
          image: qmcgaw/gluetun@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab  # v3 pinned by digest (kill-switch behavior must not drift)
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          # Clear stale WireGuard ip rules before gluetun installs its own.
          # Kubernetes shares ip rules across the whole pod, and the pod's
          # network namespace SURVIVES a container restart — so one abrupt
          # gluetun exit leaves rule 101 behind and every restart after it
          # dies on "adding ip rule 101: file exists" forever (this cost us
          # 937 restarts and a 503 on the Web UI). Documented upstream fix:
          # gluetun-wiki/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-wireguard
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-wireguard
                  key: WIREGUARD_ADDRESSES
            # Port forwarding (Proton NAT-PMP) — needed for healthy seeding.
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: protonvpn
            - name: PORT_FORWARD_ONLY
              value: "on"       # only connect to servers that support port forwarding
            # Kill-switch firewall exceptions so the Web UI stays reachable.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,10.168.0.0/24"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: TZ
              value: America/Los_Angeles
          volumeMounts:
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        # ---------- qBittorrent: no network of its own; uses gluetun's ----------
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent@sha256:dd24a5f3db32bc1425d3f8dc95e8aca8ac5a35905d798171230edf33f516d9a4  # 5.2.2 pinned by digest (D2: Prowlarr compat depends on this)
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: qbit-ui
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        # ---------- port-sync: keep qBit's listen port == gluetun's forwarded port ----------
        # ProtonVPN hands out a NEW forwarded port on every VPN reconnect. Without
        # this, qBittorrent keeps listening on a stale port, incoming peers can't
        # reach it, torrents run "firewalled" and speeds tank. This watches the
        # port gluetun writes and pushes it into qBit (localhost auth is bypassed
        # for 127.0.0.1, so no credentials needed). Durable across reconnects.
        - name: port-sync
          image: curlimages/curl:8.11.0
          command: ["sh", "-c"]
          args:
            - |
              last=""
              while true; do
                p=$(cat /tmp/gluetun/forwarded_port 2>/dev/null || true)
                if [ -n "$p" ] && [ "$p" != "$last" ]; then
                  if curl -sf -m 10 -H "Referer: http://localhost:8080" \
                       -X POST "http://localhost:8080/api/v2/app/setPreferences" \
                       --data-urlencode "json={\"listen_port\":$p,\"random_port\":false,\"upnp\":false}" >/dev/null 2>&1; then
                    echo "port-sync: qBittorrent listen_port -> $p"; last="$p"
                  else
                    echo "port-sync: qBittorrent not ready yet, will retry"
                  fi
                fi
                sleep 30
              done
          volumeMounts:
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        # Downloads live on the /mnt/media NVMe (87G class), NOT a local-path
        # PVC on the 58G OS disk — a big torrent there fills the root disk and
        # DiskPressure-evicts the node. Migrated 2026-07-09; mount path inside
        # the container is unchanged (/downloads) so fastresume state survives.
        - name: downloads
          hostPath:
            path: /mnt/media/downloads
            type: DirectoryOrCreate
        - name: gluetun-tmp
          emptyDir: {}
        - name: config-enforce
          configMap:
            name: qbittorrent-config-enforce
