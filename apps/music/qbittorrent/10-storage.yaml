# Storage for qBittorrent.
#
# Config: a small local-path PVC (WaitForFirstConsumer binds it on k3s-w-1,
# where the Deployment is hostname-pinned). NOT Longhorn on purpose — the
# config is enforced/reproducible (config-enforce initContainer) and backed up
# nightly (apps/music/config-backup/).
#
# Downloads: NOT a PVC. They live on the /mnt/media NVMe as a hostPath
# (see 20-deployment.yaml) — a large-nominal local-path PVC sat on the 58G OS
# disk, where one big torrent could fill the root disk and DiskPressure-evict
# the node. Migrated 2026-07-09.
#
# NOTE: local-path does not enforce the requested size (it provisions a hostPath
# dir), so `storage:` here is a nominal label; actual limit is the disk itself.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
