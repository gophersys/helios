# Prowlarr config PVC — local-path (config only, small, re-creatable index defs).
# WaitForFirstConsumer + the Deployment's pve-00 pin keep it on the media node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
