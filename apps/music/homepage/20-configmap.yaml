# Homepage config as code. Each key becomes a file in /app/config.
# Secrets ({{HOMEPAGE_VAR_*}}) are substituted from env (Secret homepage-secrets,
# created imperatively — never in git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
  labels:
    app: homepage
    app.kubernetes.io/part-of: music
data:
  settings.yaml: |
    title: Segura Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank
    hideVersion: true
    layout:
      Media:
        style: row
        columns: 3
        icon: mdi-play-circle-outline
      Platform:
        style: row
        columns: 3
        icon: mdi-kubernetes
      Studio:
        style: row
        columns: 2
        icon: mdi-music-note-eighth
      Monitoring:
        style: row
        columns: 2
        icon: mdi-chart-areaspline

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Segura Homelab
    - datetime:
        text_size: l
        format:
          dateStyle: full
          timeStyle: short
    - resources:
        label: media node
        cpu: true
        memory: true
        disk: /media
    - search:
        provider: duckduckgo
        target: _blank

  services.yaml: |
    - Media:
        - qBittorrent:
            href: https://torrent.mateosegura.com
            description: Torrent client · VPN-locked
            icon: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent:8080
              username: admin
              password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
        - Prowlarr:
            href: https://prowlarr.mateosegura.com
            description: Search · unified indexers
            icon: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - Filebrowser:
            href: https://files.mateosegura.com
            description: Browse & download files
            icon: filebrowser
            siteMonitor: http://filebrowser.media.svc.cluster.local

    - Platform:
        - Argo CD:
            href: https://argocd.mateosegura.com
            description: GitOps delivery
            icon: argo-cd
            siteMonitor: http://argocd-server.argocd.svc.cluster.local
        - Workspaces:
            href: https://workspaces.mateosegura.com
            description: Zephyr dev environments
            icon: mdi-chip
            siteMonitor: http://workspaces-api.workspaces-prod.svc.cluster.local:8080/api/workspaces
        - Filebrowser Backups:
            description: MinIO · Longhorn backup store
            icon: minio
            siteMonitor: http://minio.minio.svc.cluster.local:9000/minio/health/ready

    - Studio:
        # Runs ON the MacBook Air, not in the cluster: it needs Ableton Live,
        # AbletonOSC (localhost UDP) and ~/Music, none of which exist here.
        # Tailnet-only by design — these links work on the tailnet, and the
        # cards show offline whenever the laptop is asleep. That is expected.
        - Studio Dashboard:
            href: http://100.89.71.64:8737/
            description: Productions, drum tabs, chord charts · MacBook Air
            icon: mdi-tune-vertical
            siteMonitor: http://100.89.71.64:8737/
        - Practice Library:
            href: http://100.89.71.64:8737/library
            description: Play-along stems · streams to phone
            icon: mdi-drum

    - Monitoring:
        - Grafana:
            href: https://grafana.mateosegura.com
            description: Metrics & dashboards
            icon: grafana
            siteMonitor: http://grafana.observability.svc.cluster.local
        - Prometheus:
            description: Metrics store · in-cluster
            icon: prometheus
            siteMonitor: http://prometheus-server.observability.svc.cluster.local

  bookmarks.yaml: |
    - Studio:
        - Tabs & Charts:
            - abbr: TAB
              icon: mdi-music-clef-treble
              href: http://100.89.71.64:8737/tabs
        - Music repo:
            - abbr: MU
              icon: github
              href: https://github.com/MateoSegura/music-studio

    - Admin:
        - GitHub:
            - abbr: GH
              icon: github
              href: https://github.com/gophersys
        - Tailscale:
            - abbr: TS
              icon: tailscale
              href: https://login.tailscale.com/admin/machines
        - Cloudflare:
            - abbr: CF
              icon: cloudflare
              href: https://dash.cloudflare.com
        - ProtonVPN:
            - abbr: PV
              icon: proton-vpn
              href: https://account.protonvpn.com
