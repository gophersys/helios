services:
  # Logic 2 Sidecar - x86_64 with QEMU emulation
  # Provides automation API on port 10430 for mtib-server
  logic2-sidecar:
    image: containers.ad.corekinect.com/logic2-sidecar:latest
    platform: linux/amd64  # Forces x86_64, uses QEMU on ARM64
    privileged: true  # Needs USB access
    ports:
      - 50052:50052  # MTIB server port (shared network)
    volumes:
      - /dev/bus/usb:/dev/bus/usb  # USB device access for Saleae
    environment:
      - DISPLAY=:99
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10430"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Main MTIB Server - ARM64 native for max performance
  mtib-server:
    image: containers.ad.corekinect.com/concord-mtib-server-v2:latest
    pull_policy: always
    privileged: true
    env_file:
      - ../.env
    volumes:
      - /dev:/dev
      - /sys/class/hwmon:/sys/class/hwmon
      - /sys/class/gpio:/sys/class/gpio
      - /sys/bus/iio:/sys/bus/iio
    depends_on:
      logic2-sidecar:
        condition: service_healthy  # Wait for Logic 2 to be ready
    network_mode: "service:logic2-sidecar"  # Share network with sidecar (localhost communication)
