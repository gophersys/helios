[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src ../../../libs/python ../../../libs/protocols ../../../libs
addopts = -v --tb=short

markers =
    unit: fast isolated tests (no I/O)
    integration: tests that use real infrastructure (DB, network)
    contract: API contract / response shape validation tests
    slow: tests taking > 1 second

filterwarnings =
    ignore::DeprecationWarning:grpc.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:eventlet.*
