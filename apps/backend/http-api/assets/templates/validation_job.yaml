apiVersion: batch/v1
kind: Job
metadata:
  name: "{{JOB_NAME}}"
  labels:
    app: "validation-{{PRODUCT}}"
    corekinect.com/validation-product: "{{PRODUCT}}"
    corekinect.com/validation-job-id: "{{JOB_ID}}"
spec:
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: "validation-{{PRODUCT}}"
        corekinect.com/validation-product: "{{PRODUCT}}"
        corekinect.com/validation-job-id: "{{JOB_ID}}"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # Run on regular agent nodes (x86), connect to MTIB remotely
      # No nodeSelector - use any available node except edge nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: corekinect.com/role
                operator: NotIn
                values:
                - edge
      containers:
      - name: "validation-{{PRODUCT}}"
        image: "containers.ad.corekinect.com/concord-validation-{{PRODUCT}}:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        securityContext:
          privileged: false
        env:
        - name: ENVIRONMENT
          value: "{{ENVIRONMENT}}"
        - name: STAGE
          value: "{{STAGE}}"
        - name: LOG_LEVEL
          value: "4"
        - name: PIPELINE_ID
          value: "{{PIPELINE_ID}}"
        - name: TEST_PACKAGE_VERSION
          value: "{{TEST_PACKAGE_VERSION}}"
        - name: PRODUCT
          value: "{{PRODUCT}}"
        - name: CONCORD_API_URL
          value: "{{CONCORD_API_URL}}"
        - name: CONCORD_RUN_ID
          value: "{{CONCORD_RUN_ID}}"
        - name: CONCORD_API_KEY
          value: "{{CONCORD_API_KEY}}"
        - name: CONCORD_API_HOST
          value: "{{CONCORD_API_HOST}}"
        - name: STORAGE_URL
          value: "{{STORAGE_URL}}"
        - name: STORAGE_ACCESS_KEY
          value: "{{STORAGE_ACCESS_KEY}}"
        - name: STORAGE_SECRET_ACCESS_KEY
          value: "{{STORAGE_SECRET_ACCESS_KEY}}"
        - name: STORAGE_BUCKET_NAME
          value: "{{STORAGE_BUCKET_NAME}}"
        - name: MTIB_HOST
          value: "{{MTIB_ADDRESS}}"
        - name: MTIB_PORT
          value: "{{MTIB_PORT}}"
        - name: LOKI_URL
          value: "http://10.4.45.3:3100/loki/api/v1/push"
        - name: TEST_ENABLE_ELECTRICAL
          value: "{{TEST_ENABLE_ELECTRICAL}}"
        - name: TEST_ENABLE_APP_POST
          value: "{{TEST_ENABLE_APP_POST}}"
        - name: TEST_ENABLE_COMM_POST
          value: "{{TEST_ENABLE_COMM_POST}}"
        # ── CoreCloud Database (VAL_1_0 — from K8s secret) ──
        - name: CORECLOUD_DB_ENV
          value: "VAL_1_0"
        - name: VAL_1_0_DB_DRIVER
          value: "postgresql+psycopg2"
        - name: VAL_1_0_DB_USER
          value: "concord_val"
        - name: VAL_1_0_DB_PASS
          valueFrom:
            secretKeyRef:
              name: corecloud-validation
              key: db-password
        - name: VAL_1_0_DB_HOST
          value: "validation.ad.corekinect.com"
        - name: VAL_1_0_DB_PORT
          value: "5432"
        - name: VAL_1_0_DB_NAME
          value: "test"
        - name: VAL_1_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: corecloud-validation
              key: api-key
        - name: VAL_1_0_API_AUTH_SERVER_HOST_NAME
          value: "https://auth.office.corekinect.cloud:2013"
        - name: VAL_1_0_API_REST_SERVER_HOST_NAME
          value: "https://val.office.corekinect.cloud:2018/api"
        - name: VAL_1_0_API_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: corecloud-validation
              key: auth-username
        - name: VAL_1_0_API_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: corecloud-validation
              key: auth-password
        # ── Bench/Device Identity (from TestBench scheduler or manual trigger) ──
        - name: MTIB_ADDRESS
          value: "{{MTIB_ADDRESS}}"
        - name: BENCH_ID
          value: "{{BENCH_ID}}"
        - name: PRODUCT_SLUG
          value: "{{PRODUCT_SLUG}}"
        - name: DEVICE_ID
          value: "{{DEVICE_ID}}"
        - name: DEVICE_SNR
          value: "{{DEVICE_SNR}}"
        - name: FIXTURE_PROFILE_PATH
          value: "{{FIXTURE_PROFILE_PATH}}"
        # ── CoreOps (device personalization) ──
        - name: COREOPS_SERVER_URL
          value: "https://coreops.office.corekinect.cloud:2013"
        - name: COREOPS_AUTH_SERVER_URL
          value: "https://auth.office.corekinect.cloud:2013"
        - name: COREOPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: coreops-credentials
              key: api-key
        - name: COREOPS_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: coreops-credentials
              key: auth-user
        - name: COREOPS_AUTH_PASS
          valueFrom:
            secretKeyRef:
              name: coreops-credentials
              key: auth-pass
        - name: DEVICE_IMEI
          value: "{{DEVICE_IMEI}}"
        - name: DEVICE_ICCIDS
          value: "{{DEVICE_ICCIDS}}"
        # ── Test Filtering ──
        - name: PYTEST_FILTER
          value: "{{PYTEST_FILTER}}"
        - name: FUOTA_LABEL
          value: "{{FUOTA_LABEL}}"
        - name: PYTEST_DIR
          value: "{{PYTEST_DIR}}"
        - name: PYTEST_MARKER
          value: "{{PYTEST_MARKER}}"
        # ── Test Artifacts ──
        - name: ARTIFACTS_DIR
          value: "/var/log/validation"
        volumeMounts:
        - name: logs
          mountPath: /var/log/runner
        - name: artifacts
          mountPath: /var/log/validation
        resources:
          requests:
            cpu: "250m"
            memory: "200Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"
      volumes:
      - name: logs
        hostPath:
          path: /var/log/tests
      - name: artifacts
        emptyDir: {}
