apiVersion: batch/v1
kind: Job
metadata:
  name: {{JOB_NAME}}
  labels:
    app: validation-{{PRODUCT}}
    corekinect.com/validation-product: {{PRODUCT}}
    corekinect.com/validation-job-id: {{JOB_ID}}
spec:
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: validation-{{PRODUCT}}
        corekinect.com/validation-product: {{PRODUCT}}
        corekinect.com/validation-job-id: {{JOB_ID}}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # Add tolerations for validation node taints
      tolerations:
      - key: "corekinect.com/role"
        operator: "Equal"
        value: "edge"
        effect: "NoSchedule"
      nodeSelector:
        corekinect.com/validation-product: {{PRODUCT}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: corekinect.com/validation-product
                operator: In
                values:
                - "{{PRODUCT}}"
            topologyKey: kubernetes.io/hostname
      containers:
      - name: validation-{{PRODUCT}}
        image: containers.ad.corekinect.com/concord-validation-{{PRODUCT}}:latest
        imagePullPolicy: Always
        securityContext:
          privileged: true
        ports:
        - containerPort: 50060
          hostPort: 50060
        env:
        - name: ENVIRONMENT
          value: "{{ENVIRONMENT}}"
        - name: LOG_LEVEL
          value: "4"
        - name: LOG_PATH
          value: "/var/log"
        - name: FIRMWARE_BUCKET_FILE_PATH
          value: "{{FIRMWARE_PATH}}"
        - name: PRODUCT
          value: "{{PRODUCT}}"
        - name: CONCORD_API_URL
          value: "http://10.4.45.32:9001"
        - name: STORAGE_URL
          value: "http://10.4.45.32:8675"
        - name: STORAGE_ACCESS_KEY
          value: "concord"
        - name: STORAGE_SECRET_ACCESS_KEY
          value: "concordstorage!"
        - name: MTIB_HOST
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MTIB_PORT
          value: "{{MTIB_PORT}}"
        - name: LOKI_URL
          value: "http://10.4.45.3:3100/loki/api/v1/push"
        - name: TEST_ENABLE_ELECTRICAL
          value: "{{TEST_ENABLE_ELECTRICAL}}"
        - name: TEST_ENABLE_APP_POST
          value: "{{TEST_ENABLE_APP_POST}}"
        - name: TEST_ENABLE_COMM_POST
          value: "{{TEST_ENABLE_COMM_POST}}"
        volumeMounts:
        - name: logs
          mountPath: /var/log/runner
        resources:
          requests:
            cpu: "250m"
            memory: "200Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"
      volumes:
      - name: logs
        hostPath:
          path: /var/log/tests
