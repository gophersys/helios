apiVersion: concord/v1
kind: AutomationTest
metadata:
  name: shared-test-metadata
  labels:
    platform: Sigma5
    hwVersion: B0
    fwVersion: C0
    hosts: 
      - nrf9160
      - nrf52840
    socketServerVersion: 1.0
    socketServerMessages:
      - 0x20
      - 0x10
  tags:
    - ble
    - gps
    - hips
    - validation
spec:
  runner:
    - hostname: "Test-Host-Validation"
  dependencies:
    - ble
    - uart
  steps:
    - name: "Start BLE Scanning"
      handler: "ble_beacon.scan_for_ble"
      timeoutS: 20
      stopOnFailure: true
    - name: "Verify HIPS Data"
      handler: "hips.verify_hips_data"
      timeoutS: 10
      stopOnFailure: true
