/v1/tests/steps:
    get:
      summary: Get test steps configuration
      description: Retrieves the test steps configuration from the JSON file.
      responses:
        '200':
          description: Successfully retrieved test steps configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    class_name:
                      type: string
                      example: SimpleTestStep
                    info:
                      type: object
                      additionalProperties: true
                    config:
                      type: object
                      additionalProperties: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Internal server error: An error occurred while reading the configuration file.'