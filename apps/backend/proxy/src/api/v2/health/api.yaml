/v1/health/proxy:
  get:
    summary: Health check endpoint
    description: Returns a 200 status if the server is running, confirming that the service is alive.
    responses:
      '200':
        description: Service is alive and running
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: OK
      '500':
        description: Server error
