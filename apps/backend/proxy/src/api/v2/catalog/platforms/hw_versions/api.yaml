/v1/catalog/platforms/{platformId}/hardware-versions:
  get:
    summary: List hardware versions for a platform
    description: Retrieves all hardware versions associated with a specific platform.
    tags:
        - Catalog
    parameters:
      - in: path
        name: platformId
        schema:
          type: string
        required: true
        description: The UUID of the platform
    responses:
      '200':
        description: Successful retrieval of hardware versions
        content:
          application/json:
            schema:
              type: object
              properties:
                hardwareVersions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "uuid-hardware-B0"
                      version:
                        type: string
                        example: "B0"
      '404':
        description: Platform not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Platform with ID 'uuid-platform-sigma5' not found."
      '500':
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Internal server error: Database connection failed."
  post:
    summary: Create hardware version for a platform
    description: Creates a new hardware version for a specified platform, with optional hosts linked.
    tags:
        - Catalog
    parameters:
      - in: path
        name: platformId
        schema:
          type: string
        required: true
        description: The UUID of the platform
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              version:
                type: string
                example: "B0"
              hostIds:
                type: array
                items:
                  type: string
                example: ["uuid-host-nrf9160", "uuid-host-nrf52840"]
            required:
              - version
    responses:
      '201':
        description: Hardware version created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: "uuid-hardware-B0"
                version:
                  type: string
                  example: "B0"
                platformId:
                  type: string
                  example: "uuid-platform-sigma5"
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "uuid-host-nrf9160"
                      name:
                        type: string
                        example: "nrf9160"
      '400':
        description: Bad request - Missing required fields or invalid host IDs
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Hardware version is required."
      '404':
        description: Platform not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Platform with ID 'uuid-platform-sigma5' not found."
      '500':
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Internal server error: Database connection failed."


/v1/catalog/platforms/{platformId}/hardware-versions/{hardwareVersionId}:
  get:
    summary: Get hardware version by UUID for a platform
    description: Retrieves a hardware version by its UUID for a specific platform, including its associated platform, hosts, and firmware versions.
    tags:
        - Catalog
    parameters:
      - in: path
        name: platformId
        schema:
          type: string
        required: true
        description: The UUID of the platform
      - in: path
        name: hardwareVersionId
        schema:
          type: string
        required: true
        description: The UUID of the hardware version
    responses:
      '200':
        description: Hardware version details retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: "uuid-hardware-B0"
                version:
                  type: string
                  example: "B0"
                platform:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "uuid-platform-sigma5"
                    name:
                      type: string
                      example: "sigma5"
                hosts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "uuid-host-nrf9160"
                      name:
                        type: string
                        example: "nrf9160"
                firmwareVersions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "uuid-firmware-1.2.0"
                      version:
                        type: string
                        example: "1.2.0"
      '404':
        description: Hardware version or platform not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Hardware version with ID 'uuid-hardware-B0' not found for platform ID 'uuid-platform-sigma5'."
      '500':
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Internal server error: Database connection failed."
  delete:
    summary: Delete hardware version by UUID for a platform
    description: Deletes a hardware version by its UUID for a specific platform.
    tags:
        - Catalog
    parameters:
      - in: path
        name: platformId
        schema:
          type: string
        required: true
        description: The UUID of the platform
      - in: path
        name: hardwareVersionId
        schema:
          type: string
        required: true
        description: The UUID of the hardware version
    responses:
      '200':
        description: Hardware version deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Hardware version with ID 'uuid-hardware-B0' deleted for platform ID 'uuid-platform-sigma5'."
      '404':
        description: Hardware version or platform not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Hardware version with ID 'uuid-hardware-B0' not found for platform ID 'uuid-platform-sigma5'."
      '500':
        description: Server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: "Internal server error: Database connection failed."