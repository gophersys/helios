/v1/storage:
    get:
      summary: Storage usage information
      description: Returns the current storage usage in megabytes and percentage used.
      responses:
        '200':
          description: Successfully retrieved storage information
          content:
            application/json:
              schema:
                type: object
                properties:
                  usedMB:
                    type: number
                    format: float
                    example: 123.45
                  totalMB:
                    type: number
                    format: float
                    example: 500.00
                  percentUsed:
                    type: number
                    format: float
                    example: 24.69