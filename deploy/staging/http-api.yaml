apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-http-api
  namespace: staging
  labels:
    app.kubernetes.io/name: concord-http-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: concord
    app.kubernetes.io/managed-by: concord-ctl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: concord-http-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concord-http-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: concord
    spec:
      serviceAccountName: concord-api
      containers:
        - name: http-api
          image: concord/http-api:staging
          ports:
            - containerPort: 9001
              name: http
          envFrom:
            - configMapRef:
                name: concord-config
            - secretRef:
                name: concord-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v2/docs
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/docs
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: concord-http-api
  namespace: staging
  labels:
    app.kubernetes.io/name: concord-http-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: concord
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: concord-http-api
  ports:
    - name: http
      port: 9001
      targetPort: 9001
---
# Service account for the API (mirrors production)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: concord-api
  namespace: staging
  labels:
    app.kubernetes.io/name: concord-http-api
    app.kubernetes.io/part-of: concord
