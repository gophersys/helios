apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-frontend
  namespace: staging
  labels:
    app.kubernetes.io/name: concord-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: concord
    app.kubernetes.io/managed-by: concord-ctl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: concord-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concord-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: concord
    spec:
      containers:
        - name: frontend
          image: concord/frontend:staging
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_HOST
              value: concord-http-api
            - name: API_PORT
              value: "9001"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: concord-frontend
  namespace: staging
  labels:
    app.kubernetes.io/name: concord-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: concord
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: concord-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
