# Traefik IngressRoute for staging
# Adjust the Host match to your staging domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concord-ingress
  namespace: staging
  labels:
    app.kubernetes.io/part-of: concord
    app.kubernetes.io/managed-by: concord-ctl
  annotations:
    # Traefik-specific (K3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: staging.concord.local
      http:
        paths:
          # API routes → backend
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: 9001
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: 9001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: 9001
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concord-frontend
                port:
                  number: 80
