networks:
  concord_network:
    name: concord_network
    driver: bridge
    external: true

volumes:
  grafana_plugins_volume:
  postgres_data_volume:
  minio_data_volume:
  influxdb_data_volume:


services:
  # http-api:
  #   image: concord-http-api:development
  #   ports:
  #     - "9001:9001"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - concord_network
  #   env_file:
  #     - .env
  #   environment:
  #     - ENVIRONMENT=development # Override the .env environment variable
  #   user: root
  #   depends_on:
  #     - vault
  #     - db
  #   restart: "no"

  vault:
    image: concord-vault:latest
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ${CONCORD_MONOREPO_ROOT}/deploy/cloud/development/config/vault/config/vault.hcl:/vault/config/vault.hcl
      - ${CONCORD_MONOREPO_ROOT}/deploy/cloud/development/config/vault/storage:/mnt/vault/storage
      - ${CONCORD_MONOREPO_ROOT}/deploy/cloud/development/config/vault/file:/mnt/vault/file
    networks:
      - concord_network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_plugins_volume:/var/lib/grafana/plugins
      - ${CONCORD_MONOREPO_ROOT}/deploy/cloud/development/config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      # - ${CONCORD_MONOREPO_ROOT}/deploy/cloud/development/config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_PLUGINS_DIR=/var/lib/grafana/plugins
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms
    entrypoint: /bin/sh
    command: -c " grafana cli plugins install grafana-clickhouse-datasource || true && sleep 5 && grafana-server --homepath=/usr/share/grafana"
    ports:
      - "3000:3000"
    networks:
      - concord_network

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - concord_network

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: concord
      MINIO_ROOT_PASSWORD: concordstorage!
    ports:
      - "8675:8675"
      - "8676:8676"
    command: server /data --address ":8675" --console-address ":8676"
    volumes:
      - minio_data_volume:/data
    networks:
      - concord_network

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
      POSTGRES_DB: concord
      POSTGRES_MAX_CONNECTIONS: 200 # Default is usually 100
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - concord_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: concord
      DB_PASSWORD: concord
      DB_NAME: concord
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
    depends_on:
      - db
    networks:
      - concord_network

  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: concord
      DOCKER_INFLUXDB_INIT_PASSWORD: concordinflux!
      DOCKER_INFLUXDB_INIT_ORG: concord
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: concord-influxdb-dev-token
    volumes:
      - influxdb_data_volume:/var/lib/influxdb2
    networks:
      - concord_network
