# Production environment overrides
# Usage: helm upgrade --install concord ./deploy/helm/concord -n production -f ./deploy/helm/values-production.yaml

global:
  environment: production
  imagePullPolicy: Always

# In-cluster infrastructure (swap to managed services later)
infrastructure:
  postgres:
    enabled: true
    user: concord
    password: concord-prod-2026
    database: concord
    storage: 10Gi
  minio:
    enabled: true
    rootUser: concordadmin
    rootPassword: concord-minio-prod-2026
    storage: 10Gi

httpApi:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-http-api
    tag: production
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: "1Gi"

frontend:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-frontend
    tag: production

ingress:
  enabled: true
  host: concord.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

config:
  SERVER_PORT: "9001"
  LOG_LEVEL: "2"
  LOG_PATH: "logs"
  AUTH_ENABLED: "true"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://concord.local,http://concord.local"
  MTIB_PORT: "50053"
  GIT_POLLER_ENABLED: "true"
  GIT_POLLER_INTERVAL_S: "300"
  CK_BOARDS_REPO_URL: "git@bitbucket.org:corekinect/ck_boards.git"
  CK_BOARDS_FETCH_INTERVAL: "60"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  COREOPS_PROXY_URL: "http://10.4.45.30:8001"
  CONCORD_API_HOST: "concord.local"

# Build Service — DaemonSet on builder nodes
buildService:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-build-service
    tag: production
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "14"
      memory: "28Gi"

# Git Poller — polls firmware repos for new commits
gitPoller:
  enabled: true
  pollInterval: "300"
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: production

secrets:
  DATABASE_URL: "postgresql://concord:concord-prod-2026@concord-postgres:5432/concord"
  DIRECT_DATABASE_URL: "postgresql://concord:concord-prod-2026@concord-postgres:5432/concord"
  STORAGE_ACCESS_KEY: "CHANGE-ME-use-secrets-overlay"
  STORAGE_SECRET_ACCESS_KEY: "CHANGE-ME-use-secrets-overlay"
  JWT_SECRET_KEY: "CHANGE-ME-use-secrets-overlay"
  AUTH_SERVER_API_KEY: "CHANGE-ME-use-secrets-overlay"
  DELETE_ALL_KEY: "CHANGE-ME-use-secrets-overlay"
  BITBUCKET_WEBHOOK_SECRET: "CHANGE-ME-use-secrets-overlay"
  COREOPS_API_KEY: "CHANGE-ME-use-secrets-overlay"
