{{- if .Values.gitPoller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-git-poller
  namespace: {{ .Release.Namespace }}
  labels:
    app: concord-git-poller
    app.kubernetes.io/component: git-poller
    app.kubernetes.io/part-of: concord-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concord-git-poller
  template:
    metadata:
      labels:
        app: concord-git-poller
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/git-poller-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: git-poller
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              apt-get update
              apt-get install -y git openssh-client
              pip install requests urllib3
              cat /app/git_poller.py | head -20
              exec python3 /app/git_poller.py
          env:
            - name: GIT_SSH_KEY_PATH
              value: "/root/.ssh/id_rsa"
            - name: POLL_INTERVAL
              value: {{ .Values.gitPoller.pollInterval | default "15" | quote }}
            - name: CONCORD_API_URL
              value: "http://concord-http-api:9001"
            - name: CONCORD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: concord-build-worker-secrets
                  key: api-key
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: poller-script
              mountPath: /app
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
            - name: state
              mountPath: /tmp
      volumes:
        - name: poller-script
          configMap:
            name: concord-git-poller-script
            defaultMode: 0755
        - name: ssh-key
          secret:
            secretName: bitbucket-ssh-key
            defaultMode: 0600
        - name: state
          emptyDir: {}
{{- end }}
