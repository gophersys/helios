{{- if .Values.buildWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-build-worker-script
  namespace: {{ .Release.Namespace }}
  labels:
    app: concord-build-worker
data:
  worker.py: |
    #!/usr/bin/env python3
    import json, logging, os, re, shutil, socket, subprocess, time, sys
    from dataclasses import dataclass
    from pathlib import Path
    import requests, urllib3
    urllib3.disable_warnings()
    logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s", datefmt="%H:%M:%S")
    log = logging.getLogger("build-worker")

    @dataclass
    class BuildJob:
        id: str
        product: str
        board: str
        target: str
        variant: str
        mtib_rev: str
        branch: str
        commit_sha: str
        status: str
        version_bump: bool = False
        base_job_id: str = None
        matrix_label: str = None
        version_override: str = None  # Explicit version override (e.g., "0.5.0")

    def _extract_version_override(job_data):
        """Extract version override from job data (configFlags or direct field)."""
        config_flags = job_data.get("configFlags") or {}
        if isinstance(config_flags, dict) and config_flags.get("versionOverride"):
            return config_flags["versionOverride"]
        return job_data.get("versionOverride") or job_data.get("firmwareVersion")

    class BuildWorker:
        # Only *_fw (production) and *_mfg_fw (manufacturing) are valid build products
        REPO_MAP = {
            "alpha_fw": "git@bitbucket.org:corekinect/alpha_fw.git",
            "alpha_mfg_fw": "git@bitbucket.org:corekinect/alpha_mfg_fw.git",
            "sigma5_fw": "git@bitbucket.org:corekinect/sigma5_fw.git",
            "sigma5_mfg_fw": "git@bitbucket.org:corekinect/sigma5_mfg_fw.git",
            "theta_fw": "git@bitbucket.org:corekinect/theta_fw.git",
            "theta_mfg_fw": "git@bitbucket.org:corekinect/theta_mfg_fw.git",
        }
        BUILD_TIMEOUT = 2700

        def __init__(self, api_url, api_key, worker_id=None, poll_interval=5, workspace_dir="/tmp/builds",
                     ssh_key_path="/root/.ssh/id_rsa", ncs_version=None, product_filter=None, product_exclude=None):
            self.api_url = api_url.rstrip("/")
            self.api_key = api_key
            self.worker_id = worker_id or socket.gethostname()
            self.poll_interval = poll_interval
            self.workspace_dir = Path(workspace_dir)
            self.ssh_key_path = ssh_key_path
            self.ncs_version = ncs_version
            self.product_filter = product_filter.split(",") if product_filter else None
            self.product_exclude = product_exclude.split(",") if product_exclude else None
            self.workspace_dir.mkdir(parents=True, exist_ok=True)

        def _headers(self):
            return {"Authorization": f"ApiKey {self.api_key}", "Content-Type": "application/json"}

        def _api_get(self, path):
            try:
                resp = requests.get(f"{self.api_url}{path}", headers=self._headers(), timeout=30, verify=False)
                return resp.json() if resp.status_code < 400 else None
            except Exception as e:
                log.error("API GET %s failed: %s", path, e)
                return None

        def _api_patch(self, path, data):
            try:
                resp = requests.patch(f"{self.api_url}{path}", json=data, headers=self._headers(), timeout=30, verify=False)
                return resp.json() if resp.status_code < 400 else None
            except Exception as e:
                log.error("API PATCH %s failed: %s", path, e)
                return None

        def _upload_file(self, path, file_path, name):
            try:
                with open(file_path, "rb") as f:
                    resp = requests.post(f"{self.api_url}{path}", files={"file": (name, f)},
                                         headers={"Authorization": f"ApiKey {self.api_key}"}, timeout=120, verify=False)
                return resp.status_code < 400
            except Exception as e:
                log.error("Upload %s failed: %s", name, e)
                return False

        def _stream_log(self, job_id, chunk):
            """Stream a log chunk to the API for real-time UI updates."""
            try:
                requests.post(f"{self.api_url}/v2/builds/{job_id}/log",
                             json={"chunk": chunk}, headers=self._headers(), timeout=5, verify=False)
            except Exception:
                pass  # Don't fail build if streaming fails

        def fetch_queued_job(self):
            # Build query with optional product filter
            query = "/v2/builds?status=QUEUED&limit=1"
            if self.product_filter:
                query += f"&product={self.product_filter[0]}"

            result = self._api_get(query)
            if not result or not result.get("data"):
                return None
            j = result["data"][0] if result["data"] else None
            if not j:
                return None

            product = j["product"].lower()

            # Check product filter (exact match on product name)
            if self.product_filter:
                if not any(p == product for p in self.product_filter):
                    return None

            # Check product exclusion list
            if self.product_exclude:
                if any(p == product for p in self.product_exclude):
                    return None

            return BuildJob(id=j["id"], product=j["product"], board=j["board"], target=j["target"],
                            variant=j["variant"], mtib_rev=j["mtibRev"], branch=j["branch"],
                            commit_sha=j["commitSha"] or "", status=j["status"],
                            version_bump=j.get("versionBump", False), base_job_id=j.get("baseJobId"),
                            matrix_label=j.get("matrixLabel"), version_override=_extract_version_override(j))

        def claim_job(self, job_id):
            result = self._api_patch(f"/v2/builds/{job_id}", {
                "status": "BUILDING",
                "workerId": f"{self.worker_id}:{self.ncs_version or 'default'}",
                "startedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
            })
            return result is not None and not result.get("errors")

        def update_job(self, job_id, status, error=None, version_string=None, duration=None, build_log=None):
            data = {"status": status}
            if error:
                data["errorMessage"] = error[:2000]
            if version_string:
                data["versionString"] = version_string
            if duration is not None:
                data["durationSeconds"] = duration
            if build_log:
                data["buildLog"] = build_log[-100000:]
            if status in ("SUCCESS", "FAILED", "CANCELLED"):
                data["finishedAt"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
            return self._api_patch(f"/v2/builds/{job_id}", data) is not None

        def download_build_script(self, product, dest_path):
            # Extract product key for script lookup
            # alpha_fw -> alpha, alpha_mfg_fw -> alpha_mfg, sigma5_fw -> sigma5
            product_key = product.lower().replace("_fw", "")

            try:
                log.info("Downloading build script for product: %s", product_key)
                resp = requests.get(f"{self.api_url}/v2/builds/scripts/{product_key}",
                                  headers=self._headers(), timeout=30, verify=False)
                if resp.status_code != 200:
                    log.warning("No custom script for %s (HTTP %d), using fallback", product_key, resp.status_code)
                    return False

                data = resp.json()
                if not data.get("data") or not data["data"].get("content"):
                    return False

                with open(dest_path, "w") as f:
                    f.write(data["data"]["content"])
                os.chmod(dest_path, 0o755)
                log.info("Downloaded custom build script (%d bytes)", len(data["data"]["content"]))
                return True
            except Exception as e:
                log.warning("Script download failed: %s", e)
                return False

        def _run_cmd(self, cmd, cwd=None, env=None, timeout=600, job_id=None):
            log.info("$ %s", " ".join(cmd) if isinstance(cmd, list) else cmd)

            process = subprocess.Popen(
                cmd, cwd=cwd, env=env,
                stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                text=True, bufsize=1
            )

            output_lines = []
            stream_buffer = []
            last_stream_time = time.time()
            try:
                for line in process.stdout:
                    line = line.rstrip()
                    output_lines.append(line)
                    stream_buffer.append(line)
                    if any(x in line.lower() for x in ['cloning', 'receiving', 'resolving', 'updating',
                                                         'building', 'linking', 'generating', '[', 'error',
                                                         'warning', 'finished', 'failed', '***']):
                        print(f"  {line}", flush=True)
                    # Stream logs every 10 lines or every 1.5 seconds for responsive UI
                    if job_id and (len(stream_buffer) >= 10 or time.time() - last_stream_time > 1.5):
                        self._stream_log(job_id, "\n".join(stream_buffer) + "\n")
                        stream_buffer = []
                        last_stream_time = time.time()

                # Flush remaining buffer
                if job_id and stream_buffer:
                    self._stream_log(job_id, "\n".join(stream_buffer) + "\n")

                process.wait(timeout=timeout)
                return process.returncode == 0, "\n".join(output_lines)
            except subprocess.TimeoutExpired:
                process.kill()
                return False, "\n".join(output_lines) + "\n[TIMEOUT]"

        def clone_repo(self, job, repo_dir):
            repo_url = self.REPO_MAP.get(job.product)
            if not repo_url:
                log.error("Unknown product: %s", job.product)
                return False, "Unknown product"

            env = os.environ.copy()
            env["GIT_SSH_COMMAND"] = f"ssh -i {self.ssh_key_path} -o StrictHostKeyChecking=no -o BatchMode=yes"

            log.info("Cloning %s (branch: %s)...", repo_url, job.branch)

            success, output = self._run_cmd(
                ["git", "clone", "--progress", "--recursive", "--branch", job.branch,
                 "--single-branch", repo_url, str(repo_dir)],
                env=env, timeout=600, job_id=job.id
            )

            if not success:
                return False, output

            if job.commit_sha:
                log.info("Checking out commit %s...", job.commit_sha[:8])
                success, checkout_output = self._run_cmd(
                    ["git", "checkout", job.commit_sha],
                    cwd=repo_dir, timeout=30, job_id=job.id
                )
                output += "\n" + checkout_output

                if success:
                    success, submodule_output = self._run_cmd(
                        ["git", "submodule", "update", "--init", "--recursive", "--progress"],
                        cwd=repo_dir, env=env, timeout=300, job_id=job.id
                    )
                    output += "\n" + submodule_output

            return success, output

        def inject_mcuboot_keys(self, job, repo_dir):
            """Copy MCUboot signing keys from mounted secrets to cloned repo."""
            product_base = job.product.lower().replace("_fw", "").replace("_mfg", "")
            keys_dir = Path(f"/keys/{product_base}")

            if not keys_dir.exists():
                log.info("No MCUboot keys mounted for %s", product_base)
                return

            # Copy keys to repo root
            for key_file in ["encryption_key.pem", "comms_encryption_key.pem"]:
                src = keys_dir / key_file
                if not src.exists():
                    continue

                dst = repo_dir / key_file
                shutil.copy(src, dst)
                log.info("Injected %s → %s", key_file, dst)

            # Fix sysbuild.conf paths - they have hardcoded /workspaces/<repo>/ paths
            # that need to point to the actual repo location
            for conf_file in repo_dir.glob("**/sysbuild.conf"):
                try:
                    content = conf_file.read_text()
                    # Replace any /workspaces/<something>/encryption_key.pem with repo_dir path
                    new_content = re.sub(
                        r'SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="[^"]*encryption_key\.pem"',
                        f'SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="{repo_dir}/encryption_key.pem"',
                        content
                    )
                    if new_content != content:
                        conf_file.write_text(new_content)
                        log.info("Fixed encryption key path in %s", conf_file)
                except Exception as e:
                    log.warning("Failed to fix %s: %s", conf_file, e)

            # Also fix comms_coproc sysbuild.conf if it exists
            comms_sysbuild = repo_dir / "comm_coproc" / "sysbuild.conf"
            if comms_sysbuild.exists():
                try:
                    content = comms_sysbuild.read_text()
                    new_content = re.sub(
                        r'SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="[^"]*comms_encryption_key\.pem"',
                        f'SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="{repo_dir}/comms_encryption_key.pem"',
                        content
                    )
                    if new_content != content:
                        comms_sysbuild.write_text(new_content)
                        log.info("Fixed comms encryption key path in %s", comms_sysbuild)
                except Exception as e:
                    log.warning("Failed to fix comms sysbuild: %s", e)

            log.info("MCUboot keys injected for %s", product_base)

        def _get_base_build_version(self, base_job_id):
            """Fetch the build number from a completed base build."""
            if not base_job_id:
                return None
            result = self._api_get(f"/v2/builds/{base_job_id}")
            if not result or not result.get("data"):
                return None
            version_string = result["data"].get("versionString", "")
            if not version_string:
                return None
            match = re.search(r"(\d+)\.(\d+)\.(\d+)", version_string)
            return int(match.group(3)) if match else None

        def run_build(self, job, repo_dir, output_dir):
            # Inject MCUboot signing keys before build
            self.inject_mcuboot_keys(job, repo_dir)

            script_path = self.workspace_dir / f"build_script_{job.id}.sh"
            if not self.download_build_script(job.product, script_path):
                script_path = Path("/app/ci_build.sh")
                if not script_path.exists():
                    return False, "CI build script not found"

            env = os.environ.copy()
            # Determine firmware type from product name (alpha_fw -> app, alpha_mfg_fw -> mfg)
            firmware_type = "mfg" if "_mfg_" in job.product or job.product.endswith("_mfg") else "app"
            env.update({
                "REPO_DIR": str(repo_dir),
                "OUTPUT_DIR": str(output_dir),
                "PRODUCT": job.product,
                "FIRMWARE_TYPE": firmware_type,
                "BOARD": job.board,
                "VARIANT": job.variant,
                "MTIB_REV": job.mtib_rev,
                "ZEPHYR_BASE": os.environ.get("ZEPHYR_BASE", "/workdir/zephyr"),
                "ZEPHYR_TOOLCHAIN_VARIANT": "zephyr",
                "ZEPHYR_SDK_INSTALL_DIR": os.environ.get("ZEPHYR_SDK_INSTALL_DIR", "/workdir/zephyr-sdk")
            })

            # Handle explicit version override (e.g., "0.5.0" -> BUILD_NUM=0)
            if job.version_override:
                parts = job.version_override.strip().split(".")
                if len(parts) >= 3:
                    try:
                        build_num = int(parts[2])
                        env["VERSION_BUILD_OVERRIDE"] = str(build_num)
                        log.info("Version override: %s -> BUILD_NUM=%d", job.version_override, build_num)
                    except ValueError:
                        log.warning("Could not parse build number from version_override: %s", job.version_override)

            # Handle version bumping for N+1 builds (same code, incremented version)
            elif job.version_bump and job.base_job_id:
                base_version = self._get_base_build_version(job.base_job_id)
                if base_version is not None:
                    bumped_version = base_version + 1
                    env["VERSION_BUILD_OVERRIDE"] = str(bumped_version)
                    log.info("Version bump: %d -> %d (base job: %s)", base_version, bumped_version, job.base_job_id[:8])
                else:
                    log.warning("Could not get base build version for bump, using default")

            log.info("Running build script (timeout: %ds)...", self.BUILD_TIMEOUT)
            return self._run_cmd(["bash", str(script_path)], cwd=repo_dir, env=env, timeout=self.BUILD_TIMEOUT, job_id=job.id)

        def _extract_version(self, output_dir):
            """Extract version string from build.json in output directory."""
            import glob
            for build_json in glob.glob(f"{output_dir}/**/build.json", recursive=True):
                try:
                    with open(build_json) as f:
                        data = json.load(f)
                        return data.get("version")
                except Exception as e:
                    log.warning("Failed to parse %s: %s", build_json, e)
            return None

        def verify_artifacts(self, output_dir, expected_version=None):
            """Verify firmware artifacts for basic consistency."""
            # Find build.json
            build_jsons = list(Path(output_dir).glob("**/build.json"))
            if not build_jsons:
                return False, "No build.json found in output"

            # Parse version from build.json
            try:
                with open(build_jsons[0]) as f:
                    data = json.load(f)
                version = data.get("version")
                if not version:
                    return False, "build.json missing 'version' field"
            except Exception as e:
                return False, f"Failed to parse build.json: {e}"

            # Check version matches expected (if provided)
            if expected_version and version != expected_version:
                return False, f"Version mismatch: built {version}, expected {expected_version}"

            # Check hex files exist
            hex_files = list(Path(output_dir).glob("**/*.hex"))
            if not hex_files:
                return False, "No hex files found in output"

            # Check CFW files (if present) have consistent versions in filename
            cfw_files = list(Path(output_dir).glob("**/*.cfw"))
            for cfw in cfw_files:
                # Pattern: {appId}.{major}.{minor}.{build}-{track}.cfw
                match = re.match(r"(\d+)\.(\d+)\.(\d+)\.(\d+)-", cfw.name)
                if match:
                    cfw_ver = f"{match.group(2)}.{match.group(3)}.{match.group(4)}"
                    if cfw_ver != version:
                        return False, f"CFW {cfw.name} version {cfw_ver} != build.json {version}"

            log.info("Verification passed: version %s, %d hex, %d cfw", version, len(hex_files), len(cfw_files))
            return True, f"OK: {version}"

        def upload_artifacts(self, job_id, output_dir):
            # Recursively find all artifacts in versioned directory structure
            artifacts = (
                list(Path(output_dir).glob("**/*.hex")) +
                list(Path(output_dir).glob("**/*.cfw")) +
                list(Path(output_dir).glob("**/*.json")) +
                list(Path(output_dir).glob("**/*.sha1")) +
                list(Path(output_dir).glob("**/commit.log"))
            )
            for artifact in artifacts:
                # Include relative path in artifact name to preserve structure
                rel_path = artifact.relative_to(output_dir)
                name = str(rel_path).replace("/", "_")  # Flatten for storage
                log.info("Uploading artifact: %s (%d bytes)", name, artifact.stat().st_size)
                self._upload_file(f"/v2/builds/{job_id}/artifacts", artifact, name)

        def process_job(self, job):
            job_dir = self.workspace_dir / f"cmbuild_{job.id}"
            repo_dir = job_dir / "repo"
            output_dir = job_dir / "output"

            shutil.rmtree(job_dir, ignore_errors=True)
            repo_dir.mkdir(parents=True)
            output_dir.mkdir(parents=True)

            start_time = time.time()
            full_log = []

            try:
                clone_success, clone_log = self.clone_repo(job, repo_dir)
                full_log.append("=== GIT CLONE ===\n" + clone_log)

                if not clone_success:
                    duration = int(time.time() - start_time)
                    # Don't pass build_log - streaming already saved it, avoid overwriting
                    self.update_job(job.id, "FAILED", error="Failed to clone repository", duration=duration)
                    log.error("Clone failed after %ds", duration)
                    return

                build_success, build_log = self.run_build(job, repo_dir, output_dir)
                full_log.append("\n=== BUILD ===\n" + build_log)
                duration = int(time.time() - start_time)

                if build_success:
                    # Verify artifacts before upload
                    valid, verify_msg = self.verify_artifacts(output_dir, job.version_override)
                    if not valid:
                        log.error("Artifact verification failed: %s", verify_msg)
                        self.update_job(job.id, "FAILED", error=f"Verification failed: {verify_msg}", duration=duration)
                        return

                    self.upload_artifacts(job.id, output_dir)
                    # Extract version from build.json if present
                    version_string = self._extract_version(output_dir)
                    # Don't pass build_log - streaming already saved it, avoid overwriting
                    self.update_job(job.id, "SUCCESS", duration=duration, version_string=version_string)
                    log.info("Build %s completed successfully in %ds (%d min %d sec) - version: %s",
                            job.id, duration, duration // 60, duration % 60, version_string or "unknown")
                else:
                    # Don't pass build_log - streaming already saved it, avoid overwriting
                    self.update_job(job.id, "FAILED", error="Build failed", duration=duration)
                    log.error("Build %s failed after %ds", job.id, duration)

            except Exception as e:
                duration = int(time.time() - start_time)
                # Stream the exception to the log
                self._stream_log(job.id, f"\n=== EXCEPTION ===\n{str(e)}\n")
                self.update_job(job.id, "FAILED", error=str(e), duration=duration)
                log.exception("Build %s crashed: %s", job.id, e)

        def run(self):
            log.info("Build worker starting (id=%s, ncs=%s, poll=%ds)",
                    self.worker_id, self.ncs_version or "any", self.poll_interval)
            while True:
                try:
                    job = self.fetch_queued_job()
                    if job:
                        log.info("=" * 60)
                        log.info("Processing job %s: %s/%s (%s)", job.id, job.board, job.variant, job.branch)
                        if self.claim_job(job.id):
                            self.process_job(job)
                        else:
                            log.warning("Failed to claim job %s", job.id)
                except Exception as e:
                    log.exception("Worker loop error: %s", e)
                time.sleep(self.poll_interval)

    if __name__ == "__main__":
        worker = BuildWorker(
            api_url=os.environ.get("CONCORD_API_URL", "http://concord-http-api:9001"),
            api_key=os.environ.get("CONCORD_API_KEY", ""),
            worker_id=os.environ.get("WORKER_ID", socket.gethostname()),
            poll_interval=int(os.environ.get("POLL_INTERVAL", "5")),
            ncs_version=os.environ.get("NCS_VERSION"),
            product_filter=os.environ.get("PRODUCT_FILTER"),
            product_exclude=os.environ.get("PRODUCT_EXCLUDE"),
        )
        worker.run()

  ci_build.sh: |
    #!/bin/bash
    echo "Fallback build script - download product-specific script from API"
    exit 1
{{- end }}
