{{- if .Values.buildWorker.enabled }}
{{- /*
  Build worker source files are read from files/build-worker/*.py at deploy time.
  These files are copied from apps/backend/build-worker/src/ by ctl.sh before
  helm upgrade runs. This ensures the ConfigMap always matches the canonical source.

  NEVER edit source code inline here. Edit apps/backend/build-worker/src/*.py instead.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-build-worker-script
  namespace: {{ .Release.Namespace }}
  labels:
    app: concord-build-worker
data:
  __init__.py: ""
  config.py: |
{{ .Files.Get "files/build-worker/config.py" | indent 4 }}
  api_client.py: |
{{ .Files.Get "files/build-worker/api_client.py" | indent 4 }}
  manifest.py: |
{{ .Files.Get "files/build-worker/manifest.py" | indent 4 }}
  git_ops.py: |
{{ .Files.Get "files/build-worker/git_ops.py" | indent 4 }}
  builder.py: |
{{ .Files.Get "files/build-worker/builder.py" | indent 4 }}
  worker.py: |
{{ .Files.Get "files/build-worker/worker.py" | indent 4 }}
  main.py: |
{{ .Files.Get "files/build-worker/main.py" | indent 4 }}
{{- end }}
