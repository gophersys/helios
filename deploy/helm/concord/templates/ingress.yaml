{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concord-ingress
  labels:
    {{- include "concord.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API routes → backend
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: {{ .Values.httpApi.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: {{ .Values.httpApi.port }}
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: concord-http-api
                port:
                  number: {{ .Values.httpApi.port }}
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concord-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
