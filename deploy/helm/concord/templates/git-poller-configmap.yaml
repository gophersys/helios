{{- if .Values.gitPoller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-git-poller-script
  namespace: {{ .Release.Namespace }}
  labels:
    app: concord-git-poller
data:
  git_poller.py: |
    #!/usr/bin/env python3
    """Git-based repo poller - polls for new commits and triggers CI builds."""
    import json, logging, os, subprocess, time
    from dataclasses import dataclass
    from pathlib import Path
    from typing import Dict, Optional
    import requests

    logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(levelname)s - %(message)s", datefmt="%H:%M:%S")
    log = logging.getLogger("git_poller")

    @dataclass
    class RepoConfig:
        name: str
        ssh_url: str
        branch: str
        product_id: str

    # Only main firmware repos - manufacturing repos auto-cloned during build
    WATCHED_REPOS = [
        RepoConfig(
            name="alpha_fw",
            ssh_url="git@bitbucket.org:corekinect/alpha_fw.git",
            branch="concord-main",
            product_id="cmmgsdsnh0001sktijmewtmwg",
        ),
    ]

    class GitPoller:
        def __init__(self, ssh_key_path="/root/.ssh/id_rsa", poll_interval=15,
                     state_file="/tmp/git_poller_state.json", api_url="http://concord-http-api:9001", api_key=""):
            self.ssh_key_path = ssh_key_path
            self.poll_interval = poll_interval
            self.state_file = Path(state_file)
            self.api_url = api_url.rstrip("/")
            self.api_key = api_key
            self.state: Dict[str, str] = {}
            self._load_state()

        def _load_state(self):
            if self.state_file.exists():
                try:
                    self.state = json.loads(self.state_file.read_text())
                    log.info("Loaded state: %d repos tracked", len(self.state))
                except Exception as e:
                    log.warning("Failed to load state: %s", e)

        def _save_state(self):
            try:
                self.state_file.write_text(json.dumps(self.state, indent=2))
            except Exception as e:
                log.warning("Failed to save state: %s", e)

        def get_remote_sha(self, repo):
            try:
                env = os.environ.copy()
                env["GIT_SSH_COMMAND"] = f"ssh -i {self.ssh_key_path} -o StrictHostKeyChecking=no -o BatchMode=yes"
                result = subprocess.run(
                    ["git", "ls-remote", repo.ssh_url, f"refs/heads/{repo.branch}"],
                    capture_output=True, text=True, timeout=30, env=env,
                )
                if result.returncode != 0:
                    log.error("git ls-remote failed for %s: %s", repo.name, result.stderr)
                    return None
                line = result.stdout.strip()
                if not line:
                    log.warning("Branch %s not found in %s", repo.branch, repo.name)
                    return None
                return line.split()[0]
            except subprocess.TimeoutExpired:
                log.error("git ls-remote timed out for %s", repo.name)
                return None
            except Exception as e:
                log.error("Failed to get SHA for %s: %s", repo.name, e)
                return None

        def trigger_build(self, repo, commit_sha):
            if not self.api_key:
                log.warning("No API key configured, skipping trigger for %s", repo.name)
                return False
            try:
                url = f"{self.api_url}/v2/builds/trigger"
                headers = {"Authorization": f"ApiKey {self.api_key}", "Content-Type": "application/json"}
                payload = {
                    "repoSlug": repo.name,
                    "branch": repo.branch,
                    "commitSha": commit_sha,
                    "productId": repo.product_id,
                    "variant": "debug",
                    "mtibRev": "1.2",
                }
                log.info("Triggering build for %s @ %s", repo.name, commit_sha[:8])
                resp = requests.post(url, json=payload, headers=headers, timeout=30, verify=False)
                if resp.status_code >= 400:
                    log.error("Trigger failed for %s: %d %s", repo.name, resp.status_code, resp.text[:200])
                    return False
                data = resp.json()
                if data.get("errors"):
                    log.error("Trigger error for %s: %s", repo.name, data["errors"])
                    return False
                build_id = data.get("data", {}).get("id", "?")
                log.info("Build triggered for %s: %s", repo.name, build_id[:8] if len(build_id) > 8 else build_id)
                return True
            except Exception as e:
                log.error("Failed to trigger build for %s: %s", repo.name, e)
                return False

        def poll_once(self):
            for repo in WATCHED_REPOS:
                sha = self.get_remote_sha(repo)
                if not sha:
                    continue
                last_sha = self.state.get(repo.name)
                if last_sha is None:
                    log.info("[%s] Initial SHA: %s", repo.name, sha[:8])
                    self.state[repo.name] = sha
                    self._save_state()
                elif sha != last_sha:
                    log.info("[%s] New commit: %s -> %s", repo.name, last_sha[:8], sha[:8])
                    if self.trigger_build(repo, sha):
                        self.state[repo.name] = sha
                        self._save_state()
                else:
                    log.debug("[%s] No change (%s)", repo.name, sha[:8])

        def run(self):
            log.info("Git poller starting (interval=%ds, repos=%d)", self.poll_interval, len(WATCHED_REPOS))
            log.info("Watching: %s", ", ".join(r.name for r in WATCHED_REPOS))
            while True:
                try:
                    self.poll_once()
                except Exception as e:
                    log.exception("Poll cycle failed: %s", e)
                time.sleep(self.poll_interval)

    if __name__ == "__main__":
        import urllib3
        urllib3.disable_warnings()
        poller = GitPoller(
            ssh_key_path=os.environ.get("GIT_SSH_KEY_PATH", "/root/.ssh/id_rsa"),
            poll_interval=int(os.environ.get("POLL_INTERVAL", "15")),
            api_url=os.environ.get("CONCORD_API_URL", "http://concord-http-api:9001"),
            api_key=os.environ.get("CONCORD_API_KEY", ""),
        )
        poller.run()
{{- end }}
