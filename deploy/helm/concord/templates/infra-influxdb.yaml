{{- if .Values.infrastructure.influxdb.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concord-influxdb-pvc
  labels:
    {{- include "concord.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.infrastructure.influxdb.storage | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-influxdb
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    app.kubernetes.io/name: concord-influxdb
    app.kubernetes.io/component: tsdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: concord-influxdb
  template:
    metadata:
      labels:
        {{- include "concord.labels" . | nindent 8 }}
        app.kubernetes.io/name: concord-influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7-alpine
          ports:
            - containerPort: 8086
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: {{ .Values.infrastructure.influxdb.user | default "admin" }}
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: {{ .Values.infrastructure.influxdb.password | default "concordpass" }}
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: {{ .Values.infrastructure.influxdb.org | default "concord" }}
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: {{ .Values.infrastructure.influxdb.bucket | default "telemetry_raw" }}
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              value: {{ .Values.infrastructure.influxdb.token | default "concord-influx-dev-token" }}
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: concord-influxdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: concord-influxdb
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    app.kubernetes.io/name: concord-influxdb
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app.kubernetes.io/name: concord-influxdb
{{- end }}
