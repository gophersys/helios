# The Eden platform services overlay (ADR-0022 #2). Compose it WITH the supporting
# stack:  docker compose -f plane/local/docker-compose.yaml -f plane/local/platform.yaml up
name: eden-local-platform

services:
  agent-runtime:
    image: agent-runtime:local
    container_name: eden-agent-runtime
    environment:
      EDEN_NATS_URL: "nats://nats:4222"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault:8200"
      EDEN_HARNESS: "claude-code"
      EDEN_CREDENTIAL_REF: "vault://eden/development#setup-token"
    depends_on:
      - nats
      - vault
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  agentgateway:
    image: agentgateway:local
    container_name: eden-agentgateway
    ports:
      - "127.0.0.1:8080:8080"  # http
    environment:
      EDEN_GATEWAY_ADDRESS: ":8080"
      EDEN_NATS_URL: "nats://nats:4222"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault:8200"
      EDEN_GATEWAY_JWT_SECRET_REF: "vault://eden/development#agentgateway-jwt-signing-key"
    depends_on:
      - nats
      - vault
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  orchestrator:
    image: agentgateway:local
    container_name: eden-orchestrator
    command: ["/usr/local/bin/agentgateway-orchestrator"]
    environment:
      EDEN_WORKSPACE_SUBSTRATE: "kubernetes"
      EDEN_LEASE_NAME: "eden-orchestrator"
      POSTGRES_HOST: "eden-postgres-0.eden-postgres.eden.svc.cluster.local"
      POSTGRES_USER: "eden"
      POSTGRES_DB: "eden"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_URL: "postgres://eden:$(POSTGRES_PASSWORD)@eden-postgres-0.eden-postgres.eden.svc.cluster.local:5432/eden?sslmode=disable"
      EDEN_NATS_URL: "nats://nats.eden.svc.cluster.local:4222"
      EDEN_LABEL_NAMESPACE: "central"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault.eden.svc.cluster.local:8200"
      EDEN_HARNESS: "claude-code"
      EDEN_CREDENTIAL_REF: "vault://eden/development#setup-token"
    depends_on:
      - nats
      - vault
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  platformgateway:
    image: platformgateway:local
    container_name: eden-platformgateway
    ports:
      - "127.0.0.1:8081:8080"  # http
    environment:
      EDEN_STAGE: "production"
      EDEN_GATEWAY_ADDRESS: ":8080"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault.eden.svc.cluster.local:8200"
      EDEN_GATEWAY_JWT_SECRET_REF: "vault://eden/development#platformgateway-jwt-signing-key"
      EDEN_GATEWAY_DATABASE_DSN_REF: "vault://eden/development#platformgateway-database-dsn"
    depends_on:
      - vault
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    image: frontend:local
    container_name: eden-frontend
    ports:
      - "127.0.0.1:5173:8080"  # http
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

