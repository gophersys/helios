# The Eden platform services overlay (ADR-0022 #2). Compose it WITH the supporting
# stack:  docker compose -f plane/local/docker-compose.yaml -f plane/local/platform.yaml up
name: eden-local-platform

services:
  agent-runtime:
    image: agent-runtime:local
    container_name: eden-agent-runtime
    environment:
      EDEN_NATS_URL: "nats://nats:4222"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault:8200"
      EDEN_HARNESS: "claude-code"
      EDEN_CREDENTIAL_REF: "vault://eden/development#setup-token"
    depends_on:
      - nats
      - vault
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  agentgateway:
    image: agentgateway:local
    container_name: eden-agentgateway
    ports:
      - "127.0.0.1:8080:8080"  # http
    environment:
      EDEN_GATEWAY_ADDRESS: ":8080"
      EDEN_NATS_URL: "nats://nats:4222"
      EDEN_VAULT_MODE: "token-file"
      EDEN_VAULT_TOKEN_FILE: "/vault/secrets/token"
      VAULT_ADDR: "http://vault:8200"
      EDEN_GATEWAY_JWT_SECRET_REF: "vault://eden/development#agentgateway-jwt-signing-key"
    depends_on:
      - nats
      - vault
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

