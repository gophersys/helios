# Longhorn Helm Values
# Install: helm install longhorn longhorn/longhorn --namespace longhorn-system --create-namespace -f 02-longhorn-values.yaml
# Repo:    helm repo add longhorn https://charts.longhorn.io

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain

defaultSettings:
  # Only create disks on nodes labeled with node.longhorn.io/create-default-disk=true
  # (agent nodes already have this label)
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: disabled
  replicaSoftAntiAffinity: true
  # When a node goes down, delete its pods so they reschedule
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Only run Longhorn system components on amd64 nodes (excludes ARM edge nodes)
  systemManagedComponentsNodeSelector: "kubernetes.io/arch:amd64"
  # Storage reserved on each node for non-Longhorn use (10 GiB)
  storageMinimalAvailablePercentage: 15
  storageReservedPercentageForDefaultDisk: 25

# Longhorn Manager - runs on all amd64 nodes (servers + agents)
longhornManager:
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
    - key: corekinect.com/role
      operator: Exists
      effect: PreferNoSchedule

# Longhorn Driver - runs on all amd64 nodes
longhornDriver:
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
    - key: corekinect.com/role
      operator: Exists
      effect: PreferNoSchedule

# Longhorn UI - only on server nodes
longhornUI:
  replicas: 1
  nodeSelector:
    corekinect.com/role: server
  tolerations:
    - key: corekinect.com/role
      value: server
      effect: PreferNoSchedule
