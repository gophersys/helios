# Production environment overrides
# Usage: helm upgrade --install concord ./deploy/helm/concord -n production -f ./deploy/helm/values-production.yaml

global:
  environment: production
  imagePullPolicy: Always

# In-cluster infrastructure (swap to managed services later)
infrastructure:
  postgres:
    enabled: true
    user: concord
    password: OVERRIDE-IN-SECRETS-OVERLAY
    database: concord
    storage: 20Gi
  minio:
    enabled: true
    rootUser: OVERRIDE-IN-SECRETS-OVERLAY
    rootPassword: OVERRIDE-IN-SECRETS-OVERLAY
    storage: 25Gi
  pypi:
    enabled: true
    storage: "5Gi"
    # Security: require htpasswd auth for package uploads
    auth:
      enabled: true

httpApi:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-http-api
    tag: production
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: "1Gi"

frontend:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-frontend
    tag: production

docs:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-docs
    tag: production

ingress:
  enabled: true
  host: concord.local
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    secretName: production-concord-tls

config:
  SERVER_PORT: "9001"
  AUTH_ENABLED: "true"  # Security: must always be enabled in production
  LOG_LEVEL: "2"
  LOG_PATH: "logs"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://concord.local,http://concord.local"
  MTIB_PORT: "50053"
  BITBUCKET_EMAIL: "mateo@corekinect.com"
  BITBUCKET_POLLER_ENABLED: "true"
  BITBUCKET_POLLER_INTERVAL_S: "300"
  BITBUCKET_SSH_KEY: "" # Set via values-production-secrets.yaml
  CK_BOARDS_REPO_URL: "git@bitbucket.org:corekinect/ck_boards.git"
  CK_BOARDS_FETCH_INTERVAL: "60"
  BUILD_SERVICE_URL: "http://concord-build-service:9002"
  # Queue scheduler — per-domain concurrency and timeouts
  SCHEDULER_INTERVAL_S: "15"
  MAX_CONCURRENT_BUILDS: "8"
  MAX_CONCURRENT_VALIDATION_RUNS: "16"
  MAX_CONCURRENT_MANUFACTURING_SESSIONS: "8"
  BUILD_TIMEOUT_MINUTES: "45"
  VALIDATION_TIMEOUT_MINUTES: "60"
  MANUFACTURING_TIMEOUT_MINUTES: "180"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  CONCORD_API_HOST: "concord.local"
  PYPI_URL: "http://concord-pypi:8080/simple"
  # CoreOps — device personalization service account
  COREOPS_SERVER_URL: "https://coreops.office.corekinect.cloud:2013"
  COREOPS_AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  COREOPS_VERIFY_SSL: "false"

# Build Service — lightweight orchestrator, spawns dynamic builder containers
buildService:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-build-service
    tag: production
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Git Poller — stage-aware polling for PR + branch changes
gitPoller:
  enabled: true
  pollInterval: "5"
  productCacheTtl: "60"
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: production

networkPolicies:
  enabled: true

resourceQuotas:
  enabled: true
  cpu: "16"
  memory: "20Gi"

backups:
  postgres:
    enabled: true
    schedule: "0 2 * * *"
    retain: 30
    preUpgrade: true
    verify: true
  minio:
    enabled: true
    schedule: "0 3 * * 0"
    hostPath: "/var/lib/concord/backups/minio"

# Secrets — real values in values-production-secrets.yaml (gitignored)
secrets:
  DATABASE_URL: "OVERRIDE-IN-SECRETS-OVERLAY"
  DIRECT_DATABASE_URL: "OVERRIDE-IN-SECRETS-OVERLAY"
  STORAGE_ACCESS_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  STORAGE_SECRET_ACCESS_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  JWT_SECRET_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  BITBUCKET_API_TOKEN: "OVERRIDE-IN-SECRETS-OVERLAY"
  AUTH_SERVER_API_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  DELETE_ALL_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  BITBUCKET_WEBHOOK_SECRET: "OVERRIDE-IN-SECRETS-OVERLAY"
  COREOPS_API_KEY: "OVERRIDE-IN-SECRETS-OVERLAY"
  COREOPS_AUTH_USER: "OVERRIDE-IN-SECRETS-OVERLAY"
  COREOPS_AUTH_PASS: "OVERRIDE-IN-SECRETS-OVERLAY"
