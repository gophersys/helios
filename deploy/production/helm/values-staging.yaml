# Staging environment overrides
# Usage: helm upgrade --install concord ./deploy/helm/concord -n staging -f ./deploy/helm/values-staging.yaml

global:
  environment: staging
  imagePullPolicy: Always

# Enable in-cluster infrastructure for staging
infrastructure:
  postgres:
    enabled: true
    user: concord
    password: concord-staging
    database: concord
    storage: 5Gi
  minio:
    enabled: true
    rootUser: minioadmin
    rootPassword: minioadmin-staging
    storage: 5Gi
  pypi:
    enabled: true
    storage: "2Gi"

httpApi:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-http-api
    tag: staging
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-frontend
    tag: staging

docs:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-docs
    tag: staging

ingress:
  enabled: true
  host: staging.concord.local
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    secretName: staging-concord-tls

config:
  SERVER_PORT: "9001"
  LOG_LEVEL: "4"
  LOG_PATH: "logs"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://staging.concord.local,http://staging.concord.local,http://localhost:4200"
  MTIB_PORT: "50053"
  BITBUCKET_EMAIL: "mateo@corekinect.com"
  BITBUCKET_POLLER_ENABLED: "true"
  BITBUCKET_POLLER_INTERVAL_S: "15"
  BITBUCKET_SSH_KEY: "" # Set via values-staging-secrets.yaml
  CK_BOARDS_REPO_URL: "git@bitbucket.org:corekinect/ck_boards.git"
  CK_BOARDS_FETCH_INTERVAL: "60"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  CONCORD_API_HOST: "staging.concord.local"
  PYPI_URL: "http://concord-pypi:8080/simple"

# Build Service — lightweight orchestrator, spawns dynamic builder containers
buildService:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-build-service
    tag: staging
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Git Poller — polls firmware repos for new commits
gitPoller:
  enabled: true
  pollInterval: "15"
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: staging

secrets:
  DATABASE_URL: "postgresql://concord:concord-staging@concord-postgres:5432/concord"
  DIRECT_DATABASE_URL: "postgresql://concord:concord-staging@concord-postgres:5432/concord"
  STORAGE_ACCESS_KEY: "CHANGE-ME-use-secrets-overlay"
  STORAGE_SECRET_ACCESS_KEY: "CHANGE-ME-use-secrets-overlay"
  JWT_SECRET_KEY: "CHANGE-ME-use-secrets-overlay"
  AUTH_SERVER_API_KEY: "CHANGE-ME-use-secrets-overlay"
  DELETE_ALL_KEY: "CHANGE-ME-use-secrets-overlay"
  BITBUCKET_WEBHOOK_SECRET: "CHANGE-ME-use-secrets-overlay"
