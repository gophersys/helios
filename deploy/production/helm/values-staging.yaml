# Staging environment overrides
# Usage: helm upgrade --install concord ./deploy/helm/concord -n staging -f ./deploy/helm/values-staging.yaml

global:
  environment: staging
  imagePullPolicy: Always

# Enable in-cluster infrastructure for staging
infrastructure:
  postgres:
    enabled: true
    user: concord
    database: concord
    storage: 10Gi
  minio:
    enabled: true
    storage: 15Gi
  pypi:
    enabled: true
    storage: "3Gi"
    auth:
      enabled: true
      # htpasswd content stored in concord-pypi-htpasswd Secret (secrets overlay)

httpApi:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-http-api
    tag: staging
  resources:
    requests:
      cpu: 100m
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

frontend:
  replicas: 1
  image:
    repository: containers.ad.corekinect.com/concord-frontend
    tag: staging

docs:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-docs
    tag: staging

ingress:
  enabled: true
  host: staging.concord.ad.corekinect.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    secretName: concord-tls

config:
  AUTH_ENABLED: "true"
  SERVER_PORT: "9001"
  LOG_LEVEL: "4"
  LOG_PATH: "logs"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://staging.concord.ad.corekinect.com,http://staging.concord.ad.corekinect.com,http://localhost:4200"
  MTIB_PORT: "50053"
  # BITBUCKET_EMAIL is sourced from concord-build-service-secrets (bitbucket-email)
  # by the http-api/git-poller deployments — it pairs with the API token and must
  # not be hardcoded here. See .claude/knowledge/deploy/secrets.md.
  BITBUCKET_WORKSPACE: "corekinect"
  BITBUCKET_POLLER_ENABLED: "true"
  BITBUCKET_POLLER_INTERVAL_S: "15"
  BITBUCKET_SSH_KEY: "" # Mounted from bitbucket-ssh-key K8s secret
  CK_BOARDS_REPO_URL: "git@bitbucket.org:corekinect/ck_boards.git"
  CK_BOARDS_FETCH_INTERVAL: "60"
  BUILD_SERVICE_URL: "http://concord-build-service:9002"
  # Queue scheduler — per-domain concurrency and timeouts
  SCHEDULER_INTERVAL_S: "15"
  MAX_CONCURRENT_BUILDS: "4"
  MAX_CONCURRENT_VALIDATION_RUNS: "8"
  MAX_CONCURRENT_MANUFACTURING_SESSIONS: "4"
  BUILD_TIMEOUT_MINUTES: "45"
  VALIDATION_TIMEOUT_MINUTES: "60"
  MANUFACTURING_TIMEOUT_MINUTES: "120"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  CONCORD_API_HOST: "staging.concord.ad.corekinect.com"
  CONCORD_API_URL: "http://concord-http-api.staging.svc.cluster.local:9001"
  PYPI_URL: "http://concord-pypi:8080/simple"
  # CoreOps — device personalization service account
  COREOPS_SERVER_URL: "https://coreops.office.corekinect.cloud:2013"
  COREOPS_AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
  COREOPS_VERIFY_SSL: "false"

# Build Service — lightweight orchestrator, spawns dynamic builder containers
buildService:
  enabled: true
  image:
    repository: containers.ad.corekinect.com/concord-build-service
    tag: staging
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Git Poller — stage-aware polling for PR + branch changes
gitPoller:
  enabled: true
  pollInterval: "5"
  productCacheTtl: "60"
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: staging

networkPolicies:
  enabled: true

resourceQuotas:
  enabled: true
  cpu: "12"
  memory: "16Gi"

backups:
  postgres:
    enabled: true
    schedule: "0 2 * * *"
    retain: 7
    preUpgrade: true
    verify: true
  minio:
    enabled: true
    schedule: "0 3 * * 0"
    hostPath: "/var/lib/concord/backups/minio"

retention:
  testPackages:
    enabled: true
    schedule: "30 2 * * *"
    retentionDays: 30
    keepLatest: 5
  mfgSessionReaper:
    enabled: true
    schedule: "*/15 * * * *"
    stalenessMinutes: 30

