{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-frontend
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    {{- include "concord.frontend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "concord.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord.labels" . | nindent 8 }}
        {{- include "concord.frontend.selectorLabels" . | nindent 8 }}
      annotations:
        rollme: {{ randAlphaNum 10 | quote }}
    spec:
      {{- include "concord.workloadNodeSelector" (dict "workload" "platform" "extra" .Values.frontend.nodeSelector) | nindent 6 }}
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: http
          env:
            - name: API_HOST
              value: concord-http-api
            - name: API_PORT
              value: {{ .Values.httpApi.port | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
{{- end }}
