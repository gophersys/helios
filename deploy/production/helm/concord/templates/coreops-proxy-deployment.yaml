---
apiVersion: v1
kind: Namespace
metadata:
  name: coreops-proxy

---
apiVersion: v1
kind: Secret
metadata:
  name: coreops-credentials
  namespace: coreops-proxy
type: Opaque
stringData:
  # These must be set manually after deployment:
  # kubectl -n coreops-proxy create secret generic coreops-credentials \
  #   --from-literal=COREOPS_API_KEY=<key> \
  #   --from-literal=COREOPS_AUTH_USER=<user> \
  #   --from-literal=COREOPS_AUTH_PASS=<pass>
  COREOPS_API_KEY: "PLACEHOLDER"
  COREOPS_AUTH_USER: "PLACEHOLDER"
  COREOPS_AUTH_PASS: "PLACEHOLDER"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coreops-proxy
  namespace: coreops-proxy
  labels:
    app: coreops-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coreops-proxy
  template:
    metadata:
      labels:
        app: coreops-proxy
    spec:
      # Schedule ONLY on concordproxy node (has CoreOps network access)
      nodeSelector:
        kubernetes.io/hostname: concordproxy
      tolerations:
        - key: "node-role.kubernetes.io/proxy"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: proxy
          image: containers.ad.corekinect.com/concord-coreops-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COREOPS_SERVER_URL
              value: "https://coreops.office.corekinect.cloud:2013"
            - name: COREOPS_AUTH_SERVER_URL
              value: "https://auth.office.corekinect.cloud:2013"
            - name: COREOPS_VERIFY_SSL
              value: "false"
            - name: COREOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coreops-credentials
                  key: COREOPS_API_KEY
            - name: COREOPS_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: coreops-credentials
                  key: COREOPS_AUTH_USER
            - name: COREOPS_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: coreops-credentials
                  key: COREOPS_AUTH_PASS
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: coreops-proxy
  namespace: coreops-proxy
spec:
  selector:
    app: coreops-proxy
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: ClusterIP
