{{- if .Values.gitPoller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-git-poller
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    {{- include "concord.gitPoller.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "concord.gitPoller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord.labels" . | nindent 8 }}
        {{- include "concord.gitPoller.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        rollme: {{ randAlphaNum 10 | quote }}
    spec:
      {{- include "concord.workloadNodeSelector" (dict "workload" "platform" "extra" .Values.gitPoller.nodeSelector) | nindent 6 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://concord-http-api:9001/v2/docs >/dev/null 2>&1; do echo "Waiting for http-api..."; sleep 3; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: git-poller
          image: "{{ .Values.gitPoller.image.repository }}:{{ .Values.gitPoller.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: SSH_KEY_PATH
              value: "/root/.ssh/id_rsa"
            - name: POLL_INTERVAL
              value: {{ .Values.gitPoller.pollInterval | default "5" | quote }}
            - name: PRODUCT_CACHE_TTL
              value: {{ .Values.gitPoller.productCacheTtl | default "60" | quote }}
            - name: CONCORD_API_URL
              value: "http://concord-http-api:9001"
            - name: CONCORD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: concord-build-service-secrets
                  key: api-key
            - name: BITBUCKET_WORKSPACE
              value: {{ .Values.gitPoller.bitbucketWorkspace | default "corekinect" | quote }}
            - name: BITBUCKET_EMAIL
              valueFrom:
                secretKeyRef:
                  name: concord-build-service-secrets
                  key: bitbucket-email
                  optional: true
            - name: BITBUCKET_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: concord-build-service-secrets
                  key: bitbucket-api-token
                  optional: true
          ports:
            - containerPort: {{ .Values.gitPoller.port }}
              name: health
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.gitPoller.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gitPoller.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.gitPoller.resources | nindent 12 }}
          volumeMounts:
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: bitbucket-ssh-key
            defaultMode: 0600
            items:
              - key: ssh-private-key
                path: id_rsa
{{- end }}
