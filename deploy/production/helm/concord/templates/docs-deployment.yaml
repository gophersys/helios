{{- if .Values.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-docs
  labels:
    app.kubernetes.io/name: concord-docs
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: concord-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concord-docs
    spec:
      containers:
      - name: docs
        image: "{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: concord-docs
spec:
  selector:
    app.kubernetes.io/name: concord-docs
  ports:
  - port: 80
    targetPort: 80
{{- end }}
