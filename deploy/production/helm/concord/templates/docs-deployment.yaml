{{- if .Values.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-docs
  labels:
    app.kubernetes.io/name: concord-docs
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: concord-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: concord-docs
      annotations:
        rollme: {{ randAlphaNum 10 | quote }}
    spec:
      {{- include "concord.workloadNodeSelector" (dict "workload" "platform" "extra" .Values.docs.nodeSelector) | nindent 6 }}
      containers:
      - name: docs
        image: "{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: concord-docs
spec:
  selector:
    app.kubernetes.io/name: concord-docs
  ports:
  - port: 80
    targetPort: 80
{{- end }}
