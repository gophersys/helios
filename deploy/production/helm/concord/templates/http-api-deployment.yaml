{{- if .Values.httpApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-http-api
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    {{- include "concord.httpApi.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.httpApi.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "concord.httpApi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord.labels" . | nindent 8 }}
        {{- include "concord.httpApi.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        rollme: {{ randAlphaNum 10 | quote }}
    spec:
      {{- include "concord.workloadNodeSelector" (dict "workload" "platform" "extra" .Values.httpApi.nodeSelector) | nindent 6 }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.httpApi.serviceAccount.create }}
      serviceAccountName: {{ .Values.httpApi.serviceAccount.name }}
      {{- end }}
      {{- if .Values.httpApi.migration.enabled }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.httpApi.image.repository }}:{{ .Values.httpApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python3
            - -c
            - |
              import os, time, socket, re
              url = os.environ.get('DATABASE_URL', '')
              m = re.search(r'@([^:/]+):(\d+)', url)
              if not m:
                  print('No DATABASE_URL, skipping wait'); exit(0)
              host, port = m.group(1), int(m.group(2))
              for i in range(30):
                  s = socket.socket()
                  s.settimeout(2)
                  if s.connect_ex((host, port)) == 0:
                      s.close(); print(f'DB ready at {host}:{port}'); exit(0)
                  s.close(); print(f'Waiting for DB {host}:{port}... ({i+1}/30)')
                  time.sleep(2)
              print('DB not ready after 60s'); exit(1)
          envFrom:
            - configMapRef:
                name: concord-config
            - secretRef:
                name: concord-secrets
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: migrate-and-seed
          image: "{{ .Values.httpApi.image.repository }}:{{ .Values.httpApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python3
            - -c
            - |
              import subprocess, sys, os
              os.chdir('/prisma')

              # Prisma CLI path — copied from builder stage, runs via node directly.
              # Bypasses prisma-client-python's nodeenv (which needs internet).
              prisma = ['/usr/local/bin/node', '/app/prisma-cli/node_modules/prisma/build/index.js']

              # Step 1: Run migrations
              print('Running Prisma migrations...', flush=True)
              r = subprocess.run(
                  prisma + ['migrate', 'deploy', '--schema', '/prisma/schema.prisma'],
                  capture_output=True, text=True
              )
              print(r.stdout, flush=True)
              if r.returncode != 0:
                  # P3009 = failed migration from prior crash. Auto-resolve and retry.
                  if 'P3009' in (r.stderr or r.stdout or ''):
                      import re
                      m = re.search(r'The `(\S+)` migration', r.stdout + r.stderr)
                      if m:
                          failed = m.group(1)
                          print(f'Resolving failed migration: {failed}', flush=True)
                          subprocess.run(
                              prisma + ['migrate', 'resolve',
                               '--rolled-back', failed, '--schema', '/prisma/schema.prisma'],
                              capture_output=False, text=True
                          )
                          print('Retrying migrations...', flush=True)
                          r = subprocess.run(
                              prisma + ['migrate', 'deploy',
                               '--schema', '/prisma/schema.prisma'],
                              capture_output=False, text=True
                          )
                  if r.returncode != 0:
                      print(r.stderr, flush=True)
                      print(f'Migration failed (exit {r.returncode})', flush=True)
                      sys.exit(r.returncode)
              print('Migrations complete.', flush=True)

              # Step 2: Seed — DEVELOPMENT ONLY.
              # The seed creates dev users, a known CI admin API key,
              # demo fixture designs, and per-stage config records. All
              # of those are onboarding conveniences for a fresh dev
              # database; in staging/production they represent real
              # operator-managed state that must not be clobbered by a
              # redeploy. Operators add users + configure fixtures
              # through the UI.
              env_name = os.environ.get('ENVIRONMENT', 'development')
              if env_name == 'development':
                  print('Seeding database (development)...', flush=True)
                  r = subprocess.run(
                      [sys.executable, '-m', 'seed.main'],
                      capture_output=False, text=True, cwd='/prisma',
                      env={**os.environ, 'PYTHONPATH': '/libs/python:/libs:/libs/protocols:/prisma'}
                  )
                  if r.returncode != 0:
                      print(f'Seed failed (exit {r.returncode})', flush=True)
                      sys.exit(r.returncode)
                  print('Seed complete.', flush=True)
              else:
                  print(f'Skipping seed — environment={env_name} (seed runs in development only).', flush=True)
          envFrom:
            - configMapRef:
                name: concord-config
            - secretRef:
                name: concord-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- end }}
      containers:
        - name: http-api
          image: "{{ .Values.httpApi.image.repository }}:{{ .Values.httpApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: {{ .Values.httpApi.port }}
              name: http
          envFrom:
            - configMapRef:
                name: concord-config
            - secretRef:
                name: concord-secrets
          resources:
            {{- toYaml .Values.httpApi.resources | nindent 12 }}
          volumeMounts:
            - name: ssh-key
              mountPath: /home/appuser/.ssh
              readOnly: true
          readinessProbe:
            httpGet:
              path: {{ .Values.httpApi.probes.readiness.path }}
              port: {{ .Values.httpApi.port }}
            initialDelaySeconds: {{ .Values.httpApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.httpApi.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.httpApi.probes.liveness.path }}
              port: {{ .Values.httpApi.port }}
            initialDelaySeconds: {{ .Values.httpApi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.httpApi.probes.liveness.periodSeconds }}
      volumes:
        - name: ssh-key
          secret:
            secretName: bitbucket-ssh-key
            defaultMode: 0444
            optional: true
            items:
              - key: ssh-private-key
                path: id_rsa
{{- end }}
