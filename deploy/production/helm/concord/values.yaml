# Default values for Concord platform.
# Override per-environment with values-staging.yaml or values-production.yaml.

global:
  environment: staging
  imagePullPolicy: IfNotPresent

# ── Infrastructure (optional, for staging/dev) ─────────────
# Set enabled: false for production (use managed services instead)
infrastructure:
  postgres:
    enabled: false
    user: concord
    password: concord
    database: concord
    storage: 5Gi
  minio:
    enabled: false
    rootUser: minioadmin
    rootPassword: minioadmin
    storage: 5Gi

# ── Backend (http-api) ──────────────────────────────────────
httpApi:
  enabled: true
  image:
    repository: concord/http-api
    tag: staging
  replicas: 1
  port: 9001
  migration:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: true
    name: concord-api
  probes:
    readiness:
      path: /v2/docs
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      path: /v2/docs
      initialDelaySeconds: 30
      periodSeconds: 30

# ── Frontend ────────────────────────────────────────────────
frontend:
  enabled: true
  image:
    repository: concord/frontend
    tag: staging
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Ingress ─────────────────────────────────────────────────
ingress:
  enabled: true
  host: staging.concord.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

# ── Config ──────────────────────────────────────────────────
config:
  SERVER_PORT: "9001"
  LOG_LEVEL: "4"
  LOG_PATH: "logs"
  AUTH_ENABLED: "true"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://staging.concord.local"
  MTIB_PORT: "50053"
  BITBUCKET_POLLER_ENABLED: "true"
  BITBUCKET_POLLER_INTERVAL_S: "300"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: ""
  COREOPS_PROXY_URL: "none"
  CONCORD_API_HOST: "staging.concord.local"

# ── Git Poller ────────────────────────────────────────────────
gitPoller:
  enabled: false
  pollInterval: "15"
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: latest

# ── Secrets ─────────────────────────────────────────────────
# IMPORTANT: Real secret values should go in values-<env>-secrets.yaml (gitignored).
# These defaults are safe placeholders. The secrets overlay file is auto-detected
# by ctl.sh if it exists: deploy/helm/values-{env}-secrets.yaml
secrets:
  DATABASE_URL: "postgresql://concord:concord@concord-postgres:5432/concord"
  DIRECT_DATABASE_URL: "postgresql://concord:concord@concord-postgres:5432/concord"
  STORAGE_ACCESS_KEY: "minioadmin"
  STORAGE_SECRET_ACCESS_KEY: "minioadmin"
  JWT_SECRET_KEY: "concord-staging-jwt-secret"
  AUTH_SERVER_API_KEY: ""
  DELETE_ALL_KEY: "staging-delete-key"
  BITBUCKET_WEBHOOK_SECRET: ""
  COREOPS_API_KEY: ""
