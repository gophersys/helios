# Self-signed ClusterIssuer -> CA Certificate -> CA ClusterIssuer
# This creates a local CA that can issue certs for any domain.
# Later: swap the CA secret with CoreKinect SubCA key+cert to use the office CA.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: concord-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Concord Local CA
  secretName: concord-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: concord-ca-issuer
spec:
  ca:
    secretName: concord-ca-secret
