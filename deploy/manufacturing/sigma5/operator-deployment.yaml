apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-operator-sigma5
  labels:
    app: cluster-operator-sigma5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-operator-sigma5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cluster-operator-sigma5
    spec:
      terminationGracePeriodSeconds: 1
      # Use host network so operator can reach test runners via localhost:hostPort
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "kubernetes.io/hostname"
                operator: In
                values:
                - "concordagent02"
      containers:
      - name: cluster-operator-sigma5
        image: containers.ad.corekinect.com/concord-operator:latest
        imagePullPolicy: Always

        securityContext:
          privileged: true

        env:
        - name: LOG_LEVEL
          value: "4"
        - name: LOG_PATH
          value: "/var/log"
        - name: CLUSTER_UUID
          value: "d0abb4c8-2815-47b6-8003-c9a63db8f546"
        - name: PROXY_SERVER_URL
          value: "http://10.4.45.30:8001"
        - name: GRPC_SERVER_PORT
          value: "50052"
        - name: GRPC_SERVER_HOST
          value: "10.4.45.22"
        - name: LOCAL_REGISTRY_PORT
          value: "5000"
        - name: KUBECONFIG_PATH
          value: "/etc/rancher/k3s/k3s.yaml"
        - name: NODES_HOSTNAMES
          value: "concordagent02"
        - name: NODES_MGMT_ENABLED
          value: "false"

        volumeMounts:
        - name: logs
          mountPath: /var/log/operator
        - name: kubeconfig
          mountPath: /etc/rancher/k3s
          readOnly: true
        - name: docker-socket
          mountPath: /var/run/docker.sock

        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "500m"
            memory: "500Mi"

      volumes:
      - name: logs
        hostPath:
          path: /var/log/operator
      - name: kubeconfig
        hostPath:
          path: /etc/rancher/k3s
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
