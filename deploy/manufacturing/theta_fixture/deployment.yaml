apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacturing-theta
  labels:
    app: manufacturing-theta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manufacturing-theta
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: manufacturing-theta
    spec:
      terminationGracePeriodSeconds: 1
      tolerations:
      - key: "corekinect.com/role"
        operator: "Equal"
        value: "agent"
        effect: "PreferNoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "kubernetes.io/hostname"
                operator: In
                values:
                - "concordagent01"
      containers:
      - name: manufacturing-theta
        image: containers.ad.corekinect.com/concord-manufacturing-theta:latest
        imagePullPolicy: Always

        securityContext:
          privileged: true

        # Ports for each test module
        ports:
        - containerPort: 50060     # Electrical test
          hostPort: 50060
        - containerPort: 50061     # FW Flash test
          hostPort: 50061
        - containerPort: 50062     # POST test
          hostPort: 50062

        # Application configuration
        env:
        - name: LOG_LEVEL
          value: "4"
        - name: LOG_PATH
          value: "/var/log"
        - name: OPERATOR_URL
          value: "10.4.45.21:50052"
        - name: PROXY_SERVER_URL
          value: "http://10.4.45.30:8001"
        - name: ELECTRICAL_TEST_PORT
          value: "50060"
        - name: ELECTRICAL_TEST_UUID
          # TODO: Generate unique UUIDs for production
          value: "00000000-0000-0000-0000-000000000001"
        - name: FW_FLASH_TEST_PORT
          value: "50061"
        - name: FW_FLASH_TEST_UUID
          value: "00000000-0000-0000-0000-000000000002"
        - name: POST_TEST_PORT
          value: "50062"
        - name: POST_TEST_UUID
          value: "00000000-0000-0000-0000-000000000003"

        volumeMounts:
        - name: logs
          mountPath: /var/log/runner

        resources:
          requests:
            cpu: "250m"
            memory: "200Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"

      volumes:
      - name: logs
        hostPath:
          path: /var/log/tests
