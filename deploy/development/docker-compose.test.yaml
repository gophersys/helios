# Standalone E2E test compose — isolated ports, ephemeral volumes.
# Usage: docker compose -f deploy/development/docker-compose.test.yaml up -d

services:
  # ══════════════════════════════════════════════════════
  # Infrastructure
  # ══════════════════════════════════════════════════════
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord-test
      POSTGRES_DB: concord
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 3s
      timeout: 2s
      retries: 10

  test-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-concord}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-concordstorage!}
    ports:
      - "8677:8677"
    command: server /data --address ":8677"
    tmpfs:
      - /data

  # ══════════════════════════════════════════════════════
  # Backend services
  # ══════════════════════════════════════════════════════
  test-api:
    image: concord/http-api:development
    ports:
      - "9010:9001"
    environment:
      ENVIRONMENT: development
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql://concord:concord-test@test-db:5432/concord
      DIRECT_DATABASE_URL: postgresql://concord:concord-test@test-db:5432/concord
      STORAGE_URL: http://test-minio:8677
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-concord}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-concordstorage!}
      STORAGE_BUCKET_NAME: concord-e2e
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-concord-e2e-test-jwt-secret}
      SERVER_PORT: "9001"
      LOG_LEVEL: "20"
      LOG_PATH: /tmp/logs
      ASSETS_FOLDER: assets
      CORS_ORIGINS: "*"
      DELETE_ALL_KEY: ${DELETE_ALL_KEY:-e2e-delete-key}
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-test@concord.dev}
      BITBUCKET_WORKSPACE: corekinect
      BITBUCKET_POLLER_ENABLED: "false"
      CK_BOARDS_REPO_URL: ""
      CK_BOARDS_FETCH_INTERVAL: "9999"
      CONCORD_API_HOST: localhost
      PYPI_URL: ""
      SEED_ADMIN_EMAIL: ""
    depends_on:
      test-db:
        condition: service_healthy
      test-minio:
        condition: service_started
    restart: "no"

  test-poller:
    image: concord/git-poller:development
    environment:
      CONCORD_API_URL: http://test-api:9001
      CONCORD_API_KEY: ${CONCORD_API_KEY}
      POLL_INTERVAL: "30"
      SERVICE_PORT: "9003"
      ENVIRONMENT: development
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      BITBUCKET_WORKSPACE: corekinect
    depends_on:
      test-api:
        condition: service_started
    restart: "no"

  test-build-service:
    image: concord/build-service:development
    environment:
      CONCORD_API_URL: http://test-api:9001
      CONCORD_API_KEY: ${CONCORD_API_KEY}
      WORKER_ID: e2e-builder-1
      POLL_INTERVAL: "30"
      WORKSPACE_DIR: /tmp/builds
      BUILD_SERVICE_PORT: "9002"
      BUILDER_MODE: docker
      WORKSPACE_VOLUME: e2e_build_workspace
      CCACHE_VOLUME: e2e_ccache_data
      DEFAULT_BUILDER_IMAGE: containers.ad.corekinect.com/ncs-fw-dev:2.7.0
      BUILDER_NETWORK: host
      BUILDER_TIMEOUT: "1800"
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      BITBUCKET_WORKSPACE: corekinect
      BENCH_SIGNING_KEY: ${BENCH_SIGNING_KEY:-}
      ENGINEERING_SIGNING_KEY: ${ENGINEERING_SIGNING_KEY:-}
      PRODUCTION_SIGNING_KEY: ${PRODUCTION_SIGNING_KEY:-}
    depends_on:
      test-api:
        condition: service_started
    restart: "no"
