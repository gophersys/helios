services:
  # ── Infrastructure ────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
      POSTGRES_DB: concord
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: concord
      MINIO_ROOT_PASSWORD: concordstorage!
    ports:
      - "8675:8675"
      - "8676:8676"
    command: server /data --address ":8675" --console-address ":8676"
    volumes:
      - minio_data:/data

  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: concord
      DOCKER_INFLUXDB_INIT_PASSWORD: concordinflux!
      DOCKER_INFLUXDB_INIT_ORG: concord
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: concord-influxdb-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  # ── Backend ───────────────────────────────────────────
  http-api:
    image: concord/http-api:development
    ports:
      - "9001:9001"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://concord:concord@db:5432/concord
      DIRECT_DATABASE_URL: postgresql://concord:concord@db:5432/concord
      STORAGE_URL: http://minio:8675
      STORAGE_ACCESS_KEY: concord
      STORAGE_SECRET_ACCESS_KEY: concordstorage!
      STORAGE_BUCKET_NAME: concord
      JWT_SECRET_KEY: concord-dev-jwt-secret
      COREOPS_PROXY_URL: http://localhost:8090
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY}
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-mateo@corekinect.com}
      BITBUCKET_WORKSPACE: corekinect
      BITBUCKET_POLLER_ENABLED: "true"
      BITBUCKET_POLLER_INTERVAL_S: "5"
      CK_BOARDS_REPO_URL: git@bitbucket.org:corekinect/ck_boards.git
      CK_BOARDS_FETCH_INTERVAL: "60"
      SERVER_PORT: "9001"
      LOG_LEVEL: "4"
      LOG_PATH: /tmp/logs
      ASSETS_FOLDER: assets
      DELETE_ALL_KEY: dev-delete-key
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # ── Build Service (orchestrator — spawns dynamic builder containers) ──
  build-service:
    build:
      context: ../..
      dockerfile: apps/backend/build-service/deploy/Dockerfile
    environment:
      CONCORD_API_URL: http://http-api:9001
      CONCORD_API_KEY: ck_ci_admin_x8K2mP9vL4nQ7wR1tY6uI3oA5sD0fG
      WORKER_ID: dev-builder-1
      POLL_INTERVAL: "5"
      WORKSPACE_DIR: /tmp/builds
      BUILD_SERVICE_DATABASE_URL: ""
      BUILD_SERVICE_PORT: "9002"
      # Docker build runner — spawns builds in product-specific containers
      BUILDER_MODE: docker
      WORKSPACE_VOLUME: development_build_workspace
      CCACHE_VOLUME: development_ccache_data
      DEFAULT_BUILDER_IMAGE: containers.ad.corekinect.com/ncs-fw-dev:2.7.0
      BUILDER_NETWORK: host
      BUILDER_TIMEOUT: "1800"
      # Git auth
      SSH_KEY_PATH: /root/.ssh/id_rsa
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY}
      BITBUCKET_WORKSPACE: corekinect
      # Signing keys
      BENCH_SIGNING_KEY: ${BENCH_SIGNING_KEY:-}
      ENGINEERING_SIGNING_KEY: ${ENGINEERING_SIGNING_KEY:-}
      PRODUCTION_SIGNING_KEY: ${PRODUCTION_SIGNING_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - build_workspace:/tmp/builds
      - ccache_data:/ccache
    ports:
      - "9002:9002"
    depends_on:
      http-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  influxdb_data:
  build_workspace:
  ccache_data:
