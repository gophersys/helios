services:
  # ══════════════════════════════════════════════════════
  # Infrastructure — stateful services
  # ══════════════════════════════════════════════════════
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concord}
      POSTGRES_DB: ${POSTGRES_DB:-concord}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-concord}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-concordstorage!}
    ports:
      - "8675:8675"
      - "8676:8676"
    command: server /data --address ":8675" --console-address ":8676"
    volumes:
      - minio_data:/data

  pypi:
    image: pypiserver/pypiserver:v2.4.1
    ports:
      - "8091:8080"
    volumes:
      - pypi_packages:/data/packages
    command: run -a . -P . /data/packages

  # ══════════════════════════════════════════════════════
  # Backend services — all run in compose
  # Only the UIs (frontend app + docs) run via nx dev/serve
  # ══════════════════════════════════════════════════════
  http-api:
    image: concord/http-api:development
    build:
      context: ../..
      dockerfile: apps/backend/http-api/deploy/Dockerfile
    group_add:
      - "999"  # Docker socket group — enables DockerExecutor for spawning test runners
    ports:
      - "9001:9001"
    environment:
      ENVIRONMENT: development
      AUTH_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://concord:concord@db:5432/concord}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://concord:concord@db:5432/concord}
      STORAGE_URL: http://minio:8675
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-concord}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-concordstorage!}
      STORAGE_BUCKET_NAME: concord
      PYPI_URL: http://pypi:8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-concord-dev-jwt-secret-change-in-production}
      SERVER_PORT: "9001"
      LOG_LEVEL: "4"
      LOG_PATH: /tmp/logs
      ASSETS_FOLDER: assets
      CORS_ORIGINS: "http://localhost:4200,http://localhost:4000"
      DELETE_ALL_KEY: ${DELETE_ALL_KEY:-dev-delete-key}
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      BITBUCKET_WORKSPACE: corekinect
      BITBUCKET_POLLER_ENABLED: "false"
      CK_BOARDS_REPO_URL: git@bitbucket.org:corekinect/ck_boards.git
      CK_BOARDS_FETCH_INTERVAL: "60"
      BUILD_SERVICE_URL: http://build-service:9002
      # Release-record author for record-release.sh; empty falls back to the
      # jared@corekinect.com lookup. Dev rarely records releases.
      RELEASE_RECORDER_USER_ID: ${RELEASE_RECORDER_USER_ID:-}
      # Queue scheduler — per-domain concurrency and timeouts
      SCHEDULER_INTERVAL_S: "15"
      MAX_CONCURRENT_BUILDS: "2"
      MAX_CONCURRENT_VALIDATION_RUNS: "2"
      MAX_CONCURRENT_MANUFACTURING_SESSIONS: "1"
      BUILD_TIMEOUT_MINUTES: "45"
      VALIDATION_TIMEOUT_MINUTES: "60"
      MANUFACTURING_TIMEOUT_MINUTES: "120"
      # CoreOps — device personalization service account
      COREOPS_SERVER_URL: "https://coreops.office.corekinect.cloud:2013"
      COREOPS_AUTH_SERVER_URL: "https://auth.office.corekinect.cloud:2013"
      COREOPS_API_KEY: "LWh0dHBzOi8vY29yZW9wcy5vZmZpY2UuY29yZWtpbmVjdC5jbG91ZDoyMDEzLwAUAAAAAAAAAAMAAAAAAAAAAmh//0ARflK7w17yvqU8VDyvJsfWFKnXJGKYZIRyzKjKEJD63QHu16/+BGn5EAK6ezr71bqOxlMML5GK60sL3HnY4eSR"
      COREOPS_AUTH_USER: "D64A671B6DF5AEA254F43E550E0A6410"
      COREOPS_AUTH_PASS: "C0EAFA6602416E2BB2DC2260CBEB05906CC4858309078E75DEDD11F4AA82EF96"
      COREOPS_VERIFY_SSL: "false"
      # K8s access — enables MTIB discovery, fixture deployment, job scheduling
      KUBECONFIG: /tmp/.kube/config
      VALIDATION_NAMESPACE: ${VALIDATION_NAMESPACE:-development}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube}:/tmp/.kube:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9001/v2/docs')\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  git-poller:
    image: concord/git-poller:development
    build:
      context: ../..
      dockerfile: apps/backend/git-poller/deploy/Dockerfile
    environment:
      CONCORD_API_URL: http://http-api:9001
      CONCORD_API_KEY: ${CONCORD_API_KEY}
      POLL_INTERVAL: "30"
      PRODUCT_CACHE_TTL: "60"
      SERVICE_PORT: "9003"
      ENVIRONMENT: development
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      SSH_KEY_PATH: /tmp/.ssh/id_rsa
      BITBUCKET_WORKSPACE: corekinect
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
    depends_on:
      http-api:
        condition: service_healthy
    restart: unless-stopped

  build-service:
    image: concord/build-service:development
    build:
      context: ../..
      dockerfile: apps/backend/build-service/deploy/Dockerfile
    network_mode: host
    environment:
      # host network mode — API runs on host via nx serve
      CONCORD_API_URL: http://localhost:9001
      CONCORD_API_KEY: ${CONCORD_API_KEY}
      WORKER_ID: dev-builder-1
      POLL_INTERVAL: "5"
      WORKSPACE_DIR: /tmp/builds
      BUILD_SERVICE_PORT: "9002"
      # Docker build runner — spawns builds using the image from
      # each firmware repo's .devcontainer/devcontainer.json
      BUILDER_MODE: docker
      WORKSPACE_VOLUME: development_build_workspace
      CCACHE_VOLUME: development_ccache_data
      DEFAULT_BUILDER_IMAGE: containers.ad.corekinect.com/ncs-fw-dev:2.7.0
      BUILDER_NETWORK: host
      BUILDER_TIMEOUT: "1800"
      SSH_KEY_PATH: /tmp/.ssh/id_rsa
      BITBUCKET_SSH_KEY: ${BITBUCKET_SSH_KEY:-}
      BITBUCKET_WORKSPACE: corekinect
      BENCH_SIGNING_KEY: ${BENCH_SIGNING_KEY:-}
      ENGINEERING_SIGNING_KEY: ${ENGINEERING_SIGNING_KEY:-}
      PRODUCTION_SIGNING_KEY: ${PRODUCTION_SIGNING_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - build_workspace:/tmp/builds
      - ccache_data:/ccache
    ports:
      - "9002:9002"
    depends_on:
      http-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  build_workspace:
  ccache_data:
  pypi_packages:
