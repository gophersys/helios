{{- if .Values.weekly.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: concord-ci-weekly
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
    {{- include "concord-ci.weekly.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.weekly.schedule | quote }}
  timeZone: {{ .Values.weekly.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        {{- include "concord-ci.labels" . | nindent 8 }}
        {{- include "concord-ci.weekly.labels" . | nindent 8 }}
    spec:
      activeDeadlineSeconds: {{ .Values.weekly.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "concord-ci.labels" . | nindent 12 }}
            {{- include "concord-ci.weekly.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "concord-ci.nodeSelector" . | nindent 10 }}
          terminationGracePeriodSeconds: 30

          volumes:
            - name: workspace
              emptyDir: {}
            - name: ssh-key
              secret:
                secretName: bitbucket-ssh-key
                defaultMode: 0400
                optional: true
                items:
                  - key: ssh-private-key
                    path: id_rsa
            - name: ca-certs
              secret:
                secretName: corekinect-ca-certs
                optional: true
            - name: claude-credentials
              secret:
                secretName: claude-code-oauth
                optional: true
                defaultMode: 0600
                items:
                  - key: credentials.json
                    path: .credentials.json

          containers:
            - name: ci-runner
              image: {{ .Values.weekly.image }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
                  update-ca-certificates >/dev/null 2>&1
                  echo "[ci-weekly] Cloning ${BRANCH:-main}..."
                  export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no"
                  git clone --depth 50 --branch "${BRANCH:-main}" "${REPO_URL}" /workspace/concord
                  cd /workspace/concord
                  if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]] || [[ -f /root/.claude/.credentials.json ]]; then
                    echo "[ci-weekly] Installing Claude Code CLI..."
                    npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -1
                  fi
                  .ci/run weekly
              envFrom:
                - configMapRef:
                    name: concord-ci-config
                - secretRef:
                    name: concord-ci-secrets
                    optional: true
              env:
                - name: CI
                  value: "true"
                - name: CI_PROVIDER
                  value: "kubernetes"
                - name: HOME
                  value: "/root"
                - name: DOCKERHUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: username
                      optional: true
                - name: DOCKERHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: token
                      optional: true
                - name: CLAUDE_CODE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: claude-code-oauth
                      key: CLAUDE_CODE_OAUTH_TOKEN
                      optional: true
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: ssh-key
                  mountPath: /root/.ssh
                  readOnly: true
                - name: ca-certs
                  mountPath: /opt/ca-certs
                  readOnly: true
                - name: claude-credentials
                  mountPath: /root/.claude
                  readOnly: true
              resources:
                {{- toYaml .Values.weekly.resources | nindent 16 }}
{{- end }}
