{{- if .Values.nightly.enabled }}
# Entrypoint script for nightly CI CronJob.
# Source: .ci/k8s/entrypoint.sh (keep in sync)
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-ci-entrypoint
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
{{ .Files.Get "files/entrypoint.sh" | indent 4 }}
{{- end }}
