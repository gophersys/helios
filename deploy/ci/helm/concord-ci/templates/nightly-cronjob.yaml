{{- if .Values.nightly.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: concord-ci-nightly
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
    {{- include "concord-ci.nightly.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.nightly.schedule | quote }}
  timeZone: {{ .Values.nightly.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        {{- include "concord-ci.labels" . | nindent 8 }}
        {{- include "concord-ci.nightly.labels" . | nindent 8 }}
    spec:
      activeDeadlineSeconds: {{ .Values.nightly.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "concord-ci.labels" . | nindent 12 }}
            {{- include "concord-ci.nightly.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "concord-ci.nodeSelector" . | nindent 10 }}
          terminationGracePeriodSeconds: 30

          volumes:
            - name: docker-socket
              emptyDir: {}
            - name: dind-storage
              hostPath:
                path: /var/lib/concord/ci/docker
                type: DirectoryOrCreate
            - name: workspace
              emptyDir: {}
            - name: ssh-key
              secret:
                secretName: bitbucket-ssh-key
                defaultMode: 0400
                optional: true
                items:
                  - key: ssh-private-key
                    path: id_rsa
            - name: entrypoint
              configMap:
                name: concord-ci-entrypoint
                defaultMode: 0755
            - name: ca-certs
              secret:
                secretName: corekinect-ca-certs
                optional: true
            - name: claude-credentials
              secret:
                secretName: claude-code-oauth
                optional: true
                defaultMode: 0600
                items:
                  - key: credentials.json
                    path: .credentials.json

          containers:
            # ── CI Runner ─────────────────────────────────────
            - name: ci-runner
              image: {{ .Values.nightly.image }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
                  update-ca-certificates >/dev/null 2>&1
                  echo "[ci] Waiting for Docker daemon..."
                  until docker info >/dev/null 2>&1; do sleep 1; done
                  for cert in /opt/ca-certs/*.crt; do
                    docker cp "$cert" "$(hostname):/usr/local/share/ca-certificates/" 2>/dev/null || \
                    cat "$cert" >> /etc/ssl/certs/ca-certificates.crt 2>/dev/null || true
                  done
                  if [[ -n "${DOCKERHUB_USERNAME:-}" ]] && [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
                    echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin 2>&1
                  fi
                  echo "[ci] Cloning ${BRANCH:-main}..."
                  export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no"
                  git clone --depth 1 --branch "${BRANCH:-main}" "${REPO_URL}" /workspace/concord
                  cd /workspace/concord
                  exec /opt/ci/entrypoint.sh
              envFrom:
                - configMapRef:
                    name: concord-ci-config
                - secretRef:
                    name: concord-ci-secrets
                    optional: true
              env:
                - name: CI
                  value: "true"
                - name: CI_PROVIDER
                  value: "kubernetes"
                - name: DOCKER_HOST
                  value: "unix:///var/run/docker.sock"
                - name: HOME
                  value: "/root"
                - name: DOCKERHUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: username
                      optional: true
                - name: DOCKERHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: token
                      optional: true
                - name: CLAUDE_CODE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: claude-code-oauth
                      key: CLAUDE_CODE_OAUTH_TOKEN
                      optional: true
              volumeMounts:
                - name: docker-socket
                  mountPath: /var/run
                - name: workspace
                  mountPath: /workspace
                - name: ssh-key
                  mountPath: /root/.ssh
                  readOnly: true
                - name: entrypoint
                  mountPath: /opt/ci
                  readOnly: true
                - name: ca-certs
                  mountPath: /opt/ca-certs
                  readOnly: true
                - name: claude-credentials
                  mountPath: /root/.claude
                  readOnly: true
              resources:
                {{- toYaml .Values.nightly.resources.runner | nindent 16 }}

            # ── Docker-in-Docker Sidecar ──────────────────────
            - name: dind
              image: docker:27-dind
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
                  update-ca-certificates >/dev/null 2>&1
                  exec dockerd-entrypoint.sh \
                    --host unix:///var/run/docker.sock \
                    --storage-driver overlay2
              securityContext:
                privileged: true
              env:
                - name: DOCKER_TLS_CERTDIR
                  value: ""
              volumeMounts:
                - name: docker-socket
                  mountPath: /var/run
                - name: dind-storage
                  mountPath: /var/lib/docker
                - name: ca-certs
                  mountPath: /opt/ca-certs
                  readOnly: true
              resources:
                {{- toYaml .Values.nightly.resources.dind | nindent 16 }}
              readinessProbe:
                exec:
                  command: ["docker", "info"]
                initialDelaySeconds: 3
                periodSeconds: 5
{{- end }}
