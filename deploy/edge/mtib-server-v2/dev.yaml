# MTIB Server V2 - Development deployment
# Pinned to a specific edge node for hardware testing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtib-server-v2-dev
  labels:
    app: mtib-server-v2-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtib-server-v2-dev
  template:
    metadata:
      labels:
        app: mtib-server-v2-dev
    spec:
      terminationGracePeriodSeconds: 1
      # Init container to remount /sys as writable
      initContainers:
      - name: remount-sys
        image: busybox:latest
        command: ['sh', '-c', 'mount -o remount,rw /sys']
        securityContext:
          privileged: true
      # Pin to the specific dev node
      nodeSelector:
        kubernetes.io/hostname: verdin-imx8mm-15702160
      tolerations:
      - key: "corekinect.com/role"
        operator: "Equal"
        value: "edge"
        effect: "NoSchedule"
      containers:
      - name: mtib-server-v2
        image: containers.ad.corekinect.com/concord-mtib-server-v2:dev
        imagePullPolicy: Always
        securityContext:
          privileged: true
        ports:
        - containerPort: 50052
          hostPort: 50052
        env:
        - name: MTIB_HARDWARE_REVISION
          value: "1.2"
        - name: LOG_LEVEL
          value: "10"
        - name: LOG_PATH
          value: "/var/log"
        - name: SERVER_PORT
          value: "50052"
        - name: ASSETS_PATH
          value: "assets"
        - name: METRICS_ENABLED
          value: "false"
        - name: METRICS_BROKER_URL
          value: "mqtt://kubecop.ad.corekinect.com:1883"
        - name: MOTION_ENABLED
          value: "false"
        volumeMounts:
        - name: devices
          mountPath: /dev
        - name: logs
          mountPath: /var/log/runner
        - name: gpio
          mountPath: /sys/class/gpio
        - name: sys-bus-iio
          mountPath: /sys/bus/iio
        - name: sys-class-hwmon
          mountPath: /sys/class/hwmon
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1024Mi"
      volumes:
      - name: devices
        hostPath:
          path: /dev
      - name: logs
        hostPath:
          path: /var/log/runner
      - name: gpio
        hostPath:
          path: /sys/class/gpio
      - name: sys-bus-iio
        hostPath:
          path: /sys/bus/iio
      - name: sys-class-hwmon
        hostPath:
          path: /sys/class/hwmon
