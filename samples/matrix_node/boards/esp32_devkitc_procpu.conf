CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y

# WiFi credentials live in NVS (provisioned once, never in the image)
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ESP32 RAM
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# Memory-for-speed: BALANCED profile (fits ESP32 RAM alongside cipher; THROUGHPUT
# profile needs a higher-RAM board). See SUPPORTED_HARDWARE.md.
CONFIG_CK_IFACE_NET_BALANCED=y
# headroom for the bigger buffers
CONFIG_HEAP_MEM_POOL_SIZE=20480
