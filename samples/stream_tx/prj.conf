# Libraries
CONFIG_CK_IFACE_LIB_SOCKETS=y
CONFIG_CK_CIPHER_LIB=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# System
CONFIG_MAIN_STACK_SIZE=8192

# Networking core (transport details are per-board: boards/*.conf)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y

# Thread stacks: generous margin on top of the (fixed) 2048 library default
CONFIG_CK_CIPHER_IFACE_THREAD_STACK_SIZE=4096

# Packet analyzer: decoded packets on console
CONFIG_CK_PKT_ANALYZER=y
CONFIG_CK_PKT_ANALYZER_BACKEND_LOG=n

# Benchmark: keep the data path free of synchronous logging
CONFIG_CK_CIPHER_IFACE_LOG_LEVEL=1
CONFIG_CK_CIPHER_SD_LOG_LEVEL=1
CONFIG_CK_CIPHER_REGISTRY_LOG_LEVEL=1
CONFIG_CK_CIPHER_RPC_LOG_LEVEL=1
CONFIG_CK_CIPHER_STREAM_LOG_LEVEL=3
CONFIG_CK_CIPHER_DAEMON_LOG_LEVEL=1
CONFIG_LOG_BUFFER_SIZE=8192
