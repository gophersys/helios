# native_sim: offload sockets to the HOST network stack (no TAP needed).
# The daemon's zsock_* calls become real Linux syscalls, so the sim reaches
# the LAN exactly like any process on the devbox.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_CONFIG_AUTO_INIT=n
# Host glibc has no mDNS; target the board's DHCP lease directly.
CONFIG_CIPHER_SAMPLE_SERVER_HOST="10.168.0.97"
# Net backend: JSON events to the local collector
CONFIG_CK_PKT_ANALYZER_BACKEND_NET=y
CONFIG_CK_PKT_ANALYZER_NET_HOST="127.0.0.1"
CONFIG_CK_PKT_ANALYZER_NET_PORT=9999
