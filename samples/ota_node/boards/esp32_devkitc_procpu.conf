CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y

# WiFi credentials live in NVS (provisioned once, never in the image)
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# ESP32 RAM
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# OTA is a one-shot ~150KB transfer, not throughput-critical: FOOTPRINT net
# profile leaves DRAM for the MCUboot/DFU flash_img path alongside WiFi+cipher.
CONFIG_CK_IFACE_NET_FOOTPRINT=y
# headroom for the bigger buffers
CONFIG_HEAP_MEM_POOL_SIZE=16384

# small flash_img block buffer (DFU write path)
CONFIG_IMG_BLOCK_BUF_SIZE=512

# OTA needs only a couple of connections; shrink net pools + WiFi buffers to fit
# MCUboot/DFU into the ESP32's tight DRAM alongside WiFi + cipher.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
