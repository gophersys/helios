# Libraries
CONFIG_CK_IFACE_LIB_SOCKETS=y
CONFIG_CK_CIPHER_LIB=y

# Two daemons in one image
CONFIG_CK_CIPHER_CLIENT_IFACE_COUNT=1
CONFIG_CK_CIPHER_SERVER_IFACE_COUNT=1

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# System
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Networking over loopback (127.0.0.1) — no external interface needed
CONFIG_NETWORKING=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="127.0.0.1"

# Quiet the data path
CONFIG_CK_CIPHER_STREAM_LOG_LEVEL=3
CONFIG_CK_CIPHER_IFACE_LOG_LEVEL=1
CONFIG_CK_CIPHER_SD_LOG_LEVEL=1
CONFIG_CK_CIPHER_REGISTRY_LOG_LEVEL=1
CONFIG_LOG_BUFFER_SIZE=8192
