# Libraries
CONFIG_CK_IFACE_LIB_SOCKETS=y
CONFIG_CK_CIPHER_LIB=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# System
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=8192

# Networking: ethernet + DHCP
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# mDNS: advertise as cipher-server.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="cipher-server"
CONFIG_MDNS_RESPONDER=y

# Thread stacks: generous margin on top of the (fixed) 2048 library default
CONFIG_CK_CIPHER_IFACE_THREAD_STACK_SIZE=4096

# Packet analyzer: decoded cipher packets on the console
CONFIG_CK_PKT_ANALYZER=y
CONFIG_CK_PKT_ANALYZER_BACKEND_LOG=n

# Benchmark: keep the data path free of synchronous logging
CONFIG_CK_CIPHER_IFACE_LOG_LEVEL=3
CONFIG_CK_CIPHER_SD_LOG_LEVEL=1
CONFIG_CK_CIPHER_REGISTRY_LOG_LEVEL=1
CONFIG_CK_CIPHER_RPC_LOG_LEVEL=1
CONFIG_CK_CIPHER_STREAM_LOG_LEVEL=4
CONFIG_CK_CIPHER_DAEMON_LOG_LEVEL=1
CONFIG_LOG_BUFFER_SIZE=8192

# On-device instrumentation: per-thread CPU + stack + heap sampling
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Reconnect-heavy + stream throughput headroom
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
CONFIG_HEAP_MEM_POOL_SIZE=8192
