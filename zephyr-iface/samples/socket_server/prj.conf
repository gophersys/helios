# Iface library
CONFIG_CK_IFACE_LIB_SOCKETS=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y

# System
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=10000

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_DNS_RESOLVER=y

# Thread-Aware debugging
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# Disable code for debuggin
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_EXCEPTION_STACK_TRACE=y

# Ethernet (Nucleo-H743ZI on-board MAC + LAN8742 PHY)
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_UDP=y

# mDNS: advertise this board as iface-server.local so the client can find it
# by name (DHCP-assigned address, zero static config).
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="iface-server"
CONFIG_MDNS_RESPONDER=y
