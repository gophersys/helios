# The client certificate that lets a build reach the native arm64 buildkitd node.
#
# The Mac mini (machines/services/macos-ci-runner) runs a standalone `buildkitd`
# container. It listens on tcp://10.168.0.92:1234 and exposes the BUILD API only,
# over mutual TLS. A build reaches it with buildx `--driver remote`, so the pod
# needs three PEM files on disk: the CA, the client certificate and the client
# key. Measured on 2026-08-14: a native arm64 build through the node took 9.3s,
# and a client with no certificate was refused.
#
# WHO CAN READ IT
# EVERY job on the general `arc-org` pool, because that is the pool that builds
# images. This is acceptable, unlike the SSH key it replaces, because the client
# can do ONE thing — submit a sandboxed build. Proven on the mini on 2026-08-14:
#   - `docker -H tcp://10.168.0.92:1234` finds NO Engine API on the port.
#   - `docker run --privileged --pid=host` through the port does NOT give root.
#     The old escape is dead.
#   - `docker buildx build --allow security.insecure` is refused: the entitlement
#     is not allowed.
# The certificate reaches no Engine API, no privileged step and no host access.
# The item it replaces (`shared/eden/macos-buildx-key`) granted the Docker Engine
# API, which is root on the mini's VM. That item is deleted and the SSH key is
# revoked.
#
# POOL PLACEMENT IS MATEO'S CALL
# arc-org is now defensible: the client can only build, and the pool already
# stays closed to public repositories (see app-arc-runners-org.yaml). The final
# placement stays Mateo's, because every repository on the pool then shares one
# builder on the mini.
#
# WHY NO TEMPLATE
# The three items are PEM, not an OpenSSH key. OpenSSH refuses a key whose last
# byte is not a newline; PEM carries no such rule, so a plain passthrough is
# correct and no trailing-newline template is needed. Each secretKey below IS the
# file name under the mount path, so the pod spec needs no `items:` remapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildkit-client-certs
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: buildkit-client-certs
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.pem
      remoteRef:
        key: shared/eden/buildkit-client-ca
    - secretKey: cert.pem
      remoteRef:
        key: shared/eden/buildkit-client-cert
    - secretKey: key.pem
      remoteRef:
        key: shared/eden/buildkit-client-key
