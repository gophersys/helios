# ChatGPT-managed Codex authentication for the private pull-request review pool.
# The Vaultwarden password property contains the complete auth.json document.
# Only arc-review mounts the resulting Secret; general build pools cannot read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-review-auth
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden-password
  target:
    name: codex-review-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: auth.json
      remoteRef:
        key: shared/eden/codex-review-auth
