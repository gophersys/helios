# ci-image-warmer — every runner-eligible node keeps the runner images hot,
# with ZERO privilege.
#
# WHY IT EXISTS: docs/ci-substrate.md's design makes the kubelet's per-node
# containerd cache the thing that makes pools fast. That cache is warm only
# after the first job on a node pays the pull, and it goes cold for a new tag
# the moment a pin bumps. This DaemonSet closes both gaps.
#
# HOW IT WARMS — the kubelet does the pulling, not us. Each image to warm is
# an initContainer whose whole job is to exist: the kubelet pulls it with the
# pod's imagePullSecrets and the node's own DNS, the container runs `true`,
# and the image stays in containerd's cache. The previous design mounted the
# node's containerd socket to do the same thing by hand, which made the warmer
# node-root in effect; Mateo rejected the mount (2026-08-17) and this shape
# replaces it. No hostPath, no privilege, no API access, no listener —
# scripts/verify-warmer-pins.sh FAILS validate if a hostPath ever returns to
# this file.
#
# WHAT WAS GIVEN UP, deliberately:
#   - Explicit GC of superseded refs. Removal is the kubelet's image GC's job
#     (disk-pressure thresholds); superseded tags linger until then. That is
#     the platform-native mechanism, and node disks have headroom. If disk
#     pressure ever fires on a build node, revisit — do not re-add the socket.
#   - Live derivation of the pinned ref. The pin is written HERE, a 4th home
#     of the digest the 3 scale-set files pin. Drift cannot go quiet:
#     scripts/verify-warmer-pins.sh holds all 4 to one value in CI, and the
#     failure mode of a missed bump is one cold pull, not a wrong image — pods
#     pin their own refs and never read this file.
#
# REFRESH: initContainers pull at pod start. 43-image-warmer-refresh.yaml
# rollout-restarts this DaemonSet daily at 03:30 UTC, so :latest is re-pulled
# in time for the day's first build and a bumped pin is warm before the first
# job needs it.
#
# SCHEDULING: NotIn the 3 control planes, and nothing else. k3s-w-4 was in this
# list while it held the USB-passthrough embedded lab; that lab is gone and the
# node returned to general capacity on 2026-08-19, so it warms like every other
# worker. The control planes are excluded EXPLICITLY, by
# hostname, because nothing else excludes them: zero taints exist cluster-wide
# (verified live 2026-08-18; the taints declared in
# clusters/instances/homelab/nodes/*/identity.yaml were never applied — see
# docs/debt-register.md D45). They are 38GB VMs running etcd, and a warmer pod
# holds ~3.86GB of images there that image GC cannot reclaim while it runs;
# k3s-cp-0 reached 93% used / 2.7GB free on 2026-08-18.
# scripts/verify-warmer-pins.sh derives the control-plane set from those identity
# files and FAILS validate when one of them is missing from the list below.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ci-image-warmer
  namespace: arc-runners
spec:
  selector:
    matchLabels:
      app: ci-image-warmer
  template:
    metadata:
      labels:
        app: ci-image-warmer
    spec:
      serviceAccountName: ci-image-warmer
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["k3s-cp-0", "k3s-cp-1", "k3s-cp-2"]
      initContainers:
        # The ref every ARC pool pins — verify-warmer-pins.sh holds this line
        # to the same digest as the 3 app-arc-runners-*.yaml files.
        - name: warm-cloud-pinned
          image: ghcr.io/gophersys/cloud@sha256:359334d77d8fee3372fa9672be37f04d121bc294426622ae3d5161e90b9d2a0c
          imagePullPolicy: IfNotPresent
          command: ["true"]
          securityContext: &warmctx
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Tomorrow's bump, warm before it lands. Always-pull is the point:
        # every daily restart refreshes what :latest means.
        - name: warm-cloud-latest
          image: ghcr.io/gophersys/cloud:latest
          imagePullPolicy: Always
          command: ["true"]
          securityContext: *warmctx
        # The dind sidecar every runner pod starts. Its tag moves upstream;
        # IfNotPresent warms the first pull and the kubelet keeps it.
        - name: warm-dind
          image: docker.io/library/docker:29.7.2-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
          imagePullPolicy: IfNotPresent
          command: ["true"]
          securityContext: *warmctx
      containers:
        # A DaemonSet pod must keep running; pause is the smallest thing that
        # does. Pinned by digest so a tag re-point cannot change what runs —
        # 3.10 as of 2026-08-17.
        - name: hold
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65535
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
