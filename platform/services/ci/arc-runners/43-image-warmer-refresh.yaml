# ci-image-warmer-refresh — the daily rollout restart that makes the warmer
# re-pull.
#
# initContainers pull when a pod STARTS, so without this the warmer would pull
# once per node boot and :latest would silently age. One restart per UTC day
# at 03:30 — the old warmer's hour, after the nightly scan window and before
# the working day — makes every warmer pod re-run its initContainers: the
# pinned ref is a no-op read, :latest is re-resolved, and a freshly bumped pin
# is warm before the first job of the day.
#
# The pod runs the same pinned cloud digest the warmer holds, so on a node where
# a warmer pod already runs the restart pulls nothing. That holds only while this
# affinity and the DaemonSet's agree; verify-warmer-pins.sh asserts that both
# exclude every declared control plane, not that the 2 lists are identical.
#
# The control planes are in the list below for the DaemonSet's reason: a pod that
# lands on one pulls the 2.06GB cloud image onto a 38GB etcd VM, which is the pin
# 42-image-warmer-daemonset.yaml just stopped taking.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-image-warmer-refresh
  namespace: arc-runners
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ci-image-warmer-refresher
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: ["k3s-cp-0", "k3s-cp-1", "k3s-cp-2"]
          volumes:
            # kubectl writes its discovery cache under $HOME; the root
            # filesystem is read-only, so HOME points here instead.
            - name: home
              emptyDir:
                sizeLimit: 64Mi
          containers:
            - name: restart
              image: ghcr.io/gophersys/cloud@sha256:359334d77d8fee3372fa9672be37f04d121bc294426622ae3d5161e90b9d2a0c
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp/home
              volumeMounts:
                - name: home
                  mountPath: /tmp/home
              command:
                - kubectl
                - -n
                - arc-runners
                - rollout
                - restart
                - daemonset/ci-image-warmer
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
