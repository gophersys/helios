# The Claude credential for the pull request review agent.
#
# It reaches the review pool from Vaultwarden through External Secrets, and never
# touches GitHub. That matters at 20 repositories: an Actions secret would need a
# copy in each one and a rotation in each one. This is 1 object.
#
# WHICH KIND OF TOKEN
# `shared/eden/claude-setup-token` is an OAuth setup token, minted with
# `claude setup-token`. It is NOT an API key. The Eden adapter
# (libs/go/agentsession/claudeadapter) scrubs ANTHROPIC_API_KEY and
# ANTHROPIC_AUTH_TOKEN from a child environment before injecting this one,
# because a stray API key silently takes precedence. Verified working on
# 2026-08-10: a live call returned the expected reply.
#
# WHO CAN READ IT
# Only the `arc-review` scale set names this Secret. The general `arc-org` pool
# does not, so an ordinary build cannot read the token. That is the whole reason
# the review pool is separate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-review-token
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: claude-review-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: shared/eden/claude-setup-token
