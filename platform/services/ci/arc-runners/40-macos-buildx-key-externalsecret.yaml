# The SSH key that lets a build reach the native arm64 buildx node.
#
# The Mac mini (machines/services/macos-ci-runner) is an arm64 Docker host. A
# build reaches it with `docker -H ssh://`, so the pod needs a private key on
# disk. Measured on 2026-08-13, same Dockerfile, images pre-pulled, --no-cache:
# linux/arm64 native 4.02s against linux/amd64 emulated 13.8s, so 3.44x.
#
# WHO CAN READ IT
# EVERY job on the general `arc-org` pool, because that is the pool that builds
# images. Unlike `claude-review-token`, this one cannot be fenced into a
# single-workflow pool. It is acceptable only because the key is DIAL-ONLY: on
# the mini it is installed as
#     command="/Users/mateo/bin/docker system dial-stdio",restrict
# so it opens a BuildKit dial and nothing else. Proven on 2026-08-13 — `whoami`
# ran the forced command instead of a shell, `cat ~/.ssh/id_ed25519` was refused,
# and `ssh -L` was refused. An UNRESTRICTED key on this pool would give every
# build a shell on the mini.
#
# The bound is on ssh, NOT on Docker. The dial still exposes the whole Docker API
# of the mini, and a Docker API is root-equivalent on its host through a
# privileged container. So the pool must stay closed to public repositories, for
# the same reason it already is (see app-arc-runners-org.yaml). The admin key
# `~/.ssh/macos-ci-runner` is a DIFFERENT key, is unrestricted, and stays that
# way for `verify-access`; it never reaches the cluster.
#
# WHY THE TEMPLATE, AND NOT A PLAIN PASSTHROUGH
# The vault item holds the key as its notes body, and its last byte is NOT a
# newline (measured, 2026-08-13 — only the byte was read, never the value).
# OpenSSH matches its end marker WITH the newline, so a key that ends without one
# is refused: `ssh-keygen -y` on a copy with the newline stripped exits 255 with
# "invalid format". The template restores exactly one trailing newline and is
# idempotent, so a re-paste of the vault item cannot reintroduce the fault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: macos-buildx-key
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: macos-buildx-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # The key of this entry IS the file name under the mount path, so the
        # pod spec needs no `items:` remapping.
        macos-buildx: |
          {{ .privateKey | trim }}
  data:
    - secretKey: privateKey
      remoteRef:
        key: shared/eden/macos-buildx-key
