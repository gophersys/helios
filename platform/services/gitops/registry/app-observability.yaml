# eden-observability — Prometheus, Loki, Tempo, Grafana and 2 Alloy collectors.
#
# The stack was uninstalled on 2026-08-09 because it had been in `failed` helm
# state since 2026-06-18 while NOTHING reconciled it: it was a hand-run
# `helm upgrade --install`, Argo never owned it, and every hand-applied fix
# reverted with no message (docs/cluster-topology.md). This Application is the
# difference. The stack now comes back git-owned and self-healing, which is the
# only reason to bring it back at all.
#
# STORAGE: `local-path`, decided 2026-08-19. See the header of
# values-homelab.yaml for the trade — node-local, no replication, telemetry is
# re-derivable. The 5 PVCs (Loki 10Gi, Tempo 10Gi, Prometheus 20Gi, Grafana
# 5Gi, Alertmanager 2Gi since 2026-08-24) are WaitForFirstConsumer and bind on
# the node each pod first lands on.
#
# BEFORE THE FIRST SYNC — the one imperative step, and it is NOT skippable.
# Grafana reads `admin.existingSecret: grafana-admin` (namespace `observability`,
# keys admin-user/admin-password). There is no ExternalSecret for it and that is
# deliberate, two reasons deep:
#   1. No vault item exists. The password was generated with `openssl rand` at
#      creation and never stored (docs/runtime-secrets.md). An ExternalSecret
#      naming an absent item is a permanent SecretSyncedError AND a red
#      `ctl.sh verify-vault-refs` — a broken gate shipped as configuration.
#   2. The `vaultwarden` ClusterSecretStore returns ONE field, the item's
#      `notes` blob. A 2-key login does not fit it; that is exactly why every
#      single-value credential in this cluster is imperative.
# So create it by hand once, before syncing (Grafana sits in
# CreateContainerConfigError until it exists — visible, not silent):
#
#   kubectl create namespace observability
#   kubectl -n observability create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 18)"
#
# Vaulting it (item `shared/grafana/admin`, both values in the notes field) is a
# Mateo action, and the ExternalSecret that would replace this step is a separate
# PR that lands only after the item exists.
#
# NO NEW EXPOSURE. Grafana gets its MetalLB LoadBalancer (10.168.0.241, PINNED
# with metallb.io/loadBalancerIPs, plain HTTP, tailnet) and NO Ingress —
# 10.168.0.241 is reserved by that annotation rather than won by allocation
# order, so the documents that name it stay true. `grafana.mateosegura.com` has no dedicated A
# record since 2026-08-09, and the `*.mateosegura.com` wildcard sends it to the
# cloud cluster's public IP, so an Ingress here could never be reached. The
# reasoning and the exact restore order are in the values-homelab.yaml header.
#
# NO ServerSideApply. It is set only where a resource measurably needs it, and
# never on an Application that manages an ExternalSecret (debt-register D44).
# Since 2026-08-24 this app DOES manage one ExternalSecret
# (alertmanager-discord-webhook, rendered by the chart), which is exactly why
# SSA must stay off here — and it makes this app the control case D44 asked
# for: an ExternalSecret in an Application WITHOUT ServerSideApply=true. If it
# reports Synced, the D44 correlation (SSA + this CRD) holds. No size problem:
# the largest object it renders is well inside the 262144-byte
# client-side-apply annotation, because the `gnetId` dashboards are fetched by
# Grafana's own download initContainer rather than embedded.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/services/observability/chart
    helm:
      releaseName: obs          # the name the docs and the runbooks use
      # Both files, in this order, to mirror the documented command exactly
      # (`helm upgrade --install obs . -f values.yaml -f values-homelab.yaml`).
      # Helm already merges a chart's own values.yaml as the base, so the first
      # entry is a deliberate no-op duplicate: it costs nothing and it removes
      # any doubt about which base this renders against.
      valueFiles:
        - values.yaml
        - values-homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    # `observability`, not `platform-observability`. Every service name in the
    # chart is pinned with fullnameOverride and addressed as in-namespace DNS,
    # and 2 live consumers already hardcode this namespace: the Homepage
    # siteMonitor widgets (apps/music/homepage/20-configmap.yaml) and the OTLP
    # endpoint apps target (`alloy-gateway.observability.svc:4318`). It is also
    # what every other platform namespace here does — cert-manager,
    # external-secrets, tailscale — so rule 50 §3's `platform-<component>` form
    # has no instance on this cluster to be consistent with.
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
      prune: false            # platform-component norm; these workloads own PVCs
    syncOptions:
      - CreateNamespace=true
