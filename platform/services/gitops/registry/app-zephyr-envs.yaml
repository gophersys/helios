# Ephemeral Zephyr embedded dev environments — one Argo Application per
# directory under apps/embedded/envs/. The git directory generator makes the
# env lifecycle PR-driven:
#
#   spin up  : add apps/embedded/envs/<name>/ (overlay of zephyr-devbox/base)
#   tear down: delete the directory — prune=true removes everything the env
#              owned (pod, PVCs, Service -> its tailnet proxy/MagicDNS node)
#
# prune=true is deliberate and safe HERE (unlike media): env deletion is the
# designed tear-down path, envs are scratch by definition, and the blast radius
# is fenced by AppProject `embedded` (namespaced-only, embedded-lab only).
# The embedded-lab namespace itself is NOT owned by any env — see
# app-embedded-namespace.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zephyr-envs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/gophersys/infrastructure.git
        revision: main
        directories:
          - path: apps/embedded/envs/*
  template:
    metadata:
      name: 'zephyr-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: embedded
    spec:
      project: embedded
      source:
        repoURL: https://github.com/gophersys/infrastructure.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: embedded-lab
      syncPolicy:
        automated:
          selfHeal: true
          prune: true       # dir deletion IS the tear-down (see header)
