# AppProject: embedded — ephemeral Zephyr dev environments (apps/embedded/).
# LOCKED to the `embedded-lab` namespace, namespaced-only — same hard
# blast-radius fence as `media`. The per-env Applications are generated by the
# zephyr-envs ApplicationSet with prune=true, so this fence is what guarantees
# a pruned env can never take anything outside embedded-lab with it.
# (The embedded-lab Namespace object itself is platform-owned:
# app-embedded-namespace.yaml.)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: embedded
  namespace: argocd
spec:
  description: Zephyr embedded dev envs — namespace-locked to `embedded-lab`
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
  destinations:
    - namespace: embedded-lab
      server: https://kubernetes.default.svc
  # no clusterResourceWhitelist → embedded apps may NOT create cluster-scoped objects
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
