# AppProject: platform — cluster add-ons / platform services.
# Broad scope (may create cluster-scoped resources + span add-on namespaces),
# but sourced ONLY from the infra repo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons and platform services (ESO, storage, drift-guard, fixes)
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
    - https://charts.external-secrets.io   # External Secrets Operator chart
    - https://pkgs.tailscale.com/helmcharts   # Tailscale Kubernetes operator
  destinations:
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: longhorn-system
      server: https://kubernetes.default.svc
    - namespace: cloudflare-tunnel       # the public edge (app-cloudflared, manual-sync)
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: tailscale
      server: https://kubernetes.default.svc
    - namespace: embedded-lab            # only the Namespace object (app-embedded-namespace) + workspaces RBAC grant
      server: https://kubernetes.default.svc
    - namespace: workspaces-prod         # only the Namespace object (app-workspaces-namespace)
      server: https://kubernetes.default.svc
    - namespace: eden                    # the Eden Namespace (app-eden-namespace) + orchestrator cluster RBAC (app-eden-rbac)
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
