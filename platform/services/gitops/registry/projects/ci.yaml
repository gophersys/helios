# Self-hosted CI: Actions Runner Controller (ARC) + repo-level runner scale sets.
# Allows the public ARC OCI Helm registry as a source and the two arc-* namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ci
  namespace: argocd
spec:
  description: Self-hosted CI — Actions Runner Controller + runner scale sets
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - namespace: arc-systems
      server: https://kubernetes.default.svc
    - namespace: arc-runners
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
