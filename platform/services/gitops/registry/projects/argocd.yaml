# AppProject: argocd — Argo CD manages its own install from git (self-management).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd
  namespace: argocd
spec:
  description: Argo CD self-management
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
    - https://argoproj.github.io/argo-helm   # Argo CD Helm chart (self-management)
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
