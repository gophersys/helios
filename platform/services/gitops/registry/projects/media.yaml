# AppProject: media — the media stack (qBittorrent, *arr, Jellyfin).
# LOCKED to the `media` namespace. Cannot create cluster-scoped resources and
# cannot deploy into any other namespace — hard blast-radius isolation.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: media
  namespace: argocd
spec:
  description: Media stack — namespace-locked to `media`
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
    # rayne's page lives with the rest of Mateo's personal work, not with the
    # platform. An AppProject allowlist is per-repo on purpose — widening it to
    # the whole org would let any future app deploy from anywhere, which is the
    # blast radius this project boundary exists to hold.
    - https://github.com/gophersys/home.git
  destinations:
    - namespace: media
      server: https://kubernetes.default.svc
  # no clusterResourceWhitelist → media apps may NOT create cluster-scoped objects
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
