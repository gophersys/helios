# AppProject: workspaces — the workspaces.mateosegura.com UI/API.
# Namespace-locked to workspaces-prod (media/embedded pattern): a bug or
# bad sync in this app can never touch anything outside its namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workspaces
  namespace: argocd
spec:
  description: Zephyr workspaces UI/API — locked to workspaces-prod
  sourceRepos:
    - https://github.com/gophersys/infrastructure.git
  destinations:
    - namespace: workspaces-prod
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
