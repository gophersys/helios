# Argo's own repository credentials, reconciled by Argo.
#
# Chicken-and-egg is not a problem here: this Application's source is the
# infrastructure repo, which Argo can already read via the credential this
# Application manages. If the credential were ever lost, bootstrap it by hand
# once and Argo resumes owning it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repo-credentials
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/services/gitops/repo-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
