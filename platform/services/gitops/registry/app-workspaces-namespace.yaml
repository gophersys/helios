# Owns the long-lived workspaces-prod Namespace (platform project — same
# rationale as app-embedded-namespace.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspaces-namespace
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: apps/workspaces/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: workspaces-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
