# The embedded-lab Namespace, managed on its own. Rationale: project `embedded`
# is namespaced-only (no cluster-scoped rights — same fence as `media`), and the
# per-env Applications are pruned on env tear-down, so none of them may own the
# namespace. A tiny platform-project Application owns it instead ("namespaces
# are platform-level" — see app-qbittorrent.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embedded-namespace
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: apps/embedded/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: embedded-lab
  syncPolicy:
    automated:
      selfHeal: true
      prune: false        # never auto-delete a namespace (would take PVCs with it)
