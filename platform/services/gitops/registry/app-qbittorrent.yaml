# Adopt the live (imperatively-deployed) qBittorrent/Gluetun stack into GitOps.
#
# Adoption safety:
# - project `media` is namespaced-only, so the Namespace manifest (00-namespace)
#   is EXCLUDED here (the `media` ns already exists; namespaces are platform-level).
# - The `gluetun-wireguard` Secret and the cert-manager `torrent-tls` Secret are
#   NOT in this path, so Argo never manages or prunes them.
# - MANUAL sync during adoption: annotation tracking + matching manifests make the
#   first sync a metadata-only no-op (the pod must NOT restart). Auto-sync is
#   enabled in a follow-up commit only after that's verified. prune stays OFF.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent
  namespace: argocd
spec:
  project: media
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: feat/argocd-phase0
    path: kubernetes/apps/qbittorrent
    directory:
      recurse: false
      exclude: "00-namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      selfHeal: true      # adoption verified (pod untouched) — safe to self-heal now
      prune: false        # never auto-delete media resources
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
