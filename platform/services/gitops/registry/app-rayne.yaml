# rayne — a single static page at rayne.mateosegura.com.
#
# The CONTENT lives in gophersys/home, not here. This repo is the platform; the
# page is Mateo's, so it belongs with the rest of his personal work, generated
# from its own index.html by that repo's render.py and drift-checked by its CI.
# The registry entry stays here because this directory is the single declaration
# of what is deployed — content moves out, the declaration does not.
#
# Lands in ns `media` / project `media` deliberately: that namespace already
# has the proven public path through the Cloudflare tunnel (homepage serves
# home.mateosegura.com from there), so this needs no new namespace, quota tier
# or NetworkPolicy exception. Split it out later if `media` starts to mean
# only media.
#
# prune: false matches the other registry apps — Argo adds and updates, but
# never deletes on its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rayne
  namespace: argocd
spec:
  project: media
  source:
    repoURL: https://github.com/gophersys/home.git
    targetRevision: main
    path: sites/rayne/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
