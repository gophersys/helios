# Deploys the bw-serve Vaultwarden bridge + NetworkPolicy + ClusterSecretStore
# (the ESO operator itself is the separate external-secrets Helm Application).
# Depends on the out-of-band seed secret `bw-cli-credentials` (created by hand).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-bridge
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/core/secrets-operator/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
