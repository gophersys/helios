# Kyverno policies (the config on top of the kyverno engine). All AUDIT mode
# during Phase 5; enforce is flipped per-namespace only after exceptions land.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/core/policy/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      selfHeal: true
      prune: true          # policies are safe to prune (removing a policy = removing audit)
    syncOptions:
      - ServerSideApply=true
