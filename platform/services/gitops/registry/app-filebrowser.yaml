# Filebrowser — web file access to the media storage (media project, ns media).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: filebrowser
  namespace: argocd
spec:
  project: media
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: apps/music/filebrowser
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
