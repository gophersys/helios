# The IMAGE-BUILD pool for gophersys. It runs the container image builds that used
# to run on GitHub-hosted minutes: `.devcontainer`'s build-and-push, its nightly
# scan and its weekly bump. runs-on: arc-build
#
# WHY A SECOND POOL AND NOT A BIGGER arc-org
# Blast-radius isolation, the same class of reason that already split `arc-review`
# off. `arc-org` answers `validate` and `pr-review` for every repository; an image
# build is the workload most able to take a node's disk. Partitioned, a build wave
# that exhausts its own ceiling cannot starve the gate of an unrelated repository.
# Total slots go 4 + 2 + 6 = 12, deliberately, instead of one pool of 12.
#
# The runner container image IS the `cloud` dev image, digest-pinned, and it is
# the same ref `arc-org` and `arc-review` run. Interface: docs/ci-substrate.md.
# Sizing rationale and onboarding: docs/ci-runners.md.
#
# The pod spec is written out rather than generated by `containerMode: dind`,
# for the reason written out in app-arc-runners-org.yaml: that mode APPENDS to
# what you supply, so a second container named `dind` renders and the API server
# rejects it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-build
  namespace: argocd
spec:
  project: ci
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: arc-build
      values: |
        githubConfigUrl: https://github.com/gophersys
        githubConfigSecret: arc-github-app
        runnerScaleSetName: arc-build
        # No floor. arc-org keeps minRunners 1 because a stuck pod there starves
        # every repository's gate; this pool answers 3 scheduled workflows in one
        # repository, so a cold start of 30 to 60 seconds costs a build nothing
        # and an idle warm pod would hold 10Gi of ephemeral request all day.
        minRunners: 0
        # 6, and the number is measured rather than chosen. k3s-w-0/1/2 are three
        # thin LVs on ONE NVMe on pve-00, so the guests' free space is not the
        # host's: `lvs` on 2026-08-17 read the thin pool at 816.21g, 29.15% used
        # (~578GB free). Exhausting that pool takes all three nodes at once, which
        # is a blast radius far wider than CI. Re-measure before raising this.
        maxRunners: 6
        # Argo renders helm without cluster access, so the chart can't auto-discover
        # the controller SA — set it explicitly.
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller

        template:
          spec:
            # One DNS pod serves this cluster, and the default resolver
            # posture multiplies every external lookup against it: ndots:5
            # walks ~5 search-domain suffixes, twice (A + AAAA), before
            # asking for `ghcr.io` verbatim — ~20 queries where 2 would do —
            # and glibc's attempts:2 gives up after a single retry. A build
            # wave plus warmer churn produced exactly that failure on
            # 2026-08-17 (run 32062015200: `lookup ghcr.io on 10.43.0.10:53:
            # read udp` timeout). These pods resolve EXTERNAL names only —
            # the API server arrives as an IP in env — so ndots:1 removes
            # the amplification outright, and attempts:4 at timeout:2 rides
            # out a busy DNS pod instead of failing a 40-minute build on one
            # lost UDP read.
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
                - name: timeout
                  value: "2"
                - name: attempts
                  value: "4"
            # The dind sidecar owns the Docker socket and chooses its gid, so the
            # runner must hold that gid to reach it. Granting it HERE and not in
            # the image is deliberate: the image-side attempt never held, because
            # a restored BuildKit layer reverted /etc/group while the build-time
            # assertion still passed. See docs/debt-register.md D31.
            # This value must equal DOCKER_GROUP_GID in the dind sidecar below.
            securityContext:
              supplementalGroups: [123]

            # PINNED to the three pve-00 workers, and this is an `In` list rather
            # than arc-org's `NotIn` of the control planes. k3s-w-0/1/2 have 14Gi
            # of RAM each; k3s-w-3 AND k3s-w-4 have 9Gi, and one pod of this shape
            # declares 12Gi of memory limits (runner 6Gi + dind 6Gi), so a build
            # scheduled on either is an eviction waiting for a large layer.
            # k3s-w-4 rejoined general capacity on 2026-08-19 when the
            # USB-passthrough embedded lab was retired — arc-org and arc-review
            # took it back. It stays OUT of this list on the RAM rule alone, which
            # is the same rule that keeps k3s-w-3 out. Raising this list is a
            # measurement, not an edit: re-check memory_gb in
            # clusters/instances/homelab/nodes/*/identity.yaml first.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: ["k3s-w-0", "k3s-w-1", "k3s-w-2"]
              # Spread concurrent builds so a matrix does not pile onto one worker.
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          actions.github.com/scale-set-name: arc-build

            # The kubelet pulls these, so it caches them per node — the reason the
            # toolchain rides on the pod image instead of a workflow `container:`.
            # Credential: 20-ghcr-pull-externalsecret.yaml in this repo.
            imagePullSecrets:
              - name: ghcr-pull

            initContainers:
              # MUST be the same image as the runner container: it seeds
              # /home/runner/externals, and those externals are the runner's own
              # bundled Node. A mismatched pair silently ships the wrong Node to
              # every JavaScript action.
              - name: init-dind-externals
                image: ghcr.io/gophersys/cloud@sha256:9a150cbff74b67f67f69cca1b25a463103cbe8885ba0b7a0f777de42e7f7f7f1
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir

              # Native sidecar (restartPolicy: Always). This is where image builds
              # actually burn CPU, memory and disk — size it, not just the runner.
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                  # The bridge this daemon makes lives INSIDE a flannel pod
                  # interface of MTU 1450, and dockerd's default is 1500. A
                  # container on that bridge advertises an MSS the overlay
                  # cannot carry, and whether a transfer survives depends on
                  # the peer's path-MTU behaviour: get.helm.sh reset the same
                  # fetch 3 of 3 times in run 32050747682 while ghcr.io and
                  # docker.io tolerated it. 1400 is the value the probe on
                  # k3s-w-0 PROVED (2026-08-17): the same URL timed out at
                  # 1500 and succeeded at 1400. The image builds themselves no
                  # longer ride this bridge (.devcontainer buildx-node.sh puts
                  # them in the pod namespace); this covers everything else a
                  # job runs with `docker run` — smoke containers, k3d, probes.
                  - --mtu=1400
                env:
                  # The gid dockerd gives the socket. The runner process must hold
                  # it or every job that touches docker fails with "permission
                  # denied ... unix:///var/run/docker.sock" — and only once a job
                  # actually uses docker, long after the image builds. It is
                  # granted by the pod's `supplementalGroups` above and NOT by the
                  # image: the image-side attempt did not hold (D31). This value
                  # and that one are the same number on purpose; change them
                  # together, and with DOCKER_GID in scripts/verify-runner-image.sh.
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 8Gi   # image layers live in this container
                  limits:
                    # No CPU limit on purpose: CFS throttling makes builds slow and
                    # flaky, and the request already guarantees the share.
                    memory: 6Gi
                    ephemeral-storage: 30Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals

            containers:
              - name: runner
                # Pin by DIGEST. The three preconditions before changing this ref
                # are written out once, in app-arc-runners-org.yaml; all three
                # apply here, and `bash ctl.sh verify-runner-image cloud <sha>` is
                # the one that runs the image in THIS pod shape.
                image: ghcr.io/gophersys/cloud@sha256:9a150cbff74b67f67f69cca1b25a463103cbe8885ba0b7a0f777de42e7f7f7f1
                command: ["/home/runner/run.sh"]
                # DECLARED, not inherited from the image. `cloud` ends `USER dev`
                # (uid 1000), and the buildkit key mounted below is a root-owned
                # 0400 file: uid 1000 cannot open it, and nothing would fail until
                # the first arm64 build. The image ships RUNNER_ALLOW_RUNASROOT=1,
                # without which run.sh refuses to start as root.
                securityContext:
                  runAsUser: 0
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 6Gi
                    ephemeral-storage: 10Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  # The buildkitd client certificate. It is mounted into the
                  # RUNNER and not into dind: the buildx client that dials the
                  # mini over mTLS runs here.
                  - name: buildkit-client-certs
                    mountPath: /etc/buildkit-certs
                    readOnly: true

            volumes:
              # 20Gi, twice arc-org's. `_work` holds the checkout and every build
              # context, and this pool exists to build container images.
              - name: work
                emptyDir:
                  sizeLimit: 20Gi
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir:
                  sizeLimit: 2Gi
              # Native arm64 builds run on the Mac mini's buildkitd over mTLS.
              # Credential: 40-buildkit-client-certs-externalsecret.yaml in this
              # repo. The client reaches the BUILD API only — no Engine API, no
              # privileged step. Usage: docs/ci-substrate.md.
              - name: buildkit-client-certs
                secret:
                  secretName: buildkit-client-certs
                  # 0400, NOT 400. Kubernetes parses a manifest as YAML 1.1, so a
                  # leading zero means octal and this really is 0400. Written as
                  # `400` it would be decimal 400, which renders 0620 — group
                  # writable. key.pem is the client's mTLS key, so keep it
                  # owner-only, and read it as the uid declared above.
                  defaultMode: 0400
                  # ESO materialises this Secret asynchronously, and Argo may sync
                  # this pool before the Secret exists. `optional: true` lets a
                  # runner pod START without the cert instead of hanging in
                  # ContainerCreating. The cert is used only for arm64 mini builds
                  # (D42, not yet enabled), so an absent cert breaks nothing now.
                  optional: true
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
