# NetworkPolicy floor for the arc-runners namespace (the runner scale set itself
# is Helm-deployed by app-arc-runners-org.yaml; this raw-manifest Application
# carries the policy objects the chart doesn't manage).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-netpol
  namespace: argocd
spec:
  project: ci
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/services/ci/arc-runners
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  # The external-secrets controller adds its own cleanup finalizer to every
  # ExternalSecret it manages, with an Update that takes ownership of
  # metadata.finalizers. Git does not declare it and must not: it belongs to the
  # controller's lifecycle, not to the desired state.
  #
  # Argo counted that finalizer as a difference, so this Application reported
  # OutOfSync while matching git exactly. 4 independent tests said identical —
  # `argocd app diff`, `kubectl diff`, a live-spec comparison and a hard refresh —
  # and the status disagreed with all 4. The managedFields ownership named the
  # cause: argocd-controller Apply owns f:spec, external-secrets Update owns
  # f:metadata.finalizers.
  #
  # This ignore is deliberately 1 pointer on 1 kind. A broader one would hide a
  # real drift as effectively as the noise did. See docs/debt-register.md D44.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/finalizers
