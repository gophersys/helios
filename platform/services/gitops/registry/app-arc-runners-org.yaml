# Org-wide runner scale set for gophersys — serves Eden, infrastructure, workspaces.
# dind so runners can build images AND run k3d/kind (Eden's gates). runs-on: arc-org
# Onboarding, consumers and the public-repo policy: docs/ci-runners.md
# NOTE: the Default runner group sets allows_public_repositories=false, so jobs from
# a PUBLIC org repo queue forever with no error. That is deliberate — this scale set
# is privileged (dind), so fork PRs would reach the node. See the doc before changing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-org
  namespace: argocd
spec:
  project: ci
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: arc-org
      values: |
        githubConfigUrl: https://github.com/gophersys
        githubConfigSecret: arc-github-app
        runnerScaleSetName: arc-org
        minRunners: 0
        maxRunners: 4
        # Argo renders helm without cluster access, so the chart can't auto-discover
        # the controller SA — set it explicitly.
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        containerMode:
          type: dind
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true      # self-heal the arc-runners ns on a from-scratch rebuild (it was hand-created)
