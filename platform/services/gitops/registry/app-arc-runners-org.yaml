# The general-purpose runner pool for gophersys — Eden, infrastructure, workspaces,
# hardware. linux/amd64, dind, so jobs can build images AND run k3d/kind (Eden's
# gates). runs-on: arc-org
#
# The runner container image IS the `cloud` dev image — ONE image for dev and CI,
# with the Actions runner folded in — so a job gets the same toolchain an
# interactive session gets. It replaced `base-runner` on every pool in one
# change; `arc-build`, `arc-org` and `arc-review` now share the ref, and
# base-runner has no consumer left. The interface — pools carry physical
# capability, images carry software capability — is docs/ci-substrate.md.
# Onboarding, consumers, sizing rationale and the public-repo policy:
# docs/ci-runners.md
#
# THE LABEL STAYS `arc-org` EVEN THOUGH THE POOL IS THE GENERAL ONE
# `runnerScaleSetName` IS the runs-on label, and a scale set has exactly one, so
# there is no aliasing. 17 workflow references across 5 repos point at arc-org,
# and a label that no pool answers makes a job queue forever with no error. The
# name is worse than `arc-base`; the rename is not worth that failure mode.
# Future pools are named for capability from the start (arc-zephyr, arc-usb).
#
# NOTE: the Default runner group sets allows_public_repositories=false, so jobs from
# a PUBLIC org repo queue forever with no error. That is deliberate — this scale set
# is privileged (dind), so fork PRs would reach the node. See the doc before changing.
#
# WHY THE POD SPEC IS WRITTEN OUT INSTEAD OF `containerMode: dind`
# `containerMode: dind` generates the pod spec and ignores nothing you add — it
# APPENDS. Supplying a container named `dind` under that mode renders a second
# container with the same name, which the API server rejects. The chart's own values
# say the same: "If any customization is required for dind, containerMode should
# remain empty, and configuration should be applied to the template." Resources,
# affinity and volume limits are all customization, so the full spec lives here.
# The spec below is the chart's documented dind spec verbatim, plus those three.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-org
  namespace: argocd
spec:
  project: ci
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: arc-org
      values: |
        githubConfigUrl: https://github.com/gophersys
        githubConfigSecret: arc-github-app
        runnerScaleSetName: arc-org
                # A warm runner. With minRunners 0 the pool has no floor, so a
                # single pod stuck in Terminating still counts toward
                # currentRunnerCount and the listener creates nothing: on
                # 2026-08-11 that starved every repository for 47 minutes behind
                # a zombie from an unrelated one. A floor of 1 means a stuck pod
                # cannot take the last slot, and it also removes pod creation
                # from the critical path of the common case.
        minRunners: 1
        maxRunners: 4
        # Argo renders helm without cluster access, so the chart can't auto-discover
        # the controller SA — set it explicitly.
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller

        template:
          spec:
            # One DNS pod serves this cluster, and the default resolver
            # posture multiplies every external lookup against it: ndots:5
            # walks ~5 search-domain suffixes, twice (A + AAAA), before
            # asking for `ghcr.io` verbatim — ~20 queries where 2 would do —
            # and glibc's attempts:2 gives up after a single retry. A build
            # wave plus warmer churn produced exactly that failure on
            # 2026-08-17 (run 32062015200: `lookup ghcr.io on 10.43.0.10:53:
            # read udp` timeout). These pods resolve EXTERNAL names only —
            # the API server arrives as an IP in env — so ndots:1 removes
            # the amplification outright, and attempts:4 at timeout:2 rides
            # out a busy DNS pod instead of failing a 40-minute build on one
            # lost UDP read.
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
                - name: timeout
                  value: "2"
                - name: attempts
                  value: "4"
            # The dind sidecar owns the Docker socket and chooses its gid, so the
            # runner must hold that gid to reach it. Granting it HERE and not in
            # the image is deliberate: the image-side attempt never held, because
            # a restored BuildKit layer reverted /etc/group while the build-time
            # assertion still passed. See docs/debt-register.md D31.
            # This value must equal DOCKER_GROUP_GID in the dind sidecar below.
            securityContext:
              supplementalGroups: [123]

            # k3s-cp-0/1/2 are the 38GB etcd control planes, and no taint keeps a pod
            # off them (docs/debt-register.md D45): a runner's image pulls land on the
            # disk etcd writes to. scripts/verify-warmer-pins.sh derives that set from
            # clusters/instances/homelab/nodes/*/identity.yaml and asserts it here.
            # k3s-w-4 was excluded here too while it owned the USB-passthrough
            # embedded lab. That lab is gone and the node returned to general
            # capacity on 2026-08-19, so this pool now schedules on it like any
            # other worker.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values: ["k3s-cp-0", "k3s-cp-1", "k3s-cp-2"]
              # Spread concurrent runners so four jobs do not pile onto one worker.
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          actions.github.com/scale-set-name: arc-org

            # The kubelet pulls these, so it caches them per node — the reason the
            # toolchain rides on the pod image instead of a workflow `container:`.
            # Credential: 20-ghcr-pull-externalsecret.yaml in this repo.
            imagePullSecrets:
              - name: ghcr-pull

            initContainers:
              # MUST be the same image as the runner container: it seeds
              # /home/runner/externals, and those externals are the runner's own
              # bundled Node. A mismatched pair silently ships the wrong Node to
              # every JavaScript action.
              - name: init-dind-externals
                image: ghcr.io/gophersys/cloud@sha256:9a150cbff74b67f67f69cca1b25a463103cbe8885ba0b7a0f777de42e7f7f7f1
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir

              # Native sidecar (restartPolicy: Always). This is where image builds
              # actually burn CPU, memory and disk — size it, not just the runner.
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                  # Same rule and same proven value as arc-runners-build: the
                  # bridge sits inside a 1450 pod interface and defaults to
                  # 1500, a silent path-MTU blackhole for peers that do not
                  # tolerate the mismatch. This pool runs the libs integration
                  # lanes — k3d inside dind, pulling images from inside the
                  # nested bridge — which is the same exposure one repo over.
                  - --mtu=1400
                env:
                  # The gid dockerd gives the socket. The RUNNER IMAGE must put its
                  # user in this group or every job that touches docker fails with
                  # "permission denied ... unix:///var/run/docker.sock" — and only
                  # once a job actually uses docker, long after the image builds.
                  # Mirrored as DOCKER_GROUP_GID in .devcontainer/runner/Dockerfile,
                  # which asserts membership at build time. Change both together.
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 8Gi   # image layers live in this container
                  limits:
                    # No CPU limit on purpose: CFS throttling makes builds slow and
                    # flaky, and the request already guarantees the share.
                    memory: 6Gi
                    ephemeral-storage: 30Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals

            containers:
              - name: runner
                # Pin by DIGEST, never `latest` and no longer by tag: a rebuild
                # must not change CI silently, and only a digest makes the ref
                # immutable. `.devcontainer` states the property the whole
                # toolchain rests on — the commit decides the image — and a tag
                # can be moved onto other bytes with no commit behind it. Read
                # the INDEX digest, never a per-platform one:
                #   docker buildx imagetools inspect ghcr.io/gophersys/cloud:latest \
                #     --format '{{.Manifest.Digest}}'
                #
                # Three preconditions before changing this ref, all learned the hard
                # way on 2026-08-10. Pinning a tag that did not exist yet put every
                # pod into Init:ImagePullBackOff and took org-wide CI down; the
                # build before this one also shipped a root-owned /home/runner,
                # which would have failed every runner at registration.
                #   1. docker manifest inspect ghcr.io/gophersys/cloud@<digest>
                #   2. the cloud smoke job passed for that build
                #   3. bash ctl.sh verify-runner-image cloud <sha> passed — it runs
                #      the image in THIS pod shape, with the dind sidecar, and is
                #      the only check that can see a broken Docker socket
                image: ghcr.io/gophersys/cloud@sha256:9a150cbff74b67f67f69cca1b25a463103cbe8885ba0b7a0f777de42e7f7f7f1
                command: ["/home/runner/run.sh"]
                # DECLARED, not inherited from the image. `cloud` ends `USER dev`
                # (uid 1000) where `base-runner` ended as root, and the mounted
                # buildkit key below is a root-owned 0400 file: uid 1000 cannot
                # open it, and nothing would fail until the first arm64 build.
                # The image also ships RUNNER_ALLOW_RUNASROOT=1, without which
                # run.sh refuses to start as root. scripts/verify-buildx-key.sh
                # asserts this line against the mount's mode.
                securityContext:
                  runAsUser: 0
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 6Gi
                    ephemeral-storage: 10Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  # The buildkitd client certificate. It is mounted into the
                  # RUNNER and not into dind: the buildx client that dials the
                  # mini over mTLS runs here.
                  - name: buildkit-client-certs
                    mountPath: /etc/buildkit-certs
                    readOnly: true

            volumes:
              - name: work
                emptyDir:
                  sizeLimit: 10Gi
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir:
                  sizeLimit: 2Gi
              # Native arm64 builds run on the Mac mini's buildkitd over mTLS.
              # Credential: 40-buildkit-client-certs-externalsecret.yaml in this
              # repo. The client reaches the BUILD API only — no Engine API, no
              # privileged step — which is what makes it tolerable on a pool that
              # every repository shares. Usage: docs/ci-substrate.md.
              - name: buildkit-client-certs
                secret:
                  secretName: buildkit-client-certs
                  # 0400, NOT 400. Kubernetes parses a manifest as YAML 1.1, so a
                  # leading zero means octal and this really is 0400. Written as
                  # `400` it would be decimal 400, which renders 0620 — group
                  # writable. key.pem is the client's mTLS key, so keep it
                  # owner-only.
                  # A secret volume is owned by uid 0, so owner-only is readable
                  # by uid 0 alone. The runner container DECLARES runAsUser: 0
                  # above. It used to rely on the IMAGE ending as root, which
                  # `cloud` does not — that premise was a comment, and it is a
                  # check now (scripts/verify-buildx-key.sh).
                  defaultMode: 0400
                  # ESO materialises this Secret asynchronously, and Argo may sync
                  # this pool before the Secret exists. `optional: true` lets a
                  # runner pod START without the cert instead of hanging in
                  # ContainerCreating. The cert is used only for arm64 mini builds
                  # (D42, not yet enabled), so an absent cert breaks nothing now;
                  # once D42 is on, a build that needs the cert fails LOUDLY at
                  # build time rather than the pod hanging silently.
                  optional: true
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true      # self-heal the arc-runners ns on a from-scratch rebuild (it was hand-created)
