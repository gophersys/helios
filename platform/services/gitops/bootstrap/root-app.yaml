# The app-of-apps ROOT — the single hand-applied Argo object.
# It syncs platform/services/gitops/registry/ (AppProjects + argocd-self + every
# app-*.yaml), so the tenancy structure and Argo's self-management live in git.
#
# Apply once by hand (cluster bootstrap only; it self-manages after):
#   kubectl apply -f platform/services/gitops/bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: argocd
  source:
    repoURL: https://github.com/gophersys/infrastructure.git
    targetRevision: main
    path: platform/services/gitops/registry
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false        # never auto-delete during bootstrap
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
