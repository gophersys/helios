# Homelab overrides: full self-contained stack, Grafana on a MetalLB LB.
#
# STORAGE — DECIDED 2026-08-19: `local-path`.
# Longhorn was uninstalled from the homelab on 2026-08-19
# (platform/core/storage/README.md), and `local-path` is now the only
# StorageClass on the cluster and the default. Until this change the 4 pins below
# read `longhorn`, which would have left 4 PVCs Pending forever with no error
# from helm. PR #196 left them that way on purpose and marked the decision
# pending, because node-local volumes are a different durability posture and that
# is Mateo's call rather than a side effect of removing a provisioner.
#
# The call is made. Loki, Tempo, Prometheus and Grafana run on `local-path`:
#
#   - Each PVC is a directory on ONE node. There is no replication. If that node
#     is lost, the data in it is lost.
#   - That is the ACCEPTED trade, stated: telemetry is re-derivable (metrics and
#     logs re-arrive within seconds of the pod restarting elsewhere) and none of
#     it is a system of record. Nothing here is worth 8 Longhorn controllers.
#   - `local-path` is WaitForFirstConsumer, so each PVC binds on the node the
#     pod first schedules to, and the pod is pinned to that node afterwards.
#     A node drain therefore strands the pod until the node returns; delete the
#     PVC to let it re-bind elsewhere and start empty.
#   - Sizes are unchanged from values.yaml (Loki 10Gi, Tempo 10Gi, Prometheus
#     20Gi, Grafana 5Gi). Retention is already bounded: 168h logs/traces, 15d
#     metrics.
#
# Reintroduce a replicated provisioner when a workload exists whose data cannot
# be re-fetched and cannot be pinned to a node. This stack is not that workload.
loki:
  singleBinary:
    persistence:
      storageClass: local-path

tempo:
  persistence:
    storageClassName: local-path

prometheus:
  server:
    persistentVolume:
      storageClass: local-path

grafana:
  persistence:
    storageClassName: local-path
  service:
    type: LoadBalancer
    # THE ADDRESS IS PINNED, not requested and hoped for. `10.168.0.241` is
    # written down as fact in 4 places — the Homepage Grafana card, this file,
    # docs/cluster-topology.md and platform/services/observability/README.md —
    # and before this pin nothing reserved it. MetalLB simply hands out the
    # lowest free address in `homelab-pool` (10.168.0.240-250, declared in
    # platform/core/edge/loadbalancer/metallb/pool.yaml). Grafana got .241 only
    # because ingress-nginx happened to take .240 first. Introduce a third
    # LoadBalancer Service before Grafana's, or rebuild in a different order,
    # and Grafana moves while every document keeps saying .241 — the same
    # "moved silently and no document noticed" failure contracts/exposure.yaml
    # exists for, one layer down.
    #
    # THE KEY IS `metallb.io/`, NOT `metallb.universe.tf/`. Both work on the
    # MetalLB running here (v0.16.1) — verified on the live cluster with two
    # throwaway Services, which were assigned exactly the addresses they asked
    # for. But the `universe.tf` form ALSO emits a warning Event:
    #   "Service uses deprecated annotation metallb.universe.tf/loadBalancerIPs"
    # A permanent warning on the Service is a warning nobody will read twice.
    # `spec.loadBalancerIP` is the third option and it is worse than both: the
    # field is deprecated in Kubernetes itself since 1.24.
    annotations:
      metallb.io/loadBalancerIPs: "10.168.0.241"

  # NO INGRESS AND NO HOSTNAME IN THIS INSTALL. Read this before turning it back
  # on, because the obvious reading of the situation is wrong.
  #
  # Grafana is an admin surface, same class as argocd. Until 2026-08-09 it was
  # PUBLIC through the Cloudflare tunnel with nothing in front of it but its own
  # login and an admin password that was generated and never vaulted. That
  # incident is why contracts/exposure.yaml exists at all.
  #
  # The dedicated `grafana` A record was deleted with the stack on 2026-08-09.
  # `grafana.mateosegura.com` therefore does NOT resolve to this cluster — and it
  # does not resolve to nothing either. `*.mateosegura.com` is a wildcard A record
  # to 144.24.23.2, the OCI cloud cluster's public IP (it is written down in
  # contracts/exposure.yaml under `prod_public`). Measured 2026-08-19:
  #
  #   dig +short grafana.mateosegura.com A   ->  144.24.23.2   (the wildcard)
  #   curl https://grafana.mateosegura.com/  ->  000           (nothing serves it)
  #
  # So an Ingress here would claim a hostname that publicly resolves to a
  # DIFFERENT cluster and can never receive a request, while cert-manager renewed
  # a real Let's Encrypt certificate for it every 60 days forever. Configuration
  # that does nothing and carries a false explanation is worse than none.
  #
  # Reach Grafana at the MetalLB LoadBalancer above — 10.168.0.241, plain HTTP,
  # tailnet only. No hostname is claimed, so contracts/exposure.yaml has nothing
  # to declare and `verify-exposure` stays honest.
  #
  # TO RESTORE THE HOSTNAME, in this order and not any other:
  #   1. Create an explicit A record grafana -> 10.168.0.240 in Cloudflare
  #      (DNS-only, NOT proxied). An explicit record beats the wildcard.
  #   2. Uncomment the ingress + grafana.ini blocks below.
  #   3. Add `grafana: { class: tailnet, cluster: homelab, why: ... }` to
  #      contracts/exposure.yaml in the SAME PR, so the gate that runs in CI
  #      starts enforcing it the moment it is true.
  # Doing 3 before 1 turns CI red for an action no PR in this repo can perform;
  # doing 1 or 2 without 3 recreates the exact hole this contract was built for.
  #
  # ingress:
  #   enabled: true
  #   ingressClassName: nginx
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-homelab
  #   hosts:
  #     - grafana.mateosegura.com
  #   tls:
  #     - hosts: [grafana.mateosegura.com]
  #       secretName: grafana-tls
  # grafana.ini:
  #   server:
  #     root_url: "https://grafana.mateosegura.com"
  #     domain: grafana.mateosegura.com
