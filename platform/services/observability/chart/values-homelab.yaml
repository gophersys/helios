# Homelab overrides: full self-contained stack, Grafana on a MetalLB LB.
#
# ⚠️ BROKEN AS WRITTEN — every `storageClass: longhorn` below names a
# StorageClass that DOES NOT EXIST. Longhorn was removed from the homelab on
# 2026-08-19 (platform/core/storage/README.md); `local-path` is the only class on
# the cluster. Installing this file today leaves 4 PVCs Pending forever, with no
# error from helm. Nothing is broken right now only because the `obs` release was
# itself removed on 2026-08-09 and Argo never managed this chart.
#
# NOT auto-fixed to `local-path`, deliberately: Loki, Tempo, Prometheus and
# Grafana on node-local volumes is a different durability posture, and that is
# Mateo's call to make when this stack is brought back — not a side effect of a
# storage removal. Decide it before the next `helm upgrade --install`.
loki:
  singleBinary:
    persistence:
      storageClass: longhorn

tempo:
  persistence:
    storageClassName: longhorn

prometheus:
  server:
    persistentVolume:
      storageClass: longhorn

grafana:
  persistence:
    storageClassName: longhorn
  service:
    type: LoadBalancer        # MetalLB hands out 10.168.0.240-250 (tailnet access)
  # TAILNET-ONLY as of 2026-08-09. Grafana is an admin surface — same class as
  # argocd — but it was public via the Cloudflare tunnel with nothing in front of
  # it but Grafana's own login, and an admin password that is generated at
  # creation and not vaulted. DNS now points at the MetalLB VIP instead of
  # Cloudflare, and the ingress carries a real cert like every other tailnet host.
  # Declared in contracts/exposure.yaml; enforced by scripts/verify-exposure.sh.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-homelab
    hosts:
      - grafana.mateosegura.com
    tls:
      - hosts: [grafana.mateosegura.com]
        secretName: grafana-tls
  grafana.ini:
    server:
      root_url: "https://grafana.mateosegura.com"
      domain: grafana.mateosegura.com
