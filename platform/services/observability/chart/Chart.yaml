apiVersion: v2
name: eden-observability
description: >-
  Replicable, self-contained observability stack for any Kubernetes cluster:
  Grafana Alloy (logs + traces + OTLP gateway for apps), Prometheus (metrics),
  Loki (logs), Tempo (traces), Grafana (dashboards + datasources). Drop-in for
  out-of-the-box k8s monitoring and an OpenTelemetry endpoint for applications.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: alloy
    alias: alloyGateway      # Deployment: OTLP receiver (4317/4318) -> Prom/Loki/Tempo
    version: 1.10.0
    repository: https://grafana.github.io/helm-charts
    condition: alloyGateway.enabled
  - name: alloy
    alias: alloyLogs         # DaemonSet: tails pod logs -> Loki
    version: 1.10.0
    repository: https://grafana.github.io/helm-charts
    condition: alloyLogs.enabled
  - name: loki
    version: 7.0.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: prometheus
    version: 29.12.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
