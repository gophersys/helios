# ESO webhook store that queries the bw-serve bridge. Cluster-scoped so any
# namespace's ExternalSecret can reference it.
#
# remoteRef.key = the Bitwarden item ID (or use a search endpoint). The jsonPath
# extracts the value; `.data.notes` matches how this repo stores most secrets
# (token/config in the item's notes). Verified/adjusted during activation.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vaultwarden
spec:
  provider:
    webhook:
      url: "http://bw-serve.external-secrets.svc.cluster.local:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.notes"
