# The bw-serve bridge is UNAUTHENTICATED and holds a fully-unlocked vault, so it
# must be network-isolated. k3s enforces NetworkPolicy (kube-router — verified
# empirically), so this default-deny + single allow is real, not advisory.
---
# Default-deny all ingress to the bridge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bw-serve-default-deny
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: bw-serve
  policyTypes:
    - Ingress
---
# Allow the ESO controllers to reach the bridge on 8087. The only other allow
# is bw-serve-allow-sync (bw-serve-sync.yaml), for the periodic sync CronJob.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bw-serve-allow-eso
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: bw-serve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - protocol: TCP
          port: 8087
