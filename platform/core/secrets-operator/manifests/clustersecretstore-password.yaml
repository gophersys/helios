# Isolated ESO webhook store for Vaultwarden login passwords.
#
# The default `vaultwarden` store returns item notes and backs every existing
# secret. Keep that contract unchanged; only consumers that deliberately store a
# complete secret in the login password may reference this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-password
spec:
  provider:
    webhook:
      url: "http://bw-serve.external-secrets.svc.cluster.local:8087/list/object/items?search={{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.data[0].login.password"
