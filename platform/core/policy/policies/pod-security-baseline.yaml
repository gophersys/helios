# Baseline Pod Security Standard — AUDIT mode (report-only, never blocks).
# Fields MATCH what Kyverno's webhook mutates the policy into (admission,
# emitWarning, skipBackgroundRequests, allowExistingViolations,
# validationFailureAction) so Argo sees zero drift.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
  annotations:
    policies.kyverno.io/title: "Baseline Pod Security (Audit)"
    policies.kyverno.io/category: "Pod Security Standards"
spec:
  admission: true
  background: true
  emitWarning: false
  failurePolicy: Ignore
  validationFailureAction: Audit
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds: [Pod]
      skipBackgroundRequests: true
      validate:
        failureAction: Audit
        allowExistingViolations: true
        podSecurity:
          level: baseline
          version: latest
