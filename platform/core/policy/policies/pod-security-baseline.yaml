# Baseline Pod Security Standard — AUDIT mode (report-only, never blocks).
# Fields match Kyverno's webhook-mutated spec (no Argo drift).
#
# Infrastructure namespaces that legitimately require elevated privileges
# (host namespaces / hostPath / capabilities) are EXCLUDED — same rationale as
# kube-system: storage (Longhorn), load-balancer (MetalLB), node metrics/log
# collection (observability), and the VPN egress app (media/Gluetun NET_ADMIN).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
  annotations:
    policies.kyverno.io/title: "Baseline Pod Security (Audit)"
    policies.kyverno.io/category: "Pod Security Standards"
spec:
  admission: true
  background: true
  emitWarning: false
  failurePolicy: Ignore
  validationFailureAction: Audit
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - longhorn-system
                - observability
                - metallb-system
                - media
      skipBackgroundRequests: true
      validate:
        failureAction: Audit
        allowExistingViolations: true
        podSecurity:
          level: baseline
          version: latest
