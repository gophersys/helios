# P1 feasibility scorecard for product "tracker".
# Contracts: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
#            precedence, catalog seam evidence bar, record spec) +
#            docs/sfd/40-p1-registry.yaml (the 16 metrics + 2 flags).
# Evidence base for agent+catalog metrics: catalog/ — THREE records at
# zephyr_sha 413b789deb391d3a37d06b463288a5fe765ee57e:
#   catalog/socs/esp32c6.yaml        depth D1
#   catalog/socs/mimxrt1052.yaml     depth D1
#   catalog/components/bosch,bme280.yaml  depth D2
schema: sfd.scorecard/v0
pir:
  ref: scratchpad/repro/run4/iJ/pir.yaml
  hash: sha256:c2cbf72e7932c0596615f14c590578d7c501750357565c50272e79f40f17c149

scores:
  # ── VIABILITY ───────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "pir.summary is one sentence naming both the what and the whom: 'a motorcycle gps tracker so that i know where my bike is at all times' (q.intent.what)."
      - "pir.users 'its just for me' fixes the user; no contradiction anywhere in the record."
      - "green = 'one sentence says what it does and for whom' — satisfied literally."

  - id: metric.viability.outcome
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "pir.targets.success names three checkable conditions: installed and running on the bike, notifications reaching the phone, location tracked in the cloud (q.intent.win)."
      - "Every condition follows directly from the stated functions (connectivity phone-nearby + far-away-anywhere, sensing position, storage backfill) — measurable and plausible for a working product."
      - "green = 'a measurable outcome a working product could plausibly reach'."

  - id: metric.viability.economics
    score: unknown
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent
    blocked_by: [pir.targets.unit_cost.sell]
    evidence:
      - "Build half answered: <= 100 USD per unit (components + pcb + assembly) at qty 10 (q.scale.cost). Volume answered: y1 = 2, y3 = 10 (q.scale.units)."
      - "Sell half NEVER ASKED — pair-completeness violated (pir.runner_errors re.3). The scale's for-sale limb needs `sell`, and its not-for-sale limb needs an EXPLICIT statement about the sale itself; conditional_fields forbids reading 'its just for me', y1 = 2 units or us-only as that statement. Neither limb is reachable."
      - "Blocked by an UNKNOWN answer, not by judgment — R5. The metric is core, so this stops the verdict (rule 2)."
      - "Named for the human, non-scoring: were the not-for-sale limb ever declared, the BOM class here (GNSS + cellular modem + IMU + Li-ion + enclosure) makes 100 USD at qty 10 tight-to-implausible; that judgment is NOT recorded as a score because the limb is not selected."

  - id: metric.viability.novelty
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "The founder concedes prior art outright: 'yes, others exist' (q.intent.exists)."
      - "The claimed difference — 'more powerful', 'cool technologies', 'accurate locations and alamr' — is comparative and unquantified against products he does not name; pir.novelty.moat is 'no compettiors' and pir.novelty.magic is 'not really'."
      - "amber = 'difference is incremental or unverified'. Not red: no named existing product is asserted to already BE this."

  # ── TECH-EXISTS (catalog seam) ──────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    blocked_by: []
    evidence:
      - "q.novel.magic = 'not really' — the founder claims NO unprecedented capability; the stated ambition is to use existing embedded tech (zephyr rtos) as a PoC."
      - "catalog HIT: sensing/altitude — catalog/components/bosch,bme280.yaml, depth D2 (binding + driver drivers/sensor/bosch/bme280, 19 exercised_by entries) @ zephyr 413b789d. Barometric pressure gives altitude. D2+ = green on availability for THIS capability."
      - "catalog HIT (D1 only): connectivity/phone-nearby — catalog/socs/esp32c6.yaml declares `espressif,esp32-bt-hci`, depth D1 @ zephyr 413b789d. Per the catalog seam, D1 coverage is AMBER, not green (declared != supported)."
      - "catalog HIT (D1 only): compute/storage/power — esp32c6 declares soc-nv-flash + fixed-partitions and carries power_states standby (200 us / 60 us) and soft-off (2000 us / 212 us); mimxrt1052 (D1) carries runtime-idle and suspend-to-idle. Both SoC records are D1."
      - "catalog GAP: sensing/position (GNSS). Zero records of a GNSS class in catalog/ — the catalog holds exactly three records. NAMED EXAMPLE (evidence bar): Zephyr's upstream GNSS subsystem (drivers/gnss, NMEA-generic and u-blox M8/M10 drivers) and the shipped aftermarket motorcycle-tracker product class (Monimoto, Invoxia). Named example + zero catalog coverage = amber with a research task."
      - "catalog GAP: connectivity/far-away-anywhere (cellular WAN, a HARD constraint). Zero records. NAMED EXAMPLE: Zephyr's upstream `modem_cellular` driver and `zephyr,modem-cellular` binding (Quectel BG95/EG25-G, u-blox SARA class). Amber with a research task."
      - "catalog GAP: sensing/tilt (IMU/accelerometer). bosch,bme280 is pressure/temperature/humidity ONLY — it is not an IMU. NAMED EXAMPLE: Zephyr's upstream Bosch BMI270 / ST LIS2DH sensor drivers. Amber with a research task."
      - "HONESTY BOUND: the three named upstream examples are named from scorer knowledge and are NOT catalog records; none is verified against the pinned tree here. That verification IS the research task, not a claim of coverage."
      - "amber = 'a path exists but unproven here (catalog D1, or driver-work flagged)'. Not green: no needed capability is covered at D2+ except altitude. Not red: every core capability has a nameable working example."
    research_tasks:
      - "Extract a GNSS component record (drivers/gnss + a concrete receiver compatible) from ws/zephyr @ 413b789deb391d3a37d06b463288a5fe765ee57e and rate its depth."
      - "Extract a cellular-modem component record (`zephyr,modem-cellular`) @ the same SHA; the supported-SoC lanes A/B contain NO cellular part, so this also opens a lane question for P2/P4."
      - "Extract an IMU/accelerometer component record @ the same SHA for the tilt/motion sense."

  # ── FEASIBILITY ─────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "pir.environment.where = `vehicle`; pir.environment.conditions = [water, dust, heat, cold, vibration, washing-or-hosing] (q.env.where, q.env.conditions)."
      - "The amber scale names two of these EXPLICITLY: `washing-or-hosing` and `vibration`. Both are present, so amber binds by the scale's own text."
      - "Known art: potted/sealed IP-rated enclosure, conformal coating, vibration-rated mounting — costed, not novel. Not red: the conditions demand no engineering without a path."
      - "Carried, non-scoring: pir.environment.limits is UNKNOWN (q.followup.range asked 'how hot / how cold', not answered). The metric's fed_by is q.env.where + q.env.conditions ONLY (R2), so the UNKNOWN does not blank this score — but a stated -20 C / +85 C class would tighten the battery and enclosure budget."
      - "Interaction for the human: concealed vehicle mounting (pir.physical.carry = mounted, hidden) plus GNSS + cellular + BLE antennas is the founder's own named fear — see metric.risk.self-assessed."

  - id: metric.feasibility.connectivity
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    blocked_by: []
    evidence:
      - "q.fn.talks = [phone-nearby, far-away-anywhere] — two counterparts at two distances; `cellular` is recorded as a HARD constraint (pir.constraints)."
      - "phone-nearby: the derived short link is BLE. catalog/socs/esp32c6.yaml declares `espressif,esp32-bt-hci` at depth D1 @ zephyr 413b789d. The seam is explicit in the scale: 'D1-only coverage is amber, per the catalog seam'."
      - "far-away-anywhere: NO catalog coverage. Neither supported-SoC lane carries a cellular modem — esp32c6's radio compatibles are `espressif,esp32-wifi`, `espressif,esp32-bt-hci`, `espressif,esp32-ieee802154`; mimxrt1052 declares NO radio compatible at all (its wired links are nxp,enet / nxp,flexcan). The link therefore sits OUTSIDE the current lanes."
      - "NAMED EXAMPLE for the WAN limb (evidence bar): Zephyr's upstream `modem_cellular` driver / `zephyr,modem-cellular` binding (Quectel, u-blox) plus the shipped aftermarket motorcycle-tracker product class. Named example + zero catalog coverage = amber, never red."
      - "amber = 'achievable but outside current lanes, or coverage only at D1 with risk'. BOTH limbs land amber, by different clauses of the same line."
      - "Not red: a radio does reach the stated counterpart at the stated distance and power — cellular WAN on a PC1 rechargeable pack is ordinary art; the cost is the power budget, which metric.feasibility.power-risk carries."
    research_tasks:
      - "Extract a cellular-modem record and decide the lane: the P2/P4 supported-SoC set has no cellular part, so this is a lane extension, not a part pick."
      - "Promote esp32c6 BLE coverage from D1 to D2+ (or record the chosen host+modem pair) before any green is available here."

  - id: metric.feasibility.power-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    blocked_by: []
    derivation_applied: "BINDING TARGET = the floor when declared, else the delight target. pir.targets.battery_life.floor is none-declared ('no lowest threshold... batter y life in the hours') — per the registry's derivation a none-declared floor never makes green vacuous, so evaluation falls through to the DELIGHT target = 1 month+ on battery."
    evidence:
      - "power_class = PC1 (derived: q.power.source = charges-on-dock-or-cable, 'battery powered ideally, but easily rechargeable... over a usb c connection')."
      - "modes = [wakes-on-event, wakes-on-schedule, only-when-used]; `always-on` was NOT selected — the duty policy is already the low-power one."
      - "Binding target 1 month+ must cover: GNSS fixes hourly parked and every 30 s while moving, a cellular uplink, and a seconds-latency tilt alert path. That is reachable only with aggressive sleep design (GNSS duty-cycled/AGNSS, modem PSM/eDRX, motion-gated wake) — amber's exact words: 'delight target requires aggressive sleep design; floor reachable'."
      - "Floor is reachable trivially: the founder declares no lowest threshold and accepts 'batter y life in the hours' for a racing use — so amber's second clause holds."
      - "Not red: red requires the binding target to VIOLATE the power class physically. PC1 is rechargeable and the enclosure bound is `phone`/deck-of-cards, which admits a multi-Ah Li-ion pack; 1 month at these duty rates is hard, not impossible. The registry's red example (always-on radio on a coin cell) is not this."
      - "Not green: green requires the target 'comfortably plausible'; a GNSS + cellular tracker at 1 month is not comfortable at any power class below mains."
      - "Carried for the human: the `usb-c` hard constraint plus the volunteered on-bike charger from the motorcycle battery would shift the effective class toward PC2 while riding — that is an integration option, not a recorded answer, and it does not move this score."

  - id: metric.feasibility.head-start
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "pir.assets = ['nothing'] (q.time.exists) — no sketches, no model, no prototype, no code, no app, no factory contact, no funding."
      - "pir.timeline.proto = none-declared ('no rush we are just testing out the system, correctness over speed') and pir.timeline.production = none-declared ('no deadline')."
      - "amber's second clause is exactly this case: 'nothing exists but the timeline carries no pressure'. Red requires 'nothing — AND the timeline assumes otherwise', which is false here."

  # ── RISK ────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    blocked_by: []
    evidence:
      - "Both feeds are none-declared: q.time.proto 'no rush... can optimize later', q.time.prod 'no deadline'. Stated as such, per the scale's own instruction."
      - "green = '... or no dates declared (none-declared: no schedule risk asserted, stated as such in evidence)'. No date exists to precede a lead time, so neither amber nor red can be reached."
      - "This is NOT an UNKNOWN: convention `declared-none` makes an explicit 'no deadline' an ANSWER."

  - id: metric.risk.self-assessed
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "pir.novelty.hard = 'antenna placement, multipel protocols, pjone connecton and poower' (q.novel.hard)."
      - "The fear is PLACED RIGHT: three radios (GNSS receive, cellular transmit, BLE) inside a deliberately concealed, metal-adjacent vehicle mount is the genuine hard part, and it is the same physics that threatens the 1-month power target."
      - "But no plan exists: pir.assets = ['nothing'], no antenna study, no reference design, no prototype. amber = 'the fear is real but unplanned-for'."
      - "Not green: green requires a plan. Not red: the feared part IS the hard part."

  - id: metric.risk.safety
    score: green
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate_when: serious
    blocked_by: []
    evidence:
      - "q.comp.safety = `none` ('no, just hopefully not explode lol') -> green, 'no plausible harm path'. The enum value is what the derived score reads."
      - "NO HUMAN GATE RAISED: human_gate_when is `serious`; the answer is `none`. F5 does not fire."
      - "Hazard forwarded to the G1 human, non-scoring (per the accepted residual 'verbal hedges on enum answers cannot move a derived score'): the founder's own hedge 'hopefully not explode' is about a Li-ion pack permanently installed on a vehicle, in vibration and heat. If the human judges that `minor` or `serious`, THIS score and possibly the verdict change — the answer, not the score, is what would have to move."

  - id: metric.risk.privacy
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    blocked_by: []
    evidence:
      - "pir.compliance.personal_data = [location] (q.comp.data, 'yes, whatver info it has about location bascially')."
      - "amber = 'personal data with known regimes (location, voice)' — location is named in the scale itself."
      - "Not red: no health or identity data is collected. Not green: green requires NO personal data."
      - "Context, non-scoring: pir.compliance.regions = [us] -> certifications [fcc]; single-user deployment ('its just for me') narrows exposure but does not change the data class."

  # ── PLATFORM (consumer P2-class — never bears on the P1 verdict) ────
  - id: metric.platform.edge-autonomy
    score: amber
    consumer: P2-class
    scored_by: agent
    blocked_by: []
    absent_when_holds: false     # q.fn.talks != nothing, so the feed is OPEN
    evidence:
      - "q.fn.offline = 'no alerts but yes everything else' — the device keeps sensing, logging and buffering with no internet and backfills later (q.fn.stores: 'save things if no location, then backtrack to the cloud')."
      - "amber = 'degrades offline in acceptable ways': the loss is real (alerting is the anti-theft value of a tracker) but the founder declared it acceptable himself."
      - "Not green: green is 'fine offline (or offline-first)', and the primary user-facing behaviour — the theft alert — does not survive the outage. Not red: the product is not dead without the cloud; local logging continues."

  - id: metric.platform.hmi-class
    score: green
    consumer: P2-class
    scored_by: derived
    blocked_by: []
    evidence:
      - "q.fn.shows = `a-light` ('no screen, maybe a multicolo led to signal states'); q.phys.controls = `one-button` ('1 button and 1 led/led ring')."
      - "green = 'none/LED/sound — lane B territory'. Both feeds sit inside that band; no screen and not many controls, so the amber boundary case is not reached."

  - id: metric.platform.compute-demand
    score: green
    consumer: P2-class
    scored_by: derived
    blocked_by: []
    absent_when_holds: false     # q.fn.rate DID spawn (twice: position, tilt/motion)
    derivation_applied: "green when every stated rate period >= 1 s and no continuous stream processing."
    evidence:
      - "Stated periods, position: 1 h parked, 30 s moving, configurable by power preference (q.fn.rate, spawned for position). Stated period, tilt/motion: 'within seconds' (q.fn.rate, spawned for tilt/motion)."
      - "Every stated period is >= 1 s. No vision, no audio, no continuous stream: the heaviest load is NMEA parsing plus an IMU wake threshold."
      - "green = 'low-rate sense/act (all rate periods >= 1 s) — any lane'."
      - "Named hedge, non-scoring: 'if an alert it must be as quick as possible' states a LATENCY ambition, not a rate period, and the derivation keys on stated periods. An interrupt-driven IMU wake meets it without a sub-second loop; if P2 later reads it as a hard real-time bound, this metric moves to amber."

# ── derived flags (consumer P2) — F3 applies to them too ──────────────
derived:
  needs_hardware: true
  needs_firmware: true
derived_evidence:
  needs_hardware:
    - "Rule: 'any sensing, actuation, on-device HMI, or physical function in pir.functions'."
    - "SATISFIED three times over: 4 sensing items (position, altitude, speed/velocity, tilt/motion), 1 on-device HMI item (a-light multicolour LED), and a physical form (pir.physical.size_class = phone, carry = mounted, controls = one-button)."
    - "Actuation is empty by design (q.fn.acts = 'it does not do anything to the bike') and is not needed for the flag."
  needs_firmware:
    - "Rule: 'needs_hardware AND any on-device logic (always true when needs_hardware, unless purely passive/analog)'."
    - "needs_hardware is true, and the device is emphatically not passive/analog: pir.functions carries a compute item (edge autonomy — 'no alerts but yes everything else'), a storage item with store-and-forward backfill, configurable sampling rates, and a three-mode duty policy [wakes-on-event, wakes-on-schedule, only-when-used]."

# ── F5 ────────────────────────────────────────────────────────────────
human_gates: []                  # q.comp.safety = `none`; no gate raised

# ── F4 — the machine recommends; the human decides G1 ─────────────────
recommendation:
  verdict: blocked
  rule_applied: "rule 2 — a core metric is `unknown` (metric.viability.economics); evaluation stops there. Rule 1 was tested first and did not fire: human_gates is empty because q.comp.safety = `none`."
  blockers:
    - metric: metric.viability.economics
      score: unknown
      blocked_by: pir.targets.unit_cost.sell
      answered_by: "the sell half of q.scale.cost ('what price sells it?') — never asked (runner error re.3). Either a stated sell price, or an EXPLICIT statement about the sale itself ('not for sale'), unblocks it; conditional_fields rules out inferring the latter from 'its just for me', from y1 = 2 units, or from us-only."
  reasons:
    # reasons[0] carries the G0 state — a PIR that failed G0 is still
    # scoreable, and its state is never hidden.
    - "G0 STATE: BLOCKED. One G0 blocker, separate from the verdict blocker above — pir.constraints[zephyr-rtos].strength is UNKNOWN: `zephyr-rtos` is a volunteered operating system, included by the constraint oracle, and the required-tier ask-back q.constraint.strength was never spawned (runner error re.2). Until it is classified hard-or-preference, the P4 fit matrix cannot be filtered."
    - "WHAT RULE 3 WOULD HAVE SAID: no core metric is red. metric.tech.exists = amber, metric.feasibility.connectivity = amber, metric.feasibility.power-risk = amber, metric.risk.safety = green; metric.viability.economics is the unknown above. Neither pivot nor kill is indicated on the evidence available — and the kill condition specifically cannot hold, since q.novel.magic = 'not really' means the product states no magic for metric.tech.exists to be red about."
    - "WHAT RULE 4 WOULD HAVE SAID (ambers, verdict-bearing): metric.tech.exists amber — GNSS, cellular and IMU have ZERO catalog coverage; only altitude (bosch,bme280, D2) is covered above the D1 ceiling."
    - "amber: metric.feasibility.connectivity — BLE is D1-only on esp32c6 and the cellular WAN limb is outside BOTH supported-SoC lanes; neither lane part carries a modem."
    - "amber: metric.feasibility.power-risk — the binding target is the DELIGHT target (1 month+), because the floor is none-declared; GNSS + cellular at that life needs aggressive sleep design."
    - "amber: metric.feasibility.env-risk — `vibration` and `washing-or-hosing` on a concealed vehicle mount; known art, costed."
    - "amber: metric.viability.novelty — prior art conceded, the difference unquantified."
    - "amber: metric.feasibility.head-start — nothing exists, but no date pushes on it."
    - "amber: metric.risk.self-assessed — the antenna/multi-protocol/power fear is correctly placed and has no plan."
    - "amber: metric.risk.privacy — location data, us/FCC only."
    - "MINOR-METRIC UNKNOWNS: none. metric.viability.economics is the only unknown score and it is core."
    - "NON-VERDICT-BEARING (P2-class, appended per rule 4): metric.platform.edge-autonomy amber — alerts die with the link, which is the product's point; P2 must weigh it. metric.platform.hmi-class green and metric.platform.compute-demand green both point at lane B / a low-power MCU."
    - "CARRIED HAZARD, non-scoring: the founder's 'hopefully not explode lol' hedge against q.comp.safety = `none`, on a vehicle-mounted Li-ion pack in heat and vibration. The G1 human should confirm the `none` answer rather than the green score."
    - "OPEN UNKNOWN, non-blocking: pir.environment.limits (how hot / how cold) — asked and unanswered; it feeds no metric, so it blocks nothing, but it bounds the battery chemistry and the enclosure."

# ── F4 — the human's call. EMPTY until G1. ────────────────────────────
decision:
  verdict:
  by:
  quote:
  at:
