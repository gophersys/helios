  pir.users:
    - {question: q.intent.who, quote: 'its just for me', at: '2026-08-26'}
  pir.functions:
    - {question: q.fn.senses, quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that', at: '2026-08-26'}
    - {question: q.fn.acts, quote: 'it does not do anything to the bike', at: '2026-08-26', note: 'negative-function: satisfies the feed, produces no item'}
    - {question: q.fn.talks, quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that', at: '2026-08-26'}
    - {question: q.fn.offline, quote: 'no alerts but yes everything else', at: '2026-08-26'}
    - {question: q.fn.shows, quote: 'no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too', at: '2026-08-26'}
    - {question: q.fn.stores, quote: 'yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud', at: '2026-08-26'}
    - {question: q.fn.rate, quote: 'parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces', at: '2026-08-26', note: 'spawned for: position; attached as rate on the position item'}
    - {question: q.fn.rate, quote: 'within seconds, if an alert it must be as quick as possible', at: '2026-08-26', note: 'spawned for: tilt/motion; attached as rate on the tilt item'}
    - {source: derived, rule: capability.security}
