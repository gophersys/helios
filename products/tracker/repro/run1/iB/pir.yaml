gate_status:               # G0 evaluated against 30-p0-interrogation.md, recorded not asserted
  reachable_required_answered: true    # all 13 fixed required questions incl. both conditionals (q.fn.offline, q.power.life) answered
  spawned_required_adaptive_answered: false
  consistency: green       # c.app-needs-link cannot fire: q.fn.talks != nothing and q.phys.controls == one-button
  g0: red
  reasons:
    - "q.constraint.strength (tier: required) was never spawned for two volunteered technologies present verbatim in the transcript — `gps` (q.intent.what) and `zephyr rtos` (q.novel.magic). The contract: 'an unclassified volunteered technology blocks G0'. This is a RUNNER gap, not a founder gap."
