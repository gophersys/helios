# Product Intent Record — extracted from the frozen interrogation transcript.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5, PIR v0) + docs/sfd/30-p0-graph.yaml.
# Every value carries question id + verbatim words + timestamp (R4). The transcript
# carries only a file-level date (2026-08-26); no per-answer clock time exists, so `at`
# is date-only ISO-8601 everywhere. Inventing a clock time would be inventing evidence.
schema: sfd.pir/v0
product: tracker
source:
  transcript: /private/tmp/claude-501/-Users-mateo-code-research-embedded/071a7bd3-8c48-482e-a1db-7e333748e40f/scratchpad/repro/transcript.yaml
  graph: docs/sfd/30-p0-graph.yaml
  graph_schema: sfd.interrogation/v0
  extracted: "2026-08-26"

summary: "A GPS/GNSS tracker installed on the owner's motorcycle that keeps his bike's location known at all times, alerts his phone, and logs location to the cloud."
users: "The builder himself — a single owner-operator of one motorcycle; later up to ~10 units for friends. He meets it installed and hidden on the bike, and through notifications on his phone."

functions:
  # ── sensing (q.fn.senses; rates from the two q.fn.rate spawns, inline) ──
  - capability: sensing
    detail: "position — accurate location fix"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      value: "1 fix/hour parked; 1 fix/30 s moving; rate must be runtime-configurable by software against a power preference"
      question: q.fn.rate
      spawned_for: position
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"
  - capability: sensing
    detail: "altitude"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    # no q.fn.rate spawn for this sense — unspawned adaptive is N/A, not UNKNOWN
  - capability: sensing
    detail: "speed / velocity"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
  - capability: sensing
    detail: "tilt / motion — the theft-alert trigger"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      value: "reaction within seconds; on an alert, as fast as possible"
      question: q.fn.rate
      spawned_for: tilt/motion
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"

  # ── connectivity (q.fn.talks — see UNDERDETERMINED note in unknowns/notes:
  #    the answer names TWO counterparts though the question type is single-enum) ──
  - capability: connectivity
    detail: "far-away-anywhere — location known from anywhere over a wide-area link, and cloud logging of that location (user volunteered `cellular`; recorded in constraints, never derived — R3)"
    enum_value: far-away-anywhere
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  - capability: connectivity
    detail: "phone-nearby — the owner's phone connects easily to the device at close range"
    enum_value: phone-nearby
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  - capability: connectivity
    detail: "degraded mode with no internet: alert DELIVERY stops; every other function continues"
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  # ── storage ──
  - capability: storage
    detail: "retain state across power loss; buffer readings while there is no location fix or no link, and backfill them to the cloud when the link returns"
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  # ── hmi (q.fn.shows = a-light; the button is named in the same verbatim answer) ──
  - capability: hmi
    detail: "one multicolour LED / LED ring signalling device state — no screen"
    enum_value: a-light
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"
  - capability: hmi
    detail: "one multipurpose button"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  # ── compute (coverage table: compute arrives via the adaptive q.fn.rate) ──
  - capability: compute
    detail: "duty-cycled fix-and-report loop (30 s moving / 1 h parked) plus a seconds-latency motion-alert path, with a runtime-configurable rate policy driven by power preference"
    provenance:
      - {question: q.fn.rate, quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces", at: "2026-08-26"}
      - {question: q.fn.rate, quote: "within seconds, if an alert it must be as quick as possible", at: "2026-08-26"}

  # ── DERIVED capability words (graph derivations.capability.*, never asked — R3).
  #    PIR v0 has no `pir.capabilities` field, so the derived words are recorded here,
  #    where S1's function map reads them, flagged `derived: true`. ──
  - capability: power
    detail: "power capability = PC1 (rechargeable) + modes {wakes-on-event, wakes-on-schedule, only-when-used}"
    derived: true
    rule: "derivations.capability.power — power capability = pir.power_class + pir.modes (always present)"
    provenance:
      - {question: q.power.source, quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection", at: "2026-08-26"}
      - {question: q.power.duty, quote: "wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs", at: "2026-08-26"}
  - capability: security
    detail: "baseline security — the device talks to a wide-area counterpart AND collects personal location data"
    derived: true
    rule: "derivations.capability.security — fires when q.fn.talks != nothing OR q.comp.data != none (BOTH conditions hold here)"
    provenance:
      - {question: q.fn.talks, quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that", at: "2026-08-26"}
      - {question: q.comp.data, quote: "yes, whatver info it has about location bascially", at: "2026-08-26"}
  - capability: time
    detail: "timekeeping — scheduled wakes require a maintained clock"
    derived: true
    rule: "derivations.capability.time — fires when q.power.duty == wakes-on-schedule (one of the three modes stated)"
    provenance:
      - {question: q.power.duty, quote: "wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs", at: "2026-08-26"}
  # NOTE: no `actuation` item exists — q.fn.acts was answered NEGATIVELY
  # ("it does not do anything to the bike"). That answer is recorded in
  # provenance.pir.functions; a "none" answer is not a function.

