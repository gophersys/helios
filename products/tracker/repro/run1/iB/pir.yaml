  battery_life:            # CONDITIONAL field: present because power_class is PC1
    delight: {value: 1, unit: month, comparator: ">=", raw: "1 month +"}
    floor:
      declared: none       # the founder explicitly declared NO floor — this is an ANSWER, not an UNKNOWN
      raw: "no lowest threshold; hours are acceptable in a high-performance/racing tracker mode"
  unit_cost:
