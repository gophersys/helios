# Product Intent Record — extracted from the frozen interrogation transcript.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5, PIR v0) + docs/sfd/30-p0-graph.yaml.
# Every value carries its question id, the founder's VERBATIM words (typos kept,
# R4) and a timestamp. The transcript carries no per-answer times; its header
# fixes the date 2026-08-26, so `at` is date-granular — the finest granularity
# the frozen input actually supplies. No time is invented.
schema: sfd.pir/v0
product: tracker
source: repro/transcript.yaml

summary: 'a motorcycle gps tracker so that i know where my bike is at all times'

users: 'its just for me'

# ── functions — S1's CLOSED vocabulary, provenance PER ITEM (R4) ────────
# connectivity - sensing - actuation - storage - compute - hmi - power -
# security - time. All nine words are present: five asked, compute via the
# adaptive q.fn.rate + q.fn.offline, power/security/time DERIVED (R3).
functions:
  - capability: sensing
    detail: position-accurate
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: '2026-08-26'
    rate:
      value: 'parked 1 per hour; moving 1 per 30 s; software-configurable against power preference'
      question: q.fn.rate
      spawned_for: position
      quote: 'parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces'
      at: '2026-08-26'

  - capability: sensing
    detail: altitude
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: '2026-08-26'

  - capability: sensing
    detail: speed-and-velocity
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: '2026-08-26'

  - capability: sensing
    detail: tilt-and-motion
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: '2026-08-26'
    rate:
      value: 'reaction within seconds; alert path as fast as possible'
      question: q.fn.rate
      spawned_for: tilt/motion
      quote: 'within seconds, if an alert it must be as quick as possible'
      at: '2026-08-26'

  - capability: actuation
    detail: none
    question: q.fn.acts
    quote: 'it does not do anything to the bike'
    at: '2026-08-26'

  - capability: connectivity
    detail: far-away-anywhere
    question: q.fn.talks
    quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
    at: '2026-08-26'

  - capability: connectivity
    detail: phone-nearby
    question: q.fn.talks
    quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
    at: '2026-08-26'

  - capability: compute
    detail: offline-autonomy — every function except alerting continues with no internet
    question: q.fn.offline
    quote: 'no alerts but yes everything else'
    at: '2026-08-26'

  - capability: hmi
    detail: a-light — multicolour LED / LED ring signalling device state
    question: q.fn.shows
    quote: 'no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too'
    at: '2026-08-26'

  - capability: hmi
    detail: one-button — single multipurpose button
    question: q.phys.controls
    quote: '1 button and 1 led/led ring, something clean that will lookj high end'
    at: '2026-08-26'

  - capability: storage
    detail: non-volatile log of fixes when the link is down, backfilled to the cloud on reconnect
    question: q.fn.stores
    quote: 'yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud'
    at: '2026-08-26'

  - capability: security
    detail: baseline security capability
    derived_from: derivations.capability.security
    rule: 'baseline security capability whenever q.fn.talks != nothing OR q.comp.data != none'
    basis:
      - question: q.fn.talks
        quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
        at: '2026-08-26'
      - question: q.comp.data
        quote: 'yes, whatver info it has about location bascially'
        at: '2026-08-26'

  - capability: time
    detail: timekeeping capability
    derived_from: derivations.capability.time
    rule: 'timekeeping capability whenever q.power.duty == wakes-on-schedule'
    basis:
      - question: q.power.duty
        quote: 'wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs'
        at: '2026-08-26'

  - capability: power
    detail: 'PC1 + modes [wakes-on-event, wakes-on-schedule, only-when-used]'
    derived_from: derivations.capability.power
    rule: 'power capability = pir.power_class + pir.modes (always present)'
    basis:
      - question: q.power.source
        quote: 'battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection'
        at: '2026-08-26'
      - question: q.power.duty
        quote: 'wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs'
        at: '2026-08-26'

# ── environment ────────────────────────────────────────────────────────
environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  limits: UNKNOWN          # q.followup.range spawned by q.env.conditions, asked, unanswered (R5)
  on_body: 'no'

# ── power ──────────────────────────────────────────────────────────────
power_class: PC1           # DERIVED: q.power.source = charges-on-dock-or-cable -> PC1
modes: [wakes-on-event, wakes-on-schedule, only-when-used]

# ── targets ────────────────────────────────────────────────────────────
targets:
  success: 'it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud'
  battery_life:            # PRESENT: conditional field, power_class PC1 in [PC0, PC1]
    delight: {value: 1, unit: month, bound: at-least}
    floor:   {value: null, unit: hours, bound: none-declared}
  unit_cost:
    build: {value: 100, currency: USD, bound: at-most, at_quantity: 10, covers: 'components + pcb + assembly'}
    sell: UNKNOWN          # q.scale.cost answered for the build half only (R5)
  volume: {y1: 2, y3: 10}

# ── physical ───────────────────────────────────────────────────────────
physical:
  size_class: phone        # the ceiling the ask requests ("at most"); deck-of-cards stated as acceptable
  dims: {}                 # q.followup.range never spawned for q.phys.size — N/A, not UNKNOWN
  carry: mounted
  controls: one-button

# ── timeline ───────────────────────────────────────────────────────────
# Both dates were ANSWERED, and the answer is that no date exists. That is
# data, not an UNKNOWN: the founder is not missing the information.
timeline:
  proto: none-declared
  production: none-declared

assets: [nothing]

novelty:
  different: 'yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that'
  hard: 'antenna placement, multipel protocols, pjone connecton and poower'
  magic: 'not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building'
  moat: 'no compettiors'

compliance:
  regions: [us]
  safety: 'none'
  personal_data: [location]
  certifications: [fcc]    # DERIVED: q.comp.region us -> fcc

# ── constraints channel — volunteered technology, never a derivation (R3) ──
constraints:
  - tech: cellular
    strength: hard
    volunteered_in:
      question: q.fn.talks
      quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
      at: '2026-08-26'
    classified_by:
      question: q.constraint.strength
      quote: 'requiemrnt'
      at: '2026-08-26'

  - tech: usb-c
    strength: hard
    volunteered_in:
      question: q.power.source
      quote: 'battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection'
      at: '2026-08-26'
    classified_by:
      question: q.constraint.strength
      quote: 'requirement'
      at: '2026-08-26'

  - tech: gps
    strength: UNKNOWN      # volunteered, NEVER classified — q.constraint.strength is tier required
    volunteered_in:
      question: q.intent.what
      quote: 'a motorcycle gps tracker so that i know where my bike is at all times'
      at: '2026-08-26'
    classified_by: null

  - tech: zephyr-rtos
    strength: UNKNOWN      # volunteered, NEVER classified — q.constraint.strength is tier required
    volunteered_in:
      question: q.novel.magic
      quote: 'not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building'
      at: '2026-08-26'
    classified_by: null

# ── UNKNOWNs — first class (R5). `blocks` = the P1 metrics fed by the
# question that would have filled the field. Empty means the question feeds
# no metric, not that the gap is harmless.
unknowns:
  - field: pir.targets.unit_cost
    part: sell
    question: q.scale.cost
    why: 'the ask has two halves; only the build half was answered — no sell price was ever stated'
    blocks: [metric.viability.economics]

  - field: pir.environment.limits
    question: q.followup.range
    why: 'spawned by q.env.conditions (how hot / how cold) — asked, not answered'
    blocks: []

  - field: pir.constraints
    part: 'strength[gps]'
    question: q.constraint.strength
    why: 'volunteered technology never put through the required ask-back — G0 hard block'
    blocks: []

  - field: pir.constraints
    part: 'strength[zephyr-rtos]'
    question: q.constraint.strength
    why: 'volunteered technology never put through the required ask-back — G0 hard block'
    blocks: []

# ── G0 status, stated exactly ──────────────────────────────────────────
# Not a pass. Reported, never papered over.
g0:
  status: red
  reasons:
    - 'required adaptive q.constraint.strength unanswered for volunteered technology `gps` (from q.intent.what)'
    - 'required adaptive q.constraint.strength unanswered for volunteered technology `zephyr-rtos` (from q.novel.magic)'
  consistency: green     # c.app-needs-link: q.fn.talks != nothing, q.phys.controls != only-an-app
  required_answered:
    - q.intent.what
    - q.intent.who
    - q.fn.senses
    - q.fn.acts
    - q.fn.talks
    - q.fn.offline       # reachable: opened by q.fn.talks
    - q.fn.shows
    - q.fn.stores
    - q.power.source
    - q.power.life       # reachable: opened by q.power.source
    - q.power.duty
    - q.comp.safety
    - q.comp.data

