schema: sfd.pir/v0
product: tracker
source:
  transcript: repro/transcript.yaml
  graph: docs/sfd/30-p0-graph.yaml
  interrogated: "2026-08-26"

summary: >-
  A motorcycle GPS tracker that reports the bike's position at all times: it
  senses position plus motion/attitude, keeps a local record when the link is
  gone, reports to the cloud over a wide-area link, connects to the owner's
  phone when nearby, and raises theft alerts.

users: >-
  The founder himself — a single motorcycle owner, meeting the device on his own
  bike (hidden/tucked, mounted with an adapter). Possibly a handful of friends
  later.

# ── functions — S1's CLOSED capability vocabulary; R4 provenance PER ITEM ──
functions:
  - capability: sensing
    detail: position, accurately
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"

  - capability: sensing
    detail: altitude
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"

  - capability: sensing
    detail: speed and velocity
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"

  - capability: sensing
    detail: tilt / attitude
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: phone-nearby
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: far-away-anywhere
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: hmi
    detail: a-light — one multicolour LED / LED ring signalling device state
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  - capability: hmi
    detail: one-button — a single multipurpose control
    question: q.phys.controls
    quote: "1 button and 1 led/led ring, something clean that will lookj high end"
    at: "2026-08-26"

  - capability: storage
    detail: >-
      retain state across power loss; buffer position/track records while there
      is no link or no fix, then backfill them to the cloud when the link returns
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: compute
    detail: >-
      offline autonomy — everything except alerts must keep working with no
      internet
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  - capability: compute
    detail: >-
      position sense rate — 1 h while parked, 30 s while moving, and ideally
      runtime-configurable by software against a power preference
    question: q.fn.rate
    spawned_for: position
    quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
    at: "2026-08-26"

  - capability: compute
    detail: >-
      tilt/motion reaction latency — within seconds; an alert as quick as
      possible
    question: q.fn.rate
    spawned_for: tilt/motion
    quote: "within seconds, if an alert it must be as quick as possible"
    at: "2026-08-26"

  # derived-items convention: no quote, no question
  - capability: security
    detail: >-
      baseline security capability — the product talks to a counterpart and
      collects personal data (location)
    source: derived
    rule: capability.security

  - capability: time
    detail: >-
      timekeeping capability — the duty policy includes wakes-on-schedule
    source: derived
    rule: capability.time

  - capability: power
    detail: "power capability = PC1 + modes [wakes-on-event, wakes-on-schedule, only-when-used]"
    source: derived
    rule: capability.power

environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  limits: UNKNOWN          # q.followup.range asked, not answered
  on_body: "no"

power_class: PC1           # derived from q.power.source = charges-on-dock-or-cable

modes: [wakes-on-event, wakes-on-schedule, only-when-used]

targets:
  success: >-
    Installed and running on the bike, sending notifications to the phone and
    tracking the bike's location in the cloud.
  battery_life:            # CONDITIONAL — present because power_class is PC1
    delight: {value: 1, unit: month, qualifier: "1 month or more"}
    floor: none-declared   # declared-none convention: "no lowest threshold"
  unit_cost:
    build:
      amount: 100
      currency: USD
      basis: "components + PCB + assembly, per unit, at 10-unit quantity"
      bound: at-most
    sell: UNKNOWN          # conditional_fields: silence, not an explicit not-for-sale
  volume: {y1: 2, y3: 10}

physical:
  size_class: phone        # bound-asks convention: the stated bound is the record
  dims: ABSENT             # q.followup.range never spawned for q.phys.size
  carry: mounted
  controls: one-button

timeline:
  proto: none-declared
  production: none-declared

assets: []                 # q.time.exists = nothing

novelty:
  different: >-
    Similar products exist; the founder's difference is to build his own, "more
    powerful", using current embedded technology for accurate location plus an
    alarm.
  hard: "Antenna placement, multiple protocols, phone connection, and power."
  magic: none-declared     # "not really"
  moat: "No competitors (as stated by the founder)."

compliance:
  regions: [us]
  safety: "none"
  personal_data: [location]
  certifications: [fcc]    # derived from q.comp.region = us

# ── constraints channel — volunteered technology, never a derivation (R3) ──
constraints:
  - tech: cellular
    strength: hard
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    classified_by:
      question: q.constraint.strength
      quote: "requiemrnt"
      at: "2026-08-26"
    at: "2026-08-26"

  - tech: usb-c
    strength: hard
    quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    classified_by:
      question: q.constraint.strength
      quote: "requirement"
      at: "2026-08-26"
    at: "2026-08-26"

  - tech: zephyr-rtos
    strength: UNKNOWN      # constraint_oracle: an operating system is an
                           # INCLUDED token; no q.constraint.strength was
                           # spawned for it. Required tier -> hard-blocks G0.
    quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"

# ── R5 — UNKNOWN is data ──────────────────────────────────────────────────
unknowns:
  - field: pir.environment.limits
    blocks: [metric.feasibility.env-risk]
    note: >-
      q.followup.range (scoring, spawned by q.env.conditions) was asked and left
      blank. The adaptive feeds no metric directly; env-risk is named because the
      unquantified heat/cold/water bounds are what would move it off amber in
      either direction. Answered by: how hot, how cold, what ingress rating.

  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    note: >-
      q.scale.cost's second half ("what price sells it?") went unanswered — the
      founder priced only the build side. conditional_fields makes silence
      UNKNOWN and requires the runner to ask; the runner did not. "its just for
      me" (q.intent.who) is NOT an explicit not-for-sale declaration, so the
      ABSENT branch does not apply. metric.viability.economics is CORE.
      Answered by: a stated sell price, or an explicit not-for-sale.

  - field: "pir.constraints[zephyr-rtos].strength"
    blocks: []
    note: >-
      q.constraint.strength feeds only pir.constraints — it blocks no metric. It
      blocks GATE G0 instead: the adaptive is tier `required`, and the
      constraint_oracle names operating systems (zephyr rtos) as an included
      volunteered-technology token. Answered by: asking "requirement, or
      preference?" for Zephyr RTOS.

# ── runner errors — mandated by the multi-affirmation convention ───────────
runner_errors:
  - question: q.env.conditions
    kind: partial-presentation
    presented: [water, dust, heat, cold, vibration, washing-or-hosing]
    not_presented: ["drops", "none"]
    quote: "yes all the ones suggested"
    at: "2026-08-26"
    note: >-
      The affirmation binds only to the values the runner presented. `drops` is
      therefore NOT recorded as a condition even though a hidden, mounted
      motorcycle device plausibly meets it. Affects metric.feasibility.env-risk.

# ── R4 — provenance per field; a LIST when multi-fed ──────────────────────
provenance:
  pir.summary:
    - {question: q.intent.what, quote: "a motorcycle gps tracker so that i know where my bike is at all times", at: "2026-08-26"}
  pir.users:
    - {question: q.intent.who, quote: "its just for me", at: "2026-08-26"}
    - {question: q.scale.units, quote: "2, and maybe 10 for my freinds", at: "2026-08-26"}
  pir.functions:
