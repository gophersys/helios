    - {question: q.fn.acts, quote: "it does not do anything to the bike", at: "2026-08-26", note: "negative-function convention: satisfies the feed, produces NO actuation item"}
    - {question: q.fn.talks, quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that", at: "2026-08-26"}
    - {question: q.fn.shows, quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too", at: "2026-08-26"}
    - {question: q.fn.stores, quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud", at: "2026-08-26"}
    - {question: q.fn.offline, quote: "no alerts but yes everything else", at: "2026-08-26"}
    - {question: q.fn.rate, spawned_for: position, quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces", at: "2026-08-26"}
    - {question: q.fn.rate, spawned_for: tilt/motion, quote: "within seconds, if an alert it must be as quick as possible", at: "2026-08-26"}
    - {question: q.phys.controls, quote: "1 button and 1 led/led ring, something clean that will lookj high end", at: "2026-08-26"}
    - {source: derived, rule: capability.security}
    - {source: derived, rule: capability.time}
    - {source: derived, rule: capability.power}
  pir.environment.where:
