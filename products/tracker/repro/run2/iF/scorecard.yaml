# P1 feasibility scorecard for product "tracker".
# Contract: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
# precedence). Registry: docs/sfd/40-p1-registry.yaml — all 16 metrics scored,
# in registry order. Catalog evidence base:
# catalog/socs/{esp32c6,mimxrt1052}.yaml and catalog/components/bosch,bme280.yaml,
# all extracted at zephyr_sha 413b789deb391d3a37d06b463288a5fe765ee57e.
#
# NOTE ON G0: the PIR does not clear G0 — an unclassified volunteered
# technology (zephyr rtos) leaves a required-tier adaptive unanswered. P1 is
# scored here as requested; that gate failure is carried in
# recommendation.reasons, not silently dropped.
schema: sfd.scorecard/v0
pir:
  ref: repro/run2/iF/pir.yaml
  hash: "sha256:52cf9789cc10e6f711b88589129c8282d7ad885c9d5a56ab1d70a822aadfaf3d"

scores:
  # ── VIABILITY ────────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.summary states the what and the whom in one sentence: 'a motorcycle gps tracker so that i know where my bike is at all times' (q.intent.what)."
      - "pir.users resolves the audience with no contradiction: 'its just for me' (q.intent.who) — a single-operator product, consistent with volume y1=2 / y3=10."
    blocked_by: []

  - id: metric.viability.outcome
    score: green
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.targets.success names four checkable conditions — installed on the bike, running, notifying the phone, logging location to the cloud (q.intent.win)."
      - "Each condition follows directly from the stated functions (connectivity phone-nearby + far-away-anywhere, sensing position, storage backfill); a working product plausibly reaches all four."
      - "Weakness noted, not scored down: success is product-completion, not a usage outcome — acceptable for a personal build where the founder is the only user."
    blocked_by: []

  - id: metric.viability.economics
    score: unknown
    scored_by: derived
    verdict_weight: core
    evidence:
      - "pir.targets.unit_cost.build = USD 100 per unit at qty 10, covering components + pcb + assembly (q.scale.cost); pir.targets.volume = {y1: 2, y3: 10} (q.scale.units)."
      - "pir.targets.unit_cost.sell is UNKNOWN: the founder stated no intent to sell and made no explicit not-for-sale declaration, so conditional_fields makes this UNKNOWN rather than ABSENT — the not-for-sale branch of this metric's scale (which needs sell ABSENT) cannot be taken."
      - "Both branches of the scale are therefore unreachable: no sell price to compare against build, and no licence to score the build budget alone. Scale level unknown per the global semantics."
      - "For the record, had the not-for-sale branch been legal: USD 100 at qty 10 for a GNSS + cellular + BLE + IMU + LiPo + charger board would score amber at best — that BOM class is tight at ten units."
    blocked_by: [pir.targets.unit_cost.sell]

  - id: metric.viability.novelty
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "The founder concedes the category exists: 'yes, others exist' (q.intent.exists) and names no competitor and no benchmark ('no compettiors', q.novel.moat)."
      - "The stated difference — 'more powerful', 'cool technologies', 'accurate locations and alamr' — is incremental and unverified against any named product, which is the amber meaning exactly."
      - "Not red: a difference IS stated (accuracy + alarm + self-owned stack), and the product is for the founder's own use, so displacement of an existing product is not the success condition."
    blocked_by: []

  # ── TECH-EXISTS ──────────────────────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    scored_by: agent+catalog
    verdict_weight: core
    evidence:
      - "q.novel.magic = 'not really' — the founder claims no capability he has never seen work; the product is an integration, not an invention."
      - "catalog/socs/esp32c6.yaml, depth D1 (declared compatibles only) @ zephyr 413b789deb39: espressif,esp32-bt-hci and espressif,esp32-wifi and espressif,esp32-ieee802154 give the phone-nearby link a declared path. Catalog seam: D1 coverage scores amber, never green."
      - "catalog/socs/mimxrt1052.yaml, depth D1 @ zephyr 413b789deb39: no radio compatible anywhere in the closure (nxp,enet is wired ethernet) — lane A contributes nothing to this product's core capabilities."
      - "catalog/components/bosch,bme280.yaml, depth D2 (binding dts/bindings/sensor/bosch,bme280-{i2c,spi}.yaml + driver drivers/sensor/bosch/bme280, 19 exercised_by entries): barometric altitude, one of the named senses, has a proven path — the ONLY D2 evidence available to this product."
      - "COVERAGE GAP — GNSS: no receiver record exists in catalog/components/ (the directory holds exactly one file, bosch,bme280.yaml). Position, the product's core sense, is uncovered by the catalog. Named research task: extract a GNSS component record (gnss class binding + driver) at D1+."
      - "COVERAGE GAP — cellular modem: no record, and no supported-SoC lane declares a modem. far-away-anywhere is uncovered. Named research task: extract a cellular modem component record and its Zephyr modem-subsystem lineage at D1+."
      - "COVERAGE GAP — IMU/accelerometer: no record. tilt-motion sensing and the wake-on-event duty depend on it. Named research task: extract an IMU component record at D1+."
      - "Not red: red requires no coverage AND no known working example. Cellular+GNSS trackers with BLE provisioning are a shipped product class, and the founder claims no magic — so the honest level is amber (a path exists, unproven here), with three named research tasks carrying the gap."
    blocked_by: []

  # ── FEASIBILITY ──────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.environment.where = vehicle, and pir.environment.conditions carries three of the scale's named hard conditions at once: washing-or-hosing, vibration, plus heat and cold extremes (q.env.conditions, 'yes all the ones suggested')."
      - "All are costed, known art for a motorcycle-mounted sealed enclosure — potting/gasketed housing, vibration-rated mounting, wide-temperature parts. Amber, not red: no condition demands unavailable engineering."
      - "Risk carried, not scored: pir.environment.limits is UNKNOWN (q.followup.range was asked for how-hot/how-cold and left blank), so the exact temperature range that picks parts is unstated. That adaptive feeds no metric id, so it cannot drive this score to unknown — but it will bind P4 part selection."
      - "Second-order: the founder wants the unit hidden and 'protecetd from wethar' (q.env.where) while the antenna 'just works' (q.phys.carry) — enclosure sealing and RF transparency pull against each other on a metal vehicle."
    blocked_by: []

  - id: metric.feasibility.connectivity
    score: amber
    scored_by: agent+catalog
    verdict_weight: core
    evidence:
      - "Stated link, two counterparts (q.fn.talks): phone-nearby (metres, a phone) and far-away-anywhere (unbounded, via a wide-area network). Cellular is recorded as a HARD constraint (pir.constraints[cellular].strength = hard), so it filters the P4 fit matrix rather than being derived away."
      - "catalog/socs/esp32c6.yaml, depth D1: espressif,esp32-bt-hci covers the phone-nearby half within lane B, but only at D1 — declared inventory, not a supported claim. Per the catalog seam, D1-only coverage is amber by definition."
      - "catalog/socs/mimxrt1052.yaml, depth D1: no radio; lane A cannot serve either half without an external transceiver."
      - "COVERAGE GAP — no cellular capability in either supported lane and no modem component record in catalog/components/. far-away-anywhere is achievable but OUTSIDE the current lanes: it needs an external modem module on UART/USB plus a carrier plan. That is the amber meaning verbatim."
      - "Not red: a radio class reaches the stated counterpart at the stated distance, and PC1 (rechargeable, with an optional on-bike charger) can carry a modem's transmit peaks. Red would require no link to exist at all."
      - "Named research tasks: (1) extract a cellular modem component record; (2) confirm coexistence of a 2.4 GHz BLE radio, a cellular transmitter and a GNSS receiver on one hidden antenna volume — the founder's own top fear (q.novel.hard)."
    blocked_by: []

  - id: metric.feasibility.power-risk
    score: amber
    scored_by: derived
    verdict_weight: core
    evidence:
      - "Derivation inputs: pir.power_class = PC1 (q.power.source = charges-on-dock-or-cable, 'battery powered ideally, but easily rechargeable ... over a usb c connection'); pir.targets.battery_life = {delight: >= 1 month, floor: none-declared}; pir.modes = [wakes-on-event, wakes-on-schedule, only-when-used]."
      - "Floor: none-declared. An explicitly unbounded floor cannot be violated, so the red condition ('floor target violates the stated power class') cannot hold — the founder even accepts hours in a racing profile."
      - "Delight: >= 1 month on a rechargeable pack while sensing position every 3600 s parked, every 30 s moving, and reporting over cellular. That is exactly the amber case — reachable only with aggressive sleep design: motion-gated wake, GNSS duty cycling, batched uplinks, and a deep sleep state the whole time the bike is parked."
      - "Duty set contains no always-on value, which is what keeps the delight target in play at all; wakes-on-event depends on an IMU interrupt line that the catalog does not yet cover (see metric.tech.exists gaps)."
      - "Power-state evidence available today is thin: catalog/socs/esp32c6.yaml records only standby (min_residency 200 us, exit_latency 60 us) and soft-off (2000/212 us), at D1, and the extractor does not follow cpu-power-states phandles — so sleep-current figures for the budget do not yet exist in the catalog."
    blocked_by: []

  - id: metric.feasibility.head-start
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.assets = [nothing] (q.time.exists, answered 'nothing'): no sketches, no model, no prototype, no code, no app, no factory contact, no funding."
      - "pir.timeline.proto and pir.timeline.production are both none-declared ('no rush we are just testing out the system, correctness over speed'; 'no deadline')."
      - "That is the second amber clause exactly: nothing exists BUT the timeline carries no pressure. Red requires nothing plus a timeline that assumes otherwise; there is no timeline to violate."
    blocked_by: []

  # ── RISK ─────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    scored_by: derived
    verdict_weight: minor
    evidence:
      - "Both feeds are answered with the declared-none value, not UNKNOWN: q.time.proto = none-declared, q.time.prod = none-declared."
      - "With no dates asserted, no date can precede a lead time and every known lead time (PCB fab, assembly, modem sourcing, FCC test slot) fits with unlimited slack. Green by the mechanical rule."
      - "Stated so it is not mistaken for strength: this green means 'no schedule conflict exists', not 'the schedule is well planned'."
    blocked_by: []

  - id: metric.risk.self-assessed
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "The fear (q.novel.hard): 'antenna placement, multipel protocols, pjone connecton and poower'. That is placed correctly — a hidden, weather-sealed, possibly metal-shrouded enclosure carrying GNSS receive plus cellular transmit plus BLE, on a battery, is genuinely RF-and-power-bound. The hard part is seen."
      - "No plan accompanies it: pir.assets = [nothing], no antenna study, no coexistence plan, no power budget, and the catalog holds no record for either of the two radios involved."
      - "Amber is the exact scale text: the fear is real but unplanned-for. Green would require a plan."
      - "One unseen item worth naming: thermal and vibration life of a LiPo cell mounted on a motorcycle — the founder's only mention of it is the aside 'hopefully not explode lol' (q.comp.safety)."
    blocked_by: []

  - id: metric.risk.safety
    score: green
    scored_by: derived
    verdict_weight: core
    evidence:
      - "q.comp.safety = none ('no, just hopefully not explode lol'). The mechanical mapping of none is green: no plausible harm path as stated by the founder."
      - "human_gate_when is serious; the answer is none, so NO human gate is raised (F5 not triggered)."
      - "Recorded verbatim because the derived score must not launder it: the founder's own aside names a lithium cell on a vehicle. The answer governs the score; this line governs the reader."
    blocked_by: []

  - id: metric.risk.privacy
    score: amber
    scored_by: derived
    verdict_weight: minor
    evidence:
      - "pir.compliance.personal_data = [location] (q.comp.data: 'yes, whatver info it has about location bascially')."
      - "Location is named in the amber clause verbatim: personal data with known regimes. Not green (which requires no personal data); not red (which requires health or identity data)."
      - "Scope softens it in practice — pir.users = 'its just for me' and volume y3 = 10 — but the metric is derived from the data class, not from the audience size."
      - "pir.compliance.regions = [us] → certifications [fcc]; a US-only, self-owned tracker carries no GDPR exposure at this scale."
    blocked_by: []

  # ── PLATFORM (consumer P2 — never bears on the P1 verdict) ───────────
  - id: metric.platform.edge-autonomy
    score: amber
    scored_by: agent
    verdict_weight: null          # P2-class: registry declares no verdict_weight
    evidence:
      - "q.fn.offline = 'no alerts but yes everything else' — the metric is NOT absent, because q.fn.talks != nothing keeps its feed open."
      - "Degradation is bounded and acceptable to the founder: sensing, logging and buffered storage continue with no internet ('save things if no location, then backtrack to the cloud', q.fn.stores), and only the alert path is lost."
      - "Not green: theft alerting is the product's stated success condition (q.intent.win names notifications), so the function that dies offline is the valuable one. Not red: the device is not dead without the cloud — it keeps the evidence and backfills."
    blocked_by: []

  - id: metric.platform.hmi-class
    score: green
    scored_by: derived
    verdict_weight: null
    evidence:
      - "q.fn.shows = a-light ('no screen, maybe a multicolo led to signal states, simople is best') and q.phys.controls = one-button ('1 button and 1 led/led ring')."
      - "LED plus a single button is the green clause verbatim — none/LED/sound, lane B territory. No display stack, no framebuffer, no touch."
    blocked_by: []

  - id: metric.platform.compute-demand
    score: green
    scored_by: derived
    verdict_weight: null
    evidence:
      - "q.fn.rate spawned twice, so the metric is NOT absent. Stated periods: 3600 s parked and 30 s moving for position; 'within seconds' for tilt/motion."
      - "Mechanical derivation: every stated rate period is >= 1 s and no continuous stream processing is named → green. No sub-second loop, no vision or audio pipeline, no hard real time."
      - "Named so P2 does not inherit a false green: 'if an alert it must be as quick as possible' is a LATENCY wish on an interrupt-driven wake path, not a periodic rate. It sizes the wake path, not the CPU."
    blocked_by: []

derived:
  needs_hardware: true
  needs_firmware: true
  rationale:
    needs_hardware: "pir.functions carries sensing (position, altitude, speed-velocity, tilt-motion), on-device hmi (a-light), and a physical mounted enclosure — the derived_flags rule fires on any one of these."
    needs_firmware: "needs_hardware AND on-device logic: edge-autonomy (compute, 'no alerts but yes everything else'), store-and-forward buffering (storage), and a software-configurable sample rate (q.fn.rate). Nothing here is passive or analog."

human_gates: []                   # q.comp.safety = none → F5 gate NOT raised

recommendation:
  verdict: blocked
  blockers:
    - metric: metric.viability.economics
      score: unknown
      blocked_by: pir.targets.unit_cost.sell
      answered_by: "q.scale.cost — the sell half. The founder answered the build half only ('i dont wanna spend more than $100 on components + pcb + assembly per unit at 10 unit qty.') and was never asked back. Either a stated price, or an explicit not-for-sale declaration (which makes the field ABSENT and unlocks the not-for-sale branch of the scale), clears this."
  reasons:
    # Precedence: rule 1 does not fire (no human gate open — safety = none).
    # Rule 2 fires: a CORE metric is unknown → blocked. Everything rules 3-4
    # would have said is recorded below, per the contract.
    - "Rule 1 did not fire: human_gates is empty; q.comp.safety = none."
    - "Rule 2 fired: metric.viability.economics (core) is unknown. This is the designed outcome, not a defect — economics is fed by scoring-tier questions, so the UNKNOWN can pass G0 and stop here."
    - "Rule 3 would NOT have fired: no core metric is red. metric.tech.exists amber, metric.feasibility.connectivity amber, metric.feasibility.power-risk amber, metric.risk.safety green. No pivot; and kill is unreachable a second way — metric.tech.exists is not red, and pir.novelty.magic is 'not really', so the product stakes no magic to lose."
    - "Rule 4 would have recommended GO, with these ambers named:"
    - "amber metric.tech.exists (core) — three catalog coverage gaps: no GNSS record, no cellular modem record, no IMU record; only bosch,bme280 (D2) and two D1 SoC records exist."
    - "amber metric.feasibility.connectivity (core) — cellular is a hard constraint but sits outside both supported lanes; the BLE half is D1-declared only, on catalog/socs/esp32c6.yaml."
    - "amber metric.feasibility.power-risk (core) — the 1-month delight target needs aggressive sleep design; the floor is none-declared so nothing is violated."
    - "amber metric.feasibility.env-risk (minor) — washing-or-hosing plus vibration plus heat/cold on a vehicle; known art, and the exact limits are unstated."
    - "amber metric.feasibility.head-start (minor) — nothing exists, but no deadline exists either."
    - "amber metric.risk.self-assessed (minor) — the fear is correctly placed (antenna, multi-radio, power) and entirely unplanned-for."
    - "amber metric.risk.privacy (minor) — location data, US only, one to ten personal units."
    - "amber metric.viability.novelty (minor) — the category exists; the stated difference is incremental and unverified."
    - "minor-metric unknowns: none. pir.environment.limits is UNKNOWN but its adaptive (q.followup.range) feeds no metric id, so it blocks nothing at P1 and lands on P4 instead."
    - "P2-class, NON-VERDICT-BEARING: metric.platform.edge-autonomy amber (alerts die offline, and alerts are the stated success condition); metric.platform.hmi-class green (lane B); metric.platform.compute-demand green (all rates >= 1 s)."
    - "GATE NOTE, outside the metric set: the PIR does not clear G0. constraint_oracle counts 'zephyr rtos' (q.novel.magic) as volunteered technology, so it requires a q.constraint.strength ask-back — required tier, never spawned, recorded as UNKNOWN at pir.constraints[zephyr-rtos].strength. P1 should not be treated as authoritative until G0 is clean; it is reported rather than hidden."
    - "RUNNER GAPS carried from the PIR (pir.runner_errors): q.env.conditions was presented with 6 of its 8 values (drops and none omitted); the q.scale.cost sell half was never asked back; q.fn.rate spawned for 2 of 4 named senses."

