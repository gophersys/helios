# Product Intent Record — extracted from the frozen interrogation transcript.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5, PIR v0) + docs/sfd/30-p0-graph.yaml
# (types, tiers, conventions, derivations, constraint_oracle, conditional_fields).
# Transcript carries no clock: R4 timestamps use date-only ISO 8601
# (conventions.timestamps).
schema: sfd.pir/v0
product: tracker
extracted: "2026-08-26"

summary: 'a motorcycle gps tracker so that i know where my bike is at all times'

users: 'its just for me'

# ── functions ─────────────────────────────────────────────────────────────
# R4: provenance PER ITEM, inline. Derived capabilities carry
# {source: derived, rule} and no quote/question (conventions.derived-items).
# q.fn.acts answered negative -> NO item; its answer lives in
# provenance.pir.functions (conventions.negative-function).
functions:
  - capability: sensing
    detail: 'position — accurate location, the primary sense'
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: "2026-08-26"
    rate:
      question: q.fn.rate
      spawned_for: position
      quote: 'parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces'
      at: "2026-08-26"
      periods:
        - {condition: parked, period: 1, unit: hour}
        - {condition: moving, period: 30, unit: second}
      runtime_configurable: true

  - capability: sensing
    detail: 'altitude'
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: "2026-08-26"

  - capability: sensing
    detail: 'speed / velocity'
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: "2026-08-26"

  - capability: sensing
    detail: 'tilt / motion — arms the theft alert'
    question: q.fn.senses
    quote: 'ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that'
    at: "2026-08-26"
    rate:
      question: q.fn.rate
      spawned_for: tilt/motion
      quote: 'within seconds, if an alert it must be as quick as possible'
      at: "2026-08-26"
      periods:
        - {condition: alert-reaction, period: 1, unit: second, bound: at-most, stated_as: 'within seconds'}
      runtime_configurable: false

  - capability: connectivity
    detail: 'phone-nearby — the phone connects to it easily when close'
    question: q.fn.talks
    quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
    at: "2026-08-26"

  - capability: connectivity
    detail: 'far-away-anywhere — location known from anywhere'
    question: q.fn.talks
    quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
    at: "2026-08-26"

  - capability: storage
    detail: 'retain state across power loss and low-power modes; buffer fixes when there is no location/link and backfill to the cloud later'
    question: q.fn.stores
    quote: 'yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud'
    at: "2026-08-26"

  - capability: hmi
    detail: 'a-light — one multicolour LED / LED ring signalling device state; no screen'
    question: q.fn.shows
    quote: 'no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too'
    at: "2026-08-26"

  - capability: hmi
    detail: 'one-button — a single multipurpose button'
    question: q.phys.controls
    quote: '1 button and 1 led/led ring, something clean that will lookj high end'
    at: "2026-08-26"

  - capability: compute
    detail: 'edge autonomy — with no internet everything must still work except alerts'
    question: q.fn.offline
    quote: 'no alerts but yes everything else'
    at: "2026-08-26"

  - capability: security
    detail: 'baseline security capability'
    source: derived
    rule: capability.security          # q.fn.talks != nothing AND q.comp.data != none

  - capability: time
    detail: 'timekeeping for scheduled wakes'
    source: derived
    rule: capability.time              # q.power.duty includes wakes-on-schedule

  - capability: power
    detail: 'PC1 rechargeable + modes [wakes-on-event, wakes-on-schedule, only-when-used]'
    source: derived
    rule: capability.power             # pir.power_class + pir.modes, always present

# ── environment ───────────────────────────────────────────────────────────
environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  limits: UNKNOWN        # q.followup.range spawned for heat/cold, asked, unanswered
  on_body: "no"

# ── power ─────────────────────────────────────────────────────────────────
power_class: PC1         # derived: q.power.source = charges-on-dock-or-cable
modes: [wakes-on-event, wakes-on-schedule, only-when-used]

# ── targets ───────────────────────────────────────────────────────────────
targets:
  success: 'it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud'
  battery_life:          # CONDITIONAL: present because power_class in [PC0, PC1]
    delight: {value: 1, unit: month, bound: at-least}
    floor: none-declared # conventions.declared-none: 'no lowest threshold' is an ANSWER
  unit_cost:
    build: {value: 100, currency: USD, bound: at-most, scope: 'components + pcb + assembly per unit at 10 unit qty'}
    sell: UNKNOWN        # conditional_fields: silence is UNKNOWN, the runner must ask
  volume: {y1: 2, y3: 10}

# ── physical ──────────────────────────────────────────────────────────────
physical:
  size_class: phone      # conventions.bound-asks: the stated bound, not the fallback
  dims: ABSENT           # q.followup.range never spawned for q.phys.size
  carry: mounted
  controls: one-button

# ── timeline + assets ─────────────────────────────────────────────────────
timeline:
  proto: none-declared
  production: none-declared
assets: ["nothing"]

# ── novelty ───────────────────────────────────────────────────────────────
novelty:
  different: 'yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that'
  hard: 'antenna placement, multipel protocols, pjone connecton and poower'
  magic: 'not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building'
  moat: 'no compettiors'

# ── compliance ────────────────────────────────────────────────────────────
compliance:
  regions: [us]
  safety: "none"
  personal_data: [location]
  certifications: [fcc]   # derived from regions (derivations.pir.compliance.certifications)

# ── constraints — volunteered technology, never a derivation (R3) ─────────
constraints:
  - tech: cellular
    strength: hard
    quote: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'
    at: "2026-08-26"
    source_question: q.fn.talks
    strength_provenance:
      question: q.constraint.strength
      quote: 'requiemrnt'
      at: "2026-08-26"

  - tech: usb-c
    strength: hard
    quote: 'battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection'
    at: "2026-08-26"
    source_question: q.power.source
    strength_provenance:
      question: q.constraint.strength
      quote: 'requirement'
      at: "2026-08-26"

  - tech: zephyr-rtos
    strength: UNKNOWN     # constraint_oracle includes 'operating systems (zephyr rtos)';
    quote: 'not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building'
    at: "2026-08-26"
    source_question: q.novel.magic
    strength_provenance: null   # q.constraint.strength was never spawned for this token

# ── UNKNOWNs — R5, first class ────────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr-rtos].strength
    blocks: []
    tier: required
    gate: G0-hard-block
    detail: 'volunteered technology never classified hard/preference; constraint_oracle makes an unclassified included token UNKNOWN at required tier, so G0 is RED. It blocks no P1 metric (q.constraint.strength feeds only pir.constraints) but it does gate P4 fit-matrix filtering.'

  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    tier: scoring
    gate: passes-G0-raised-as-risk
    detail: 'the founder never states an intent to sell nor an explicit not-for-sale; conditional_fields makes silence UNKNOWN and requires the runner to ask. Without it neither branch of the economics scale (margin, or the not-for-sale budget branch) is decidable.'

  - field: pir.environment.limits
    blocks: []
    tier: scoring
    gate: passes-G0-raised-as-risk
    detail: 'q.followup.range was spawned by the heat/cold picks and asked, but not answered. It blocks no metric — metric.feasibility.env-risk is fed by q.env.where and q.env.conditions, both answered — but it removes the numeric temperature range from the env-risk evidence.'

# ── ABSENT — a defined non-state, distinct from UNKNOWN ───────────────────
absent:
  - field: pir.physical.dims
    reason: 'q.phys.size answered `phone` (not a tight pick); the q.followup.range adaptive was never spawned for it. An unspawned adaptive is N/A, never UNKNOWN.'

# ── runner errors — recorded in the PIR per conventions.multi-affirmation ─
runner_errors:
  - question: q.env.conditions
    error: partial-presentation
    presented: [water, dust, heat, cold, vibration, washing-or-hosing]
    not_presented: [drops, "none"]
    detail: 'the runner presented 6 of the 8 declared values; the blanket affirmation "yes all the ones suggested" binds only to what was presented (conventions.multi-affirmation), so `drops` carries no answer in either direction. A motorcycle tracker plausibly meets drops; the omission is a runner defect, not founder silence.'

  - question: q.constraint.strength
    error: missing-ask-back
    token: zephyr-rtos
    detail: 'constraint_oracle requires an ask-back for every included volunteered token. `cellular` and `usb-c` got one; `zephyr rtos` (explicitly named in the oracle) did not. Recorded as the UNKNOWN above; hard-blocks G0.'

# ── consistency (graph `consistency:` block) ──────────────────────────────
consistency:
  - id: c.app-needs-link
    status: green
    reason: 'does not fire: q.fn.talks != nothing (phone-nearby, far-away-anywhere) and q.phys.controls = one-button, not only-an-app.'

# ── provenance — R4, per field; a LIST when multi-fed ─────────────────────
