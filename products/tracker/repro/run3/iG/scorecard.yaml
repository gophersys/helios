# P1 feasibility scorecard for the PIR "tracker".
# Contract: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
# precedence, catalog seam evidence bar) + docs/sfd/40-p1-registry.yaml.
# All 16 registry metrics scored. Catalog evidence cites path + depth.
schema: sfd.scorecard/v0

pir:
  ref: repro/run3/iG/pir.yaml
  hash: "sha256:f6ed0070898cc981065b254e88215a6d73e8add61a2bbf1bd9a1bb7bcea2fb83"
  g0_status: blocked        # not hidden — also carried in recommendation.reasons[0]

catalog:
  root: catalog/
  zephyr_sha: 413b789deb391d3a37d06b463288a5fe765ee57e
  records_available: 3
  inventory:
    - {path: "catalog/socs/esp32c6.yaml", depth: D1}
    - {path: "catalog/socs/mimxrt1052.yaml", depth: D1}
    - {path: "catalog/components/bosch,bme280.yaml", depth: D2}
  note: >-
    The whole catalog is three records at zephyr v4.2.0. Every agent+catalog
    score below therefore leans on the seam's "named example" clause as much
    as on coverage; each gap is named as a research task in its evidence.

scores:
  # ── VIABILITY ───────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.intent.what: \"a motorcycle gps tracker so that i know where my bike is at all times\" — one sentence names the artefact (GPS tracker), the host (motorcycle) and the outcome (always know where the bike is)."
      - "q.intent.who: \"its just for me\" — the for-whom is stated in the same breath, satisfying the green level's \"what it does and for whom\"."
      - "No contradiction across the transcript: every later answer (position, alerts, cloud, LED, button) elaborates the same one-sentence product."
    blocked_by: []

  - id: metric.viability.outcome
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.intent.win: \"it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud\" — three observable conditions (installed+running, notifications delivered, cloud track present), each pass/fail checkable."
      - "Plausibility: the target is one unit on the founder's own bike (pir.targets.volume.y1 = 2), with no deadline (pir.timeline.* = none-declared). A working product of this class plainly reaches this outcome."
      - "Green rather than amber: the outcome is not vague and needs no strong assumption — it is the product operating."
    blocked_by: []

  - id: metric.viability.economics
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    evidence:
      - "Branch: not-for-sale — pir.targets.unit_cost.sell is ABSENT (declared not-for-sale: \"its just for me\" / \"2, and maybe 10 for my freinds\"). The registry's sell-ABSENT branch is therefore the one that applies; the sell>build comparison is skipped."
      - "Inputs: build <= $100 USD per unit at 10-unit qty covering components + PCB + assembly (q.scale.cost); volume y1=2, y3=10 (q.scale.units)."
      - "BOM class implied by pir.functions: wide-area cellular modem + GNSS receiver + BLE-capable MCU + IMU (tilt) + barometric/altitude sense + Li-ion cell + USB-C charge path + two-to-three antennas + sealed enclosure for a vehicle install."
      - "Derivation: at qty 10 the modem, GNSS and cell alone consume the majority of the budget, and PCB fabrication plus assembly at 10 units carry no volume relief. The budget can buy the parts, but with no margin for the enclosure, antennas and sealing the environment answers demand."
      - "Amber, not green: \"budget tight for the BOM class\". Not red: the budget is not below what the required parts cost — it has no headroom, which is the amber level exactly."
      - "Residual: the sell field is the largest interpretive fork in the PIR (see pir.targets.unit_cost.note). Under an UNKNOWN reading this core metric would score unknown and precedence rule 2 would force verdict `blocked`."
    blocked_by: []

  - id: metric.viability.novelty
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.intent.exists: \"yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that\" — the founder concedes the category is occupied."
      - "The claimed difference (\"more powerful\", \"cool technologies\", better accuracy, alarm) is comparative and unquantified against no named incumbent — incremental and unverified, which is the amber level verbatim."
      - "Not red: red requires \"an existing product already is this\". The founder states a difference; it is unverified, not absent."
      - "Cross-check: q.novel.moat = \"no compettiors\" contradicts \"others exist\" as a market claim, but this is a personal build with sell ABSENT — differentiation is not load-bearing here, which is why the metric is minor."
    blocked_by: []

  # ── TECH-EXISTS ─────────────────────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - "q.novel.magic: \"not really.\" — pir.novelty.magic is none-declared. No capability is claimed that the founder has never seen work; the metric reduces to per-capability availability."
      - "Capability map from pir.functions: connectivity (phone-nearby + far-away-anywhere), sensing (position, altitude, speed, velocity, tilt), storage, compute, hmi, power, security, time."
      - "catalog: catalog/socs/esp32c6.yaml @ D1 (zephyr 413b789d) — covers hmi (`espressif,esp32-ledc` for the LED, `espressif,esp32-gpio` for the button), storage (`soc-nv-flash`, `fixed-partitions`), security baseline (`espressif,esp32-trng`), time (`espressif,esp32-rtc_timer`, `espressif,esp32-systimer`), power (power_states standby 200 us / soft-off 2000 us), and the i2c/spi/uart attach points every external sense needs."
      - "catalog: catalog/components/bosch,bme280.yaml @ D2 (zephyr 413b789d) — a driver-backed path for the barometric/altitude sense; D2 is the only D2+ record in the catalog, and it is the only sensing capability with a proven path."
      - "catalog GAP — cellular WAN: no component record and no compatible on either supported SoC. Named upstream examples: Zephyr's modem subsystem drivers `u-blox,sara-r4`/`sara-r5`, `quectel,bg9x`, `simcom,sim7080`, and the nRF91-series LTE-M/NB-IoT SiP; shipped product class: commercial motorcycle/asset GPS trackers. Per the seam's evidence bar (named example + zero catalog coverage) this is amber with a research task, not red. RESEARCH TASK: extract an LTE-M/NB-IoT modem component record to D2."
      - "catalog GAP — GNSS receiver: no component record. Named upstream examples: the Zephyr GNSS subsystem with `gnss-nmea-generic`, `u-blox,m8`, `quectel,lc26g`. RESEARCH TASK: extract a GNSS receiver component record to D2."
      - "catalog GAP — IMU / tilt: no component record. Named upstream examples: `st,lis2dh`, `bosch,bmi270`, `invensense,icm42688` (all driver-backed in tree). RESEARCH TASK: extract an accelerometer component record to D2."
      - "catalog GAP — Li-ion charge path and fuel gauge for the USB-C hard constraint: no component record. RESEARCH TASK: extract a charger/fuel-gauge component record."
      - "Derivation: the green level demands EVERY needed capability have a proven path (catalog D2+ or a shipped product). Only the altitude sense reaches D2; the SoC is D1 and four capabilities have zero coverage with driver work implied. That is the amber level verbatim — \"a path exists but unproven here (catalog D1, or driver-work flagged)\"."
      - "Not red: red demands the CORE capability have no known working example. Every gap above is nameable in-tree and ships commercially, so nothing here is unexampled."
    blocked_by: []

  # ── FEASIBILITY ─────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.env.where = vehicle; q.env.conditions = [water, dust, heat, cold, vibration, washing-or-hosing]."
      - "Two of the amber level's three named hard conditions are selected explicitly — `washing-or-hosing` and `vibration` — which lands the score on amber by the scale's own wording."
      - "The install is concealed on a motorcycle (\"tucked away somehwere hidden\"), which compounds thermal soak and vibration coupling but is costed, known art: sealed potted enclosures and conformal coating are standard for powered-two-wheeler electronics."
      - "Not red: red demands conditions with no path. Every listed condition has ordinary IP-rated and vibration-damped practice behind it."
      - "RISK: pir.environment.limits is UNKNOWN — q.followup.range (how hot / how cold) was spawned and never answered, so the \"extremes\" clause of the amber level is unquantified. q.followup.range is not among this metric's fed_by, so the UNKNOWN does not force score=unknown; it is carried as a named risk per R5."
      - "RISK: runner_errors re.1 — `drops` was never presented to the founder, so an impact condition plausible for this product is simply unrecorded."
    blocked_by: []

  - id: metric.feasibility.connectivity
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - "q.fn.talks = [phone-nearby, far-away-anywhere] — two counterparts at two distances, so two links must both close."
      - "Derived link 1 (phone-nearby): a short-range 2.4 GHz link. catalog/socs/esp32c6.yaml @ D1 declares `espressif,esp32-bt-hci` (BLE), `espressif,esp32-wifi` and `espressif,esp32-ieee802154`, and it is lane B of the supported-SoC set. Coverage exists but only at D1 — the seam states plainly that D1-only coverage is amber."
      - "Derived link 2 (far-away-anywhere): a wide-area link, hard-constrained to cellular by pir.constraints[cellular].strength = hard. NO cellular coverage anywhere in the catalog: neither catalog/socs/esp32c6.yaml nor catalog/socs/mimxrt1052.yaml declares a cellular compatible, and no component record exists. Cellular is outside BOTH supported lanes (lane A = MIMXRT1052 crossover, lane B = Espressif BLE/Wi-Fi)."
      - "Named examples for link 2, per the evidence bar: Zephyr's in-tree modem drivers `u-blox,sara-r4`/`sara-r5`, `quectel,bg9x`, `simcom,sim7080`, and the nRF91-series integrated LTE-M/NB-IoT SiP; plus the shipped product class of commercial motorcycle GPS trackers, which close exactly this link. RESEARCH TASK: bring an LTE-M/NB-IoT modem into the capability index at D2 and decide whether it attaches to lane B over UART or replaces the SoC choice."
      - "Derivation: the amber level reads \"achievable but outside current lanes, or coverage only at D1 with risk\". BOTH clauses hold — link 1 is D1-only, link 2 is outside the lanes. Amber."
      - "Not green: green demands D2+ coverage by the supported-SoC lanes; nothing here reaches D2."
      - "Not red: red demands that no radio reaches the stated counterpart at the stated distance and power. LTE-M with PSM reaches anywhere and is a mass-market solution for battery trackers, so the link physically closes."
      - "RISK carried to P4/P5: two radios plus a GNSS front end inside a phone-sized concealed enclosure is exactly the coexistence and antenna problem the founder named in q.novel.hard."
    blocked_by: []

  - id: metric.feasibility.power-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    evidence:
      - "Inputs: pir.power_class = PC1 (q.power.source = charges-on-dock-or-cable); pir.targets.battery_life.delight = 1 month or more; pir.targets.battery_life.floor = none-declared; pir.modes = [wakes-on-event, wakes-on-schedule, only-when-used] (`always-on` NOT selected)."
      - "Floor test: the founder declared no lowest threshold and accepts hours of life in a high-performance/racing mode (\"no lowest threshold ... expected batter y life in the hours\"). An unbounded floor cannot be violated, so the red level — \"floor target violates the stated power class\" — cannot fire."
      - "Delight test: 1 month+ on a PC1 cell inside a phone-to-deck-of-cards envelope, while taking GNSS fixes every 30 s in motion and hourly when parked (pir.functions[position].rate) and reporting over cellular, requires aggressive sleep design: PSM/eDRX on the modem, GNSS duty cycling with hot/warm starts, and accelerometer-interrupt wake rather than polling. This is the amber level verbatim — \"delight target requires aggressive sleep design; floor reachable\"."
      - "Supporting: the duty set excludes `always-on` and the founder explicitly wants power-aware policy (\"use sensors to best leverage poweres in combination with user prefernecs\"), so the architecture the amber level presumes is already the stated intent."
      - "Supporting: catalog/socs/esp32c6.yaml @ D1 records only two power states — standby (min residency 200 us, exit 60 us) and soft-off (2000 us / 212 us). The catalog schema notes power_states cannot be attributed to a CPU cluster at D1, so the deep-sleep current that decides a 1-month budget is NOT evidenced by the catalog and must be measured at P6."
      - "Not green: green demands the floor be comfortably plausible AND the duty benign; the delight target is the binding one here and it is not comfortable."
    blocked_by: []

  - id: metric.feasibility.head-start
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.time.exists = \"nothing\" — pir.assets = [nothing]. No code, no prototype, no drawings, no factory contact, no funding."
      - "q.time.proto = \"no rush we are just testing out the system, correctness over speed, can optimize later\" and q.time.prod = \"no deadline\" — both none-declared."
      - "Derivation: the amber level's second branch is authored for exactly this pairing — \"nothing exists but the timeline carries no pressure\". Amber."
      - "Not red: red is \"nothing — and the timeline assumes otherwise\". The timeline assumes nothing at all."
    blocked_by: []

  # ── RISK ────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    evidence:
      - "pir.timeline.proto = none-declared (\"no rush we are just testing out the system, correctness over speed, can optimize later\")."
      - "pir.timeline.production = none-declared (\"no deadline\")."
      - "Derivation: the green level's second branch applies verbatim — \"no dates declared (none-declared: no schedule risk asserted, stated as such in evidence)\". STATED AS SUCH: no schedule risk is asserted by this score; it records the absence of dates, not the presence of slack."
    blocked_by: []

  - id: metric.risk.self-assessed
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - "q.novel.hard: \"antenna placement, multipel protocols, pjone connecton and poower\" — four fears."
      - "Placement check — the fears are well aimed. Antenna placement is genuinely the hard part for a deliberately concealed device with two radios plus GNSS (pir.physical.notes: \"antenna must \\\"just work\\\" from the concealed position\"). Multi-protocol coexistence is real: BLE and cellular and GNSS share a crowded enclosure. Power is the binding constraint on the 1-month delight target (see metric.feasibility.power-risk)."
      - "Plan check — pir.assets = [nothing]; no prototype, no code, no analysis, no factory path. The fears are named but nothing is staged against them."
      - "Derivation: green requires the fear to match the hard part AND have a plan. The match holds, the plan does not — \"the fear is real but unplanned-for\" is the amber level verbatim."
      - "Not red: red requires the hard part to be UNSEEN. Two items the founder did not name are nonetheless real — carrier/network certification and a data plan for a cellular device, and the $100 build budget at 10-unit qty — but they are cost and process risks, not a mis-sighted hard part; the three engineering fears he named are the right three."
    blocked_by: []

  - id: metric.risk.safety
    score: green
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate_when: serious
    human_gate_raised: false
    evidence:
      - "q.comp.safety = \"no, just hopefully not explode lol\" -> pir.compliance.safety = `none` (the enum value as answered)."
      - "Derivation: `none` maps to the green level — \"no plausible harm path\". Mechanical, no judgment."
      - "F5 check: human_gate_when is `serious`; the answer is `none`, so NO human gate is raised and precedence rule 1 does not fire."
      - "RECORDED, NOT PROMOTED: the founder's trailing \"hopefully not explode\" names a lithium-cell hazard on a vibrating, heat-soaked vehicle. He did not assert it as a harm path and the metric is scored_by derived, so this score cannot re-rate it. Carried forward as a P5 item (cell protection, charge-temperature cutoff, mechanical retention) rather than silently absorbed."
    blocked_by: []

  - id: metric.risk.privacy
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    evidence:
      - "q.comp.data: \"yes, whatver info it has about location bascially\" -> pir.compliance.personal_data = [location]."
      - "Derivation: the amber level names location explicitly — \"personal data with known regimes (location, voice)\". Amber."
      - "Not green: green requires no personal data. Not red: red requires health/identity data; neither is collected."
      - "Scope note: pir.compliance.regions = [us], certifications derived [fcc]. Continuous vehicle-location history is the regime-bearing element; a single-owner build keeps the data subject and the controller the same person, which is why this is amber and minor rather than escalated."
    blocked_by: []

  # ── PLATFORM (consumer P2 — never bears on the P1 verdict) ──────────
  - id: metric.platform.edge-autonomy
    score: amber
    consumer: P2-class
    scored_by: agent
    absent_check: "absent_when q.fn.talks == nothing — NOT met (q.fn.talks = [phone-nearby, far-away-anywhere]); the metric is present and scored."
    evidence:
      - "q.fn.offline: \"no alerts but yes everything else\" — one capability degrades, the rest continue."
      - "q.fn.stores: \"yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud\" — store-and-forward is explicit, so an outage costs latency, not data."
      - "Derivation: sensing, logging, storage, mode policy and the local BLE link all survive an outage; only the outbound alert path dies. That is \"degrades offline in acceptable ways\" — amber."
      - "Not green: green is \"device is fine offline (or offline-first)\". Losing alerts is not fine — the alert IS the anti-theft value in the moment a bike is moved (q.intent.exists names \"alamr\")."
      - "Not red: the product is far from dead without the cloud; it keeps tracking and backfills."
      - "P2 consequence: the store-and-forward buffer plus the local decision to raise an alert put real logic on-device — this is MCU-with-Zephyr territory, not a thin cloud terminal."
    blocked_by: []

  - id: metric.platform.hmi-class
    score: green
    consumer: P2-class
    scored_by: derived
    evidence:
      - "q.fn.shows = `a-light` (\"no screen, maybe a multicolo led to signal states, simople is best\")."
      - "q.phys.controls = `one-button` (\"1 button and 1 led/led ring\")."
      - "Derivation: the green level is \"none/LED/sound — lane B territory\". A single multicolour LED plus one button sits inside it with room to spare."
      - "Not amber: amber needs a small screen or MANY controls; there is one control. Not red: no rich screen — the founder rejected a screen outright."
      - "P2 consequence: the HMI imposes no display stack and no MPU pressure; it points at lane B (catalog/socs/esp32c6.yaml @ D1)."
    blocked_by: []

  - id: metric.platform.compute-demand
    score: green
    consumer: P2-class
    scored_by: derived
    absent_check: "absent_when q.fn.rate never spawned — NOT met; q.fn.rate spawned twice (position, tilt/motion). The metric is present and scored."
    evidence:
      - "Rate 1 (position): parked 1 h, moving 30 s, software-configurable — every stated period >= 1 s."
      - "Rate 2 (tilt/motion): \"within seconds, if an alert it must be as quick as possible\" — the stated period is seconds, i.e. >= 1 s."
      - "Derivation applied verbatim: \"green when every stated rate period >= 1 s and no continuous stream processing\". Both conditions hold — no vision, no audio, no continuous stream anywhere in pir.functions."
      - "Not amber: no sub-second loop is stated. \"As quick as possible\" describes an alert latency goal met by an accelerometer interrupt, not a sub-second polling loop; it is a wake-source requirement, not a compute rate."
      - "Not red: no vision/audio pipeline and no hard real-time deadline."
      - "COVERAGE CAVEAT: runner_errors re.3 — five senses were named but only two received a rate ask, so altitude, speed and velocity carry rate ABSENT. This green is scored on a partial rate set. All three are GNSS/baro-derived at the position rate in any plausible design, so the conclusion is unlikely to move, but the derivation is not complete over the stated senses."
    blocked_by: []

# ── DERIVED FLAGS (consumer P2; F3 applies to them too) ────────────────
derived:
  needs_hardware: true
  needs_firmware: true

derived_evidence:
  needs_hardware:
    - "Rule: \"any sensing, actuation, on-device HMI, or physical function in pir.functions\"."
    - "SENSING present — five items: position, altitude, speed, velocity, tilt/motion (q.fn.senses)."
    - "ON-DEVICE HMI present — two items: multicolour LED and one multipurpose button (q.fn.shows)."
    - "PHYSICAL present — pir.physical.carry = mounted, size_class = phone, environment.where = vehicle: a concealed, sealed, vehicle-mounted object."
    - "ACTUATION absent — q.fn.acts: \"it does not do anything to the bike\" (negative-function; no item). The rule is a disjunction, so this does not weaken the flag."
    - "Three of the four disjuncts hold. TRUE."
  needs_firmware:
    - "Rule: \"needs_hardware AND any on-device logic (always true when needs_hardware, unless purely passive/analog)\"."
    - "needs_hardware = true (above)."
    - "On-device logic is explicit and non-trivial: offline autonomy (q.fn.offline \"no alerts but yes everything else\"), store-and-forward buffering with cloud backfill (q.fn.stores), a runtime-configurable sampling policy (q.fn.rate, configurable: true), and a multi-mode duty policy (pir.modes = wakes-on-event + wakes-on-schedule + only-when-used)."
    - "The purely-passive/analog exception does not apply — nothing about this product is passive."
    - "TRUE."

# ── HUMAN GATES (F5) ───────────────────────────────────────────────────
human_gates: []
# metric.risk.safety declares human_gate_when: serious; pir.compliance.safety
# is `none`, so no gate is raised. It is the only gate-bearing metric in v0.

# ── RECOMMENDATION (F4 — the machine recommends; the human decides G1) ─
recommendation:
  verdict: go
  rule_applied: 4
  rule_trace:
    - rule: 1
      condition: "any human gate open"
      result: not-met
      detail: "human_gates is empty; pir.compliance.safety = `none`, not `serious`."
    - rule: 2
      condition: "any core metric unknown"
      result: not-met
      detail: >-
        The five core metrics score amber/amber/amber/amber/green
        (economics, tech.exists, connectivity, power-risk, risk.safety).
        None is unknown. NOTE: this rule is the one the PIR's sell-field
        reading turns on — reading pir.targets.unit_cost.sell as UNKNOWN
        rather than ABSENT would make metric.viability.economics unknown and
        stop evaluation here with verdict `blocked`.
    - rule: 3
      condition: "any core metric red"
      result: not-met
      detail: "No metric of any weight scores red. The kill sub-clause is moot — metric.tech.exists is amber, and pir.novelty.magic is none-declared, so no stated magic exists to be refuted."
    - rule: 4
      condition: "otherwise"
      result: applied
      detail: "Verdict go. Every amber and every minor unknown named in reasons; P2-class ambers appended and marked non-verdict-bearing."
  blockers: []
  reasons:
    - "G0 STATE: the scored PIR FAILED gate G0. pir.constraints[zephyr-rtos].strength is UNKNOWN — \"zephyr rtos\" is an included volunteered-technology token under the constraint oracle and the required-tier ask-back q.constraint.strength was never spawned (runner_errors re.2). This does not enter the verdict rules (pir.constraints feeds no metric), but the recommendation below rests on a PIR that has not passed its gate. Fix: ask \"is zephyr rtos a requirement, or a preference?\" — the answer decides whether P4's fit matrix is filtered to Zephyr-supported silicon or merely tie-broken by it."
    - "AMBER (core) metric.viability.economics — the $100 build budget at 10-unit qty is tight, not impossible, for a cellular+GNSS+BLE+IMU+Li-ion BOM with PCB and assembly at that quantity. Scored on the not-for-sale branch (sell ABSENT)."
    - "AMBER (core) metric.tech.exists — no magic claimed, but four capabilities have ZERO catalog coverage (cellular modem, GNSS receiver, IMU, Li-ion charge path). All four are nameable in upstream Zephyr and in shipped products, which is why this is amber rather than red. Four research tasks are named in its evidence."
    - "AMBER (core) metric.feasibility.connectivity — two links must both close. phone-nearby is covered only at D1 by catalog/socs/esp32c6.yaml; far-away-anywhere is a hard cellular constraint that sits OUTSIDE both supported lanes with no catalog record at all. This is the single most consequential gap in the scorecard: it decides the P2 platform class and the P4 SoC choice."
    - "AMBER (core) metric.feasibility.power-risk — the floor is unbounded and therefore safe, but the 1-month delight target with 30-second GNSS fixes in motion and cellular reporting demands aggressive sleep design. The catalog's D1 power_states for esp32c6 cannot evidence the deep-sleep current that decides it; only a P6 measurement can."
    - "AMBER (minor) metric.viability.novelty — the differentiation is incremental and unverified against an occupied category; not load-bearing, since the product is not for sale."
    - "AMBER (minor) metric.feasibility.env-risk — `vibration` and `washing-or-hosing` are both selected on a concealed vehicle install. Known art, but the thermal extremes are UNQUANTIFIED: pir.environment.limits is UNKNOWN (q.followup.range spawned, unanswered), and `drops` was never presented to the founder at all (runner_errors re.1)."
    - "AMBER (minor) metric.feasibility.head-start — nothing exists; scored amber only because the timeline declares no pressure. If a date ever appears, this metric turns red without any other input changing."
    - "AMBER (minor) metric.risk.self-assessed — the founder's fears (antenna placement, multi-protocol coexistence, power) are the RIGHT fears, which is the good news; none of them is planned for, which is the amber."
    - "AMBER (minor) metric.risk.privacy — continuous vehicle-location history is regime-bearing personal data; single-owner scope keeps it contained."
    - "GREEN, for the record: metric.viability.clarity, metric.viability.outcome, metric.risk.schedule, metric.risk.safety."
