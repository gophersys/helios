  ref: /private/tmp/claude-501/-Users-mateo-code-research-embedded/071a7bd3-8c48-482e-a1db-7e333748e40f/scratchpad/repro/run3/iH/pir.yaml
  hash: sha256:2092417eec3a320f541c0618f2b448b023d2b33052645fe302c278766251ef75
