  zephyr_sha: 413b789deb391d3a37d06b463288a5fe765ee57e   # ws/west.yml -> v4.2.0
  records_available: 3
  note: "the catalog holds 2 SoC records (D1) and 1 component record (D2). The pinned Zephyr tree itself is NOT present in this worktree (ws/ contains only west.yml), so no path-@-SHA claim is made below that the catalog records do not carry. Upstream implementations are cited as NAMED examples per the 40-p1-metrics.md evidence bar, with extraction named as the research task."

scores:
  # ── VIABILITY ───────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.intent.what is one sentence naming the artefact, the job and the owner: \"a motorcycle gps tracker so that i know where my bike is at all times\""
      - "q.intent.who fixes the for-whom in three words: \"its just for me\" — green requires what it does AND for whom; both are in one sentence each"
      - "no contradiction across the transcript: every later answer (vehicle placement, location data, phone + wide-area link) restates the same product"

  - id: metric.viability.outcome
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.intent.win states four observable conditions: \"it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud\" — installed, running, notifying, tracking are each checkable by inspection"
      - "the outcome is reachable by the product as stated: every clause maps to a recorded function (hmi/compute on-device, connectivity phone-nearby + far-away-anywhere, storage backfill)"
      - "single-user success (\"its just for me\") removes adoption risk from the outcome — plausibility does not depend on a market"

  - id: metric.viability.economics
    score: unknown
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    blocked_by: [pir.targets.unit_cost.sell]
    evidence:
      - "derivation inputs: pir.targets.unit_cost.build = 100 USD per unit at qty 10, scope 'components + pcb + assembly', stated as an at-most bound; pir.targets.volume = {y1: 2, y3: 10}"
      - "pir.targets.unit_cost.sell is UNKNOWN, not ABSENT: the transcript carries no verbatim declaring not-for-sale, and q.comp.region (\"Where will it be sold first?\") was answered \"us only\". Per 30-p0-graph.yaml conditional_fields, silence is UNKNOWN and the runner must ask — it did not (pir.runner_errors[3])"
      - "the scale's three branches each require knowing the regime (sell > build, or the not-for-sale build-budget branch); with the regime unknown no branch can be selected, so the metric is unknown rather than defaulted"
      - "CONDITIONAL READ, for the human at G1: if the founder confirms not-for-sale, this metric becomes AMBER — the not-for-sale branch asks whether the budget is plausible for the BOM class, and 100 USD at qty 10 must cover a GNSS receiver, a cellular module + SIM, an IMU, a rechargeable cell + charger, a USB-C front end, an MCU with BLE, a potted enclosure AND pcb + assembly at a 10-unit run. Tight, not impossible: 'budget tight for the BOM class'. It does not become green, and it does not become red on the evidence available"

  - id: metric.viability.novelty
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "the founder concedes the category exists: \"yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that\""
      - "the stated difference (more powerful, more accurate location, alarm) is incremental and unverified — no named competitor and no measured gap; q.novel.moat is \"no compettiors\", which asserts absence rather than an advantage"
      - "not red: red is reserved for 'an existing product already is this', and the accuracy/power axis is a real if unproven difference. Not green: green needs a clear difference from NAMED existing products, and none are named"
      - "weight note: for a single-user build (\"its just for me\") novelty carries little decision value; it is a minor metric and colours the reasons only"

  # ── TECH-EXISTS (catalog seam) ──────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    blocked_by: []
    evidence:
      - "q.novel.magic claims nothing unproven: \"not really. i just wanan use the latest tech avialnle in the embedded world...\" — there is no magic capability to fail"
      - "capability map from pir.functions -> S1 vocabulary: sensing (position, altitude, speed/velocity, tilt), connectivity (phone-nearby + far-away-anywhere), storage, compute, hmi, power, security, time"
      - "catalog: catalog/socs/esp32c6.yaml @ 413b789d, depth D1 — covers connectivity (espressif,esp32-bt-hci; espressif,esp32-wifi; espressif,esp32-ieee802154), the sensor buses (espressif,esp32-i2c, espressif,esp32-spi, espressif,esp32-uart), storage (espressif,esp32-flash-controller + fixed-partitions + soc-nv-flash), hmi (espressif,esp32-gpio, espressif,esp32-ledc), security (espressif,esp32-trng), time (espressif,esp32-rtc_timer, espressif,esp32-systimer), the usb-c hard constraint (espressif,esp32-usb-serial) and power (zephyr,power-state: standby 200 us min-residency / 60 us exit, soft-off 2000/212)"
      - "catalog: catalog/socs/mimxrt1052.yaml @ 413b789d, depth D1 — lane A, declares NO radio compatible; it cannot serve this product's connectivity without external transceivers, so lane B is the only catalog lane in play"
      - "catalog: catalog/components/bosch,bme280.yaml @ 413b789d, depth D2 — binding + driver (drivers/sensor/bosch/bme280) + 19 exercised_by entries; barometric altitude is the ONE stated sense with a D2 path in the catalog today"
      - "GAP (research task): no catalog record for a GNSS receiver, a cellular modem, an accelerometer/IMU, or a battery charger/fuel gauge — catalog/components holds exactly one record. NAMED examples per the evidence bar: upstream Zephyr ships a GNSS subsystem with in-tree NMEA receiver drivers (u-blox M8/M10, Quectel LC26G/LC86G) and a modem_cellular driver family (Quectel BG95/BG96, u-blox SARA-R4/R5, SIMCom), and the sensor tree carries accelerometers of the same record shape as the bme280 above. Shipped product class: aftermarket LTE-M/NB-IoT motorcycle trackers (Monimoto, Invoxia). These names are NOT verified against the pinned tree from this instance (ws/ holds only west.yml) — verifying them by extraction IS the research task"
      - "score rationale: every needed capability has a path, but the best catalog coverage for the core radio/GNSS chain is D1-or-absent, which the catalog seam scores amber ('a path exists but unproven here'). Green would need D2+ or a shipped path in the catalog; red would need a capability with no known working example, and none is"
    research_tasks:
      - "extract a GNSS receiver record (component) at the pinned SHA — the single highest-value catalog gap for this product"
      - "extract a cellular modem record (component) at the pinned SHA — closes the far-away-anywhere lane and the `cellular` hard constraint"
      - "extract an accelerometer/IMU record for the tilt alert path"
      - "extract a charger / fuel-gauge record for the PC1 + usb-c path"
      - "raise catalog/socs/esp32c6.yaml above D1 for the radio lanes (declared != supported)"

  # ── FEASIBILITY ─────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.env.where = vehicle, with concealment demanded: \"tucked away somehwere hidden ... protecetd from wethar ... not easily seen by someone if the bike is stolen\""
      - "q.env.conditions = [water, dust, heat, cold, vibration, washing-or-hosing] — the scale names `washing-or-hosing` and `vibration` explicitly as hard conditions; BOTH are present, which is the amber clause verbatim"
      - "known art: sealed/potted enclosure, gasketed or sealed USB-C entry, conformal coat, vibration-rated mounting. Costed and ordinary for vehicle telematics — not red"
      - "RISK carried, not scored: pir.environment.limits is UNKNOWN (q.followup.range asked, never answered), so no temperature range bounds the design. A concealed enclosure on a motorcycle can see engine-adjacent heat and winter cold, and the cell chemistry's charge window is decided by that range. The metric's own feeds (q.env.where, q.env.conditions) are both answered, so the score is amber, not unknown"
      - "SECOND-ORDER RISK: `drops` was never presented to the founder (pir.runner_errors[0]), so drop/shock exposure for a vehicle-mounted device is unassessed"

  - id: metric.feasibility.connectivity
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    blocked_by: []
    evidence:
      - "q.fn.talks = [phone-nearby, far-away-anywhere]: \"i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that\" — two counterparts at two distances, so two links must coexist"
      - "derived links (R3 — the founder never picked a radio): a short-range personal-area link for phone-nearby, and a wide-area licensed link for far-away-anywhere. The founder's `cellular` is recorded as a HARD constraint (pir.constraints[0]), which fixes the wide-area lane at P4 rather than deriving it"
      - "catalog: catalog/socs/esp32c6.yaml @ 413b789d, depth D1 — espressif,esp32-bt-hci covers the phone-nearby link inside supported lane B, but at D1 (declared, not proven). The catalog seam scores D1-only coverage AMBER by rule"
      - "catalog: NO record covers a wide-area/cellular link — catalog/components holds one record (a sensor). Zero coverage. NAMED examples per the evidence bar: Zephyr's in-tree modem_cellular driver family (Quectel BG95/BG96, u-blox SARA-R4/R5, SIMCom) and the shipped LTE-M/NB-IoT asset-tracker product class. Named example + zero catalog coverage = amber with a research task, never red"
      - "coexistence risk, named: two radios plus GNSS reception inside a concealed metal-adjacent enclosure, with the founder expecting the antenna to \"just work\" — this is the founder's own top fear (q.novel.hard) and it belongs to P5 (RF front-end and antenna are declared P3 holes)"
      - "not red: red requires that no radio reaches the stated counterpart at the stated distance and power, and both links are ordinary art. Not green: green needs D2+ catalog coverage of the derived link, and the wide-area lane has none"
    research_tasks:
      - "extract a cellular modem component record at the pinned SHA and bind it to a supported SoC lane"
      - "raise esp32c6 BLE coverage above D1 (build/run proof) before the connectivity metric can be green"

  - id: metric.feasibility.power-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    blocked_by: []
    evidence:
      - "inputs: q.power.source = charges-on-dock-or-cable -> power_class PC1; q.power.life = {delight: \"1 month+\", floor: none-declared}; q.power.duty -> modes [wakes-on-event, wakes-on-schedule, only-when-used]"
      - "RED is unreachable by derivation here: red is 'floor target violates the stated power class', and the floor is none-declared — \"no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours\". There is no floor to violate, so the red clause cannot fire"
      - "AMBER clause matches verbatim ('delight target requires aggressive sleep design; floor reachable'): 1 month+ on a rechargeable pack while a GNSS fix runs every 30 s in motion, a scheduled fix runs hourly parked, and a wide-area radio must be reachable for alerts — that budget only closes with aggressive duty cycling (PSM/eDRX-class radio sleep, GNSS hot-start policy, an accelerometer wake source rather than a polled loop)"
      - "the duty answer already assumes that design: \"theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs\" — an intent, not a proven budget"
      - "the founder offers a mitigation that changes the class in practice but not on paper: an optional bike-battery -> USB-C feed, \"that way the device is always cajhrged in thi scenario\". PC1 is recorded from the stated source; the always-powered variant is a P3 power-budget branch, not a re-derivation"
      - "P3 will need what the catalog does not yet carry: catalog/socs/esp32c6.yaml lists power states (standby, soft-off) but capability-index v0 does not extract wakeup-source or CONFIG_PM_DEVICE coverage, so no residency arithmetic is possible from the catalog today"

  - id: metric.feasibility.head-start
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.time.exists = [nothing] — \"nothing\": no sketches, no model, no prototype, no code, no factory contact, no funding"
      - "the second amber clause applies exactly: 'nothing exists but the timeline carries no pressure' — pir.timeline.proto and .production are both none-declared (\"no rush ... correctness over speed\", \"no deadline\")"
      - "not red: red is 'nothing — and the timeline assumes otherwise', and no timeline assumes otherwise"

  # ── RISK ────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    blocked_by: []
    evidence:
      - "q.time.proto = none-declared: \"no rush we are just testing out the system, correctness over speed, can optimize later\""
      - "q.time.prod = none-declared: \"no deadline\""
      - "the scale's green branch for this exact case, stated as required: no dates declared -> NO SCHEDULE RISK IS ASSERTED. This is green by absence of a constraint, not by evidence of slack; if a date ever lands, this metric must be re-scored"

  - id: metric.risk.self-assessed
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.novel.hard: \"antenna placement, multipel protocols, pjone connecton and poower\" — four fears"
      - "the fears are placed RIGHT: a concealed, weather-sealed, metal-adjacent enclosure carrying GNSS + a wide-area radio + a phone link, on a 1-month budget, makes antenna placement, radio coexistence and the power budget the genuinely hard parts. This matches what the other metrics independently flagged (connectivity coexistence, power-risk)"
      - "no plan exists for any of them: q.time.exists = [nothing], no RF experience is claimed, and antenna/RF front-end is a declared P3 HOLE owned by P5. 'The fear is real but unplanned-for' is the amber clause verbatim"
      - "one hard part the founder did NOT name, recorded so it is not unseen: enclosure sealing + thermal, against an UNKNOWN temperature range (pir.environment.limits)"

  - id: metric.risk.safety
    score: green
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate: not-raised
    blocked_by: []
    evidence:
      - "q.comp.safety = none (required tier, answered): \"no, just hopefully not explode lol\" — the founder's own classification is `none`, and green is 'no plausible harm path'"
      - "human_gate_when: serious — not met, so NO human gate is raised and verdict rule 1 does not fire (F5)"
      - "the derived score follows the founder's enum and does not overwrite it. Recorded for the human at G1, not scored: the aside names a Li-ion hazard, and this is a rechargeable pack charged from a vehicle rail, mounted on a vehicle, in an enclosure with an UNKNOWN temperature range. Charge-window protection is a P5 requirement whatever this metric says"

  - id: metric.risk.privacy
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    blocked_by: []
    evidence:
      - "q.comp.data = [location]: \"yes, whatver info it has about location bascially\""
      - "the scale names location explicitly in the amber clause: 'personal data with known regimes (location, voice)'. Not red — red is health/identity data without a compliance plan, and neither is collected"
      - "scope note (not a score change): single user, \"its just for me\", and pir.compliance.regions = [us] -> certifications [fcc]. The location trail is continuously uploaded to a cloud (q.intent.win, q.fn.stores), so the regime attaches to the cloud side too"

  # ── PLATFORM (consumer P2 — never bears on the P1 verdict) ──────────
  - id: metric.platform.edge-autonomy
    score: amber
    consumer: P2-class
    scored_by: agent
    blocked_by: []
    evidence:
      - "q.fn.offline (opened by q.fn.talks, answered): \"no alerts but yes everything else\""
      - "'degrades offline in acceptable ways' is the amber clause verbatim, and the founder himself declares the degradation acceptable — sampling, logging and buffering continue, only alerting stops"
      - "the storage answer proves the offline-first shape: \"even hit low power modes and save things if no location, then backtrack to the cloud\" — store-and-forward with backfill"
      - "not green: the theft ALERT — the product's reason to exist while the bike is being stolen — is exactly the function that dies without a link, so the device is not simply 'fine offline'. Not red: it is far from 'dead without the cloud'"
      - "P2 consequence: non-volatile buffering + a time source + a backfill protocol are firmware requirements, not cloud features"

  - id: metric.platform.hmi-class
    score: green
    consumer: P2-class
    scored_by: derived
    blocked_by: []
    evidence:
      - "q.fn.shows = a-light: \"no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too\""
      - "q.phys.controls = one-button: \"1 button and 1 led/led ring, something clean that will lookj high end\""
      - "LED + one button is the green clause verbatim ('none/LED/sound — lane B territory'); no screen and no control count that would push this to the boundary"

  - id: metric.platform.compute-demand
    score: green
    consumer: P2-class
    scored_by: derived
    blocked_by: []
    evidence:
      - "absent_when does NOT hold: q.fn.rate spawned twice (position, tilt/motion), so the metric is scored, not ABSENT"
      - "derivation applied mechanically ('green when every stated rate period >= 1 s and no continuous stream processing'): stated periods are 1 h (parked), 30 s (moving), and \"within seconds\" (tilt detect). None is sub-second; there is no stream to process"
      - "JUDGMENT STATED: \"if an alert it must be as quick as possible\" bounds nothing. It is an event-response latency, not a rate period, and the natural implementation is an accelerometer interrupt rather than a polled loop — so it does not make a sub-second LOOP. If P2 later reads it as a hard sub-second requirement, this metric moves to amber"
      - "COVERAGE GAP: the rates for altitude, speed and velocity were never asked (pir.runner_errors[1]), so this green rests on two of five stated senses. Position at 30 s is the fastest sense in the record; a speed/velocity requirement could raise it"

# ── derived flags (consumer P2) ───────────────────────────────────────
derived:
  needs_hardware: true
  needs_firmware: true

derived_evidence:                    # F3 applies to the flags too
  needs_hardware:
    - "rule: 'any sensing, actuation, on-device HMI, or physical function in pir.functions'"
    - "sensing: five senses named — \"ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that\""
    - "on-device HMI: \"no screen, maybe a multicolo led to signal states ... naybe 1 multipurpos ebutton too\""
    - "physical: mounted in a vehicle, size bound `phone`, with a battery and a USB-C connector (pir.physical, pir.power_class PC1)"
    - "actuation is NOT part of this evidence: q.fn.acts = \"it does not do anything to the bike\" produces no actuation item"
  needs_firmware:
    - "rule: 'needs_hardware AND any on-device logic (always true when needs_hardware, unless purely passive/analog)'"
    - "needs_hardware is true, and the device is nowhere near passive/analog: it must run offline (\"no alerts but yes everything else\"), keep state across power loss and backfill it (\"save things if no location, then backtrack to the cloud\"), switch sampling policy under a power preference, and drive two radio stacks"

human_gates: []                      # q.comp.safety = none -> no structural
                                     # gate raised (F5); metric.risk.safety is
                                     # green and rule 1 does not fire

# ── recommendation (F4 — the machine recommends only) ─────────────────
recommendation:
  verdict: blocked
  rule_applied: "rule 2 — 'any core metric unknown -> verdict blocked'. Rule 1 was evaluated first and did not fire (human_gates is empty; q.comp.safety = none). Evaluation STOPS at rule 2; rules 3 and 4 were not applied, and their content is reported in reasons below as the contract requires."
  blockers:
    - metric: metric.viability.economics
      score: unknown
      blocked_by: [pir.targets.unit_cost.sell]
      answered_by: "one ask to the founder: 'what price sells it — or is it not for sale?' An explicit not-for-sale makes the field ABSENT and the metric scoreable on the build-budget branch (conditional read in that metric's evidence: amber). A stated price makes it scoreable on the margin branch."
  reasons:
    - "G0 STATE (carried, never hidden): the PIR is G0 = BLOCKED. pir.constraints[zephyr rtos].strength is UNKNOWN at required tier — the founder volunteered an operating system (\"using zephyr rtos as a poc for ai hardware building\") and the runner never made the q.constraint.strength ask-back that the constraint oracle requires. One question clears it: 'is zephyr rtos a requirement, or a preference?'"
    - "NO CORE METRIC IS RED, so rule 3 would not have recommended pivot or kill. metric.tech.exists is amber, not red, and the founder claims no magic (\"not really\"), so the kill clause (tech.exists red AND the magic IS the stated differentiation) is doubly unmet"
    - "what rule 4 would have said, had economics been answered: GO with these ambers named — metric.tech.exists (catalog D1 or no coverage for the GNSS/cellular chain), metric.feasibility.connectivity (two coexisting links; wide-area lane has zero catalog coverage), metric.feasibility.power-risk (1 month+ delight needs aggressive sleep design; floor is none-declared so nothing is violated), metric.feasibility.env-risk (washing-or-hosing AND vibration, with no stated temperature range), metric.feasibility.head-start (nothing exists, but no timeline pressure), metric.risk.self-assessed (the right fears, no plan), metric.risk.privacy (location data, US/FCC), metric.viability.novelty (incremental and unverified difference)"
    - "P2-class ambers, appended and NON-VERDICT-BEARING: metric.platform.edge-autonomy amber — the theft alert is the one function that dies without a link"
    - "MINOR-METRIC UNKNOWNS: none. All 15 non-blocking metrics carry a score"
    - "OTHER PIR UNKNOWNS carried into the reasons (they block no metric): pir.environment.limits (no temperature range for a concealed vehicle enclosure — the driver of enclosure, cell chemistry and charge-window design) and pir.functions[sensing.tilt].rate.configurable"
    - "RUNNER CONFORMANCE affecting the scores: `drops` and \"none\" were never presented on q.env.conditions, so drop/shock is unassessed; q.fn.rate was not spawned for altitude, speed or velocity, so metric.platform.compute-demand rests on two of five stated senses"
    - "SAFETY, recorded though the metric is green: the founder's own \"hopefully not explode lol\" names a Li-ion hazard on a vehicle-mounted, vehicle-charged pack with an unknown temperature range. No human gate is raised (q.comp.safety = none) and the machine does not raise one it was not given — but P5 owns charge-window protection regardless"

decision:                            # F4 — G1 is the HUMAN's call, recorded
  verdict:                           # with their verbatim words (R4).
  by:                                # Left empty by the machine, on purpose.
  quote:
  at:
