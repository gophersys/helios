# Product Intent Record — extracted from the frozen interrogation transcript.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5) + docs/sfd/30-p0-graph.yaml
# (tiers, opens, conventions, constraint_oracle, derivations, consistency).
# Every value below cites its question id + the founder's VERBATIM words (R4).
# Typos in quotes are the founder's and are preserved deliberately.
schema: sfd.pir/v0
product: tracker
source: repro/transcript.yaml   # frozen input, 2026-08-26; answers verbatim

# ── S1 INTENT ─────────────────────────────────────────────────────────
summary: "A motorcycle GPS tracker for the owner's own bike: it reports the bike's location continuously so the owner always knows where it is."
users: "The founder alone (a single owner-operator of his own motorcycle); possibly a handful of friends later. No third-party user population."

# ── FUNCTIONS — S1's CLOSED capability vocabulary ─────────────────────
# connectivity · sensing · actuation · storage · compute · hmi · power ·
# security · time.  R4: provenance is PER ITEM, inline.
# Adaptive q.fn.rate answers attach as `rate` per the rate-attachment
# convention: {periods per condition, configurable} + own question/quote/at.
functions:
  - capability: sensing
    detail: "position (location), accurately"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        parked: {value: 1, unit: hour}
        moving: {value: 30, unit: second}
      configurable: true          # software may retune by power preference
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"
      spawned_for: position

  - capability: sensing
    detail: "altitude"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                  # unspawned adaptive — no q.fn.rate was asked
                                  # for this sense (runner_error RE-004)

  - capability: sensing
    detail: "speed and velocity"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                  # unspawned adaptive (runner_error RE-004)

  - capability: sensing
    detail: "tilt / motion (alarm trigger)"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        detect: {value: "within seconds", unit: second}
        alert: "as quick as possible"      # verbatim bound; no number given
      configurable: false         # not stated as configurable by the founder
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"
      spawned_for: tilt/motion

  - capability: connectivity
    detail: "phone-nearby — the owner's phone connects to the device directly when close by"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: "far-away-anywhere — location reaches the owner/cloud from any location (wide-area link)"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
    # the radio itself is NEVER user-chosen (R3); the founder's volunteered
    # "cellular" rides in constraints[], not here.

  - capability: storage
    detail: "retain fixes and state across power loss; buffer while no location/uplink, then backfill to the cloud"
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: hmi
    detail: "a-light — one multicolour LED / LED ring signalling device state; no screen"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"
    # the button is recorded in physical.controls: q.phys.controls feeds
    # pir.physical.controls + metric.platform.hmi-class, NOT pir.functions.

  - capability: compute
    detail: "edge autonomy — everything except alerts must keep working with no internet (log, store, backfill later)"
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  # ── derived capabilities (derived-items convention: no quote, no question)
  - capability: security
    detail: "baseline security"
    source: derived
    rule: capability.security     # q.fn.talks != nothing AND q.comp.data != none

  - capability: time
    detail: "timekeeping / scheduled wake"
    source: derived
    rule: capability.time         # q.power.duty includes wakes-on-schedule

  - capability: power
    detail: "PC1 + modes [wakes-on-event, wakes-on-schedule, only-when-used]"
    source: derived
    rule: capability.power        # always present = power_class + modes

  # NO actuation item: q.fn.acts answered in the negative (negative-function
  # convention). The answer satisfies the feed via provenance.pir.functions.

# ── S2 ENVIRONMENT ────────────────────────────────────────────────────
environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  # multi-affirmation: binds ONLY to the six values the runner PRESENTED.
  # `drops` and "none" were never presented -> runner_error RE-001; their
  # state is NOT established by this answer.
  limits: UNKNOWN                 # q.followup.range spawned (how hot / how
                                  # cold) and left unanswered — see unknowns
  on_body: "no"

# ── S4 POWER (derived) ────────────────────────────────────────────────
power_class: PC1                  # derivation pir.power_class:
                                  # charges-on-dock-or-cable -> PC1
modes: [wakes-on-event, wakes-on-schedule, only-when-used]
# enum-values-as-given. "always-on" was NOT selected. "akwas on schel" is
# read as "always on schedule" = wakes-on-schedule (see runner note below).

# ── TARGETS ───────────────────────────────────────────────────────────
targets:
  success: "Installed and running on the bike, pushing notifications to the owner's phone and tracking the bike's location in the cloud."
  battery_life:                   # CONDITIONAL: present iff power_class in
    delight: {value: 1, unit: month, bound: at-least}   # [PC0, PC1] — PC1 here
    floor: none-declared          # "no lowest threshold"; an hours-scale
                                  # high-performance/racing mode is acceptable
  unit_cost:
    build: {amount: 100, currency: USD, bound: at-most, at_quantity: 10, includes: "components + pcb + assembly"}
    sell: UNKNOWN                 # conditional_fields: sell is present iff an
                                  # intent to sell is STATED; an explicit
                                  # not-for-sale is ABSENT; SILENCE is UNKNOWN
                                  # and the runner must ask. The founder stated
                                  # neither — the runner never asked (RE-003).
  volume: {y1: 2, y3: 10}

# ── S5 PHYSICAL ───────────────────────────────────────────────────────
physical:
  size_class: phone               # bound-asks: the STATED bound is "no bigger
                                  # than a small phone"; "deck of cards is ok"
                                  # is an accepted smaller size, not the bound
  dims: ABSENT                    # unspawned adaptive: q.followup.range was not
                                  # spawned off q.phys.size (phone is not a
                                  # tight pick)
  carry: mounted                  # carry-placement: hidden/tucked placement
                                  # counts as mounted (both are fixed installs)
  controls: one-button
  notes: "Concealment is a requirement of the placement, not of the enclosure class: tucked away, hidden, not visible, not easily seen by a thief, and weather-protected. Mounting may use an adapter. The founder expects the antenna to 'just work' from that hidden position."

# ── S7 TIMELINE + EXISTING ────────────────────────────────────────────
timeline:
  proto: none-declared            # "no rush ... correctness over speed"
  production: none-declared       # "no deadline"
assets: [nothing]

# ── S8 NOVELTY ────────────────────────────────────────────────────────
novelty:
  different: "Competing trackers exist; the founder wants to build his own to be more powerful, using current technology for accurate location plus an alarm."
  hard: "Antenna placement; running multiple protocols at once; the phone connection; and power."
  magic: "Nothing unproven is claimed. The stated intent is to use the latest embedded technology and Zephyr RTOS as a proof of concept for AI-assisted hardware building."
  moat: "None claimed — the founder states there are no competitors (for his own use case)."

# ── S9 COMPLIANCE ─────────────────────────────────────────────────────
compliance:
  regions: [us]
  safety: "none"                  # verbatim answer is "no"; the "not explode"
                                  # remark is a joke, not a stated harm path
  personal_data: [location]
  certifications: [fcc]           # derived from regions: us -> fcc

# ── CONSTRAINTS — volunteered technology (R3's channel) ───────────────
constraints:
  - tech: cellular
    strength: hard                # "requiemrnt" = requirement -> hard
    quote: "requiemrnt"
    volunteered_quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  - tech: usb-c
    strength: hard
    quote: "requirement"
    volunteered_quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    at: "2026-08-26"
  - tech: zephyr-rtos
    strength: UNKNOWN             # constraint_oracle includes operating
                                  # systems (zephyr rtos); NO q.constraint.
                                  # strength ask-back was spawned -> required
                                  # tier UNKNOWN -> HARD-BLOCKS G0 (RE-002)
    quote: UNKNOWN                # no classification answer exists
    volunteered_quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"

# ── R5 — UNKNOWN is data ──────────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr-rtos].strength
    blocks: []                    # q.constraint.strength feeds pir.constraints
                                  # only — no metric id
    tier: required
    gate: G0                      # required-tier UNKNOWN blocks even with an
                                  # empty blocks list
    note: "constraint_oracle: 'zephyr rtos' is an INCLUDED volunteered token (operating systems). The rule is explicit: every included token gets q.constraint.strength, and an unclassified included token is UNKNOWN and blocks G0. The runner never asked. Answered by asking the founder: requirement or preference?"
  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    tier: scoring
    note: "conditional_fields for pir.targets.unit_cost.sell: present iff an intent to sell is stated; an EXPLICIT not-for-sale is ABSENT; silence is UNKNOWN and the runner must ask. 'its just for me' and '2, and maybe 10 for my freinds' state the user population, not a sale decision — that is silence on sale intent, not an explicit not-for-sale declaration. Answered by the founder stating a sell price OR declaring not-for-sale (which would make this field ABSENT and unblock metric.viability.economics via its not-for-sale scale branch)."
  - field: pir.environment.limits
    blocks: []                    # q.followup.range feeds pir.environment.limits
                                  # and pir.physical.dims — no metric id
    tier: scoring
    note: "The heat/cold follow-up was asked and left blank. metric.feasibility.env-risk is fed by q.env.where + q.env.conditions (both answered) so it is not blocked, but its extremes cannot be calibrated: no operating temperature range exists for a device that must survive a motorcycle in US summer and winter. Answered by numeric hot/cold limits."

# ── G0 ────────────────────────────────────────────────────────────────
g0:
  status: blocked
  blockers:
    - "pir.constraints[zephyr-rtos].strength is UNKNOWN — q.constraint.strength is REQUIRED tier and an unclassified volunteered technology hard-blocks the gate (constraint_oracle rule; G0 condition 1)."
  checks:                         # G0's five conditions, stated exactly
    - condition: 1
      name: "every reachable required question answered"
      result: red
      detail: "All 13 reachable required FIXED questions are answered (q.fn.offline and q.power.life were both opened and both answered). The REQUIRED adaptive q.constraint.strength was spawned and answered for `cellular` and `usb-c` but was never spawned for `zephyr rtos`, which the constraint_oracle includes."
    - condition: 2
      name: "every UNKNOWN listed with the metrics it blocks (R5)"
      result: green
      detail: "3 unknowns recorded above, each with blocks[], tier and what answers it."
    - condition: 3
      name: "no consistency rule red"
      result: green
      detail: "see consistency[] below — the one v0 rule does not fire."
    - condition: 4
      name: "the graph itself lints clean (`sfd graph lint`)"
      result: not-evaluated
      detail: "NOT RUN by this stage — extraction+scoring has no access to tools/sfd or gate.sh. Stated rather than assumed: this condition is unverified here, not passed."
    - condition: 5
      name: "q.comp.safety = serious raises a human gate"
      result: green
      detail: "q.comp.safety = none. No human gate raised."

# ── consistency (per-rule result) ─────────────────────────────────────
consistency:
  - id: c.app-needs-link
    result: pass
    fired: false
    detail: "Requires q.fn.talks == nothing AND q.phys.controls == only-an-app. Actual: q.fn.talks = [phone-nearby, far-away-anywhere], q.phys.controls = one-button. Both antecedents false; every referenced answer is present, so the rule was evaluable and is green."

# ── runner errors (convention violations and missed ask-backs) ────────
runner_errors:
  - id: RE-001
    question: q.env.conditions
    kind: multi-affirmation-violation
    detail: "The runner presented 6 of the question's 8 values (water, dust, heat, cold, vibration, washing-or-hosing) and omitted `drops` and \"none\". The founder's 'yes all the ones suggested' binds ONLY to what was presented, so environment.conditions carries six values and the state of `drops` is NOT established by this interrogation."
  - id: RE-002
    question: q.novel.magic
    kind: missed-ask-back
    detail: "'zephyr rtos' is a volunteered technology the constraint_oracle explicitly INCLUDES (operating systems). No q.constraint.strength was spawned. This is the sole G0 blocker."
  - id: RE-003
    question: q.scale.cost
    kind: missed-ask-back
    detail: "q.scale.cost is a pair (build, sell). The founder answered the build half only. conditional_fields requires the runner to ask when the founder is silent on sale intent; it did not, leaving pir.targets.unit_cost.sell UNKNOWN and the CORE metric.viability.economics unscoreable."
  - id: RE-004
    question: q.fn.senses
    kind: missed-ask-back
    detail: "q.fn.rate spawns 'once per named sense/act'. Five senses were named (position, altitude, speed, velocity, tilt); only two spawns occurred (position, tilt/motion). Altitude and speed/velocity carry rate ABSENT. Mitigating reading: the runner may have grouped altitude/speed/velocity into the position family, which shares one GNSS sampling cadence — but the grouping was never recorded, so it is logged as a defect rather than assumed."
  - id: RE-005
    question: q.power.duty
    kind: transcription-ambiguity
    detail: "'akwas on schel' is read as 'always on schedule' -> wakes-on-schedule. The alternative reading 'always-on' + 'schedule' would add always-on to modes and change metric.feasibility.power-risk from amber toward red. The chosen reading follows the sentence's own structure ('wake on event, and ... and only when used' — three list items) and the founder's explicit power-saving intent in the same sentence."

# ── R4 provenance — per field; a LIST when multi-fed ──────────────────
provenance:
  pir.summary:
    - {question: q.intent.what, quote: "a motorcycle gps tracker so that i know where my bike is at all times", at: "2026-08-26"}
  pir.users:
    - {question: q.intent.who, quote: "its just for me", at: "2026-08-26"}
    - {question: q.scale.units, quote: "2, and maybe 10 for my freinds", at: "2026-08-26"}
  pir.functions:
    # sensing/connectivity/storage/hmi/compute items carry provenance INLINE
    # above (R4). This entry records the NEGATIVE answer, which produces no
    # item yet satisfies the feed (negative-function convention).
    - {question: q.fn.acts, quote: "it does not do anything to the bike", at: "2026-08-26", note: "negative-function: no actuation item"}
  pir.novelty.different:
    - {question: q.intent.exists, quote: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that", at: "2026-08-26"}
  pir.novelty.hard:
    - {question: q.novel.hard, quote: "antenna placement, multipel protocols, pjone connecton and poower", at: "2026-08-26"}
  pir.novelty.magic:
    - {question: q.novel.magic, quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building", at: "2026-08-26"}
  pir.novelty.moat:
    - {question: q.novel.moat, quote: "no compettiors", at: "2026-08-26"}
  pir.targets.success:
    - {question: q.intent.win, quote: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud", at: "2026-08-26"}
  pir.targets.battery_life:
    - {question: q.power.life, quote: "ideally last 1 month + in battery power, with an optional on-bike chrager from bikes battery -> usb c power, that way the device is always cajhrged in thi scenario, or if the user doesnt wanan do that, they can just cahrge it every so foten", at: "2026-08-26", fills: delight}
    - {question: q.power.life, quote: "no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours, could be used for racing", at: "2026-08-26", fills: floor, note: "floor follow-up; declared-none"}
  pir.targets.unit_cost:
    - {question: q.scale.cost, quote: "i dont wanna spend more than $100 on components + pcb + assembly per unit at 10 unit qty.", at: "2026-08-26", fills: build, note: "sell half never answered and never asked — UNKNOWN"}
  pir.targets.volume:
    - {question: q.scale.units, quote: "2, and maybe 10 for my freinds", at: "2026-08-26"}
  pir.environment.where:
    - {question: q.env.where, quote: "in the vehicle, hopefully tucked away somehwere hidden so that its not visible and is protecetd from wethar, as well as not easily seen by someone if the bike is stolen so i can track it", at: "2026-08-26"}
  pir.environment.conditions:
    - {question: q.env.conditions, quote: "yes all the ones suggested", at: "2026-08-26", presented: [water, dust, heat, cold, vibration, washing-or-hosing], note: "partial presentation — runner_error RE-001"}
  pir.environment.limits:
    - {question: q.followup.range, quote: "", at: "2026-08-26", note: "spawned off q.env.conditions (heat/cold); asked, not answered -> UNKNOWN"}
  pir.environment.on_body:
    - {question: q.env.body, quote: "nope", at: "2026-08-26"}
  pir.power_class:
    - {question: q.power.source, quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection", at: "2026-08-26", note: "derived: charges-on-dock-or-cable -> PC1"}
  pir.modes:
    - {question: q.power.duty, quote: "wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs", at: "2026-08-26", note: "see runner_error RE-005 for the 'akwas on schel' reading"}
  pir.physical.size_class:
    - {question: q.phys.size, quote: "no bigger than a small phone ideally, deck of cards is ok", at: "2026-08-26", note: "bound-asks -> phone"}
  pir.physical.dims:
    - {question: q.followup.range, quote: ABSENT, at: "2026-08-26", note: "not spawned off q.phys.size — ABSENT, not UNKNOWN"}
  pir.physical.carry:
    - {question: q.phys.carry, quote: 'it can be mounted with an adapter, but also just hidden and "tucked" somewhere, ideally antenann "just works"', at: "2026-08-26", note: "carry-placement -> mounted"}
  pir.physical.controls:
    - {question: q.phys.controls, quote: "1 button and 1 led/led ring, something clean that will lookj high end", at: "2026-08-26"}
  pir.timeline.proto:
    - {question: q.time.proto, quote: "no rush we are just testing out the system, correctness over speed, can optimize later", at: "2026-08-26", note: "declared-none-general -> none-declared"}
  pir.timeline.production:
    - {question: q.time.prod, quote: "no deadline", at: "2026-08-26", note: "declared-none -> none-declared"}
  pir.assets:
    - {question: q.time.exists, quote: "nothing", at: "2026-08-26", note: "enum-values-as-given: [nothing] stays [nothing]"}
  pir.compliance.regions:
    - {question: q.comp.region, quote: "us only", at: "2026-08-26"}
  pir.compliance.safety:
    - {question: q.comp.safety, quote: "no, just hopefully not explode lol", at: "2026-08-26", note: "answer value = none"}
  pir.compliance.personal_data:
    - {question: q.comp.data, quote: "yes, whatver info it has about location bascially", at: "2026-08-26"}
  pir.compliance.certifications:
    - {question: q.comp.region, quote: "us only", at: "2026-08-26", note: "derived: us -> [fcc]; never asked (R3)"}
  pir.constraints:
    # constraints[] carries both verbatims per item, inline above (R4).
    - {question: q.constraint.strength, quote: "requiemrnt", at: "2026-08-26", item: cellular}
    - {question: q.constraint.strength, quote: "requirement", at: "2026-08-26", item: usb-c}
    - {question: q.constraint.strength, quote: UNKNOWN, at: "2026-08-26", item: zephyr-rtos, note: "never spawned — runner_error RE-002"}
