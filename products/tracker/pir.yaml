    detail: GNSS position, accurate
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: 2026-08-26
    rate:
      periods: {parked: "1/h", moving: "1/30s"}
      configurable: true
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: 2026-08-26
  - capability: sensing
    detail: altitude
    question: q.fn.senses
    quote: "altitude"
    at: 2026-08-26
    rate: ABSENT               # unspawned adaptive (runner_errors re.4)
  - capability: sensing
    detail: speed / velocity
    question: q.fn.senses
    quote: "speed, velocity"
    at: 2026-08-26
    rate: ABSENT               # unspawned adaptive (runner_errors re.4)
  - capability: sensing
    detail: tilt / motion (theft wake + race telemetry)
    question: q.fn.senses
    quote: "tilt, things like that"
    at: 2026-08-26
    rate:
      periods: {reaction: "within seconds; alert as quick as possible"}
      configurable: false      # not stated — convention default
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: 2026-08-26
  - capability: connectivity
    detail: phone nearby, easy local connection
    question: q.fn.talks
    quote: "ideally i want my pohone to easily connect to it nearby"
    at: 2026-08-26
  - capability: connectivity
    detail: far away, anywhere — location always reaches the cloud
    question: q.fn.talks
    quote: "from anywehre ... but also always know the locaiton based on cellular or smth like that"
    at: 2026-08-26
  - capability: storage
    detail: offline track buffer, backfill to cloud on reconnect
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: 2026-08-26
  - capability: compute
    detail: "offline behavior (edge autonomy): no alerts required offline; everything else keeps working"
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: 2026-08-26
  - capability: hmi
    detail: one multicolor LED (or ring), state signalling; no screen
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best"
    at: 2026-08-26
  - capability: hmi
    detail: one multipurpose button
    question: q.fn.shows
    quote: "naybe 1 multipurpos ebutton too"
    at: 2026-08-26
  # Discovered by chat; no graph question covers firmware update yet
  # (traversal finding 3 — graph vNEXT):
  - capability: security
    detail: firmware update over USB-C ("updatable")
    question: q.power.source
    quote: "easily rechargeable/updatetbale all things over a usb c connection"
    at: 2026-08-26
  # Derived capabilities — derived-items convention:
  - capability: security
    detail: baseline (connected product + personal data)
    source: derived
    rule: capability.security
  - capability: time
    detail: scheduled wake (guard-mode fix schedule)
    source: derived
    rule: capability.time
  - capability: power
    detail: power_class + modes (always present)
    source: derived
    rule: capability.power

environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  limits: {}                   # UNKNOWN — see unknowns
  on_body: "no"

power_class: PC1               # derived: charges-on-dock-or-cable → PC1

modes:                         # q.power.duty selections, as given
  - wakes-on-event
  - wakes-on-schedule
  - only-when-used
  # product-mode translation (P3 consumes): guard / stolen / race,
  # software-adaptive policy — see notes

targets:
  success: installed and running on the bike, notifications reaching the phone, location tracked in the cloud
  battery_life:
    delight: "1 month+ (guard mode)"
    floor: none-declared       # declared-none; race mode accepts hours
  unit_cost:
    build: "≤ $100 (components + PCB + assembly) @ 10-unit qty"
    sell: ABSENT               # explicit not-for-sale (ADDENDUM) — a
                               # statement about the sale itself
                               # (conditional_fields)
  volume: {y1: 2, y3: 10}

physical:
  size_class: phone            # bound-asks convention: the stated at-most
  dims: {}                     # ABSENT — range adaptive never spawned
  carry: mounted               # carry-placement convention; concealment → notes
  controls: one-button

timeline:
  proto: none-declared         # "no rush ... correctness over speed"
  production: none-declared

assets: [nothing]              # enum-values-as-given

novelty:
  different: own build, more powerful, latest technologies, accurate location + alarm
  hard: antenna placement, multiple protocols, phone connection, power
  magic: none — all proven technology; the product is a PoC for AI hardware building on Zephyr
  moat: no competitors (personal)

compliance:
