  blockers: []                 # (zephyr-rtos strength unclassified — see
                               # runner_errors re.2, closed by the addendum)
  checks:
    - {check: required-answered, result: green}
    - {check: unknowns-listed, result: green}
    - {check: consistency, result: green}
    - {check: graph-lint, result: "green (sfd graph lint, this commit)"}

runner_errors:
  - id: re.1
    what: "q.env.conditions presented 6 of 8 values (drops, none never offered) — multi-affirmation violation"
    state: open — the two unpresented values are unestablished
  - id: re.2
    what: "volunteered technology 'zephyr rtos' (q.novel.magic) never got the q.constraint.strength ask-back"
    state: closed by addendum (strength=hard)
  - id: re.3
    what: "the sell half of q.scale.cost was never pursued — pair-completeness violation"
    state: closed by addendum (explicit not-for-sale)
  - id: re.4
    what: "q.fn.rate spawned for 2 of 5 named senses (position, tilt; not altitude/speed/velocity)"
    state: open — unspawned rates are ABSENT

consistency:
  - {rule: c.app-needs-link, result: green, reason: "talks includes phone-nearby and far-away-anywhere; controls is one-button"}

summary: a motorcycle GPS tracker; the owner knows where the bike is at all times
users: the owner only (personal build; up to ~10 units for friends)

functions:
