    at: 2026-08-26
  - tech: usb-c
    strength: hard
    quote: "requirement"
    volunteered_quote: "easily rechargeable/updatetbale all things over a usb c connection"
    at: 2026-08-26
  - tech: zephyr-rtos
    strength: hard
    quote: "Requirement"       # ADDENDUM — ask-back fired post-interrogation
    volunteered_quote: "using zephyr rtos as a poc for ai hardware building"
    at: 2026-08-26
  # gps: excluded by the constraint oracle — category noun in q.intent.what

unknowns:
  - field: pir.environment.limits
    blocks: []
    tier: scoring
    note: q.followup.range (how hot / how cold) was asked and not answered; degrades env-risk precision, blocks nothing formally

notes:
  - product modes (P3 seed) — guard (parked, 1 fix/h, motion-armed, month+ battery) · stolen (1 fix/30 s, alert fast) · race (high-rate telemetry, hours accepted) · policy software-adaptive ("theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs")
  - optional accessory, bike battery → USB-C trickle charger ("that way the device is always cajhrged")
  - concealment vs antenna performance is a named P5 hole ("ideally antenann \"just works\"")
  - industrial design aspiration: "something clean that will lookj high end"
  - battery context for the scorer: LiPo + heat + vibration ("just hopefully not explode lol")

