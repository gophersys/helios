# PIR #1 — tracker. The first real Product Intent Record in the system.
# Extracted from Mateo's interrogation (2026-08-26) + the dated addendum.
# Every quoted value cites the question and the VERBATIM words (typos
# preserved); derived values carry source/rule per the derived-items
# convention. Record shape: sfd.pir/v0 as amended (contracts v3).
schema: sfd.pir/v0
product: tracker
source:
  transcript: products/tracker/repro/transcript.yaml
  addendum: products/tracker/transcript-addendum.yaml
  runner: "Claude, in-chat (Eden runner is PLANNED)"
  interrogated: Mateo
  date: 2026-08-26

g0:
