[pytest]
testpaths = tests
python_files = test_*.py

markers =
    # Validation stage markers — matched by corectl run <stage>
    smoke: quick hardware-present checks (<5 min)
    driver: single-driver unit exercises (<10 min)
    integration: cross-subsystem flows (<30 min)
    regression: full functional regression (<1 h)
    fuota: OTA firmware update scenarios (<2 h)

    # Hardware gate markers — the runner skips tests whose required
    # hardware is not attached to the current fixture.
    hw_mtib: requires an MTIB bench
    hw_button: requires the button stimulator
    hw_peltier: requires the peltier thermal stage
    hw_charger_relay: requires the charger simulator relay
