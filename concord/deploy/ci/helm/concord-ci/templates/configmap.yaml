# CI configuration shared by CronJobs and the dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-ci-config
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
data:
  REPO_URL: {{ .Values.config.repoUrl | quote }}
  BRANCH: {{ .Values.config.branch | quote }}
  MINIO_ENDPOINT: {{ include "concord-ci.minioEndpoint" . | quote }}
  MINIO_BUCKET: {{ .Values.config.minioBucket | quote }}
  {{- if .Values.admin.enabled }}
  CI_DASHBOARD_URL: {{ printf "http://concord-ci-admin:%v" (int .Values.admin.port) | quote }}
  {{- end }}
