{{- if .Values.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-docs
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    {{- include "concord.docs.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "concord.docs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord.labels" . | nindent 8 }}
        {{- include "concord.docs.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        rollme: {{ randAlphaNum 10 | quote }}
    spec:
      {{- include "concord.workloadNodeSelector" (dict "workload" "platform" "extra" .Values.docs.nodeSelector) | nindent 6 }}
      terminationGracePeriodSeconds: 15
      containers:
        - name: docs
          image: "{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: concord-docs
  labels:
    {{- include "concord.labels" . | nindent 4 }}
    {{- include "concord.docs.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "concord.docs.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
{{- end }}
