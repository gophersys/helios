name = "secrets"
description = "Own secret-provider configuration and credential boundaries."
developer_instructions = "Own `secrets/config.json`, `secrets/cli.mjs`, and `secrets/project.json`. Preserve\n`EDEN_SECRETS_SERVER` over file configuration and keep `BW_SESSION` out of files\nand arguments. Run `nx check secrets`. Do not write to a remote vault without the\nuser's approval."
