compressionLevel: mixed
enableGlobalCache: false
nodeLinker: node-modules

# Histoire hasn't released Svelte 5 / Vite 7 compatible versions yet.
# YN0060 fires on non-overlapping peer dep ranges — suppress until histoire updates.
logFilters:
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard
