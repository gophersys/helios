# Lint + test for gophersys/research-hardware.
#
# Runs on the org's self-hosted ARC runners (defined in the infrastructure repo,
# platform/services/gitops/registry/app-arc-runners-org.yaml). Those runners are
# a stock actions-runner image with a privileged dind sidecar and NO sudo, so
# anything KiCad-shaped has to come from a container rather than apt.
#
# The whole point of this workflow is that the image carries KiCad 10: without
# it the ERC/DRC/Gerber/netlist half of the suite skips, which is exactly the
# blind spot this repo had before CI existed. That image is now the org category
# image ghcr.io/gophersys/hardware, built and published from the eden
# .devcontainer estate; this repo only CONSUMES it, pinned by digest
# (docs/image-notes.md §1 and §5). The retired repo-local image
# ghcr.io/gophersys/research-hardware-ci stays published as the rollback anchor.
#
# Single job on purpose: the org has 4 runner slots shared across every repo,
# and this project runs a tall stack of PRs. Two jobs would double contention
# for no extra signal, since lint is seconds and both need the same image.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read          # declaring this block drops the default read; the
                          # image pull itself authenticates with GHCR_PULL_TOKEN
                          # (see the login step for why GITHUB_TOKEN cannot)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The org hardware category image, pinned BY DIGEST. The devcontainer and CI
  # must run identical bytes, and a moving :latest cannot promise that
  # (docs/image-notes.md §5, acceptance metric 5). The tag stays in the
  # reference for human readability; the digest is what actually resolves.
  # Digest sha256:ad5851… is the multi-arch index — arc-org is linux/amd64.
  IMAGE: ghcr.io/gophersys/hardware:latest@sha256:ad5851092f6acc7f9a32bd3557499f82d592f15f15201311106852f517734d58

jobs:
  ci:
    runs-on: arc-org      # self-hosted (ARC)
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN cannot pull this image. Its packages:read covers only
      # packages linked to THIS repository, and ghcr.io/gophersys/hardware is a
      # PRIVATE cross-repo package — the same 403 eden hit and documented in its
      # docs/architecture/18-release-and-home-deploy.md (L3). GHCR_PULL_TOKEN is
      # the org-scope pull PAT, held as a repo secret.
      #
      # An unset secret FAILS here and names itself: a login that silently
      # degrades to anonymous would surface later as an unexplained pull 403.
      - name: Log in to GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GHCR_PULL_TOKEN" ] || {
            echo "::error::GHCR_PULL_TOKEN is not set on this repository — the org hardware image is a private cross-repo package and cannot be pulled without it"
            exit 1
          }
          echo "$GHCR_PULL_TOKEN" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull only — the local-rebuild fallback is gone. This repo no longer owns
      # a CI Dockerfile to fall back to, so a failed pull or an unusable image
      # is a FAILURE that names the image, never a quiet rebuild from something
      # stale (docs/image-notes.md §5 step 4). A digest cannot be "deliberately
      # stale" the way the old :latest could, which is what the fallback existed
      # to absorb.
      #
      # Capability, not mere presence: an image carrying kicad-cli but no
      # footprint libraries passes a naive smoke test and then fails the whole
      # resolver suite with `assert 0 > 10_000`, which reads as a code bug.
      - name: Pull the hardware image
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE" || {
            echo "::error::cannot pull $IMAGE — check GHCR_PULL_TOKEN and that the digest is still published"
            exit 1
          }
          docker run --rm --user root "$IMAGE" sh -c \
            'command -v kicad-cli >/dev/null &&
             [ "$(find /usr/share/kicad/footprints -name "*.kicad_mod" | wc -l)" -gt 10000 ]' || {
            echo "::error::$IMAGE lacks kicad-cli or the KiCad footprint libraries"
            exit 1
          }
          echo "pulled $IMAGE (kicad-cli + libraries present)"

      - name: Report toolchain
        run: |
          set -euo pipefail
          docker run --rm --user root "$IMAGE" kicad-cli version
          docker run --rm --user root "$IMAGE" python3 --version
          docker run --rm --user root "$IMAGE" ruff --version

      # --user root on every step that mounts the workspace. The retired CI image
      # had no USER and therefore ran as root; the org image defaults to
      # uid 1000 (dev), which cannot write into the runner-owned checkout — an
      # EACCES on junit.xml, not a test failure. Same convention as eden's
      # container jobs (.github/workflows/on-pr.yml, `options: --user root`).
      - name: ruff
        run: |
          set -euo pipefail
          docker run --rm --user root -v "$PWD":/workspace -w /workspace "$IMAGE" \
            ruff check src/ tests/

      # data/raw is gitignored (188MB of upstream KiCad projects) but 16 of the
      # 33 test modules read from it. The clones are pinned by commit in
      # clone_pilots.sh, so this key only changes when that script does — a cache
      # hit and a cold clone produce byte-identical corpora.
      - name: Cache pilot corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pilots-${{ hashFiles('scripts/clone_pilots.sh') }}

      - name: Clone pilot projects
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/clone_pilots.sh data/raw

      # clone_pilots.sh falls back to the default branch when a host refuses a
      # SHA fetch. Tolerable locally, not in CI: assertions would be made
      # against whatever upstream last pushed.
      - name: Assert corpus is pinned
        run: |
          set -euo pipefail
          bash scripts/check_pilot_pins.sh data/raw

      - name: pytest
        run: |
          set -euo pipefail
          docker run --rm --user root -v "$PWD":/workspace -w /workspace "$IMAGE" \
            python3 -m pytest tests/ -q --junitxml=junit.xml

      # Skips matter here: one means a capability the runner was meant to
      # provide (KiCad, pilot corpus) quietly went missing, which is the exact
      # failure mode this workflow exists to make visible.
      - name: Summarise results
        if: always()
        run: |
          set -euo pipefail
          [ -f junit.xml ] || { echo "no junit.xml produced"; exit 0; }
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          ts = root if root.tag == "testsuite" else root.find("testsuite")
          get = lambda k: int(ts.get(k, 0))
          skipped = get("skipped")
          print("| metric | count |")
          print("|---|---|")
          print(f"| tests | {get('tests')} |")
          print(f"| failures | {get('failures')} |")
          print(f"| errors | {get('errors')} |")
          print(f"| skipped | {skipped} |")
          if skipped:
              print(f"\n> {skipped} skipped — confirm none are KiCad-capability skips.")
          PY
