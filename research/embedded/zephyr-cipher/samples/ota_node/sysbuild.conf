# Enable MCUboot at the sysbuild level so the app is linked into slot0, signed,
# and a signed update image is produced for OTA into slot1.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Overwrite-only upgrade: on reboot MCUboot copies slot1 -> slot0 and boots it,
# with no scratch and no swap-back. This makes the OTA deterministic — the
# swap-with-scratch mode was unreliable copying 512 KB slots through a 128 KB
# scratch sector-by-sector (it sometimes rolled back to the primary). Overwrite-
# only trades the automatic revert-on-failure for a dead-simple, repeatable apply.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
