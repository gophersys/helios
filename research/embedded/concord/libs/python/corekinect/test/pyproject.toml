[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corekinect-test"
version = "0.1.0"
description = "Validation test framework for CK IoT products"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "pytest>=9.0",
    "requests>=2.26",
    "minio>=7.2",
    "grpcio>=1.75",
    "grpcio-tools>=1.75",
    "python-dotenv>=1.0",
    "boto3>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest-timeout>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["corekinect/test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Incremental adoption
