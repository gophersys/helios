# Thin shim — all logic lives in .ci/
# To activate: symlink or copy this directory to the repo root:
#   ln -sf .ci/providers/github .github
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: containers.ad.corekinect.com/concord-devcontainer-base:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./.ci/run ${{ github.event_name == 'push' && 'main' || 'pr' }}
