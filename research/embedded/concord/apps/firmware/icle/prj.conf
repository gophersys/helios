# SPDX-License-Identifier: Apache-2.0
# ICLE Zephyr Firmware Configuration
# ESP32-WROOM-32 based test fixture for DUT validation

# =============================================================================
# System Configuration
# =============================================================================

# Use newlib libc (SDK compatibility)
CONFIG_NEWLIB_LIBC=y

# Main stack - app event loop runs on main thread, needs 4096+
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# System workqueue stack - ESP32 WiFi driver processes events here,
# needs 4096+ for scan/connect/DHCP operations
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Thread support
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# Events for state machine
CONFIG_EVENTS=y

# =============================================================================
# Logging
# =============================================================================

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_PRINTK=y
CONFIG_LOG_RUNTIME_FILTERING=y

# =============================================================================
# Console and Shell
# =============================================================================

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=1536

# =============================================================================
# GPIO
# =============================================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y

# =============================================================================
# I2C for INA209 Power Monitor
# =============================================================================

CONFIG_I2C=y
CONFIG_SENSOR=y

# =============================================================================
# SPI for SD Card
# =============================================================================

CONFIG_SPI=y

# =============================================================================
# SD Card and Filesystem
# =============================================================================

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_CODEPAGE=437
CONFIG_FS_FATFS_MOUNT_MKFS=n

# =============================================================================
# Network Control Service (netctl - ported from Helios runtime)
# =============================================================================
# netctl Kconfig auto-selects: NETWORKING, NET_IPV4, NET_TCP, NET_UDP,
# NET_SOCKETS, NET_MGMT, NET_MGMT_EVENT, NET_MGMT_EVENT_INFO,
# DNS_RESOLVER, NET_L2_ETHERNET, NET_DHCPV4, WIFI_NM,
# ESP32_WIFI_STA_AUTO_DHCPV4

CONFIG_ICLE_NETCTL=y
CONFIG_ICLE_NETCTL_WIFI=y
CONFIG_ICLE_NETCTL_LOG_LEVEL=3

# WiFi hardware
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y

# WiFi scan support
CONFIG_WIFI_MGMT_RAW_SCAN_RESULTS=y
CONFIG_WIFI_MGMT_RAW_SCAN_RESULTS_ONLY=n

# Default WiFi credentials for testing (ICLE_HERE network)
CONFIG_ICLE_WIFI_SSID="ICLE_HERE"
CONFIG_ICLE_WIFI_PSK="icle4testing"

# Network buffers
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_IF_MAX_IPV4_COUNT=1

# Network management stack (increased for WiFi events)
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# =============================================================================
# BSD Sockets for HTTP Client
# =============================================================================

CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_POLL_MAX=8

# =============================================================================
# HTTP Client
# =============================================================================

CONFIG_HTTP_CLIENT=y

# =============================================================================
# Entropy and Random (needed for netctl jitter)
# =============================================================================

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

# =============================================================================
# Power Management
# =============================================================================

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# =============================================================================
# ZMS and Settings for Configuration Storage
# =============================================================================

# Flash and flash map support
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ZMS (Zephyr Memory Storage) - Zephyr 4.0+
CONFIG_ZMS=y
CONFIG_ZMS_LOG_LEVEL_WRN=y

# NVS required for settings backend (no SETTINGS_ZMS in Zephyr 4.0)
CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_WRN=y

# Settings subsystem for configuration persistence
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# =============================================================================
# Date/Time Support
# =============================================================================

CONFIG_SNTP=y

# =============================================================================
# Debug Options (disable in production)
# =============================================================================

CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# Stack overflow detection
CONFIG_STACK_SENTINEL=y

# =============================================================================
# Network Shell Commands (debugging)
# =============================================================================

CONFIG_NET_SHELL=y

# =============================================================================
# Memory Configuration
# =============================================================================

# Increase ISR stack for WiFi interrupts
CONFIG_ISR_STACK_SIZE=2048

# System memory pool
CONFIG_KERNEL_MEM_POOL=y
