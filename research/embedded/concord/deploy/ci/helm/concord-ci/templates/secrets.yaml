# CI-specific secrets (MinIO credentials).
# External secrets (bitbucket-ssh-key, claude-code-oauth, etc.) are
# referenced directly by CronJob templates with optional: true.
apiVersion: v1
kind: Secret
metadata:
  name: concord-ci-secrets
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.rootPassword | quote }}
