{{- if .Values.minio.enabled }}
# ── PVC ───────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concord-ci-minio-pvc
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
    {{- include "concord-ci.minio.selectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.minio.storageClass }}
  storageClassName: {{ .Values.minio.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
# ── Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concord-ci-minio
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
    {{- include "concord-ci.minio.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "concord-ci.minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concord-ci.labels" . | nindent 8 }}
        {{- include "concord-ci.minio.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "concord-ci.nodeSelector" . | nindent 6 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command: ["minio", "server", "/data", "--console-address", ":{{ .Values.minio.consolePort }}"]
          ports:
            - name: api
              containerPort: {{ .Values.minio.port }}
            - name: console
              containerPort: {{ .Values.minio.consolePort }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concord-ci-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.minio.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: concord-ci-minio-pvc
---
# ── Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: concord-ci-minio
  labels:
    {{- include "concord-ci.labels" . | nindent 4 }}
    {{- include "concord-ci.minio.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "concord-ci.minio.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.minio.port }}
      targetPort: {{ .Values.minio.port }}
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: {{ .Values.minio.consolePort }}
{{- end }}
