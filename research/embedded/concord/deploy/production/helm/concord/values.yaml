# Default values for Concord platform.
# Override per-environment with values-staging.yaml or values-production.yaml.

global:
  environment: staging
  imagePullPolicy: IfNotPresent

# ── Infrastructure (optional, for staging/dev) ─────────────
# Set enabled: false for production (use managed services instead)
infrastructure:
  postgres:
    enabled: false
    user: concord
    password: concord
    database: concord
    storage: 5Gi
    nodeSelector: {}
  minio:
    enabled: false
    rootUser: minioadmin
    rootPassword: minioadmin
    storage: 5Gi
    nodeSelector: {}
  pypi:
    enabled: false
    storage: "2Gi"
    nodeSelector: {}

# ── Build Service ──────────────────────────────────────────────
buildService:
  enabled: false
  nodeSelector: {}
  image:
    repository: concord/build-service
    tag: staging
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ── Backend (http-api) ──────────────────────────────────────
httpApi:
  enabled: true
  image:
    repository: concord/http-api
    tag: staging
  replicas: 1
  port: 9001
  migration:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: true
    name: concord-api
  nodeSelector: {}
  probes:
    readiness:
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 30

# ── Frontend ────────────────────────────────────────────────
frontend:
  enabled: true
  image:
    repository: concord/frontend
    tag: staging
  replicas: 1
  port: 80
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Docs Site ──────────────────────────────────────────────
docs:
  enabled: false
  nodeSelector: {}
  image:
    repository: containers.ad.corekinect.com/concord-docs
    tag: staging
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ── Ingress ─────────────────────────────────────────────────
ingress:
  enabled: true
  host: staging.concord.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

# ── Config ──────────────────────────────────────────────────
config:
  SERVER_PORT: "9001"
  LOG_LEVEL: "4"
  LOG_PATH: "logs"
  ASSETS_FOLDER: "assets"
  CORS_ORIGINS: "https://staging.concord.local"
  MTIB_PORT: "50053"
  BITBUCKET_POLLER_ENABLED: "true"
  BITBUCKET_POLLER_INTERVAL_S: "300"
  STORAGE_URL: "http://concord-minio:9000"
  STORAGE_BUCKET_NAME: "concord"
  AUTH_SERVER_URL: ""
  CONCORD_API_HOST: "staging.concord.local"

# ── Git Poller ────────────────────────────────────────────────
gitPoller:
  enabled: false
  pollInterval: "5"
  productCacheTtl: "60"
  bitbucketWorkspace: "corekinect"
  nodeSelector: {}
  image:
    repository: containers.ad.corekinect.com/concord-git-poller
    tag: latest
  port: 9003
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Backups ────────────────────────────────────────────────
backups:
  postgres:
    enabled: false
    schedule: "0 2 * * *"       # Daily at 2:00 AM UTC
    retain: 14                   # Keep last 14 backups
    preUpgrade: false            # Backup before every helm upgrade
    verify: false                # Weekly restore verification
  minio:
    enabled: false
    schedule: "0 3 * * 0"       # Weekly on Sunday at 3:00 AM UTC
    hostPath: "/var/lib/concord/backups/minio"

# ── Network Policies ──────────────────────────────────────
networkPolicies:
  enabled: false

# ── Resource Quotas ───────────────────────────────────────
resourceQuotas:
  enabled: false
  cpu: "4"
  memory: "8Gi"
