# Office cluster uses K3s default local-path provisioner.
# This manifest documents the existing StorageClass — it is NOT applied
# by bootstrap.sh since it ships with K3s.
#
# If you need a different StorageClass (e.g., Longhorn for replication),
# add it here and reference it in the Helm values.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
