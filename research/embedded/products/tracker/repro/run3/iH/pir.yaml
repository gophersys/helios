# Excluded and NOT asked, by the oracle's own exclusion list: "gps tracker"
# (category noun inside q.intent.what), led / button (UI primitives already
# captured by enum values), cloud / app / pcb / assembly / antenna
# (ecosystem nouns).
constraints:
  - tech: cellular
    strength: hard                    # the founder answered "requiemrnt"
                                      # (requirement) to "requirement, or a
                                      # preference?" -> the `hard` value
    quote: "requiemrnt"
    volunteered_quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
    effect: "filters the P4 fit matrix"

  - tech: usb-c
    strength: hard
    quote: "requirement"
    volunteered_quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    at: "2026-08-26"
    effect: "filters the P4 fit matrix; covers charging AND firmware update over the same connector"

  - tech: zephyr rtos
    strength: UNKNOWN                 # NEVER classified — the ask-back was not
                                      # made. constraint_oracle: an unclassified
                                      # included token is UNKNOWN and BLOCKS G0
                                      # (q.constraint.strength is required tier).
    quote: UNKNOWN
    volunteered_quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"
    effect: "unresolved: cannot filter or tie-break until classified"

# ── R5 — UNKNOWN is data ──────────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr rtos].strength
    blocks: []
    tier: required
    gate: G0
    note: "volunteered technology never received q.constraint.strength (constraint_oracle rule). Required tier, so it hard-blocks G0 even with an empty blocks list. Answered by one ask: 'is zephyr rtos a requirement or a preference?'"

  - field: pir.environment.limits
    blocks: []
    tier: scoring
    note: "q.followup.range was spawned for the heat/cold picks and left unanswered. No registry metric is fed by pir.environment.limits, so it blocks none — but it removes the numbers behind metric.feasibility.env-risk (a vehicle-mounted, hosed, vibrating enclosure with no stated temperature range) and is carried as a risk there."

  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    tier: scoring
    note: "q.scale.cost is a pair (build, sell); only the build half was answered and the runner did not ask the sell half, which conditional_fields requires on silence. UNKNOWN (not ABSENT) because no verbatim declares not-for-sale. This blocks a CORE metric, so the P1 verdict is `blocked` by design (40-p1-metrics.md rule 2). Answered by one ask: 'what price sells it — or is it not for sale?'"

  - field: pir.functions[sensing.tilt].rate.configurable
    blocks: []
    tier: scoring
    note: "the configurable-rate policy was stated for position sampling only; never stated for the tilt/alert path. Recorded rather than defaulted to false (R5)."

# ── runner conformance (recorded, never hidden) ───────────────────────
runner_errors:
  - id: multi-affirmation-partial
    question: q.env.conditions
    detail: "the runner presented 6 of the 8 values (water, dust, heat, cold, vibration, washing-or-hosing); `drops` and \"none\" were never presented. conventions.multi-affirmation: the answer binds only to the values presented, so the blanket 'yes all the ones suggested' cannot select or exclude `drops`."
    effect: "pir.environment.conditions is recorded with the 6 presented values; drop/shock exposure for a vehicle-mounted device is unasked"

  - id: adaptive-not-spawned
    question: q.fn.rate
    spawned_by: q.fn.senses
    detail: "q.fn.rate is spawned once per NAMED sense. Five senses were named (position, altitude, speed, velocity, tilt); the runner spawned it twice (position, tilt/motion). altitude, speed and velocity carry rate: ABSENT."
    effect: "metric.platform.compute-demand is scored on two of five stated senses"

  - id: missed-ask-back
    question: q.constraint.strength
    trigger: "volunteered technology: `zephyr rtos` (operating system — an INCLUDED token in constraint_oracle.volunteered_when)"
    detail: "the runner made the ask-back for `cellular` and `usb-c` but not for `zephyr rtos`."
    effect: "G0 BLOCKED — unknowns[0]"

  - id: pair-half-unanswered
    question: q.scale.cost
    detail: "the sell half of the pair was neither answered nor re-asked; conditional_fields for pir.targets.unit_cost.sell says silence is UNKNOWN AND THE RUNNER MUST ASK."
    effect: "core metric metric.viability.economics is unknown -> P1 verdict blocked"

