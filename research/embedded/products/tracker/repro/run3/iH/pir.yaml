environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  # NOTE: the runner presented only 6 of the 8 values; `drops` and "none"
  # were never put to the founder, so the blanket "yes all the ones
  # suggested" cannot bind them (conventions.multi-affirmation).
  # Recorded as runner_errors[0]. `drops` is therefore NOT selected and NOT
  # unknown — it was never asked.
  limits: UNKNOWN                     # q.followup.range spawned (heat/cold) and
                                      # left unanswered — see unknowns[1]
  on_body: "no"

# ── power ─────────────────────────────────────────────────────────────
power_class: PC1                      # derived: q.power.source =
                                      # charges-on-dock-or-cable -> PC1
modes: [wakes-on-event, wakes-on-schedule, only-when-used]
# "akwas on schel" read as "wakes on schedule" (the enum value); "always-on"
# is NOT selected — the sentence pairs the token with "on schel", and the
# founder's whole answer is about spending power only when needed.

# ── targets ───────────────────────────────────────────────────────────
targets:
  success: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud"
  battery_life:                       # CONDITIONAL field: present because
                                      # power_class in [PC0, PC1]
    delight: "1 month+"
    floor: none-declared              # conventions.declared-none: "no lowest
                                      # threshold" is an ANSWER, not UNKNOWN
    note: "the founder attaches an optional always-powered path (bike battery -> USB-C) and an opposite extreme (hours, racing use) to the same device"
  unit_cost:
    build: {value: 100, currency: USD, unit: per-unit, at_quantity: 10, scope: "components + pcb + assembly", bound: at-most}
    sell: UNKNOWN                     # conditional_fields: present iff an intent
                                      # to sell is STATED; an explicit
                                      # not-for-sale would be ABSENT; SILENCE is
                                      # UNKNOWN and the runner must ask. The
                                      # transcript carries no not-for-sale
                                      # sentence — "its just for me" answers
                                      # q.intent.who (users), and q.comp.region
                                      # ("Where will it be SOLD first?") was
                                      # answered "us only". See unknowns[2].
  volume: {y1: 2, y3: 10}
  # "2, and maybe 10 for my freinds" -> y1 2, y3 10.

# ── physical ──────────────────────────────────────────────────────────
physical:
  size_class: phone                   # conventions.bound-asks: the STATED BOUND
                                      # ("no bigger than a small phone") is the
                                      # record; "deck of cards is ok" is a
                                      # preference inside that bound
  dims: ABSENT                        # q.followup.range never spawned for
                                      # q.phys.size — `phone` is not a tight
                                      # pick; unspawned adaptive is N/A
  carry: mounted                      # conventions.carry-placement: hidden /
                                      # "tucked" placement counts as mounted
  controls: one-button
  notes:
    - "concealment is a stated requirement of the placement: not visible, not easily seen by a thief, weather-protected"
    - "the founder expects the antenna to \"just work\" in that hidden placement — an RF/mechanical constraint P5 inherits"
    - "aesthetic intent: \"something clean that will lookj high end\""

