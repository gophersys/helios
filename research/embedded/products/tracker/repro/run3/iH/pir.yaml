    detail: position (location), accurately — the primary sense
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:                            # conventions.rate-attachment
      periods:
        parked: "1 h"
        moving: "30 s"
      configurable: true
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"

  - capability: sensing
    detail: altitude
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                     # q.fn.rate never spawned for this sense —
                                     # runner_errors[1]; unspawned adaptive is
                                     # N/A, never UNKNOWN

  - capability: sensing
    detail: speed
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                     # runner_errors[1]

  - capability: sensing
    detail: velocity
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    note: "the founder named speed AND velocity; recorded as spoken rather than merged (R4). They may name one quantity — a P3 concern, not a P0 edit."
    rate: ABSENT                     # runner_errors[1]

  - capability: sensing
    detail: tilt / motion — the theft-alert trigger
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        detect: "within seconds"
        alert: "as quick as possible"
      configurable: UNKNOWN          # stated for position only; not stated here
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"

  - capability: sensing
    detail: "the sense list is OPEN by the founder's own words (\"things like that\") — P3 must not read it as exhaustive"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    note: "scope marker, not a device requirement"

  # actuation: NONE — conventions.negative-function: a required function
  # question answered 'none' produces NO function item; the answer lives in
  # provenance.pir.functions and satisfies the feed.

  - capability: connectivity
    detail: phone-nearby — the phone connects to the device directly when close
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: far-away-anywhere — location known from anywhere, wide-area link
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
    note: "the RADIO is derived in P3/P4 (R3); the founder's `cellular` rides in constraints[] as a hard constraint, never as a derivation"

  - capability: storage
    detail: retain logged state across power loss; buffer fixes taken with no link and backfill them to the cloud later
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: compute
    detail: on-device logic runs the full product offline except alerting — sampling, logging, buffering continue
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  - capability: compute
    detail: rate policy is software-selectable against a user power preference
    question: q.fn.rate
    quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
    at: "2026-08-26"

