# PIR — Product Intent Record for product `tracker`.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5, G0, PIR v0 spec).
# Authority for fields/derivations/conventions: docs/sfd/30-p0-graph.yaml.
# Every value cites its question id + the founder's VERBATIM words (R4);
# typos are preserved exactly as spoken. UNKNOWN is the R5 sentinel, never
# an enum value; ABSENT is a defined non-state with its reason named.
schema: sfd.pir/v0
product: tracker
source:
  transcript: /private/tmp/claude-501/-Users-mateo-code-research-embedded/071a7bd3-8c48-482e-a1db-7e333748e40f/scratchpad/repro/transcript.yaml
  graph: docs/sfd/30-p0-graph.yaml   # sfd.interrogation/v0
  contract: docs/sfd/30-p0-interrogation.md
  interrogated: "2026-08-26"         # transcript carries no clock -> date-only
                                     # ISO 8601 (conventions.timestamps)

summary: "a motorcycle gps tracker so that i know where my bike is at all times"
users: "its just for me"

# ── functions — S1's CLOSED capability vocabulary ─────────────────────
# sensing · actuation · connectivity · storage · compute · hmi · power ·
# security · time. Provenance is PER ITEM, inline (R4). Derived items
# carry {source: derived, rule} and no quote (conventions.derived-items).
functions:
