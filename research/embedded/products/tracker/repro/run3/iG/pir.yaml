# Product Intent Record — extracted from the frozen interrogation transcript.
# Contract: docs/sfd/30-p0-interrogation.md (R1-R5) + docs/sfd/30-p0-graph.yaml.
# Every value carries question id + verbatim quote + timestamp (R4).
# Transcript typos are preserved verbatim in every quote.
schema: sfd.pir/v0
product: tracker
source: repro/transcript.yaml   # frozen interrogation transcript, 2026-08-26

# ── G0 ─────────────────────────────────────────────────────────────────
g0:
  status: blocked
  blockers:
    - field: pir.constraints[zephyr-rtos].strength
      why: >-
        constraint_oracle includes operating systems ("zephyr rtos") as
        volunteered technology; the required-tier adaptive
        q.constraint.strength was never spawned for it. Rule:
        "an unclassified included token is UNKNOWN and blocks G0".
  checks:
    - id: g0.1-required-answered
      result: red
      note: >-
        13 reachable fixed required questions all answered (q.fn.offline and
        q.power.life both opened and answered). Required adaptive
        q.constraint.strength: 3 included volunteered tokens, only 2
        classified (cellular, usb-c); zephyr-rtos unclassified.
    - id: g0.2-unknowns-listed
      result: green
      note: "both UNKNOWNs recorded in unknowns[] with tier and blocked metrics (R5)"
    - id: g0.3-consistency
      result: green
      note: "the single v0 rule c.app-needs-link did not fire — see consistency[]"
    - id: g0.4-graph-lints-clean
      result: not-evaluated
      note: >-
        property of 30-p0-graph.yaml itself, not of this PIR; `sfd graph lint`
        is the authority and was not run by this extraction.
    - id: g0.5-safety-human-gate
      result: green
      note: "q.comp.safety = none — no human gate raised"

# ── INTENT ─────────────────────────────────────────────────────────────
summary: >-
  A GPS tracker for the owner's motorcycle: it reports the bike's position
  continuously so the owner always knows where the bike is, sends alerts to
  his phone, and logs location to the cloud.

users: >-
  The owner alone (single operator, self-installed on his own motorcycle);
  a handful of friends are a possible later audience, not a customer set.

# ── ENVIRONMENT ────────────────────────────────────────────────────────
environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  # NOTE: `drops` and `none` were never presented by the runner, so the
  # blanket affirmation cannot bind them — see runner_errors[0].
  limits: UNKNOWN        # R5: q.followup.range spawned (how hot / how cold), unanswered
  on_body: "no"
  notes:
    - "concealed installation: tucked away, hidden, not visible to a thief"
    - "weather protection is stated as a purpose of the concealment"

# ── FUNCTIONS (S1 closed vocabulary; R4 provenance PER ITEM) ───────────
functions:
  - capability: sensing
    detail: "position / location, accurately — the primary sense"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        parked: {value: 1, unit: hour}
        moving: {value: 30, unit: second}
      configurable: true
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"

  - capability: sensing
    detail: "altitude"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT           # adaptive q.fn.rate never spawned for this sense — runner_errors[2]

  - capability: sensing
    detail: "speed"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT           # adaptive q.fn.rate never spawned for this sense — runner_errors[2]

  - capability: sensing
    detail: "velocity"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT           # adaptive q.fn.rate never spawned for this sense — runner_errors[2]

  - capability: sensing
    detail: "tilt / motion — the alert trigger"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        alert-reaction: {value: 1, unit: second, bound: "within seconds, as quick as possible"}
      configurable: false   # no configurability stated for this sense
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"

  - capability: connectivity
    detail: "phone-nearby — the owner's phone connects to the device easily when close"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: "far-away-anywhere — location known from anywhere, wide-area link (see constraints: cellular, hard)"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: storage
    detail: >-
      non-volatile retention across power loss: buffer location/state records
      while no link or no fix exists, then backfill ("backtrack") to the cloud
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: compute
    detail: >-
      edge autonomy: with no internet everything continues (sensing, logging,
      store-and-forward, mode policy) except outbound alerts
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  - capability: hmi
    detail: "one multicolour LED / LED ring signalling device state; no screen"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  - capability: hmi
    detail: "one multipurpose button"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  # actuation: NO ITEM — negative-function convention. The answer satisfies
  # the feed and lives in provenance.pir.functions (q.fn.acts).

  - capability: power
    detail: "PC1 (rechargeable) with duty modes wakes-on-event + wakes-on-schedule + only-when-used"
    source: derived
    rule: capability.power

  - capability: security
    detail: >-
      baseline security capability — the product talks to a counterpart
      (phone-nearby, far-away-anywhere) AND collects personal data (location)
    source: derived
    rule: capability.security

  - capability: time
    detail: "timekeeping — duty includes wakes-on-schedule"
    source: derived
    rule: capability.time

# ── POWER ──────────────────────────────────────────────────────────────
power_class: PC1        # derived: q.power.source = charges-on-dock-or-cable
modes: [wakes-on-event, wakes-on-schedule, only-when-used]
# `always-on` was NOT selected.

# ── TARGETS ────────────────────────────────────────────────────────────
targets:
  success: >-
    Installed and running on the bike, sending notifications to the owner's
    phone and tracking the bike's location in the cloud.
  battery_life:                     # CONDITIONAL — present because power_class is PC1
    delight: {value: 1, unit: month, bound: "or more"}
    floor: none-declared            # declared-none: "no lowest threshold"
    note: >-
      Floor is explicitly unbounded: the founder accepts an hours-long
      high-performance/racing mode. An optional on-bike charger (bike battery
      to USB-C) would keep the device permanently topped up.
  unit_cost:
    build: {value: 100, currency: USD, bound: at-most, at_qty: 10, scope: "components + pcb + assembly, per unit"}
    sell: ABSENT                    # declared not-for-sale — see note
    note: >-
      No intent to sell is stated anywhere in the transcript; the user set is
      "its just for me" plus "maybe 10 for my freinds", and the cost answer
      names a build budget only. Read as an explicit statement that no sell
      price binds (declared-none-general), therefore ABSENT rather than
      UNKNOWN. This is the single largest interpretive fork in this PIR: an
      UNKNOWN reading would make the core metric.viability.economics unknown
      and force verdict `blocked` under P1 precedence rule 2.
  volume: {y1: 2, y3: 10}

# ── PHYSICAL ───────────────────────────────────────────────────────────
physical:
  size_class: phone       # bound-asks convention: the stated bound is the value
  dims: ABSENT            # adaptive q.followup.range never spawned for q.phys.size (`phone` is not a tight pick)
  carry: mounted          # carry-placement convention: hidden/tucked is a fixed installation
  controls: one-button
  notes:
    - "concealed: mounted with an adapter OR simply hidden and \"tucked\" somewhere"
    - "antenna must \"just work\" from the concealed position"
    - "deck-of-cards is acceptable; `phone` is the stated upper bound"
    - "aesthetic intent: \"something clean that will lookj high end\""

# ── TIMELINE + ASSETS ──────────────────────────────────────────────────
timeline:
  proto: none-declared        # declared-none: "no rush"
  production: none-declared   # declared-none: "no deadline"
assets: [nothing]

# ── NOVELTY ────────────────────────────────────────────────────────────
novelty:
  different: >-
    Comparable products exist; the difference claimed is a self-built device
    that is "more powerful", uses newer technology, gives more accurate
    location, and adds alarm behaviour.
  hard: >-
    Antenna placement; multiple simultaneous protocols; the phone connection;
    power.
  magic: none-declared        # "not really" — no capability claimed that the founder has never seen work
  moat: >-
    None claimed — "no compettiors" (a personal build, not a market position).

# ── COMPLIANCE ─────────────────────────────────────────────────────────
compliance:
  regions: [us]
  safety: "none"
  personal_data: [location]
  certifications: [fcc]       # derived from regions (us -> fcc)
  notes:
    - >-
      The safety answer is the enum value `none` as given ("no"); the trailing
      "just hopefully not explode lol" names a lithium-cell hazard the founder
      did not assert as a harm path. Recorded, not promoted — R3/R4 record what
      was said.

# ── CONSTRAINTS (volunteered technology; R3's constraints channel) ─────
constraints:
  - tech: cellular
    strength: hard
    quote: "requiemrnt"
    volunteered_quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
    note: "verbatim answer is a typo of \"requirement\"; maps to the enum value `hard`"

  - tech: usb-c
    strength: hard
    quote: "requirement"
    volunteered_quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    at: "2026-08-26"
    note: >-
      Re-volunteered in q.power.life ("an optional on-bike chrager from bikes
      battery -> usb c power"); one constraint entry, one classification.

  - tech: zephyr-rtos
    strength: UNKNOWN
    quote: ABSENT              # q.constraint.strength never spawned for this token
    volunteered_quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"
    note: >-
      constraint_oracle includes "operating systems (zephyr rtos)". Required-tier
      ask-back missed by the runner — blocks G0.

# ── UNKNOWNS (R5 — first class) ────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr-rtos].strength
    tier: required
    gate: G0
    blocks: []
    note: >-
      pir.constraints feeds no P1 metric, so this UNKNOWN blocks no score —
      it blocks the GATE. Answered by asking q.constraint.strength for the
      volunteered token "zephyr rtos".

  - field: pir.environment.limits
    tier: scoring
    blocks: []
    note: >-
      q.followup.range was spawned by q.env.conditions (how hot / how cold) and
      left unanswered. q.followup.range feeds no metric id, so formally it
      blocks none; it nonetheless degrades metric.feasibility.env-risk, whose
      amber level names "extremes" — the magnitude of heat/cold is unquantified
      for a concealed under-fairing motorcycle installation. Raised as a P1
      risk per R5. Answered by asking for the operating temperature range.

# ── RUNNER ERRORS (recorded, never silently absorbed) ──────────────────
runner_errors:
  - id: re.1
    question: q.env.conditions
    kind: multi-affirmation-violation
    detail: >-
      The runner presented 6 of the question's 8 values (water, dust, heat,
      cold, vibration, washing-or-hosing); `drops` and `none` were never
      offered. The convention binds "yes all the ones suggested" only to the
      values PRESENTED, so `drops` is unrecorded despite being plausible for a
      concealed motorcycle installation.
    effect: "pir.environment.conditions may be incomplete; re-ask with the full value list."

  - id: re.2
    question: q.novel.magic
    kind: missed-ask-back
    detail: >-
      "zephyr rtos" is an included volunteered-technology token
      (constraint_oracle: operating systems). No q.constraint.strength was
      spawned for it, though the runner did spawn one for `cellular` and one
      for `usb-c`.
    effect: "pir.constraints[zephyr-rtos].strength UNKNOWN — hard-blocks G0 (required tier)."

  - id: re.3
    question: q.fn.senses
    kind: missed-adaptive-spawn
    detail: >-
      q.fn.rate is spawned "once per named sense/act". Five senses were named
      (position, altitude, speed, velocity, tilt); q.fn.rate was spawned for
      two (position, tilt/motion).
    effect: >-
      rate is ABSENT on the altitude/speed/velocity function items;
      metric.platform.compute-demand is scored on a partial rate set.
    note: >-
      No error for q.fn.acts: it was answered negatively, produced no function
      item, and therefore correctly spawned no rate ask.

# ── CONSISTENCY (graph consistency: block) ─────────────────────────────
consistency:
  - id: c.app-needs-link
    result: green
    fired: false
    detail: >-
      Requires q.fn.talks == nothing AND q.phys.controls == only-an-app.
      Actual: q.fn.talks = [phone-nearby, far-away-anywhere],
      q.phys.controls = one-button. Both answers present; rule evaluated and
      not red.

