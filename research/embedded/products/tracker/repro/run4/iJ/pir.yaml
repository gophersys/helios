# PIR — Product Intent Record for product "tracker".
# Contracts: docs/sfd/30-p0-interrogation.md (R1-R5, PIR v0) +
#            docs/sfd/30-p0-graph.yaml (types, tiers, conventions,
#            derivations, constraint oracle, conditional fields).
# Timestamps: date-only ISO 8601 — the frozen transcript carries no clock
# (convention `timestamps`).
schema: sfd.pir/v0
product: tracker
source: scratchpad/repro/transcript.yaml   # frozen input, 36 verbatim Q->A pairs, 2026-08-26

# ── S1 INTENT ─────────────────────────────────────────────────────────
summary: "a motorcycle gps tracker so that i know where my bike is at all times"
users: "its just for me"

# ── S3 FUNCTIONS (+ derived capabilities) ─────────────────────────────
# R4: provenance PER ITEM, inline. Capability words are S1's CLOSED
# vocabulary (10-p3-pipeline.md): connectivity sensing actuation storage
# compute hmi power security time.
functions:
  # -- sensing (q.fn.senses) ------------------------------------------
  - capability: sensing
    detail: "position — accurate location"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:                       # convention `rate-attachment`
      periods:
        parked: "1 h"
        moving: "30 s"
      configurable: true        # stated: software may change it by power preference
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"
      spawned_for: position

  - capability: sensing
    detail: "altitude"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                # adaptive q.fn.rate never spawned for this sense

  - capability: sensing
    detail: "speed / velocity"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                # adaptive q.fn.rate never spawned for this sense

  - capability: sensing
    detail: "tilt / motion"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        alert: "within seconds"
      configurable: false       # not stated -> stated-absent default, not UNKNOWN
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"
      spawned_for: tilt/motion

  # -- actuation (q.fn.acts) -------------------------------------------
  # NONE. Convention `negative-function`: a required function question
  # answered "none" produces NO function item; the answer satisfies the
  # feed from provenance.pir.functions below.

  # -- connectivity (q.fn.talks) ---------------------------------------
  - capability: connectivity
    detail: phone-nearby
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: far-away-anywhere
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  # -- compute (q.fn.offline = edge autonomy, per the coverage table) ---
  - capability: compute
    detail: "edge autonomy — everything must work with no internet EXCEPT alerts"
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  # -- hmi OUTPUT (q.fn.shows). hmi INPUT is pir.physical.controls, not
  #    a function item — feeds is the authority (R2).
  - capability: hmi
    detail: "a-light — multicolour LED signalling states"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  # -- storage (q.fn.stores) -------------------------------------------
  - capability: storage
    detail: "retains data across power loss; buffers positions while no link, then backfills to the cloud"
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  # -- DERIVED capabilities (convention `derived-items`: no quote, no
  #    question). Rules in 30-p0-graph.yaml `derivations:`.
  - capability: security
    detail: "baseline security — the product talks to a phone and to the cloud, and collects location"
    source: derived
    rule: capability.security   # q.fn.talks != nothing OR q.comp.data != none — BOTH hold

  - capability: time
    detail: "timekeeping — duty includes wakes-on-schedule"
    source: derived
    rule: capability.time       # q.power.duty includes wakes-on-schedule

  - capability: power
    detail: "power = PC1 + modes [wakes-on-event, wakes-on-schedule, only-when-used]"
    source: derived
    rule: capability.power      # always present = pir.power_class + pir.modes

# ── S2 ENVIRONMENT ────────────────────────────────────────────────────
environment:
  where: vehicle
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  # ^ convention `multi-affirmation`: binds ONLY to the values the runner
  #   PRESENTED. `drops` and `none` were never presented -> runner error
  #   re.1 below; they are NOT selected and NOT unknown.
  limits: UNKNOWN               # q.followup.range spawned and asked ("how hot / how cold"), not answered
  on_body: "no"

# ── S4 POWER ──────────────────────────────────────────────────────────
power_class: PC1                # DERIVED: q.power.source = charges-on-dock-or-cable -> PC1
modes: [wakes-on-event, wakes-on-schedule, only-when-used]
# ^ `always-on` was NOT selected. "akwas on schel" -> wakes-on-schedule
#   (named accepted residual: garbled-token mapping has no repair rule).

# ── TARGETS ───────────────────────────────────────────────────────────
targets:
  success: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud"
  battery_life:                 # CONDITIONAL — present iff power_class in [PC0, PC1]; PC1 -> PRESENT
    delight: "1 month+ on battery"
    floor: none-declared        # convention `declared-none`: "no lowest threshold" is an ANSWER, never UNKNOWN
  unit_cost:
    build: "<= 100 USD per unit at qty 10 (components + pcb + assembly)"
    sell: UNKNOWN               # never asked -> runner error re.3; conditional_fields: silence is UNKNOWN,
                                # and "its just for me" NEVER qualifies as an explicit not-for-sale
  volume:
    y1: 2
    y3: 10

# ── S5 PHYSICAL ───────────────────────────────────────────────────────
physical:
  size_class: phone             # convention `bound-asks`: record the STATED BOUND
  dims: ABSENT                  # adaptive q.followup.range never spawned for q.phys.size
  carry: mounted                # convention `carry-placement`: hidden/tucked counts as mounted
  controls: one-button

# ── S7 TIMELINE + EXISTING ────────────────────────────────────────────
timeline:
  proto: none-declared          # "no rush ... correctness over speed" — answers the date asked
  production: none-declared     # "no deadline"
assets: ["nothing"]             # convention `enum-values-as-given`: [nothing] stays [nothing], never []

# ── S8 NOVELTY ────────────────────────────────────────────────────────
novelty:
  different: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that"
  hard: "antenna placement, multipel protocols, pjone connecton and poower"
  magic: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
  moat: "no compettiors"

# ── S9 COMPLIANCE ─────────────────────────────────────────────────────
compliance:
  regions: [us]
  safety: "none"                # verbal hedge "hopefully not explode lol" cannot move the enum;
                                # the hazard rides to the G1 human in the scorecard evidence
  personal_data: [location]
  certifications: [fcc]         # DERIVED from q.comp.region: us -> FCC

# ── CONSTRAINTS CHANNEL — volunteered technology (R3) ─────────────────
# Tokens are kebab-case canonical slugs (convention `canonical_tokens`).
# Excluded by the oracle and therefore ABSENT from this list: `gps`
# (category noun inside q.intent.what's product noun phrase), `led` /
# `button` (UI primitives already captured by enum values), `cloud`,
# `app`, `pcb`, `assembly`, `antenna` (ecosystem nouns).
constraints:
  - tech: cellular
    strength: hard              # "requiemrnt" -> hard
    quote: "requiemrnt"
    volunteered_quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - tech: usb-c
    strength: hard              # "requirement" -> hard
    quote: "requirement"
    volunteered_quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    at: "2026-08-26"

  - tech: zephyr-rtos
    strength: UNKNOWN           # q.constraint.strength NEVER spawned -> runner error re.2
    quote: UNKNOWN              # no classification answer exists to quote
    volunteered_quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"

# ── R5 — UNKNOWN is data ──────────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr-rtos].strength
    blocks: []                  # q.constraint.strength feeds pir.constraints only — no metric id
    tier: required
    gate: G0
    note: "operating-system token `zephyr-rtos` is INCLUDED by the constraint oracle; the required-tier ask-back q.constraint.strength was never spawned. An unclassified included token blocks G0."

  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    tier: scoring
    note: "pair-completeness: q.scale.cost is pair-typed and only the build half was answered. The runner must pursue the sell half. Silence is UNKNOWN — conditional_fields forbids reading 'its just for me' / y1=2 units / us-only as an explicit not-for-sale."

  - field: pir.environment.limits
    blocks: []                  # q.followup.range feeds pir.environment.limits + pir.physical.dims — no metric id
    tier: scoring
    note: "q.followup.range was spawned from q.env.conditions and ASKED (how hot / how cold) but not answered. Distinct from pir.physical.dims, which is ABSENT because that spawn never happened."

# ── runner errors — convention violations and missed ask-backs ────────
runner_errors:
  - id: re.1
    kind: multi-affirmation
    question: q.env.conditions
    detail: "the runner presented 6 of the 8 declared values (water, dust, heat, cold, vibration, washing-or-hosing); `drops` and `none` were never presented, so the answer 'yes all the ones suggested' cannot bind them."
    effect: "pir.environment.conditions records only the presented-and-affirmed six; `drops` is neither selected nor UNKNOWN."

  - id: re.2
    kind: missed-ask-back
    question: q.constraint.strength
    detail: "`zephyr-rtos` was volunteered in the q.novel.magic answer; the constraint oracle includes operating systems, so the required-tier q.constraint.strength ask-back was owed and never spawned."
    effect: "pir.constraints[zephyr-rtos].strength = UNKNOWN; G0 blocked."

  - id: re.3
    kind: pair-incomplete
    question: q.scale.cost
    detail: "pair-typed question answered on the build half only; the sell half was never asked and was never explicitly declared-none."
    effect: "pir.targets.unit_cost.sell = UNKNOWN; metric.viability.economics = unknown."

# ── consistency rules — per-rule result ───────────────────────────────
consistency:
  - id: c.app-needs-link
    result: pass
    note: "not red — the rule fires only when q.fn.talks == nothing AND q.phys.controls == only-an-app. Here talks = [phone-nearby, far-away-anywhere] and controls = one-button; both answers are present, neither matches."

# ── G0 ────────────────────────────────────────────────────────────────
g0:
  status: blocked
  blockers:
    - "pir.constraints[zephyr-rtos].strength UNKNOWN — required-tier adaptive q.constraint.strength never spawned (re.2)"
  note: |
    G0 pass conditions 1-5, checked:
    (1) all 13 reachable required FIXED questions answered — including both
        conditionals, q.fn.offline (opened by phone-nearby + far-away-anywhere)
        and q.power.life (opened by charges-on-dock-or-cable). PASS.
        Required adaptive: q.constraint.strength answered for cellular and
        usb-c, NOT spawned for zephyr-rtos. FAIL -> the single blocker.
    (2) every UNKNOWN listed with the metrics it blocks. PASS.
    (3) no consistency rule red. PASS.
    (4) graph lint — not run here; out of this record's scope.
    (5) q.comp.safety = "none", so no human gate is raised from G0.

# ── R4 — provenance per field (a LIST when multi-fed) ─────────────────
provenance:
  pir.summary:
    - {question: q.intent.what, quote: "a motorcycle gps tracker so that i know where my bike is at all times", at: "2026-08-26"}
  pir.users:
    - {question: q.intent.who, quote: "its just for me", at: "2026-08-26"}
  pir.functions:
    # Per-item provenance is INLINE above (R4). This entry carries the
    # feed that produces NO item, per convention `negative-function`.
    - {question: q.fn.acts, quote: "it does not do anything to the bike", at: "2026-08-26",
       note: "negative function — no actuation item produced; the feed is satisfied here"}
  pir.environment.where:
    - {question: q.env.where, quote: "in the vehicle, hopefully tucked away somehwere hidden so that its not visible and is protecetd from wethar, as well as not easily seen by someone if the bike is stolen so i can track it", at: "2026-08-26"}
  pir.environment.conditions:
    - {question: q.env.conditions, quote: "yes all the ones suggested", at: "2026-08-26",
       note: "runner presented: water, dust, heat, cold, vibration, washing-or-hosing (see re.1)"}
  pir.environment.limits:
    - {question: q.followup.range, quote: "", at: "2026-08-26",
       note: "asked (how hot / how cold), not answered -> UNKNOWN"}
  pir.environment.on_body:
    - {question: q.env.body, quote: "nope", at: "2026-08-26"}
  pir.power_class:
    - {question: q.power.source, quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection", at: "2026-08-26",
       note: "derived: charges-on-dock-or-cable -> PC1"}
  pir.modes:
    - {question: q.power.duty, quote: "wake on event, and akwas on schel and only when used, theres a clear way in which it can use sensors to best leverage poweres in combination with user prefernecs", at: "2026-08-26"}
  pir.targets.success:
    - {question: q.intent.win, quote: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud", at: "2026-08-26"}
  pir.targets.battery_life:
    - {question: q.power.life, quote: "ideally last 1 month + in battery power, with an optional on-bike chrager from bikes battery -> usb c power, that way the device is always cajhrged in thi scenario, or if the user doesnt wanan do that, they can just cahrge it every so foten", at: "2026-08-26", note: "delight half"}
    - {question: q.power.life, quote: "no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours, could be used for racing", at: "2026-08-26", note: "floor half -> none-declared"}
  pir.targets.unit_cost:
    - {question: q.scale.cost, quote: "i dont wanna spend more than $100 on components + pcb + assembly per unit at 10 unit qty.", at: "2026-08-26", note: "build half only; sell half never asked (re.3)"}
  pir.targets.volume:
    - {question: q.scale.units, quote: "2, and maybe 10 for my freinds", at: "2026-08-26"}
  pir.physical.size_class:
    - {question: q.phys.size, quote: "no bigger than a small phone ideally, deck of cards is ok", at: "2026-08-26",
       note: "bound-asks: the stated bound is phone"}
  pir.physical.dims:
    - {question: q.followup.range, quote: ABSENT, at: ABSENT,
       note: "never spawned from q.phys.size — ABSENT, not UNKNOWN"}
  pir.physical.carry:
    - {question: q.phys.carry, quote: "it can be mounted with an adapter, but also just hidden and \"tucked\" somewhere, ideally antenann \"just works\"", at: "2026-08-26",
       note: "carry-placement: hidden/tucked counts as mounted; the concealment detail is the note — concealed, non-visible installation, antenna must work through the concealment"}
  pir.physical.controls:
    - {question: q.phys.controls, quote: "1 button and 1 led/led ring, something clean that will lookj high end", at: "2026-08-26",
       note: "the LED is hmi OUTPUT and lands in pir.functions via q.fn.shows; controls records the INPUT"}
  pir.timeline.proto:
    - {question: q.time.proto, quote: "no rush we are just testing out the system, correctness over speed, can optimize later", at: "2026-08-26"}
  pir.timeline.production:
    - {question: q.time.prod, quote: "no deadline", at: "2026-08-26"}
  pir.assets:
    - {question: q.time.exists, quote: "nothing", at: "2026-08-26"}
  pir.novelty.different:
    - {question: q.intent.exists, quote: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that", at: "2026-08-26"}
  pir.novelty.hard:
    - {question: q.novel.hard, quote: "antenna placement, multipel protocols, pjone connecton and poower", at: "2026-08-26"}
  pir.novelty.magic:
    - {question: q.novel.magic, quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building", at: "2026-08-26"}
  pir.novelty.moat:
    - {question: q.novel.moat, quote: "no compettiors", at: "2026-08-26"}
  pir.compliance.regions:
    - {question: q.comp.region, quote: "us only", at: "2026-08-26"}
  pir.compliance.safety:
    - {question: q.comp.safety, quote: "no, just hopefully not explode lol", at: "2026-08-26"}
  pir.compliance.personal_data:
    - {question: q.comp.data, quote: "yes, whatver info it has about location bascially", at: "2026-08-26"}
  pir.compliance.certifications:
    - {question: q.comp.region, quote: "us only", at: "2026-08-26",
       note: "derived: us -> fcc"}
  pir.constraints:
    - {question: q.constraint.strength, quote: "requiemrnt", at: "2026-08-26", note: "cellular"}
    - {question: q.constraint.strength, quote: "requirement", at: "2026-08-26", note: "usb-c"}
    - {question: q.constraint.strength, quote: UNKNOWN, at: ABSENT, note: "zephyr-rtos — never spawned (re.2)"}
