# Product Intent Record — extracted from the frozen interrogation transcript.
# Contracts: docs/sfd/30-p0-interrogation.md (R1-R5, PIR v0) +
# docs/sfd/30-p0-graph.yaml (types, tiers, conventions, oracle, derivations).
# Timestamps are date-only ISO 8601 (conventions.timestamps: the transcript
# carries no clock).
schema: sfd.pir/v0
product: tracker
source: scratchpad/repro/transcript.yaml   # frozen, 36 verbatim Q->A pairs, 2026-08-26

summary: "a motorcycle gps tracker so that i know where my bike is at all times"
users: "just the founder himself — a single owner tracking his own motorcycle"

# ── functions ─────────────────────────────────────────────────────────────
# S1 closed vocabulary: connectivity sensing actuation storage compute hmi
# power security time. Provenance is PER ITEM (R4). Derived items carry
# {source: derived, rule} and no quote (conventions.derived-items).
# q.fn.acts produced NO item (conventions.negative-function); its answer
# lives in provenance.pir.functions and satisfies the feed.
# hmi INPUT (the button) is NOT a function item — q.phys.controls feeds
# pir.physical.controls, and `feeds` is the authority (contract R2 table).
functions:
  - capability: sensing
    detail: "position — accurate location of the vehicle"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:                                  # conventions.rate-attachment
      periods:
        parked: "1 h"
        moving: "30 s"
      configurable: true
      question: q.fn.rate
      quote: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces"
      at: "2026-08-26"

  - capability: sensing
    detail: "altitude"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                           # q.fn.rate not spawned for this sense

  - capability: sensing
    detail: "speed / velocity"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: ABSENT                           # q.fn.rate not spawned for this sense

  - capability: sensing
    detail: "tilt / motion — the alarm trigger"
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      periods:
        reaction: "within seconds"
        alert: "as quick as possible"
      configurable: false                  # not stated -> stated-absent default
      question: q.fn.rate
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"

  - capability: connectivity
    detail: "phone-nearby — the owner's phone connects to the device when close"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: connectivity
    detail: "far-away-anywhere — location always known off-vehicle, and notifications to the phone"
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"

  - capability: hmi
    detail: "a-light — one multicolour LED / LED ring signalling device state"
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"

  - capability: storage
    detail: "retain state across power loss — it must remember things"
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: storage
    detail: "log positions/events while there is no location or link, then backfill them to the cloud"
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"

  - capability: compute
    detail: "edge autonomy — everything except alerts must keep working with no internet (logging, fixes, storage, LED state)"
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"

  - capability: power
    detail: "PC1 rechargeable + modes [wakes-on-event, wakes-on-schedule, only-when-used]"
    source: derived
    rule: derivations.capability.power

  - capability: security
    detail: "baseline — the product talks (phone-nearby, far-away-anywhere) AND collects personal data (location)"
    source: derived
    rule: derivations.capability.security

  - capability: time
    detail: "timekeeping — duty includes wakes-on-schedule"
    source: derived
    rule: derivations.capability.time

# ── environment ───────────────────────────────────────────────────────────
environment:
  where: vehicle
  # multi-affirmation: binds ONLY to the values the runner PRESENTED.
  # `drops` and `none` were never presented -> runner_errors[0].
  conditions: [water, dust, heat, cold, vibration, washing-or-hosing]
  limits: UNKNOWN            # q.followup.range asked (how hot / how cold), not answered — R5
  on_body: "no"

# ── power ─────────────────────────────────────────────────────────────────
power_class: PC1             # derived: q.power.source = charges-on-dock-or-cable
modes: [wakes-on-event, wakes-on-schedule, only-when-used]

# ── targets ───────────────────────────────────────────────────────────────
targets:
  success: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud"
  battery_life:              # CONDITIONAL field: present because power_class = PC1
    delight: "1 month+"
    floor: none-declared     # conventions.declared-none: "no lowest threshold" answers the floor asked
  unit_cost:
    build: "<= 100 USD per unit (components + pcb + assembly) at 10-unit qty"
    sell: UNKNOWN            # never asked — pair-completeness runner error (runner_errors[2]).
                             # NOT absent: conditional_fields requires an explicit
                             # statement about THE SALE ITSELF; "its just for me"
                             # and the unit volumes never qualify.
  volume:
    y1: 2
    y3: 10

# ── physical ──────────────────────────────────────────────────────────────
physical:
  size_class: phone          # conventions.bound-asks: record the stated bound
  dims: ABSENT               # q.followup.range not spawned for q.phys.size (bound `phone` is not a tight pick)
  carry: mounted             # conventions.carry-placement: hidden/tucked == mounted
  controls: one-button
  notes: "concealed installation — tucked/hidden out of sight and out of weather, mounted with an adapter; the antenna must work from concealment (conventions.carry-placement routes the concealment detail here)"

# ── timeline + assets ─────────────────────────────────────────────────────
timeline:
  proto: none-declared       # "no rush ... correctness over speed" — the asked date does not bind
  production: none-declared  # "no deadline"
assets: [nothing]            # conventions.enum-values-as-given: [nothing] stays [nothing]

# ── novelty ───────────────────────────────────────────────────────────────
novelty:
  different: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that"
  hard: "antenna placement, multipel protocols, pjone connecton and poower"
  magic: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
  moat: "no compettiors"

# ── compliance ────────────────────────────────────────────────────────────
compliance:
  regions: [us]
  safety: "none"             # verbal hedge "hopefully not explode lol" cannot move the enum; it rides in the P1 evidence
  personal_data: [location]
  certifications: [fcc]      # derived: derivations.pir.compliance.certifications, us -> fcc

# ── constraints — the volunteered-technology channel (R3) ─────────────────
# Tokens EXCLUDED by constraint_oracle.excluded, recorded here as comments
# only (they are not constraint records): `gps` (category noun inside
# q.intent.what's product noun phrase), `led` / `button` (UI primitives
# already captured by q.fn.shows / q.phys.controls enum values), `cloud`,
# `app`, `pcb`, `assembly`, `antenna` (ecosystem nouns).
# Tokens are kebab-case slugs (constraint_oracle.canonical_tokens).
constraints:
  - tech: cellular
    strength: hard
    quote: "requiemrnt"
    volunteered_quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  - tech: usb-c
    strength: hard
    quote: "requirement"
    volunteered_quote: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"
    at: "2026-08-26"
  - tech: zephyr-rtos
    strength: UNKNOWN        # q.constraint.strength never spawned — runner_errors[1]; required tier -> blocks G0
    quote: UNKNOWN
    volunteered_quote: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building"
    at: "2026-08-26"

# ── R5 — UNKNOWN is data ──────────────────────────────────────────────────
unknowns:
  - field: pir.constraints[zephyr-rtos].strength
    blocks: []
    tier: required
    gate: G0
    note: "an operating system is an included token (constraint_oracle.volunteered_when); the ask-back never fired, so the token is unclassified and hard-blocks G0"
  - field: pir.targets.unit_cost.sell
    blocks: [metric.viability.economics]
    tier: scoring
    note: "the sell half of the pair was never asked (pair-completeness); silence is UNKNOWN, never ABSENT — the founder made no statement about the sale itself"
  - field: pir.environment.limits
    blocks: []
    tier: scoring
    note: "q.followup.range was asked (how hot / how cold) and not answered. It feeds no metric, so it blocks none; metric.feasibility.env-risk is still scoreable from q.env.where + q.env.conditions, only with less precision"

# ── G0 ────────────────────────────────────────────────────────────────────
g0:
  status: blocked
  blockers:
    - "pir.constraints[zephyr-rtos].strength is UNKNOWN — q.constraint.strength is required tier and was never spawned for the volunteered token `zephyr-rtos` (constraint_oracle.rule)"
  passed:
    - "every other reachable required question is answered (q.intent.what, q.intent.who, q.fn.senses, q.fn.acts, q.fn.talks, q.fn.offline [opened], q.fn.shows, q.fn.stores, q.power.source, q.power.life [opened], q.power.duty, q.comp.safety, q.comp.data; q.constraint.strength answered for cellular and usb-c)"
    - "every UNKNOWN is listed with the metrics it blocks (R5)"
    - "no consistency rule is red"

runner_errors:
  - question: q.env.conditions
    kind: multi-affirmation
    detail: "the runner presented only 6 of the 8 values (water, dust, heat, cold, vibration, washing-or-hosing); `drops` and `none` were never presented, so the blanket 'yes all the ones suggested' cannot bind them"
    effect: "pir.environment.conditions binds to the 6 presented values only; `drops` is neither affirmed nor denied"
  - question: q.novel.magic
    kind: missed-ask-back
    detail: "`zephyr rtos` is a volunteered implementation choice (operating system) under constraint_oracle.volunteered_when; the required q.constraint.strength ask-back never fired"
    effect: "pir.constraints[zephyr-rtos].strength UNKNOWN — G0 blocked"
  - question: q.scale.cost
    kind: pair-completeness
    detail: "a pair-typed question was left half-answered — the build half was given, the sell half was never pursued"
    effect: "pir.targets.unit_cost.sell UNKNOWN — blocks metric.viability.economics (core)"

consistency:
  - id: c.app-needs-link
    result: green
    note: "did not fire: q.fn.talks = [phone-nearby, far-away-anywhere] (not `nothing`) and q.phys.controls = one-button (not `only-an-app`) — both referenced answers present, no contradiction"

