# P1 feasibility scorecard for the PIR above.
# Contracts: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
# precedence, catalog seam + evidence bar, record spec) and
# docs/sfd/40-p1-registry.yaml (16 metrics, scales, derivations, absent_when).
# Evidence base: catalog/ at zephyr_sha 413b789deb391d3a37d06b463288a5fe765ee57e
# (3 records: socs/esp32c6 D1, socs/mimxrt1052 D1, components/bosch,bme280 D2).
schema: sfd.scorecard/v0
pir:
  ref: repro/run4/iK/pir.yaml
  hash: 'sha256:10ade061d54264b726f5480e07d07f9ab2bce89bf1806ebc63144b90d8c77c90'

scores:
  # ── VIABILITY ────────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.intent.what is one sentence naming the artifact, the subject and the outcome: "a motorcycle gps tracker so that i know where my bike is at all times".'
      - 'the "for whom" half is closed by q.intent.who ("its just for me") — owner-operator of one motorcycle. No contradiction anywhere in the record.'
    blocked_by: []

  - id: metric.viability.outcome
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.intent.win states four checkable conditions: installed, running on the bike, notifications reaching the phone, location tracked in the cloud.'
      - 'every one of those follows from functions already in the PIR (sensing/position, connectivity phone-nearby + far-away-anywhere, storage backfill) — a working product plausibly reaches it.'
      - 'the outcome is binary-observable rather than numeric; the scale asks for measurable and plausible, not quantified, so this stays green.'
    blocked_by: []

  - id: metric.viability.economics
    score: unknown
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent
    evidence:
      - 'build half answered: USD 100 max per unit for components + pcb + assembly at 10-unit qty (q.scale.cost).'
      - 'volume answered: y1 = 2, y3 = 10 (q.scale.units).'
      - 'sell half is UNKNOWN, not ABSENT: the not-for-sale limb of the scale requires an explicit statement about THE SALE ITSELF, and conditional_fields explicitly disqualifies "just for me", unit volumes and regions. Neither the sell limb nor the not-for-sale limb of the scale can be evaluated.'
      - 'PRE-EMPTIVE NOTE for the runner, not a score: were the not-for-sale limb to hold, the USD 100 budget at 10 units against a GNSS receiver + cellular modem + IMU + barometer + PMIC + Li-ion + antennas + enclosure BOM would be scored amber at best (budget tight for the BOM class), never green. Recorded so the blocker is answered with the right expectation.'
    blocked_by: [pir.targets.unit_cost.sell]

  - id: metric.viability.novelty
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'the founder concedes the category exists: "yes, others exist" (q.intent.exists).'
      - 'the stated difference is "more powerful", "cool technologies", "accurate locations and alamr" — incremental and unverified against any NAMED competing product; q.novel.moat is "no compettiors", which contradicts the concession rather than resolving it.'
      - 'not red: no existing product is claimed to already BE this, and the personal build motive is coherent.'
    blocked_by: []

  # ── TECH-EXISTS (catalog seam) ───────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - 'q.novel.magic is "not really" — the founder claims nothing never-before-seen; the ask is only whether every needed capability has a proven path.'
      - 'catalog QUERY, capability connectivity (BLE, phone-nearby): catalog/socs/esp32c6.yaml, depth D1 @ zephyr 413b789d, declares espressif,esp32-bt-hci and espressif,esp32-wifi with boards espressif/esp32c6_devkitc and seeed/xiao_esp32c6. D1 = declared, not supported -> amber per the catalog seam, never green.'
      - 'catalog QUERY, capability sensing (altitude): catalog/components/bosch,bme280.yaml, depth D2 @ zephyr 413b789d — binding + driver drivers/sensor/bosch/bme280, exercised by 19 in-tree dts/overlays. Barometric altitude has a D2 path. This is the ONLY D2 record in the catalog.'
      - 'GAP (named research task) — cellular WAN: zero catalog records. Known example NAMED per the evidence bar: upstream Zephyr ships drivers/modem/modem_cellular with in-tree support for Quectel BG95 / EG25-G, u-blox SARA-R4/R5 and Simcom SIM7080. Named example + zero coverage = amber with a research task (extract a modem/cellular record into catalog/).'
      - 'GAP (named research task) — GNSS positioning: zero catalog records. Known example NAMED: upstream Zephyr ships the drivers/gnss subsystem (gnss_nmea_generic, u-blox M8/M10, Quectel LC26G). Amber with a research task.'
      - 'GAP (named research task) — IMU/tilt: zero catalog records; the one component record is a pressure/humidity sensor. Known example NAMED: upstream Zephyr accelerometer/IMU drivers (bosch,bmi270, st,lis2dh) are in-tree and widely exercised. Amber with a research task.'
      - 'SHIPPED PRODUCT CLASS named: aftermarket motorcycle GPS/theft trackers combining GNSS + cellular + IMU on battery (Monimoto, Invoxia, Queclink) exist and ship. No capability here is unproven in the world; the gaps are catalog gaps.'
      - 'no capability scores red: the scorer searched and can name a working example for every one. Ceiling: with esp32c6 at D1 and no cellular/GNSS record, green is unreachable — the D1-ceiling residual, stated rather than hidden.'
    blocked_by: []

  # ── FEASIBILITY ──────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.env.where = vehicle; q.env.conditions = water, dust, heat, cold, vibration, washing-or-hosing — three of the scale-named hard conditions are present at once (washing-or-hosing, vibration, and heat/cold extremes).'
      - 'a concealed motorcycle mount adds engine-bay heat soak and continuous vibration to an IP-rated sealed enclosure; all of it is costed, known art (potting, gasketed enclosure, conformal coating, vibration-rated connectors).'
      - 'not red: none of it demands engineering with no path — it demands money and an enclosure programme.'
      - 'RISK CARRIED: pir.environment.limits is UNKNOWN (the how-hot/how-cold follow-up was asked and not answered), so no numeric range binds the enclosure or the cell chemistry. The condition SET is what scored, and it is answered; the metric is not blocked (q.followup.range feeds no metric).'
    blocked_by: []

  - id: metric.feasibility.connectivity
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - 'stated counterparts (q.fn.talks): phone-nearby AND far-away-anywhere. Derived links: a short-range phone radio (BLE) plus a wide-area link; the user volunteered cellular as a HARD constraint, which fixes the wide-area lane rather than deriving it.'
      - 'catalog QUERY, phone-nearby lane: catalog/socs/esp32c6.yaml declares espressif,esp32-bt-hci at depth D1 @ zephyr 413b789d. The seam is explicit: D1-only coverage is amber, never green.'
      - 'catalog QUERY, far-away-anywhere lane: NO coverage. Neither supported SoC record carries a cellular modem — catalog/socs/esp32c6.yaml and catalog/socs/mimxrt1052.yaml compatibles lists contain no modem/WWAN compatible. Named research task: extract a cellular modem record.'
      - 'named example for the uncovered lane (evidence bar): upstream Zephyr drivers/modem/modem_cellular over UART to an LTE-M/NB-IoT module is an in-tree, supported implementation; shipped consumer motorcycle trackers do exactly this pairing.'
      - 'not red: a radio DOES reach the stated counterpart at the stated distance — LTE-M reaches anywhere with coverage, and BLE reaches the phone in the garage. Red requires no link reaching the counterpart, which is false.'
      - 'amber limb matched exactly: "achievable but outside current lanes, or coverage only at D1 with risk" — both limbs are true here at once.'
    blocked_by: []

  - id: metric.feasibility.power-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    derivation_applied: 'floor is none-declared -> the BINDING target is the delight target (1 month or more). A none-declared floor does not make green vacuous.'
    evidence:
      - 'power_class PC1 (charges-on-dock-or-cable, derived from q.power.source), modes [wakes-on-event, wakes-on-schedule, only-when-used] — always-on was NOT selected.'
      - 'binding target = delight = "1 month +" on battery; the floor is none-declared ("no lowest threshold"), so the floor limb cannot carry green on its own.'
      - 'the delight target requires aggressive sleep design and is not comfortable: an hourly parked GNSS fix plus a 30 s fix cadence while moving plus an always-armed tilt wake plus a cellular attach for each report is the dominant load, and the esp32c6 record shows only two power states (standby: 200 us min residency / 60 us exit; soft-off: 2000 us / 212 us) — no measured deep-sleep current in the catalog at all.'
      - 'mitigations exist and are stated by the user: an optional on-bike charger from the bike battery to USB-C makes the 1-month figure moot in the mounted case, and the rate is explicitly configurable by power preference.'
      - 'not red: red requires the binding target to violate the power class physically. A rechargeable pack (PC1, not a coin cell) reaching a month with duty-cycled GNSS/cellular is aggressive, not physically impossible — and no always-on radio was selected.'
      - 'amber limb matched exactly: "delight target requires aggressive sleep design; floor reachable" — the floor is trivially reachable because none was declared, and the hours-scale racing use the founder named as acceptable confirms it.'
    blocked_by: []

  - id: metric.feasibility.head-start
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.time.exists = [nothing] — no sketches, no model, no prototype, no code, no factory contact, no funding.'
      - 'the second amber limb applies verbatim: "nothing exists but the timeline carries no pressure" — both timeline fields are none-declared (q.time.proto "no rush", q.time.prod "no deadline").'
      - 'not red: red requires nothing AND a timeline that assumes otherwise. No timeline assumes anything here.'
    blocked_by: []

  # ── RISK ─────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    derivation_applied: 'no dates declared on either feed -> the green none-declared limb, stated in evidence as the scale requires.'
    evidence:
      - 'q.time.proto = none-declared ("no rush we are just testing out the system, correctness over speed, can optimize later").'
      - 'q.time.prod = none-declared ("no deadline").'
      - 'STATED AS SUCH: no schedule risk is asserted by this score. It is the absence of dates, not the presence of slack — a later declared date re-scores this metric.'
    blocked_by: []

  - id: metric.risk.self-assessed
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.novel.hard names "antenna placement, multipel protocols, pjone connecton and poower" — four fears.'
      - 'the fear is PLACED RIGHT: for a concealed, metal-surrounded, three-radio (GNSS receive + cellular transmit + BLE), battery-powered vehicle device, antenna placement/coexistence and the power budget genuinely ARE the hard parts, and they are the same two things metric.feasibility.connectivity and metric.feasibility.power-risk independently flagged amber.'
      - 'no plan exists for any of them: q.time.exists = [nothing] — no prototype, no RF work, no model. Green requires the fear to match AND have a plan.'
      - 'amber limb matched exactly: "the fear is real but unplanned-for".'
      - 'ONE UNSEEN HARD PART, noted without moving the score: the enclosure/environment programme (washing-or-hosing + vibration + heat, with pir.environment.limits UNKNOWN) appears nowhere in the founder fears.'
    blocked_by: []

  - id: metric.risk.safety
    score: green
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate_when: serious
    derivation_applied: "q.comp.safety = 'none' -> green; the human gate fires only on serious, so no gate is raised."
    evidence:
      - "q.comp.safety = 'none', from \"no, just hopefully not explode lol\"."
      - 'the hedge in that answer cannot move a derived score — a verbal hedge on an enum answer is a named contract residual. The hazard it points at is carried to the G1 human instead, here: a Li-ion cell concealed on a motorcycle, exposed to engine heat, vibration and hosing, charged over USB-C from the bike battery. That is a real thermal-runaway / charge-safety surface that a G1 human should read before clearing.'
      - 'the product actuates nothing on the bike ("it does not do anything to the bike"), which removes the whole vehicle-control harm class.'
    blocked_by: []

  - id: metric.risk.privacy
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    derivation_applied: 'q.comp.data = [location] -> the amber limb names location explicitly.'
    evidence:
      - 'q.comp.data = [location] ("yes, whatver info it has about location bascially"); no voice, video, health or identity.'
      - 'amber limb matched exactly: "personal data with known regimes (location, voice)".'
      - 'not red: red requires health/identity data without a compliance plan; neither is collected.'
      - 'context for G1, not score-bearing: the location trail is continuous, cloud-stored and single-subject (users = "its just for me"), and q.comp.region = [us] keeps it out of GDPR for now.'
    blocked_by: []

  # ── PLATFORM (consumer P2 — never bears on the P1 verdict) ───────────
  - id: metric.platform.edge-autonomy
    score: amber
    consumer: P2-class
    scored_by: agent
    absent_when_checked: 'q.fn.talks == nothing — FALSE (it is [phone-nearby, far-away-anywhere]); the metric is scored, not ABSENT.'
    evidence:
      - 'q.fn.offline = "no alerts but yes everything else" — the founder explicitly accepts losing the alert path offline and keeping the rest.'
      - 'the rest is real and on-device: q.fn.stores requires the device to "hit low power modes and save things if no location, then backtrack to the cloud" — store-and-forward is an offline-first behaviour.'
      - 'not green: alerting is the theft-response half of the stated success condition, and it dies with the link. Not red: the device is not dead without the cloud — it keeps sensing, logging and backfilling.'
      - 'amber limb matched exactly: "degrades offline in acceptable ways" — acceptable BY THE FOUNDER, in his own words.'
    blocked_by: []

  - id: metric.platform.hmi-class
    score: green
    consumer: P2-class
    scored_by: derived
    derivation_applied: 'q.fn.shows = a-light and q.phys.controls = one-button -> the LED/none/sound limb.'
    evidence:
      - 'q.fn.shows = a-light ("no screen, maybe a multicolo led to signal states, simople is best").'
      - 'q.phys.controls = one-button ("1 button and 1 led/led ring").'
      - 'green limb matched exactly: "none/LED/sound — lane B territory". No screen of any kind and one control is the least demanding HMI the scale defines; the "high end" aesthetic wish carries no compute or lane consequence.'
    blocked_by: []

  - id: metric.platform.compute-demand
    score: green
    consumer: P2-class
    scored_by: derived
    absent_when_checked: 'q.fn.rate never spawned — FALSE (it spawned twice: position and tilt/motion); the metric is scored, not ABSENT.'
    derivation_applied: 'every stated rate period >= 1 s and no continuous stream processing -> green.'
    evidence:
      - 'stated periods, position (q.fn.rate): 1 h parked, 30 s moving — both >= 1 s, and explicitly configurable by power preference.'
      - 'stated period, tilt/motion (q.fn.rate): "within seconds" — >= 1 s at the stated granularity.'
      - 'no stream processing anywhere in pir.functions: no vision, no audio, no hard-real-time control loop; the product actuates nothing.'
      - 'HEDGE CARRIED, not score-bearing: "if an alert it must be as quick as possible" is a latency wish on the alert path, not a stated sub-second period. The derivation scores STATED periods; the wish is a P2 input. The tilt trigger itself is an accelerometer wake interrupt, not a polled sub-second loop.'
    blocked_by: []

# ── derived flags (consumer P2) ────────────────────────────────────────
derived:
  needs_hardware: true
  needs_firmware: true

derived_evidence:
  needs_hardware:
    - 'rule: any sensing, actuation, on-device HMI, or physical function in pir.functions.'
    - 'sensing present, 5 items (position, altitude, speed, velocity, tilt) from q.fn.senses.'
    - 'on-device HMI present: hmi/a-light from q.fn.shows, plus pir.physical.controls = one-button.'
    - 'physical present: pir.physical.size_class = phone, carry = mounted, environment.where = vehicle.'
    - 'actuation is the only limb that is empty ("it does not do anything to the bike") — the rule is a disjunction, so the flag holds on the other three.'
  needs_firmware:
    - 'rule: needs_hardware AND any on-device logic (true unless purely passive/analog).'
    - 'needs_hardware = true.'
    - 'on-device logic is explicit and not passive: edge autonomy with no internet (q.fn.offline), store-and-backfill across power loss (q.fn.stores), software-configurable sampling rates (q.fn.rate), and a three-mode duty policy (q.power.duty).'

human_gates: []   # q.comp.safety = 'none'; human_gate_when: serious never fired

recommendation:
  verdict: blocked
  rule_applied: 2   # precedence rule 2: a core metric is unknown -> blocked.
                    # Rule 1 (human gate) was evaluated first and did not fire.
  blockers:
    - metric: metric.viability.economics
      score: unknown
      blocked_by: [pir.targets.unit_cost.sell]
      answered_by: 'ask q.scale.cost''s sell half — "what price sells it?" — or obtain an explicit statement about THE SALE ITSELF ("not for sale"), which makes the field ABSENT and routes economics to its not-for-sale limb. A statement about users, volume or region does NOT answer it.'
      note: 'a DESIGNED outcome, not a defect: economics is a core metric fed by scoring-tier questions, so this UNKNOWN could legitimately have passed G0 and still stopped here. Here G0 also failed, for a different reason.'
  reasons:
    # reasons[0] carries the G0 state — a PIR that failed G0 is still scoreable,
    # and its G0 state is never hidden.
    - 'G0 STATE: blocked. pir.constraints[zephyr-rtos].strength is UNKNOWN and q.constraint.strength is tier required — the volunteered operating-system token was never classified (runner error re.2). Two other volunteered tokens WERE classified, both hard: cellular and usb-c.'
    - 'rules 3-4, evaluated and recorded although precedence stopped at rule 2: NO core metric is red (economics unknown, tech.exists amber, connectivity amber, power-risk amber, safety green), so rule 3 would not fire and rule 4 would recommend GO with the ambers below. The kill limb is doubly inapplicable — tech.exists is not red, and q.novel.magic is "not really", so there is no stated magic for a red to destroy.'
    - 'AMBER (verdict-bearing, core): metric.feasibility.connectivity — the far-away-anywhere lane has zero catalog coverage and the phone-nearby lane is D1-only. Research task: extract a cellular modem record and raise esp32c6 above D1.'
    - 'AMBER (verdict-bearing, core): metric.feasibility.power-risk — the binding target is the 1-month delight figure (floor none-declared) and it demands aggressive sleep design against duty-cycled GNSS + cellular.'
    - 'AMBER (verdict-bearing, core): metric.tech.exists — every needed capability has a NAMED upstream Zephyr or shipped-product example, but the catalog covers only barometric sensing at D2. Three named research tasks: cellular modem, GNSS, IMU.'
    - 'AMBER (verdict-bearing, minor): metric.viability.novelty — the difference is incremental and no competitor is named; q.novel.moat ("no compettiors") contradicts q.intent.exists ("yes, others exist").'
    - 'AMBER (verdict-bearing, minor): metric.feasibility.env-risk — washing-or-hosing + vibration + heat/cold together on a concealed vehicle mount; costed, known art, but an enclosure programme.'
    - 'AMBER (verdict-bearing, minor): metric.feasibility.head-start — nothing exists; benign only because no date presses.'
    - 'AMBER (verdict-bearing, minor): metric.risk.self-assessed — the fears are correctly placed but wholly unplanned-for, and the enclosure/environment programme is an unseen hard part.'
    - 'AMBER (verdict-bearing, minor): metric.risk.privacy — a continuous single-subject location trail, US-only for now.'
    - 'AMBER (NON-VERDICT-BEARING, P2-class): metric.platform.edge-autonomy — alerts die offline by the founder''s explicit acceptance; P2 must weigh it.'
    - 'OPEN UNKNOWNS that do NOT block the verdict: pir.environment.limits (no numeric heat/cold range; the follow-up was asked and unanswered) and pir.constraints[zephyr-rtos].strength (G0-blocking, but q.constraint.strength feeds no metric).'
    - 'RUNNER ERRORS carried into scoring: q.env.conditions was presented partially (6 of 8 values; drops and none never offered), so the condition set that fed metric.feasibility.env-risk is an incomplete affirmation.'
    - 'HAZARD FOR THE G1 HUMAN, not score-bearing: metric.risk.safety is derived green from q.comp.safety = ''none'', but the answer carried the hedge "hopefully not explode lol" over a Li-ion pack concealed on a motorcycle with engine heat, vibration and hosing.'

decision: {}   # F4 — the human decides G1. Empty until then.
