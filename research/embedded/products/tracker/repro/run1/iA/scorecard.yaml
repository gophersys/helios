# P1 feasibility scorecard for the PIR "tracker".
# Contract: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
# precedence) + docs/sfd/40-p1-registry.yaml (the 16 metric definitions).
# Every score uses ITS OWN metric's scale text, never the global gloss alone.
# Catalog evidence is cited as path + depth; the catalog at this SHA holds
# exactly three records (2 SoCs, 1 component), so most gaps below are
# coverage gaps, named as research tasks per F3.
schema: sfd.scorecard/v0
pir:
  ref: scratchpad/repro/run1/iA/pir.yaml
  hash: 'sha256:5709d982327a0b2b669b5c568ca0fadbf351b4e823a92762582492a1fadf6ba6'
catalog:
  root: catalog/
  zephyr_sha: 413b789deb391d3a37d06b463288a5fe765ee57e
  records_total: 3

scores:
  # ── VIABILITY ────────────────────────────────────────────────────────
  - id: metric.viability.clarity
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: green
    evidence:
      - 'q.intent.what: "a motorcycle gps tracker so that i know where my bike is at all times" — one sentence, no contradiction'
      - 'q.intent.who: "its just for me" — the "for whom" half is equally crisp'
      - 'scale green ("one sentence says what it does and for whom") is met on both halves in one line each'
    blocked_by: []

  - id: metric.viability.outcome
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: green
    evidence:
      - 'q.intent.win: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud" — three observable conditions (installed+running, notification delivered, cloud track present)'
      - 'each condition is directly producible by the product as stated; no third party, market or adoption assumption stands between the build and the outcome'
      - 'caveat (does not move the level): "at all times" tracking is in tension with the 1-month battery delight target; that tension is scored at metric.feasibility.power-risk, not here'
    blocked_by: []

  - id: metric.viability.economics
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    score: unknown
    evidence:
      - 'q.scale.cost answered only the build half: "i dont wanna spend more than $100 on components + pcb + assembly per unit at 10 unit qty." — build <= 100 USD at qty 10'
      - 'q.scale.units: "2, and maybe 10 for my freinds" — y1 = 2, y3 = 10'
      - 'the metric is scored_by derived and every scale level (green/amber/red) is a comparison of sell against build; with pir.targets.unit_cost.sell UNKNOWN the comparison cannot be computed, and R5 forbids defaulting it'
      - 'context, not a substitute for the answer: users = "its just for me" and volume 2/10 describe a non-commercial build, which is why the sell half was probably never in the founder head — but ABSENT is only available where a conditional_fields / absent_when clause declares it, and neither exists for unit_cost.sell'
    blocked_by: [pir.targets.unit_cost.sell]

  - id: metric.viability.novelty
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: amber
    evidence:
      - 'q.intent.exists: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that" — the founder concedes the category is occupied'
      - 'the stated difference (more powerful, cooler technology, more accurate location, alarm) is incremental and unverified against any named competitor; q.novel.moat: "no compettiors" names none'
      - 'not red: red requires "an existing product already is this" with no stated difference; a difference IS stated, it is merely unproven — scale amber ("difference is incremental or unverified") fits exactly'
    blocked_by: []

  # ── TECH-EXISTS ──────────────────────────────────────────────────────
  - id: metric.tech.exists
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    score: amber
    evidence:
      - 'q.novel.magic: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building" — the founder claims NO capability he has never seen work, so nothing here is red-by-magic'
      - 'catalog HIT — connectivity (phone-nearby): catalog/socs/esp32c6.yaml, depth D1, compatibles espressif,esp32-bt-hci + espressif,esp32-wifi + espressif,esp32-ieee802154 @ zephyr 413b789deb39'
      - 'catalog HIT — sensing (altitude): catalog/components/bosch,bme280.yaml, depth D2, drivers/sensor/bosch/bme280, buses i2c+spi — barometric pressure gives the altitude sense; this is the ONLY D2 record in the catalog'
      - 'catalog GAP — sensing (position/GNSS): no component record exists in catalog/components/ for any GNSS receiver. Research task: extract a GNSS component record (Zephyr gnss subsystem + a modem/uart-attached receiver binding)'
      - 'catalog GAP — connectivity (far-away-anywhere/cellular): no cellular modem record in catalog/, and neither supported SoC declares a cellular compatible (esp32c6: none; catalog/socs/mimxrt1052.yaml D1: nxp,enet is wired ethernet). Research task: extract a cellular modem capability record'
      - 'catalog GAP — sensing (tilt/motion, speed/velocity): no accelerometer/IMU component record in catalog/components/ (the directory holds exactly one file). Research task: extract an IMU record'
      - 'not green: green needs "every needed capability has a proven path (catalog D2+ or a shipped product)"; three of four needed capabilities have NO catalog record at all, so "proven path" would rest on outside-the-catalog knowledge that F3 does not let this scorer bank'
      - 'not red: red needs "the core capability has no known working example"; GNSS + cellular asset trackers are a shipped product class, so the core capability demonstrably works somewhere — the failure is coverage, not existence'
      - 'scale amber ("a path exists but unproven here (catalog D1, or driver-work flagged)") is the exact fit: the one in-lane SoC is D1 and three capabilities are driver-work-or-extraction flagged'
    blocked_by: []

  # ── FEASIBILITY ──────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: amber
    evidence:
      - 'q.env.where = vehicle: "in the vehicle, hopefully tucked away somehwere hidden so that its not visible and is protecetd from wethar..." — hidden mounting compounds the RF problem the founder himself names at q.novel.hard'
      - 'q.env.conditions = [water, dust, heat, cold, vibration, washing-or-hosing] ("yes all the ones suggested") — the founder accepted every proposed condition, including two the metric names explicitly'
      - 'scale amber names washing-or-hosing and vibration as the hard conditions; both are present, and both are known art (sealed/potted enclosure, IP-rated connector or wireless charging, automotive vibration derating)'
      - 'not red: red requires conditions with no path; none of the six lacks a standard, costed engineering answer'
      - 'evidence weakness, recorded not hidden: pir.environment.limits is UNKNOWN (the how-hot/how-cold follow-up was asked and left unanswered), so the amber rests on the unquantified condition SET, not on numbers. The metric feeds are q.env.where + q.env.conditions, both answered, so the score is not blocked'
    blocked_by: []

  - id: metric.feasibility.connectivity
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    score: amber
    evidence:
      - 'q.fn.talks names TWO counterparts in one answer: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that" — a wide-area link (far-away-anywhere, the binding one) plus a short-range phone link (phone-nearby)'
      - 'derived link 1, phone-nearby: catalog/socs/esp32c6.yaml depth D1 declares espressif,esp32-bt-hci — inside supported lane B, but D1 (declared inventory, not proven support)'
      - 'derived link 2, far-away-anywhere: NOT covered by either lane. catalog/socs/esp32c6.yaml has no cellular compatible; catalog/socs/mimxrt1052.yaml (D1, lane A) has none either. The link needs an external modem with no catalog record'
      - 'the cellular choice is a HARD constraint, not a derivation: pir.constraints[cellular].strength = hard, quote "requiemrnt" — it filters the P4 fit matrix rather than leaving the radio open'
      - 'scale amber ("achievable but outside current lanes, or coverage only at D1 with risk") matches on BOTH clauses: link 2 is outside the lanes, link 1 is D1-only'
      - 'not red: red requires that no radio reaches the stated counterpart at the stated distance and power; LTE-M/NB-IoT reaches anywhere with cellular service, so the constraint is power and cost, not reach'
      - 'research task 1: extract a cellular modem capability record into catalog/components/ so the WAN link stops being unevidenced'
      - 'research task 2: concurrent-radio coexistence (cellular + BLE + GNSS) on one hidden, metal-surrounded mount — the founder own top fear at q.novel.hard ("antenna placement, multipel protocols")'
      - 'research task 3: derivations.pir.compliance.certifications maps us -> [fcc] only; an intentional cellular radiator additionally needs a carrier/PTCRB path that the derivation map does not model. Named here, not silently added to the PIR'
    blocked_by: []

  - id: metric.feasibility.power-risk
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    score: amber
    evidence:
      - 'q.power.source -> pir.power_class = PC1 (rechargeable, "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection")'
      - 'q.power.life delight = 1 month or more: "ideally last 1 month + in battery power, with an optional on-bike chrager from bikes battery -> usb c power..."'
      - 'q.power.life floor = none: "no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours, could be used for racing"'
      - 'q.power.duty -> pir.modes = [wakes-on-event, wakes-on-schedule, only-when-used] — no always-on mode was claimed'
      - 'not red: red is "floor target violates the stated power class"; the floor is explicitly absent (hours are acceptable), so no floor can be violated'
      - 'not green: green is "floor target comfortably plausible" — true — but the metric level must also carry the delight target, and 1 month+ on a rechargeable pack while GNSS fixes every 30 s when moving and a cellular link reports out is exactly the aggressive-sleep case'
      - 'scale amber ("delight target requires aggressive sleep design; floor reachable") is the literal fit. The esp32c6 record shows only two power states (standby 200 us residency / 60 us exit, soft-off 2000 us / 212 us) at D1 — catalog/socs/esp32c6.yaml — which is thin evidence for a month-scale budget and is a P3 power-budget input'
    blocked_by: []

  - id: metric.feasibility.head-start
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: amber
    evidence:
      - 'q.time.exists = [nothing] ("nothing") — no sketches, no model, no prototype, no software, no factory contact, no funding'
      - 'not green: green needs working code/prototype or a factory path in hand; none exists'
      - 'not red as written: the red level is a CONJUNCTION — "nothing — and the timeline assumes otherwise". The second limb is false: q.time.proto "no rush we are just testing out the system, correctness over speed" and q.time.prod "no deadline" assume nothing at all'
      - 'no registry level fits a nothing-exists / nothing-assumed product exactly; amber is taken as the nearest defensible level (worse than green, red conjunct unmet). Recorded as a registry v0 scale gap, minor weight, no verdict effect'
    blocked_by: []

  # ── RISK ─────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    score: green
    evidence:
      - 'q.time.proto: "no rush we are just testing out the system, correctness over speed, can optimize later" — an explicit non-constraint, answered rather than skipped'
      - 'q.time.prod: "no deadline" — likewise'
      - 'scale green is "dates fit known lead times with slack"; with no date on either side the slack is unbounded and no lead time can be preceded — the only mechanically derivable level'
      - 'both answers are recorded in the PIR as the value "none", NOT as UNKNOWN: the founder answered the question, he did not fail to'
    blocked_by: []

  - id: metric.risk.self-assessed
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    score: amber
    evidence:
      - 'q.novel.hard: "antenna placement, multipel protocols, pjone connecton and poower" — four fears'
      - 'the fears are placed RIGHT, not wrong: a hidden metal-surrounded mount (q.env.where) attacking GNSS + cellular + BLE antennas simultaneously, and a month-scale budget under those radios, are precisely what metric.feasibility.connectivity and metric.feasibility.power-risk independently flag amber'
      - 'not green: green requires the fear to match the hard part AND have a plan; q.time.exists = nothing means no plan, no prototype and no measurement exists behind any of the four'
      - 'scale amber ("the fear is real but unplanned-for") fits exactly'
      - 'unseen-by-the-founder additions, named for the human and not scored here: cellular data plan/carrier certification, and lithium-battery abuse on a vibrating outdoor vehicle'
    blocked_by: []

  - id: metric.risk.safety
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate_when: serious
    score: green
    evidence:
      - 'q.comp.safety = "none": "no, just hopefully not explode lol" — the leading token is a plain no, which is the enum value none'
      - 'the metric is scored_by derived and the map is mechanical: none -> green ("no plausible harm path")'
      - 'human_gate_when is serious ONLY; the answer is none, so NO human gate is raised and F5 does not fire'
      - 'recorded tension, which a derived scorer may not act on: the founder own trailing hedge ("hopefully not explode") names a lithium-cell hazard on a vehicle exposed to heat, cold, vibration and hosing (q.env.conditions). The registry gives this scorer no lever to escalate a founder none to minor; it is surfaced in recommendation.reasons for the G1 human instead'
    blocked_by: []

  - id: metric.risk.privacy
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    score: amber
    evidence:
      - 'q.comp.data = [location]: "yes, whatver info it has about location bascially"'
      - 'scale amber names location explicitly: "personal data with known regimes (location, voice)"'
      - 'not green (green is "no personal data"), not red (red is health/identity data; neither was selected)'
      - 'the derived capability.security fired on both limbs of its rule (talks != nothing, data != none), so a baseline security capability is already carried in pir.functions'
    blocked_by: []

  # ── PLATFORM (consumer P2 — never the P1 verdict) ────────────────────
  - id: metric.platform.edge-autonomy
    consumer: P2-class
    scored_by: agent
    score: amber
    evidence:
      - 'q.fn.offline was OPENED (q.fn.talks != nothing) and answered: "no alerts but yes everything else" — absent_when does not hold, so this metric is scored'
      - 'q.fn.stores confirms the offline-first half: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud" — store-and-forward'
      - 'not green: the product is not fine offline. The alert path — the one function the stated success criterion turns on ("sending notificaitons to my phone") — is dead without a link'
      - 'not red: the device is not dead without the cloud; sensing, logging and retention continue and replay'
      - 'scale amber ("degrades offline in acceptable ways") fits, with the founder himself declaring the degradation acceptable'
      - 'P2 note: store-and-forward with a runtime-configurable duty policy is MCU-comfortable; it does not push toward MPU'
    blocked_by: []

  - id: metric.platform.hmi-class
    consumer: P2-class
    scored_by: derived
    score: green
    evidence:
      - 'q.fn.shows = a-light: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"'
      - 'q.phys.controls = one-button: "1 button and 1 led/led ring, something clean that will lookj high end"'
      - 'scale green is "none/LED/sound — lane B territory"; both feeds land there and neither is a screen or a many-control surface'
      - 'agrees with the lane the connectivity evidence points at (esp32c6, lane B)'
    blocked_by: []

  - id: metric.platform.compute-demand
    consumer: P2-class
    scored_by: derived
    score: green
    evidence:
      - 'q.fn.rate spawned twice; absent_when ("never spawned") does not hold'
      - 'rate 1 (position): "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces" — 1/3600 Hz to 1/30 Hz'
      - 'rate 2 (tilt/motion): "within seconds, if an alert it must be as quick as possible" — a wake-to-transmit LATENCY requirement, served by an interrupt-driven motion threshold, not by a control loop'
      - 'scale green is "low-rate sense/act — any lane"; neither rate is a fast control loop or signal processing, and nothing here is a vision/audio pipeline (red) '
      - 'the only real-time edge is alert latency, which the radio link dominates, not the compute'
    blocked_by: []

# ── DERIVED FLAGS (consumer P2) ────────────────────────────────────────
derived:
  needs_hardware: true
  needs_firmware: true
  why:
    needs_hardware: 'rule "any sensing, actuation, on-device HMI, or physical function in pir.functions" — four sensing items (position, altitude, speed/velocity, tilt), two hmi items (LED, one button), and a physical form (mounted, size_class phone). Actuation is present:false and is NOT counted'
    needs_firmware: 'rule "needs_hardware AND any on-device logic" — needs_hardware is true and the device is far from passive: q.fn.offline demands autonomous operation with no internet, q.fn.stores demands store-and-forward, and q.fn.rate demands a runtime-configurable duty policy'

# ── HUMAN GATES (F5) ───────────────────────────────────────────────────
human_gates: []            # q.comp.safety = none; human_gate_when fires on `serious` only. No gate is open.

# ── RECOMMENDATION — machine only; the decision is the human (F4) ──────
recommendation:
  verdict: blocked
  rule_applied: 'precedence rule 2 — any core metric unknown -> blocked. Rule 1 (human gate) was evaluated first and did not fire; evaluation stopped at rule 2, so rules 3 and 4 were never reached'
  blockers:
    - metric: metric.viability.economics
      weight: core
      score: unknown
      blocked_by: pir.targets.unit_cost.sell
      detail: 'q.scale.cost answered build (<= $100/unit at qty 10) and never answered sell; every level of the economics scale compares sell against build, so no level can be derived'
  reasons:
    - 'DEFECT REPORT (the contract asks for one): rule 2 says "G0 should have prevented this". G0 could not. q.scale.cost is tier SCORING, so an UNKNOWN there passes G0 by design — yet it feeds a CORE metric, and a core unknown forces blocked. A scoring-tier question that feeds a core metric is a hole between the graph tiers and the verdict rules; either q.scale.cost rises to required, or metric.viability.economics needs an absent_when for a non-commercial product, or economics stops being core'
    - 'DEFECT REPORT: this PIR should not have reached P1 at all. The required adaptive q.constraint.strength was never spawned for two volunteered technology tokens — "gps" (q.intent.what) and "zephyr rtos" (q.novel.magic) — while it WAS spawned for "cellular" and "usb c". An unclassified volunteered technology hard-blocks G0, so pir.gate_g0.status is red and P1 ran on a PIR that never cleared its gate'
    - 'AMBER (core) metric.feasibility.connectivity: the wide-area cellular link is outside both supported lanes and has no catalog record; the phone-nearby link is D1-only on catalog/socs/esp32c6.yaml. Three research tasks named in its evidence, including the FCC-only certification derivation that does not model a carrier/PTCRB path'
    - 'AMBER (core) metric.feasibility.power-risk: the floor is unconstrained so nothing is violated, but 1 month+ with 30 s GNSS fixes while moving plus a cellular uplink is an aggressive-sleep design; the on-bike USB-C charger the founder offers as an option is what makes the delight target comfortable, and it is optional today'
    - 'AMBER (core) metric.tech.exists: no magic is claimed, but three of four needed capabilities (GNSS, cellular WAN, IMU) have no catalog record at any depth and the fourth in-lane record is D1'
    - 'AMBER (minor) metric.feasibility.env-risk, metric.viability.novelty, metric.risk.self-assessed, metric.risk.privacy, metric.feasibility.head-start'
    - 'AMBER (P2-class, no verdict weight) metric.platform.edge-autonomy'
    - 'SCALE GAP: metric.feasibility.head-start has no level for a product where nothing exists AND nothing is assumed — its red is a conjunction whose second limb (a timeline that assumes otherwise) is false here. Scored amber as the nearest defensible level; registry v0 issue, minor weight, no verdict effect'
    - 'FOR THE G1 HUMAN, not scoreable here: metric.risk.safety is green because q.comp.safety = none is a derived map, yet the founder own answer carries the hedge "hopefully not explode lol" over a lithium cell mounted on a vehicle rated for heat, cold, vibration and hosing. No registry lever lets a derived scorer escalate a founder none; a human should confirm the none before it is banked'
    - 'NON-BINDING (rule 4 was never reached): with the sell-price unknown resolved or exempted, no core metric is red and no human gate is open, so the same scorecard would recommend go with the five ambers above named as its reasons'

# ── DECISION — F4: the human call at G1. Deliberately empty. ───────────
decision:
  verdict: null
  by: null
  quote: null
  at: null
