# P1 feasibility scorecard for the PIR of product `tracker`.
# Contract: docs/sfd/40-p1-metrics.md (F1-F5, scale semantics, verdict
# precedence) + docs/sfd/40-p1-registry.yaml (16 metric definitions).
# Every one of the 16 registry metrics is scored below.
# Catalog evidence base: catalog/ in the worktree — 3 records total
# (2 SoCs at D1, 1 component at D2), all @ zephyr 413b789deb391d3a37d06b463288a5fe765ee57e.
schema: sfd.scorecard/v0

pir:
  ref: /private/tmp/claude-501/-Users-mateo-code-research-embedded/071a7bd3-8c48-482e-a1db-7e333748e40f/scratchpad/repro/run2/iD/pir.yaml
  hash: 'sha256:a6ee6127ca628d3f6169f98995af0059684b029d4557f31238a96c236d7775b6'

scores:
  # ── VIABILITY ───────────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.intent.what: "a motorcycle gps tracker so that i know where my bike is at all times" — one sentence states the artefact (gps tracker), the host (motorcycle) and the job (know where it is at all times).'
      - 'q.intent.who: "its just for me" — the for-whom half is stated and unambiguous.'
      - 'Scale green ("one sentence says what it does and for whom") is met without needing a paragraph; no internal contradiction across the transcript.'
    blocked_by: []

  - id: metric.viability.outcome
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.intent.win: "it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud" — three observable conditions (installed+running on the bike, notifications reaching the phone, location visible in the cloud).'
      - 'Each condition is checkable by inspection at a year, and each follows directly from the product as stated (sensing position, connectivity phone-nearby + far-away-anywhere, storage/backfill). Scale green: a measurable outcome a working product could plausibly reach.'
      - 'Success is scoped to a personal build (users = "its just for me", volume y1=2), so no market assumption has to hold for the outcome to be reached.'
    blocked_by: []

  - id: metric.viability.economics
    score: unknown
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    evidence:
      - 'pir.targets.unit_cost.build = 100 USD at-most, scope "components + pcb + assembly per unit at 10 unit qty" (q.scale.cost, verbatim).'
      - 'pir.targets.volume = {y1: 2, y3: 10} (q.scale.units, verbatim).'
      - 'pir.targets.unit_cost.sell = UNKNOWN. The founder neither states an intent to sell nor an explicit not-for-sale; conditional_fields (30-p0-graph.yaml) rules that silence is UNKNOWN and the runner must ask.'
      - 'Neither branch of the scale is decidable: the margin branch needs `sell`; the not-for-sale branch requires `sell` to be ABSENT, which only an explicit not-for-sale would produce. A derived metric may not choose between them.'
      - 'NOTE for the human: were `sell` ABSENT, the not-for-sale branch would be scored on whether 100 USD/unit at qty 10 buys the BOM class — GNSS receiver + cellular modem + IMU + baro + PMIC + Li-ion + antennas + PCB + assembly. That budget is tight-to-red at qty 10, so the ask is verdict-relevant, not a formality.'
    blocked_by: [pir.targets.unit_cost.sell]

  - id: metric.viability.novelty
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.intent.exists: "yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that" — the founder concedes the category is occupied.'
      - 'The stated difference ("more powerful", "cool technologies", "accurate locations", alarm) is incremental and unverified against any named competitor; q.novel.moat answers "no compettiors", which contradicts nothing but supplies no defensible edge either.'
      - 'Not red: red requires "an existing product already is this", and the founder is not claiming parity — he claims a better-instrumented version. Scale amber: difference is incremental or unverified.'
      - 'Non-commercial framing (users = "its just for me") makes differentiation low-stakes here; recorded as a reason, not a blocker.'
    blocked_by: []

  # ── TECH-EXISTS ─────────────────────────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - 'q.novel.magic: "not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building" — the founder claims NO unproven capability. Nothing here needs physics that does not exist.'
      - 'CATALOG HIT — catalog/socs/esp32c6.yaml, depth D1 @ zephyr 413b789deb391d3a37d06b463288a5fe765ee57e: covers the short-range link (compatible espressif,esp32-bt-hci), non-volatile storage (soc-nv-flash, espressif,esp32-flash-controller), HMI (espressif,esp32-ledc for the LED, espressif,esp32-gpio for the button), time (espressif,esp32-rtc_timer, espressif,esp32-systimer for wakes-on-schedule), security seed (espressif,esp32-trng), and two power states (standby 60 us exit, soft-off 212 us exit). Catalog seam: D1 coverage scores AMBER, not green.'
      - 'CATALOG HIT — catalog/components/bosch,bme280.yaml, depth D2 @ same SHA: barometric path for the `altitude` sense, binding dts/bindings/sensor/bosch,bme280-{i2c,spi}.yaml, driver drivers/sensor/bosch/bme280, 19 exercised_by entries. D2 -> green on availability for that one sense.'
      - 'CATALOG HIT — catalog/socs/mimxrt1052.yaml, depth D1: lane A, not a fit here (no radio of any kind in its compatibles list; 00-process.md flags no internal flash). Recorded so the query is not mistaken for unexamined.'
      - 'COVERAGE GAP (named research task R1) — GNSS/position receiver. The product primary sense has NO catalog record; catalog/ holds 3 records total and none is a GNSS class part. Zephyr carries a gnss subsystem upstream, so a known working example exists (scale red requires "no known working example"), but the path is unproven HERE.'
      - 'COVERAGE GAP (named research task R2) — cellular modem for far-away-anywhere. No component record; neither supported SoC declares a cellular compatible. Constrained HARD by the founder (pir.constraints[cellular].strength = hard), so it cannot be traded away in P4.'
      - 'COVERAGE GAP (named research task R3) — IMU/accelerometer for the tilt sense and the motion wake source. No component record.'
      - 'Verdict on the scale: no capability is without a known working example (-> not red), and no needed capability is covered at D2+ except altitude (-> not green). AMBER: "a path exists but unproven here (catalog D1, or driver-work flagged)". Three gaps become named research tasks per F3.'
    blocked_by: []

  # ── FEASIBILITY ─────────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'pir.environment.where = vehicle (q.env.where: "in the vehicle, hopefully tucked away somehwere hidden ... protecetd from wethar").'
      - 'pir.environment.conditions = [water, dust, heat, cold, vibration, washing-or-hosing] — the scale names `washing-or-hosing` and `vibration` explicitly as hard conditions, and both are present, alongside heat/cold extremes.'
      - 'Known art, and costed: a potted or IP67 enclosure with a gasketed USB-C port on a vibration-isolated mount is standard motorcycle-electronics practice. Scale amber, not red — red requires conditions with no engineering path.'
      - 'DEGRADED EVIDENCE: pir.environment.limits is UNKNOWN (q.followup.range asked "how hot / how cold", unanswered), so the numeric range that would separate commercial-temp from automotive-temp parts is missing. This does not block the metric (both feeds q.env.where and q.env.conditions are answered) but it is the reason the amber cannot be narrowed.'
      - 'RUNNER DEFECT carried forward: `drops` was never presented to the founder (pir.runner_errors[0]); a hidden-mounted tracker on a motorcycle plausibly meets it, so the condition set may be an undercount.'
      - 'Compounding, not scored here: pir.physical.size_class = phone with a hidden mount, which is where the RF problem in q.novel.hard lives.'
    blocked_by: []

  - id: metric.feasibility.connectivity
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: agent+catalog
    evidence:
      - 'q.fn.talks selected two counterparts: `phone-nearby` and `far-away-anywhere` ("from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"). Derived links (R3 — the founder never picks a radio): a short-range PAN link to the phone, and a wide-area WAN link with no infrastructure assumption.'
      - 'CATALOG HIT — catalog/socs/esp32c6.yaml, depth D1 @ zephyr 413b789deb391d3a37d06b463288a5fe765ee57e: compatible espressif,esp32-bt-hci covers the phone-nearby lane; boards boards/espressif/esp32c6_devkitc, boards/seeed/xiao_esp32c6. The catalog seam is explicit that D1-only coverage is AMBER, not green.'
      - 'COVERAGE GAP — the WAN half. Neither supported lane reaches it: catalog/socs/esp32c6.yaml (lane B, D1) declares only espressif,esp32-wifi / -bt-hci / -ieee802154; catalog/socs/mimxrt1052.yaml (lane A, D1) declares nxp,enet (wired Ethernet) and no radio. No cellular-modem component record exists in catalog/ (3 records total).'
      - 'Not red: an external UART-attached cellular modem physically reaches "anywhere" at the stated duty (wakes-on-event/schedule, not always-on) and is ordinary art. Red requires that NO link reaches the counterpart at the stated distance and power.'
      - 'Scale amber applies on both of its clauses at once: "achievable but outside current lanes" (WAN) AND "coverage only at D1 with risk" (PAN).'
      - 'HARD CONSTRAINT feeding P4: pir.constraints[cellular].strength = hard — the fit matrix must be filtered to cellular-capable designs, so the gap cannot be closed by substituting a different WAN technology.'
      - 'RF co-existence risk, founder-identified (q.novel.hard: "antenna placement, multipel protocols"): GNSS receive + cellular transmit + BLE inside a phone-sized hidden enclosure is the single hardest connectivity item and is a P5 hole (00-process.md: RF front-end and antenna).'
    blocked_by: []

  - id: metric.feasibility.power-risk
    score: amber
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    evidence:
      - 'pir.power_class = PC1 (derived from q.power.source = charges-on-dock-or-cable: "battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection"). Rechargeable — the budget binds less hard than PC0.'
      - 'pir.modes = [wakes-on-event, wakes-on-schedule, only-when-used]; `always-on` was NOT selected, so the scale red example ("always-on radio on a coin cell") does not apply.'
      - 'pir.targets.battery_life.floor = none-declared (q.power.life follow-up: "no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours, could be used for racing"). With no floor stated, no floor can be violated -> the red condition is structurally unreachable for this PIR.'
      - 'pir.targets.battery_life.delight = 1 month at-least. Against a duty of 30 s position fixes while moving, 1 h while parked, an armed motion/tilt wake reacting "within seconds", and a cellular uplink, one month demands aggressive sleep design: GNSS hot/warm-start management, modem PSM/eDRX, an accelerometer interrupt as the wake source, and the LP core / standby state (catalog/socs/esp32c6.yaml power_states: standby min-residency 200 us, exit-latency 60 us) carrying the idle time.'
      - 'Scale amber, exactly as written: "delight target requires aggressive sleep design; floor reachable".'
      - 'Mitigation the founder already named and which is why this is not worse: the optional on-bike charger ("an optional on-bike chrager from bikes battery -> usb c power, that way the device is always cajhrged"), which converts the duty problem into a PC2-like case whenever it is fitted.'
    blocked_by: []

  - id: metric.feasibility.head-start
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'pir.assets = ["nothing"] (q.time.exists, verbatim "nothing") — no sketches, no model, no prototype, no code, no app, no factory contact, no funding.'
      - 'pir.timeline.proto = none-declared ("no rush we are just testing out the system, correctness over speed, can optimize later") and pir.timeline.production = none-declared ("no deadline").'
      - 'The scale amber clause "or nothing exists but the timeline carries no pressure" is met verbatim. Red requires "nothing — and the timeline assumes otherwise", which is false here: the timeline assumes nothing at all.'
    blocked_by: []

  # ── RISK ────────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    evidence:
      - 'pir.timeline.proto = none-declared (q.time.proto: "no rush we are just testing out the system, correctness over speed, can optimize later").'
      - 'pir.timeline.production = none-declared (q.time.prod: "no deadline").'
      - 'Both feeds are ANSWERED (conventions.declared-none: an explicit no-deadline is an answer, never UNKNOWN and never ABSENT), so the metric is neither unknown nor absent.'
      - 'Derived result: with no dates asserted, no date can precede a physically possible lead time (red is unreachable) and no step is squeezed (amber is unreachable). Green — "dates fit known lead times with slack" holds vacuously, with unbounded slack.'
      - 'STATED HONESTLY: the registry writes no scale level for none-declared dates. Green here means "no schedule risk asserted", not "a schedule was checked and found sound".'
    blocked_by: []

  - id: metric.risk.self-assessed
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: agent
    evidence:
      - 'q.novel.hard: "antenna placement, multipel protocols, pjone connecton and poower" — four fears.'
      - 'The fear is placed RIGHT. Antenna placement inside a deliberately hidden, phone-sized enclosure on a metal-rich motorcycle, with GNSS receive and cellular transmit and BLE co-resident, is genuinely the hardest item in this product; power against a 1-month delight target with a cellular uplink is the second. Both are exactly the items the derived metrics above flag as amber.'
      - 'What is missing is the second half of green: "and has a plan". pir.assets = ["nothing"] — no prototype, no antenna study, no RF partner, no measured budget; the constraint that would drive the plan (pir.constraints[zephyr-rtos].strength) is itself UNKNOWN.'
      - 'Scale amber: "the fear is real but unplanned-for". Not red — red is reserved for a founder pointing at the wrong thing, and this one is not.'
      - 'One item the founder does NOT name and the process does: thermal and mechanical survival of a Li-ion pack tucked against a motorcycle (see metric.risk.safety evidence).'
    blocked_by: []

  - id: metric.risk.safety
    score: green
    consumer: P1-verdict
    verdict_weight: core
    scored_by: derived
    human_gate: not-raised
    evidence:
      - 'pir.compliance.safety = "none", derived from q.comp.safety verbatim "no, just hopefully not explode lol". The enum answer is the stated bound: `none`, not `minor`, not `serious`.'
      - 'human_gate_when in the registry is `serious`; the answer is `none`, so NO structural human gate is raised (F5) and verdict precedence rule 1 does not fire.'
      - 'Scale green: "no plausible harm path" as the founder assesses it. The device does not act on the bike (q.fn.acts: "it does not do anything to the bike"), so no failure of it can command the vehicle.'
      - 'RECORDED CAVEAT, not a score change: the founder own aside "hopefully not explode lol" points at a real hazard class — a Li-ion cell (PC1) in a hot, vibrating, hidden vehicle mount, charged from the bike bus. This is derived scoring, so the enum governs and the score stays green; the caveat is put in front of the human at G1 rather than silently dropped. If the human reclassifies q.comp.safety to `serious`, rule 1 takes precedence over everything below and the verdict becomes blocked on the gate instead.'
    blocked_by: []

  - id: metric.risk.privacy
    score: amber
    consumer: P1-verdict
    verdict_weight: minor
    scored_by: derived
    evidence:
      - 'pir.compliance.personal_data = [location] (q.comp.data: "yes, whatver info it has about location bascially"). Not `none`, and not health or identity.'
      - 'Scale amber, verbatim: "personal data with known regimes (location, voice)".'
      - 'pir.compliance.regions = [us] -> pir.compliance.certifications = [fcc] (derived). The data itself is continuous vehicle location tied to a single named owner; even at users = "its just for me" the cloud leg (q.intent.win: "tracking the bikes locaiton in the cloud") makes at-rest and in-transit protection a design requirement, which is why capability.security is derived into pir.functions.'
    blocked_by: []

  # ── PLATFORM (consumer P2 — never bears on the P1 verdict) ─────────────
  - id: metric.platform.edge-autonomy
    score: amber
    consumer: P2-class
    scored_by: agent
    evidence:
      - 'absent_when does not hold: q.fn.talks != nothing (phone-nearby + far-away-anywhere selected), so q.fn.offline was opened and answered — the metric is scored, not ABSENT.'
      - 'q.fn.offline: "no alerts but yes everything else" — sensing, logging and buffering continue with no internet; only the alert path stops.'
      - 'q.fn.stores corroborates the offline-first storage design: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud".'
      - 'Not green: the alert is the theft-notification path, i.e. the reason the product exists (q.intent.win names notifications first). Losing it is a real degradation, not a nil one.'
      - 'Not red: the device is emphatically not dead without the cloud — it keeps fixing, storing and backfilling. Scale amber: "degrades offline in acceptable ways".'
      - 'P2 consequence: store-and-forward with backfill puts a real filesystem/NVS and a queue on the MCU, but does not by itself force an MPU.'
    blocked_by: []

  - id: metric.platform.hmi-class
    score: green
    consumer: P2-class
    scored_by: derived
    evidence:
      - 'q.fn.shows = `a-light` ("no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too").'
      - 'q.phys.controls = `one-button` ("1 button and 1 led/led ring, something clean that will lookj high end").'
      - 'Both feeds land in the green band verbatim: "none/LED/sound — lane B territory". No screen of any kind, one control.'
      - 'Consistent with the derived lane: catalog/socs/esp32c6.yaml (D1) already declares espressif,esp32-ledc (LED/PWM) and espressif,esp32-gpio; catalog/socs/mimxrt1052.yaml (D1, lane A) carries nxp,imx-elcdif and nxp,imx-csi display/camera blocks this product has no use for.'
    blocked_by: []

  - id: metric.platform.compute-demand
    score: green
    consumer: P2-class
    scored_by: derived
    evidence:
      - 'absent_when does not hold: q.fn.rate spawned twice (for `position` and for `tilt/motion`), so the metric is scored, not ABSENT.'
      - 'Rate 1, position: "parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces" -> periods 3600 s and 30 s, both >= 1 s.'
      - 'Rate 2, tilt/motion: "within seconds, if an alert it must be as quick as possible" -> the stated period is "within seconds", i.e. >= 1 s.'
      - 'The registry derivation is mechanical and reads STATED rate periods: "green when every stated rate period >= 1 s and no continuous stream processing". Every stated period is >= 1 s, and no function in pir.functions is a stream (no audio, no video, no vision).'
      - 'STATED HONESTLY: "as quick as possible" states no period and is therefore not a stated sub-second loop. If P2 reads it as a sub-second reaction requirement, this metric moves to amber; the mechanical rule as written does not. Physically the tilt path is an accelerometer interrupt (a wake source), not a polled loop, which is why the mechanical reading is also the physical one.'
    blocked_by: []

# ── derived flags (consumer: P2) ─────────────────────────────────────────
derived:
  needs_hardware: true
  needs_firmware: true

derived_evidence:
  needs_hardware:
    rule: 'any sensing, actuation, on-device HMI, or physical function in pir.functions'
    result: 'TRUE on three independent grounds — sensing (position, altitude, speed, tilt), on-device HMI (a-light LED + one-button), and a physical function (mounted, size_class phone, vehicle environment). Actuation is the only trigger absent (q.fn.acts: "it does not do anything to the bike").'
  needs_firmware:
    rule: 'needs_hardware AND any on-device logic (always true when needs_hardware, unless purely passive/analog)'
    result: 'TRUE — needs_hardware holds and the device is nowhere near passive/analog: adaptive rate policy under power preferences, offline store-and-forward with cloud backfill, LED state machine, button handling, and multi-radio management.'

# ── human gates (F5) ──────────────────────────────────────────────────────
human_gates: []   # q.comp.safety = "none"; human_gate_when is `serious`, not raised

# ── recommendation (F4 — the machine recommends, the human decides) ──────
recommendation:
  verdict: blocked
  rule_applied: 'precedence rule 2 — any core metric `unknown` -> blocked. Rule 1 was evaluated first and did not fire (human_gates is empty). Evaluation stopped at rule 2; rules 3-4 were computed anyway because the contract requires `reasons` to be populated on a blocked verdict.'
  blockers:
    - unknown: pir.targets.unit_cost.sell
      metric: metric.viability.economics
      weight: core
      answered_by: 'q.scale.cost — the sell half. Ask the founder whether the unit is for sale at all. An explicit not-for-sale makes the field ABSENT (conventions.declared-none) and the economics metric scores on its not-for-sale branch; a stated price scores on the margin branch. Silence keeps it UNKNOWN and keeps this verdict blocked (conditional_fields: "the runner must ask").'
  reasons:
    - 'G0 IS RED, UPSTREAM OF THIS SCORECARD: pir.constraints[zephyr-rtos].strength is UNKNOWN. The founder volunteered "zephyr rtos" in q.novel.magic; constraint_oracle names operating systems explicitly as included tokens, and q.constraint.strength (required tier) was never spawned for it. The runner asked for `cellular` and `usb-c` and missed this one (pir.runner_errors[1]). Strictly, P1 should not have run on a PIR that has not cleared G0; the scorecard is produced as asked and this is stated rather than hidden.'
    - 'Rule 3 did NOT fire: no core metric is red. Core set = economics (unknown), tech.exists (amber), feasibility.connectivity (amber), feasibility.power-risk (amber), risk.safety (green). Neither pivot nor kill is indicated; the kill test (tech.exists red AND the magic IS the stated differentiation) fails twice over — tech.exists is amber and q.novel.magic is "not really", so there is no magic to lose.'
    - 'Rule 4 WOULD have recommended GO once the sell question is answered — provided the answer does not turn economics red. This is the substantive finding: nothing about this product is infeasible; it is under-specified in exactly one place.'
    - 'AMBER (verdict-bearing) — metric.tech.exists: no unproven physics, but the catalog covers only altitude at D2 (catalog/components/bosch,bme280.yaml); esp32c6 sits at D1 (catalog/socs/esp32c6.yaml); and three capabilities have NO catalog record at all. Named research tasks: R1 GNSS/position receiver, R2 cellular modem, R3 IMU/accelerometer.'
    - 'AMBER (verdict-bearing) — metric.feasibility.connectivity: the phone-nearby lane is covered at D1 only (espressif,esp32-bt-hci), and the far-away-anywhere lane is outside BOTH supported lanes — no cellular part in catalog/socs/esp32c6.yaml or catalog/socs/mimxrt1052.yaml, and no modem component record. `cellular` is a HARD constraint, so P4 cannot trade it away.'
    - 'AMBER (verdict-bearing) — metric.feasibility.power-risk: 1 month delight on PC1 with a cellular uplink, 30 s moving fixes and an armed tilt wake needs aggressive sleep design. Red is structurally unreachable here only because the floor is none-declared; do not read the amber as comfort.'
    - 'AMBER (verdict-bearing) — metric.feasibility.env-risk: vehicle plus water, dust, heat, cold, vibration and washing-or-hosing — two of the scale named hard conditions at once. Known, costed art, but pir.environment.limits is UNKNOWN so the temperature grade of the parts cannot be fixed yet, and `drops` was never presented to the founder (runner defect).'
    - 'AMBER (verdict-bearing) — metric.feasibility.head-start: pir.assets = nothing. Amber only because the timeline carries no pressure (both dates none-declared); any date added to this PIR pushes it toward red.'
    - 'AMBER (verdict-bearing) — metric.risk.self-assessed: the founder fears the right things (antenna placement, multiple protocols, power) and has no plan for any of them.'
    - 'AMBER (verdict-bearing) — metric.risk.privacy: continuous vehicle location, us region, cloud storage. Known regime, standard obligations.'
    - 'AMBER (verdict-bearing) — metric.viability.novelty: the category is occupied by the founder own admission; the difference is incremental and unverified. Low stakes at users = "its just for me".'
    - 'AMBER (non-verdict-bearing, P2-class) — metric.platform.edge-autonomy: offline-first except alerts, and the alert is the product headline function.'
    - 'MINOR-METRIC UNKNOWNS: none. Every minor metric scored; the only unknown is the core economics one already in blockers.'
    - 'RECORDED RISK, NOT A SCORE: q.comp.safety = "none" carries the founder aside "hopefully not explode lol". A Li-ion pack in a hot, vibrating, hidden motorcycle mount charged off the bike bus is a real hazard class. If the human reclassifies it as `serious` at G1, precedence rule 1 overrides everything above and the verdict becomes blocked on a safety human gate instead of on the economics unknown.'
    - 'SCORE DISTRIBUTION: 4 green, 8 amber, 1 unknown, 0 red, 0 absent, across 16 metrics (13 P1-verdict + 3 P2-class).'

# ── decision (F4 — the human call at G1; left empty on purpose) ──────────
decision:
  verdict: ''
  by: ''
  quote: ''
  at: ''
