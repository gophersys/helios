schema: sfd.scorecard/v0
pir:
  ref: repro/run2/iE/pir.yaml
  hash: "sha256:47f2319b0aa45b805c43bc59c019c6b55c1ed44bf63dbdc843942e46c26a1d95"
  product: tracker
catalog:
  root: catalog/
  records: 3
  zephyr_sha: 413b789deb391d3a37d06b463288a5fe765ee57e
  inventory:
    - {path: catalog/socs/esp32c6.yaml, depth: D1}
    - {path: catalog/socs/mimxrt1052.yaml, depth: D1}
    - {path: "catalog/components/bosch,bme280.yaml", depth: D2}

scores:
  # ── VIABILITY ───────────────────────────────────────────────────────────
  - id: metric.viability.clarity
    score: green
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.summary from q.intent.what: 'a motorcycle gps tracker so that i know where my bike is at all times' — one sentence naming the thing (motorcycle GPS tracker), the job (know where the bike is), and the user (the founder, q.intent.who: 'its just for me')."
      - "No contradiction between q.intent.what, q.intent.win and q.fn.* — the function set (position sensing, cloud reporting, phone link, alerts) is exactly what the sentence promises."
      - "Scale green: 'one sentence says what it does and for whom'."
    blocked_by: []

  - id: metric.viability.outcome
    score: green
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.targets.success from q.intent.win: 'it must be installed and running in my bike sending notificaitons to my phone and tracking the bikes locaiton in the cloud'."
      - "Three directly observable conditions (installed+running, notifications reaching the phone, location visible in the cloud). For a single-user product each is checkable without instrumentation."
      - "Plausible from the product as stated: every condition maps onto a recorded function (connectivity phone-nearby, connectivity far-away-anywhere, sensing position, storage backfill)."
      - "Scale green: 'a measurable outcome a working product could plausibly reach'."
    blocked_by: []

  - id: metric.viability.economics
    score: unknown
    scored_by: derived
    verdict_weight: core
    evidence:
      - "pir.targets.volume = {y1: 2, y3: 10} from q.scale.units: '2, and maybe 10 for my freinds'."
      - "pir.targets.unit_cost.build = 100 USD at 10-unit qty from q.scale.cost: 'i dont wanna spend more than $100 on components + pcb + assembly per unit at 10 unit qty.'"
      - "pir.targets.unit_cost.sell is UNKNOWN — the second half of q.scale.cost went unanswered. conditional_fields makes silence UNKNOWN (an explicit not-for-sale would be ABSENT; 'its just for me' answers q.intent.who and is not that declaration)."
      - "The derived rule cannot run: neither the sell>build branch nor the not-for-sale branch of the scale is selectable while sell is UNKNOWN. Scoring either branch would be the silent default R5 forbids."
      - "NOT-VERDICT-BEARING CONTEXT (recorded, not scored): if sell resolves to ABSENT/not-for-sale, the scale's not-for-sale branch would read amber — 100 USD for components+PCB+assembly at 10 units must buy a cellular modem, a GNSS receiver, an IMU, a barometer, an MCU, a charger/PMIC, a Li cell, antennas and a 10-off assembly run. Tight for the BOM class, not impossible."
    blocked_by: [pir.targets.unit_cost.sell]

  - id: metric.viability.novelty
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.novelty.different from q.intent.exists: 'yes, others exist, but i wanna just build my own to be more powerful and use cool technologies to get accurate locations and alamr and things like that'."
      - "The founder concedes prior art and names no existing product; the claimed difference ('more powerful', 'cool technologies', 'accurate locations', alarm) is a capability claim with no stated threshold to beat — incremental and unverified."
      - "Not red: the founder does state a difference, and the product's purpose (q.intent.who: 'its just for me') is a personal build rather than a market displacement, so 'an existing product already is this' is not the operative failure."
      - "Internal tension recorded, not scored: q.novel.moat says 'no compettiors' while q.intent.exists says 'yes, others exist'. No consistency rule in the graph covers this pair, so it is not a G0 red."
      - "Scale amber: 'difference is incremental or unverified'."
    blocked_by: []

  # ── TECH-EXISTS ─────────────────────────────────────────────────────────
  - id: metric.tech.exists
    score: amber
    scored_by: agent+catalog
    verdict_weight: core
    evidence:
      - "pir.novelty.magic = none-declared, from q.novel.magic: 'not really. i just wanan use the latest tech avialnle in the embedded world and using zephyr rtos as a poc for ai hardware building'. No capability is claimed that has never been seen to work — that alone rules out the red level."
      - "catalog: sensing/altitude COVERED at D2 — catalog/components/bosch,bme280.yaml (class sensor, buses i2c+spi, driver drivers/sensor/bosch/bme280, 19 exercised_by entries) @ zephyr 413b789d."
      - "catalog: connectivity phone-nearby COVERED at D1 only — catalog/socs/esp32c6.yaml declares espressif,esp32-bt-hci, espressif,esp32-wifi and espressif,esp32-ieee802154. SoC records are D1 by definition (declared inventory != supported), so per the catalog seam this is amber, not green."
      - "catalog: storage (non-volatile) COVERED at D1 — catalog/socs/esp32c6.yaml declares soc-nv-flash, fixed-partitions, espressif,esp32-flash-controller."
      - "catalog: usb-c (hard constraint) COVERED at D1 — catalog/socs/esp32c6.yaml declares espressif,esp32-usb-serial. catalog/socs/mimxrt1052.yaml declares nxp,ehci / nxp,usbphy / nxp,uhc-ehci at D1."
      - "catalog: time COVERED at D1 — espressif,esp32-rtc_timer / espressif,esp32-systimer (esp32c6); nxp,imx-snvs-rtc (mimxrt1052)."
      - "catalog: security baseline PARTIAL at D1 — espressif,esp32-trng (esp32c6) and nxp,kinetis-trng + nxp,mcux-dcp (mimxrt1052) are entropy/crypto primitives only; no TLS/secure-boot/key-storage record exists in a 3-record catalog."
      - "COVERAGE GAP — connectivity far-away-anywhere / cellular (a HARD constraint): no cellular modem component or modem-bearing SoC record exists in catalog/. Neither esp32c6 nor mimxrt1052 carries a WAN radio. RESEARCH TASK: extract a cellular lane (modem-class SoC and/or a modem component record with binding+driver) — cited at D1+ per F3."
      - "COVERAGE GAP — sensing/position (GNSS): no GNSS component record in catalog/. RESEARCH TASK: extract GNSS receiver component records (binding + driver)."
      - "COVERAGE GAP — sensing/tilt and sensing/speed-velocity (IMU/accelerometer): no IMU component record in catalog/. RESEARCH TASK: extract accelerometer/IMU component records with a wakeup-capable interrupt path."
      - "COVERAGE GAP — power: no PMIC/charger record; the catalog schema does not yet extract wakeup-source or CONFIG_PM_DEVICE coverage (declared limit in capability-index.schema.yaml), so a PC1 sleep budget cannot be evidenced from the catalog at all."
      - "Not red despite the gaps: the red level requires 'no known working example'. Cellular+GNSS+BLE asset trackers on Zephyr are shipped art; the gaps are catalog coverage gaps, not capability gaps. Scale amber: 'a path exists but unproven here (catalog D1, or driver-work flagged)'."
    blocked_by: []

  # ── FEASIBILITY ─────────────────────────────────────────────────────────
  - id: metric.feasibility.env-risk
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.environment.where = vehicle, from q.env.where: 'in the vehicle, hopefully tucked away somehwere hidden so that its not visible and is protecetd from wethar…'"
      - "pir.environment.conditions = [water, dust, heat, cold, vibration, washing-or-hosing], from q.env.conditions: 'yes all the ones suggested'."
      - "Two of the scale's named hard conditions are present verbatim: `washing-or-hosing` and `vibration`. A hidden motorcycle mount adds engine-bay thermal soak and a sealed-enclosure ingress requirement on top."
      - "All of it is costed, known art (sealed potted enclosure, gasketed housing, conformal coat, vibration-rated mounting) — the red level ('no path') does not apply."
      - "RISK: pir.environment.limits is UNKNOWN (q.followup.range asked, not answered). No temperature bounds, no IP target. The score cannot move off amber in either direction until those numbers exist."
      - "RUNNER ERROR: q.env.conditions presented only 6 of its 8 values; `drops` was never offered, so it is not bound — plausibly understating the environment for a hidden, hand-installed device."
      - "Scale amber: 'one or more hard conditions (`washing-or-hosing`, `vibration`, extremes) — costed, known art'."
    blocked_by: []

  - id: metric.feasibility.connectivity
    score: amber
    scored_by: agent+catalog
    verdict_weight: core
    evidence:
      - "pir.functions connectivity = [phone-nearby, far-away-anywhere], from q.fn.talks: 'from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that'. Two counterparts, two distances, two links."
      - "phone-nearby: catalog/socs/esp32c6.yaml declares espressif,esp32-bt-hci (BLE-class host controller path) and espressif,esp32-wifi @ zephyr 413b789d, depth D1. Per the catalog seam, D1-only coverage is AMBER, not green."
      - "far-away-anywhere: COVERAGE GAP. Zero cellular records in catalog/ (3 records total: esp32c6 D1, mimxrt1052 D1, bosch,bme280 D2). catalog/socs/mimxrt1052.yaml carries nxp,enet (wired Ethernet) and nxp,flexcan — neither reaches a wide-area counterpart. There is no supported-SoC lane for this link today."
      - "The wide-area link is a HARD constraint (pir.constraints[cellular].strength = hard, q.constraint.strength: 'requiemrnt'), so P4 cannot substitute a different link to escape the gap."
      - "Not red: 'no radio/link reaches the stated counterpart at the stated distance and power' is false — LTE-M/NB-IoT modem parts with upstream Zephyr support are shipped art. The failure is catalog coverage, not physics."
      - "RESEARCH TASK (named, per F3): add a cellular lane to the capability index — a modem-class SoC record and/or modem component records carrying binding + driver — then re-score. Until then the coexistence question (cellular + BLE + GNSS antennas in a hidden metal-adjacent motorcycle location, the founder's own stated fear) has no catalog evidence base."
      - "Scale amber: 'achievable but outside current lanes, or coverage only at D1 with risk' — both clauses hold, one per link."
    blocked_by: []

  - id: metric.feasibility.power-risk
    score: amber
    scored_by: derived
    verdict_weight: core
    evidence:
      - "pir.power_class = PC1, derived from q.power.source = charges-on-dock-or-cable ('battery powered ideally, but easily rechargeable/updatetbale all things over a usb c connection'). PC1 is rechargeable — the budget binds less hard than PC0."
      - "pir.modes = [wakes-on-event, wakes-on-schedule, only-when-used] from q.power.duty. `always-on` is NOT selected — the red example in the scale ('always-on radio on a coin cell') does not apply."
      - "pir.targets.battery_life.floor = none-declared, from q.power.life: 'no lowest threshold, device can also be used as a high perfomancr tracker, with expected batter y life in the hours, could be used for racing'. A floor that does not exist cannot be violated — the red level ('floor target violates the stated power class') is unreachable by construction."
      - "pir.targets.battery_life.delight = 1 month or more, against a duty of 30 s position fixes while moving, hourly while parked (q.fn.rate), a wide-area cellular uplink, and a within-seconds tilt-alert wake. That is the scale's 'aggressive sleep design' clause verbatim: modem PSM/eDRX, GNSS hot-start duty cycling, an interrupt-driven accelerometer wake, and a deep SoC sleep state between events."
      - "Derived mapping: floor reachable (none-declared) AND delight requires aggressive sleep design -> amber. Green would require the FLOOR to be comfortably plausible AND no aggressive design — the first holds vacuously, the second does not."
      - "catalog (weak evidence, stated honestly): catalog/socs/esp32c6.yaml records power_states standby (min_residency 200 us, exit_latency 60 us) and soft-off (2000/212 us) at D1. capability-index.schema.yaml declares that wakeup-source and CONFIG_PM_DEVICE coverage are NOT yet extracted, so the catalog cannot today evidence which peripherals can wake the SoC — the exact fact a 1-month PC1 budget turns on."
    blocked_by: []

  - id: metric.feasibility.head-start
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.assets = [] from q.time.exists: 'nothing'. No sketches, no 3D model, no prototype, no software, no app, no factory contact, no funding."
      - "pir.timeline.proto = none-declared, from q.time.proto: 'no rush we are just testing out the system, correctness over speed, can optimize later'."
      - "pir.timeline.production = none-declared, from q.time.prod: 'no deadline'."
      - "The red level requires 'nothing — AND the timeline assumes otherwise'. The second conjunct is false: both dates are explicitly none-declared."
      - "Scale amber, second clause: 'nothing exists but the timeline carries no pressure'."
    blocked_by: []

  # ── RISK ────────────────────────────────────────────────────────────────
  - id: metric.risk.schedule
    score: green
    scored_by: derived
    verdict_weight: minor
    evidence:
      - "pir.timeline.proto = none-declared (q.time.proto: 'no rush we are just testing out the system, correctness over speed, can optimize later')."
      - "pir.timeline.production = none-declared (q.time.prod: 'no deadline')."
      - "Both feeds are ANSWERED (declared-none convention), so the score is neither unknown nor absent — the metric has no absent_when."
      - "Derived: with no declared dates there is no date that can precede a lead time (red is unreachable) and no single-sourced step without buffer (amber is unreachable). Slack is unbounded. Scale green: 'dates fit known lead times with slack'."
      - "Stated honestly: green here means 'no schedule pressure exists', not 'a schedule was validated'."
    blocked_by: []

  - id: metric.risk.self-assessed
    score: amber
    scored_by: agent
    verdict_weight: minor
    evidence:
      - "pir.novelty.hard from q.novel.hard: 'antenna placement, multipel protocols, pjone connecton and poower'."
      - "The fear is well placed. Three radios (cellular WAN, BLE to the phone, GNSS receive) inside a small hidden enclosure on a motorcycle IS the hard part — antenna placement, isolation and coexistence, plus the PC1 power budget against a 1-month delight target, are precisely the two things metric.feasibility.connectivity and metric.feasibility.power-risk both landed on amber for. The founder independently named both."
      - "No plan exists behind the fear: pir.assets = [] (nothing built), pir.environment.limits is UNKNOWN, and the catalog has no cellular lane to plan against."
      - "One hard part is unnamed but present: sealing and vibration survival for a hidden vehicle mount (metric.feasibility.env-risk amber) and the 100 USD / 10-unit BOM against a 4-radio-front-end part list."
      - "Scale amber: 'the fear is real but unplanned-for'. Green would require a plan; red would require the fear to be misplaced, and it is not."
    blocked_by: []

  - id: metric.risk.safety
    score: green
    scored_by: derived
    verdict_weight: core
    human_gate_when: serious
    evidence:
      - "pir.compliance.safety = none, from q.comp.safety: 'no, just hopefully not explode lol'. The enum answer is `none`."
      - "Derived mapping: none -> green, minor -> amber, serious -> red. The answer is none, so green. No judgment is applied and none is permitted — this metric is scored_by derived."
      - "F5 human gate NOT raised: human_gate_when is `serious` and the recorded value is `none`."
      - "RECORDED, NOT SCORED (the derived rule forbids overriding the founder's enum): the founder's own aside 'hopefully not explode' names a real harm path — a lithium cell charged from a motorcycle's electrical system, mounted in an engine-adjacent thermal environment, with pir.environment.limits UNKNOWN. If a human re-reads q.comp.safety as `minor`, this metric becomes amber; it would still not raise the F5 gate."
    blocked_by: []

  - id: metric.risk.privacy
    score: amber
    scored_by: derived
    verdict_weight: minor
    evidence:
      - "pir.compliance.personal_data = [location], from q.comp.data: 'yes, whatver info it has about location bascially'."
      - "Derived mapping: the scale names location explicitly under amber — 'personal data with known regimes (location, voice)'. Not green (personal data IS collected). Not red (no health or identity data)."
      - "pir.compliance.regions = [us]; pir.compliance.certifications = [fcc] (derived). US state privacy regimes attach to continuous precise location; the derived FCC certification covers the radios, not the data."
      - "Scope note: the tracked subject is the founder himself (pir.users), which lowers the practical exposure but does not change the derived level — the derivation reads the data classes, not the subject."
    blocked_by: []

  # ── PLATFORM (consumer P2-class — never bears on the P1 verdict) ────────
  - id: metric.platform.edge-autonomy
    score: amber
    scored_by: agent
    consumer: P2-class
    evidence:
      - "NOT ABSENT: absent_when is 'q.fn.talks == nothing'; pir.functions carries connectivity phone-nearby and far-away-anywhere, so the feed is open."
      - "pir.functions compute/offline-autonomy from q.fn.offline: 'no alerts but yes everything else'."
      - "Corroborated by q.fn.stores: 'yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud' — an explicit store-and-forward design, so sensing and logging survive a dead link."
      - "The degradation is real and named: alerts — the anti-theft core of the product — do not fire offline. The founder states that as acceptable."
      - "Not green: 'device is fine offline' is false for the alert path. Not red: 'product is dead without the cloud' is false — sensing, logging and backfill all continue on-device."
      - "Scale amber: 'degrades offline in acceptable ways'. P2 consequence: the device needs real on-device state, a persistent log, and autonomous rate policy — MCU-with-storage, not a cloud-dependent thin node."
    blocked_by: []

  - id: metric.platform.hmi-class
    score: green
    scored_by: derived
    consumer: P2-class
    evidence:
      - "pir.physical.controls = one-button, from q.phys.controls: '1 button and 1 led/led ring, something clean that will lookj high end'."
      - "pir.functions hmi = a-light, from q.fn.shows: 'no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too' — `rich-screen` and `small-readout` are both explicitly refused."
      - "Derived: shows in {nothing, a-light, sound} AND controls not in {a-few-buttons, knobs, touch} -> green. Scale green: 'none/LED/sound — lane B territory'."
    blocked_by: []

  - id: metric.platform.compute-demand
    score: green
    scored_by: derived
    consumer: P2-class
    evidence:
      - "NOT ABSENT: absent_when is 'q.fn.rate never spawned'; it spawned twice (for position, and for tilt/motion)."
      - "Stated rate periods: 3600 s (parked) and 30 s (moving) from q.fn.rate/position — 'parked every 1 hour, moving, ever 30 sec, or ideally a configurable thing where the software can change it based on power prefeernces'."
      - "Stated reaction: 'within seconds' from q.fn.rate/tilt-motion — 'within seconds, if an alert it must be as quick as possible'."
      - "Derivation applied verbatim: 'green when every stated rate period >= 1 s and no continuous stream processing'. Every stated period (3600 s, 30 s, seconds) is >= 1 s; no stream is processed; no vision or audio pipeline appears anywhere in pir.functions; nothing is hard real time (an alert wake is soft-latency)."
      - "STATED HONESTLY: 'as quick as possible' carries NO number. The derivation keys on stated periods only, so it does not move the score; if a later answer bounds that latency below 1 s, this metric goes amber."
    blocked_by: []

# ── derived flags (consumer: P2) ──────────────────────────────────────────
derived:
  needs_hardware: true
  needs_firmware: true
derived_evidence:
  needs_hardware:
    - "rule: 'any sensing, actuation, on-device HMI, or physical function in pir.functions'."
    - "sensing x4 (position, altitude, speed/velocity, tilt); hmi x2 (a-light, one-button); physical: size_class phone, carry mounted. Actuation is empty (q.fn.acts: 'it does not do anything to the bike') but is not required by the rule's disjunction."
  needs_firmware:
    - "rule: 'needs_hardware AND any on-device logic (always true when needs_hardware, unless purely passive/analog)'."
    - "needs_hardware is true and the device is emphatically not passive: offline autonomy (q.fn.offline), store-and-forward with cloud backfill (q.fn.stores), runtime-configurable sense rates (q.fn.rate), and a multi-mode duty policy (pir.modes)."

# ── F5 — structural human gates ───────────────────────────────────────────
human_gates: []
human_gates_evidence:
  - "The only human_gate_when in registry v0 is metric.risk.safety = serious. pir.compliance.safety = none (q.comp.safety: 'no, just hopefully not explode lol'), so no gate is raised and verdict rule 1 does not fire."

# ── F4 — the machine recommends; the human decides G1 ─────────────────────
recommendation:
  verdict: blocked
  rule_applied: "verdict rule 2 — any core metric `unknown` -> blocked (rule 1 did not fire: human_gates is empty)"
  blockers:
    - blocker: core-metric-unknown
      metric: metric.viability.economics
      field: pir.targets.unit_cost.sell
      answered_by: >-
        The unanswered half of q.scale.cost ("what price sells it?"). Either a
        stated sell price — which selects the scale's sell-vs-build branch — or
        an EXPLICIT not-for-sale declaration, which makes the field ABSENT and
        selects the not-for-sale branch (build budget vs BOM class). Silence
        stays UNKNOWN by conditional_fields; the runner must ask.
  reasons:
    # rules 3-4 recorded in full, per the contract's blocked-verdict note
    - "Rule 3 would NOT have fired: no core metric is red. metric.tech.exists amber, metric.feasibility.connectivity amber, metric.feasibility.power-risk amber, metric.risk.safety green; metric.viability.economics is unknown, not red. Neither pivot nor kill is on the table — and the kill condition is doubly false, since pir.novelty.magic is none-declared, so there is no stated magic for a red tech.exists to destroy."
    - "Rule 4 would therefore have recommended GO, with these ambers named:"
    - "amber (core) metric.tech.exists — no magic claimed, but the catalog cannot evidence the core parts: zero cellular, GNSS, IMU and PMIC records; BLE/WiFi/storage/USB/time at D1 only; only bosch,bme280 (altitude) reaches D2."
    - "amber (core) metric.feasibility.connectivity — phone-nearby at D1 on esp32c6; far-away-anywhere has NO catalog lane at all, and cellular is a HARD constraint so P4 cannot substitute around it."
    - "amber (core) metric.feasibility.power-risk — floor is none-declared so nothing can be violated, but a 1-month delight target with a cellular uplink, 30 s moving fixes and a seconds-latency tilt wake demands aggressive sleep design; the catalog cannot yet evidence wakeup-source or PM-device coverage."
    - "amber (minor) metric.feasibility.env-risk — vehicle mount with washing-or-hosing and vibration, both named hard conditions; bounds unquantified."
    - "amber (minor) metric.feasibility.head-start — nothing exists, but neither timeline is declared, so the timeline does not assume otherwise."
    - "amber (minor) metric.risk.self-assessed — the founder's fear (antenna placement, multiple protocols, phone connection, power) matches the actual hard part exactly, and has no plan behind it."
    - "amber (minor) metric.viability.novelty — a difference is claimed but is incremental and unverified against unnamed prior art; q.novel.moat ('no compettiors') contradicts q.intent.exists ('yes, others exist')."
    - "amber (minor) metric.risk.privacy — continuous precise location on a US-first product; the subject is the founder himself, which the derivation does not credit."
    - "green: metric.viability.clarity, metric.viability.outcome, metric.risk.schedule (green only because no dates are declared — no schedule was validated), metric.risk.safety (derived from q.comp.safety = none; the founder's 'hopefully not explode' aside names a Li-cell harm path that the enum does not carry)."
    - "P2-class ambers, appended NON-VERDICT-BEARING: metric.platform.edge-autonomy amber — alerts, the anti-theft core, are dead offline while sensing/logging/backfill continue; the founder accepts that."
    - "P2-class greens, NON-VERDICT-BEARING: metric.platform.hmi-class green (LED + one button = lane B), metric.platform.compute-demand green (all stated rate periods >= 1 s; 'as quick as possible' carries no number and could flip it amber)."
    - "UNKNOWN carried but blocking nothing at verdict level: pir.environment.limits (q.followup.range asked, left blank) — it holds metric.feasibility.env-risk at amber in both directions."
    - "GATE STATUS, RECORDED NOT BLOCKING (P1 has no rule for it, so it is not a `blocker`): the PIR does NOT pass G0. pir.constraints[zephyr-rtos].strength is UNKNOWN — the constraint_oracle names operating systems (zephyr rtos) as an INCLUDED volunteered-technology token, q.constraint.strength is tier `required`, and no ask-back was spawned for it. Also recorded: a runner error on q.env.conditions (6 of 8 values presented; `drops` never offered)."

# ── F4 — the human's call. Left empty by construction. ────────────────────
decision:
  verdict: ""
  by: ""
  quote: ""
  at: ""
