    blocks: []
    note: "HARD-BLOCKS G0. constraint_oracle includes operating systems (zephyr rtos) as volunteered technology; every included token gets q.constraint.strength, which is required tier. The runner never spawned it. No P1 metric is fed by pir.constraints, so the metric-block list is empty — the block is at the gate, not at a metric."

runner_errors:               # conventions.multi-affirmation mandates recording
                             # a partial presentation in the PIR; the record spec
                             # names no field, so one is declared here.
  - question: q.env.conditions
    kind: partial-presentation
    presented: [water, dust, heat, cold, vibration, washing-or-hosing]
    omitted: [drops, "none"]
    effect: "the answer 'yes all the ones suggested' binds only to the six values presented; `drops` is neither affirmed nor denied"
  - question: q.scale.cost
    kind: missing-followup
    effect: "the sell half was neither answered nor asked back; conditional_fields requires the runner to ask on silence (see unknowns[0])"
  - question: q.constraint.strength
    kind: missing-spawn
    token: zephyr-rtos
    effect: "an included volunteered token never got its required ask-back (see unknowns[2]); G0 is blocked"
  - question: q.fn.rate
    kind: missing-spawn
    effect: "spawned_by is once per named sense/act; four senses were named (position, altitude, speed-velocity, tilt) and only two spawns occurred (position, tilt/motion). Unspawned adaptives are N/A, not UNKNOWN."

