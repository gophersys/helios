    blocks: [metric.viability.economics]
    note: "q.scale.cost answered the build half only; no intent to sell stated and no explicit not-for-sale, so conditional_fields makes this UNKNOWN, not ABSENT. The runner was required to ask and did not."
  - field: pir.environment.limits
    blocks: []
    note: "q.followup.range (spawned by q.env.conditions for heat/cold) was asked and left blank. Its feeds are pir.environment.limits and pir.physical.dims only — it carries no metric id, so it blocks no P1 metric. Tier scoring: passes G0, raised as risk."
