    detail: altitude
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: null                 # ABSENT — q.fn.rate never spawned for this sense
  - capability: sensing
    detail: speed-velocity
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate: null                 # ABSENT — q.fn.rate never spawned for this sense
  - capability: sensing
    detail: tilt-motion
    question: q.fn.senses
    quote: "ideally the positon accruately, and other env things like altitude, speed, velocity, tilt, things like that"
    at: "2026-08-26"
    rate:
      value: "within seconds; alert path as fast as possible"
      question: q.fn.rate
      spawned_for: tilt/motion
      quote: "within seconds, if an alert it must be as quick as possible"
      at: "2026-08-26"
  # ── connectivity (q.fn.talks) ────────────────────────────────────────
  - capability: connectivity
    detail: phone-nearby
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  - capability: connectivity
    detail: far-away-anywhere
    question: q.fn.talks
    quote: "from anywehre, ideally i want my pohone to easily connect to it nearby, but also always know the locaiton based on cellular or smth like that"
    at: "2026-08-26"
  # ── hmi (q.fn.shows) ─────────────────────────────────────────────────
  - capability: hmi
    detail: a-light
    question: q.fn.shows
    quote: "no screen, maybe a multicolo led to signal states, simople is best, naybe 1 multipurpos ebutton too"
    at: "2026-08-26"
  # ── storage (q.fn.stores) ────────────────────────────────────────────
  - capability: storage
    detail: retain-across-power-loss; buffer fixes while no location/link and backfill to cloud
    question: q.fn.stores
    quote: "yes it must remember htings, and even hit low power modes and save things if no location, then backtrack to the cloud"
    at: "2026-08-26"
  # ── compute (q.fn.offline — on-device logic that survives no internet) ─
  - capability: compute
    detail: edge-autonomy; everything works offline except alerts
    question: q.fn.offline
    quote: "no alerts but yes everything else"
    at: "2026-08-26"
  # ── derived capabilities (conventions.derived-items) ─────────────────
  - capability: security
    detail: baseline (product talks to a phone + anywhere, and collects location)
    source: derived
    rule: derivations.capability.security
  - capability: time
    detail: timekeeping (duty includes wakes-on-schedule)
    source: derived
    rule: derivations.capability.time
  - capability: power
    detail: PC1 + modes [wakes-on-event, wakes-on-schedule, only-when-used]
    source: derived
    rule: derivations.capability.power
  # NOTE actuation: NONE — q.fn.acts answered negative, so no item is created
  # (conventions.negative-function); the answer lives in provenance.pir.functions.

