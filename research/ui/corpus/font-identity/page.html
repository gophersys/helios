<!doctype html><meta charset="utf-8">
<title>corpus/font-identity</title>
<style>
  body { margin: 0; background: #111; }
  .panel { position: relative; width: 300px; height: 100px; }
  .plate { position: absolute; left: 0; top: 0; width: 300px; height: 100px; background: #1c1c1c; }
  .k { position: absolute; left: 130px; top: 12px; text-align: center; }
  /* THE SEED: panel.toml declares a SANS face and every box on a page like
     this one would be reserved from its advances; the page draws a MONO face
     instead. The stack is written so the substitution happens on both gate
     hosts — the CI image resolves DejaVu Sans Mono, a Mac falls through to
     Courier New, and the generic keyword catches anything else. Nothing here
     announces itself: the ink is where ink belongs, and only the advance of
     the face says the geometry was computed from a different one. */
  .k-label { font-family: "DejaVu Sans Mono", "Courier New", monospace;
             font-size: 16px; line-height: 20px; color: #e8edf2; }
</style>
<div class="panel">
  <div class="plate">
    <div class="k" data-addr="one">
      <div class="k-label">GAIN</div>
    </div>
  </div>
</div>
