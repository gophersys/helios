# corpus seed — breathing. Default audit.Rules(); no [rules] override, because a
# seed that needs a loosened rule proves nothing about the shipped predicate.
#
# `value` is declared in text_kinds exactly as demos/telemetry and demos/bench
# declare it, so the probe measures GLYPH INK — the configuration every panel
# that ships runs under. Measuring the element box instead would make the seed
# catchable only on a code path no production panel uses.
[probe]
root = ".panel"
text_kinds = ["value"]

[probe.containers]
plate = ".plate"

[probe.parts]
value = ".value"
