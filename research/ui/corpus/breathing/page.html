<!doctype html><meta charset="utf-8">
<title>corpus/breathing</title>
<style>
  body { margin: 0; background: #111; }
  .panel { position: relative; width: 300px; height: 100px; }
  .plate { position: absolute; left: 0; top: 0; width: 300px; height: 60px; background: #1c1c1c; }
  /* The probe measures glyph ink, so the seeded clearance is wherever the
     BASELINE lands: box top + line-height/2 + half the face's (ascent -
     descent). Half-leading cancels half the metric spread between faces —
     1.0px across the 13 measured in TELL.md, in a 4px band. */
  .value { position: absolute; overflow: hidden; color: #cfe; font: 12px/12px monospace; }
</style>
<div class="panel">
  <div class="plate">
    <!-- No descender in "-12.0 dB": a `3` drops 2px further in old-style
         figures (Georgia) and would swing the clearance out of the band. -->
    <div class="value" data-addr="one"
         style="left:10px;top:50px;width:100px;height:12px">-12.0 dB</div>
  </div>
</div>
