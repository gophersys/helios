<!doctype html><meta charset="utf-8">
<title>corpus/axis-sprawl</title>
<style>
  body { margin: 0; background: #111; }
  .panel { position: relative; width: 300px; height: 220px; }
  .plate { position: absolute; left: 0; top: 0; width: 300px; height: 220px; background: #1c1c1c; }
  /* THE SEED: five controls on a diagonal, so no two share a left, a right or
     a centre. Every dial is well clear of the next, which is why nothing but
     the axis budget has anything to say about this page. */
  .dial { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #4a7; }
</style>
<div class="panel">
  <div class="plate">
    <div class="dial" data-addr="d1" style="left:10px;top:10px"></div>
    <div class="dial" data-addr="d2" style="left:60px;top:50px"></div>
    <div class="dial" data-addr="d3" style="left:110px;top:90px"></div>
    <div class="dial" data-addr="d4" style="left:160px;top:130px"></div>
    <div class="dial" data-addr="d5" style="left:210px;top:170px"></div>
  </div>
</div>
