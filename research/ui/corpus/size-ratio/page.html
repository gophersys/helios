<!doctype html><meta charset="utf-8">
<title>corpus/size-ratio</title>
<style>
  body { margin: 0; background: #111; font-family: Arial, "DejaVu Sans", sans-serif; }
  .panel { position: relative; width: 300px; height: 100px; }
  .plate { position: absolute; left: 0; top: 0; width: 300px; height: 100px; background: #1c1c1c; }
  .k { position: absolute; left: 136px; top: 20px; width: 28px; text-align: center; }
  /* THE SEED: 9px type against a 28px control — 0.32 in type-size terms, the
     ratio a generated panel lands on. A human-drawn panel of this era sits
     near 16/28. Nothing else on this page differs from a correct one. */
  .k-label { font-size: 9px; line-height: 12px; color: #e8edf2; }
  .k-dial { display: block; margin: 4px auto 0; }
</style>
<div class="panel">
  <div class="plate">
    <div class="k" data-addr="one">
      <div class="k-label">GAIN</div>
      <svg class="k-dial" width="28" height="28" viewBox="0 0 28 28">
        <path d="M 5 23 A 12.5 12.5 0 1 1 23 23" fill="none" stroke="#3c4650" stroke-width="4"/>
        <line x1="14" y1="14" x2="21" y2="7" stroke="#dfe6ec" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>
