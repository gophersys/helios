[project]
name = "ui"
version = "0.1.0"
description = "Computed layout and geometry proofs for blind layout engines"
requires-python = ">=3.11"
dependencies = ["fonttools>=4.50"]

[project.optional-dependencies]
measure = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.4", "pillow>=10"]

[project.scripts]
ui = "ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]

[tool.ruff]
line-length = 100
