[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corectl"
version = "0.1.0"
description = "Concord platform CLI — manage validation tests, MTIB fixtures, and manufacturing"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "click>=8.0",
    "requests>=2.26",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
corectl = "corectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corectl"]
