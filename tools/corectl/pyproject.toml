[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corectl"
dynamic = ["version"]
description = "Concord platform CLI — manage validation tests, MTIB fixtures, and manufacturing"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.hatch.version]
path = "src/corectl/__init__.py"

dependencies = [
    "click>=8.0",
    "requests>=2.26",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # corekinect ships in lockstep — same major.minor as corectl. Pin to
    # ~=major.minor.0 so a corectl install always pulls the matching
    # framework, and an upgrade pulls the matching framework upgrade.
    # The release skill updates this constraint each minor bump.
    "corekinect~=0.6.0",
]

[project.scripts]
corectl = "corectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corectl"]

# Template files (concord.yaml, test stubs, pyproject.toml, .gitignore)
# must ship inside the wheel — `corectl test init` reads them via
# ``importlib.resources``. Hatch excludes anything not matching
# ``*.py`` by default; override to include the whole templates tree.
[tool.hatch.build.targets.wheel.force-include]
"src/corectl/templates" = "corectl/templates"
