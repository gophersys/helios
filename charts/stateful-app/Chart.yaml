apiVersion: v2
name: stateful-app
description: |
  Archetype for services that need stable network identity and per-replica
  persistent storage. Emits StatefulSet + headless Service + PVC template
  + PDB + ServiceMonitor + ExternalSecret + NetworkPolicy + PrometheusRule.

  PVCs carry platform.gophersys/retain=true; deletion is blocked by
  platform/core/policy/ without an explicit override.

type: application
version: 0.1.0
appVersion: 0.1.0
kubeVersion: ">=1.28.0-0"

maintainers:
  - name: Mateo Segura
    email: mateo.segura413@gmail.com

keywords:
  - stateful
  - persistence
  - platform
  - gophersys

dependencies:
  - name: _common
    version: 0.1.0
    repository: file://../_common

annotations:
  platform.gophersys/archetype: stateful-app
  platform.gophersys/status: skeleton
