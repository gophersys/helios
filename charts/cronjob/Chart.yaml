apiVersion: v2
name: cronjob
description: |
  Archetype for scheduled work. Wraps Kubernetes CronJob with opinionated
  defaults (concurrencyPolicy=Forbid, UTC, activeDeadlineSeconds=3600).
  Emits CronJob + ExternalSecret + NetworkPolicy + PrometheusRule for
  success-rate SLO + optional Pushgateway sidecar for short-run metrics.

type: application
version: 0.1.0
appVersion: 0.1.0
kubeVersion: ">=1.28.0-0"

maintainers:
  - name: Mateo Segura
    email: mateo.segura413@gmail.com

keywords:
  - cronjob
  - scheduled
  - batch
  - platform
  - gophersys

dependencies:
  - name: _common
    version: 0.1.0
    repository: file://../_common

annotations:
  platform.gophersys/archetype: cronjob
  platform.gophersys/status: skeleton
