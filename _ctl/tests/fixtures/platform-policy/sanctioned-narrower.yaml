# The counter-stimulus of unsanctioned-platform.yaml: the SAME 2 images, and the
# same image carries a `platforms` key — but every entry of it is in the
# sanctioned set, and the list is narrower than that set rather than wider.
#
# The pair is the point. A reader that refused every declared `platforms` key
# would pass the stimulus in the other file while making the real images.yaml
# unreadable, and flutter — which is correctly amd64-only — would be a broken
# manifest forever. This fixture is what separates "the rule fires" from "the
# rule is stuck on".
images:
  base:
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    paths:
      - base/
    groups:
      - content-base

  flutter:
    parent: base
    context: flutter
    dockerfile: flutter/Dockerfile
    smoke_ref: flutter:smoke
    platforms:
      - linux/amd64
    paths:
      - flutter/
    groups:
      - content-flutter
