# A manifest whose document order is NOT a build order: `flutter` declares
# `base` as its parent and is written ABOVE it.
#
# BUILD_ORDER is the document order of `images:`, so this file emits an order
# that builds a layer FROM a tag the run has not made yet. In the publish
# workflow that is a job failing on `base:<sha>` — a tag nothing pushed — after
# the merge, on main.
#
# _ctl/tests/images-manifest.test.sh feeds this to image_names and asserts the
# guard REFUSES it and names both images. A guard whose refusal nothing has
# watched is a guard nobody can say fires.
images:
  flutter:
    parent: base
    context: flutter
    dockerfile: flutter/Dockerfile
    smoke_ref: flutter:smoke
    paths:
      - flutter/
    groups:
      - content-flutter

  base:
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    paths:
      - base/
    groups:
      - content-base
