# Counter-stimulus fixture for _ctl/tests/publish-order.test.sh.
#
# No CI system reads this file. GitHub reads .github/workflows/ and nothing
# else, and this path is not that. It exists so the 3 detectors in that test
# have input in every shape they claim to tell apart: a check that has only
# ever seen the correct shape is a check nobody has watched fire.
#
# Each job below is named for the verdict it must receive, and the test asserts
# BOTH halves for each detector — that it reports the job it must report, and
# that it stays quiet on the job it must not. A detector that reports every job
# is exactly as useless as one that reports none.
#
#   smokes-then-ships    clean on all 3 rules. It is also the shape the fix to
#                        the real workflow is expected to take: build with
#                        `push: false` + `load: true`, smoke the loaded local
#                        image, then publish. It carries a `push: false` step
#                        ON PURPOSE — if the publish detector counted that as a
#                        publish, the fix would be unable to satisfy its own
#                        rule and the test would forbid the only cheap remedy.
#   ships-then-smokes    the defect this test exists for. The image reaches the
#                        registry, and only then is it checked. There is no
#                        rollback step in any workflow of this repository, so
#                        the check can report but cannot prevent.
#   ships-unsmoked       publishes with nothing asserting its content. It also
#                        carries the word `.ci/smoke.sh` inside a COMMENT, so
#                        the smoke detector is watched to ignore prose. A
#                        detector that reads comments would call this job clean.
#   verifies-too-early   reads the published manifest BEFORE the push that
#                        would create it. `verify-published` inherently runs
#                        after a publish, so the test pins that direction as
#                        well: a fix that satisfies the smoke rule by moving
#                        every step above the push breaks this one instead.

name: fixture-build-and-push

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: gophersys
  PLATFORMS: linux/amd64

jobs:
  smokes-then-ships:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image and load it, publishing nothing
        uses: docker/build-push-action@v6
        with:
          context: fixture
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          tags: fixture:local
      - name: smoke test
        run: bash .ci/smoke.sh fixture fixture:local
      - name: publish the image that has just been checked
        uses: docker/build-push-action@v6
        with:
          context: fixture
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/fixture:latest
      - name: verify the published manifest
        run: bash ./ctl.sh verify-published fixture

  ships-then-smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: fixture
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/fixture:latest
      - name: verify the published manifest
        run: bash ./ctl.sh verify-published fixture
      - name: smoke test (native amd64)
        run: bash .ci/smoke.sh fixture

  ships-unsmoked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish with nothing asserting the content
        # Prose, not a step. This sentence names `bash .ci/smoke.sh fixture`
        # while running no such thing, and a detector that reads a comment
        # reports this job as smoked when it is not.
        uses: docker/build-push-action@v6
        with:
          context: fixture
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/fixture:latest
      - name: verify the published manifest
        run: bash ./ctl.sh verify-published fixture

  verifies-too-early:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify the published manifest
        run: bash ./ctl.sh verify-published fixture
      - name: smoke test
        run: bash .ci/smoke.sh fixture
      - name: publish
        uses: docker/build-push-action@v6
        with:
          context: fixture
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/fixture:latest
