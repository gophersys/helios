name: fixture-matrix-block

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# The BLOCK form of the same list. YAML spells 1 list 2 ways, and a rewrite from
# the flow form to this one is a formatting change that no reviewer would stop —
# so a reader that saw only the flow form would report an EMPTY matrix and, with
# the rule written the wrong way round, a green result over a set of nothing.
#
# The commented entry is the trap: a reader that keys on the text calls delta a
# scanned image, and the real workflow would then be reported as missing an
# image it never declared.

on:
  schedule:
    - cron: "0 9 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpha
          - "beta"
          # - delta   <- retired, and nothing scans it
          - gamma
    steps:
      - name: scan the image
        run: trivy image ghcr.io/gophersys/${{ matrix.image }}:latest
