name: fixture-notify-job-without-always

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# THE DEFECT: the job-level condition is gone.
#
# A job with no `if:` runs only when every job it needs SUCCEEDED. So on the
# night the scan finds a critical vulnerability, this job is skipped — and a
# skipped job files nothing. The notifier exists, the reduction step exists,
# needs: is complete, and none of it runs on the only night it is for.
#
# The comment on the next line is the guard that was deleted, and a detector
# that reads prose calls this file correct:
#   if: ${{ always() }}

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the image
        run: trivy image --severity CRITICAL --exit-code 1 --ignorefile .ci/trivyignore.yaml ghcr.io/gophersys/base:latest

  base-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the registry still holds the pinned digest
        run: bash ./ctl.sh base-currency

  notify:
    needs: [scan, base-currency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reduce the verdict of the jobs above to this job's own status
        run: |
          scan='${{ needs.scan.result }}'
          currency='${{ needs.base-currency.result }}'
          [[ "$scan" == "success" && "$currency" == "success" ]]
      - name: file the failure
        if: ${{ failure() }}
        run: 'bash .ci/notify-failure.sh "the nightly went red"'
      - name: close the issue on a green run
        if: ${{ success() }}
        run: bash .ci/notify-failure.sh --resolve
