name: fixture-matrix-bounded

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# The QUIET direction of the bounded-matrix rule. The `scan` job fans out over a
# matrix and declares how wide the fan is allowed to be; the `notify` job has no
# matrix at all and must never be asked for a bound it has no use for.
#
# A detector that reported either job would make the rule impossible to satisfy,
# and the first person to hit it would delete it.

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: arc-build
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: [alpha, beta, gamma]
    steps:
      - name: scan the image
        run: trivy image ghcr.io/gophersys/${{ matrix.image }}:latest

  notify:
    if: ${{ !cancelled() }}
    needs: [scan]
    runs-on: arc-build
    steps:
      - name: file the failure
        if: ${{ failure() }}
        run: bash .ci/notify-failure.sh "the nightly scan failed"
