name: fixture-unscheduled-workflow

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# This one runs on a push. A push-triggered run has an author who is watching
# it, so the notification rule does not apply — and a rule that reported this
# file would demand `issues: write` on every workflow in the repository, which
# is the opposite of least privilege.
#
# This file declares no schedule: key. The words in the previous sentence are
# the trap: they are prose inside a comment, and a reader that greps the raw
# text calls this a scheduled workflow and then demands a notifier it must not
# have.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./ctl.sh validate
