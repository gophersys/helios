name: fixture-notify-job-without-verdict

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# THE DEFECT the verifier drilled: the reduction step is gone, and everything
# else is untouched.
#
# The job runs under always(), so ITS OWN steps all succeed whatever the scan
# did. `failure()` in a step means "a step of THIS job failed", so the filing
# step never fires — and `success()` is TRUE, so the closing step fires on a
# night when 6 images came back with a critical vulnerability. The nightly is
# then worse than absent: it CLOSES the issue that reports its own red.
#
# Nothing in this file is misspelled and no token is missing. always() is
# there, needs: is complete, both notifier calls are there under the right
# conditions. Only the ORDER-BEARING step is gone, so only a rule about the
# shape of the job sees it.

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the image
        run: trivy image --severity CRITICAL --exit-code 1 --ignorefile .ci/trivyignore.yaml ghcr.io/gophersys/base:latest

  base-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the registry still holds the pinned digest
        run: bash ./ctl.sh base-currency

  notify:
    if: ${{ always() }}
    needs: [scan, base-currency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The step that read needs.*.result and failed this job stood here.
      # A detector that reads prose finds the words below and calls the file
      # correct, so they are here to be ignored:
      #   scan='${{ needs.scan.result }}'  -> "success"
      - name: file the failure
        if: ${{ failure() }}
        run: 'bash .ci/notify-failure.sh "the nightly went red"'
      - name: close the issue on a green run
        if: ${{ success() }}
        run: bash .ci/notify-failure.sh --resolve
