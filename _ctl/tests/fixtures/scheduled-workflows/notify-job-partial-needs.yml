name: fixture-notify-job-partial-needs

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# THE DEFECT: 1 job is missing from `needs:`.
#
# `base-currency` is not needed, so its result never reaches this job. The
# reduction step below cannot read a result it was not given, and the notify job
# does not even wait for that job to finish. The night ubuntu moves under the
# digest pin, base-currency goes red, the notify job reduces a verdict that says
# nothing about it, and the run reports a clean night.
#
# This is the drill the verifier ran: delete 1 name from needs:, and the whole
# suite stays green. The rule below is therefore set equality against EVERY
# other job of the workflow, and never "needs: is present".

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the image
        run: trivy image --severity CRITICAL --exit-code 1 --ignorefile .ci/trivyignore.yaml ghcr.io/gophersys/base:latest

  base-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the registry still holds the pinned digest
        run: bash ./ctl.sh base-currency

  notify:
    if: ${{ always() }}
    needs: [scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reduce the verdict of the jobs above to this job's own status
        run: |
          scan='${{ needs.scan.result }}'
          [[ "$scan" == "success" ]]
      - name: file the failure
        if: ${{ failure() }}
        run: 'bash .ci/notify-failure.sh "the nightly went red"'
      - name: close the issue on a green run
        if: ${{ success() }}
        run: bash .ci/notify-failure.sh --resolve
