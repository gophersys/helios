name: fixture-hosted-runner

# A FIXTURE, not a workflow. See self-hosted-runner.yml.
#
# This is the LOUD direction of the billed-runner rule, and it holds both
# defects at once:
#
#   1. the `build` job runs on ubuntu-latest, which is a GitHub-hosted runner
#      and is BILLED by the minute. The account that owns this repository has a
#      $0 budget, so a billed runner is a workflow that stops running on the day
#      the allowance is spent — silently, because a run that never starts
#      attaches no failing check to anything.
#
#   2. that same job runs jlumbroso/free-disk-space, which exists to delete the
#      preinstalled SDKs of a GitHub-hosted image. A homelab runner pod shares
#      its node's filesystem with every other pod, so the same step there
#      deletes the node's caches and takes the other tenants with it.
#
# The `gate` job runs on a homelab pool and runs no such action. It is here so
# the report can be watched to name the billed job and NOT its correct sibling —
# a detector that reports both says nothing about which one to fix.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true
      - name: build
        run: echo build

  gate:
    needs: [build]
    runs-on: arc-org
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: echo validate
