name: fixture-invalid-run-scalar

# A FIXTURE, not a workflow. See valid.yml.
#
# THE DEFECT, reproduced exactly. The `run:` value below is a PLAIN scalar that
# holds a colon followed by a space ("image scan: "). YAML reads that colon as
# the start of a mapping value, in a context where a mapping cannot start, and
# the whole document fails to parse:
#
#   yaml: line NN, column NN: mapping values are not allowed in this context
#
# GitHub refuses a workflow it cannot parse, so the file never runs at all. It
# is not a scan that misses a vulnerability — it is a nightly that does not
# exist, reported nowhere, because a workflow that never parses also never
# fails. Every awk and grep reader in this repository reads this file happily:
# the tokens they key on are all present, on the right lines, spelled right.
# Only a PARSER sees it.
#
# The fix is 1 pair of quotes, which is why the rule that catches it has to be
# a parse and not a lint.

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the image
        run: trivy image --severity CRITICAL --exit-code 1 ghcr.io/gophersys/base:latest

  notify:
    if: ${{ always() }}
    needs: [scan]
    runs-on: ubuntu-latest
    steps:
      - name: file the failure
        if: ${{ failure() }}
        run: bash .ci/notify-failure.sh "image scan: ${{ needs.scan.result }}"
