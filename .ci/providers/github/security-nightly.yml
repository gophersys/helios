name: security-nightly

# Scans the 5 published images for CRITICAL vulnerabilities every night, and
# reports the night ubuntu moves under the digest this repository pins.
#
# It runs on arc-build, the homelab pool this repository's builds moved to. A
# nightly on a GitHub-hosted runner cost ~50 minutes of a 2,000-minute account
# every night, and the account had 195 left. The scan job carried a
# `jlumbroso/free-disk-space` step and no longer does, for the reason
# build-and-push states: that action empties a throwaway hosted VM, and on this
# pool the same deletion strips the NODE.
#
# Nothing here builds or publishes an image. A nightly republish would move
# :latest with no commit behind it, so 2 different images would carry the same
# SHA tag and verify-published could not say which one it read. This workflow
# only MEASURES; the answer to what it finds is a pull request.
#
# A scheduled run has no author watching it, so the notify job below turns a red
# into 1 labelled issue and a green into the closing of that same issue.
# _ctl/tests/scheduled-workflows.test.sh holds that shape in the pull request
# gate, keyed on the schedule trigger rather than on this file's name.

on:
  schedule:
    # 09:00 UTC, which is 02:00 MST — cron is UTC, and America/Phoenix keeps no
    # DST, so that local hour is the same one every night of the year. It is the
    # quiet window for this repository: build-and-push runs on a push to main,
    # and nobody pushes to main then, so this scan does not race a publish and
    # read an image being replaced.
    - cron: "0 9 * * *"
  workflow_dispatch:

# The notifier opens, comments on and closes 1 issue. Without issues: write the
# filer step fails, and a run that is already red gets a second red instead of a
# notification.
permissions:
  contents: read
  issues: write

env:
  # The scanner, pinned. The vulnerability DATABASE moves every day and that is
  # the point of a nightly; the ENGINE moving under us is not. Bumping this is a
  # version change like any other.
  TRIVY_VERSION: v0.74.0 # latest stable as of 2026-08-16

jobs:
  scan:
    # A job with no limit inherits the GitHub default of 360 minutes, and a hung
    # scan would hold a slot for 6 hours every night.
    #
    # 30 clears the 20m scan flag below, and the arithmetic is what says so
    # rather than the round number. Worst of the 5 jobs of run 32121496607:
    # 50s of setup + checkout + login + trivy install, 47s to download the
    # 108 MiB vulnerability DB, 20m of scan, and 48s for trivy to unwind and
    # print its FATAL — ~22m30s, leaving ~7m30s of margin. The DB download is
    # budgeted SEPARATELY from the flag because that log does not settle whether
    # it runs inside trivy's own deadline, and the reading that cannot
    # under-size this number is the one to take.
    #
    # The ORDER is the point, not the margin: trivy's own timeout has to fire
    # first. It fails naming the deadline and prints the WARN that says to raise
    # it, where a job timeout stops the step with a log that diagnoses nothing.
    # Raise this whenever the flag below is raised, and keep the gap.
    #
    # RE-CHECKED on 2026-08-25, when the pull step below moved the download OUT
    # of trivy's own 20m deadline and INTO this ceiling. The arithmetic changed
    # shape, so it was re-derived rather than assumed, off the 2 legs of run
    # 32832111998 that COMPLETED — the first real measurements this repository
    # has held: hardware 13m17s and ui 12m02s for download AND analysis
    # together, hardware being the largest image at 10.01 GB unpacked. The same
    # bytes cross the wire either way; they are only accounted differently now,
    # so the worst leg sits near 13m against a 30m ceiling with ~2m25s of
    # measured setup beside it. A pull that has to use all 3 of its attempts
    # resumes rather than restarts, so it adds the lost fraction of a layer and
    # not another whole download. 30 still holds, and it is the first green
    # nightly that should re-size BOTH numbers.
    timeout-minutes: 30
    runs-on: arc-build
    permissions:
      contents: read
      # Read-only: this workflow publishes nothing. The grant is here because
      # the images are read out of ghcr.io, and an anonymous pull of a private
      # package is a 401 that says nothing about the image.
      packages: read
    strategy:
      # Every image is scanned, every night. Without this the first CRITICAL
      # cancels its 4 siblings, and the morning report names 1 image out of 5
      # while saying nothing about the other 4.
      fail-fast: false
      # arc-build has 6 slots and every repository's builds share them. 5 trivy
      # jobs at once would take the whole pool for the length of the scan, and
      # the scan is not urgent — it runs at 02:00 MST with nobody waiting.
      max-parallel: 3
      matrix:
        image: [base, mobile, embedded, cloud, hardware, ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: preflight - disk margin on RUNNER_TEMP for ghcr.io/gophersys/${{ matrix.image }}:latest
        # 2026-08-25, follow-up to #98. TRIVY_CACHE_DIR and TMPDIR below both
        # write to RUNNER_TEMP - the vulnerability database and the `docker
        # save` tar --image-src docker reads from - and #98 shipped with that
        # sizing UNMEASURED for the largest image: "watch the first hardware
        # nightly" was its own stated residual. This step replaces the
        # watching with a number, printed every run, checked before the pull
        # spends the transfer rather than after a scan dies on ENOSPC with a
        # log that only says so.
        #
        # The registry size is read the way base-currency and
        # verify-published already read a manifest - `docker buildx imagetools
        # inspect --raw`, never `docker manifest inspect`, so this repository
        # keeps 1 registry client and not 2 - for the linux/amd64 variant,
        # because arc-build runs no other. It is the COMPRESSED size the
        # manifest declares, and that is a FLOOR against the real need and not
        # the need itself: no registry API reports the UNPACKED size before a
        # pull, and trivy's `docker save` tar sits close to that larger number
        # (hardware measures 10.01 GB unpacked in images.yaml). A compressed
        # floor plus a flat overhead is the best signal available before the
        # transfer runs - the same posture the TMPDIR comment below takes with
        # its own FLOOR reading.
        #
        # 2.5 GiB is the stated trivy DB overhead this follow-up ships with:
        # headroom over the ~1.6 GB the main DB (108 MiB, rule 9's own
        # measurement above) and the Java DB (~1.5 GB, #98's review) combine
        # to.
        run: |
          set -Eeuo pipefail
          image="ghcr.io/gophersys/${{ matrix.image }}:latest"
          trivy_db_overhead_bytes=2684354560   # 2.5 GiB = 2.5 * 1024^3

          index_stderr="$(mktemp)"
          read_status=0
          index_raw="$(docker buildx imagetools inspect --raw "$image" 2>"$index_stderr")" || read_status=$?
          if [ "$read_status" -ne 0 ]; then
            printf 'FATAL: cannot read the manifest of %s (docker buildx imagetools inspect exited %s):\n' "$image" "$read_status" >&2
            cat "$index_stderr" >&2
            rm -f "$index_stderr"
            exit 1
          fi
          rm -f "$index_stderr"

          # An index carries a "manifests" array, one entry per platform; a
          # single-platform manifest does not. Read whichever shape the tag
          # holds - a caller cannot tell without asking.
          platform_digest="$(jq -r '
            if has("manifests") then
              [ .manifests[]?
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | .digest
              ] | first // empty
            else empty end
          ' <<< "$index_raw")"

          if [ -n "$platform_digest" ]; then
            manifest_stderr="$(mktemp)"
            read_status=0
            manifest_raw="$(docker buildx imagetools inspect --raw "${image%:*}@${platform_digest}" 2>"$manifest_stderr")" || read_status=$?
            if [ "$read_status" -ne 0 ]; then
              printf 'FATAL: cannot read the linux/amd64 manifest of %s at %s (exited %s):\n' "$image" "$platform_digest" "$read_status" >&2
              cat "$manifest_stderr" >&2
              rm -f "$manifest_stderr"
              exit 1
            fi
            rm -f "$manifest_stderr"
          else
            manifest_raw="$index_raw"
          fi

          registry_bytes="$(jq -r '(.config.size // 0) + ([.layers[]? | (.size // 0)] | add // 0)' <<< "$manifest_raw")"
          if [ -z "$registry_bytes" ] || [ "$registry_bytes" -le 0 ]; then
            printf 'FATAL: %s reports a registry size of %s bytes - the manifest carries no readable layers\n' "$image" "$registry_bytes" >&2
            exit 1
          fi

          needed_bytes=$((registry_bytes + trivy_db_overhead_bytes))
          free_bytes="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d '[:space:]')"

          printf 'disk margin for %s:\n' "$image"
          printf '  registry size (linux/amd64, compressed): %d bytes (%s GiB)\n' "$registry_bytes" "$(awk -v b="$registry_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"
          printf '  trivy DB overhead (stated):               %d bytes (2.50 GiB)\n' "$trivy_db_overhead_bytes"
          printf '  needed on RUNNER_TEMP:                    %d bytes (%s GiB)\n' "$needed_bytes" "$(awk -v b="$needed_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"
          printf '  free on RUNNER_TEMP (%s): %d bytes (%s GiB)\n' "$RUNNER_TEMP" "$free_bytes" "$(awk -v b="$free_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"

          if [ "$free_bytes" -lt "$needed_bytes" ]; then
            printf 'FATAL: %s needs an estimated %d bytes on RUNNER_TEMP (%d registry + %d trivy DB) but only %d bytes are free - raise the work volume or narrow this scan before it runs\n' \
              "$image" "$needed_bytes" "$registry_bytes" "$trivy_db_overhead_bytes" "$free_bytes" >&2
            exit 1
          fi
      - name: install trivy at the pinned version
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: pull ghcr.io/gophersys/${{ matrix.image }}:latest
        timeout-minutes: 10
        # 2026-08-25. THE SCAN NO LONGER DOWNLOADS THE IMAGE ITSELF, and the
        # reason is a retry that trivy's registry client does not have.
        #
        # The measured signature, identical across 3 runs:
        #
        #   FATAL  Fatal error  run error: image scan error: ... pipeline
        #   error: failed to analyze layer (sha256:<layer>): walk error:
        #   failed to extract the archive: stream error: stream ID <N>;
        #   PROTOCOL_ERROR; received from peer
        #
        # The peer resets 1 HTTP/2 stream part-way through a multi-GB layer,
        # and trivy turns that into a FATAL for the whole scan. It does not
        # retry the layer, it does not resume the byte range, and no CVE is
        # involved — the CRITICAL gate below never runs.
        #
        # It is EGRESS WEATHER and not a property of any image, which is what
        # the 3 runs show: the image that dies moves, and so does the layer and
        # the stream id.
        #
        #   32237605557  2026-08-19  mobile    layer 7ccfeeb9…  stream ID 71
        #                            (the other 5 legs died on 3 CRITICALs,
        #                             which .ci/trivy-ignore-policy.rego now
        #                             answers — this run is the earliest
        #                             sighting, not a clean sample)
        #   32758651885  2026-08-24  attempt 1: embedded 3bc4da2d… ID 7,
        #                                       hardware dbb6bed7… ID 9,
        #                                       ui       dbb6bed7… ID 11,
        #                                       cloud    8392cd74… ID 71
        #                            attempt 2: mobile   b1f20852… ID 71
        #   32832111998  2026-08-25  base     3bc4da2d… ID 3,
        #                            embedded 3bc4da2d… ID 7,
        #                            mobile   3bc4da2d… ID 9,
        #                            cloud    00cd2358… ID 73
        #                            (hardware and ui passed on the SAME layer
        #                             the other 3 died on, which is the whole
        #                             argument that the bytes are fine)
        #
        # docker's pull path is the client that already solves this: it retries
        # a failed layer and RESUMES it, per layer, without restarting the
        # pull. So the image arrives through the client that survives a reset,
        # and trivy reads it off local disk. The loop below is the second half
        # of the same posture — docker's own retries are bounded, and a run
        # that exhausts them has to say WHICH image it could not fetch.
        #
        # This is deliberately not a trivy version bump. No release note claims
        # a retry here, and a bump would move the ENGINE under a scan whose
        # database already moves every night.
        #
        # timeout-minutes: 10, added as a follow-up to #98's own review, which
        # flagged that this step was unbounded inside the 30m job ceiling: a
        # pull that goes silent (a stalled connection, unlike the fast
        # PROTOCOL_ERROR the 3 recorded incidents above produced) would be
        # absorbed into the JOB timeout and killed with the diagnostic-less
        # log rule 9 exists to keep the SCAN out of. This step already fails
        # loud on its own, naming the image, at "could not pull ... in 3
        # attempts" below - a step timeout gives that failure a bound instead
        # of GitHub's.
        #
        # 10m is NOT read off a measured pull-alone duration: no run in this
        # file's history isolates the pull from the scan that follows it - the
        # 13m17s/12m02s pair above (run 32832111998) is PULL AND ANALYSIS
        # TOGETHER, and splitting it needs a run this repository has not made
        # yet. 10 is the default this follow-up ships with while that
        # measurement is unstated: well under the 30m job ceiling with the
        # scan step still ahead of it, and RAISE IT rather than delete it the
        # day a real pull-alone duration is measured.
        run: |
          set -Eeuo pipefail
          image="ghcr.io/gophersys/${{ matrix.image }}:latest"
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              printf 'pulled %s on attempt %d of 3\n' "$image" "$attempt"
              exit 0
            fi
            printf 'pull attempt %d of 3 failed for %s\n' "$attempt" "$image" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          printf 'FATAL: could not pull %s in 3 attempts, 15s apart\n' "$image" >&2
          exit 1
      - name: scan ghcr.io/gophersys/${{ matrix.image }}:latest
        # --timeout, and the DEFAULT is what broke this scan. Trivy defaults to
        # 5m, and on 2026-08-18 all 5 scans died against it (run 32121496607,
        # issue #73): the same `context deadline exceeded`, with trivy's own
        # "Provide a higher timeout value" WARN beside it. The first dual-arch
        # publish rebuilt every image with new layer digests, so every scan ran
        # COLD; the default had only ever survived warm ones, which is how a
        # budget that was always this tight looked healthy for months. No CVE
        # was involved — the CRITICAL gate below never got to run.
        #
        # 20m is HEADROOM OVER AN UNMEASURED QUANTITY, and that is the honest
        # description of it. NO scan of that run finished, so the cost of a cold
        # one is a lower bound and not a measurement: base reached 5m43s of
        # analysis, cloud 5m48s, and cloud — the largest, at the 5.75 GB budget —
        # was still working at 4m05s when it started downloading a SECOND
        # database (the Java DB), which never finished. So 20m is 4x the default
        # that failed, not a number read off a green run.
        #
        # NOBODY LOWERS THIS BLIND. The first green nightly is the first real
        # measurement this repository will hold: read the scan duration out of
        # it, and size this flag from that number.
        #
        # The large-file WARNs in that log are REAL, and they stay unhidden.
        # Trivy recommends --skip-files for them; that flag would hide a
        # property of the image instead of fixing it. base carries 3 — two 13 MB
        # copies of corepack's pnpm.mjs under /home/dev/.cache/node, and a 24 MB
        # blob in /home/dev/.npm/_cacache — and cloud carries the 2 pnpm.mjs. A
        # package cache has no business in a published image; removing it is the
        # lean-out pass's work, not a scanner flag's. They cost scan time, so
        # they are part of why this timeout has to be generous.
        #
        # --exit-code 1 is what makes this a GATE. With --exit-code 0 trivy
        # prints its table, the step succeeds, the run is green, and nobody
        # reads the log of a scheduled job.
        #
        # There is deliberately no --ignore-unfixed. An unfixed CRITICAL has to
        # become an entry in .ci/trivyignore.yaml carrying a reason and an
        # expiry, which is a visible line in a diff, and never a silent skip.
        #
        # --ignorefile is not optional: the YAML ignore file is experimental in
        # trivy and is loaded ONLY when its path is given, so without this flag
        # every waiver in that file is dead text.
        #
        # A failed vulnerability-database download exits non-zero here as well,
        # so a night on which nothing could be downloaded is a red run and never
        # a clean image.
        #
        # --image-src docker names the LOCAL store the step above filled, and
        # naming it ALONE is the point. trivy's default is
        # `docker,containerd,podman,remote`, so a missing local image falls
        # through to the remote client this change exists to stop using, and the
        # PROTOCOL_ERROR comes back wearing a green pull step. With `docker` the
        # only source, a pull that did not happen fails HERE, naming the image.
        env:
          # Trivy unpacks every layer of a multi-GB image. RUNNER_TEMP is on the
          # `work` volume the scale set sizes; the default $HOME/.cache/trivy is
          # on the container file system, which the kubelet caps with the pod's
          # ephemeral-storage limit and evicts the pod for exceeding.
          #
          # It is a STEP env and not a job env: the `runner` context is not
          # available in `jobs.<id>.env`, and a workflow that names it there is
          # rejected whole — an "Unrecognized named-value" that never runs.
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy
          # The same rule as the line above, for the same volume, and it became
          # load-bearing on the day --image-src docker did. Reading from the
          # daemon makes trivy `docker save` the WHOLE image into a temp file
          # first, and it takes that path from TMPDIR — which is UNSET in the
          # runner image, so the default is /tmp on the runner container's
          # writable layer, and that layer is what the pod's 10Gi
          # ephemeral-storage limit caps. hardware unpacks to 10.01 GB, so the
          # tar alone clears the limit and the kubelet evicts the pod — a
          # network flake traded for a guaranteed one. RUNNER_TEMP is on the
          # 20Gi `work` volume, which holds the tar and the database together.
          #
          # MEASURED, not assumed (2026-08-25, trivy 0.74.0 against a real
          # ghcr.io/gophersys/base): with TMPDIR set, peak usage under it was
          # 3.25 GB and it returned to 0 when the scan finished, so trivy both
          # honours the variable and cleans up after itself. That reading is a
          # FLOOR: it was taken on a daemon using the containerd snapshotter,
          # which exports compressed blobs, where dind's classic image store
          # exports the layers uncompressed.
          TMPDIR: ${{ runner.temp }}
        run: |
          trivy image \
            --image-src docker \
            --timeout 20m \
            --severity CRITICAL \
            --exit-code 1 \
            --ignorefile .ci/trivyignore.yaml \
            --ignore-policy .ci/trivy-ignore-policy.rego \
            ghcr.io/gophersys/${{ matrix.image }}:latest

  base-currency:
    timeout-minutes: 10
    runs-on: arc-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the registry still holds the digest UBUNTU_BASE_REF pins
        # A digest pin freezes the base OS until a bump merges, so a pull
        # request nobody opens means unpatched images that look current. This
        # step is the half that reports it, and it is why the pin and the
        # nightly ship together.
        run: bash ./ctl.sh base-currency

  notify:
    # This job runs whatever the 2 jobs above did — a job that ran only on
    # failure could not close the issue on a green night.
    #
    # !cancelled() and not always(), which is the stricter half of that pair. A
    # cancelled run reduces to a non-success verdict like any other, so under
    # always() a run a human stopped would file a red issue about itself; the
    # label is the whole mechanism for being read at 09:00 UTC, and a label that
    # carries noise stops being read. Nothing is lost on a real failure: a
    # failed job is not a cancelled one.
    if: ${{ !cancelled() }}
    needs: [scan, base-currency]
    timeout-minutes: 10
    runs-on: arc-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: reduce the verdict of the jobs above to this job's own status
        # GitHub scopes failure() in a step to the STEPS of its own job. This
        # job runs under !cancelled(), so its own steps succeed whatever the
        # scan did, and a notifier guarded by failure() would never fire. This
        # step fails when a needed job failed, which is what gives the 2 steps
        # below a status to read.
        run: |
          scan='${{ needs.scan.result }}'
          currency='${{ needs.base-currency.result }}'
          printf 'scan=%s base-currency=%s\n' "$scan" "$currency"
          [[ "$scan" == "success" && "$currency" == "success" ]]
      - name: file the failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # QUOTED, and it has to be. Both arguments carry ': ', and a PLAIN
        # scalar holding that is read as the start of a mapping value where a
        # mapping cannot start: the document is rejected, GitHub refuses the
        # whole workflow, and a workflow that never runs never fails.
        run: 'bash .ci/notify-failure.sh "image scan: ${{ needs.scan.result }}" "base-OS currency: ${{ needs.base-currency.result }}"'
      - name: close the issue on a green run
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .ci/notify-failure.sh --resolve
