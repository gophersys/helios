name: harness-upgrade-check

# ADR-0021 — watches upstream for newer harness releases and opens a PR bumping
# harnesses/versions.env when one appears. The bump PR runs `harness-conformance`, which proves
# the new version against the adapters; it is mergeable only when that gate is green. New harness
# release -> routine, gated, automated cadence.

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: detect + open bump PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for `npm view`)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect newer harness releases
        id: detect
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          source harnesses/versions.env
          # strictly-newer test via semver-aware sort
          is_newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          : > /tmp/body.md
          printf '%s\n\n' "Automated harness version bump (ADR-0021). Merges only when **harness-conformance** is green." >> /tmp/body.md
          changed=0

          latest_omp="$(npm view @oh-my-pi/pi-coding-agent version | tr -d '[:space:]')"
          if is_newer "$latest_omp" "$OMP_VERSION"; then
            sed -i "s/^OMP_VERSION=.*/OMP_VERSION=${latest_omp}/" harnesses/versions.env
            printf -- '- omp: `%s` -> `%s`\n' "$OMP_VERSION" "$latest_omp" >> /tmp/body.md; changed=1
          fi

          latest_codex="$(npm view @openai/codex version | tr -d '[:space:]')"
          if is_newer "$latest_codex" "$CODEX_VERSION"; then
            sed -i "s/^CODEX_VERSION=.*/CODEX_VERSION=${latest_codex}/" harnesses/versions.env
            printf -- '- codex: `%s` -> `%s`\n' "$CODEX_VERSION" "$latest_codex" >> /tmp/body.md; changed=1
          fi

          latest_claude="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable | tr -d '[:space:]')"
          if is_newer "$latest_claude" "$CLAUDE_CODE_VERSION"; then
            sed -i "s/^CLAUDE_CODE_VERSION=.*/CLAUDE_CODE_VERSION=${latest_claude}/" harnesses/versions.env
            printf -- '- claude: `%s` -> `%s`\n' "$CLAUDE_CODE_VERSION" "$latest_claude" >> /tmp/body.md; changed=1
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Open bump PR
        if: steps.detect.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          # Use a PAT (not the default GITHUB_TOKEN) so the opened PR triggers harness-conformance
          # — PRs opened by GITHUB_TOKEN do not trigger other workflows. Mateo provides this secret;
          # absent it, the action falls back to GITHUB_TOKEN and conformance must be re-run manually.
          token: ${{ secrets.HARNESS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/harness-version-bump
          delete-branch: true
          title: "chore(harnesses): bump pinned harness version(s)"
          commit-message: "chore(harnesses): bump pinned harness version(s)"
          body-path: /tmp/body.md
