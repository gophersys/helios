name: on-pr

on:
  # init/seed is the current working branch; main is the future integration target. A PR into
  # either runs the gate (the main-as-integration cutover is a tracked follow-up).
  pull_request:
    branches: [init/seed, main]

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # The minutes lane: lint/typecheck/test/leak/property/maintainability/vuln/sast/secretscan over
  # the affected projects. Runs inside ghcr.io/gophersys/base, where every linter + Go tool is
  # present, so a missing tool is a HARD FAIL (each ctl.sh verb require_cmds it → exit 127),
  # never a silent skip (ADR-0020 §enforcement).
  fast:
    name: affected-gate (fast)
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      # Job containers run as root (the GitHub Actions convention): the runner's file-command temp
      # files are host-runner-owned, so the image's non-root dev user EACCESes them. The Go gate
      # toolchain stays reachable — the image bakes it onto ENV PATH (uid-independent).
      options: --user root
    env:
      # Keep the dev-user layout even as root: the nvm/corepack caches live under /home/dev and
      # the image's ENV PATH carries the dev-homed tool dirs; root can write there.
      HOME: /home/dev
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT (the same secret harness-upgrade-check opens PRs with): the job's
          # GITHUB_TOKEN cannot clone the PRIVATE sibling submodules (libs / infrastructure /
          # .devcontainer) — checkout reuses this token for the recursive submodule fetch.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      # Job steps run as root while the checkout may be written under a different uid (the runner's)
      # — mark the workspace + submodules trusted so git/nx affected work (disposable CI container).
      - name: Trust the workspace checkout (git safe.directory)
        run: git config --global --add safe.directory '*'
      # node/yarn live behind nvm (profile-based, not on ENV PATH) — expose the pinned toolchain so
      # the nx workspace actually runs (without this, has_nx=false silently no-ops the gate).
      - name: Expose the image's node toolchain (nvm) on PATH
        run: |
          . "$NVM_DIR/nvm.sh" && nvm use --silent default
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Install workspace dependencies (yarn 4)
        run: yarn install --immutable
      - name: Run affected-gate (fast)
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: bash .ci/ctl.sh affected-gate-fast

  # The careful-orchestration lane: integration/load/lifecycle/bench-guard/cover-floor/mutate on
  # the REAL docker + k3d host (ADR-0020 dimension (d)/(e)). The base image carries docker-cli +
  # k3d + kind; the job starts the docker host and runs the real-substrate suites — mocks are not
  # an acceptable substitute (ADR-0016 §2). Absent here too is a hard fail, not a skip.
  substrate:
    name: affected-gate (substrate · real docker+k3d)
    # DEFERRED on GitHub-hosted runners: a privileged job container with the host docker socket +
    # nested k3d/kind does not run reliably on ubuntu-latest. Gated OFF by default; set the repo
    # variable EDEN_CI_SUBSTRATE=true once a CAPABLE runner exists (a self-hosted runner with docker,
    # or a runner image that supports privileged k3d) — then this lane runs the real-substrate suites.
    if: ${{ vars.EDEN_CI_SUBSTRATE == 'true' }}
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    needs: fast
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      # Privileged + the docker socket so the real daemon and k3d/kind clusters come up inside
      # the job (the careful-orchestration lane runs the substrate, it does not mock it). Runs as
      # root like every job container (the runner's file commands are host-runner-owned).
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock --user root
    env:
      # Keep the dev-user layout even as root: the nvm/corepack caches live under /home/dev and
      # the image's ENV PATH carries the dev-homed tool dirs; root can write there.
      HOME: /home/dev
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT (the same secret harness-upgrade-check opens PRs with): the job's
          # GITHUB_TOKEN cannot clone the PRIVATE sibling submodules (libs / infrastructure /
          # .devcontainer) — checkout reuses this token for the recursive submodule fetch.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      # Job steps run as root while the checkout may be written under a different uid (the runner's)
      # — mark the workspace + submodules trusted so git/nx affected work (disposable CI container).
      - name: Trust the workspace checkout (git safe.directory)
        run: git config --global --add safe.directory '*'
      # node/yarn live behind nvm (profile-based, not on ENV PATH) — expose the pinned toolchain so
      # the nx workspace actually runs (without this, has_nx=false silently no-ops the gate).
      - name: Expose the image's node toolchain (nvm) on PATH
        run: |
          . "$NVM_DIR/nvm.sh" && nvm use --silent default
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Install workspace dependencies (yarn 4)
        run: yarn install --immutable
      - name: Start docker host (if not already provided by the runner)
        run: |
          if ! docker info >/dev/null 2>&1; then
            (dockerd >/tmp/dockerd.log 2>&1 &)
            for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          fi
          docker version
          k3d version
          kind version
      - name: Run affected-gate (substrate)
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: bash .ci/ctl.sh affected-gate-substrate
