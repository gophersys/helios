name: on-pr

on:
  # main is the integration branch (renamed from init/seed at the 2026-08-09 cutover).
  pull_request:
    branches: [main]

concurrency:
  group: on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # The minutes lane: lint/typecheck/test/leak/property/maintainability/vuln/sast/secretscan over
  # the affected projects. The ARC runner is the canonical cloud devcontainer derivative, where every linter + Go tool is
  # present, so a missing tool is a HARD FAIL (each ctl.sh verb require_cmds it → exit 127),
  # never a silent skip (ADR-0020 §enforcement).
  fast:
    name: affected-gate (fast)
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT (the same secret harness-upgrade-check opens PRs with): the job's
          # GITHUB_TOKEN cannot clone the PRIVATE sibling submodules (libs / infrastructure /
          # .devcontainer) — checkout reuses this token for the recursive submodule fetch.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      # Keep git/nx robust across runner-image uid changes.
      - name: Trust the workspace checkout (git safe.directory)
        run: git config --global --add safe.directory '*'
      # The apps' gate verbs resolve sibling libs through the WORKSPACE go.work, which is
      # gitignored — regenerate it from the tracked curated module list (the same generator the
      # deploy image builds run).
      - name: Generate go.work (tracked generator over the gitignored file)
        run: bash scripts/gen-go-work.sh
      # node/yarn live behind nvm (profile-based, not on ENV PATH) — expose the pinned toolchain so
      # the nx workspace actually runs (without this, has_nx=false silently no-ops the gate).
      - name: Expose the image's node toolchain (nvm) on PATH
        run: |
          . "$NVM_DIR/nvm.sh" && nvm use --silent default
          node_bin="$(command -v node)"
          [ -n "$node_bin" ] || { echo "node did not resolve after nvm use — the image's nvm layout changed" >&2; exit 1; }
          dirname "$node_bin" >> "$GITHUB_PATH"
      - name: Install workspace dependencies (yarn 4)
        run: yarn install --immutable
      - name: Install the TypeScript-libs workspace dependencies (bun)
        run: cd libs/typescript && bun install --frozen-lockfile
      # The @eden/* package exports resolve through each lib's gitignored dist/ (built .js + .d.ts).
      # Locally dist exists from dev builds, but a fresh checkout has none — without this step every
      # affected TS lane (and the frontend, which consumes @eden/* via workspace:*) fails typecheck/
      # lint with error-typed imports. Dependency order: scale → theme → visualization/primitives.
      - name: Build the TypeScript libs (dist/ is gitignored; @eden/* exports resolve through it)
        run: |
          for lib in scale theme visualization primitives; do
            (cd "libs/typescript/$lib" && bash ./ctl.sh build)
          done
      # The graph must BUILD, and must hold no submodule test-fixture project, before any affected
      # lane tries to select work from it. `nx affected` already dies on a poisoned graph — that is
      # how gophersys/eden#14 surfaced BLOCKER-1 — but it dies with nx's generic message 787 commits
      # into a pointer bump, naming neither the submodule nor the remedy. This step names both, and
      # it is the holder of `.nxignore`: a glob there that silently stopped matching would restore
      # the defect class with nothing going red.
      - name: Guard the project graph (.nxignore holder)
        run: bash .ci/ctl.sh graph-guard
      - name: Run affected-gate (fast)
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: bash .ci/ctl.sh affected-gate-fast

  # The careful-orchestration lane: integration/load/lifecycle/bench-guard/cover-floor/mutate on
  # the REAL docker + k3d host (ADR-0020 dimension (d)/(e)). The base image carries docker-cli +
  # k3d + kind; the job starts the docker host and runs the real-substrate suites — mocks are not
  # an acceptable substitute (ADR-0016 §2). Absent here too is a hard fail, not a skip.
  substrate:
    name: affected-gate (substrate · real docker+k3d)
    # Runs on the org ARC fleet (dind), which supports the privileged job container + k3d/kind that
    # GitHub-hosted runners never did. Kept behind the EDEN_CI_SUBSTRATE repo variable (currently
    # true) as the operational kill-switch while the real-substrate suites bed in on arc-org.
    # Retained for deliberate reactivation after the base/cloud fast path is stable.
    # Routine PRs currently run only the fast lane; this avoids a second nested
    # job-container pull and its private dockerd startup on every change.
    if: ${{ false }}
    runs-on: arc-org  # the org ARC fleet (dind, scale-to-zero) — infrastructure/ owns the controller
    needs: fast
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: mateosegura
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      # Privileged so the job starts its OWN dockerd (dind-in-job) and k3d/kind clusters come up
      # inside it (the careful-orchestration lane runs the substrate, it does not mock it). Runs as
      # root like every job container (the runner's file commands are host-runner-owned).
      # NO host-socket mount: on arc-org the runner pod's docker lives in a dind sidecar (not at
      # /var/run/docker.sock on the "host"), and the privileged+socket-mount combination wedged the
      # job container at its first exec'd run step (runs 28850…/28898330978 hung on the trivial
      # safe.directory step; the identical image+step shape runs clean outside ARC). The "Start
      # docker host" step below brings up the in-job daemon.
      options: --privileged --user root
    env:
      # Keep the dev-user layout even as root: the nvm/corepack caches live under /home/dev and
      # the image's ENV PATH carries the dev-homed tool dirs; root can write there.
      HOME: /home/dev
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The org-scope PAT (the same secret harness-upgrade-check opens PRs with): the job's
          # GITHUB_TOKEN cannot clone the PRIVATE sibling submodules (libs / infrastructure /
          # .devcontainer) — checkout reuses this token for the recursive submodule fetch.
          token: ${{ secrets.HARNESS_BOT_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      # Job steps run as root while the checkout may be written under a different uid (the runner's)
      # — mark the workspace + submodules trusted so git/nx affected work (disposable CI container).
      - name: Trust the workspace checkout (git safe.directory)
        run: git config --global --add safe.directory '*'
      # The apps' gate verbs resolve sibling libs through the WORKSPACE go.work, which is
      # gitignored — regenerate it from the tracked curated module list (the same generator the
      # deploy image builds run).
      - name: Generate go.work (tracked generator over the gitignored file)
        run: bash scripts/gen-go-work.sh
      # node/yarn live behind nvm (profile-based, not on ENV PATH) — expose the pinned toolchain so
      # the nx workspace actually runs (without this, has_nx=false silently no-ops the gate).
      - name: Expose the image's node toolchain (nvm) on PATH
        run: |
          . "$NVM_DIR/nvm.sh" && nvm use --silent default
          node_bin="$(command -v node)"
          [ -n "$node_bin" ] || { echo "node did not resolve after nvm use — the image's nvm layout changed" >&2; exit 1; }
          dirname "$node_bin" >> "$GITHUB_PATH"
      - name: Install workspace dependencies (yarn 4)
        run: yarn install --immutable
      - name: Install the TypeScript-libs workspace dependencies (bun)
        run: cd libs/typescript && bun install --frozen-lockfile
      # Same reason as the fast lane: the gitignored dist/ must exist for @eden/* resolution.
      - name: Build the TypeScript libs (dist/ is gitignored; @eden/* exports resolve through it)
        run: |
          for lib in scale theme visualization primitives; do
            (cd "libs/typescript/$lib" && bash ./ctl.sh build)
          done
      - name: Start docker host (if not already provided by the runner)
        run: |
          if ! docker info >/dev/null 2>&1; then
            (dockerd >/tmp/dockerd.log 2>&1 &)
            for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          fi
          docker version
          k3d version
          kind version
      - name: Run affected-gate (substrate)
        env:
          NX_BASE: origin/${{ github.base_ref }}
        run: bash .ci/ctl.sh affected-gate-substrate
