# Re-render with `cictl generate`; the `cictl drift` gate fails on any hand-edit.
name: on-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: on-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Post-merge re-check: the pr-tier verbs over what the push changed.
  pr:
    name: pr tier (affected-gate-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/gophersys/base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: bash .ci/ctl.sh affected-gate-fast
        env:
          NX_BASE: origin/main~1
        run: bash .ci/ctl.sh affected-gate-fast
