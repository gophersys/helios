name: build-and-push

# Publishes the IDP image set (base + base-runner + flutter + zephyr + zephyr-devbox
# + cloud)
# to the GitHub Container Registry. Every image is built for linux/amd64 on every
# push to main. On semver tag pushes (v*) we also publish a :v<semver> tag.
# Flutter and zephyr consume base — and zephyr-devbox consumes zephyr — via
# BASE_TAG build-arg set to the commit short SHA so the child layer FROMs the
# freshly pushed parent.
#
# Every job reads back the manifest it just pushed, at the SHA tag it pushed
# rather than at :latest, so a concurrent run cannot make the assertion describe
# somebody else's image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Supersede an in-flight run for the same ref so a rapid second push doesn't run two
# expensive image builds in parallel.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: gophersys
  # 1 platform for every image in this workflow. There were 3 keys here, and the
  # 2 narrow ones each carried a measurement: the ARC nodes are amd64, and the 3
  # live zephyr-devbox pods sit on amd64 nodes. The wide one had no such
  # measurement. No arm64 consumer can be verified for any image
  # (gophersys/infrastructure docs/debt-register.md D42), and the arm64 base that
  # was published was an amd64 Ubuntu userland carrying aarch64 Go binaries.
  # This value must equal SANCTIONED_PLATFORMS in _ctl/lib.sh, and the
  # verify-published step in each job is what proves the registry agrees.
  PLATFORMS: linux/amd64

jobs:
  base:
    # A job with no limit inherits the GitHub default of 360 minutes. On a self-
    # hosted pool of 4 slots that is 6 hours of 1 slot held by a hung job, and
    # every other repository waits behind it. Sized from the measured runtime.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short: ${{ steps.sha.outputs.short }}
    env:
      # The tag the build below LOADS into the local docker image store, and the
      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: base:smoke
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        # The hosted runner ships ~14 GB free; a build of these large images exhausts it
        # ("No space left on device") on 1 platform as well as on 2. Reclaim ~25-30 GB of
        # preinstalled SDKs we never use, keeping docker/buildx intact.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short-sha
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: extract semver tag
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: build the image, load it locally, publish nothing yet
        # The gate has to run before the irreversible action. A push cannot be
        # undone and no job here rolls one back, so a smoke test placed after it
        # reports a broken image but cannot stop one reaching a consumer.
        # buildx loads this build into the local docker image store instead, the
        # step after it asserts the content, and only then does the publish step
        # ship the same build. The second build reads the cache this one writes,
        # so publishing costs a layer copy rather than a rebuild.
        #
        # `load: true` takes 1 platform: buildx writes a manifest LIST for 2 and
        # the image store holds a single image. That holds for as long as
        # PLATFORMS names 1 platform — read the arm64 note at the top of
        # _ctl/tests/publish-order.test.sh before widening it.
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          tags: ${{ env.SMOKE_REF }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
      - name: smoke test (native amd64)
        # The Dockerfile deliberately runs no --version checks: they could not
        # run while this image was cross-built under QEMU. This is where every
        # pin of base/Dockerfile is compared against what the image installed,
        # and where the gate toolchain is exercised on a real fixture.
        run: bash .ci/smoke.sh base ${{ env.SMOKE_REF }}
      - name: publish the image the smoke test passed
        # The same build definition as the load step above — same context, same
        # platform — so buildx resolves every layer from the cache that step
        # wrote and this one only uploads. It writes no cache of its own for
        # that reason.
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base:${{ steps.sha.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/base:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=gha,scope=base
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
        # make this describe somebody else's image.
        run: bash ./ctl.sh verify-published base ${{ steps.sha.outputs.short }}

  # The `+ runner` layer: base plus the GitHub Actions runner and nothing else.
  # It is the image the ARC pools run as their runner container, so the kubelet
  # pulls and caches it per node. See gophersys/infrastructure docs/ci-substrate.md.
  #
  # One Dockerfile (runner/) serves every parent. Adding `zephyr-runner` means
  # copying this job with BASE_IMAGE pointed at zephyr — never a new Dockerfile.
