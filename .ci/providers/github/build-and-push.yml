      # ref the smoke test then runs. It carries no registry on purpose: nothing
      # can pull it, so a load that did not happen fails the smoke step instead
      # of quietly asserting against the last image that was published.
      SMOKE_REF: base-runner:smoke
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        # buildx materializes the parent image before layering, so this job needs
        # the same headroom the parent build does.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
