            ${{ env.REGISTRY }}/${{ env.OWNER }}/base-runner:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base-runner:${{ needs.base.outputs.short }}
            ${{ steps.semver.outputs.tag != '' && format('{0}/{1}/base-runner:{2}', env.REGISTRY, env.OWNER, steps.semver.outputs.tag) || '' }}
          cache-from: type=gha,scope=base-runner
      - name: verify the published manifest
        # A push DECLARES a platform; this reads what the registry actually
        # holds. At the SHA tag, never at :latest, so a concurrent run cannot
