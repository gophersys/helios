name: weekly-bumps

# Asks every upstream in _build/upstreams.txt what it publishes now, and opens
# ONE pull request where anything moved.
#
# Nothing here merges and nothing here publishes an image. The run writes a
# branch and a pull request; validate, the review agent, build-smoke and a human
# decide whether it lands. A bump that merged itself would move the toolchain of
# every consuming project with no reader in between.
#
# Every sha256 it writes is the digest of the asset for the version the same run
# resolved, and _build/resolve-upstream.sh re-proves it through
# _build/fetch-verified.sh before it writes a line — so the defect this workflow
# exists to end, a version that moves while its digest stays, cannot reach the
# branch. A run that could not read even one upstream reports every mover AND
# every failure, writes nothing and exits non-zero, so a dead coordinate is
# never a quiet week.
#
# A scheduled run has no author watching it, so the last 2 steps turn a red into
# 1 labelled issue and a green into the closing of that same issue.
# _ctl/tests/scheduled-workflows.test.sh holds that shape in the pull request
# gate, keyed on the schedule trigger rather than on this file's name.
#
# It runs on arc-build, the homelab pool this repository's builds moved to. The
# resolution downloads every asset that moved, twice, and a hosted runner
# charged the account for the wait; the pool does not.

on:
  schedule:
    # 10:00 UTC on Monday, which is 03:00 MST — cron is UTC, and
    # America/Phoenix keeps no DST, so that local hour is the same one every
    # week of the year. It is 1 hour after the nightly scan's window, so the 2
    # scheduled runs of this repository never race for a runner, and a Monday
    # red arrives as 1 issue about bumps rather than 2 about nothing.
    - cron: "0 10 * * 1"
  workflow_dispatch:

# The notifier opens, comments on and closes 1 issue; the bump step pushes a
# branch and opens the pull request on it.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bump:
    # A job with no limit inherits the GitHub default of 360 minutes, and a hung
    # resolution would hold a slot for 6 hours.
    #
    # 45 minutes is sized on what the run actually downloads, which is not "a
    # handful of assets": every pin that MOVED is fetched twice, once to compute
    # the digest and once for the re-proof through fetch-verified.sh, and
    # flutter_linux_<version>-stable.tar.xz alone was 1 572 146 400 bytes on
    # 2026-08-17 — ~3.1 GB for that pin. Each asset is deleted as soon as its
    # digest is read, so the peak on disk is 1 asset and not their sum.
    #
    # That sizing is a CEILING measured on a hosted runner. arc-build reaches
    # the same upstreams over the homelab's link, and the first Monday on the
    # pool is what measures the real runtime.
    timeout-minutes: 45
    runs-on: arc-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: resolve every upstream and write the bumps
        id: resolve
        env:
          # Only the rate limit of the github API reads depends on this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The eden-manifest datasource reads gophersys/eden's harness pins
          # with this fine-grained PAT (contents:read on that one repository).
          # Absent, the resolver FAILS naming the pin and the secret — it never
          # reports the current value as current.
          EDEN_MANIFEST_READ: ${{ secrets.EDEN_MANIFEST_READ }}
        # --apply resolves every row of the table and edits every home of each
        # pin that moved. It writes no commit and calls no gh: this step ends
        # with a dirty worktree and a plan on disk, and the step below turns
        # that into a pull request.
        run: |
          bash _build/resolve-upstream.sh --apply > "${RUNNER_TEMP}/bumps.txt"
          cat "${RUNNER_TEMP}/bumps.txt"
          if grep -q '^branch: ' "${RUNNER_TEMP}/bumps.txt"; then
            printf 'moved=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'moved=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: open the one pull request
        if: ${{ steps.resolve.outputs.moved == 'true' }}
        env:
          # A PAT and not the workflow token, for one reason: GitHub starts no
          # workflow run for an event a GITHUB_TOKEN caused, so a bot pull
          # request used to arrive with NO checks until a human closed and
          # reopened it. Created by this PAT, the pull request fires
          # validate + review + build-smoke like any human's.
          GITHUB_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        # The identity is the machine that made the commit, because that is who
        # made it.
        #
        # --force and not --force-with-lease: a lease compares against a
        # remote-tracking ref, and a branch this run is creating has none, so the
        # lease fails on the first push of every week. The branch carries the
        # date and this workflow is its only writer, so the value a lease
        # protects does not exist here.
        run: |
          branch="$(awk '/^branch: / { print substr($0, 9); exit }' "${RUNNER_TEMP}/bumps.txt")"
          title="$(awk '/^title: / { print substr($0, 8); exit }' "${RUNNER_TEMP}/bumps.txt")"
          awk 'body { print } /^body:$/ { body = 1 }' "${RUNNER_TEMP}/bumps.txt" > "${RUNNER_TEMP}/body.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git commit --all --message "$title"
          git push --force origin "$branch"
          open_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$open_number" ]]; then
            gh pr edit "$open_number" --title "$title" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "${RUNNER_TEMP}/body.md"
          fi

      - name: say what a human still has to do
        if: ${{ steps.resolve.outputs.moved == 'true' }}
        # The pull request was created by BUMP_PR_TOKEN, so its checks fire on
        # their own. What remains human is the MERGE: every bump rides
        # validate + review + build-smoke, and a person reads them and merges.
        run: |
          printf 'the bump pull request is open and its checks are running\n'
          printf 'read the checks and the review, then merge — nothing merges itself\n'

  notify:
    # A SECOND job, and the reason is a job TIMEOUT. `if: failure()` on a step
    # of the bump job cannot fire when that job is cancelled for exceeding its
    # limit, so the shape this workflow had — 1 job, notifier steps inside it —
    # reported nothing on the one failure a 45-minute budget makes likely. This
    # is the nightly's shape, for the nightly's reason.
    #
    # !cancelled() and not always(), which is the stricter half of that pair: a
    # run a human stopped reduces to a non-success verdict like any other, and
    # under always() this job would file a red issue about that.
    if: ${{ !cancelled() }}
    needs: [bump]
    timeout-minutes: 10
    runs-on: arc-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: reduce the verdict of the job above to this job's own status
        # GitHub scopes failure() in a step to the STEPS of its own job. This
        # job runs under !cancelled(), so its own steps succeed whatever the
        # bump job did, and a notifier guarded by failure() would never fire.
        # This step fails when the bump job did not succeed — a timeout and a
        # cancellation of that job included — which is what gives the 2 steps
        # below a status to read.
        run: |
          bump='${{ needs.bump.result }}'
          printf 'bump=%s\n' "$bump"
          [[ "$bump" == "success" ]]
      - name: file the failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Its OWN label. A weekly failure filed under ci-nightly-red would
          # comment on the security scan's issue and read as the scan going red.
          ISSUE_LABEL: ci-weekly-red
        # QUOTED, and it has to be. The argument carries ': ', and a PLAIN
        # scalar holding that is read as the start of a mapping value where a
        # mapping cannot start: the document is rejected, GitHub refuses the
        # whole workflow, and a workflow that never runs never fails.
        run: 'bash .ci/notify-failure.sh "weekly upstream resolution: ${{ needs.bump.result }}" "the bump job log names every pin it could not read"'
      - name: close the issue on a green run
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LABEL: ci-weekly-red
        run: bash .ci/notify-failure.sh --resolve
