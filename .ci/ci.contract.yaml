# Eden CI contract for gophersys/libs — the single source of truth for this repo's CI.
# The .github/workflows/*.yml and .ci/providers/github/*.yml are GENERATED from THIS file by
# `cictl generate -C .`; never hand-edit them — `cictl drift` is the CI-on-CI gate that enforces it.
apiVersion: eden.ci/v1
repo: libs
kind: libraries
# The self-hosted pool. Its runner image IS ghcr.io/gophersys/base plus the Actions
# runner, so there is nothing to put in a container — and `image:` is rejected here
# for exactly that reason.
#
# This repo previously declared `image: ghcr.io/gophersys/base` with no runner at
# all, which generated `runs-on: ubuntu-latest` plus a container block that
# authenticated to a PRIVATE package with GITHUB_TOKEN. That returns 403, and it is
# why every run since 2026-06-15 failed at "Initialize containers".
runner:
  runsOn: arc-org
  container: false
languages:
  - go
  - typescript
tiers:
  # pr — the fast lane on every push: cheap gates over the affected projects, no real substrate.
  pr:
    verbs:
      # First, because a contract that no longer matches its generated workflows
      # makes every later result untrustworthy.
      - ci-drift
      - affected-gate-fast
    substrate: []
    timeoutMinutes: 15
  # merge — the careful-orchestration lane before merge: the real-substrate gates on docker+k3d+kind.
  merge:
    verbs:
      - affected-gate-substrate
    substrate:
      - docker
      - k3d
      - kind
      - postgres
    privileged: true
    timeoutMinutes: 30
  # nightly — the exhaustive lane on a schedule: the full per-lib gate plus the pinned-version audit.
  nightly:
    verbs:
      - gate-all
      - updatability
    substrate:
      - docker
      - k3d
      - kind
      - postgres
      - minio
      - nats
    privileged: true
    schedule: "0 6 * * *"
    timeoutMinutes: 90
providers:
  - github
toolMatrix:
  sources:
    - "**/go.mod"
    - "typescript/**/package.json"
