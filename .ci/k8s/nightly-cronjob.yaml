apiVersion: batch/v1
kind: CronJob
metadata:
  name: concord-ci-nightly
  namespace: devops
  labels:
    app.kubernetes.io/part-of: concord
    app.kubernetes.io/component: ci
    app.kubernetes.io/name: ci-nightly
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: concord
        app.kubernetes.io/component: ci
        app.kubernetes.io/name: ci-nightly
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: concord
            app.kubernetes.io/component: ci
            app.kubernetes.io/name: ci-nightly
        spec:
          restartPolicy: Never
          nodeSelector:
            concord.corekinect.com/workload: devops
          terminationGracePeriodSeconds: 30

          volumes:
            - name: docker-socket
              emptyDir: {}
            - name: dind-storage
              hostPath:
                path: /var/lib/concord/ci/docker
                type: DirectoryOrCreate
            - name: workspace
              emptyDir: {}
            - name: ssh-key
              secret:
                secretName: bitbucket-ssh-key
                defaultMode: 0400
                items:
                  - key: ssh-private-key
                    path: id_rsa
            - name: entrypoint
              configMap:
                name: ci-entrypoint
                defaultMode: 0755
            - name: ca-certs
              secret:
                secretName: corekinect-ca-certs
            - name: claude-credentials
              secret:
                secretName: claude-code-oauth
                optional: true
                defaultMode: 0600
                items:
                  - key: credentials.json
                    path: .credentials.json

          containers:
            # ── CI Runner ──────────────────────────────────────────
            - name: ci-runner
              image: containers.ad.corekinect.com/concord-devcontainer-base:latest
              imagePullPolicy: Always
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  # Install CoreKinect CA certs into system trust store
                  echo "[ci] Installing CA certificates..."
                  cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
                  update-ca-certificates >/dev/null 2>&1

                  # Wait for DinD sidecar
                  echo "[ci] Waiting for Docker daemon..."
                  until docker info >/dev/null 2>&1; do sleep 1; done

                  # Inject CA certs into DinD's trust store (Alpine-based)
                  echo "[ci] Injecting CA certs into Docker daemon..."
                  for cert in /opt/ca-certs/*.crt; do
                    docker cp "$cert" "$(hostname):/usr/local/share/ca-certificates/" 2>/dev/null || \
                    cat "$cert" >> /etc/ssl/certs/ca-certificates.crt 2>/dev/null || true
                  done

                  # Authenticate with Docker Hub (avoids 100 pull/6hr anonymous limit)
                  if [[ -n "${DOCKERHUB_USERNAME:-}" ]] && [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
                    echo "[ci] Logging into Docker Hub..."
                    echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin 2>&1
                  fi

                  # Clone repo
                  echo "[ci] Cloning ${BRANCH:-main}..."
                  export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no"
                  git clone --depth 1 --branch "${BRANCH:-main}" "${REPO_URL}" /workspace/concord
                  cd /workspace/concord
                  exec /opt/ci/entrypoint.sh
              envFrom:
                - configMapRef:
                    name: ci-config
                - secretRef:
                    name: ci-minio-upload
                    optional: true
              env:
                - name: CI
                  value: "true"
                - name: CI_PROVIDER
                  value: "kubernetes"
                - name: DOCKER_HOST
                  value: "unix:///var/run/docker.sock"
                - name: HOME
                  value: "/root"
                - name: DOCKERHUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: username
                      optional: true
                - name: DOCKERHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dockerhub-credentials
                      key: token
                      optional: true
              volumeMounts:
                - name: docker-socket
                  mountPath: /var/run
                - name: workspace
                  mountPath: /workspace
                - name: ssh-key
                  mountPath: /root/.ssh
                  readOnly: true
                - name: entrypoint
                  mountPath: /opt/ci
                  readOnly: true
                - name: ca-certs
                  mountPath: /opt/ca-certs
                  readOnly: true
                - name: claude-credentials
                  mountPath: /root/.claude
                  readOnly: true
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
                limits:
                  cpu: "6"
                  memory: 12Gi

            # ── Docker-in-Docker Sidecar ───────────────────────────
            - name: dind
              image: docker:27-dind
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Install CoreKinect CA certs before starting dockerd
                  cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
                  update-ca-certificates >/dev/null 2>&1
                  exec dockerd-entrypoint.sh \
                    --host unix:///var/run/docker.sock \
                    --storage-driver overlay2
              securityContext:
                privileged: true
              env:
                - name: DOCKER_TLS_CERTDIR
                  value: ""
              volumeMounts:
                - name: docker-socket
                  mountPath: /var/run
                - name: dind-storage
                  mountPath: /var/lib/docker
                - name: ca-certs
                  mountPath: /opt/ca-certs
                  readOnly: true
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              readinessProbe:
                exec:
                  command: ["docker", "info"]
                initialDelaySeconds: 3
                periodSeconds: 5
