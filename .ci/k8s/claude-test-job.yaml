apiVersion: batch/v1
kind: Job
metadata:
  name: claude-test
  namespace: devops
  labels:
    app.kubernetes.io/part-of: concord
    app.kubernetes.io/component: ci
    app.kubernetes.io/name: claude-test
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: concord
        app.kubernetes.io/component: ci
        app.kubernetes.io/name: claude-test
    spec:
      restartPolicy: Never
      nodeSelector:
        concord.corekinect.com/workload: devops
      terminationGracePeriodSeconds: 10

      volumes:
        - name: ca-certs
          secret:
            secretName: corekinect-ca-certs
        - name: claude-credentials
          secret:
            secretName: claude-code-oauth
            optional: true
            defaultMode: 0600
            items:
              - key: credentials.json
                path: .credentials.json

      containers:
        - name: test-runner
          image: containers.ad.corekinect.com/concord-devcontainer-base:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== Claude CLI Test Job ==="
              echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Node: $(hostname)"
              echo ""

              # Install CA certs
              echo "[1/5] Installing CA certificates..."
              cp /opt/ca-certs/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
              update-ca-certificates >/dev/null 2>&1
              echo "      done"

              # Install Claude Code CLI
              echo "[2/5] Installing Claude Code CLI..."
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -1
              CLAUDE_VERSION=$(claude --version 2>/dev/null || echo "unknown")
              echo "      version: $CLAUDE_VERSION"

              # Verify auth
              echo "[3/5] Checking authentication..."
              if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
                echo "      auth: CLAUDE_CODE_OAUTH_TOKEN (env var)"
              elif [[ -f /root/.claude/.credentials.json ]]; then
                echo "      auth: credentials.json (volume mount)"
              else
                echo "      ERROR: no auth available"
                exit 1
              fi

              # Run Claude
              echo "[4/5] Running Claude -p test..."
              RESULT=$(claude -p --output-format json --max-turns 1 \
                'Respond with ONLY this JSON: {"status":"ok","message":"Claude is working"}' \
                2>/dev/null)

              # Validate output
              echo "[5/5] Validating response..."
              STATUS=$(echo "$RESULT" | python3 -c "
              import json, sys, re
              try:
                  w = json.loads(sys.stdin.read())
                  t = w.get('result', '{}').strip()
                  fence = chr(96) * 3
                  if t.startswith(fence):
                      t = re.sub(r'^[^\n]*\n', '', t, count=1)
                      t = re.sub(r'\n[^\n]*$', '', t.rstrip())
                  r = json.loads(t)
                  print(r.get('status', 'unknown'))
              except Exception as e:
                  print(f'error: {e}')
              ")

              echo ""
              if [[ "$STATUS" == "ok" ]]; then
                echo "=== PASSED: Claude CLI works in K8s ==="
                COST=$(echo "$RESULT" | python3 -c "import json,sys; print(json.loads(sys.stdin.read()).get('total_cost_usd','?'))" 2>/dev/null || echo "?")
                echo "Cost: \$$COST"
              else
                echo "=== FAILED: Claude returned status=$STATUS ==="
                echo "Raw output:"
                echo "$RESULT" | head -5
                exit 1
              fi
          env:
            - name: HOME
              value: "/root"
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-code-oauth
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
          volumeMounts:
            - name: ca-certs
              mountPath: /opt/ca-certs
              readOnly: true
            - name: claude-credentials
              mountPath: /root/.claude
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
