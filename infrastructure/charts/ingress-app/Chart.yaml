apiVersion: v2
name: ingress-app
description: |
  Public-facing stateless app archetype. Mandatory Ingress + automatic
  TLS via cert-manager + security-headers middleware + rate-limit
  middleware + optional SSO gate. Otherwise equivalent to stateless-app.

type: application
version: 0.1.0
appVersion: 0.1.0
kubeVersion: ">=1.28.0-0"

maintainers:
  - name: Mateo Segura
    email: mateo.segura413@gmail.com

keywords:
  - ingress
  - public
  - tls
  - http
  - platform
  - gophersys

dependencies:
  - name: _common
    version: 0.1.0
    repository: file://../_common

annotations:
  platform.gophersys/archetype: ingress-app
  platform.gophersys/status: skeleton
