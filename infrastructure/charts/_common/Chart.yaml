apiVersion: v2
name: _common
description: |
  Shared Helm template helpers for the gophersys chart archetypes. Library
  chart — not installable on its own.

  Provides:
    - canonical label + selector helpers (platform.gophersys/* taxonomy)
    - pod + container security context (restricted PSS)
    - ExternalSecret emitter (values.secrets[] → ExternalSecret resources)
    - baseline NetworkPolicy (deny-all + DNS + same-ns + metrics scrape)
    - ServiceMonitor emitter
    - SLO recording-rules emitter
    - PodDisruptionBudget with archetype-aware defaults

type: library
version: 0.1.0
appVersion: 0.1.0

maintainers:
  - name: Mateo Segura
    email: mateo.segura413@gmail.com

keywords:
  - platform
  - library
  - gophersys
