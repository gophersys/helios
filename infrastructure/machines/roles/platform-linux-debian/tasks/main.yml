---
# roles/platform-linux-debian/tasks/main.yml
#
# Debian / Ubuntu family. Package installs via apt. Assumes Python 3 is
# already present (it is on every modern Debian base image).

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [platform, apt]

- name: Install base packages (always present)
  ansible.builtin.apt:
    name:
      - bash
      - zsh
      - curl
      - wget
      - ca-certificates
      - gnupg
      - git
      - jq
      - rsync
      - openssh-client
      - build-essential
      - pkg-config
      - python3
      - python3-pip
      - python3-venv
      - unzip
      - htop
      - tmux
      - vim
      - less
      - lsb-release
      - dnsutils
      - iputils-ping
    state: present
  tags: [platform, apt, packages]

- name: Install kubernetes-adjacent CLIs when host is a k8s role
  ansible.builtin.apt:
    name:
      - kubectl
      - helm
    state: present
  when: "'developer-kubernetes-operator' in (roles | default([]))"
  tags: [platform, apt, kubernetes]
  # apt has neither kubectl nor helm by default; adding the upstream repos is
  # a prerequisite. TODO: add apt_repository tasks for the upstream k8s and
  # helm repos before this task becomes effective.

- name: Ensure /etc/skel has a sane zshrc for new users
  ansible.builtin.copy:
    dest: /etc/skel/.zshrc
    mode: "0644"
    content: |
      # Generated by platform-linux-debian role. Edit per-user ~/.zshrc instead.
      export PATH="$HOME/.local/bin:$PATH"
      autoload -Uz compinit && compinit
  tags: [platform, shell]
