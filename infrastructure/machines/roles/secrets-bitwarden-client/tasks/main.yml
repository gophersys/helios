---
# roles/secrets-bitwarden-client/tasks/main.yml
#
# Installs the Bitwarden CLI (`bw`) and wires a non-interactive session
# bootstrap helper into the user's shell rc. The actual unlock is always
# operator-driven — we never persist a master password anywhere.

- name: Determine target platform
  ansible.builtin.set_fact:
    bw_target: "{{ ansible_os_family | lower }}"
  tags: [secrets, bitwarden]

# Linux family — install via npm global so the same pin works across
# Debian/Fedora. A native binary download is nicer long-term; this is fine
# for now because platform-linux-* already installs node.
- name: Install bw CLI via npm (Linux)
  ansible.builtin.command: npm install -g @bitwarden/cli
  args:
    creates: /usr/local/bin/bw
  when: ansible_os_family in ["Debian", "RedHat"]
  tags: [secrets, bitwarden]

- name: Install bw CLI via winget (Windows)
  ansible.windows.win_command: >
    winget install --exact --silent --accept-source-agreements --accept-package-agreements Bitwarden.CLI
  register: bw_winget
  changed_when: "'Successfully installed' in (bw_winget.stdout | default(''))"
  failed_when:
    - bw_winget.rc is defined and bw_winget.rc != 0
    - "'already installed' not in (bw_winget.stdout | default('')) | lower"
  when: ansible_os_family == "Windows"
  tags: [secrets, bitwarden]

- name: Drop bw session bootstrap into user's shell rc (POSIX hosts)
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED: bitwarden session bootstrap"
    block: |
      # Expose a helper that exports BW_SESSION on demand. Never store the
      # master password. Call `bw-session` to unlock interactively.
      bw-session() {
        local session
        session="$(command bw unlock --raw)" || return 1
        export BW_SESSION="$session"
      }
  when: ansible_os_family != "Windows"
  tags: [secrets, bitwarden, shell]

# TODO: Windows equivalent — drop a PowerShell profile helper that sets
# $env:BW_SESSION after running `bw unlock --raw`. Deferred until first
# Windows host is enrolled.
