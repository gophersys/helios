# identity.yaml — linux-server-bastion
#
# Bare-metal or cloud Linux server acting as a bastion host. Joined to the
# Tailscale mesh; exposes SSH via tailnet only, not public. Not a K8s node.
#
# Replace every "TODO:" with a real value before committing.

name: __HOST_NAME__
os: linux-debian
purpose: "TODO: e.g. bastion / SSH jumpbox for the prod cluster"
tailscale_hostname: __HOST_NAME__
status: planned
location: "TODO: e.g. oracle-phoenix"
owner: mateo.segura413@gmail.com

roles:
  - common
  - platform-linux-debian
  - networking-tailscale
  - secrets-bitwarden-client

# Hardware / cloud shape. Free-form; consumed by ansible host_vars.
hardware:
  provider: "TODO: oracle|aws|azure|bare-metal|hetzner"
  cpu_arch: "TODO: amd64|arm64"
  cpu_cores: 0
  memory_gb: 0
  disk_gb: 0

# Bastion-specific knobs.
bastion:
  ssh_port: 22
  fail2ban: true
  allowed_tailnet_tags:                  # which tailnet tags can SSH in
    - "tag:admin"
