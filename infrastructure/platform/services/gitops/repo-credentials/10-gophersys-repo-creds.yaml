# Argo CD's read credential for EVERY private repo in the gophersys org.
#
# WHY ORG-WIDE AND NOT PER-REPO
# Argo matches a `repo-creds` secret by URL PREFIX, so one entry covers every
# repository under the org — adding `gophersys/home`, or the next repo after it,
# needs no new secret and no cluster change. The previous arrangement was a
# hand-applied per-repository secret (`repo-infrastructure`), which meant a new
# repo was a manual `kubectl apply` that nothing in git recorded. That is a fix
# that has to be repeated, and it is exactly the kind of imperative state this
# repo exists to eliminate.
#
# The token is the same one that secret already carried; it was moved into the
# vault as `shared/github/argocd-repo` so the value has a source of truth outside
# the cluster. No new credential was minted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gophersys-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: gophersys-repo-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          # This label is what makes Argo read the secret at all. Without it the
          # secret is inert and every private repo fails with a 404 that looks
          # like the repo does not exist.
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/gophersys
        username: gophersys
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: shared/github/argocd-repo
