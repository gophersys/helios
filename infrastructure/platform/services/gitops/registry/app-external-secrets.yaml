# External Secrets Operator (ESO) — the mechanism that pulls secrets from the
# cloud Vaultwarden into the cluster declaratively. Only non-secret ExternalSecret
# CRs live in git; Vaultwarden stays the single source of truth.
#
# This Application deploys ONLY the operator. The bw-serve bridge + ClusterSecretStore
# + ExternalSecrets are separate (app-secrets-bridge.yaml; they depend on the
# out-of-band seed secret `bw-cli-credentials`, created by hand — see
# platform/core/secrets-operator/manifests/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.7.0
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is REQUIRED here and nowhere else by default. Its
      # largest resource is 660653 bytes (CustomResourceDefinition clustersecretstores.external-secrets.io),
      # and client-side apply stores the manifest in an annotation capped at
      # 262144 bytes. Measured 2026-08-11. See docs/debt-register.md D44.
      - ServerSideApply=true
