{{- if .Values.alertmanagerDiscordWebhook.enabled }}
# The Discord webhook URL for Alertmanager notifications.
#
# The URL is a credential (anyone who holds it can post to the channel), so it
# is NEVER in git and NEVER in a ConfigMap. The alertmanager receiver reads it
# with `webhook_url_file` from the mount this Secret backs
# (values-homelab.yaml: prometheus.alertmanager.extraSecretMounts).
#
# The vault item is `shared/discord/alerts-webhook`, URL in the NOTES field —
# the single-blob shape the `vaultwarden` ClusterSecretStore webhook provider
# returns ($.data.data[0].notes). One value, one key: this is the declarative
# case, unlike the 2-key grafana-admin login (docs/runtime-secrets.md).
#
# NAMING INVARIANT — no vault item name may be a prefix of another. The
# provider resolves by SEARCH and takes the first match. Verified 2026-08-24
# through bw-serve: `shared/discord` returns exactly 1 item. Do NOT create
# another item whose name starts with `shared/discord/alerts-webhook`.
#
# WHY NO TEMPLATE. Alertmanager v0.33.0 applies strings.TrimSpace to the file
# content (notify/discord/discord.go), so a trailing newline in the notes blob
# is harmless and a plain passthrough is correct — same reasoning as the
# buildkit-client-certs PEM passthrough in platform/services/ci/arc-runners/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: webhook-url
      remoteRef:
        key: shared/discord/alerts-webhook
{{- end }}
