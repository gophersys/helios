# cluster-proportional-autoscaler in linear mode, holding kube-system/coredns
# to nodesPerReplica 4 with a floor of 2. The params live in the args (the
# --default-params flag) rather than a ConfigMap: one file, one home, and the
# autoscaler writes its runtime ConfigMap itself on first run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-autoscaler
  namespace: kube-system
  labels:
    app: coredns-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coredns-autoscaler
  template:
    metadata:
      labels:
        app: coredns-autoscaler
    spec:
      serviceAccountName: coredns-autoscaler
      containers:
        - name: autoscaler
          # v1.9.0, pinned by digest so a tag re-point cannot change what holds
          # cluster-wide DNS capacity. Read 2026-08-18.
          image: registry.k8s.io/cpa/cluster-proportional-autoscaler:v1.9.0@sha256:8f3b4e4beb62a9a5ad1ff96712129996e614d1fe7c57739c9816545ecea6f8b6
          command:
            - /cluster-proportional-autoscaler
            - --namespace=kube-system
            - --configmap=coredns-autoscaler
            - --target=deployment/coredns
            - --default-params={"linear":{"nodesPerReplica":4,"min":2,"max":4}}
            - --logtostderr=true
            - --v=2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
