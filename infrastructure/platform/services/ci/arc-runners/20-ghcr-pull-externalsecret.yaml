# Registry credential for the runner pods' own images.
#
# The ARC pools run the .devcontainer images as their runner container, and
# those packages are private. The kubelet therefore needs a pull credential.
# One Secret here covers every image and every consuming repo, which is the
# whole reason the toolchain is the pod image rather than a workflow
# `container:` image — that path needs a per-(package, repository) grant that
# GitHub exposes only in its UI. See docs/ci-substrate.md.
#
# WHY A JOB CANNOT READ THIS
# imagePullSecrets are consumed by the kubelet, never mounted into the
# container, and the runner ServiceAccount is `*-gha-rs-no-permission` with no
# RBAC at all. A job would need `get secrets` in this namespace to reach it and
# it has none.
#
# The backing vault item is `shared/github/pat-godmode`, which is far broader
# than a pull credential needs to be. That is deliberate for now and tracked as
# debt D24 — replace it with a `read:packages`-only token when one exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "MateoSegura:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: shared/github/pat-godmode
