# NetworkPolicy floor for arc-runners — the cluster's single highest-privilege
# namespace (ephemeral privileged dind runner pods + the arc-github-app secret).
#
# Ingress: default-deny. Runners only make OUTBOUND connections (to GitHub, to
# ghcr, to the ARC controller); nothing in the cluster has any business dialing
# INTO a runner pod, and this blocks lateral movement toward the in-pod docker
# daemon from any other compromised workload.
#
# Egress: deliberately NOT restricted yet. Runner jobs legitimately reach
# GitHub, ghcr.io, package registries, Go proxy, apt, k3d image pulls, ... — a
# default-deny egress needs a curated allowlist to avoid breaking builds.
# Tracked as a follow-up in docs/debt-register.md (D13).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
