# cloudflared — the homelab's SOLE public internet edge (as deployed).
#
# This is a vendored, exact copy of the live Deployment in ns cloudflare-tunnel,
# committed so the edge is reproducible from git (it was hand-applied and had NO
# declarative source — a cluster rebuild had nothing to reinstall from, and the
# live spec had drifted from its own last-applied-configuration).
#
# The tunnel is a Cloudflare Zero-Trust "eden-home" *token* tunnel: the public
# hostnames, catch-all route (-> ingress-nginx:80) and Cloudflare Access (SSO)
# apps are configured in the CF dashboard, NOT here — that routing state is
# out-of-band by design (see docs/cluster-topology.md "Exposure model"). This
# manifest captures only the in-cluster workload.
#
# Adopt intentionally (this Application is registered with MANUAL sync — Argo
# will NOT touch the edge on its own):
#   argocd app sync cloudflared          # or: kubectl apply -f deployment.yaml
# Applying the vendored spec is a no-op rollout (identical pod template) and also
# refreshes the stale last-applied-configuration.
#
# TODO(follow-up): add resources.requests/limits (repo policy). Omitted here so
# the first adopt sync is a clean no-op; a rolling bump can add them after.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2                      # redundant outbound connections to CF's edge
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.1
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token      # imperative; see docs/runtime-secrets.md
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
