# ESO webhook store that queries the bw-serve bridge to Vaultwarden.
#
# Look up items BY NAME (not UUID): an ExternalSecret's remoteRef.key is the
# Vaultwarden item name (e.g. "shared/protonvpn/wireguard"). The search endpoint
# returns matches; jsonPath takes the first item's `notes` field (where this
# repo stores token/config secrets). Verified end-to-end against Vaultwarden
# 1.35.4 with bw CLI 2026.1.0 (2026-07-05).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden
spec:
  provider:
    webhook:
      url: "http://bw-serve.external-secrets.svc.cluster.local:8087/list/object/items?search={{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.data[0].notes"
