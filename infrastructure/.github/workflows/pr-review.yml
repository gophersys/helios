name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: arc-review
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gophersys/cictl/review@ac8eb06436478d2a05265a855243bbf9d5775d5a # merged PR #28
        with:
          pr: ${{ github.event.pull_request.number }}
          harness: codex
          model: default
          budget-usd: "25"
          max-rounds: "4"
          stream-store: none
