# Concord Platform ClusterRoles
# Maps to platform roles: ADMIN, MAINTAINER, DEVELOPER, OPERATOR
# Plus the service account role for the HTTP API.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: concord-super-admin
  labels:
    app.kubernetes.io/part-of: concord
    concord.corekinect.com/platform-role: admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: concord-namespace-admin
  labels:
    app.kubernetes.io/part-of: concord
    concord.corekinect.com/platform-role: maintainer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/portforward
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
      - serviceaccounts
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: concord-namespace-readonly
  labels:
    app.kubernetes.io/part-of: concord
    concord.corekinect.com/platform-role: developer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
      - serviceaccounts
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: concord-api-system-monitor
  labels:
    app.kubernetes.io/part-of: concord
    concord.corekinect.com/platform-role: service-account
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  # Read-only access to core resources (pods, services, configmaps, events, etc.)
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, events, serviceaccounts]
    verbs: [get, list, watch]
  # Secrets: read-only — the API reads K8s secrets for config but must not modify them
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # HIGH PRIVILEGE: pods/exec allows running commands inside any pod in bound namespaces.
  # Required by the platform's kubectl-exec feature (live pod shell from the UI).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # HIGH PRIVILEGE: pod delete allows the platform to restart pods on demand.
  # Required by the pod restart feature in the admin UI.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # Deployments: create/delete needed for manufacturing runners and validation jobs.
  # Scale needed for horizontal scaling from the admin UI.
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: ["apps"]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, delete, create]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, clusterroles, rolebindings, clusterrolebindings]
    verbs: [get, list]
  # ConfigMaps + services: allow patch for runtime config updates from the API
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [patch]
