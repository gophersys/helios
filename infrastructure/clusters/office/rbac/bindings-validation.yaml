# Validation namespace RoleBindings
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-admin-full
  namespace: validation
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-maintainer-full
  namespace: validation
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-maintainers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-viewer-readonly
  namespace: validation
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-readonly
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-viewers
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-developers
