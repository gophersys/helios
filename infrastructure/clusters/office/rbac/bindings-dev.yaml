# Dev namespace RoleBindings
# Open access — all roles get full admin.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-admin-full
  namespace: dev
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-developer-full
  namespace: dev
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-developers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concord-viewer-readonly
  namespace: dev
  labels:
    app.kubernetes.io/part-of: concord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-namespace-readonly
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: concord-viewers
