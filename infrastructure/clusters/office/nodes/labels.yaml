# Node labels for the office K3s cluster.
# Applied by bootstrap.sh using kubectl label.
#
# Label scheme:
#   concord.corekinect.com/workload=<primary>     — primary workload type (for simple nodeSelector)
#   concord.corekinect.com/workload-<type>=true    — all workload types (for nodeAffinity)
#
# The primary workload is the first item in the workloads list.
# Multi-role nodes get multiple workload-<type>=true labels.
#
# Workload types: platform, data, build, worker, edge

nodes:
  # ── Control plane (3x HA) ────────────────────────────────────
  - name: concordserver01
    workloads: [platform]

  - name: concordserver02
    workloads: [platform]

  - name: concordserver03
    workloads: [platform, data]

  # ── Agents (general workers) ─────────────────────────────────
  - name: concordagent01
    workloads: [platform, worker]

  - name: concordagent02
    workloads: [platform, worker]

  - name: concordagent03
    workloads: [data, worker]

  # ── Builders ─────────────────────────────────────────────────
  - name: concordproxy
    workloads: [build]

  - name: wanda
    workloads: [build]

  # ── Edge (ARM64 Verdin SoMs) ─────────────────────────────────
  - name: verdin-imx8mm-15005665
    workloads: [edge]
    labels:
      corekinect.com/mtib-revision: "1.2"
      corekinect.com/validation-product: alpha

  - name: verdin-imx8mm-15005700
    workloads: [edge]
    labels:
      corekinect.com/mtib-revision: "1.2"

  - name: verdin-imx8mm-15702161
    workloads: [edge]
    labels:
      corekinect.com/mtib-revision: "1.1"
