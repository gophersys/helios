# proxmox.mateosegura.com — tailnet-private (same model as argocd/torrent/s3).
# DNS-only A record: proxmox.mateosegura.com -> 10.168.0.240
#
# The 4 backend annotations are what makes the UI usable rather than merely
# reachable:
#   backend-protocol HTTPS   pveproxy speaks TLS on :8006 and nothing else.
#   proxy-ssl-verify off     that certificate is Proxmox's own self-signed one.
#   proxy-read/send-timeout  the noVNC and xterm.js consoles hold one websocket
#                            open for the whole session; the 60s default cuts an
#                            idle console every minute.
#   proxy-buffering off      the console and the task log stream incrementally.
# proxy-body-size 0 lets an ISO upload through the web UI reach the node instead
# of dying on nginx's 1m default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox
  namespace: proxmox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-homelab
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - proxmox.mateosegura.com
      secretName: proxmox-tls
  rules:
    - host: proxmox.mateosegura.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pve-00
                port:
                  number: 8006
