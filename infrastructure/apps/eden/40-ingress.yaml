# Eden web UI — tailnet-private (deploy design §1), same model as argocd/prowlarr:
#   DNS-only (grey-cloud) A record  eden.mateosegura.com -> 10.168.0.240 (nginx VIP)
#   reachable only over the Tailscale tailnet / home LAN. Cert via cert-manager
#   DNS-01 (letsencrypt-homelab) — only needs the Cloudflare TXT.
#
# ALL paths route to `frontend:8080`: the frontend image serves the SPA and
# reverse-proxies /gateway -> agentgateway and /platform -> platformgateway
# INTERNALLY, so the browser sees ONE same-origin surface (the backends emit no
# CORS + the eden_token cookie is SameSite=strict).
#
# The `frontend` Service is created LATER by the eden Helm chart promotion (see
# README "What the release pipeline promotes"). Until it lands, nginx 503s this
# host — expected during the backing-stack-first bring-up.
#
# SSE-safety: agent event streams flow browser -> nginx -> frontend-proxy ->
# agentgateway. The long read timeout + buffering-off keep the stream open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eden
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-frontend
    app.kubernetes.io/part-of: eden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-homelab
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - eden.mateosegura.com
      secretName: eden-tls
  rules:
    - host: eden.mateosegura.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
