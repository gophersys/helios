# Eden bootstrap ExternalSecret (deploy design §2). Materializes the OPTIONAL
# harness credentials from the cloud Vaultwarden (via the `vaultwarden`
# ClusterSecretStore + the bw-serve bridge) into the k8s Secret `eden-bootstrap`.
# The seed Job (08) reads this Secret and copies each present field into the
# app-Vault's eden/data/production; the fields are OPTIONAL — chat + login work
# without them, only live agent turns / the create-saga need them.
#
# remoteRef.key is the Vaultwarden ITEM NAME (looked up by name, not UUID). The
# store returns the item's `notes` blob (jsonPath $.data.data[0].notes — see
# platform/core/secrets-operator/manifests/clustersecretstore.yaml), so each
# Vaultwarden item below holds its single token value in the item's NOTES field.
# secretKey is the k8s Secret key the seed Job looks for.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eden-bootstrap
  namespace: eden
  labels:
    app.kubernetes.io/name: eden-bootstrap
    app.kubernetes.io/part-of: eden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden
    kind: ClusterSecretStore
  target:
    name: eden-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: setup-token
      remoteRef:
        key: "shared/eden/claude-setup-token"
    - secretKey: gh-token
      remoteRef:
        key: "shared/eden/forge-github-pat"
    - secretKey: openrouter-api-key
      remoteRef:
        key: "shared/eden/openrouter-api-key"
