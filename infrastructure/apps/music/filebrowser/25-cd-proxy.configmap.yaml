# Content-Disposition rewrite proxy. filebrowser (classic v2.31) sends only the
# RFC-5987 `filename*=utf-8''...` form. Safari (and some download managers) ignore
# that when there is no plain ASCII `filename=` fallback and save every download
# as literally "download". This tiny in-pod openresty proxy adds the ASCII
# fallback so downloads keep their real name, without touching cluster-wide
# ingress config. Traffic path: ingress -> Service(http) -> cd-proxy:8090 ->
# filebrowser:80.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-cd-proxy
  namespace: media
  labels:
    app: filebrowser
    app.kubernetes.io/part-of: music
data:
  nginx.conf: |
    worker_processes 1;
    error_log stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 8090;
        client_max_body_size 0;
        location / {
          proxy_pass http://127.0.0.1:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_buffering off;
          proxy_request_buffering off;
          # large media zips stream for a long time — don't cut them at the 60s default
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_connect_timeout 30s;
          header_filter_by_lua_block {
            local cd = ngx.header["Content-Disposition"]
            if cd then
              local enc = string.match(cd, "filename%*=[uU][tT][fF]%-8''([^;]+)")
              if enc and not string.find(cd, 'filename="', 1, true) then
                local dec = string.gsub(enc, "%%(%x%x)", function(h) return string.char(tonumber(h, 16)) end)
                local ascii = string.gsub(dec, "[^\032-\126]", "_")
                ascii = string.gsub(ascii, '["\\]', "_")
                ngx.header["Content-Disposition"] = "attachment; filename=\"" .. ascii .. "\"; filename*=utf-8''" .. enc
              end
            end
          }
        }
      }
    }
