# FlareSolverr: headless-Chrome proxy that solves Cloudflare challenges so Prowlarr
# can reach CF-protected trackers (1337x, LimeTorrents, EZTV, ...). Prowlarr points
# at it via an indexer-proxy tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
  labels: { app: flaresolverr, app.kubernetes.io/part-of: music }
spec:
  replicas: 1
  selector: { matchLabels: { app: flaresolverr } }
  template:
    metadata: { labels: { app: flaresolverr } }
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: TZ, value: America/Los_Angeles }
          ports:
            - { name: http, containerPort: 8191 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # Stays root: FlareSolverr runs headless Chrome with --no-sandbox, so
            # runAsNonRoot/readOnlyRootFilesystem would break it. Cap-drop + seccomp
            # are the safe hardening for a browser rendering untrusted CF pages.
