# home.mateosegura.com — the ONE public front door, behind Cloudflare Access
# (Google SSO). Goes through the CF tunnel like grafana, so NO tls: block
# (tunnel enters nginx on :80; a TLS section would 308-redirect-loop).
# Cloudflare terminates public TLS + enforces Google login at its edge.
#
# Out-of-band (Cloudflare console): add tunnel public hostname
#   home.mateosegura.com -> HTTP ingress-nginx-controller.ingress-nginx.svc:80
# then an Access self-hosted app for home.mateosegura.com (Google IdP, allow
# your email). The full procedure is docs/runbooks/expose-a-service.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: media
  annotations:
    # Real LE cert on :443 while the Cloudflare tunnel keeps using :80.
    # ssl-redirect MUST stay false: the tunnel connects on :80, and an
    # HTTP->HTTPS redirect there loops against cloudflared forever.
    cert-manager.io/cluster-issuer: letsencrypt-homelab
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [home.mateosegura.com]
      secretName: homepage-tls
  rules:
    - host: home.mateosegura.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
