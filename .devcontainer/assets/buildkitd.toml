debug = true

# CoreKinect container registry — HTTPS with internal CA
# CA certs are injected into the buildkit container by ctl.sh
[registry."containers.ad.corekinect.com"]
  http = false
  insecure = false

# Worker settings
[worker.oci]
  enabled = true
  platforms = ["linux/amd64", "linux/arm64"]

[worker.containerd]
  enabled = false

# SSL Configuration — buildkit reads CA bundle from here
[worker.oci.ssl]
  certs = ["/etc/ssl/certs/ca-certificates.crt"]