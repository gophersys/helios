name: fixture-matrix-unbounded

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# The LOUD direction. The `scan` job fans out over 6 images with no ceiling, so
# GitHub starts all 6 at once. On a GitHub-hosted runner that is somebody else's
# capacity and costs only money; on a homelab pool it is 6 pods that each unpack
# a multi-GB image onto a node's own filesystem, and the node runs out of disk
# before the scan finishes. The failure that follows is "No space left on
# device", which says nothing at all about the image the job was asked to judge.
#
# The bound is DELETED and its text is kept in a COMMENT — the trap. A reader
# that keys on the string finds `max-parallel` in this file and calls the job
# bounded, so the rule would pass on exactly the file it exists for.
#
# `bounded-sibling` carries the same matrix WITH its bound. It is here so the
# report can be watched to name the unbounded job and not its correct
# neighbour: a detector that reports both says nothing about which one to fix.

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: arc-build
    strategy:
      fail-fast: false
      # max-parallel: 3
      matrix:
        image: [alpha, beta, gamma, delta, epsilon, zeta]
    steps:
      - name: scan the image
        run: trivy image ghcr.io/gophersys/${{ matrix.image }}:latest

  bounded-sibling:
    runs-on: arc-build
    strategy:
      max-parallel: 2
      matrix:
        image: [alpha, beta]
    steps:
      - name: scan the image again
        run: trivy image ghcr.io/gophersys/${{ matrix.image }}:latest
