name: fixture-lax-trivy

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# This one notifies correctly and declares the permission it needs, so the
# notification detectors must stay quiet on it. Its trivy invocation breaks
# every clause of the severity gate at once:
#
#   --severity HIGH      CRITICAL is not gated, so the gate passes an image
#                        that carries a critical vulnerability
#   --ignore-unfixed     an unfixed CRITICAL is skipped silently, with no
#                        waiver, no reason and no expiry
#   --exit-code 0        trivy reports and the step still succeeds, so the
#                        whole scan is a log line nobody reads
#   no --ignorefile      the YAML waiver file is EXPERIMENTAL in trivy and is
#                        loaded only when its path is named, so every waiver in
#                        it is dead text

on:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the published image
        run: |
          trivy image --severity HIGH --ignore-unfixed --exit-code 0 \
            ghcr.io/gophersys/base:latest
      - name: File the failure
        if: ${{ failure() }}
        run: bash .ci/notify-failure.sh "the nightly scan failed"
