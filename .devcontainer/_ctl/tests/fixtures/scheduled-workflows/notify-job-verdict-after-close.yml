name: fixture-notify-job-verdict-after-close

# A FIXTURE, not a workflow. See good-nightly.yml.
#
# THE DEFECT: the reduction step is present, complete and correct, and it runs
# LAST.
#
# Steps run in file order. The closing step is guarded by success(), and until
# the reduction step runs the job has no failure in it, so success() is TRUE.
# The issue that reports the red night is therefore closed FIRST, and the
# reduction step then turns the job red — which files a new issue on the next
# red night and closes it again the same way. The issue flaps, and the morning
# reader sees a closed issue.
#
# The rule is about ORDER, not presence, and this file is why.

on:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan the image
        run: trivy image --severity CRITICAL --exit-code 1 --ignorefile .ci/trivyignore.yaml ghcr.io/gophersys/base:latest

  base-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the registry still holds the pinned digest
        run: bash ./ctl.sh base-currency

  notify:
    if: ${{ always() }}
    needs: [scan, base-currency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: close the issue on a green run
        if: ${{ success() }}
        run: bash .ci/notify-failure.sh --resolve
      - name: file the failure
        if: ${{ failure() }}
        run: 'bash .ci/notify-failure.sh "the nightly went red"'
      - name: reduce the verdict of the jobs above to this job's own status
        run: |
          scan='${{ needs.scan.result }}'
          currency='${{ needs.base-currency.result }}'
          [[ "$scan" == "success" && "$currency" == "success" ]]
