# A manifest whose `platforms` key names a platform SANCTIONED_PLATFORMS does
# not hold. It is the stimulus for the 1 rule that makes the manifest unable to
# become the policy: an image may declare a measured NARROWER set, and it may
# never declare a wider one.
#
# `linux/riscv64` and not a near-miss spelling on purpose. It is an architecture
# no node of ours runs, no digest row in versions.env answers for, and no
# Dockerfile case arm has an arm for — so a manifest that could widen the set
# would send the build to a leg with an empty digest at every download.
#
# 2 images and not a copy of the real manifest: a fixture that tracked the real
# set would have to be edited whenever an image is added, and it would then be
# testing the set instead of the rule. The parent is here because
# `image_records` refuses a child written above its parent, and a refusal for
# the WRONG reason would read as this rule firing.
images:
  base:
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    paths:
      - base/
    groups:
      - content-base

  mobile:
    parent: base
    context: mobile
    dockerfile: mobile/Dockerfile
    smoke_ref: mobile:smoke
    platforms:
      - linux/amd64
      - linux/riscv64
    paths:
      - mobile/
    groups:
      - content-flutter
