# Image sources owned by Eden. Document order is build order.
images:
  base:
    enabled: true
    parent: ""
    context: "."
    dockerfile: base/Dockerfile
    smoke_ref: base:smoke
    paths:
      - base/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-base
      - go-gate
      - dockerfile-lint
      - compose

  cloud:
    enabled: true
    parent: ""
    context: "."
    dockerfile: cloud/Dockerfile
    smoke_ref: cloud:smoke
    paths:
      - cloud/
      - _delta/
      - _build/
      - versions.env
      - .dockerignore
    groups:
      - content-cloud
      - content-runner
      - go-gate
      - dockerfile-lint
      - compose
      - debugger
      - protocols
    size_budget_gb: 5.75
