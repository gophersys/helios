# The README's gate-failure example: a 240px plate asked to hold two dials
# whose widest value string cannot fit. `ui solve` must REFUSE this spec
# (rc=2) naming both parts, the two coordinates, and the shortfall — see
# README "What a gate failure looks like". test_readme_example.py holds the
# refusal stable; font.path is substituted per platform by the test fixture.

[panel]
name = "crowded"
width = 240
height = 80

[font]
path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
size = 16

[knob_rows.row]
plate_width = 224
dial = 28
tuck = 10
dial_floor = 2.5
label_floor = 2.5
anchor_tolerance = 2

[[knob_rows.row.units]]
name = "coarse"
center = 40
label = "Coarse"
widest = "-24.0 st"

[[knob_rows.row.units]]
name = "fine"
center = 78
label = "Fine"
widest = "999 Hz"
