site_name: Concord
site_url: https://docs.concord.local/
site_description: Continuous delivery platform for embedded systems
docs_dir: docs
site_dir: apps/frontend/docs/site

# Exclude internal and archived docs from the build
exclude_docs: |
  _internal/
  _archive/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - "navigation.tabs"
    - "navigation.tabs.sticky"
    - "navigation.indexes"
    - "navigation.instant"
    - "toc.follow"
    - "search.suggest"
    - "content.code.copy"

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - hooks/role_filter.py

plugins:
  - search
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths: [libs/python, libs/protocols, libs]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false
            heading_level: 2
            allow_inspection: true

extra:
  version:
    provider: mike

extra_javascript:
  - assets/js/external-links.js
  - assets/js/role-filter.js

