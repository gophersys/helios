site_name: Concord
site_description: Continuous delivery platform for embedded systems
docs_dir: docs
site_dir: apps/docs/site

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths: [libs/python, libs/protocols, libs]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false
            heading_level: 2
            allow_inspection: true

extra:
  version:
    provider: mike

extra_javascript:
  - assets/js/external-links.js

nav:
  - Home: index.md

  - Platform:
    - architecture/platform/index.md
    - System Architecture: architecture/platform/unified-platform.md
    - Products & Boards: architecture/platform/hardware-registry.md
    - Build System:
      - architecture/build/index.md
      - Build Service: architecture/build/build-service.md
      - Product Builds: architecture/build/product-build-system.md
      - Artifact Contract: architecture/build/artifact-contract.md
      - CI Pipeline: architecture/platform/ci-pipeline.md
    - Validation:
      - architecture/validation/index.md
      - Stages Overview: architecture/validation/stages-overview.md
      - System Design: architecture/validation/system.md
      - Test Runner: architecture/validation/test-runner.md
    - CoreCloud: architecture/platform/corecloud-library.md

  - API Reference:
    - api/index.md
    - Test Framework:
      - TestContext: api/test/context.md
      - CloudClient: api/test/cloud-client.md
      - UartDemuxer: api/test/uart-demuxer.md
      - PowerProfiler: api/test/power-profiler.md
      - StageAssets: api/test/stage-assets.md
      - DevicePersonalizer: api/test/device-personalizer.md
      - Reporter: api/test/reporter.md
      - POST: api/test/post.md
      - Telemetry: api/test/telemetry.md
      - Pytest Integration: api/test/pytest-integration.md
    - Stages & Errors:
      - Stages: api/stages.md
      - Errors: api/errors.md
    - CoreCloud:
      - Client: api/core-cloud/client.md
      - Models: api/core-cloud/models.md
